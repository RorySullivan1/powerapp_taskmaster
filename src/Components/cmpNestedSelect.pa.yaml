# cmpNestedSelect — cascading 1-3 level picker over a mapping_* table.
#
#   caption ........................... ✓      commit, top right
#   [ level 1 ] [ level 2 ] [ level 3 ]  + ✕   + opens a level, ✕ closes one
#
# Outputs SelectedPath (authoritative, composed from the picks) and SelectedId
# (the exact row, or 0 when the pick names a branch with no row of its own).
#
# Four things that will re-break it if changed without knowing why:
#   - Children of an auto-layout container default to flexible sizing, which makes
#     an explicit Width advisory. FillPortions 0 pins them.
#   - Layout formulas freeze into constants on paste, so this component's internal
#     geometry is integers only.
#   - nsLevels is never initialised; every read is Coalesce(nsLevels, Value(nsSeedDepth.Text)).
#   - Distinct() names its column Value, hence .Selected.Value.
#
# nsLevels is per INSTANCE: with AccessAppScope off, MS Learn states Set/Collect
# results "are scoped to the component instance". Two pickers on one screen do not
# share depth.
ComponentDefinitions:
  cmpNestedSelect:
    DefinitionType: CanvasComponent
    Description: Cascading 1-3 level picker over a mapping_* table. The user opens levels with +, closes with x, and commits at any depth.
    AccessAppScope: false
    CustomProperties:
      Terms:
        PropertyKind: Input
        Description: Rows of a mapping_* list. Schema {ID:Number, level1:Text, level2:Text, level3:Text, active:Boolean}. Pass a collection, not the list itself.
        DataType: Table
        Default: |
          =Table( { ID: 1, level1: "Example", level2: "", level3: "", active: true } )
      Caption:
        PropertyKind: Input
        Description: Field caption, shown top left with the commit tick opposite it.
        DataType: Text
        Default: ="Classification"
      DefaultPath:
        PropertyKind: Input
        Description: Stored path to show on open, e.g. "Campaign > Email". Empty for a fresh pick. Seeds each level in turn.
        DataType: Text
        Default: =""
      Separator:
        PropertyKind: Input
        Description: What joins the levels in a composed path. Change it here and both composition and seeding follow.
        DataType: Text
        Default: =" > "
      SelectedPath:
        PropertyKind: Output
        Description: The path the user has picked, at whatever depth. Empty until level 1 is chosen. THIS is the authoritative value.
        DataType: Text
      SelectedId:
        PropertyKind: Output
        Description: ID of the row the picked path names exactly, or 0 when it names a branch rather than a row.
        DataType: Number
      OnChange:
        PropertyKind: Event
        Description: Raised when the user commits with the tick. Read SelectedPath and SelectedId in the handler.
        ReturnType: Boolean
    Properties:
      Width: =760
      Height: =64
      Fill: =RGBA(0, 0, 0, 0)
      SelectedPath: |
        =If( IsBlank(cboL1.Selected.Value), "",
             cboL1.Selected.Value
             & If( Coalesce(nsLevels, Value(nsSeedDepth.Text)) >= 2 && !IsBlank(cboL2.Selected.Value),
                   cmpNestedSelect.Separator & cboL2.Selected.Value, "" )
             & If( Coalesce(nsLevels, Value(nsSeedDepth.Text)) >= 3 && !IsBlank(cboL3.Selected.Value),
                   cmpNestedSelect.Separator & cboL3.Selected.Value, "" ) )
      SelectedId: |
        =Coalesce(
           LookUp( cmpNestedSelect.Terms,
                   level1 = cboL1.Selected.Value
                   && Coalesce(level2, "") =
                      If( Coalesce(nsLevels, Value(nsSeedDepth.Text)) >= 2,
                          Coalesce(cboL2.Selected.Value, ""), "" )
                   && Coalesce(level3, "") =
                      If( Coalesce(nsLevels, Value(nsSeedDepth.Text)) >= 3,
                          Coalesce(cboL3.Selected.Value, ""), "" ) ).ID,
           0 )
    Children:
      - nsSeedDepth:
          Control: Label@2.5.1
          Properties:
            Visible: =false
            Text: |
              =If( IsBlank(cmpNestedSelect.DefaultPath), 1,
                   1 + ( Len(cmpNestedSelect.DefaultPath)
                         - Len(Substitute(cmpNestedSelect.DefaultPath, cmpNestedSelect.Separator, "")) )
                       / Len(cmpNestedSelect.Separator) )
            X: =0
            Y: =0
            Width: =1
            Height: =1
      - nsCaption:
          Control: Label@2.5.1
          Properties:
            Text: =cmpNestedSelect.Caption
            Font: =Font.'Segoe UI'
            Size: =12
            Color: =RGBA(110, 120, 130, 1)
            VerticalAlign: =VerticalAlign.Middle
            X: =0
            Y: =0
            Width: =732
            Height: =20
      - icoCommit:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: |
              =If( !IsBlank(cmpNestedSelect.DefaultPath)
                   && cmpNestedSelect.DefaultPath =
                      cboL1.Selected.Value
                      & If( Coalesce(nsLevels, Value(nsSeedDepth.Text)) >= 2 && !IsBlank(cboL2.Selected.Value),
                            cmpNestedSelect.Separator & cboL2.Selected.Value, "" )
                      & If( Coalesce(nsLevels, Value(nsSeedDepth.Text)) >= 3 && !IsBlank(cboL3.Selected.Value),
                            cmpNestedSelect.Separator & cboL3.Selected.Value, "" ),
                   Icon.CheckBadge, Icon.Check )
            Color: |
              =If( IsBlank(cboL1.Selected.Value), RGBA(190, 195, 200, 1), RGBA(0, 90, 158, 1) )
            DisplayMode: |
              =If( IsBlank(cboL1.Selected.Value), DisplayMode.Disabled, DisplayMode.Edit )
            Tooltip: ="Use this selection"
            X: =736
            Y: =0
            Width: =20
            Height: =20
            OnSelect: =cmpNestedSelect.OnChange()
      - nsRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            X: =0
            Y: =28
            Width: =760
            Height: =36
          Children:
            - cboL1:
                Control: ModernCombobox@1.1.1
                Properties:
                  Items: |
                    =Sort( Distinct( Filter(cmpNestedSelect.Terms, Coalesce(active, true)), level1 ), Value )
                  ItemDisplayText: =ThisItem.Value
                  DefaultSelectedItems: |
                    =Filter( Distinct( Filter(cmpNestedSelect.Terms, Coalesce(active, true)), level1 ),
                             cmpNestedSelect.DefaultPath = Value
                             || StartsWith( cmpNestedSelect.DefaultPath,
                                            Value & cmpNestedSelect.Separator ) )
                  SelectMultiple: =false
                  IsSearchable: =true
                  InputTextPlaceholder: ="Select…"
                  FillPortions: =0
                  LayoutMinWidth: =220
                  Width: =220
                  Height: =36
                  OnChange: =Reset(cboL2); Reset(cboL3)
            - cboL2:
                Control: ModernCombobox@1.1.1
                Properties:
                  Visible: =Coalesce(nsLevels, Value(nsSeedDepth.Text)) >= 2
                  Items: |
                    =Sort( Distinct( Filter( cmpNestedSelect.Terms,
                                             Coalesce(active, true) && level1 = cboL1.Selected.Value
                                             && !IsBlank(level2) ), level2 ), Value )
                  ItemDisplayText: =ThisItem.Value
                  DefaultSelectedItems: |
                    =Filter( Distinct( Filter( cmpNestedSelect.Terms,
                                               Coalesce(active, true) && level1 = cboL1.Selected.Value
                                               && !IsBlank(level2) ), level2 ),
                             cmpNestedSelect.DefaultPath
                               = cboL1.Selected.Value & cmpNestedSelect.Separator & Value
                             || StartsWith( cmpNestedSelect.DefaultPath,
                                            cboL1.Selected.Value & cmpNestedSelect.Separator
                                            & Value & cmpNestedSelect.Separator ) )
                  SelectMultiple: =false
                  IsSearchable: =true
                  InputTextPlaceholder: ="Select…"
                  FillPortions: =0
                  LayoutMinWidth: =220
                  Width: =220
                  Height: =36
                  OnChange: =Reset(cboL3)
            - cboL3:
                Control: ModernCombobox@1.1.1
                Properties:
                  Visible: =Coalesce(nsLevels, Value(nsSeedDepth.Text)) >= 3
                  Items: |
                    =Sort( Distinct( Filter( cmpNestedSelect.Terms,
                                             Coalesce(active, true) && level1 = cboL1.Selected.Value
                                             && level2 = cboL2.Selected.Value
                                             && !IsBlank(level3) ), level3 ), Value )
                  ItemDisplayText: =ThisItem.Value
                  DefaultSelectedItems: |
                    =Filter( Distinct( Filter( cmpNestedSelect.Terms,
                                               Coalesce(active, true) && level1 = cboL1.Selected.Value
                                               && level2 = cboL2.Selected.Value
                                               && !IsBlank(level3) ), level3 ),
                             cmpNestedSelect.DefaultPath
                               = cboL1.Selected.Value & cmpNestedSelect.Separator
                                 & cboL2.Selected.Value & cmpNestedSelect.Separator & Value )
                  SelectMultiple: =false
                  IsSearchable: =true
                  InputTextPlaceholder: ="Select…"
                  FillPortions: =0
                  LayoutMinWidth: =220
                  Width: =220
                  Height: =36
            - icoAddLevel:
                Control: Classic/Icon@2.5.0
                Properties:
                  Visible: |
                    =Coalesce(nsLevels, Value(nsSeedDepth.Text)) < 3
                     && If( Coalesce(nsLevels, Value(nsSeedDepth.Text)) = 1,
                            !IsBlank(cboL1.Selected.Value)
                            && CountRows( Filter( cmpNestedSelect.Terms,
                                                  Coalesce(active, true) && level1 = cboL1.Selected.Value
                                                  && !IsBlank(level2) ) ) > 0,
                            !IsBlank(cboL2.Selected.Value)
                            && CountRows( Filter( cmpNestedSelect.Terms,
                                                  Coalesce(active, true) && level1 = cboL1.Selected.Value
                                                  && level2 = cboL2.Selected.Value
                                                  && !IsBlank(level3) ) ) > 0 )
                  Icon: =Icon.Add
                  Color: =RGBA(0, 90, 158, 1)
                  Tooltip: ="Narrow it down a level"
                  FillPortions: =0
                  LayoutMinWidth: =24
                  Width: =24
                  Height: =24
                  OnSelect: =Set( nsLevels, Coalesce(nsLevels, Value(nsSeedDepth.Text)) + 1 )
            - icoDropLevel:
                Control: Classic/Icon@2.5.0
                Properties:
                  Visible: =Coalesce(nsLevels, Value(nsSeedDepth.Text)) > 1
                  Icon: =Icon.Cancel
                  Color: =RGBA(110, 120, 130, 1)
                  Tooltip: ="Close the last level"
                  FillPortions: =0
                  LayoutMinWidth: =24
                  Width: =24
                  Height: =24
                  OnSelect: =Set( nsLevels, Coalesce(nsLevels, Value(nsSeedDepth.Text)) - 1 )
