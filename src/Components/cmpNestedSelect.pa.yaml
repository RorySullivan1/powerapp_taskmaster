# =============================================================================
# cmpNestedSelect — cascading picker over a mapping_* table (up to 3 levels)
# =============================================================================
# Drives the classification columns added in schema v3.0.0 (C11). One instance
# per column: pass it the mapping list's rows, get back the path the user chose
# and, when that path names an exact row, that row's ID.
#
# HOW IT READS: a dropdown. Pick a value and — only if terms exist beneath it —
# the next dropdown appears below. Commit at whatever depth you reached.
#
# ---------------------------------------------------------------------------
# ANY DEPTH IS A VALID ANSWER (revised 2026-08-05).
#
# The first version required the chosen combination to match a row exactly, and
# disabled the commit button otherwise. That made a vocabulary seeded as one row
# per FULL path unusable above the leaf: with `Campaign > Email` on file but no
# bare `Campaign` row, level 1 could never be committed.
#
# So the PATH is the authoritative answer and is composed from what the user
# actually picked. `SelectedId` is the exact row when one exists and 0 when the
# pick names a branch rather than a row — which is why the consuming `_id`
# columns are optional, while `_path` is not. Filtering still works at every
# depth, because StartsWith() on the stored path is what drill-down uses.
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# IT HOLDS NO STATE, AND THAT IS THE WHOLE DESIGN.
#
# The three comboboxes ARE the state — each level reads the selection above it.
# Nothing is written to a variable at any point.
#
# That is a correctness requirement, not tidiness. `scrProjectEdit` carries TWO
# instances (region and type). A component cannot hold a context variable, so
# internal state would have to be a GLOBAL, and the two instances would then
# overwrite each other's picks. Any edit that reaches for `Set()` in here brings
# that bug back.
# ---------------------------------------------------------------------------
#
# SIZING: the root container stretches its children, and NO child sets a Width.
# The first version gave each combobox a fixed 412 to sit three-across, which
# clipped the moment the instance was narrower than the 1318 it was authored
# against. Stretch has nothing to freeze and nothing to cut off — the levels
# stack down the column instead of across it, so only the component's own width
# matters and it is the consumer's to set.
#
# `Height` must fit all four rows, because a canvas component cannot size itself
# to its content. Levels that are not showing leave blank space; that is the
# trade for never clipping.
#
# SEEDING uses StartsWith rather than Split(): a stored path seeds level 1 when
# it equals that level's value or begins with it followed by the separator. That
# avoids depending on the column name Split() returns, which differs between
# Power Fx versions and has never been confirmed against this tenant.
#
# Grounded tokens only: Label@2.5.1, ModernCombobox@1.0.0, ModernButton@1.0.0,
# GroupContainer@1.5.0 (AutoLayout). `Distinct()` returns a single-column table
# whose column is named `Value` — first-party documented, hence `.Selected.Value`.
# =============================================================================
ComponentDefinitions:
  cmpNestedSelect:
    DefinitionType: CanvasComponent
    Description: Cascading 1-3 level picker over a mapping_* table. Commits at any depth; outputs the chosen path and, when it names an exact row, that row's ID.
    AccessAppScope: false
    CustomProperties:
      Terms:
        PropertyKind: Input
        Description: Rows of a mapping_* list. Schema {ID:Number, level1:Text, level2:Text, level3:Text, active:Boolean}. Pass a collection, not the list itself.
        DataType: Table
        Default: |
          =Table( { ID: 1, level1: "Example", level2: "", level3: "", active: true } )
      Caption:
        PropertyKind: Input
        Description: Field caption shown above the dropdowns.
        DataType: Text
        Default: ="Classification"
      DefaultPath:
        PropertyKind: Input
        Description: Stored path to show on open, e.g. "Campaign > Email". Empty for a fresh pick. Seeds each level in turn.
        DataType: Text
        Default: =""
      Separator:
        PropertyKind: Input
        Description: What joins the levels in a composed path. Change it here and both composition and seeding follow.
        DataType: Text
        Default: =" > "
      SelectedPath:
        PropertyKind: Output
        Description: The path the user has picked, at whatever depth. Empty until level 1 is chosen. THIS is the authoritative value.
        DataType: Text
      SelectedId:
        PropertyKind: Output
        Description: ID of the row the picked path names exactly, or 0 when it names a branch rather than a row.
        DataType: Number
      OnChange:
        PropertyKind: Event
        Description: Raised when the user commits. Read SelectedPath and SelectedId in the handler.
        ReturnType: Boolean
    Properties:
      Width: =1318
      # 16 caption + 3x36 dropdowns + 36 commit + 4x8 gaps. A component cannot
      # size itself to content, so this fits the deepest case.
      Height: =192
      Fill: =RGBA(0, 0, 0, 0)
      # Composed from the PICKS, not from a matched row — that is what lets a
      # user stop at level 1 or 2.
      SelectedPath: |
        =If( IsBlank(cboL1.Selected.Value), "",
             cboL1.Selected.Value
             & If( IsBlank(cboL2.Selected.Value), "", cmpNestedSelect.Separator & cboL2.Selected.Value )
             & If( IsBlank(cboL3.Selected.Value), "", cmpNestedSelect.Separator & cboL3.Selected.Value ) )
      # Coalesce on both sides so a blank level matches a blank column: a term
      # that genuinely stops at level 1 resolves to its own row and gets an ID.
      SelectedId: |
        =Coalesce(
           LookUp( cmpNestedSelect.Terms,
                   level1 = cboL1.Selected.Value
                   && Coalesce(level2, "") = Coalesce(cboL2.Selected.Value, "")
                   && Coalesce(level3, "") = Coalesce(cboL3.Selected.Value, "") ).ID,
           0 )
    Children:
      - nsRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            # Stretch is what makes every child fill the component's width with
            # no Width formula of its own — nothing to freeze, nothing to clip.
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =8
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - nsCaption:
                Control: Label@2.5.1
                Properties:
                  Text: =cmpNestedSelect.Caption
                  Font: =Font.'Segoe UI'
                  Size: =12
                  Color: =RGBA(110, 120, 130, 1)
                  Height: =16
            # LEVEL 1 — always visible. Distinct() gives one row per family.
            - cboL1:
                Control: ModernCombobox@1.0.0
                Properties:
                  Items: |
                    =Sort( Distinct( Filter(cmpNestedSelect.Terms, active), level1 ), Value )
                  ItemDisplayText: =ThisItem.Value
                  # Seeds from the stored path: this level's value either IS the
                  # whole path, or the path continues past it with the separator.
                  DefaultSelectedItems: |
                    =Filter( Distinct( Filter(cmpNestedSelect.Terms, active), level1 ),
                             cmpNestedSelect.DefaultPath = Value
                             || StartsWith( cmpNestedSelect.DefaultPath,
                                            Value & cmpNestedSelect.Separator ) )
                  SelectMultiple: =false
                  IsSearchable: =true
                  InputTextPlaceholder: ="Select…"
                  Height: =36
                  # Changing a level invalidates everything below it. Without this
                  # the box below keeps showing a value from the previous branch.
                  OnChange: =Reset(cboL2); Reset(cboL3)
            # LEVEL 2 — appears only if terms exist beneath the level-1 pick.
            # Visibility recomputes the count rather than reading cboL2.Items:
            # a control's Items is WRITE-ONLY and reading it is an error.
            - cboL2:
                Control: ModernCombobox@1.0.0
                Properties:
                  Visible: |
                    =!IsBlank(cboL1.Selected.Value)
                     && CountRows( Filter( cmpNestedSelect.Terms,
                                           active && level1 = cboL1.Selected.Value
                                           && !IsBlank(level2) ) ) > 0
                  Items: |
                    =Sort( Distinct( Filter( cmpNestedSelect.Terms,
                                             active && level1 = cboL1.Selected.Value
                                             && !IsBlank(level2) ), level2 ), Value )
                  ItemDisplayText: =ThisItem.Value
                  DefaultSelectedItems: |
                    =Filter( Distinct( Filter( cmpNestedSelect.Terms,
                                               active && level1 = cboL1.Selected.Value
                                               && !IsBlank(level2) ), level2 ),
                             cmpNestedSelect.DefaultPath
                               = cboL1.Selected.Value & cmpNestedSelect.Separator & Value
                             || StartsWith( cmpNestedSelect.DefaultPath,
                                            cboL1.Selected.Value & cmpNestedSelect.Separator
                                            & Value & cmpNestedSelect.Separator ) )
                  SelectMultiple: =false
                  IsSearchable: =true
                  InputTextPlaceholder: ="Select… (optional)"
                  Height: =36
                  OnChange: =Reset(cboL3)
            # LEVEL 3 — same rule one level down. Nothing sits below it, so the
            # seed is an equality test rather than a prefix test.
            - cboL3:
                Control: ModernCombobox@1.0.0
                Properties:
                  Visible: |
                    =!IsBlank(cboL2.Selected.Value)
                     && CountRows( Filter( cmpNestedSelect.Terms,
                                           active && level1 = cboL1.Selected.Value
                                           && level2 = cboL2.Selected.Value
                                           && !IsBlank(level3) ) ) > 0
                  Items: |
                    =Sort( Distinct( Filter( cmpNestedSelect.Terms,
                                             active && level1 = cboL1.Selected.Value
                                             && level2 = cboL2.Selected.Value
                                             && !IsBlank(level3) ), level3 ), Value )
                  ItemDisplayText: =ThisItem.Value
                  DefaultSelectedItems: |
                    =Filter( Distinct( Filter( cmpNestedSelect.Terms,
                                               active && level1 = cboL1.Selected.Value
                                               && level2 = cboL2.Selected.Value
                                               && !IsBlank(level3) ), level3 ),
                             cmpNestedSelect.DefaultPath
                               = cboL1.Selected.Value & cmpNestedSelect.Separator
                                 & cboL2.Selected.Value & cmpNestedSelect.Separator & Value )
                  SelectMultiple: =false
                  IsSearchable: =true
                  InputTextPlaceholder: ="Select… (optional)"
                  Height: =36
            # COMMIT — enabled as soon as level 1 is chosen. Depth is the user's
            # decision, not the vocabulary's.
            - btnNsCommit:
                Control: ModernButton@1.0.0
                Properties:
                  Text: |
                    =If( IsBlank(cboL1.Selected.Value), "Pick a value",
                         "✓  Use  " & cboL1.Selected.Value
                         & If( IsBlank(cboL2.Selected.Value), "", cmpNestedSelect.Separator & cboL2.Selected.Value )
                         & If( IsBlank(cboL3.Selected.Value), "", cmpNestedSelect.Separator & cboL3.Selected.Value ) )
                  Appearance: =ButtonAppearance.Primary
                  DisplayMode: |
                    =If( IsBlank(cboL1.Selected.Value), DisplayMode.Disabled, DisplayMode.Edit )
                  Height: =36
                  OnSelect: =cmpNestedSelect.OnChange()
