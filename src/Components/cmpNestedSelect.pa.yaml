# Every pick raises OnChange immediately, so a selection IS the acceptance — the consumer writes
# on each change and a user can never leave a chosen value unrecorded by forgetting a second
# click.
# Four things that will re-break it if changed without knowing why: - Children of an auto-layout
# container default to flexible sizing, which makes an explicit Width advisory.
# - Layout formulas freeze into constants on paste, so this component's internal geometry is
# integers only.
# - nsLevels is never initialised, so every read is Coalesce(nsLevels, <seed depth>), and the
# seed depth is CountRows(Split(DefaultPath, Separator)) — computed as a number.
# It used to be parked in a hidden Label's Text and read back with Value(); that round trip
# through text is what raised "cannot be converted to a number".
# Two pickers on one screen do not share depth.
ComponentDefinitions:
  cmpNestedSelect:
    DefinitionType: CanvasComponent
    Description: Cascading 1-3 level picker over a mapping_* table. The user opens levels with + and closes them with x; every change is raised immediately, so a selection at any depth is a complete answer.
    AccessAppScope: false
    CustomProperties:
      Terms:
        PropertyKind: Input
        Description: Rows of a mapping_* list. Schema {ID:Number, level1:Text, level2:Text, level3:Text} — these four and nothing else. Pass a collection, not the list itself.
        DataType: Table
        Default: |
          =Table( { ID: 1, level1: "Example", level2: "", level3: "" } )
      Caption:
        PropertyKind: Input
        Description: Field caption, shown above the row of combo boxes.
        DataType: Text
        Default: ="Classification"
      DefaultPath:
        PropertyKind: Input
        Description: Stored path to show on open, e.g. "Campaign | Email". Empty for a fresh pick. Seeds each level in turn. Must use the same Separator it was written with.
        DataType: Text
        Default: =""
      Separator:
        PropertyKind: Input
        Description: What joins the levels in a composed path, e.g. "EMEA | UK | London". Change it here and both composition and seeding follow — but any path ALREADY STORED with the old separator stops matching on seed.
        DataType: Text
        Default: =" | "
      SelectedPath:
        PropertyKind: Output
        Description: The path the user has picked, at whatever depth. Empty until level 1 is chosen. THIS is the authoritative value.
        DataType: Text
      SelectedId:
        PropertyKind: Output
        Description: ID of the row the picked path names exactly, or 0 when it names a branch rather than a row.
        DataType: Number
      OnChange:
        PropertyKind: Event
        Description: Raised on EVERY change — each combo box pick, and the + / x that open and close a level. There is no commit step. Read SelectedPath and SelectedId in the handler.
        ReturnType: Boolean
    Properties:
      Width: =760
      Height: =64
      Fill: =RGBA(0, 0, 0, 0)
      OnReset: |
        =Set( nsLevels, Blank() );
         Reset( cboL1 ); Reset( cboL2 ); Reset( cboL3 )
      SelectedPath: |
        =With( { depth: Coalesce( nsLevels,
                                  If( IsBlank(cmpNestedSelect.DefaultPath), 1,
                                      CountRows(Split(cmpNestedSelect.DefaultPath, cmpNestedSelect.Separator)) ) ) },
           If( IsBlank(cboL1.Selected.Value), "",
                cboL1.Selected.Value
                & If( depth >= 2 && !IsBlank(cboL2.Selected.Value),
                      cmpNestedSelect.Separator & cboL2.Selected.Value, "" )
                & If( depth >= 3 && !IsBlank(cboL3.Selected.Value),
                      cmpNestedSelect.Separator & cboL3.Selected.Value, "" ) ) )
      SelectedId: |
        =With( { depth: Coalesce( nsLevels,
                                  If( IsBlank(cmpNestedSelect.DefaultPath), 1,
                                      CountRows(Split(cmpNestedSelect.DefaultPath, cmpNestedSelect.Separator)) ) ) },
           Coalesce(
             LookUp( cmpNestedSelect.Terms,
                     level1 = cboL1.Selected.Value
                     && Coalesce(level2, "") =
                        If( depth >= 2, Coalesce(cboL2.Selected.Value, ""), "" )
                     && Coalesce(level3, "") =
                        If( depth >= 3, Coalesce(cboL3.Selected.Value, ""), "" ) ).ID,
             0 ) )
    Children:
      - nsCaption:
          Control: Label@2.5.1
          Properties:
            Text: =cmpNestedSelect.Caption
            Font: =Font.'Segoe UI'
            Size: =12
            Color: =RGBA(110, 120, 130, 1)
            VerticalAlign: =VerticalAlign.Middle
            X: =0
            Y: =0
            Width: =760
            Height: =20
      - nsRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            X: =0
            Y: =28
            Width: =760
            Height: =36
          Children:
            - cboL1:
                Control: ModernCombobox@1.1.1
                Properties:
                  Items: |
                    =Sort( Distinct( cmpNestedSelect.Terms, level1 ), Value )
                  ItemDisplayText: =ThisItem.Value
                  DefaultSelectedItems: |
                    =Filter( Sort( Distinct( cmpNestedSelect.Terms, level1 ), Value ),
                             cmpNestedSelect.DefaultPath = Value
                             || StartsWith( cmpNestedSelect.DefaultPath,
                                            Value & cmpNestedSelect.Separator ) )
                  SelectMultiple: =false
                  IsSearchable: =true
                  InputTextPlaceholder: ="Select…"
                  FillPortions: =0
                  LayoutMinWidth: =220
                  Width: =220
                  Height: =36
                  OnChange: =Reset(cboL2); Reset(cboL3); cmpNestedSelect.OnChange()
            - cboL2:
                Control: ModernCombobox@1.1.1
                Properties:
                  Visible: |
                    =Coalesce( nsLevels,
                              If( IsBlank(cmpNestedSelect.DefaultPath), 1,
                                  CountRows(Split(cmpNestedSelect.DefaultPath, cmpNestedSelect.Separator)) ) ) >= 2
                  Items: |
                    =Sort( Distinct( Filter( cmpNestedSelect.Terms,
                                             level1 = cboL1.Selected.Value
                                             && !IsBlank(level2) ), level2 ), Value )
                  ItemDisplayText: =ThisItem.Value
                  DefaultSelectedItems: |
                    =Filter( Sort( Distinct( Filter( cmpNestedSelect.Terms,
                                               level1 = cboL1.Selected.Value
                                               && !IsBlank(level2) ), level2 ), Value ),
                             cmpNestedSelect.DefaultPath
                               = cboL1.Selected.Value & cmpNestedSelect.Separator & Value
                             || StartsWith( cmpNestedSelect.DefaultPath,
                                            cboL1.Selected.Value & cmpNestedSelect.Separator
                                            & Value & cmpNestedSelect.Separator ) )
                  SelectMultiple: =false
                  IsSearchable: =true
                  InputTextPlaceholder: ="Select…"
                  FillPortions: =0
                  LayoutMinWidth: =220
                  Width: =220
                  Height: =36
                  OnChange: =Reset(cboL3); cmpNestedSelect.OnChange()
            - cboL3:
                Control: ModernCombobox@1.1.1
                Properties:
                  Visible: |
                    =Coalesce( nsLevels,
                              If( IsBlank(cmpNestedSelect.DefaultPath), 1,
                                  CountRows(Split(cmpNestedSelect.DefaultPath, cmpNestedSelect.Separator)) ) ) >= 3
                  Items: |
                    =Sort( Distinct( Filter( cmpNestedSelect.Terms,
                                             level1 = cboL1.Selected.Value
                                             && level2 = cboL2.Selected.Value
                                             && !IsBlank(level3) ), level3 ), Value )
                  ItemDisplayText: =ThisItem.Value
                  DefaultSelectedItems: |
                    =Filter( Sort( Distinct( Filter( cmpNestedSelect.Terms,
                                               level1 = cboL1.Selected.Value
                                               && level2 = cboL2.Selected.Value
                                               && !IsBlank(level3) ), level3 ), Value ),
                             cmpNestedSelect.DefaultPath
                               = cboL1.Selected.Value & cmpNestedSelect.Separator
                                 & cboL2.Selected.Value & cmpNestedSelect.Separator & Value )
                  SelectMultiple: =false
                  IsSearchable: =true
                  InputTextPlaceholder: ="Select…"
                  FillPortions: =0
                  LayoutMinWidth: =220
                  Width: =220
                  Height: =36
                  OnChange: =cmpNestedSelect.OnChange()
            - icoAddLevel:
                Control: Classic/Icon@2.5.0
                Properties:
                  Visible: |
                    =With( { depth: Coalesce( nsLevels,
                              If( IsBlank(cmpNestedSelect.DefaultPath), 1,
                                  CountRows(Split(cmpNestedSelect.DefaultPath, cmpNestedSelect.Separator)) ) ) },
                       depth < 3
                       && If( depth = 1,
                              !IsBlank(cboL1.Selected.Value)
                              && CountRows( Filter( cmpNestedSelect.Terms,
                                                    level1 = cboL1.Selected.Value
                                                    && !IsBlank(level2) ) ) > 0,
                              !IsBlank(cboL2.Selected.Value)
                              && CountRows( Filter( cmpNestedSelect.Terms,
                                                    level1 = cboL1.Selected.Value
                                                    && level2 = cboL2.Selected.Value
                                                    && !IsBlank(level3) ) ) > 0 ) )
                  Icon: =Icon.Add
                  Color: =RGBA(0, 90, 158, 1)
                  Tooltip: ="Narrow it down a level"
                  FillPortions: =0
                  LayoutMinWidth: =24
                  Width: =24
                  Height: =24
                  OnSelect: |
                    =Set( nsLevels, Coalesce( nsLevels,
                              If( IsBlank(cmpNestedSelect.DefaultPath), 1,
                                  CountRows(Split(cmpNestedSelect.DefaultPath, cmpNestedSelect.Separator)) ) ) + 1 );
                     cmpNestedSelect.OnChange()
            - icoDropLevel:
                Control: Classic/Icon@2.5.0
                Properties:
                  Visible: |
                    =Coalesce( nsLevels,
                              If( IsBlank(cmpNestedSelect.DefaultPath), 1,
                                  CountRows(Split(cmpNestedSelect.DefaultPath, cmpNestedSelect.Separator)) ) ) > 1
                  Icon: =Icon.Cancel
                  Color: =RGBA(110, 120, 130, 1)
                  Tooltip: ="Close the last level"
                  FillPortions: =0
                  LayoutMinWidth: =24
                  Width: =24
                  Height: =24
                  OnSelect: |
                    =Set( nsLevels, Coalesce( nsLevels,
                              If( IsBlank(cmpNestedSelect.DefaultPath), 1,
                                  CountRows(Split(cmpNestedSelect.DefaultPath, cmpNestedSelect.Separator)) ) ) - 1 );
                     cmpNestedSelect.OnChange()
