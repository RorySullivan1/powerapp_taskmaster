# =============================================================================
# cmpPeoplePicker  —  modal single-person search dialog (component)
# =============================================================================
# Click a person box on the form -> this opens over the whole screen -> type a
# name -> results appear as you pause -> tap one to highlight it -> press the
# check to commit. Selecting and committing are two separate acts, so a mistap
# in the results list never writes a person to the record.
#
# WHY THIS IS ONE FULL-SCREEN INSTANCE PER SCREEN, NOT ONE PER FIELD:
# a component clips its children to its own Width/Height, so an instance sized
# to a 36px form field cannot paint a dialog over the form. The instance is
# therefore absolute and screen-sized, and the consuming screen names the field
# being picked in its own global (scrTaskEdit already had `gTkPicker` doing
# exactly this). Two person fields on a screen share ONE instance.
#
# THE PERSON BOX STAYS ON THE SCREEN. This component is the dialog only. The
# chip that shows the chosen person, and its clear X, remain screen controls —
# they are cheap, they already exist, and keeping them out here means clearing a
# field never has to open a dialog.
#
# THIS COMPONENT TOUCHES NOTHING OUTSIDE ITSELF. AccessAppScope is false, so it
# cannot read app globals, App named formulas (Theme included) or data sources.
# Every colour below is therefore a LITERAL lifted from Theme — keep them in step
# by hand, exactly as cmpAppBar and cmpUiKit do — and the directory search runs
# on the SCREEN, which passes rows in through Results. The first draft of this
# file reached for Theme.* and Office365Users directly and was wrong on both.
#
# Contract — SEVEN properties to hand-type in Studio:
#   Title     (Input, Text)    — dialog heading, e.g. "Select lead"
#   Results   (Input, Table)   — {DisplayName, Mail} rows to list; screen supplies
#   Query     (Output, Text)   — what the user submitted; read inside OnSearch
#   Picked    (Output, Record) — {DisplayName, Mail} highlighted at confirm time
#   OnSearch  (Event)          — a search was submitted; screen refreshes Results
#   OnConfirm (Event)          — check pressed with somebody highlighted
#   OnCancel  (Event)          — dismissed via the X or the scrim
#   OnReset   (built-in)       — see below; not a custom property, nothing to type
#
# WHY Query GOES OUT AND Results COMES BACK, RATHER THAN THE SCREEN READING
# Query DIRECTLY INTO Results: the screen stashes Query in a global inside
# OnSearch, and binds Results off THAT. Feeding an instance's own output straight
# into its own input is the kind of same-instance cycle Studio may reject, and a
# rejection costs a paste to discover. One global sidesteps the question.
#
# ONRESET IS LOAD-BEARING, NOT HOUSEKEEPING.
# One instance serves every person field on the screen AND every record the
# screen is reused for. Without OnReset, opening the dialog for Supporter would
# still show Lead's highlighted row and a check press would write the wrong
# person — the exact defect that made cmpSelection unusable for per-record state
# (it has no OnReset). The consuming screen MUST call `Reset(<instance>)` at the
# moment it opens the dialog. Grounded in cmpNestedSelect, whose OnReset is
# documented as "Fired by Reset(<instance>) on the consuming screen".
#
# ppQuery / ppPicked / ppTried are INSTANCE-scoped: with AccessAppScope false,
# MS Learn states Set() results are scoped to the component instance. Same basis
# as cmpNestedSelect's nsLevels.
#
# SEARCH IS DEBOUNCED, NOT PER KEYSTROKE AND NOT ON ENTER.
# `TriggerOutput.Delayed` fires OnChange once the user stops typing, which fills
# `ppQuery` and raises OnSearch; only then does the screen run the directory
# call. So it is still one call per search term rather than one per character.
#
# This was `FocusOut` first, on the assumption that a single-line input commits
# on ENTER. IT DOES NOT — FocusOut means only what it says, so Enter did nothing
# and results appeared only when the box lost focus. **Canvas Power Apps has no
# keypress or Enter event on a text input at all**, so there is no formula that
# binds Enter to a search: debounce is the mechanism, and the Search button is
# the explicit alternative.
# =============================================================================
ComponentDefinitions:
  cmpPeoplePicker:
    DefinitionType: CanvasComponent
    Description: Modal single-person search. Typing searches (debounced), tap highlights, the check commits. Call Reset(<instance>) when opening.
    AccessAppScope: false
    CustomProperties:
      Title:
        PropertyKind: Input
        Description: Heading shown at the top of the dialog, e.g. "Select lead".
        DataType: Text
        Default: ="Select a person"
      Results:
        PropertyKind: Input
        Description: People to list. Schema {DisplayName:Text, Mail:Text}. The SCREEN runs the directory call and passes rows in; column names are identifiers, not strings.
        DataType: Table
        Default: |
          =Table( { DisplayName: "Example Person", Mail: "example@contoso.com" } )
      Query:
        PropertyKind: Output
        Description: The current search text. Read it inside OnSearch and stash it in a screen global; the screen runs the directory call.
        DataType: Text
      OnSearch:
        PropertyKind: Event
        Description: Raised when the debounced search box settles, or the Search button is pressed. The app reads Query and refreshes what it passes to Results.
        ReturnType: Boolean
      Picked:
        PropertyKind: Output
        Description: The highlighted person as {DisplayName, Mail}. Read it inside OnConfirm; it is cleared by OnReset.
        DataType: Record
      OnConfirm:
        PropertyKind: Event
        Description: Raised when the check is pressed with somebody highlighted. The app writes Picked into its own person global.
        ReturnType: Boolean
      OnCancel:
        PropertyKind: Event
        Description: Raised when the dialog is dismissed without choosing. The app clears whatever global drives Visible.
        ReturnType: Boolean
    Properties:
      # Screen-sized by default — the instance is meant to cover the form.
      Width: =1366
      Height: =768
      Fill: =RGBA(0, 0, 0, 0)
      # Falls back to a blank-mailed record rather than Blank(), so the consuming
      # screen can test `Len(inst.Picked.Mail) > 0` without a type surprise.
      # If(), not Coalesce(): Coalesce is grounded for scalars here, not records.
      Picked: |
        =If( IsBlank(ppPicked), { DisplayName: "", Mail: "" }, ppPicked )
      Query: |
        =Coalesce( ppQuery, "" )
      OnReset: |
        =Set( ppQuery, "" );
         Set( ppPicked, Blank() );
         Set( ppTried, false );
         Reset( txtPpSearch )
    Children:
      # ---- Scrim: dims the form and swallows clicks aimed past the dialog ----
      - ppScrim:
          Control: Classic/Button@2.2.0
          Properties:
            # A button, not a rectangle: it has to be CLICKABLE to dismiss, and a
            # rectangle's OnSelect is not a reliable hit target behind a dialog.
            Text: =""
            Fill: =RGBA(0, 0, 0, 0.35)
            HoverFill: =RGBA(0, 0, 0, 0.35)
            PressedFill: =RGBA(0, 0, 0, 0.35)
            BorderThickness: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            OnSelect: =cmpPeoplePicker.OnCancel()
      # ---- Dialog card -------------------------------------------------------
      - ppCard:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            X: =(Parent.Width - 620) / 2
            Y: =(Parent.Height - 460) / 2
            Width: =620
            Height: =460
      - ppHeadBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(0, 90, 158, 1)
            X: =(Parent.Width - 620) / 2
            Y: =(Parent.Height - 460) / 2
            Width: =620
            Height: =52
      - ppTitle:
          Control: Label@2.5.1
          Properties:
            Text: =cmpPeoplePicker.Title
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            Size: =16
            FontWeight: =FontWeight.Semibold
            VerticalAlign: =VerticalAlign.Middle
            X: =(Parent.Width - 620) / 2 + 16
            Y: =(Parent.Height - 460) / 2
            Width: =520
            Height: =52
      - ppClose:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =RGBA(255, 255, 255, 1)
            Tooltip: ="Close without choosing"
            X: =(Parent.Width - 620) / 2 + 620 - 16 - 20
            Y: =(Parent.Height - 460) / 2 + 16
            Width: =20
            Height: =20
            OnSelect: =cmpPeoplePicker.OnCancel()
      # ---- Search row --------------------------------------------------------
      - txtPpSearch:
          Control: ModernTextInput@1.1.1
          Properties:
            Placeholder: ="Type at least 2 characters…"
            # Delayed: OnChange fires once the user STOPS TYPING, not per
            # keystroke. This was FocusOut on the assumption that a single-line
            # input commits on Enter — it does not; FocusOut means exactly what
            # it says, so Enter did nothing and the list only appeared when the
            # box lost focus. Canvas has no keypress/Enter event on a text
            # input, so debounce is the mechanism and the Search button is the
            # explicit alternative.
            TriggerOutput: =TriggerOutput.Delayed
            Font: =Font.'Segoe UI'
            Size: =14
            X: =(Parent.Width - 620) / 2 + 16
            Y: =(Parent.Height - 460) / 2 + 68
            Width: =520
            Height: =40
            OnChange: |
              =Set( ppQuery, Trim(txtPpSearch.Text) );
               Set( ppPicked, Blank() );
               Set( ppTried, false );
               cmpPeoplePicker.OnSearch()
      - ppSearchGo:
          Control: Classic/Button@2.2.0
          Properties:
            # Explicit re-run. Debounce covers the normal case; this is for
            # re-issuing the same query after a data change, and for anyone who
            # expects a search box to have a button.
            Text: ="Search"
            Fill: =RGBA(0, 90, 158, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(0, 90, 158, 1)
            BorderThickness: =0
            Font: =Font.'Segoe UI'
            Size: =14
            X: =(Parent.Width - 620) / 2 + 16 + 528
            Y: =(Parent.Height - 460) / 2 + 68
            Width: =60
            Height: =40
            OnSelect: |
              =Set( ppQuery, Trim(txtPpSearch.Text) );
               Set( ppPicked, Blank() );
               Set( ppTried, false );
               cmpPeoplePicker.OnSearch()
      # ---- Results -----------------------------------------------------------
      - galPpResults:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
          Properties:
            # The SCREEN runs the directory call and passes the rows in. This
            # component never touches a data source: with AccessAppScope false it
            # cannot reach one, exactly as it cannot reach Theme or a global.
            # Same contract as cmpNestedSelect's Terms — "pass a collection, not
            # the list itself".
            #
            # Searching on submit rather than per keystroke is preserved by the
            # screen: it only re-runs the call when OnSearch hands it a new Query.
            Items: =cmpPeoplePicker.Results
            WrapCount: =1
            TemplateSize: =44
            TemplatePadding: =0
            TemplateFill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            ShowScrollbar: =true
            X: =(Parent.Width - 620) / 2 + 16
            Y: =(Parent.Height - 460) / 2 + 120
            Width: =588
            Height: =264
          Children:
            - ppRowSel:
                Control: Rectangle@2.3.0
                Properties:
                  # Highlight for the row currently held in ppPicked. Compared on
                  # Mail, not on the record — a record comparison against a value
                  # rebuilt by Set() is not an identity match.
                  Fill: =RGBA(102, 182, 227, 1)
                  Visible: |
                    =Len(Coalesce(ppPicked.Mail, "")) > 0 && ppPicked.Mail = ThisItem.Mail
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =43
            - ppRowName:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.DisplayName
                  Font: =Font.'Segoe UI'
                  Size: =14
                  Color: =RGBA(32, 38, 45, 1)
                  VerticalAlign: =VerticalAlign.Middle
                  X: =12
                  Y: =0
                  Width: =Parent.TemplateWidth - 24
                  Height: =24
            - ppRowMail:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Mail
                  Font: =Font.'Segoe UI'
                  Size: =12
                  Color: =RGBA(110, 120, 130, 1)
                  VerticalAlign: =VerticalAlign.Middle
                  X: =12
                  Y: =23
                  Width: =Parent.TemplateWidth - 24
                  Height: =18
            - ppRowLine:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(225, 229, 235, 1)
                  X: =0
                  Y: =43
                  Width: =Parent.TemplateWidth
                  Height: =1
            - ppRowHit:
                Control: Classic/Button@2.2.0
                Properties:
                  # The row's action lives HERE, on a transparent full-template
                  # button declared LAST. A gallery's own OnSelect does not
                  # reliably fire when the click lands on a child control, so
                  # without this the rows look right and do nothing. Confirmed in
                  # Studio 2026-08-03.
                  #
                  # HIGHLIGHTS ONLY. Committing is the check button's job — that
                  # is the two-step the whole dialog exists to provide.
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  OnSelect: |
                    =Select(Parent);
                     Set( ppPicked, { DisplayName: ThisItem.DisplayName, Mail: ThisItem.Mail } );
                     Set( ppTried, false )
      # ---- Empty / prompt state ---------------------------------------------
      - ppHint:
          Control: Label@2.5.1
          Properties:
            # One label covering both quiet states, so an empty dialog is never
            # just blank space.
            Visible: =Len(Coalesce(ppQuery, "")) < 2
            Text: |
              =If( Len(Coalesce(ppQuery, "")) = 0,
                   "Start typing to search — results appear as you pause.",
                   "Type at least two characters." )
            Font: =Font.'Segoe UI'
            Size: =14
            Color: =RGBA(110, 120, 130, 1)
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            X: =(Parent.Width - 620) / 2 + 16
            Y: =(Parent.Height - 460) / 2 + 120
            Width: =588
            Height: =264
      # ---- Footer ------------------------------------------------------------
      - ppNudge:
          Control: Label@2.5.1
          Properties:
            # Shown only after the check has been pressed with nothing chosen.
            # The check is NOT disabled: a disabled button cannot say why it is
            # disabled, which on 2026-08-10 cost a round trip on btnTkSave.
            # `= true` rather than Coalesce(): blank compares false, and Coalesce
            # on a Boolean is not grounded in this repo.
            Visible: =ppTried = true
            Text: ="Pick somebody from the list first."
            Font: =Font.'Segoe UI'
            Size: =12
            Color: =RGBA(197, 58, 58, 1)
            VerticalAlign: =VerticalAlign.Middle
            X: =(Parent.Width - 620) / 2 + 16
            Y: =(Parent.Height - 460) / 2 + 400
            Width: =300
            Height: =40
      - ppCancel:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Cancel"
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(0, 90, 158, 1)
            BorderColor: =RGBA(0, 90, 158, 1)
            BorderThickness: =1
            Font: =Font.'Segoe UI'
            Size: =14
            X: =(Parent.Width - 620) / 2 + 620 - 16 - 120 - 8 - 120
            Y: =(Parent.Height - 460) / 2 + 400
            Width: =120
            Height: =40
            OnSelect: =cmpPeoplePicker.OnCancel()
      - ppConfirm:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="✓  Use this person"
            Fill: =RGBA(0, 90, 158, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(0, 90, 158, 1)
            BorderThickness: =0
            Font: =Font.'Segoe UI'
            Size: =14
            X: =(Parent.Width - 620) / 2 + 620 - 16 - 120
            Y: =(Parent.Height - 460) / 2 + 400
            Width: =120
            Height: =40
            # ALWAYS ENABLED. With nothing picked it explains itself via ppNudge
            # rather than sitting inert — see ppNudge.
            OnSelect: |
              =If( Len(Coalesce(ppPicked.Mail, "")) = 0,
                   Set( ppTried, true ),
                   cmpPeoplePicker.OnConfirm() )
