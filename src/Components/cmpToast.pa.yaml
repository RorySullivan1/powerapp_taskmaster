# That is TWO sources of truth — the screen's `gToastShow` (which gates the instance's Visible,
# added to stop the toast swallowing clicks) and the component's `_show` — plus a race:
# `Reset()` fires in the same behaviour pass that sets the variable the timer's `Start` reads,
# so whether the timer ends up running depends on evaluation order this air gap cannot verify.
# The toast appeared and never dismissed.
# Now a forgotten `IsOpen` degrades to "shows but never auto-dismisses" — annoying, but it
# points straight at the cause.
# If it still never fires, make it visible at 1x1 in a corner to prove whether hidden is the
# problem — that is the one remaining unverifiable.
ComponentDefinitions:
  cmpToast:
    DefinitionType: CanvasComponent
    Description: Self-dismissing toast. The screen sets IsOpen; an internal Timer raises OnDismiss after Duration.
    AccessAppScope: false
    CustomProperties:
      IsOpen:
        PropertyKind: Input
        Description: Whether the toast is raised. Pass the same flag as the instance's Visible — it both shows the toast and starts the timer.
        DataType: Boolean
        Default: =false
      Message:
        PropertyKind: Input
        Description: Text to show. Set it before raising IsOpen.
        DataType: Text
        Default: =""
      Tone:
        PropertyKind: Input
        Description: Info | Success | Warning | Danger — drives colour and icon.
        DataType: Text
        Default: ="Info"
      Duration:
        PropertyKind: Input
        Description: Milliseconds visible before auto-dismiss.
        DataType: Number
        Default: =3000
      OnDismiss:
        PropertyKind: Event
        Description: Raised when the dismiss timer ends. The screen clears its flag.
        ReturnType: Boolean
    Properties:
      Height: =56
      Width: =340
      Fill: =RGBA(0, 0, 0, 0)
    Children:
      - toastBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: |
              =Switch(cmpToast.Tone,
                  "Success", RGBA(49, 130, 93, 1),
                  "Warning", RGBA(214, 152, 40, 1),
                  "Danger",  RGBA(197, 58, 58, 1),
                  RGBA(0, 90, 158, 1))
            Height: =Parent.Height
            Width: =Parent.Width
            X: =0
            Y: =0
      - toastIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: |
              =Switch(cmpToast.Tone,
                  "Success", Icon.Check,
                  "Warning", Icon.Warning,
                  "Danger",  Icon.Error,
                  Icon.Information)
            Color: =RGBA(255, 255, 255, 1)
            Height: =22
            Width: =22
            X: =16
            Y: =(Parent.Height - 22) / 2
      - toastLabel:
          Control: Label@2.5.1
          Properties:
            Text: =cmpToast.Message
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            Size: =13
            X: =50
            Y: =0
            Width: =Parent.Width - 66
            Height: =Parent.Height
            VerticalAlign: =VerticalAlign.Middle
      - tmrToast:
          Control: Timer
          Properties:
            Duration: =cmpToast.Duration
            AutoStart: =false
            Repeat: =false
            Start: =cmpToast.IsOpen
            Reset: =!cmpToast.IsOpen
            Visible: =false
            OnTimerEnd: =cmpToast.OnDismiss()
