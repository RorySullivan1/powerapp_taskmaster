# =============================================================================
# cmpToast — transient notification / snackbar (component; screen-level)
#
# ONE FLAG DRIVES EVERYTHING. The screen owns a boolean; that boolean shows the toast,
# starts the timer and resets it. There is no internal state and no Show() action.
#
#   To raise:   Set(gToastShow, false);                    // forces the reset edge
#               Set(gToastMsg, "Saved"); Set(gToastTone, "Success");
#               Set(gToastShow, true)
#   To place:   one instance per screen, with
#               Visible: =gToastShow   AND   IsOpen: =gToastShow
#   It dismisses itself: OnTimerEnd raises OnDismiss, the screen clears the flag.
#
# The timer is `Start: =cmpToast.IsOpen` with `Reset: =!cmpToast.IsOpen` — the
# canonical restart idiom, and NOT an internal variable plus a Show() action, which is
# two sources of truth plus a race between Reset() and the timer's Start.
#
# `IsOpen` DRIVES THE TIMER ONLY. The visual children carry no `Visible` of their own,
# because the INSTANCE's `Visible` already hides the component. That is deliberate: an
# unwired `IsOpen` defaults to false, so children depending on it would make the toast
# vanish with no clue why. It degrades to "shows but never auto-dismisses" instead,
# which points straight at the cause.
#
# IF IT DOES NOT DISMISS, CHECK THESE FIRST:
#   1. Timers only run in PREVIEW — "In Power Apps Studio, timers run only in Preview
#      mode" (MS Learn, Timer control). Not a bug if you were on canvas.
#   2. The timer is `Visible: =false`, which the same page endorses. If it still never
#      fires, make it visible at 1x1 to prove whether hidden is the problem — that is
#      the one remaining unverifiable.
#
# Tokens: plain `Timer`, NOT `Classic/Timer` (confirmed in Studio). Colours are
# literals mirroring the gTheme palette — a component cannot read gTheme.
# =============================================================================
ComponentDefinitions:
  cmpToast:
    DefinitionType: CanvasComponent
    Description: Self-dismissing toast. The screen sets IsOpen; an internal Timer raises OnDismiss after Duration.
    AccessAppScope: false
    CustomProperties:
      IsOpen:
        PropertyKind: Input
        Description: Whether the toast is raised. Pass the same flag as the instance's Visible — it both shows the toast and starts the timer.
        DataType: Boolean
        Default: =false
      Message:
        PropertyKind: Input
        Description: Text to show. Set it before raising IsOpen.
        DataType: Text
        Default: =""
      Tone:
        PropertyKind: Input
        Description: Info | Success | Warning | Danger — drives colour and icon.
        DataType: Text
        Default: ="Info"
      Duration:
        PropertyKind: Input
        Description: Milliseconds visible before auto-dismiss.
        DataType: Number
        Default: =3000
      OnDismiss:
        PropertyKind: Event
        Description: Raised when the dismiss timer ends. The screen clears its flag.
        ReturnType: Boolean
    Properties:
      Height: =56
      Width: =340
      Fill: =RGBA(0, 0, 0, 0)
    Children:
      - toastBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: |
              =Switch(cmpToast.Tone,
                  "Success", RGBA(49, 130, 93, 1),
                  "Warning", RGBA(214, 152, 40, 1),
                  "Danger",  RGBA(197, 58, 58, 1),
                  RGBA(0, 90, 158, 1))
            Height: =Parent.Height
            Width: =Parent.Width
            X: =0
            Y: =0
      - toastIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: |
              =Switch(cmpToast.Tone,
                  "Success", Icon.Check,
                  "Warning", Icon.Warning,
                  "Danger",  Icon.Error,
                  Icon.Information)
            Color: =RGBA(255, 255, 255, 1)
            # Decorative. Pinned so a passing mouse does not dim it.
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 0, 0, 0)
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            Height: =22
            Width: =22
            X: =16
            Y: =(Parent.Height - 22) / 2
      - toastLabel:
          Control: Label@2.5.1
          Properties:
            Text: =cmpToast.Message
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            Size: =13
            X: =50
            Y: =0
            Width: =Parent.Width - 66
            Height: =Parent.Height
            VerticalAlign: =VerticalAlign.Middle
      - tmrToast:
          Control: Timer
          Properties:
            Duration: =cmpToast.Duration
            AutoStart: =false
            Repeat: =false
            Start: =cmpToast.IsOpen
            Reset: =!cmpToast.IsOpen
            Visible: =false
            OnTimerEnd: =cmpToast.OnDismiss()
