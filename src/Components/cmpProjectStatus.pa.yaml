# cmpProjectStatus — the project_phase glyph, drawn as SVG in an Image data URI.
#
# SHAPE CARRIES THE MEANING, colour only reinforces it: an empty ring, a ring of
# dots, a ring with a filled core, a barred disc and a tick are all distinguishable
# in greyscale and to a red-green colour-blind reader. A colour-only dot would not
# be. The set also reads as a progression — empty, thinking, working, done.
#
# AccessAppScope is false, so the palette is literals mirroring gTheme:
# Primary #005A9E · Success #31825D · Danger #C53A3A · TextMuted #6E7882
#
# NO "Archived" CASE. Archived projects are excluded from every screen that uses
# this component, so one would land on the "?" glyph — which is the right answer if
# it ever appears, because it means something is showing work that should be hidden.
# The phase value itself stays in the schema: it drives the *_project_archived
# cascade onto every child list.
#
# ONE property to hand-type in Studio: Status (Input, Text).
ComponentDefinitions:
  cmpProjectStatus:
    DefinitionType: CanvasComponent
    Description: SVG status glyph for a project_phase value — ring (Planning), disc (Active), barred disc (Blocked), tick (Complete), dashed ring (Archived/unknown).
    AccessAppScope: false
    CustomProperties:
      Status:
        PropertyKind: Input
        Description: A project_phase value — Not Started, Planning, Active, Blocked or Complete. Anything else, Archived included, draws the unknown glyph.
        DataType: Text
        Default: ="Not Started"
    Properties:
      Width: =28
      Height: =28
      Fill: =RGBA(0, 0, 0, 0)
    Children:
      - imgStatus:
          Control: Image@2.2.3
          Properties:
            ImagePosition: =ImagePosition.Fit
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            # viewBox 0 0 36 36 and r=15.9155 match cmpKpiRing, so a glyph and a ring
            # sitting in the same row are optically the same size.
            Image: |
              =With(
                  { g: Switch( cmpProjectStatus.Status,
                        "Not Started",
                            "<circle cx='18' cy='18' r='13' fill='none' stroke='#B9C0C8' stroke-width='2.5'/>",
                        "Planning",
                            "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'/>"
                          & "<circle cx='12.5' cy='18' r='1.7' fill='#6E7882'/>"
                          & "<circle cx='18'   cy='18' r='1.7' fill='#6E7882'/>"
                          & "<circle cx='23.5' cy='18' r='1.7' fill='#6E7882'/>",
                        "Active",
                            "<circle cx='18' cy='18' r='13' fill='none' stroke='#005A9E' stroke-width='3'/>"
                          & "<circle cx='18' cy='18' r='7' fill='#005A9E'/>",
                        "Blocked",
                            "<circle cx='18' cy='18' r='14.5' fill='#C53A3A'/>"
                          & "<rect x='9' y='16' width='18' height='4' rx='2' fill='#FFFFFF'/>",
                        "Complete",
                            "<circle cx='18' cy='18' r='14.5' fill='#31825D'/>"
                          & "<path d='M11 18.5 L16 23.5 L25 13.5' fill='none' stroke='#FFFFFF'"
                          & " stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/>",
                            "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'"
                          & " stroke-dasharray='4 3'/>"
                          & "<text x='18' y='22.5' text-anchor='middle' font-size='13'"
                          & " font-family='Segoe UI, sans-serif' fill='#6E7882'>?</text>" ) },
                  "data:image/svg+xml," & EncodeUrl(
                      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'>" & g & "</svg>" )
              )
