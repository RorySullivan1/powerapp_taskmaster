# =============================================================================
# cmpLookupField  —  the FORM FIELD for a lookup, not the dialog behind it
# =============================================================================
# One field: a caption, a "＋ Choose …" button while empty, and a chip with a
# clear ✕ once something is chosen. It is the widget that was hand-copied
# NINETEEN times across five screens — 882 lines in 35 controls — and had
# already split into two variants that were drifting apart:
#
#   scrProjectEdit    chip = a Classic/Button whose Text ends in a literal "✕"
#   everywhere else   chip = a container holding a Label + a real Classic/Icon
#
# This is the second variant, which is the better one: a real icon is a real
# hit target with its own Tooltip, where a "✕" glued to the end of a label means
# clicking anywhere on the chip clears it.
#
# THE COMPANION OF cmpPicker, NOT A REPLACEMENT. That owns the DIALOG —
# searching and choosing. This owns the FIELD — showing what is chosen and
# offering to change or clear it. Neither knows about the other; the screen
# wires them together with its `g*Picker` global.
#
# STATELESS BY DESIGN, so there is no OnReset to forget.
# The screen owns the value and passes it in as `Display` / `HasValue`. Nothing
# is cached here, so the class of bug that made cmpSelection show the previous
# record's pick cannot occur — there is nothing to go stale.
#
# NO DATA ACCESS, NO THEME. AccessAppScope is false like every component here, so
# the colours below are LITERALS lifted from Theme — keep them in step by hand.
#
# Contract — FIVE properties to hand-type in Studio:
#   Caption   (Input, Text)     — "Client  *"
#   Display   (Input, Text)     — the chosen value's label; ignored when empty
#   HasValue  (Input, Boolean)  — drives which of the two states shows
#   OnPick    (Event)           — the button was pressed; screen opens its dialog
#   OnClear   (Event)           — the ✕ was pressed; screen empties its global
#
# WHY `HasValue` IS A SEPARATE INPUT rather than `Len(Display) > 0`: the callers
# key on different things — a lookup on `g.Id > 0`, a person on
# `Len(g.Mail) > 0`. Deriving it here would force every caller to pass a display
# string that happens to be empty in exactly the right cases, which is the kind
# of implicit coupling that breaks quietly. The screen already knows; let it say.
#
# SIZING: the instance is 62 tall (18 caption + 8 gap + 36 control), matching the
# clusters it replaces. Put it in the col/row wrapper that is already there —
# a component instance cannot carry FillPortions, LayoutMinHeight or the
# LayoutGrid* properties, so the wrapper keeps holding the layout contract.
# =============================================================================
ComponentDefinitions:
  cmpLookupField:
    DefinitionType: CanvasComponent
    Description: Lookup form field — caption, "Choose" button when empty, chip with a clear button when filled. Raises OnPick and OnClear; the screen owns the value and the dialog.
    AccessAppScope: false
    CustomProperties:
      Caption:
        PropertyKind: Input
        Description: Field label, e.g. "Client  *". Shown above the control in both states.
        DataType: Text
        Default: ="Field"
      Display:
        PropertyKind: Input
        Description: Label of the chosen value, shown in the chip. Only read when HasValue is true.
        DataType: Text
        Default: =""
      HasValue:
        PropertyKind: Input
        Description: True when something is chosen. Chooses between the button and the chip — the screen decides, since callers key on .Id > 0 or Len(.Mail) > 0.
        DataType: Boolean
        Default: =false
      PickLabel:
        PropertyKind: Input
        Description: Text of the empty-state button, e.g. "＋  Choose a client".
        DataType: Text
        Default: ="＋  Choose"
      OnPick:
        PropertyKind: Event
        Description: Raised when the choose button is pressed. The app sets its picker global, resets the dialog instance and clears its query.
        ReturnType: Boolean
      OnClear:
        PropertyKind: Event
        Description: Raised when the clear button is pressed. The app empties its own value global.
        ReturnType: Boolean
    Properties:
      Width: =300
      Height: =62
      Fill: =RGBA(0, 0, 0, 0)
    Children:
      - lfRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Start
            LayoutGap: =8
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - lfCaption:
                Control: Label@2.5.1
                Properties:
                  Text: =cmpLookupField.Caption
                  Font: =Font.'Segoe UI'
                  Size: =12
                  Color: =RGBA(110, 120, 130, 1)
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinHeight: =18
                  Width: =Parent.Width
                  Height: =18
            - lfPick:
                Control: Classic/Button@2.2.0
                Properties:
                  Visible: =Not(cmpLookupField.HasValue)
                  Text: =cmpLookupField.PickLabel
                  Align: =Align.Left
                  Fill: =RGBA(245, 247, 250, 1)
                  Color: =RGBA(110, 120, 130, 1)
                  BorderColor: =RGBA(225, 229, 235, 1)
                  BorderThickness: =1
                  Font: =Font.'Segoe UI'
                  Size: =14
                  FillPortions: =0
                  LayoutMinHeight: =36
                  Width: =Parent.Width
                  Height: =36
                  OnSelect: =cmpLookupField.OnPick()
            - lfChip:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  # A HIDDEN CHILD TAKES NO SPACE, so the two states occupy the
                  # same 36px row without any absolute positioning — exactly one
                  # of them is ever visible.
                  Visible: =cmpLookupField.HasValue
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =6
                  PaddingLeft: =10
                  PaddingRight: =10
                  Fill: =RGBA(245, 247, 250, 1)
                  BorderColor: =RGBA(225, 229, 235, 1)
                  BorderThickness: =1
                  FillPortions: =0
                  LayoutMinHeight: =36
                  Width: =Parent.Width
                  Height: =36
                Children:
                  - lfChipLabel:
                      Control: Label@2.5.1
                      Properties:
                        Text: =cmpLookupField.Display
                        Font: =Font.'Segoe UI'
                        Size: =14
                        Color: =RGBA(32, 38, 45, 1)
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =1
                        LayoutMinWidth: =60
                        Height: =24
                  - lfClear:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        # A REAL ICON, not a "✕" glued to the end of the label.
                        # The scrProjectEdit variant put the ✕ in a Classic/Button's
                        # Text, which makes the WHOLE chip a clear button — so
                        # clicking the chip to see the full value wiped it instead.
                        Icon: =Icon.Cancel
                        Color: =RGBA(110, 120, 130, 1)
                        Tooltip: ="Clear"
                        FillPortions: =0
                        LayoutMinWidth: =16
                        Width: =16
                        Height: =16
                        OnSelect: =cmpLookupField.OnClear()
