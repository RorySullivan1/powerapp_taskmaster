# The lookup form field: caption + "choose" button + chip + clear.
# Stateless — the screen owns the value and passes Display/HasValue in, so there is
# no OnReset to forget and no stale pick.
# AccessAppScope is false: no data access, no gTheme, colours are literals.
#
# FIVE properties to hand-type in Studio: Caption / Display / HasValue / PickLabel
# (Input), OnPick / OnClear (Event).
# HasValue is a separate input, not Len(Display) > 0, because callers key on different
# things (.Id > 0 for a lookup, Len(.Mail) > 0 for a person).
# An instance cannot carry FillPortions, LayoutMinHeight or LayoutGrid* — wrap it.
ComponentDefinitions:
  cmpLookupField:
    DefinitionType: CanvasComponent
    Description: Lookup form field — caption, "Choose" button when empty, chip with a clear button when filled. Raises OnPick and OnClear; the screen owns the value and the dialog.
    AccessAppScope: false
    CustomProperties:
      Caption:
        PropertyKind: Input
        Description: Field label, e.g. "Client  *". Shown above the control in both states.
        DataType: Text
        Default: ="Field"
      Display:
        PropertyKind: Input
        Description: Label of the chosen value, shown in the chip. Only read when HasValue is true.
        DataType: Text
        Default: =""
      HasValue:
        PropertyKind: Input
        Description: True when something is chosen. Chooses between the button and the chip — the screen decides, since callers key on .Id > 0 or Len(.Mail) > 0.
        DataType: Boolean
        Default: =false
      PickLabel:
        PropertyKind: Input
        Description: Text of the empty-state button, e.g. "＋  Choose a client".
        DataType: Text
        Default: ="＋  Choose"
      OnPick:
        PropertyKind: Event
        Description: Raised when the choose button is pressed. The app sets its picker global, resets the dialog instance and clears its query.
        ReturnType: Boolean
      OnClear:
        PropertyKind: Event
        Description: Raised when the clear button is pressed. The app empties its own value global.
        ReturnType: Boolean
    Properties:
      Width: =300
      Height: =62
      Fill: =RGBA(0, 0, 0, 0)
    Children:
      - lfRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Start
            LayoutGap: =8
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - lfCaption:
                Control: Label@2.5.1
                Properties:
                  Text: =cmpLookupField.Caption
                  Font: =Font.'Segoe UI'
                  Size: =12
                  Color: =RGBA(110, 120, 130, 1)
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinHeight: =18
                  Width: =Parent.Width
                  Height: =18
            - lfPick:
                Control: Classic/Button@2.2.0
                Properties:
                  Visible: =Not(cmpLookupField.HasValue)
                  Text: =cmpLookupField.PickLabel
                  Align: =Align.Left
                  Fill: =RGBA(245, 247, 250, 1)
                  Color: =RGBA(110, 120, 130, 1)
                  BorderColor: =RGBA(225, 229, 235, 1)
                  BorderThickness: =1
                  Font: =Font.'Segoe UI'
                  Size: =14
                  FillPortions: =0
                  LayoutMinHeight: =36
                  Width: =Parent.Width
                  Height: =36
                  OnSelect: =cmpLookupField.OnPick()
            - lfChip:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Visible: =cmpLookupField.HasValue
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =6
                  PaddingLeft: =10
                  PaddingRight: =10
                  Fill: =RGBA(245, 247, 250, 1)
                  BorderColor: =RGBA(225, 229, 235, 1)
                  BorderThickness: =1
                  FillPortions: =0
                  LayoutMinHeight: =36
                  Width: =Parent.Width
                  Height: =36
                Children:
                  - lfChipLabel:
                      Control: Label@2.5.1
                      Properties:
                        Text: =cmpLookupField.Display
                        Font: =Font.'Segoe UI'
                        Size: =14
                        Color: =RGBA(32, 38, 45, 1)
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =1
                        LayoutMinWidth: =60
                        Height: =24
                  - lfClear:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Icon: =Icon.Cancel
                        Color: =RGBA(110, 120, 130, 1)
                        HoverColor: =RGBA(0, 90, 158, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        Tooltip: ="Clear"
                        FillPortions: =0
                        LayoutMinWidth: =16
                        Width: =16
                        Height: =16
                        OnSelect: =cmpLookupField.OnClear()
