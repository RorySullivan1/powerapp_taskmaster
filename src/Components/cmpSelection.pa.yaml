# IF A CONSUMER READS BLANK FROM `Selected`, CHECK STUDIO BEFORE CHANGING ANY SCREEN.
# A component crosses the gap in TWO parts: the CONTROLS paste through code view, but
# every custom property is DECLARED AND TYPED BY HAND in the component editor. So this
# file can be correct while the Studio copy is not, and the failure is SILENT — the
# strip renders and highlights normally while `Selected` returns nothing.
#
# CHECK THE PROPERTY KIND FIRST. `Selected` must exist as an OUTPUT property (type
# Output, data type Record). Declared as anything else it cannot reference `galSel` at
# all, and Studio's complaint — "controls in a component cannot be referenced in the
# component's properties" — describes the symptom rather than the cause.
#
# The three hand-typed formulas, verbatim. Set them with the COMPONENT selected inside
# the component editor — on an INSTANCE its own controls are out of scope:
#   Selected  (Output, Record)  =galSel.Selected
#   OnReset   (Behaviour)       =Reset( galSel )
#   galSel.Default              =LookUp(cmpSelection.Items, Id = cmpSelection.DefaultId)
ComponentDefinitions:
  cmpSelection:
    DefinitionType: CanvasComponent
    Description: Single-select strip over an Items table; outputs Selected record, raises OnChange.
    AccessAppScope: false
    CustomProperties:
      Items:
        PropertyKind: Input
        Description: Options to choose from. Schema {Id:Number, Label:Text}.
        DataType: Table
        Default: |
          =Table({ Id: 1, Label: "Option A" }, { Id: 2, Label: "Option B" }, { Id: 3, Label: "Option C" })
      FontSize:
        PropertyKind: Input
        Description: Point size of the option labels. 11 keeps a 7-option strip legible; raise it for two or three wide options.
        DataType: Number
        Default: =11
      DefaultId:
        PropertyKind: Input
        Description: Id selected before the user interacts.
        DataType: Number
        Default: =1
      Selected:
        PropertyKind: Output
        Description: The currently selected row of Items (falls back to the first row if none).
        DataType: Record
      OnChange:
        PropertyKind: Event
        Description: Raised when the selection changes.
        ReturnType: Boolean
    Properties:
      Height: =40
      Width: =360
      Fill: =RGBA(0, 0, 0, 0)
      # The documented shape — MS Learn's component walkthrough sets an output property to
      # `Gallery1.Selected.Item`. No IsBlank fallback is needed: galSel has a Default, and a
      # gallery with a Default always has a Selected.
      Selected: =galSel.Selected
      # WITHOUT THIS THE STRIP LIES. A gallery re-reads its `Default` only on Reset, and
      # `galSel.Default` is the seed from `DefaultId` — so an instance bound to per-record
      # state shows the PREVIOUS record's pick while the screen's global, and therefore the
      # save, holds the new one. A display that disagrees with the write.
      # Fixed at the source, so every consumer gets it: the screen calls Reset(<instance>).
      OnReset: =Reset( galSel )
    Children:
      - galSel:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: =cmpSelection.Items
            Default: =LookUp(cmpSelection.Items, Id = cmpSelection.DefaultId)
            Height: =Parent.Height
            Width: =Parent.Width
            X: =0
            Y: =0
            WrapCount: =Max(CountRows(cmpSelection.Items), 1)
            TemplateSize: =Parent.Height
            TemplatePadding: =0
          Children:
            - optBtn:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =ThisItem.Label
                  Font: =Font.'Segoe UI'
                  # Tunable per instance: a 7-option stage strip needs smaller text than a 2-option
                  # Yes/No, and a component cannot read gTheme.Size.*. Default 11.
                  Size: =cmpSelection.FontSize
                  Fill: =If(ThisItem.IsSelected, RGBA(0, 90, 158, 1), RGBA(255, 255, 255, 1))
                  Color: =If(ThisItem.IsSelected, RGBA(255, 255, 255, 1), RGBA(32, 38, 45, 1))
                  BorderColor: =RGBA(0, 90, 158, 1)
                  BorderThickness: =1
                  Height: =Parent.TemplateHeight - 4
                  Width: =Parent.TemplateWidth - 8
                  X: =4
                  Y: =2
                  OnSelect: =Select(Parent); cmpSelection.OnChange()
