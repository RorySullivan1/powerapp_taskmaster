# Modal single-select search over {Key, Primary, Secondary} rows — serves people and
# records alike. Key is TEXT: Mail for a person, Text(ID) for a record.
#
# AccessAppScope is false, so it cannot read app globals, named formulas or data sources.
# Colours are literals, and the SCREEN runs the query and passes rows in via Results.
#
# NINE properties to hand-type in Studio: Title / Results / AllowCreate (Input),
# Query / Picked (Output), OnSearch / OnConfirm / OnCancel / OnCreateNew (Event).
#
# Call Reset(<instance>) when opening: one instance serves every field on a screen, so
# without it the dialog opens on the previous field's highlight.
# Search is DEBOUNCED — canvas has no keypress or Enter event on a text input.
ComponentDefinitions:
  cmpPicker:
    DefinitionType: CanvasComponent
    Description: Modal single-select search over {Key, Primary, Secondary} rows — serves both people and records. Typing searches (debounced), tap highlights, the check commits. Call Reset(<instance>) when opening.
    AccessAppScope: false
    CustomProperties:
      Title:
        PropertyKind: Input
        Description: Heading shown at the top of the dialog, e.g. "Select lead".
        DataType: Text
        Default: ="Select"
      Results:
        PropertyKind: Input
        Description: Rows to list. Schema {Key:Text, Primary:Text, Secondary:Text}. Key is Text(ID) for a record and Mail for a person. The SCREEN runs the query.
        DataType: Table
        Default: |
          =Table( { Key: "1", Primary: "Example", Secondary: "example detail" } )
      AllowCreate:
        PropertyKind: Input
        Description: Show the "＋ New" button. True for clients and products only — everything else is pick-only.
        DataType: Boolean
        Default: =false
      Query:
        PropertyKind: Output
        Description: The current search text. Read it inside OnSearch and stash it in a screen global; the screen runs the query.
        DataType: Text
      Picked:
        PropertyKind: Output
        Description: The highlighted row as {Key, Primary, Secondary}. Read it inside OnConfirm; it is cleared by OnReset.
        DataType: Record
      OnSearch:
        PropertyKind: Event
        Description: Raised when the debounced search box settles, or the Search button is pressed.
        ReturnType: Boolean
      OnConfirm:
        PropertyKind: Event
        Description: Raised when the check is pressed with a row highlighted. The app writes Picked into its own global.
        ReturnType: Boolean
      OnCancel:
        PropertyKind: Event
        Description: Raised when the dialog is dismissed without choosing. The app clears whatever global drives Visible.
        ReturnType: Boolean
      OnCreateNew:
        PropertyKind: Event
        Description: Raised by "＋ New". The app navigates to a create screen and returns with the new record selected.
        ReturnType: Boolean
    Properties:
      Width: =1366
      Height: =768
      Fill: =RGBA(0, 0, 0, 0)
      Picked: |
        =If( IsBlank(pkPicked), { Key: "", Primary: "", Secondary: "" }, pkPicked )
      Query: |
        =Coalesce( pkQuery, "" )
      # NO SetFocus HERE — do not re-add it.
      # `SetFocus` cannot target a control inside a Component, a Gallery, an Edit form OR a
      # Container (MS Learn, function-setfocus#limitations;
      # CONSEQUENCE, ACCEPTED: the dialog opens with nothing focused, so the user must click
      # into the search box before typing.
      OnReset: |
        =Set( pkQuery, "" );
         Set( pkPicked, Blank() );
         Set( pkTried, false );
         Reset( txtPkSearch )
    Children:
      # NO AccessibleLabel ON ANY Classic/* CONTROL — the property does not exist there
      - pkScrim:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Fill: =RGBA(0, 0, 0, 0.35)
            HoverFill: =RGBA(0, 0, 0, 0.35)
            PressedFill: =RGBA(0, 0, 0, 0.35)
            BorderThickness: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            OnSelect: =cmpPicker.OnCancel()
      - pkCard:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            X: =(Parent.Width - 620) / 2
            Y: =(Parent.Height - 460) / 2
            Width: =620
            Height: =460
      - pkHeadBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(0, 90, 158, 1)
            X: =(Parent.Width - 620) / 2
            Y: =(Parent.Height - 460) / 2
            Width: =620
            Height: =52
      - pkTitle:
          Control: Label@2.5.1
          Properties:
            Text: =cmpPicker.Title
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            Size: =16
            FontWeight: =FontWeight.Semibold
            VerticalAlign: =VerticalAlign.Middle
            X: =(Parent.Width - 620) / 2 + 16
            Y: =(Parent.Height - 460) / 2
            Width: =520
            Height: =52
      - pkClose:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =RGBA(255, 255, 255, 1)
            Tooltip: ="Close without choosing"
            X: =(Parent.Width - 620) / 2 + 620 - 16 - 20
            Y: =(Parent.Height - 460) / 2 + 16
            Width: =20
            Height: =20
            OnSelect: =cmpPicker.OnCancel()
      - txtPkSearch:
          Control: ModernTextInput@1.1.1
          Properties:
            Placeholder: ="Type at least 2 characters…"
            AccessibleLabel: ="Search"
            # Never FocusOut — that fires only on losing focus, which is what made Enter appear
            # to do nothing.
            TriggerOutput: =TriggerOutput.Delayed
            Font: =Font.'Segoe UI'
            Size: =14
            X: =(Parent.Width - 620) / 2 + 16
            Y: =(Parent.Height - 460) / 2 + 68
            Width: =520
            Height: =40
            OnChange: |
              =Set( pkQuery, Trim(txtPkSearch.Text) );
               Set( pkPicked, Blank() );
               Set( pkTried, false );
               cmpPicker.OnSearch()
      - pkSearchGo:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Search"
            Fill: =RGBA(0, 90, 158, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(0, 90, 158, 1)
            BorderThickness: =0
            Font: =Font.'Segoe UI'
            Size: =14
            X: =(Parent.Width - 620) / 2 + 16 + 528
            Y: =(Parent.Height - 460) / 2 + 68
            Width: =60
            Height: =40
            OnSelect: |
              =Set( pkQuery, Trim(txtPkSearch.Text) );
               Set( pkPicked, Blank() );
               Set( pkTried, false );
               cmpPicker.OnSearch()
      - galPkResults:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
          Properties:
            Items: =cmpPicker.Results
            WrapCount: =1
            TemplateSize: =44
            TemplatePadding: =0
            TemplateFill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            ShowScrollbar: =true
            X: =(Parent.Width - 620) / 2 + 16
            Y: =(Parent.Height - 460) / 2 + 120
            Width: =588
            Height: =264
          Children:
            - pkRowSel:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(102, 182, 227, 1)
                  Visible: |
                    =Len(Coalesce(pkPicked.Key, "")) > 0 && pkPicked.Key = ThisItem.Key
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =43
            - pkRowPrimary:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Primary
                  Font: =Font.'Segoe UI'
                  Size: =14
                  Color: =RGBA(32, 38, 45, 1)
                  VerticalAlign: =VerticalAlign.Middle
                  X: =12
                  Y: =0
                  Width: =Parent.TemplateWidth - 24
                  Height: =24
            - pkRowSecondary:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Secondary
                  Font: =Font.'Segoe UI'
                  Size: =12
                  Color: =RGBA(110, 120, 130, 1)
                  VerticalAlign: =VerticalAlign.Middle
                  X: =12
                  Y: =23
                  Width: =Parent.TemplateWidth - 24
                  Height: =18
            - pkRowLine:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(225, 229, 235, 1)
                  X: =0
                  Y: =43
                  Width: =Parent.TemplateWidth
                  Height: =1
            - pkRowHit:
                Control: Classic/Button@2.2.0
                Properties:
                  # Transparent full-template button declared LAST — a gallery's own OnSelect
                  # does not reliably fire when the click lands on a child control.
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  OnSelect: |
                    =Select(Parent);
                     Set( pkPicked,
                          { Key: ThisItem.Key, Primary: ThisItem.Primary, Secondary: ThisItem.Secondary } );
                     Set( pkTried, false )
      - pkHint:
          Control: Label@2.5.1
          Properties:
            Visible: |
              =Len(Coalesce(pkQuery, "")) < 2 || CountRows(cmpPicker.Results) = 0
            Text: |
              =If( Len(Coalesce(pkQuery, "")) = 0,
                   "Start typing to search — results appear as you pause.",
                   Len(Coalesce(pkQuery, "")) < 2,
                   "Type at least two characters.",
                   "No matches for """ & pkQuery & """." )
            Font: =Font.'Segoe UI'
            Size: =14
            Color: =RGBA(110, 120, 130, 1)
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            X: =(Parent.Width - 620) / 2 + 16
            Y: =(Parent.Height - 460) / 2 + 120
            Width: =588
            Height: =264
      - pkCreateNew:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =cmpPicker.AllowCreate
            Text: ="＋  New"
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(0, 90, 158, 1)
            BorderColor: =RGBA(0, 90, 158, 1)
            BorderThickness: =1
            Font: =Font.'Segoe UI'
            Size: =14
            X: =(Parent.Width - 620) / 2 + 16
            Y: =(Parent.Height - 460) / 2 + 400
            Width: =120
            Height: =40
            OnSelect: =cmpPicker.OnCreateNew()
      - pkNudge:
          Control: Label@2.5.1
          Properties:
            Visible: =pkTried = true
            Text: ="Pick something from the list first."
            Font: =Font.'Segoe UI'
            Size: =12
            Color: =RGBA(197, 58, 58, 1)
            VerticalAlign: =VerticalAlign.Middle
            X: =(Parent.Width - 620) / 2 + 144
            Y: =(Parent.Height - 460) / 2 + 400
            Width: =204
            Height: =40
      - pkCancel:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Cancel"
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(0, 90, 158, 1)
            BorderColor: =RGBA(0, 90, 158, 1)
            BorderThickness: =1
            Font: =Font.'Segoe UI'
            Size: =14
            X: =(Parent.Width - 620) / 2 + 620 - 16 - 120 - 8 - 120
            Y: =(Parent.Height - 460) / 2 + 400
            Width: =120
            Height: =40
            OnSelect: =cmpPicker.OnCancel()
      - pkConfirm:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="✓  Use this one"
            Fill: =RGBA(0, 90, 158, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(0, 90, 158, 1)
            BorderThickness: =0
            Font: =Font.'Segoe UI'
            Size: =14
            X: =(Parent.Width - 620) / 2 + 620 - 16 - 120
            Y: =(Parent.Height - 460) / 2 + 400
            Width: =120
            Height: =40
            # With nothing picked it explains itself via pkNudge rather than sitting inert — a
            # disabled button cannot say why.
            OnSelect: |
              =If( Len(Coalesce(pkPicked.Key, "")) = 0,
                   Set( pkTried, true ),
                   cmpPicker.OnConfirm() )
