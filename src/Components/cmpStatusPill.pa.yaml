# =============================================================================
# cmpStatusPill  —  screen-level status badge (draggable component)
# =============================================================================
# A rounded, colour-coded status badge for SCREEN-LEVEL use (detail screens,
# headers, filter bars) — one HtmlText control inside the component.
#   * Inside a gallery row -> you CANNOT use this component; call
#     cmpUiKit.StatusPillHtml(ThisItem.Status,"auto") from a plain HtmlText instead.
# The tone->colour logic is intentionally the same as cmpUiKit.StatusPillHtml
# (duplicated because a component can't call another component). Keep them in step.
# DIALECT: v3.0 pa.yaml. See _COMPONENTS-NOTES.md for transfer + the contract table.
# =============================================================================
ComponentDefinitions:
  cmpStatusPill:
    DefinitionType: CanvasComponent
    Description: Rounded colour-coded status badge (screen-level). Inputs Label + Tone.
    AccessAppScope: false
    CustomProperties:
      Label:
        PropertyKind: Input
        Description: Status text shown in the pill.
        DataType: Text
        Default: ="Open"
      Tone:
        PropertyKind: Input
        Description: Neutral | Info | Success | Warning | Danger | auto (auto maps common status words).
        DataType: Text
        Default: ="auto"
    Properties:
      Height: =28
      Width: =120
      Fill: =RGBA(0, 0, 0, 0)
    Children:
      - pillHtml:
          Control: HtmlViewer@2.1.0
          Properties:
            Height: =Parent.Height
            Width: =Parent.Width
            X: =0
            Y: =0
            # TONE MATCHING USES `in`, NOT A REGEX (changed 2026-08-03).
            #
            # This was four IsMatch calls with `"(?i)^\s*(word|word)\s*$"`, and
            # Studio rejected them. The trap is that IsMatch in Power Apps defaults
            # to MatchOptions.Complete, which ALREADY wraps the pattern in `^...$` —
            # so supplying our own anchors double-anchors the expression.
            #
            # But the deeper point is that this was never a pattern match. It is a
            # set-membership test against a fixed word list, and Power Fx has an
            # operator for exactly that. `in` on a single-column table is membership
            # and is case-insensitive by default (`exactin` is the case-sensitive
            # variant), so `(?i)` isn't needed either; Trim replaces `\s*`.
            #
            # Keep in step with cmpUiKit.StatusPillHtml, which duplicates this logic
            # because a component cannot call another component.
            HtmlText: |
              =With(
                  { s: Trim(cmpStatusPill.Label) },
                  With(
                      { t: If( cmpStatusPill.Tone <> "auto",
                               cmpStatusPill.Tone,
                               Switch( true,
                                   s in ["done", "complete", "completed", "closed", "approved", "active", "on track"], "Success",
                                   s in ["blocked", "overdue", "rejected", "failed", "error", "breach"], "Danger",
                                   s in ["at risk", "pending", "review", "waiting", "on hold", "hold"], "Warning",
                                   s in ["in progress", "open", "new", "todo", "to do"], "Info",
                                   "Neutral"
                               ) ) },
                      With(
                          { c: Switch(t, "Success","#31825D", "Warning","#D69828", "Danger","#C53A3A", "Info","#005A9E", "#6E7882") },
                          "<span style='display:inline-block;background:" & c &
                          ";color:#fff;padding:2px 10px;border-radius:11px;font:600 12px Segoe UI,Arial,sans-serif'>" &
                          EncodeHTML(s) & "</span>"
                      )
                  )
              )
