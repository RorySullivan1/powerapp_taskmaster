                                                        pct, r.n / tot * 100,
                                                        cum, Coalesce( Sum( Filter(cats, i < r.i), n ), 0 ) / tot * 100 ) },
                                            "data:image/svg+xml," & EncodeUrl(
                                                "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 104 40'>"
                                              & "<circle cx='20' cy='20' r='15.9155' fill='none' stroke='#EEF1F5'"
                                              & " stroke-width='4.5'/>"
                                              & Concat( Filter(arcs, pct > 0),
                                                    "<circle cx='20' cy='20' r='15.9155' fill='none' stroke='" & c
                                                  & "' stroke-width='4.5' stroke-dasharray='"
                                                  & Text(pct, "[$-en-US]0.##", "en-US") & " "
                                                  & Text(100 - pct, "[$-en-US]0.##", "en-US")
                                                  & "' stroke-dashoffset='"
                                                  & Text(25 - cum, "[$-en-US]0.##", "en-US") & "'/>" )
                                              & "<text x='20' y='21.5' text-anchor='middle' font-size='9'"
                                              & " font-weight='600' font-family='Segoe UI, sans-serif' fill='#20262D'>"
                                              & CountRows(colMyIssues) & "</text>"
                                              & "<text x='20' y='26.5' text-anchor='middle' font-size='3.4'"
                                              & " font-family='Segoe UI, sans-serif' fill='#6E7882'>ISSUES</text>"
                                              & Concat( arcs,
                                                    "<rect x='46' y='" & Text(i * 7 - 3.2, "[$-en-US]0.#", "en-US")
                                                  & "' width='4.2' height='4.2' rx='1' fill='" & c & "'/>"
                                                  & "<text x='52.5' y='" & (i * 7) & "' font-size='4.4'"
                                                  & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                                  & EncodeHTML(k) & "  " & n & "</text>" )
                                              & "</svg>" ) ) ) )
                  # THE ONE REAL VISUAL in this band — the licence-free completion
                  # ring. It is WRAPPED because FillPortions and LayoutMinWidth are
                  # proven on GroupContainer but NOT on a CanvasComponent instance,
                  # and the contract check rejects them there. Without a pinned
                  # wrapper the ring defaults to FillPortions 1 and stretches.
                  - pnlRing:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        PaddingTop: =12
                        PaddingBottom: =12
                        # NO SIDE PADDING, and that is what makes the 100 floor real:
                        # padding eats the inner width first, so 12 a side would leave
                        # 76px for a 100px ring at the floor and clip it there instead.
                        PaddingLeft: =0
                        PaddingRight: =0
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        # NARROW ON PURPOSE. This panel is the LAST child of rowCharts,
                        # so it is the one that falls off the right edge when the four
                        # minimum widths plus the gaps exceed the window:
                        # 300 + 170 + 170 + 100 + 48 = 788.
                        FillPortions: =0
                        LayoutMinWidth: =100
                        Width: =150
                        Height: =Parent.Height
                      Children:
                        - wrapRing:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Center
                              # LayoutMinWidth, NOT LayoutMinHeight. This wrapper sits in a
                              # VERTICAL parent, so height is the main axis and width is the
                              # cross axis — the floor that keeps the ring from being squeezed
                              # is the width one.
                              FillPortions: =0
                              LayoutMinWidth: =100
                              Width: =100
                              Height: =100
                            Children:
                              - ringHome:
                                  Control: CanvasComponent
                                  ComponentName: cmpKpiRing
                                  Properties:
                                    Width: =100
                                    Height: =100
                                    Percent: =gMyPercent
                                    Label: =gMyPercent & "%"
                                    AccentHex: ="#005A9E"
                                    TrackHex: ="#E1E5EB"
                        - lblRing:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                ="Weighted completion across " & CountRows(colMyTasks) & " task(s) you lead"
                              Font: =gTheme.Font
                              # A LITERAL 10, not gTheme.Size.Small — the theme's smallest
                              # step is 12 and this caption has to wrap to three lines
                              # inside a 126px column without clipping.
                              Size: =10
                              Color: =gTheme.Color.TextMuted
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =52
                              Width: =Parent.Width - 8
                              Height: =52
      - cmpToastHome:
          Control: CanvasComponent
          ComponentName: cmpToast
          Properties:
            Visible: =gToastShow
            IsOpen: =gToastShow
            X: =Parent.Width - 340 - gTheme.Space.Gutter
            Y: =Parent.Height - 56 - gTheme.Space.Gutter
            Width: =340
            Height: =56
            Message: =gToastMsg
            Tone: =gToastTone
            Duration: =3000
            OnDismiss: =Set(gToastShow, false)
      # ---- The whole shell is one component: header bar + fly-out nav rail ----
      # DECLARED LAST so positional z-order floats the fly-out over the content.
      #
      # Height is dynamic and that is the whole trick: a component intercepts every
      # click inside its bounds, so closed it must own nothing but the 64px header
      # strip. Open, covering the screen is exactly right — the scrim wants the click.
      #
      # cmpAppBar cannot Navigate (a component can't see app screens), so it reports
      # the chosen entry and this screen does the navigating.
      - appBar:
          Control: CanvasComponent
          ComponentName: cmpAppBar
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =If(gNavOpen, Parent.Height, gTheme.Space.HeaderH)
            Items: =gNavMenu
            ActiveKey: =1
            HasLicence: =gHasPowerBiLicence
            AppTitle: ="EQD Taskmaster"
            ScreenTitle: ="Home"
            IsOpen: =gNavOpen
            OnToggle: =Set(gNavOpen, !gNavOpen)
            OnNavigate: |
              =Switch( appBar.SelectedKey,
                       1, Navigate(scrHome, ScreenTransition.Fade),
                       2, Navigate(scrReports, ScreenTransition.Fade),
                       3, Navigate(scrProjects, ScreenTransition.Fade),
                          Navigate(scrReference, ScreenTransition.Fade) );
              Set(gNavOpen, false)
