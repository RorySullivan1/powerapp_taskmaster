                                                       { i: 3, k: "Moderate", c: "#005A9E" },
                                                       { i: 4, k: "Low",      c: "#6E7882" },
                                                       { i: 5, k: "Not set",  c: "#B9C0C8" } ) As cat,
                                                n, CountRows( Filter( colMyIssues,
                                                         Coalesce(issue_impact.Value, "Not set") = cat.k ) ) ) },
                                    With( { tot: Max(1, Sum(cats, n)) },
                                        With(
