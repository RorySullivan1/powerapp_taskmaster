                                                           || Coalesce(issue_impact.Value, "Not set") = "Not set" ) ) ),
                                                       CountRows( Filter(colMyIssues, Coalesce(issue_impact.Value, "Not set") = cat.k) ) ) ) },
                                    With( { tot: Max(1, Sum(cats, n)) },
                                        With(
                                            { arcs: AddColumns( cats As r,
                                                        u, Round( r.n / tot * 1000, 0 ),
