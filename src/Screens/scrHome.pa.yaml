            # ---- Charts band -----------------------------------------------
            # FOUR SVG VISUALS, all drawn in Power Fx and handed to an Image control
            # as a data URI. Read `.claude/skills/power-apps-svg` before editing one.
            #
            # THE CHART FORMULAS ARE DECLARATIVE ON PURPOSE. They read colMyTasks /
            # colMyIssues / colMyProjects directly rather than a pre-computed global,
            # so Refresh redraws them with no second copy of the maths to keep in step.
            #
            # EVERY INTERPOLATED FRACTION GOES THROUGH Text(x, "[$-en-US]0.#", "en-US").
            # A bare number lands in the SVG using the VIEWER'S decimal separator, and
            # `stroke-dasharray='33,3 66,7'` is not a number pair — the slice silently
            # disappears for users in a comma-decimal locale and nowhere else. Whole
            # numbers are safe and are interpolated directly.
            - rowCharts:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =gTheme.Space.Gap
                  FillPortions: =0
                  LayoutMinHeight: =200
                  Width: =Parent.Width - 48
                  Height: =200
                Children:
                  - pnlTimeline:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =8
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =2
                        LayoutMinWidth: =300
                        Height: =Parent.Height
                      Children:
                        - lblTimelineTitle:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Timeline"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H3
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.Primary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =24
                              Width: =Parent.Width - 32
                              Height: =24
                        - imgTimeline:
                            Control: Image@2.2.3
                            Properties:
                              ImagePosition: =ImagePosition.Fit
                              FillPortions: =1
                              LayoutMinHeight: =90
                              Width: =Parent.Width - 32
                              Height: =Parent.Height - 48
                              # GANTT of the projects you lead, soonest target first.
                              #
                              # `Sequence(CountRows(src))` + `Index(src, Value)` is how a row
                              # gets a POSITION, which is what a y-coordinate needs and what
                              # Power Fx has no other way to give it. The count comes from the
                              # same table Index reads, so Index can never be out of range —
                              # it ERRORS out of range, it does not return blank. Sequence(0)
                              # on an empty source is a documented empty table, so the whole
                              # thing collapses to the empty-state text below.
                              #
                              # FIVE ROWS. The viewBox grows with the row count, so a taller
                              # chart renders SMALLER inside a fixed panel — the cap is what
                              # keeps the bars legible, not a data limit.
                              Image: |
                                =With(
                                    { src: FirstN( Sort( Filter( colMyProjects,
                                                                 project_phase.Value <> "Complete"
                                                              && !IsBlank(project_date_target) ),
                                                         project_date_target ), 5 ) },
                                    // src is sorted ASCENDING, so First and Last ARE the date range.
                                    // Min/Max over a date column would come back as a number.
                                    With(
                                        { t0: If( IsEmpty(src) || First(src).project_date_target >= Today(),
                                                  Today(), First(src).project_date_target ),
                                          t1: If( IsEmpty(src), DateAdd(Today(), 30, TimeUnit.Days),
                                                  Last(src).project_date_target ) },
                                        With(
                                            { rows: ForAll( Sequence(CountRows(src)) As s,
                                                        With( { r: Index(src, s.Value) },
                                                            { idx: s.Value,
                                                              nm:  r.project_name,
                                                              d0:  Coalesce(r.project_date_start, Today()),
                                                              d1:  r.project_date_target } ) ),
                                              n:  CountRows(src),
                                              sp: Max( 7, DateDiff(t0, t1, TimeUnit.Days) ) },
                                            // charset IS load-bearing here: project names are the only
                                            // user-supplied text in any of these charts, and a data URI
                                            // defaults to US-ASCII, which mangles any accented name.
                                            "data:image/svg+xml;charset=utf-8," & EncodeUrl(
                                                "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 "
                                              & (16 + Max(1, n) * 20 + 6) & "'>"
                                              & "<text x='92' y='9' font-size='7' font-family='Segoe UI, sans-serif'"
                                              & " fill='#6E7882'>" & Text(t0, "[$-en-US]d mmm") & "</text>"
                                              & "<text x='316' y='9' text-anchor='end' font-size='7'"
                                              & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                              & Text(t1, "[$-en-US]d mmm") & "</text>"
                                              & Concat( rows,
                                                    "<text x='0' y='" & (16 + (idx - 1) * 20 + 13) & "' font-size='8.5'"
                                                  & " font-family='Segoe UI, sans-serif' fill='#20262D'>"
                                                  & EncodeHTML( If(Len(nm) > 15, Left(nm, 14) & "…", nm) ) & "</text>"
                                                  & "<rect x='92' y='" & (16 + (idx - 1) * 20 + 5)
                                                  & "' width='224' height='10' rx='5' fill='#F2F4F7'/>"
                                                  & "<rect x='"
                                                  & Text( 92 + Max(0, DateDiff(t0, d0, TimeUnit.Days)) / sp * 224,
                                                          "[$-en-US]0.#", "en-US" )
                                                  & "' y='" & (16 + (idx - 1) * 20 + 5) & "' width='"
                                                  & Text( Max( 3, ( DateDiff(t0, d1, TimeUnit.Days)
                                                                  - Max(0, DateDiff(t0, d0, TimeUnit.Days)) ) / sp * 224 ),
                                                          "[$-en-US]0.#", "en-US" )
                                                  & "' height='10' rx='5' fill='"
                                                  & If(d1 < Today(), "#C53A3A", "#005A9E") & "'/>" )
                                              & If( n = 0,
                                                    "<text x='160' y='36' text-anchor='middle' font-size='9'"
                                                  & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                                  & "No dated projects you lead</text>",
                                                    // TODAY marker, drawn last so it sits over the bars.
                                                    "<line x1='"
                                                  & Text(92 + DateDiff(t0, Today(), TimeUnit.Days) / sp * 224,
                                                         "[$-en-US]0.#", "en-US")
                                                  & "' y1='12' x2='"
                                                  & Text(92 + DateDiff(t0, Today(), TimeUnit.Days) / sp * 224,
                                                         "[$-en-US]0.#", "en-US")
                                                  & "' y2='" & (16 + n * 20 + 2)
                                                  & "' stroke='#C53A3A' stroke-width='0.8' stroke-dasharray='2 2'/>" )
                                              & "</svg>" ) ) ) )
                  - pnlPieTasks:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =200
                        Height: =Parent.Height
                      Children:
                        - lblPieTasksTitle:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Tasks by stage"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H3
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.Primary
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =24
                              Width: =Parent.Width - 24
                              Height: =24
                        - imgPieTasks:
                            Control: Image@2.2.3
                            Properties:
                              ImagePosition: =ImagePosition.Fit
                              FillPortions: =1
                              LayoutMinHeight: =90
                              Width: =Parent.Width - 24
                              Height: =Parent.Height - 48
                              # DONUT + LEGEND IN ONE SVG. The legend has to live inside the
                              # picture: an Image is a single control, so there is nothing to
                              # hover and no per-slice click, and a five-row legend built from
                              # real controls would cost more than the chart.
                              #
                              # THE CATEGORY TABLE IS WRITTEN OUT, not derived with GroupBy.
                              # A group only exists when a row has that value, so GroupBy would
                              # drop empty stages, reorder the slices run to run, and change the
                              # colour of a stage between two refreshes. Written out, the
                              # vocabulary and the ordering are fixed. IT IS AN ALLOW-LIST AND
                              # IT FAILS CLOSED — a stage added to the SharePoint column and not
                              # added here is simply absent from the ring, and the totals stop
                              # summing to the row count.
                              #
                              # `cum` is the running total, which Power Fx has no primitive for:
                              # each row sums the rows with a LOWER index, named through `As r`
                              # so the inner Filter's scope cannot shadow the outer one.
                              Image: |
                                =With(
                                    { cats: AddColumns(
                                                Table( { i: 1, k: "Not Started", c: "#B9C0C8" },
                                                       { i: 2, k: "Planning",    c: "#6E7882" },
                                                       { i: 3, k: "Drafting",    c: "#005A9E" },
                                                       { i: 4, k: "Finalizing",  c: "#D69828" },
                                                       { i: 5, k: "Complete",    c: "#31825D" } ) As cat,
                                                n, CountRows( Filter(colMyTasks, task_stage.Value = cat.k) ) ) },
                                    With( { tot: Max(1, Sum(cats, n)) },
                                        With(
                                            { arcs: AddColumns( cats As r,
                                                        pct, r.n / tot * 100,
                                                        cum, Coalesce( Sum( Filter(cats, i < r.i), n ), 0 ) / tot * 100 ) },
                                            "data:image/svg+xml," & EncodeUrl(
                                                "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 104 40'>"
                                              & "<circle cx='20' cy='20' r='15.9155' fill='none' stroke='#EEF1F5'"
                                              & " stroke-width='4.5'/>"
                                              // stroke-dashoffset counts BACKWARDS: 25 puts the start of a
                                              // circumference-100 circle at 12 o'clock, and subtracting the
                                              // running total walks each slice round from there.
                                              & Concat( Filter(arcs, pct > 0),
                                                    "<circle cx='20' cy='20' r='15.9155' fill='none' stroke='" & c
                                                  & "' stroke-width='4.5' stroke-dasharray='"
                                                  & Text(pct, "[$-en-US]0.##", "en-US") & " "
                                                  & Text(100 - pct, "[$-en-US]0.##", "en-US")
                                                  & "' stroke-dashoffset='"
                                                  & Text(25 - cum, "[$-en-US]0.##", "en-US") & "'/>" )
                                              & "<text x='20' y='21.5' text-anchor='middle' font-size='9'"
                                              & " font-weight='600' font-family='Segoe UI, sans-serif' fill='#20262D'>"
                                              & CountRows(colMyTasks) & "</text>"
                                              & "<text x='20' y='26.5' text-anchor='middle' font-size='3.4'"
                                              & " font-family='Segoe UI, sans-serif' fill='#6E7882'>TASKS</text>"
                                              & Concat( arcs,
                                                    "<rect x='46' y='" & Text(i * 7 - 3.2, "[$-en-US]0.#", "en-US")
                                                  & "' width='4.2' height='4.2' rx='1' fill='" & c & "'/>"
                                                  & "<text x='52.5' y='" & (i * 7) & "' font-size='4.4'"
                                                  & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                                  & EncodeHTML(k) & "  " & n & "</text>" )
                                              & "</svg>" ) ) ) )
                  - pnlPieIssues:
