# =============================================================================
# scrHome  —  personal dashboard. Four read-only metric cards, two work lists,
# and a chart band. Column tokens resolve to schema/schema.yaml.
#
# EVERYTHING BELOW THE APP BAR IS ONE AUTO-LAYOUT TREE. No child carries an X or
# a Y, so nothing can collide at any window width and nothing here can be moved
# by a stray drag in Studio.
#
# BAND HEIGHTS (bodyRoot is Parent.Height for every direct child):
#     60   wrapHdr     section header + Refresh
#     96   rowCards    four metric cards
#     ...  rowLists    fills — my tasks | my issues
#    320   rowCharts   timeline + two pies + the completion ring
#   rowLists.Height = Parent.Height - 572, where 572 = 48 padding + 48 gaps
#   + 60 + 96 + 320. Change a band height and change that number with it.
#   rowCharts is the tall one because the timeline plots up to TEN rows at 20
#   units each — the viewBox grows with the row count, so a short panel would
#   render the WHOLE chart smaller rather than clip it.
#
# Component INSTANCES use the v3.0 dialect: `Control: CanvasComponent` +
# `ComponentName:` + `Properties:` (base props AND custom props; no Children).
# An instance cannot take FillPortions/LayoutMinWidth, so every instance inside
# an auto-layout container sits in a pinned GroupContainer wrapper.
# Screens read gTheme; components cannot, so components use literal colours.
#
# NOT RUNNABLE until the lists exist: a SharePoint data source can't be added to
# the app before its list is provisioned.
# =============================================================================
Screens:
  scrHome:
    Properties:
      Fill: =gTheme.Color.Bg
      # ---- One delegable pull per list, then local derivation ----------------
      # Narrow SERVER-side to a bounded set, then aggregate LOCALLY — Sum,
      # CountRows and Average never delegate to SharePoint.
      # Everything inside these Filters delegates: Person `.Email =`, Choice
      # `.Value =`, Lookup `.Id =`, and And/Or over them. `project_manager`,
      # `task_lead` and `issue_assignee` are all single Person and all indexed.
      #
      # TWO LIMITS TO KNOW:
      #  * A delegable Filter still returns at most the DATA ROW LIMIT into a
      #    collection — set Settings > General > Data row limit to 2000. (While
      #    testing, set it to 1: any non-delegable clause then shows up instantly.)
      #  * task_stage / issue_status are REQUIRED with defaults (C9), so no row is
      #    lost to a blank Choice — these counts miss nothing.
      OnVisible: |
        =
        // SELF-HEAL, and it is not belt-and-braces. App.OnStart is NON-BLOCKING, so this
        // screen can run before it finishes. A blank gUserEmail makes the Person filters
        // below match NOTHING, and these KPIs are imperative Sets — they run once and never
        // re-fire when the global later arrives, so the dashboard latches at zero until a
        // manual refresh. Declarative properties like gTheme self-heal; these cannot.
        If( IsBlank(gUserEmail), Set( gUserEmail, Lower(User().Email) ) );
        Concurrent(
            ClearCollect( colMyProjects,
                Filter( ActiveProjects, project_manager.Email = gUserEmail ) ),
            ClearCollect( colMyTasks,
                Filter( LiveTasks, task_lead.Email = gUserEmail ) ),
            ClearCollect( colMyIssues,
                // ASSIGNED TO ME, full stop. Do not add `|| issue_owner.Email =
                // gUserEmail`: issue_owner is not indexed, so an Or-arm on it drops
                // delegation for the WHOLE filter and silently truncates at 500 rows.
                // issue_assignee is the resolver; issue_owner only records who raised it.
                Filter( OpenIssues, issue_assignee.Email = gUserEmail ) )
        );
        Set( gPrjLed,
             CountRows( Filter(colMyProjects, project_phase.Value <> "Complete") ) );
        Set( gPrjLedOverdue,
             CountRows( Filter( colMyProjects,
                 project_phase.Value <> "Complete"
              && !IsBlank(project_date_target) && project_date_target < Today() ) ) );
        Set( gTaskLed,
             CountRows( Filter(colMyTasks, task_stage.Value <> "Complete") ) );
        Set( gTaskLedOverdue,
             CountRows( Filter( colMyTasks,
                 task_stage.Value <> "Complete"
              && !IsBlank(task_date_target) && task_date_target < Today() ) ) );
        // ONE DELEGABLE QUERY PER PROJECT, not one query over a set. There is no
        // "issue_project_manager" to filter on, and `issue_project_id.Id in
        // colMyProjects.ID` does NOT delegate — it would cap at the data row limit and
        // undercount without saying so. ForAll runs each arm server-side instead; the
        // cost is one round trip per project managed, so this grows with how many
        // projects one person owns, not with the size of the issues list.
        Set( gIssLed,
             Coalesce( Sum( ForAll( colMyProjects As p,
                                    CountRows( Filter( OpenIssues,
                                                       issue_project_id.Id = p.ID ) ) ),
                            Value ),
                       0 ) );
        Set( gIssMine, CountRows(colMyIssues) );
        Set( gMyPercent,
             If( CountRows(colMyTasks) = 0, 0,
                 RoundDown( Average( AddColumns( colMyTasks, wgt,
                     Coalesce(LookUp(gStageWeights, Stage = task_stage.Value, Weight), 0) ), wgt ), 0 ) ) );
        // ---- Timeline rows -------------------------------------------------
        // BUILT AS COLLECTIONS, not inline in the chart's Image formula. Across a
        // one-way gap a chart that draws nothing is indistinguishable from a chart
        // whose data never arrived; a collection can be opened in Studio's
        // Collections pane, so this splits "the maths is wrong" from "there is
        // nothing to plot".
        //
        // `Sequence(CountRows(...))` + `Index(...)` is the only way a row gets a
        // POSITION, which is what a y-coordinate needs. The count comes from the
        // same table Index reads, so Index can never be out of range — it ERRORS
        // out of range, it does not return blank.
        ClearCollect( colTlSrc,
            FirstN( Sort( Filter( colMyProjects,
                                  project_phase.Value <> "Complete"
                               && !IsBlank(project_date_target) ),
                          project_date_target ), 10 ) );
        Clear( colTimeline );
        Collect( colTimeline,
            ForAll( Sequence( CountRows(colTlSrc) ) As s,
                With( { r: Index(colTlSrc, s.Value) },
                    { idx: s.Value,
                      nm:  r.project_name,
                      d0:  Coalesce(r.project_date_start, Today()),
                      d1:  r.project_date_target } ) ) );
        // colTlSrc is sorted ASCENDING, so First and Last ARE the date range.
        // Min/Max over a date column would come back as a number.
        Set( gTlStart, If( IsEmpty(colTlSrc) || First(colTlSrc).project_date_target >= Today(),
                           Today(), First(colTlSrc).project_date_target ) );
        Set( gTlEnd,   If( IsEmpty(colTlSrc), DateAdd(Today(), 30, TimeUnit.Days),
                           Last(colTlSrc).project_date_target ) );
        Set( gTlSpan,  Max( 7, DateDiff(gTlStart, gTlEnd, TimeUnit.Days) ) )
    Children:
      - bodyRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Start
            LayoutGap: =gTheme.Space.Gap
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =gTheme.Space.Gutter
            PaddingBottom: =gTheme.Space.Gutter
            PaddingLeft: =gTheme.Space.Gutter
            PaddingRight: =gTheme.Space.Gutter
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH
          Children:
            # ---- Header + Refresh ------------------------------------------
            # cmpSectionHeader carries ONE action button, so a second action has to
            # be a sibling. The header sits in a flexible wrapper — a CanvasComponent
            # instance cannot take FillPortions itself — and New project is pinned to
            # the right of it, which lands it immediately beside Refresh Stats.
            - wrapHdr:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =gTheme.Space.Gap
                  FillPortions: =0
                  LayoutMinHeight: =60
                  Width: =Parent.Width - 48
                  Height: =60
                Children:
                  - wrapHdrTitle:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =0
                        FillPortions: =1
                        LayoutMinWidth: =320
                        Height: =60
                      Children:
                        - hdrMyWork:
                            Control: CanvasComponent
                            ComponentName: cmpSectionHeader
                            Properties:
                              Width: =Parent.Width
                              Height: =60
                              Title: ="My work"
                              Subtitle: ="Everything you lead or own, across every open project"
                              ShowAction: =true
                              ActionLabel: ="Refresh Stats"
                              # THIS BLOCK MUST STAY IDENTICAL TO OnVisible ABOVE. There is no
                              # shared function to call: a divergence shows up as the dashboard
                              # reading one set of numbers on open and a different set after a
                              # Refresh, with nothing to say which is right.
                              OnAction: |
                                =Refresh(taskmaster_projects); Refresh(taskmaster_tasks); Refresh(taskmaster_issues);
                                Concurrent(
                                    ClearCollect( colMyProjects,
                                        Filter( ActiveProjects, project_manager.Email = gUserEmail ) ),
                                    ClearCollect( colMyTasks,
                                        Filter( LiveTasks, task_lead.Email = gUserEmail ) ),
                                    ClearCollect( colMyIssues,
                                        Filter( OpenIssues, issue_assignee.Email = gUserEmail ) )
                                );
                                Set( gPrjLed,
                                     CountRows( Filter(colMyProjects, project_phase.Value <> "Complete") ) );
                                Set( gPrjLedOverdue,
                                     CountRows( Filter( colMyProjects,
                                         project_phase.Value <> "Complete"
                                      && !IsBlank(project_date_target) && project_date_target < Today() ) ) );
                                Set( gTaskLed,
                                     CountRows( Filter(colMyTasks, task_stage.Value <> "Complete") ) );
                                Set( gTaskLedOverdue,
                                     CountRows( Filter( colMyTasks,
                                         task_stage.Value <> "Complete"
                                      && !IsBlank(task_date_target) && task_date_target < Today() ) ) );
                                Set( gIssLed,
                                     Coalesce( Sum( ForAll( colMyProjects As p,
                                                            CountRows( Filter( OpenIssues,
                                                                               issue_project_id.Id = p.ID ) ) ),
                                                    Value ),
                                               0 ) );
                                Set( gIssMine, CountRows(colMyIssues) );
                                Set( gMyPercent,
                                     If( CountRows(colMyTasks) = 0, 0,
                                         RoundDown( Average( AddColumns( colMyTasks, wgt,
                                             Coalesce(LookUp(gStageWeights, Stage = task_stage.Value, Weight), 0) ), wgt ), 0 ) ) );
                                // ---- Timeline rows -------------------------------------------------
                                // BUILT AS COLLECTIONS, not inline in the chart's Image formula. Across a
                                // one-way gap a chart that draws nothing is indistinguishable from a chart
                                // whose data never arrived; a collection can be opened in Studio's
                                // Collections pane, so this splits "the maths is wrong" from "there is
                                // nothing to plot".
                                //
                                // `Sequence(CountRows(...))` + `Index(...)` is the only way a row gets a
                                // POSITION, which is what a y-coordinate needs. The count comes from the
                                // same table Index reads, so Index can never be out of range — it ERRORS
                                // out of range, it does not return blank.
                                ClearCollect( colTlSrc,
                                    FirstN( Sort( Filter( colMyProjects,
                                                          project_phase.Value <> "Complete"
                                                       && !IsBlank(project_date_target) ),
                                                  project_date_target ), 10 ) );
                                Clear( colTimeline );
                                Collect( colTimeline,
                                    ForAll( Sequence( CountRows(colTlSrc) ) As s,
                                        With( { r: Index(colTlSrc, s.Value) },
                                            { idx: s.Value,
                                              nm:  r.project_name,
                                              d0:  Coalesce(r.project_date_start, Today()),
                                              d1:  r.project_date_target } ) ) );
                                // colTlSrc is sorted ASCENDING, so First and Last ARE the date range.
                                // Min/Max over a date column would come back as a number.
                                Set( gTlStart, If( IsEmpty(colTlSrc) || First(colTlSrc).project_date_target >= Today(),
                                                   Today(), First(colTlSrc).project_date_target ) );
                                Set( gTlEnd,   If( IsEmpty(colTlSrc), DateAdd(Today(), 30, TimeUnit.Days),
                                                   Last(colTlSrc).project_date_target ) );
                                Set( gTlSpan,  Max( 7, DateDiff(gTlStart, gTlEnd, TimeUnit.Days) ) );
                                Set(gToastShow, false);
                                Set(gToastMsg, "Refreshed"); Set(gToastTone, "Info"); Set(gToastShow, true)
                  - btnNewProject:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="+  New project"
                        Fill: =gTheme.Color.Surface
                        Color: =gTheme.Color.Primary
                        HoverFill: =gTheme.Color.Hover
                        PressedFill: =gTheme.Color.Press
                        BorderColor: =gTheme.Color.Primary
                        BorderThickness: =1
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Body
                        FillPortions: =0
                        LayoutMinWidth: =150
                        Width: =150
                        Height: =36
                        # gSelProject is cleared too: the child edit screens pre-attach
                        # to it, and a stale selection would silently parent the new
                        # project's children to the last project opened.
                        OnSelect: |
                          =Set( gEditMode, "New" );
                           Set( gEditProject, Blank() );
                           Set( gSelProject, Blank() );
                           Navigate( scrProjectEdit, ScreenTransition.Cover )
            # ---- Metric cards ----------------------------------------------
            # PLAIN CONTAINERS, NOT cmpStatusCard. The component carries a
            # full-bleed transparent button with a hover wash, so it reads as
            # tappable; these four are deliberately inert.
            - rowCards:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =gTheme.Space.Gap
                  FillPortions: =0
                  LayoutMinHeight: =96
                  Width: =Parent.Width - 48
                  Height: =96
                Children:
                  - cardPrjLed:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =2
                        PaddingTop: =12
                        PaddingBottom: =10
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =190
                        Height: =96
                      Children:
                        - lblPrjLedCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Projects led"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width - 32
                              Height: =18
                        - lblPrjLedVal:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Text(gPrjLed)
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H1
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =34
                              Width: =Parent.Width - 32
                              Height: =34
                        - lblPrjLedSub:
                            Control: Label@2.5.1
                            Properties:
                              # A percentage of nothing is not 0%, it is undefined —
                              # say so rather than print a reassuring zero.
                              Text: |
                                =If( gPrjLed = 0, "none open",
                                     RoundDown(gPrjLedOverdue / gPrjLed * 100, 0) & "% overdue" )
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: |
                                =If(gPrjLedOverdue > 0, gTheme.Color.Danger, gTheme.Color.TextMuted)
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =16
                              Width: =Parent.Width - 32
                              Height: =16
                  - cardTaskLed:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =2
                        PaddingTop: =12
                        PaddingBottom: =10
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =190
                        Height: =96
                      Children:
                        - lblTaskLedCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Tasks led"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width - 32
                              Height: =18
                        - lblTaskLedVal:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Text(gTaskLed)
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H1
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =34
                              Width: =Parent.Width - 32
                              Height: =34
                        - lblTaskLedSub:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                =If( gTaskLed = 0, "none open",
                                     RoundDown(gTaskLedOverdue / gTaskLed * 100, 0) & "% overdue" )
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: |
                                =If(gTaskLedOverdue > 0, gTheme.Color.Danger, gTheme.Color.TextMuted)
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =16
                              Width: =Parent.Width - 32
                              Height: =16
                  - cardIssLed:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =2
                        PaddingTop: =12
                        PaddingBottom: =10
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =190
                        Height: =96
                      Children:
                        - lblIssLedCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Open Issues on my Projects"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width - 32
                              Height: =18
                        - lblIssLedVal:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Text(gIssLed)
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H1
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =34
                              Width: =Parent.Width - 32
                              Height: =34
                  - cardIssMine:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =2
                        PaddingTop: =12
                        PaddingBottom: =10
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =190
                        Height: =96
                      Children:
                        - lblIssMineCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Issues Owned and Still Open"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width - 32
                              Height: =18
                        - lblIssMineVal:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Text(gIssMine)
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H1
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =34
                              Width: =Parent.Width - 32
                              Height: =34
            # ---- Work lists ------------------------------------------------
            - rowLists:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =gTheme.Space.Gap
                  FillPortions: =1
                  LayoutMinHeight: =220
                  Width: =Parent.Width - 48
                  Height: =Parent.Height - 572
                Children:
                  - secMyTasks:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =8
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        # 480 IS NOT ROUND, IT IS THE TASK ROW'S FLOOR PLUS THE PANEL:
                        # 22 + 70 + 130 + 100 + 70 columns, 40 of gaps, 16 of row padding,
                        # 32 of panel padding. Raising it further would make rowLists the
                        # widest band on the screen; rowCharts is 978 and this pair is 976,
                        # so the charts still govern the minimum width and nothing clips.
                        FillPortions: =1
                        LayoutMinWidth: =480
                        Height: =Parent.Height
                      Children:
                        - lblMyTasksTitle:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Open tasks I lead   (" & gTaskLed & ")"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H3
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.Primary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =28
                              Width: =Parent.Width - 32
                              Height: =28
                        - lblMyTasksEmpty:
                            Control: Label@2.5.1
                            Properties:
                              Visible: =IsEmpty(galMyTasks.AllItems)
                              Text: ="Nothing open — no task on any live project has you as its lead."
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =24
                              Width: =Parent.Width - 32
                              Height: =24
                        - galMyTasks:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                            Properties:
                              # colMyTasks is a LOCAL collection, so `<>` and the
                              # composite sort cost nothing — neither has to delegate.
                              #
                              # ONE composite sort key, not two chained Sorts: Power Fx
                              # does not guarantee a stable sort, so a second Sort could
                              # undo the first. priority * 100000 dominates, the day count
                              # breaks ties within a priority, and +50000 keeps an overdue
                              # (negative) count positive. No target date sorts last inside
                              # its own priority band rather than first.
                              Items: |
                                =Sort( Filter(colMyTasks, task_stage.Value <> "Complete"),
                                       Switch( task_priority.Value,
                                               "Critical", 1, "High", 2,
                                               "Moderate", 3, "Low", 4, 5 ) * 100000
                                       + If( IsBlank(task_date_target), 99999,
                                             DateDiff(Today(), task_date_target, TimeUnit.Days) + 50000 ) )
                              WrapCount: =1
                              TemplateSize: =48
                              TemplatePadding: =0
                              TemplateFill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              ShowScrollbar: =true
                              FillPortions: =1
                              LayoutMinHeight: =120
                              Width: =Parent.Width - 32
                              Height: =Parent.Height - 76
                            Children:
                              - rowMyTaskBody:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =10
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =Parent.TemplateHeight - 1
                                  Children:
                                    # INLINE SVG, NOT A COMPONENT. A canvas component
                                    # cannot be placed inside a gallery template — Studio
                                    # refuses the paste.
                                    #
                                    # LIFECYCLE glyph, bound to task_stage — the same
                                    # progression scrProject and scrProjects use.
                                    # task_status is a separate RAG health column and is
                                    # NOT what this shows.
                                    #
                                    # HEX TEXT, not gTheme.Color.*: these drop straight
                                    # into the SVG string and Power Fx has no Color-to-hex
                                    # conversion. Primary #005A9E · Success #31825D ·
                                    # Warning #D69828 · TextMuted #6E7882.
                                    - icoMyTaskStage:
                                        Control: Image@2.2.3
                                        Properties:
