                                                                   / tot * 1000, 0 ) ),
                                              // The legend lists only categories that HAVE rows, so it needs
                                              // its own 1..n ordinal — `i` is the fixed slot in the vocabulary
                                              // and would leave a blank line wherever a value is unused.
                                              leg: ForAll( Sequence( CountRows(Filter(cats, n > 0)) ) As s,
                                                       With( { g: Index(Filter(cats, n > 0), s.Value) },
                                                           { j: s.Value, lk: g.k, ln: g.n, lc: g.c } ) ) },
                                            "data:image/svg+xml," & EncodeUrl(
                                                // HEIGHT GROWS WITH THE LEGEND so the chart stays close to
                                                // square and fills a third-width panel. The ring's radius is
                                                // FIXED at 159.155 — that is what makes the circumference
                                                // exactly 1000, which the integer dasharray depends on.
                                                "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 440 "
                                              & (410 + CountRows(leg) * 34 + 12) & "'>"
                                              & "<circle cx='220' cy='200' r='159.155' fill='none'"
                                              & " stroke='#EEF1F5' stroke-width='40'/>"
                                              & Concat( Filter(arcs, u > 0),
                                                    "<circle cx='220' cy='200' r='159.155' fill='none' stroke='" & c
                                                  & "' stroke-width='40' stroke-dasharray='"
                                                  & u & " " & (1000 - u)
                                                  & "' stroke-dashoffset='" & Mod(1250 - uc, 1000) & "'/>" )
                                              & "<text x='220' y='215' text-anchor='middle' font-size='90'"
                                              & " font-weight='600' font-family='Segoe UI, sans-serif' fill='#20262D'>"
                                              & CountRows(colMyIssues) & "</text>"
                                              & "<text x='220' y='262' text-anchor='middle' font-size='34'"
                                              & " font-family='Segoe UI, sans-serif' fill='#6E7882'>ISSUES</text>"
                                              & Concat( leg,
                                                    "<rect x='120' y='" & (410 + (j - 1) * 34 + 4)
                                                  & "' width='26' height='26' rx='6' fill='" & lc & "'/>"
                                                  & "<text x='158' y='" & (410 + (j - 1) * 34 + 24) & "' font-size='28'"
                                                  & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                                  & EncodeHTML(lk) & "  " & ln & "</text>" )
                                              & "</svg>" ) ) ) )
                  # THE ONE REAL VISUAL in this band — the licence-free completion
                  # ring. It is WRAPPED because FillPortions and LayoutMinWidth are
                  # proven on GroupContainer but NOT on a CanvasComponent instance,
                  # and the contract check rejects them there. Without a pinned
                  # wrapper the ring defaults to FillPortions 1 and stretches.
                  - pnlRing:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        PaddingTop: =12
                        PaddingBottom: =12
                        # NO SIDE PADDING: padding eats the inner width first, and at
                        # the floor below that would clip the ring rather than inset it.
                        PaddingLeft: =0
                        PaddingRight: =0
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        # ONE OF THREE EQUAL THIRDS. Same FillPortions and the same floor
                        # as the two donut panels, so whatever the timeline does not take
                        # is divided evenly between them. Row minimum is
                        # 300 + 210 + 210 + 210 + 48 = 978.
                        FillPortions: =1
                        LayoutMinWidth: =210
                        Height: =Parent.Height
                      Children:
                        - wrapRing:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Center
                              # LayoutMinWidth, NOT LayoutMinHeight. This wrapper sits in a
                              # VERTICAL parent, so height is the main axis and width is the
                              # cross axis — the floor that keeps the ring from being squeezed
                              # is the width one.
                              #
                              # SQUARE, AND AS BIG AS THE PANEL ALLOWS. Whichever of the two
                              # is scarcer decides: 84 is the caption plus the gap plus the
                              # top and bottom padding, so this is the largest circle that
                              # still leaves the caption its two lines.
                              FillPortions: =0
                              LayoutMinWidth: =100
                              Width: =Max( 100, Min(Parent.Width, Parent.Height - 84) )
                              Height: =Max( 100, Min(Parent.Width, Parent.Height - 84) )
                            Children:
                              - ringHome:
                                  Control: CanvasComponent
                                  ComponentName: cmpKpiRing
                                  Properties:
                                    Width: =Parent.Width
                                    Height: =Parent.Height
                                    Percent: =gMyPercent
                                    Label: =gMyPercent & "%"
                                    AccentHex: ="#005A9E"
                                    TrackHex: ="#E1E5EB"
                        - lblRing:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                ="Weighted completion across " & CountRows(colMyTasks) & " task(s) you lead"
                              Font: =gTheme.Font
                              # A LITERAL 10, not gTheme.Size.Small — the theme's smallest
                              # step is 12 and this caption has to wrap to three lines
                              # inside a 126px column without clipping.
                              Size: =10
                              Color: =gTheme.Color.TextMuted
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =52
                              Width: =Parent.Width - 8
                              Height: =52
      - cmpToastHome:
          Control: CanvasComponent
          ComponentName: cmpToast
          Properties:
            Visible: =gToastShow
            IsOpen: =gToastShow
            X: =Parent.Width - 340 - gTheme.Space.Gutter
            Y: =Parent.Height - 56 - gTheme.Space.Gutter
            Width: =340
            Height: =56
            Message: =gToastMsg
            Tone: =gToastTone
            Duration: =3000
            OnDismiss: =Set(gToastShow, false)
      # ---- The whole shell is one component: header bar + fly-out nav rail ----
      # DECLARED LAST so positional z-order floats the fly-out over the content.
      #
      # Height is dynamic and that is the whole trick: a component intercepts every
      # click inside its bounds, so closed it must own nothing but the 64px header
      # strip. Open, covering the screen is exactly right — the scrim wants the click.
      #
      # cmpAppBar cannot Navigate (a component can't see app screens), so it reports
      # the chosen entry and this screen does the navigating.
      - appBar:
          Control: CanvasComponent
          ComponentName: cmpAppBar
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =If(gNavOpen, Parent.Height, gTheme.Space.HeaderH)
            Items: =gNavMenu
            ActiveKey: =1
            AppTitle: ="EQD Taskmaster"
            ScreenTitle: ="Home"
            IsOpen: =gNavOpen
            OnToggle: =Set(gNavOpen, !gNavOpen)
            OnNavigate: |
              =Switch( appBar.SelectedKey,
                       1, Navigate(scrHome, ScreenTransition.Fade),
                       2, Navigate(scrReports, ScreenTransition.Fade),
                       3, Navigate(scrProjects, ScreenTransition.Fade),
                          Navigate(scrReference, ScreenTransition.Fade) );
              Set(gNavOpen, false)
