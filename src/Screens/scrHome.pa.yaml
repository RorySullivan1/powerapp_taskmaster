                                      Set( gSelProject,
                                           LookUp(taskmaster_projects, ID = ThisItem.issue_project_id.Id) );
                                      If( IsBlank(gSelProject.ID),
                                          Notify( "That issue's project is no longer available. Refresh the dashboard.",
