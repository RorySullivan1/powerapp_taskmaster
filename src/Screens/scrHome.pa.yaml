# =============================================================================
# scrHome — personal dashboard. Four read-only metric cards, three work lists and
# a chart band. Column tokens resolve to schema/schema.yaml.
#
# EVERYTHING BELOW THE APP BAR IS ONE AUTO-LAYOUT TREE. No child carries an X or a
# Y, so nothing can collide at any width and a stray drag in Studio cannot move it.
#   rowLists.Height = Parent.Height - 572, where 572 = 48 padding + 48 gaps + 60
#   wrapHdr + 96 rowCards + 320 rowCharts. Change a band height, change that number.
#
# FIVE RULES THIS SCREEN BREAKS IF THEY ARE IGNORED:
#  1. Narrow SERVER-side, aggregate LOCALLY — Sum, CountRows and Average never
#     delegate. A delegable Filter still returns at most the DATA ROW LIMIT into a
#     collection, so Settings > General > Data row limit must be 2000.
#  2. EVERY VALUE POWER FX FEEDS AN SVG ATTRIBUTE IS A WHOLE NUMBER. A fraction has
#     to go through Text(), which drags the viewer's decimal separator into the
#     attribute; an attribute Power Fx cannot render comes out EMPTY, and an empty
#     stroke-dasharray draws a SOLID RING, not a thin arc. viewBoxes are scaled up
#     until integer precision is enough.
#  3. CATEGORY TABLES ARE WRITTEN OUT, never derived with GroupBy. A group only
#     exists when a row has that value, so GroupBy drops empty categories, reorders
#     slices run to run, and changes a category's colour between refreshes. Each
#     table carries an "Other" bucket so a drifted vocabulary shows as a labelled
#     slice instead of a ring that quietly renders the wrong proportions.
#  4. A CanvasComponent instance cannot take FillPortions or LayoutMinWidth, so
#     every instance inside an auto-layout container sits in a pinned wrapper.
#     Screens read gTheme; components cannot, so components use literal colours.
#  5. A gallery's own OnSelect does not reliably fire when the click lands on a
#     child control — every row's action is on a transparent full-template button
#     declared LAST, and re-reads the row from the list rather than taking ThisItem.
# =============================================================================
Screens:
  scrHome:
    Properties:
      Fill: =gTheme.Color.Bg
      # THIN ON PURPOSE. The whole dashboard fold lives in btnHomeRecompute's OnSelect —
      # two callers, one copy of the block.
      OnVisible: |
        =
        // SELF-HEAL, and not belt-and-braces. App.OnStart is NON-BLOCKING, so this screen can
        // run before it finishes. A blank gUserEmail makes the fold's Person filters match
        // NOTHING, and those KPIs are imperative Sets that never re-fire — the dashboard
        // latches at zero until a manual refresh. Declarative properties self-heal; these cannot.
        If( IsBlank(gUserEmail), Set( gUserEmail, Lower(User().Email) ) );
        // KEEP Select LAST. It QUEUES the target OnSelect for after this formula finishes
        // rather than running it inline, so the seed above is guaranteed to have landed
        // before the fold reads gUserEmail — but nothing written after it can be relied on
        // to run before the fold.
        Select( btnHomeRecompute )
    Children:
      # =====================================================================
      # THE DASHBOARD FOLD — hidden, 1x1, declared FIRST so it can never cover a
      # control (z-order is positional here). Two callers: OnVisible and the section
      # header's Refresh Stats action.
      #
      # IT IS A CONTROL because Power Fx cannot name a behaviour block and this one has
      # more than one caller; a control's OnSelect is the only reusable behaviour unit
      # there is. Visible:=false IS GROUNDED, not folklore — tests/scrProbeRerun scored
      # Select() on visible, 1x1-transparent and hidden buttons identically (Studio,
      # 2026-08-18). Do not "fix" it into a 1x1 transparent button.
      # =====================================================================
      - btnHomeRecompute:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Visible: =false
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            X: =0
            Y: =0
            Width: =1
            Height: =1
            OnSelect: |
              =Concurrent(
                  ClearCollect( colMyProjects,
                      Filter( ActiveProjects, project_manager.Email = gUserEmail ) ),
                  ClearCollect( colMyTasks,
                      Filter( LiveTasks, task_lead.Email = gUserEmail ) ),
                  ClearCollect( colMyIssues,
                      // ASSIGNED TO ME, full stop. Do not add `|| issue_owner.Email = gUserEmail`:
                      // issue_owner is not indexed, so an Or-arm on it drops delegation for the WHOLE
                      // filter and silently truncates at 500 rows.
                      Filter( OpenIssues, issue_assignee.Email = gUserEmail ) ),
                  // THE NAME MAP the two work-list galleries resolve their parent project against.
                  // task_project_id and issue_project_id are Lookup columns and the canvas connector
                  // displays the NUMERIC ID, so the name has to be resolved app-side either way; the
                  // only question is once per screen or once per visible row.
                  //
                  // EVERY ACTIVE PROJECT, not colMyProjects — a task I lead can hang off a project
                  // someone else manages. ForAll projection, NOT ShowColumns: ShowColumns over
                  // anything rooted in a named formula reads text columns back as an ERROR type,
                  // and project_name is exactly the column that burned it before.
                  ClearCollect( colPrjNames,
                      ForAll( ActiveProjects As p, { ID: p.ID, project_name: p.project_name } ) ),
                  // THE OPEN-ISSUE -> PROJECT MAP, so gIssLed below can be counted locally instead
                  // of with one server query per project managed. OpenIssues is already the app's
                  // narrowest issue set, so this is as small as the fetch gets. ForAll projection
                  // rather than ShowColumns, for the reason given on colPrjNames.
                  ClearCollect( colIssByPrj,
                      ForAll( OpenIssues As i, { PId: i.issue_project_id.Id } ) )
              );
              Set( gPrjLed,
                   CountRows( Filter(colMyProjects, project_phase.Value <> "Complete") ) );
              Set( gPrjLedOverdue,
                   CountRows( Filter( colMyProjects,
                       project_phase.Value <> "Complete"
                    && !IsBlank(project_date_target) && project_date_target < Today() ) ) );
              Set( gTaskLed,
                   CountRows( Filter(colMyTasks, task_stage.Value <> "Completed") ) );
              Set( gTaskLedOverdue,
                   CountRows( Filter( colMyTasks,
                       task_stage.Value <> "Completed"
                    && !IsBlank(task_date_target) && task_date_target < Today() ) ) );
              // COUNTED LOCALLY OFF colIssByPrj, with the per-project queries kept as the OVERFLOW
              // FALLBACK — both arms are here on purpose and neither is dead.
              //
              // There is no "issue_project_manager" to filter on, and
              // `issue_project_id.Id in colMyProjects.ID` does NOT delegate, so the only exact
              // server-side shape is one delegable query PER PROJECT MANAGED — on the dashboard's
              // critical path, on every open and every refresh. colIssByPrj answers the same
              // question in one fetch.
              //
              // But a delegable Filter still returns at most the DATA ROW LIMIT, so once open
              // issues reach 2000 the map is a partial page and a local count would UNDERCOUNT
              // WITH NO SIGN OF IT. At the limit, pay the queries rather than report a wrong
              // number. If arms are lazily evaluated, so the fallback costs nothing below it.
              Set( gIssLed,
                   If( CountRows(colIssByPrj) >= 2000,
                       Coalesce( Sum( ForAll( colMyProjects As p,
                                              CountRows( Filter( OpenIssues,
                                                                 issue_project_id.Id = p.ID ) ) ),
                                      Value ),
                                 0 ),
                       Coalesce( Sum( ForAll( colMyProjects As p,
                                              CountRows( Filter( colIssByPrj, PId = p.ID ) ) ),
                                      Value ),
                                 0 ) ) );
              Set( gIssMine, CountRows(colMyIssues) );
              Set( gMyPercent,
                   If( CountRows(colMyTasks) = 0, 0,
                       RoundDown( Average( AddColumns( colMyTasks, wgt,
                           Coalesce(LookUp(gStageWeights, Stage = task_stage.Value, Weight), 0) ), wgt ), 0 ) ) );
              // ---- Chart source: open tasks I lead ---------------------------------
              // ONE FOLD FOR BOTH CHARTS, so they cannot disagree about what "open" means.
              // Health is EFFECTIVE health — the stored issue-derived half with overdue folded in,
              // per rollups.task_health in schema.yaml — resolved once here, not per slice.
              // dd is CLAMPED to -10..+10 so one task six months out cannot set the scale; the end
              // buckets mean "10 or more". No target date gets 9999, lands in no bucket, and is
              // counted separately — a distribution that silently drops rows misstates its total.
              ClearCollect( colDueSrc,
                  ForAll( Filter(colMyTasks, task_stage.Value <> "Completed") As t,
                      { hl: If( !IsBlank(t.task_date_target) && t.task_date_target < Today(),
                                "Red", Coalesce(t.task_status.Value, "") ),
                        dd: If( IsBlank(t.task_date_target), 9999,
                                Max( -10, Min( 10, DateDiff(Today(), t.task_date_target, TimeUnit.Days) ) ) ) } ) );
              Set( gDueNoDate, CountRows( Filter(colDueSrc, dd = 9999) ) );
              // 21 BUCKETS, WRITTEN OUT. A bucket only exists when a row has that value, so
              // grouping would CLOSE UP the gaps — and a gap at zero tasks is what a distribution
              // exists to show.
              ClearCollect( colDueBuckets,
                  ForAll( Sequence(21) As s,
                      With( { dv: s.Value - 11 },
                          { i: s.Value, d: dv,
                            n: CountRows( Filter(colDueSrc, dd = dv) ) } ) ) )
      - bodyRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Start
            LayoutGap: =gTheme.Space.Gap
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =gTheme.Space.Gutter
            PaddingBottom: =gTheme.Space.Gutter
            PaddingLeft: =gTheme.Space.Gutter
            PaddingRight: =gTheme.Space.Gutter
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH
          Children:
            # cmpSectionHeader carries ONE action button, so a second action has to be a
            # sibling. The header sits in a flexible wrapper; New project is pinned right of it.
            - wrapHdr:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =gTheme.Space.Gap
                  FillPortions: =0
                  LayoutMinHeight: =60
                  Width: =Parent.Width - 48
                  Height: =60
                Children:
                  - wrapHdrTitle:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =0
                        FillPortions: =1
                        LayoutMinWidth: =320
                        Height: =60
                      Children:
                        - hdrMyWork:
                            Control: CanvasComponent
                            ComponentName: cmpSectionHeader
                            Properties:
                              Width: =Parent.Width
                              Height: =60
                              Title: ="My work"
                              Subtitle: ="Everything you lead or own, across every open project"
                              ShowAction: =true
                              ActionLabel: ="Refresh Stats"
                              # THE SAME FOLD THE SCREEN OPENS WITH — btnHomeRecompute, not a copy of
                              # it. This handler is authored in SCREEN scope even though it hangs off a
                              # component instance, which is what lets it name a sibling screen control.
                              #
                              # THE TOAST FIRES BEFORE THE NUMBERS LAND, deliberately. Select QUEUES the
                              # fold for after this formula finishes, so no statement written after it can
                              # run later than the fold; "Refreshed" therefore means the refresh was
                              # issued. Do not move the toast into btnHomeRecompute to "fix" the order —
                              # it would then fire on every screen open too.
                              OnAction: |
                                =Concurrent( Refresh(taskmaster_projects),
                                             Refresh(taskmaster_tasks),
                                             Refresh(taskmaster_issues) );
                                Set(gToastShow, false);
                                Set(gToastMsg, "Refreshed"); Set(gToastTone, "Info"); Set(gToastShow, true);
                                Select( btnHomeRecompute )
                  - btnNewProject:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="+  New project"
                        Fill: =gTheme.Color.Surface
                        Color: =gTheme.Color.Primary
                        HoverFill: =gTheme.Color.Hover
                        PressedFill: =gTheme.Color.Press
                        BorderColor: =gTheme.Color.Primary
                        BorderThickness: =1
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Body
                        FillPortions: =0
                        LayoutMinWidth: =150
                        Width: =150
                        Height: =36
                        # gSelProject is cleared too: the child edit screens pre-attach to it,
                        # and a stale selection would parent the new project's children to the
                        # last project opened.
                        OnSelect: |
                          =Set( gEditMode, "New" );
                           Set( gEditProject, Blank() );
                           Set( gSelProject, Blank() );
                           Navigate( scrProjectEdit, ScreenTransition.Cover )
            # PLAIN CONTAINERS, NOT cmpStatusCard. The component carries a full-bleed
            # transparent button with a hover wash, so it reads as tappable; these are inert.
            - rowCards:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =gTheme.Space.Gap
                  FillPortions: =0
                  LayoutMinHeight: =96
                  Width: =Parent.Width - 48
                  Height: =96
                Children:
                  - cardPrjLed:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =2
                        PaddingTop: =12
                        PaddingBottom: =10
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =190
                        Height: =96
                      Children:
                        - lblPrjLedCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Projects led"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width - 32
                              Height: =18
                        - lblPrjLedVal:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Text(gPrjLed)
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H1
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =34
                              Width: =Parent.Width - 32
                              Height: =34
                        - lblPrjLedSub:
                            Control: Label@2.5.1
                            Properties:
                              # A percentage of nothing is not 0%, it is undefined — say so.
                              Text: |
                                =If( gPrjLed = 0, "none open",
                                     RoundDown(gPrjLedOverdue / gPrjLed * 100, 0) & "% overdue" )
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: |
                                =If(gPrjLedOverdue > 0, gTheme.Color.Danger, gTheme.Color.TextMuted)
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =16
                              Width: =Parent.Width - 32
                              Height: =16
                  - cardTaskLed:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =2
                        PaddingTop: =12
                        PaddingBottom: =10
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =190
                        Height: =96
                      Children:
                        - lblTaskLedCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Tasks led"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width - 32
                              Height: =18
                        - lblTaskLedVal:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Text(gTaskLed)
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H1
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =34
                              Width: =Parent.Width - 32
                              Height: =34
                        - lblTaskLedSub:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                =If( gTaskLed = 0, "none open",
                                     RoundDown(gTaskLedOverdue / gTaskLed * 100, 0) & "% overdue" )
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: |
                                =If(gTaskLedOverdue > 0, gTheme.Color.Danger, gTheme.Color.TextMuted)
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =16
                              Width: =Parent.Width - 32
                              Height: =16
                  - cardIssLed:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =2
                        PaddingTop: =12
                        PaddingBottom: =10
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =190
                        Height: =96
                      Children:
                        - lblIssLedCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Open Issues on my Projects"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width - 32
                              Height: =18
                        - lblIssLedVal:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Text(gIssLed)
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H1
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =34
                              Width: =Parent.Width - 32
                              Height: =34
                  - cardIssMine:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =2
                        PaddingTop: =12
                        PaddingBottom: =10
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =190
                        Height: =96
                      Children:
                        - lblIssMineCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Issues Owned and Still Open"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width - 32
                              Height: =18
                        - lblIssMineVal:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Text(gIssMine)
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H1
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =34
                              Width: =Parent.Width - 32
                              Height: =34
            # ---- Work lists ------------------------------------------------
            - rowLists:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =gTheme.Space.Gap
                  FillPortions: =1
                  LayoutMinHeight: =220
                  Width: =Parent.Width - 48
                  Height: =Parent.Height - 572
                Children:
                  # PROJECTS FIRST, then the work under them. Fewer columns than the two beside
                  # it — the row IS the parent — so it takes the smaller share.
                  - secMyProjects:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =8
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =2
                        LayoutMinWidth: =340
                        Height: =Parent.Height
                      Children:
                        - lblMyProjectsTitle:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Projects I lead   (" & gPrjLed & ")"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H3
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.Primary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =28
                              Width: =Parent.Width - 32
                              Height: =28
                        - lblMyProjectsEmpty:
                            Control: Label@2.5.1
                            Properties:
                              Visible: =IsEmpty(galMyProjects.AllItems)
                              Text: ="Nothing open — no live project has you as its manager."
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =24
                              Width: =Parent.Width - 32
                              Height: =24
                        - galMyProjects:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                            Properties:
                              # ONE composite sort key, not two chained Sorts — Power Fx does not guarantee a
                              # stable sort. priority * 100000 dominates, the day count breaks ties, and +50000
                              # keeps an overdue (negative) count positive so no target date sorts last.
                              Items: |
                                =Sort( Filter(colMyProjects, project_phase.Value <> "Complete"),
                                       Switch( project_priority.Value,
                                               "Critical", 1, "High", 2, "Moderate", 3,
                                               "Low", 4, "Lowest", 5, 6 ) * 100000
                                       + If( IsBlank(project_date_target), 99999,
                                             DateDiff(Today(), project_date_target, TimeUnit.Days) + 50000 ) )
                              WrapCount: =1
                              TemplateSize: =48
                              TemplatePadding: =0
                              TemplateFill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              ShowScrollbar: =true
                              FillPortions: =1
                              LayoutMinHeight: =120
                              Width: =Parent.Width - 32
                              Height: =Parent.Height - 76
                            Children:
                              - rowMyProjectBody:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =10
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =Parent.TemplateHeight - 1
                                  Children:
                                    # PHASE glyph, the project-level counterpart of the task stage glyph.
                                    # The fallback is a dashed question mark: a phase the app does not know
                                    # must be VISIBLE, not invisible.
                                    # HEX TEXT, not gTheme.Color.* — these drop straight into the SVG string
                                    # and Power Fx has no Color-to-hex conversion.
                                    - icoMyProjectPhase:
                                        Control: Image@2.2.3
                                        Properties:
                                          ImagePosition: =ImagePosition.Fit
                                          FillPortions: =0
                                          LayoutMinWidth: =22
                                          Width: =22
                                          Height: =22
                                          Image: |
                                            =With(
                                                { g: Switch( Coalesce(ThisItem.project_phase.Value, ""),
                                                      "Not Started",
                                                          "<circle cx='18' cy='18' r='13' fill='none' stroke='#B9C0C8' stroke-width='2.5'/>",
                                                      "Planning",
                                                          "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'/>"
                                                        & "<circle cx='12.5' cy='18' r='1.7' fill='#6E7882'/>"
                                                        & "<circle cx='18'   cy='18' r='1.7' fill='#6E7882'/>"
                                                        & "<circle cx='23.5' cy='18' r='1.7' fill='#6E7882'/>",
                                                      "Active",
                                                          "<circle cx='18' cy='18' r='13' fill='none' stroke='#005A9E' stroke-width='3'/>"
                                                        & "<circle cx='18' cy='18' r='5' fill='#005A9E'/>",
                                                      "Stalled",
                                                          "<circle cx='18' cy='18' r='13' fill='none' stroke='#C53A3A' stroke-width='3'/>"
                                                        & "<rect x='14.5' y='11' width='2.5' height='14' fill='#C53A3A'/>"
                                                        & "<rect x='19' y='11' width='2.5' height='14' fill='#C53A3A'/>",
                                                      "Complete",
                                                          "<circle cx='18' cy='18' r='14.5' fill='#31825D'/>"
                                                        & "<path d='M11 18.5 L16 23.5 L25 13.5' fill='none' stroke='#FFFFFF'"
                                                        & " stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/>",
                                                      "Archived",
                                                          "<circle cx='18' cy='18' r='13' fill='none' stroke='#B9C0C8' stroke-width='2.5'/>"
                                                        & "<rect x='11' y='16.5' width='14' height='3' fill='#B9C0C8'/>",
                                                          "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'"
                                                        & " stroke-dasharray='4 3'/>"
                                                        & "<text x='18' y='22.5' text-anchor='middle' font-size='13'"
                                                        & " font-family='Segoe UI, sans-serif' fill='#6E7882'>?</text>" ) },
                                                "data:image/svg+xml," & EncodeUrl(
                                                    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'>" & g & "</svg>" )
                                            )
                                    - cellMyProjectPriority:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =Coalesce(ThisItem.project_priority.Value, "—")
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Small
                                          Color: =gTheme.Color.TextMuted
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =1
                                          LayoutMinWidth: =64
                                          Height: =32
                                    - cellMyProjectName:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =ThisItem.project_name
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Body
                                          Color: =gTheme.Color.TextPrimary
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =3
                                          LayoutMinWidth: =120
                                          Height: =32
                                    # THE STORED ROLLUP, and it can be STALE — it only moves when a task save
                                    # changes a stage, and scrProject repairs it on open. Do not compute a live
                                    # one here; that is a per-row scan of the task list.
                                    - cellMyProjectPc:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =Coalesce(ThisItem.project_perc_completion, 0) & "%"
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Small
                                          Color: =gTheme.Color.TextMuted
                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =1
                                          LayoutMinWidth: =56
                                          Height: =32
                                    - cellMyProjectDue:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |
                                            =If( IsBlank(ThisItem.project_date_target), "—",
                                                 Text(ThisItem.project_date_target, "[$-en-US]d mmm") )
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Small
                                          Color: |
                                            =If( !IsBlank(ThisItem.project_date_target)
                                                 && ThisItem.project_date_target < Today(),
                                                 gTheme.Color.Danger, gTheme.Color.TextMuted )
                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =1
                                          LayoutMinWidth: =66
                                          Height: =32
                              - rowMyProjectLine:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =gTheme.Color.Border
                                    X: =0
                                    Y: =Parent.TemplateHeight - 1
                                    Width: =Parent.TemplateWidth
                                    Height: =1
                              - galMyProjectsHit:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: =""
                                    Fill: =RGBA(0, 0, 0, 0)
                                    HoverFill: =gTheme.Color.Hover
                                    PressedFill: =gTheme.Color.Press
                                    BorderThickness: =0
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =Parent.TemplateHeight
                                    # RE-READ FROM THE LIST, not handed ThisItem: scrProject derives a phase
                                    # and can Patch it, so it must open on a live record. The LookUp can miss.
                                    OnSelect: |
                                      =Select(Parent);
                                      Set( gSelProject,
                                           LookUp(taskmaster_projects, ID = ThisItem.ID) );
                                      If( IsBlank(gSelProject.ID),
                                          Notify( "That project is no longer available. Refresh the dashboard.",
                                                  NotificationType.Error ),
                                          Navigate( scrProject, ScreenTransition.Cover ) )
                  - secMyTasks:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =8
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        # 440 IS NOT ROUND: the task row's floor (22 + 70 + 130 + 100 + 70 columns, 40 of
                        # gaps, 16 row padding, 32 panel padding = 480) less the 40 the cells can absorb now
                        # a THIRD panel shares this row. rowLists is the widest band at 1252 and governs.
                        FillPortions: =3
                        LayoutMinWidth: =440
                        Height: =Parent.Height
                      Children:
                        - lblMyTasksTitle:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Open tasks I lead   (" & gTaskLed & ")"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H3
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.Primary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =28
                              Width: =Parent.Width - 32
                              Height: =28
                        - lblMyTasksEmpty:
                            Control: Label@2.5.1
                            Properties:
                              Visible: =IsEmpty(galMyTasks.AllItems)
                              Text: ="Nothing open — no task on any live project has you as its lead."
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =24
                              Width: =Parent.Width - 32
                              Height: =24
                        - galMyTasks:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                            Properties:
                              # colMyTasks is a LOCAL collection, so `<>` and the composite sort
                              # cost nothing — neither has to delegate.
                              # ONE composite sort key, not two chained Sorts — Power Fx does not guarantee a
                              # stable sort. priority * 100000 dominates, the day count breaks ties, and +50000
                              # keeps an overdue (negative) count positive so no target date sorts last.
                              Items: |
                                =Sort( Filter(colMyTasks, task_stage.Value <> "Completed"),
                                       Switch( task_priority.Value,
                                               "Critical", 1, "High", 2,
                                               "Moderate", 3, "Low", 4, 5 ) * 100000
                                       + If( IsBlank(task_date_target), 99999,
                                             DateDiff(Today(), task_date_target, TimeUnit.Days) + 50000 ) )
                              WrapCount: =1
                              TemplateSize: =48
                              TemplatePadding: =0
                              TemplateFill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              ShowScrollbar: =true
                              FillPortions: =1
                              LayoutMinHeight: =120
                              Width: =Parent.Width - 32
                              Height: =Parent.Height - 76
                            Children:
                              - rowMyTaskBody:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =10
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =Parent.TemplateHeight - 1
                                  Children:
                                    # INLINE SVG, NOT A COMPONENT — a canvas component cannot be
                                    # placed inside a gallery template; Studio refuses the paste.
                                    # LIFECYCLE glyph, bound to task_stage. task_status is a separate
                                    # RAG health column and is NOT what this shows.
                                    # HEX TEXT, not gTheme.Color.*: Power Fx has no Color-to-hex.
                                    - icoMyTaskStage:
                                        Control: Image@2.2.3
                                        Properties:
                                          ImagePosition: =ImagePosition.Fit
                                          FillPortions: =0
                                          LayoutMinWidth: =22
                                          Width: =22
                                          Height: =22
                                          Image: |
                                            =With(
                                                { g: Switch( Coalesce(ThisItem.task_stage.Value, ""),
                                                      "Not Started",
                                                          "<circle cx='18' cy='18' r='13' fill='none' stroke='#B9C0C8' stroke-width='2.5'/>",
                                                      "Planning",
                                                          "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'/>"
                                                        & "<circle cx='12.5' cy='18' r='1.7' fill='#6E7882'/>"
                                                        & "<circle cx='18'   cy='18' r='1.7' fill='#6E7882'/>"
                                                        & "<circle cx='23.5' cy='18' r='1.7' fill='#6E7882'/>",
                                                      "Drafting",
                                                          "<circle cx='18' cy='18' r='13' fill='none' stroke='#005A9E' stroke-width='3'/>"
                                                        & "<circle cx='18' cy='18' r='5' fill='#005A9E'/>",
                                                      "Finalizing",
                                                          "<circle cx='18' cy='18' r='13' fill='none' stroke='#D69828' stroke-width='3'/>"
                                                        & "<circle cx='18' cy='18' r='9' fill='#D69828'/>",
                                                      "Completed",
                                                          "<circle cx='18' cy='18' r='14.5' fill='#31825D'/>"
                                                        & "<path d='M11 18.5 L16 23.5 L25 13.5' fill='none' stroke='#FFFFFF'"
                                                        & " stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/>",
                                                          "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'"
                                                        & " stroke-dasharray='4 3'/>"
                                                        & "<text x='18' y='22.5' text-anchor='middle' font-size='13'"
                                                        & " font-family='Segoe UI, sans-serif' fill='#6E7882'>?</text>" ) },
                                                "data:image/svg+xml," & EncodeUrl(
                                                    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'>" & g & "</svg>" )
                                            )
                                    - cellMyTaskPriority:
                                        Control: Label@2.5.1
                                        Properties:
                                          # Colour-coded, but the value is also SPELLED OUT — colour
                                          # alone would carry the whole meaning for a reader who cannot
                                          # see it.
                                          Text: =Coalesce(ThisItem.task_priority.Value, "—")
                                          Font: =gTheme.Font
                                          FontWeight: =FontWeight.Semibold
                                          Size: =gTheme.Size.Small
                                          Color: |
                                            =Switch( ThisItem.task_priority.Value,
                                                     "Critical", gTheme.Color.Danger,
                                                     "High",     gTheme.Color.Warning,
                                                     "Moderate", gTheme.Color.Primary,
                                                                 gTheme.Color.TextMuted )
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =1
                                          LayoutMinWidth: =70
                                          Height: =40
                                    - cellMyTaskName:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =ThisItem.task_name
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Body
                                          Color: =gTheme.Color.TextPrimary
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =3
                                          LayoutMinWidth: =130
                                          Height: =40
                                    - cellMyTaskProject:
                                        Control: Label@2.5.1
                                        Properties:
                                          # RESOLVED APP-SIDE. task_project_id is a Lookup and the
                                          # canvas connector DISPLAYS ITS NUMERIC ID, not project_name.
                                          # LOCAL LOOKUP — colPrjNames, never the data source: a
                                          # LookUp against taskmaster_projects here is one server call
                                          # per VISIBLE ROW, re-fired on every scroll.
                                          # colPrjNames covers active projects only, so a row whose
                                          # parent archived since its task_project_archived flag was
                                          # last stamped shows the dash. Accepted: the flag is what
                                          # keeps the row in this gallery at all, so the window is the
                                          # lag between archiving and the next rollup.
                                          Text: |
                                            =Coalesce( LookUp( colPrjNames,
                                                               ID = ThisItem.task_project_id.Id,
                                                               project_name ),
                                                       "—" )
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Small
                                          Color: =gTheme.Color.TextMuted
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =2
                                          LayoutMinWidth: =100
                                          Height: =40
                                    - cellMyTaskDue:
                                        Control: Label@2.5.1
                                        Properties:
                                          # A missing target date is "-", not an empty cell: a blank
                                          # reads as a rendering fault, a dash as "nobody set one".
                                          # No stage test on the overdue branch — this gallery is
                                          # already filtered to open tasks.
                                          Text: |
                                            =If( IsBlank(ThisItem.task_date_target), "-",
                                                 With( { d: DateDiff(Today(), ThisItem.task_date_target, TimeUnit.Days) },
                                                       If( d < 0, "Overdue",
                                                           d = 0, "Due today",
                                                                  d & "d Left" ) ) )
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Small
                                          Color: |
                                            =If( IsBlank(ThisItem.task_date_target),
                                                 gTheme.Color.TextMuted,
                                                 ThisItem.task_date_target < Today(),
                                                 gTheme.Color.Danger,
                                                 DateDiff(Today(), ThisItem.task_date_target, TimeUnit.Days) = 0,
                                                 gTheme.Color.Warning,
                                                 gTheme.Color.TextMuted )
                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =1
                                          LayoutMinWidth: =70
                                          Height: =40
                              # Absolute siblings of the row container, not children: both must span
                              # the whole template, and the hit button must be LAST so it is on top.
                              - rowMyTaskLine:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =gTheme.Color.Border
                                    X: =0
                                    Y: =Parent.TemplateHeight - 1
                                    Width: =Parent.TemplateWidth
                                    Height: =1
                              - galMyTasksHit:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: =""
                                    Fill: =RGBA(0, 0, 0, 0)
                                    HoverFill: =gTheme.Color.Hover
                                    PressedFill: =gTheme.Color.Press
                                    BorderThickness: =0
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =Parent.TemplateHeight
                                    # GOES TO THE PROJECT, not the task. The LookUp can MISS — the
                                    # project may have been archived or deleted since the collection
                                    # was taken — and scrProject can Patch, so it must not open blank.
                                    OnSelect: |
                                      =Select(Parent);
                                      Set( gSelProject,
                                           LookUp(taskmaster_projects, ID = ThisItem.task_project_id.Id) );
                                      If( IsBlank(gSelProject.ID),
                                          Notify( "That task's project is no longer available. Refresh the dashboard.",
                                                  NotificationType.Error ),
                                          Navigate( scrProject, ScreenTransition.Cover ) )
                  - secMyIssues:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =8
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =3
                        LayoutMinWidth: =440
                        Height: =Parent.Height
                      Children:
                        - lblMyIssuesTitle:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Open issues I own   (" & gIssMine & ")"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H3
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.Primary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =28
                              Width: =Parent.Width - 32
                              Height: =28
                        - lblMyIssuesEmpty:
                            Control: Label@2.5.1
                            Properties:
                              Visible: =IsEmpty(galMyIssues.AllItems)
                              Text: ="Nothing open — no issue on any live project is assigned to you."
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =24
                              Width: =Parent.Width - 32
                              Height: =24
                        - galMyIssues:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                            Properties:
                              # Same composite key as the task list, on impact rather than priority.
                              # colMyIssues is already Open-only — OpenIssues filters server-side.
                              Items: |
                                =Sort( colMyIssues,
                                       Switch( issue_impact.Value,
                                               "Critical", 1, "High", 2,
                                               "Moderate", 3, "Low", 4, 5 ) * 100000
                                       + If( IsBlank(issue_date_target), 99999,
                                             DateDiff(Today(), issue_date_target, TimeUnit.Days) + 50000 ) )
                              WrapCount: =1
                              TemplateSize: =48
                              TemplatePadding: =0
                              TemplateFill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              ShowScrollbar: =true
                              FillPortions: =1
                              LayoutMinHeight: =120
                              Width: =Parent.Width - 32
                              Height: =Parent.Height - 76
                            Children:
                              - rowMyIssueBody:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =10
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =Parent.TemplateHeight - 1
                                  Children:
                                    # EVERY VALUE OF issue_status NEEDS A CASE HERE. This list is
                                    # Open-only today, so the closed glyphs are unreachable — they
                                    # exist so widening the filter does not render every row alike.
                                    - icoMyIssueStatus:
                                        Control: Image@2.2.3
                                        Properties:
                                          ImagePosition: =ImagePosition.Fit
                                          FillPortions: =0
                                          LayoutMinWidth: =22
                                          Width: =22
                                          Height: =22
                                          Image: |
                                            =With(
                                                { g: Switch( Coalesce(ThisItem.issue_status.Value, ""),
                                                      "Open",
                                                          "<circle cx='18' cy='18' r='13' fill='none' stroke='#D69828' stroke-width='3'/>"
                                                        & "<circle cx='18' cy='18' r='5' fill='#D69828'/>",
                                                      "Closed - Resolved",
                                                          "<circle cx='18' cy='18' r='14.5' fill='#31825D'/>"
                                                        & "<path d='M11 18.5 L16 23.5 L25 13.5' fill='none' stroke='#FFFFFF'"
                                                        & " stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/>",
                                                      "Closed - Unresolved",
                                                          "<circle cx='18' cy='18' r='14.5' fill='#C53A3A'/>"
                                                        & "<path d='M12.5 12.5 L23.5 23.5 M23.5 12.5 L12.5 23.5' fill='none'"
                                                        & " stroke='#FFFFFF' stroke-width='3.2' stroke-linecap='round'/>",
                                                      "Closed - No Change",
                                                          "<circle cx='18' cy='18' r='14.5' fill='#6E7882'/>"
                                                        & "<rect x='11' y='16.25' width='14' height='3.5' rx='1.75' fill='#FFFFFF'/>",
                                                          "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'"
                                                        & " stroke-dasharray='4 3'/>"
                                                        & "<text x='18' y='22.5' text-anchor='middle' font-size='13'"
                                                        & " font-family='Segoe UI, sans-serif' fill='#6E7882'>?</text>" ) },
                                                "data:image/svg+xml," & EncodeUrl(
                                                    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'>" & g & "</svg>" )
                                            )
                                    - cellMyIssueImpact:
                                        Control: Label@2.5.1
                                        Properties:
                                          # issue_impact is OPTIONAL in the golden source, so a blank is
                                          # normal, not a fault — a dash, not an empty cell.
                                          Text: =Coalesce(ThisItem.issue_impact.Value, "—")
                                          Font: =gTheme.Font
                                          FontWeight: =FontWeight.Semibold
                                          Size: =gTheme.Size.Small
                                          Color: |
                                            =Switch( ThisItem.issue_impact.Value,
                                                     "Critical", gTheme.Color.Danger,
                                                     "High",     gTheme.Color.Warning,
                                                     "Moderate", gTheme.Color.Primary,
                                                                 gTheme.Color.TextMuted )
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =1
                                          LayoutMinWidth: =70
                                          Height: =40
                                    - cellMyIssueName:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =ThisItem.issue_name
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Body
                                          Color: =gTheme.Color.TextPrimary
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =3
                                          LayoutMinWidth: =130
                                          Height: =40
                                    - cellMyIssueProject:
                                        Control: Label@2.5.1
                                        Properties:
                                          # Same local resolve as cellMyTaskProject, same reason and
                                          # same archived-parent edge.
                                          Text: |
                                            =Coalesce( LookUp( colPrjNames,
                                                               ID = ThisItem.issue_project_id.Id,
                                                               project_name ),
                                                       "—" )
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Small
                                          Color: =gTheme.Color.TextMuted
                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =2
                                          LayoutMinWidth: =110
                                          Height: =40
                              - rowMyIssueLine:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =gTheme.Color.Border
                                    X: =0
                                    Y: =Parent.TemplateHeight - 1
                                    Width: =Parent.TemplateWidth
                                    Height: =1
                              - galMyIssuesHit:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: =""
                                    Fill: =RGBA(0, 0, 0, 0)
                                    HoverFill: =gTheme.Color.Hover
                                    PressedFill: =gTheme.Color.Press
                                    BorderThickness: =0
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =Parent.TemplateHeight
                                    # GOES TO THE PROJECT, not the issue.
                                    OnSelect: |
                                      =Select(Parent);
                                      Set( gSelProject,
                                           LookUp(taskmaster_projects, ID = ThisItem.issue_project_id.Id) );
                                      If( IsBlank(gSelProject.ID),
                                          Notify( "That issue's project is no longer available. Refresh the dashboard.",
                                                  NotificationType.Error ),
                                          Navigate( scrProject, ScreenTransition.Cover ) )
            # ---- Charts band -----------------------------------------------
            # FOUR SVG VISUALS, all drawn in Power Fx and handed to an Image control as a data
            # URI. Read `.claude/skills/power-apps-svg` before editing one. See rules 2 and 3.
            # THE CHART FORMULAS ARE DECLARATIVE ON PURPOSE: they read colMyTasks / colMyIssues /
            # colMyProjects directly rather than a pre-computed global, so Refresh redraws them
            # with no second copy of the maths to keep in step.
            - rowCharts:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =gTheme.Space.Gap
                  FillPortions: =0
                  LayoutMinHeight: =320
                  Width: =Parent.Width - 48
                  Height: =320
                Children:
                  # DAYS TO DUE, CLAMPED TO -10..+10; negative is overdue. Without the clamp one task
                  # six months out sets the scale and every bar that matters collapses. The end bars
                  # are "10 or more", not "exactly 10", and the caption says so.
                  - pnlDueBars:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =2
                        LayoutMinWidth: =300
                        Height: =Parent.Height
                      Children:
                        - lblDueBarsTitle:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Days to due"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H3
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.Primary
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =24
                              Width: =Parent.Width - 24
                              Height: =24
                        - lblDueBarsSub:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                ="Open tasks I lead. Negative is overdue; end bars are 10 or more."
                                 & If( gDueNoDate > 0,
                                       "   ·   " & gDueNoDate & " no due date", "" )
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              Align: =Align.Center
                              FillPortions: =0
                              LayoutMinHeight: =30
                              Width: =Parent.Width - 24
                              Height: =30
                        - imgDueBars:
                            Control: Image@2.2.3
                            Properties:
                              ImagePosition: =ImagePosition.Fit
                              FillPortions: =1
                              LayoutMinHeight: =90
                              Width: =Parent.Width - 24
                              Height: =Parent.Height - 78
                              # BUILT FROM colDueBuckets, not inline. Across a one-way gap a chart that draws
                              # nothing is indistinguishable from a chart whose data never arrived, and a
                              # collection can be opened in Studio's Collections pane.
                              # 21 buckets across a 1050-wide viewBox gives each a 50-unit slot, so nothing
                              # here divides into a fraction.
                              Image: |
                                =With( { mx: Max( 1, Max(colDueBuckets, n) ) },
                                    "data:image/svg+xml," & EncodeUrl(
                                        "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1050 340'>"
                                      & "<line x1='0' y1='260' x2='1050' y2='260' stroke='#E1E5EB' stroke-width='3'/>"
                                      & "<line x1='525' y1='20' x2='525' y2='260' stroke='#B9C0C8'"
                                      & " stroke-width='2' stroke-dasharray='6 5'/>"
                                      & Concat( colDueBuckets,
                                            "<rect x='" & ((i - 1) * 50 + 8) & "' y='"
                                          & (260 - Round(n / mx * 210, 0)) & "' width='34' height='"
                                          & Round(n / mx * 210, 0) & "' rx='4' fill='"
                                          & If( d < 0, "#C53A3A", If(d = 0, "#D69828", "#005A9E") ) & "'/>"
                                          & If( n > 0,
                                                "<text x='" & ((i - 1) * 50 + 25) & "' y='"
                                              & (260 - Round(n / mx * 210, 0) - 8)
                                              & "' text-anchor='middle' font-size='24'"
                                              & " font-family='Segoe UI, sans-serif' fill='#20262D'>" & n & "</text>", "" )
                                          & If( Mod(d, 5) = 0,
                                                "<text x='" & ((i - 1) * 50 + 25) & "' y='292'"
                                              & " text-anchor='middle' font-size='24'"
                                              & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                              & If(d > 0, "+", "") & d & "</text>", "" ) )
                                      & "<text x='525' y='330' text-anchor='middle' font-size='24'"
                                      & " font-family='Segoe UI, sans-serif' fill='#B9C0C8'>days</text>"
                                      & "</svg>" ) )
                  # HEALTH, NOT STAGE. task_status holds only the ISSUE-DERIVED half; overdue changes
                  # with no write, so it is folded in by the reader — see rollups.task_health. Reading
                  # task_status raw UNDER-REPORTS Red. No join: task_date_target is already on the row.
                  - pnlPieHealth:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =210
                        Height: =Parent.Height
                      Children:
                        - lblPieHealthTitle:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Open tasks by health"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H3
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.Primary
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =24
                              Width: =Parent.Width - 24
                              Height: =24
                        - imgPieHealth:
                            Control: Image@2.2.3
                            Properties:
                              ImagePosition: =ImagePosition.Fit
                              FillPortions: =1
                              LayoutMinHeight: =90
                              Width: =Parent.Width - 24
                              Height: =Parent.Height - 48
                              # SAME DONUT CONSTRUCTION AS THE STAGE PIE BESIDE IT; the reasoning is on that
                              # chart and is not restated here.
                              # colDueSrc is the SAME open-task set the bar chart plots, folded once in OnVisible
                              # with health already resolved — so the two charts cannot disagree about "open".
                              Image: |
                                =With(
                                    { cats: AddColumns(
                                                Table( { i: 1, k: "Green", c: "#31825D" },
                                                       { i: 2, k: "Amber", c: "#D69828" },
                                                       { i: 3, k: "Red",   c: "#C53A3A" },
                                                       { i: 4, k: "Other", c: "#8A5AA8" } ) As cat,
                                                n, If( cat.k = "Other",
                                                       CountRows( Filter( colDueSrc,
                                                           !( hl = "Green" || hl = "Amber" || hl = "Red" ) ) ),
                                                       CountRows( Filter(colDueSrc, hl = cat.k) ) ) ) },
                                    With( { tot: Max(1, Sum(cats, n)) },
                                        With(
                                            { arcs: AddColumns( cats As r,
                                                        u, Round( r.n / tot * 1000, 0 ),
                                                        uc, Round( Coalesce( Sum( Filter(cats, i < r.i), n ), 0 )
                                                                   / tot * 1000, 0 ) ),
                                              leg: ForAll( Sequence( CountRows(Filter(cats, n > 0)) ) As s,
                                                       With( { g: Index(Filter(cats, n > 0), s.Value) },
                                                           { j: s.Value, lk: g.k, ln: g.n, lc: g.c } ) ) },
                                            "data:image/svg+xml," & EncodeUrl(
                                                "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 440 "
                                              & (410 + CountRows(leg) * 34 + 12) & "'>"
                                              & "<circle cx='220' cy='200' r='159.155' fill='none'"
                                              & " stroke='#EEF1F5' stroke-width='40'/>"
                                              & Concat( Filter(arcs, u > 0),
                                                    "<circle cx='220' cy='200' r='159.155' fill='none' stroke='" & c
                                                  & "' stroke-width='40' stroke-dasharray='"
                                                  & u & " " & (1000 - u)
                                                  & "' stroke-dashoffset='" & Mod(1250 - uc, 1000) & "'/>" )
                                              & "<text x='220' y='215' text-anchor='middle' font-size='90'"
                                              & " font-weight='600' font-family='Segoe UI, sans-serif' fill='#20262D'>"
                                              & CountRows(colDueSrc) & "</text>"
                                              & "<text x='220' y='262' text-anchor='middle' font-size='34'"
                                              & " font-family='Segoe UI, sans-serif' fill='#6E7882'>OPEN</text>"
                                              & Concat( leg,
                                                    "<rect x='120' y='" & (410 + (j - 1) * 34 + 4)
                                                  & "' width='26' height='26' rx='6' fill='" & lc & "'/>"
                                                  & "<text x='158' y='" & (410 + (j - 1) * 34 + 24) & "' font-size='28'"
                                                  & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                                  & EncodeHTML(lk) & "  " & ln & "</text>" )
                                              & "</svg>" ) ) ) )
                  - pnlPieTasks:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =210
                        Height: =Parent.Height
                      Children:
                        - lblPieTasksTitle:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Tasks by stage"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H3
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.Primary
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =24
                              Width: =Parent.Width - 24
                              Height: =24
                        - imgPieTasks:
                            Control: Image@2.2.3
                            Properties:
                              ImagePosition: =ImagePosition.Fit
                              FillPortions: =1
                              LayoutMinHeight: =90
                              Width: =Parent.Width - 24
                              Height: =Parent.Height - 48
                              # DONUT + LEGEND IN ONE SVG, legend UNDER the ring. The legend has to live inside
                              # the picture: an Image is a single control, so there is nothing to hover and no
                              # per-slice click. Stacked rather than side by side because the panel is a third
                              # of the row.
                              # IF "Other" IS EVER NON-ZERO the SharePoint column and this list's category table
                              # disagree — see rule 3.
                              # `uc` is the running total, which Power Fx has no primitive for: each row sums the
                              # rows with a LOWER index, named through `As r` so the inner Filter's scope cannot
                              # shadow the outer one.
                              # The viewBox is 10x natural size so the circumference is 1000 units and a slice
                              # keeps a tenth of a percent of precision — see rule 2.
                              Image: |
                                =With(
                                    { cats: AddColumns(
                                                Table( { i: 1, k: "Not Started", c: "#B9C0C8" },
                                                       { i: 2, k: "Planning",    c: "#6E7882" },
                                                       { i: 3, k: "Drafting",    c: "#005A9E" },
                                                       { i: 4, k: "Finalizing",  c: "#D69828" },
                                                       { i: 5, k: "Completed",    c: "#31825D" },
                                                       { i: 6, k: "Other",       c: "#8A5AA8" } ) As cat,
                                                n, If( cat.k = "Other",
                                                       CountRows( Filter( colMyTasks,
                                                           !( task_stage.Value = "Not Started"
                                                           || task_stage.Value = "Planning"
                                                           || task_stage.Value = "Drafting"
                                                           || task_stage.Value = "Finalizing"
                                                           || task_stage.Value = "Completed" ) ) ),
                                                       CountRows( Filter(colMyTasks, task_stage.Value = cat.k) ) ) ) },
                                    With( { tot: Max(1, Sum(cats, n)) },
                                        With(
                                            { arcs: AddColumns( cats As r,
                                                        u, Round( r.n / tot * 1000, 0 ),
                                                        uc, Round( Coalesce( Sum( Filter(cats, i < r.i), n ), 0 )
                                                                   / tot * 1000, 0 ) ),
                                              // The legend lists only categories that HAVE rows, so it needs its own
                                              // 1..n ordinal — `i` is the fixed slot and would leave a blank line.
                                              leg: ForAll( Sequence( CountRows(Filter(cats, n > 0)) ) As s,
                                                       With( { g: Index(Filter(cats, n > 0), s.Value) },
                                                           { j: s.Value, lk: g.k, ln: g.n, lc: g.c } ) ) },
                                            "data:image/svg+xml," & EncodeUrl(
                                                // HEIGHT GROWS WITH THE LEGEND so the chart stays near square. The
                                                // radius is FIXED at 159.155 — that is what makes the circumference
                                                // exactly 1000, which the integer dasharray depends on.
                                                "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 440 "
                                              & (410 + CountRows(leg) * 34 + 12) & "'>"
                                              & "<circle cx='220' cy='200' r='159.155' fill='none'"
                                              & " stroke='#EEF1F5' stroke-width='40'/>"
                                              & Concat( Filter(arcs, u > 0),
                                                    "<circle cx='220' cy='200' r='159.155' fill='none' stroke='" & c
                                                  & "' stroke-width='40' stroke-dasharray='"
                                                  & u & " " & (1000 - u)
                                                  & "' stroke-dashoffset='" & Mod(1250 - uc, 1000) & "'/>" )
                                              & "<text x='220' y='215' text-anchor='middle' font-size='90'"
                                              & " font-weight='600' font-family='Segoe UI, sans-serif' fill='#20262D'>"
                                              & CountRows(colMyTasks) & "</text>"
                                              & "<text x='220' y='262' text-anchor='middle' font-size='34'"
                                              & " font-family='Segoe UI, sans-serif' fill='#6E7882'>TASKS</text>"
                                              & Concat( leg,
                                                    "<rect x='120' y='" & (410 + (j - 1) * 34 + 4)
                                                  & "' width='26' height='26' rx='6' fill='" & lc & "'/>"
                                                  & "<text x='158' y='" & (410 + (j - 1) * 34 + 24) & "' font-size='28'"
                                                  & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                                  & EncodeHTML(lk) & "  " & ln & "</text>" )
                                              & "</svg>" ) ) ) )
                  - pnlPieIssues:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =210
                        Height: =Parent.Height
                      Children:
                        - lblPieIssuesTitle:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Issues by impact"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H3
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.Primary
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =24
                              Width: =Parent.Width - 24
                              Height: =24
                        - imgPieIssues:
                            Control: Image@2.2.3
                            Properties:
                              ImagePosition: =ImagePosition.Fit
                              FillPortions: =1
                              LayoutMinHeight: =90
                              Width: =Parent.Width - 24
                              Height: =Parent.Height - 48
                              # Same construction as imgPieTasks — read the notes there.
                              # `issue_impact` is OPTIONAL in the golden source, so "Not set" is a REAL
                              # category, not a fallback: without it the slices would not account for
                              # every issue and the ring would understate the total it prints.
                              Image: |
                                =With(
                                    { cats: AddColumns(
                                                Table( { i: 1, k: "Critical", c: "#C53A3A" },
                                                       { i: 2, k: "High",     c: "#D69828" },
                                                       { i: 3, k: "Moderate", c: "#005A9E" },
                                                       { i: 4, k: "Low",      c: "#6E7882" },
                                                       { i: 5, k: "Not set",  c: "#B9C0C8" },
                                                       { i: 6, k: "Other",    c: "#8A5AA8" } ) As cat,
                                                n, If( cat.k = "Other",
                                                       CountRows( Filter( colMyIssues,
                                                           !( Coalesce(issue_impact.Value, "Not set") = "Critical"
                                                           || Coalesce(issue_impact.Value, "Not set") = "High"
                                                           || Coalesce(issue_impact.Value, "Not set") = "Moderate"
                                                           || Coalesce(issue_impact.Value, "Not set") = "Low"
                                                           || Coalesce(issue_impact.Value, "Not set") = "Not set" ) ) ),
                                                       CountRows( Filter(colMyIssues, Coalesce(issue_impact.Value, "Not set") = cat.k) ) ) ) },
                                    With( { tot: Max(1, Sum(cats, n)) },
                                        With(
                                            { arcs: AddColumns( cats As r,
                                                        u, Round( r.n / tot * 1000, 0 ),
                                                        uc, Round( Coalesce( Sum( Filter(cats, i < r.i), n ), 0 )
                                                                   / tot * 1000, 0 ) ),
                                              // The legend lists only categories that HAVE rows, so it needs its own
                                              // 1..n ordinal — `i` is the fixed slot and would leave a blank line.
                                              leg: ForAll( Sequence( CountRows(Filter(cats, n > 0)) ) As s,
                                                       With( { g: Index(Filter(cats, n > 0), s.Value) },
                                                           { j: s.Value, lk: g.k, ln: g.n, lc: g.c } ) ) },
                                            "data:image/svg+xml," & EncodeUrl(
                                                // HEIGHT GROWS WITH THE LEGEND so the chart stays near square. The
                                                // radius is FIXED at 159.155 — that is what makes the circumference
                                                // exactly 1000, which the integer dasharray depends on.
                                                "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 440 "
                                              & (410 + CountRows(leg) * 34 + 12) & "'>"
                                              & "<circle cx='220' cy='200' r='159.155' fill='none'"
                                              & " stroke='#EEF1F5' stroke-width='40'/>"
                                              & Concat( Filter(arcs, u > 0),
                                                    "<circle cx='220' cy='200' r='159.155' fill='none' stroke='" & c
                                                  & "' stroke-width='40' stroke-dasharray='"
                                                  & u & " " & (1000 - u)
                                                  & "' stroke-dashoffset='" & Mod(1250 - uc, 1000) & "'/>" )
                                              & "<text x='220' y='215' text-anchor='middle' font-size='90'"
                                              & " font-weight='600' font-family='Segoe UI, sans-serif' fill='#20262D'>"
                                              & CountRows(colMyIssues) & "</text>"
                                              & "<text x='220' y='262' text-anchor='middle' font-size='34'"
                                              & " font-family='Segoe UI, sans-serif' fill='#6E7882'>ISSUES</text>"
                                              & Concat( leg,
                                                    "<rect x='120' y='" & (410 + (j - 1) * 34 + 4)
                                                  & "' width='26' height='26' rx='6' fill='" & lc & "'/>"
                                                  & "<text x='158' y='" & (410 + (j - 1) * 34 + 24) & "' font-size='28'"
                                                  & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                                  & EncodeHTML(lk) & "  " & ln & "</text>" )
                                              & "</svg>" ) ) ) )
                  # THE ONE REAL VISUAL in this band — the licence-free completion ring,
                  # wrapped per rule 4.
                  - pnlRing:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        PaddingTop: =12
                        PaddingBottom: =12
                        # NO SIDE PADDING: padding eats the inner width first, and at the floor
                        # below that would clip the ring rather than inset it.
                        PaddingLeft: =0
                        PaddingRight: =0
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        # ONE OF THREE EQUAL THIRDS, same floor as the two donut panels.
                        # Row minimum is 300 + 210 + 210 + 210 + 48 = 978.
                        FillPortions: =1
                        LayoutMinWidth: =210
                        Height: =Parent.Height
                      Children:
                        - wrapRing:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Center
                              # LayoutMinWidth, NOT LayoutMinHeight. This wrapper sits in a VERTICAL
                              # parent, so height is the main axis and width is the cross axis — the
                              # floor that keeps the ring from being squeezed is the width one.
                              # SQUARE, AND AS BIG AS THE PANEL ALLOWS: 84 is the caption plus the gap
                              # plus the top and bottom padding.
                              FillPortions: =0
                              LayoutMinWidth: =100
                              Width: =Max( 100, Min(Parent.Width, Parent.Height - 84) )
                              Height: =Max( 100, Min(Parent.Width, Parent.Height - 84) )
                            Children:
                              - ringHome:
                                  Control: CanvasComponent
                                  ComponentName: cmpKpiRing
                                  Properties:
                                    Width: =Parent.Width
                                    Height: =Parent.Height
                                    Percent: =gMyPercent
                                    Label: =gMyPercent & "%"
                                    AccentHex: ="#005A9E"
                                    TrackHex: ="#E1E5EB"
                        - lblRing:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                ="Weighted completion across " & CountRows(colMyTasks) & " task(s) you lead"
                              Font: =gTheme.Font
                              # A LITERAL 10, not gTheme.Size.Small — the theme's smallest step is 12
                              # and this caption has to wrap to three lines inside a 126px column.
                              Size: =10
                              Color: =gTheme.Color.TextMuted
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =52
                              Width: =Parent.Width - 8
                              Height: =52
      - cmpToastHome:
          Control: CanvasComponent
          ComponentName: cmpToast
          Properties:
            Visible: =gToastShow
            IsOpen: =gToastShow
            X: =Parent.Width - 340 - gTheme.Space.Gutter
            Y: =Parent.Height - 56 - gTheme.Space.Gutter
            Width: =340
            Height: =56
            Message: =gToastMsg
            Tone: =gToastTone
            Duration: =3000
            OnDismiss: =Set(gToastShow, false)
      # ---- The whole shell is one component: header bar + fly-out nav rail ----
      # DECLARED LAST so positional z-order floats the fly-out over the content.
      # Height is dynamic and that is the whole trick: a component intercepts every click
      # inside its bounds, so closed it must own nothing but the 64px header strip.
      # cmpAppBar cannot Navigate (a component can't see app screens), so it reports the
      # chosen entry and this screen does the navigating.
      - appBar:
          Control: CanvasComponent
          ComponentName: cmpAppBar
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =If(gNavOpen, Parent.Height, gTheme.Space.HeaderH)
            Items: =gNavMenu
            ActiveKey: =1
            AppTitle: ="EQD Taskmaster"
            ScreenTitle: ="Home"
            IsOpen: =gNavOpen
            OnToggle: =Set(gNavOpen, !gNavOpen)
            OnNavigate: |
              =Switch( appBar.SelectedKey,
                       1, Navigate(scrHome, ScreenTransition.Fade),
                       2, Navigate(scrReports, ScreenTransition.Fade),
                       3, Navigate(scrProjects, ScreenTransition.Fade),
                          Navigate(scrReference, ScreenTransition.Fade) );
              Set(gNavOpen, false)
