# =============================================================================
# scrHome  —  personalised landing (screen-map §1). PHASE-2 DATA: header + nav
# + component instances bound to LIVE queries. OnVisible pulls my-tasks and
# my-issues delegably, then derives every figure locally. Column tokens resolve
# to schema/schema.yaml (the golden source).
#
# NOT RUNNABLE until the lists exist: a SharePoint data source can't be added
# to the app before its list is provisioned, so paste this only after
# taskmaster_tasks / taskmaster_issues are live and added as data sources.
#
# Component INSTANCES use v3.0 dialect: `Control: CanvasComponent` +
# `ComponentName:` + `Properties:` (base props X/Y/W/H AND custom props;
# instances have NO Children). The referenced components must exist in the app
# first (src/authored/components/). Screens CAN read the App.Formulas `Theme`
# (only components can't), so Theme.* tokens stay here.
#
# Demo UI-state globals (no schema, no OnStart — blank is falsy):
#   gToastMsg / gToastTone  — feed the toast; gConfirmOpen — the confirm modal.
# DIALECT: modern structured .pa.yaml; gallery `Variant` still round-trip-gated.
# =============================================================================
Screens:
  scrHome:
    Properties:
      Fill: =Theme.Color.Bg
      # ---- PHASE-2 DATA: one delegable pull, then local derivation ----------
      # The pattern (power-fx-development): narrow SERVER-side to a bounded set,
      # then aggregate LOCALLY — Sum/CountRows/Average never delegate to SharePoint.
      # Everything inside these two Filters delegates: Person `.Email =`, Choice
      # `.Value =`, and And/Or over them. `task_supporter` is a single Person (C1),
      # so "mine" is fully server-side.
      # THERE IS NO STAGE PREDICATE ANY MORE. It enumerated the six non-archived
      # stages; task_stage lost "Archived" on 2026-08-12, so the chain selected
      # everything. Archiving is a PROJECT state now, and it is applied BELOW, in
      # a delegable `task_project_archived = false` — a denormalised mirror of the
      # parent's phase, so the archived rows never reach the app at all.
      #
      # TWO LIMITS TO KNOW:
      #  * A delegable Filter still returns at most the DATA ROW LIMIT into a
      #    collection — set Settings > General > Data row limit to 2000. (While
      #    testing, set it to 1: any non-delegable clause then shows up instantly.)
      #  * task_stage / issue_status are REQUIRED with defaults (C9), so no row is
      #    lost to a blank Choice — these counts miss nothing.
      OnVisible: |
        =Concurrent(
            ClearCollect( colMyTasks,
                Filter( taskmaster_tasks,
                    // EXCLUDED AT THE SOURCE. `*_project_archived` is a denormalised mirror of the
                    // parent's phase, maintained by scrProjectEdit's save — so "belongs to a live
                    // project" is a delegable `= false` and the archived rows NEVER REACH THE APP.
                    // This replaced a collect-then-RemoveIf, which fetched them and only then
                    // dropped them: the data row limit still applied to the fetch, so past it
                    // archived work silently reappeared.
                    task_project_archived = false
                 && ( task_lead.Email = gUserEmail || task_supporter.Email = gUserEmail ) ) ),
            ClearCollect( colMyIssues,
                Filter( taskmaster_issues,
                    // Assigned to me, full stop — see the note on the other copy.
                    issue_project_archived = false
                 && issue_assignee.Email = gUserEmail && issue_status.Value = "Open" ) )
        );
        Set( gMyOpen,
             CountRows( Filter(colMyTasks, task_stage.Value <> "Complete") ) );
        Set( gMyOverdue,
             CountRows( Filter( colMyTasks,
                 task_stage.Value <> "Complete"
              && !IsBlank(task_date_target) && task_date_target < Today() ) ) );
        Set( gMyIssuesOpen, CountRows(colMyIssues) );
        Set( gMyPercent,
             If( CountRows(colMyTasks) = 0, 0,
                 RoundDown( Average( AddColumns( colMyTasks, wgt,
                     Coalesce(LookUp(StageWeights, Stage = task_stage.Value, Weight), 0) ), wgt ), 0 ) ) )
    Children:
      # ---- Content: composed component instances (live data) ---------------
      - hdrMyWork:
          Control: CanvasComponent
          ComponentName: cmpSectionHeader
          Properties:
            X: =Theme.Space.Gutter
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter
            Width: =Parent.Width - (Theme.Space.Gutter * 2)
            Height: =60
            Title: ="My work"
            Subtitle: ="Tasks you lead or support, plus issues assigned to you"
            ShowAction: =true
            ActionLabel: ="Refresh"
            # Re-collect INLINE. Navigate() to the screen you are already on does
            # not reliably re-fire OnVisible, and it defers to the end of the chain
            # so the toast would fire first. Duplicated deliberately over being wrong.
            OnAction: |
              =Refresh(taskmaster_tasks); Refresh(taskmaster_issues);
              Concurrent(
                  ClearCollect( colMyTasks,
                      Filter( taskmaster_tasks,
                          // See OnVisible — excluded at the source, not in memory.
                          task_project_archived = false
                       && ( task_lead.Email = gUserEmail || task_supporter.Email = gUserEmail ) ) ),
                  ClearCollect( colMyIssues,
                      Filter( taskmaster_issues,
                          // ASSIGNED TO ME, full stop. The second arm was
                          // `|| issue_owner.Email = gUserEmail`, and issue_owner is
                          // retired. It was NOT replaced with `'Created By'`: that
                          // column is not indexed, so an Or-arm on it would drop
                          // delegation for the WHOLE filter and silently truncate this
                          // list at 500 rows. "My issues" is now what I must act on,
                          // not what I happened to raise.
                          issue_project_archived = false
                       && issue_assignee.Email = gUserEmail && issue_status.Value = "Open" ) )
              );
              Set( gMyOpen, CountRows(Filter(colMyTasks, task_stage.Value <> "Complete")) );
              Set( gMyOverdue,
                   CountRows( Filter( colMyTasks,
                       task_stage.Value <> "Complete"
                    && !IsBlank(task_date_target) && task_date_target < Today() ) ) );
              Set( gMyIssuesOpen, CountRows(colMyIssues) );
              Set( gMyPercent,
                   If( CountRows(colMyTasks) = 0, 0,
                       RoundDown( Average( AddColumns( colMyTasks, wgt,
                           Coalesce(LookUp(StageWeights, Stage = task_stage.Value, Weight), 0) ), wgt ), 0 ) ) );
              Set(gToastShow, false);
              Set(gToastMsg, "Refreshed"); Set(gToastTone, "Info"); Set(gToastShow, true)
      # Three KPI cards, fed by the locals Set in OnVisible. Trend has no
      # historical source in this model, so it is omitted rather than faked.
      - cardOpen:
          Control: CanvasComponent
          ComponentName: cmpStatusCard
          Properties:
            X: =Theme.Space.Gutter
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter + 60 + Theme.Space.Gap
            Width: =(Parent.Width - (Theme.Space.Gutter * 2) - (Theme.Space.Gap * 2)) / 3
            Height: =120
            Title: ="Open tasks"
            Value: =Text(gMyOpen)
            Caption: ="tasks you lead or support"
            Trend: =0
            Accent: =Theme.Color.Primary
            OnSelect: =Navigate(scrProjects, ScreenTransition.Fade)
      - cardOverdue:
          Control: CanvasComponent
          ComponentName: cmpStatusCard
          Properties:
            X: =Theme.Space.Gutter + ((Parent.Width - (Theme.Space.Gutter * 2) - (Theme.Space.Gap * 2)) / 3) + Theme.Space.Gap
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter + 60 + Theme.Space.Gap
            Width: =(Parent.Width - (Theme.Space.Gutter * 2) - (Theme.Space.Gap * 2)) / 3
            Height: =120
            Title: ="Overdue"
            Value: =Text(gMyOverdue)
            Caption: ="past their due date"
            Trend: =0
            Accent: =Theme.Color.Danger
            OnSelect: =Navigate(scrProjects, ScreenTransition.Fade)
      - cardIssues:
          Control: CanvasComponent
          ComponentName: cmpStatusCard
          Properties:
            X: =Theme.Space.Gutter + 2 * (((Parent.Width - (Theme.Space.Gutter * 2) - (Theme.Space.Gap * 2)) / 3) + Theme.Space.Gap)
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter + 60 + Theme.Space.Gap
            Width: =(Parent.Width - (Theme.Space.Gutter * 2) - (Theme.Space.Gap * 2)) / 3
            Height: =120
            Title: ="Open issues"
            Value: =Text(gMyIssuesOpen)
            Caption: ="assigned to you"
            Trend: =0
            Accent: =Theme.Color.Warning
            OnSelect: =Navigate(scrProjects, ScreenTransition.Fade)
      # SVG completion ring (licence-free Q2 fallback). Weighted mean of your
      # task stages, using the StageWeights table in App.Formulas (C3).
      - ringHome:
          Control: CanvasComponent
          ComponentName: cmpKpiRing
          Properties:
            X: =Theme.Space.Gutter
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter + 60 + Theme.Space.Gap + 120 + Theme.Space.Gutter
            Width: =140
            Height: =140
            Percent: =gMyPercent
            Label: =gMyPercent & "%"
            AccentHex: ="#005A9E"
            TrackHex: ="#E1E5EB"
      - lblRing:
          Control: Label@2.5.1
          Properties:
            Text: ="Your weighted completion across " & CountRows(colMyTasks) & " task(s)"
            Color: =Theme.Color.TextMuted
            Font: =Theme.Font
            Size: =Theme.Size.Body
            X: =Theme.Space.Gutter + 140 + Theme.Space.Gap
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter + 60 + Theme.Space.Gap + 120 + Theme.Space.Gutter + 56
            Width: =260
            Height: =24
            VerticalAlign: =VerticalAlign.Middle
      # Demo trigger for the confirm dialog (destructive pattern).
      - btnArchive:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Archive a project…"
            Fill: =Theme.Color.Surface
            Color: =Theme.Color.Danger
            BorderColor: =Theme.Color.Danger
            BorderThickness: =1
            Font: =Theme.Font
            Size: =Theme.Size.Body
            Height: =40
            Width: =200
            X: =Theme.Space.Gutter + 140 + Theme.Space.Gap
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter + 60 + Theme.Space.Gap + 120 + Theme.Space.Gutter + 90
            OnSelect: =Set(gConfirmOpen, true)
      # Toast (bottom-right). ONE flag raises it: set gToastMsg/gToastTone, then
      # Set(gToastShow, false) followed by Set(gToastShow, true) — the false->true
      # edge is what resets and restarts the internal timer, so re-raising a toast
      # that is already showing still gets a full Duration.
      - cmpToastHome:
          Control: CanvasComponent
          ComponentName: cmpToast
          Properties:
            # Same reason as the dialog, smaller blast radius: an always-visible
            # toast blocks clicks in the bottom-right corner even when nothing is
            # showing. The component raises OnDismiss when its timer ends, so the
            # screen can own the flag.
            Visible: =gToastShow
            IsOpen: =gToastShow
            X: =Parent.Width - 340 - Theme.Space.Gutter
            Y: =Parent.Height - 56 - Theme.Space.Gutter
            Width: =340
            Height: =56
            Message: =gToastMsg
            Tone: =gToastTone
            Duration: =3000
            OnDismiss: =Set(gToastShow, false)
      # Confirm modal (full-screen; declared LAST so it layers on top).
      - cmpConfirmHome:
          Control: CanvasComponent
          ComponentName: cmpConfirmDialog
          Properties:
            # VISIBLE IS LOAD-BEARING. This instance is full-screen and declared
            # last, so with Visible defaulting to true it sits on top of scrHome
            # and swallows EVERY click — nav, buttons, gallery rows. A transparent
            # fill doesn't help: the component still hit-tests. `IsOpen` only
            # drives what's drawn INSIDE the component; it cannot stop the
            # component's own area from intercepting input.
            Visible: =gConfirmOpen
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            IsOpen: =gConfirmOpen
            Title: ="Archive this project?"
            Message: ="It will be hidden from active lists. You can restore it from Admin."
            ConfirmLabel: ="Archive"
            CancelLabel: ="Cancel"
            Destructive: =true
            OnConfirm: |
              =Set(gConfirmOpen, false);
               Set(gToastShow, false);
               Set(gToastMsg, "Archive is wired on the project detail screen");
               Set(gToastTone, "Info"); Set(gToastShow, true)
            OnCancel: =Set(gConfirmOpen, false)
      # ---- The whole shell is one component: header bar + fly-out nav rail ----
      # DECLARED LAST so positional z-order floats the fly-out over the content.
      #
      # Height is dynamic and that is the whole trick: a component intercepts every
      # click inside its bounds, so closed it must own nothing but the 64px header
      # strip. Open, covering the screen is exactly right — the scrim wants the click.
      #
      # cmpAppBar cannot Navigate (a component can't see app screens), so it reports
      # the chosen entry and this screen does the navigating.
      - appBar:
          Control: CanvasComponent
          ComponentName: cmpAppBar
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =If(gNavOpen, Parent.Height, Theme.Space.HeaderH)
            Items: =NavMenu
            ActiveKey: =1
            HasLicence: =gHasPowerBiLicence
            AppTitle: ="EQD Taskmaster"
            ScreenTitle: ="Home"
            IsOpen: =gNavOpen
            OnToggle: =Set(gNavOpen, !gNavOpen)
            OnNavigate: |
              =Switch( appBar.SelectedKey,
                       1, Navigate(scrHome, ScreenTransition.Fade),
                       2, Navigate(scrReports, ScreenTransition.Fade),
                       3, Navigate(scrProjects, ScreenTransition.Fade),
                          Navigate(scrReference, ScreenTransition.Fade) );
              Set(gNavOpen, false)
