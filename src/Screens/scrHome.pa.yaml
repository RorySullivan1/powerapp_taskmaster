# =============================================================================
# scrHome  —  personal dashboard. Four read-only metric cards, two work lists,
# and a chart band. Column tokens resolve to schema/schema.yaml.
#
# EVERYTHING BELOW THE APP BAR IS ONE AUTO-LAYOUT TREE. No child carries an X or
# a Y, so nothing can collide at any window width and nothing here can be moved
# by a stray drag in Studio.
#
# BAND HEIGHTS (bodyRoot is Parent.Height for every direct child):
#     60   wrapHdr     section header + Refresh
#     96   rowCards    four metric cards
#     ...  rowLists    fills — my tasks | my issues
#    200   rowCharts   timeline + two pies + the completion ring
#   rowLists.Height = Parent.Height - 452, where 452 = 48 padding + 48 gaps
#   + 60 + 96 + 200. Change a band height and change that number with it.
#
# Component INSTANCES use the v3.0 dialect: `Control: CanvasComponent` +
# `ComponentName:` + `Properties:` (base props AND custom props; no Children).
# An instance cannot take FillPortions/LayoutMinWidth, so every instance inside
# an auto-layout container sits in a pinned GroupContainer wrapper.
# Screens read gTheme; components cannot, so components use literal colours.
#
# NOT RUNNABLE until the lists exist: a SharePoint data source can't be added to
# the app before its list is provisioned.
# =============================================================================
Screens:
  scrHome:
    Properties:
      Fill: =gTheme.Color.Bg
      # ---- One delegable pull per list, then local derivation ----------------
      # Narrow SERVER-side to a bounded set, then aggregate LOCALLY — Sum,
      # CountRows and Average never delegate to SharePoint.
      # Everything inside these Filters delegates: Person `.Email =`, Choice
      # `.Value =`, Lookup `.Id =`, and And/Or over them. `project_manager`,
      # `task_lead` and `issue_assignee` are all single Person and all indexed.
      #
      # TWO LIMITS TO KNOW:
      #  * A delegable Filter still returns at most the DATA ROW LIMIT into a
      #    collection — set Settings > General > Data row limit to 2000. (While
      #    testing, set it to 1: any non-delegable clause then shows up instantly.)
      #  * task_stage / issue_status are REQUIRED with defaults (C9), so no row is
      #    lost to a blank Choice — these counts miss nothing.
      OnVisible: |
        =
        // SELF-HEAL, and it is not belt-and-braces. App.OnStart is NON-BLOCKING, so this
        // screen can run before it finishes. A blank gUserEmail makes the Person filters
        // below match NOTHING, and these KPIs are imperative Sets — they run once and never
        // re-fire when the global later arrives, so the dashboard latches at zero until a
        // manual refresh. Declarative properties like gTheme self-heal; these cannot.
        If( IsBlank(gUserEmail), Set( gUserEmail, Lower(User().Email) ) );
        Concurrent(
            ClearCollect( colMyProjects,
                Filter( ActiveProjects, project_manager.Email = gUserEmail ) ),
            ClearCollect( colMyTasks,
                Filter( LiveTasks, task_lead.Email = gUserEmail ) ),
            ClearCollect( colMyIssues,
                // ASSIGNED TO ME, full stop. Do not add `|| issue_owner.Email =
                // gUserEmail`: issue_owner is not indexed, so an Or-arm on it drops
                // delegation for the WHOLE filter and silently truncates at 500 rows.
                // issue_assignee is the resolver; issue_owner only records who raised it.
                Filter( OpenIssues, issue_assignee.Email = gUserEmail ) )
        );
        Set( gPrjLed,
             CountRows( Filter(colMyProjects, project_phase.Value <> "Complete") ) );
        Set( gPrjLedOverdue,
             CountRows( Filter( colMyProjects,
                 project_phase.Value <> "Complete"
              && !IsBlank(project_date_target) && project_date_target < Today() ) ) );
        Set( gTaskLed,
             CountRows( Filter(colMyTasks, task_stage.Value <> "Complete") ) );
        Set( gTaskLedOverdue,
             CountRows( Filter( colMyTasks,
                 task_stage.Value <> "Complete"
              && !IsBlank(task_date_target) && task_date_target < Today() ) ) );
        // ONE DELEGABLE QUERY PER PROJECT, not one query over a set. There is no
        // "issue_project_manager" to filter on, and `issue_project_id.Id in
        // colMyProjects.ID` does NOT delegate — it would cap at the data row limit and
        // undercount without saying so. ForAll runs each arm server-side instead; the
        // cost is one round trip per project managed, so this grows with how many
        // projects one person owns, not with the size of the issues list.
        Set( gIssLed,
             Coalesce( Sum( ForAll( colMyProjects As p,
                                    CountRows( Filter( OpenIssues,
                                                       issue_project_id.Id = p.ID ) ) ),
                            Value ),
                       0 ) );
        Set( gIssMine, CountRows(colMyIssues) );
        Set( gMyPercent,
             If( CountRows(colMyTasks) = 0, 0,
                 RoundDown( Average( AddColumns( colMyTasks, wgt,
                     Coalesce(LookUp(gStageWeights, Stage = task_stage.Value, Weight), 0) ), wgt ), 0 ) ) )
    Children:
      - bodyRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Start
            LayoutGap: =gTheme.Space.Gap
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =gTheme.Space.Gutter
            PaddingBottom: =gTheme.Space.Gutter
            PaddingLeft: =gTheme.Space.Gutter
            PaddingRight: =gTheme.Space.Gutter
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH
          Children:
            # ---- Header + Refresh ------------------------------------------
            - wrapHdr:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =0
                  FillPortions: =0
                  LayoutMinHeight: =60
                  Width: =Parent.Width - 48
                  Height: =60
                Children:
                  - hdrMyWork:
                      Control: CanvasComponent
                      ComponentName: cmpSectionHeader
                      Properties:
                        Width: =Parent.Width
                        Height: =60
                        Title: ="My work"
                        Subtitle: ="Everything you lead or own, across every open project"
                        ShowAction: =true
                        ActionLabel: ="Refresh"
                        # THIS BLOCK MUST STAY IDENTICAL TO OnVisible ABOVE. There is no
                        # shared function to call: a divergence shows up as the dashboard
                        # reading one set of numbers on open and a different set after a
                        # Refresh, with nothing to say which is right.
                        OnAction: |
                          =Refresh(taskmaster_projects); Refresh(taskmaster_tasks); Refresh(taskmaster_issues);
                          Concurrent(
                              ClearCollect( colMyProjects,
                                  Filter( ActiveProjects, project_manager.Email = gUserEmail ) ),
                              ClearCollect( colMyTasks,
                                  Filter( LiveTasks, task_lead.Email = gUserEmail ) ),
                              ClearCollect( colMyIssues,
                                  Filter( OpenIssues, issue_assignee.Email = gUserEmail ) )
                          );
                          Set( gPrjLed,
                               CountRows( Filter(colMyProjects, project_phase.Value <> "Complete") ) );
                          Set( gPrjLedOverdue,
                               CountRows( Filter( colMyProjects,
                                   project_phase.Value <> "Complete"
                                && !IsBlank(project_date_target) && project_date_target < Today() ) ) );
                          Set( gTaskLed,
                               CountRows( Filter(colMyTasks, task_stage.Value <> "Complete") ) );
                          Set( gTaskLedOverdue,
                               CountRows( Filter( colMyTasks,
                                   task_stage.Value <> "Complete"
                                && !IsBlank(task_date_target) && task_date_target < Today() ) ) );
                          Set( gIssLed,
                               Coalesce( Sum( ForAll( colMyProjects As p,
                                                      CountRows( Filter( OpenIssues,
                                                                         issue_project_id.Id = p.ID ) ) ),
                                              Value ),
                                         0 ) );
                          Set( gIssMine, CountRows(colMyIssues) );
                          Set( gMyPercent,
                               If( CountRows(colMyTasks) = 0, 0,
                                   RoundDown( Average( AddColumns( colMyTasks, wgt,
                                       Coalesce(LookUp(gStageWeights, Stage = task_stage.Value, Weight), 0) ), wgt ), 0 ) ) );
                          Set(gToastShow, false);
                          Set(gToastMsg, "Refreshed"); Set(gToastTone, "Info"); Set(gToastShow, true)
            # ---- Metric cards ----------------------------------------------
            # PLAIN CONTAINERS, NOT cmpStatusCard. The component carries a
            # full-bleed transparent button with a hover wash, so it reads as
            # tappable; these four are deliberately inert.
            - rowCards:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =gTheme.Space.Gap
                  FillPortions: =0
                  LayoutMinHeight: =96
                  Width: =Parent.Width - 48
                  Height: =96
                Children:
                  - cardPrjLed:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =2
                        PaddingTop: =12
                        PaddingBottom: =10
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =190
                        Height: =96
                      Children:
                        - lblPrjLedCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Projects led"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width - 32
                              Height: =18
                        - lblPrjLedVal:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Text(gPrjLed)
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H1
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =34
                              Width: =Parent.Width - 32
                              Height: =34
                        - lblPrjLedSub:
                            Control: Label@2.5.1
                            Properties:
                              # A percentage of nothing is not 0%, it is undefined —
                              # say so rather than print a reassuring zero.
                              Text: |
                                =If( gPrjLed = 0, "none open",
                                     RoundDown(gPrjLedOverdue / gPrjLed * 100, 0) & "% overdue" )
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: |
                                =If(gPrjLedOverdue > 0, gTheme.Color.Danger, gTheme.Color.TextMuted)
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =16
                              Width: =Parent.Width - 32
                              Height: =16
                  - cardTaskLed:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =2
                        PaddingTop: =12
                        PaddingBottom: =10
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =190
                        Height: =96
                      Children:
                        - lblTaskLedCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Tasks led"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width - 32
                              Height: =18
                        - lblTaskLedVal:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Text(gTaskLed)
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H1
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =34
                              Width: =Parent.Width - 32
                              Height: =34
                        - lblTaskLedSub:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                =If( gTaskLed = 0, "none open",
                                     RoundDown(gTaskLedOverdue / gTaskLed * 100, 0) & "% overdue" )
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: |
                                =If(gTaskLedOverdue > 0, gTheme.Color.Danger, gTheme.Color.TextMuted)
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =16
                              Width: =Parent.Width - 32
                              Height: =16
                  - cardIssLed:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =2
                        PaddingTop: =12
                        PaddingBottom: =10
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =190
                        Height: =96
                      Children:
                        - lblIssLedCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Open Issues on my Projects"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width - 32
                              Height: =18
                        - lblIssLedVal:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Text(gIssLed)
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H1
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =34
                              Width: =Parent.Width - 32
                              Height: =34
                  - cardIssMine:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =2
                        PaddingTop: =12
                        PaddingBottom: =10
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =190
                        Height: =96
                      Children:
                        - lblIssMineCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Issues Owned and Still Open"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width - 32
                              Height: =18
                        - lblIssMineVal:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Text(gIssMine)
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H1
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =34
                              Width: =Parent.Width - 32
                              Height: =34
                        - lblIssMineSub:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="open and assigned to you"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =16
                              Width: =Parent.Width - 32
                              Height: =16
            # ---- Work lists ------------------------------------------------
            - rowLists:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =gTheme.Space.Gap
                  FillPortions: =1
                  LayoutMinHeight: =240
                  Width: =Parent.Width - 48
                  Height: =Parent.Height - 452
                Children:
                  - secMyTasks:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =8
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =340
                        Height: =Parent.Height
                      Children:
                        - lblMyTasksTitle:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Open tasks I lead   " & gTaskLed
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H3
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.Primary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =28
                              Width: =Parent.Width - 32
                              Height: =28
                        - lblMyTasksEmpty:
                            Control: Label@2.5.1
                            Properties:
                              Visible: =IsEmpty(galMyTasks.AllItems)
                              Text: ="Nothing open — no task on any live project has you as its lead."
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =24
                              Width: =Parent.Width - 32
                              Height: =24
                        - galMyTasks:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                            Properties:
                              # colMyTasks is a LOCAL collection, so `<>` and the
                              # composite sort cost nothing — neither has to delegate.
                              #
                              # ONE composite sort key, not two chained Sorts: Power Fx
                              # does not guarantee a stable sort, so a second Sort could
                              # undo the first. priority * 100000 dominates, the day count
                              # breaks ties within a priority, and +50000 keeps an overdue
                              # (negative) count positive. No target date sorts last inside
                              # its own priority band rather than first.
                              Items: |
                                =Sort( Filter(colMyTasks, task_stage.Value <> "Complete"),
                                       Switch( task_priority.Value,
                                               "Critical", 1, "High", 2,
                                               "Moderate", 3, "Low", 4, 5 ) * 100000
                                       + If( IsBlank(task_date_target), 99999,
                                             DateDiff(Today(), task_date_target, TimeUnit.Days) + 50000 ) )
                              WrapCount: =1
                              TemplateSize: =48
                              TemplatePadding: =0
                              TemplateFill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              ShowScrollbar: =true
                              FillPortions: =1
                              LayoutMinHeight: =120
                              Width: =Parent.Width - 32
                              Height: =Parent.Height - 76
                            Children:
                              - rowMyTaskBody:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =10
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =Parent.TemplateHeight - 1
                                  Children:
                                    # INLINE SVG, NOT A COMPONENT. A canvas component
                                    # cannot be placed inside a gallery template — Studio
                                    # refuses the paste.
                                    #
                                    # LIFECYCLE glyph, bound to task_stage — the same
                                    # progression scrProject and scrProjects use.
                                    # task_status is a separate RAG health column and is
                                    # NOT what this shows.
                                    #
                                    # HEX TEXT, not gTheme.Color.*: these drop straight
                                    # into the SVG string and Power Fx has no Color-to-hex
                                    # conversion. Primary #005A9E · Success #31825D ·
                                    # Warning #D69828 · TextMuted #6E7882.
                                    - icoMyTaskStage:
                                        Control: Image@2.2.3
                                        Properties:
                                          ImagePosition: =ImagePosition.Fit
                                          FillPortions: =0
                                          LayoutMinWidth: =22
                                          Width: =22
                                          Height: =22
                                          Image: |
                                            =With(
                                                { g: Switch( Coalesce(ThisItem.task_stage.Value, ""),
                                                      "Not Started",
                                                          "<circle cx='18' cy='18' r='13' fill='none' stroke='#B9C0C8' stroke-width='2.5'/>",
                                                      "Planning",
                                                          "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'/>"
                                                        & "<circle cx='12.5' cy='18' r='1.7' fill='#6E7882'/>"
                                                        & "<circle cx='18'   cy='18' r='1.7' fill='#6E7882'/>"
                                                        & "<circle cx='23.5' cy='18' r='1.7' fill='#6E7882'/>",
                                                      "Drafting",
                                                          "<circle cx='18' cy='18' r='13' fill='none' stroke='#005A9E' stroke-width='3'/>"
                                                        & "<circle cx='18' cy='18' r='5' fill='#005A9E'/>",
                                                      "Finalizing",
                                                          "<circle cx='18' cy='18' r='13' fill='none' stroke='#D69828' stroke-width='3'/>"
                                                        & "<circle cx='18' cy='18' r='9' fill='#D69828'/>",
                                                      "Complete",
                                                          "<circle cx='18' cy='18' r='14.5' fill='#31825D'/>"
                                                        & "<path d='M11 18.5 L16 23.5 L25 13.5' fill='none' stroke='#FFFFFF'"
                                                        & " stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/>",
                                                          "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'"
                                                        & " stroke-dasharray='4 3'/>"
                                                        & "<text x='18' y='22.5' text-anchor='middle' font-size='13'"
                                                        & " font-family='Segoe UI, sans-serif' fill='#6E7882'>?</text>" ) },
                                                "data:image/svg+xml," & EncodeUrl(
                                                    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'>" & g & "</svg>" )
                                            )
                                    - cellMyTaskPriority:
                                        Control: Label@2.5.1
                                        Properties:
                                          # Colour-coded, but the value is also SPELLED
                                          # OUT — colour alone would carry the whole
                                          # meaning for a reader who cannot see it.
                                          Text: =Coalesce(ThisItem.task_priority.Value, "—")
                                          Font: =gTheme.Font
                                          FontWeight: =FontWeight.Semibold
                                          Size: =gTheme.Size.Small
                                          Color: |
                                            =Switch( ThisItem.task_priority.Value,
                                                     "Critical", gTheme.Color.Danger,
                                                     "High",     gTheme.Color.Warning,
                                                     "Moderate", gTheme.Color.Primary,
                                                                 gTheme.Color.TextMuted )
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =1
                                          LayoutMinWidth: =70
                                          Height: =40
                                    - cellMyTaskName:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =ThisItem.task_name
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Body
                                          Color: =gTheme.Color.TextPrimary
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =3
                                          LayoutMinWidth: =130
                                          Height: =40
                                    - cellMyTaskProject:
                                        Control: Label@2.5.1
                                        Properties:
                                          # RESOLVED APP-SIDE. task_project_id is a Lookup
                                          # and the canvas connector DISPLAYS ITS NUMERIC
                                          # ID, not project_name — the lookup's `show:`
                                          # column is not what comes back. One delegable
                                          # ID lookup per visible row.
                                          Text: |
                                            =Coalesce( LookUp( taskmaster_projects,
                                                               ID = ThisItem.task_project_id.Id,
                                                               project_name ),
                                                       "—" )
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Small
                                          Color: =gTheme.Color.TextMuted
                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =2
                                          LayoutMinWidth: =110
                                          Height: =40
                              # Absolute siblings of the row container, not children of
                              # it: both must span the whole template, and the hit button
                              # must be LAST so it is on top.
                              - rowMyTaskLine:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =gTheme.Color.Border
                                    X: =0
                                    Y: =Parent.TemplateHeight - 1
                                    Width: =Parent.TemplateWidth
                                    Height: =1
                              - galMyTasksHit:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    # The row's action lives HERE, not on the gallery's
                                    # OnSelect: a gallery's own OnSelect does not reliably
                                    # fire when the click lands on a child control, so
                                    # without a transparent full-template button declared
                                    # LAST the rows look right and do nothing.
                                    Text: =""
                                    Fill: =RGBA(0, 0, 0, 0)
