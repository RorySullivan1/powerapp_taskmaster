            # ---- Charts band -----------------------------------------------
            # FOUR SVG VISUALS, all drawn in Power Fx and handed to an Image control
            # as a data URI. Read `.claude/skills/power-apps-svg` before editing one.
            #
            # THE CHART FORMULAS ARE DECLARATIVE ON PURPOSE. They read colMyTasks /
            # colMyIssues / colMyProjects directly rather than a pre-computed global,
            # so Refresh redraws them with no second copy of the maths to keep in step.
            #
            # NO FRACTION IS EVER INTERPOLATED. A bare fraction lands in the SVG using
            # the VIEWER'S decimal separator, and `stroke-dasharray='33,3 66,7'` is not
            # a number pair; Text(x, "[$-en-US]0.#", "en-US") is the documented cure but
            # it puts a construct Power Fx may not render into an attribute, and an
            # attribute it cannot render comes out EMPTY — a rect with width='' is not a
            # thin rect, it is no rect, and a circle with stroke-dasharray='' is a SOLID
            # ring. Every coordinate here is a whole number: viewBoxes are scaled up
            # until integer precision is enough, and Round() does the rest.
            - rowCharts:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =gTheme.Space.Gap
                  FillPortions: =0
                  LayoutMinHeight: =320
                  Width: =Parent.Width - 48
                  Height: =320
                Children:
                  - pnlTimeline:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =8
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =2
                        LayoutMinWidth: =300
                        Height: =Parent.Height
                      Children:
                        - lblTimelineTitle:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Timeline"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H3
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.Primary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =24
                              Width: =Parent.Width - 32
                              Height: =24
                        - imgTimeline:
                            Control: Image@2.2.3
                            Properties:
                              ImagePosition: =ImagePosition.Fit
                              FillPortions: =1
                              LayoutMinHeight: =90
                              Width: =Parent.Width - 32
                              Height: =Parent.Height - 48
                              # GANTT of the projects you lead, soonest target first, over
                              # colTimeline / gTlStart / gTlEnd / gTlSpan built in OnVisible.
                              #
                              # TEN ROWS. The viewBox grows with the row count, so a taller
                              # chart renders SMALLER inside a fixed panel — the cap is what
                              # keeps the bars legible, not a data limit.
                              Image: |
                                =With( { n: CountRows(colTimeline) },
                                    // charset IS load-bearing: project names are the only
                                    // user-supplied text in any of these charts, and a data URI
                                    // defaults to US-ASCII, which mangles any accented name.
                                    "data:image/svg+xml;charset=utf-8," & EncodeUrl(
                                        "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 "
                                      & If(n = 0, 62, 16 + n * 20 + 6) & "'>"
                                      & "<text x='92' y='9' font-size='7' font-family='Segoe UI, sans-serif'"
                                      & " fill='#6E7882'>" & Text(gTlStart, "d mmm") & "</text>"
                                      & "<text x='316' y='9' text-anchor='end' font-size='7'"
                                      & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                      & Text(gTlEnd, "d mmm") & "</text>"
                                      & Concat( colTimeline,
                                            "<text x='0' y='" & (16 + (idx - 1) * 20 + 13) & "' font-size='8.5'"
                                          & " font-family='Segoe UI, sans-serif' fill='#20262D'>"
                                          & EncodeHTML( If( Len(Trim(nm)) > 15,
                                                            Left(Trim(nm), 14) & "..",
                                                            Trim(nm) ) ) & "</text>"
                                          & "<rect x='92' y='" & (16 + (idx - 1) * 20 + 5)
                                          & "' width='224' height='10' rx='5' fill='#F2F4F7'/>"
                                          & "<rect x='"
                                          & ( 92 + Round( Max(0, DateDiff(gTlStart, d0, TimeUnit.Days))
                                                          / gTlSpan * 224, 0 ) )
                                          & "' y='" & (16 + (idx - 1) * 20 + 5) & "' width='"
                                          & Max( 3, Round( ( DateDiff(gTlStart, d1, TimeUnit.Days)
                                                           - Max(0, DateDiff(gTlStart, d0, TimeUnit.Days)) )
                                                           / gTlSpan * 224, 0 ) )
                                          & "' height='10' rx='5' fill='"
                                          & If(d1 < Today(), "#C53A3A", "#005A9E") & "'/>" )
                                      & If( n = 0,
                                            // THE EMPTY STATE COUNTS OUT LOUD. "Nothing to plot" and
                                            // "the chart is broken" look identical across a one-way
                                            // gap, so it says which of the two filters emptied it.
                                            "<text x='160' y='30' text-anchor='middle' font-size='10'"
                                          & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                          & "Nothing to plot</text>"
                                          & "<text x='160' y='45' text-anchor='middle' font-size='7.5'"
                                          & " font-family='Segoe UI, sans-serif' fill='#B9C0C8'>"
                                          & CountRows(colMyProjects) & " project(s) led · "
                                          & CountRows( Filter(colMyProjects, !IsBlank(project_date_target)) )
                                          & " with a target date</text>",
                                            // TODAY marker, drawn last so it sits over the bars.
                                            "<line x1='"
                                          & (92 + Round(DateDiff(gTlStart, Today(), TimeUnit.Days) / gTlSpan * 224, 0))
                                          & "' y1='12' x2='"
                                          & (92 + Round(DateDiff(gTlStart, Today(), TimeUnit.Days) / gTlSpan * 224, 0))
                                          & "' y2='" & (16 + n * 20 + 2)
                                          & "' stroke='#C53A3A' stroke-width='0.8' stroke-dasharray='2 2'/>" )
                                      & "</svg>" ) )
                  - pnlPieTasks:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =210
                        Height: =Parent.Height
                      Children:
                        - lblPieTasksTitle:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Tasks by stage"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H3
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.Primary
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =24
                              Width: =Parent.Width - 24
                              Height: =24
                        - imgPieTasks:
                            Control: Image@2.2.3
                            Properties:
                              ImagePosition: =ImagePosition.Fit
                              FillPortions: =1
                              LayoutMinHeight: =90
                              Width: =Parent.Width - 24
                              Height: =Parent.Height - 48
                              # DONUT + LEGEND IN ONE SVG, legend UNDER the ring. The legend
                              # has to live inside the picture: an Image is a single control,
                              # so there is nothing to hover and no per-slice click, and a
                              # legend built from real controls would cost more than the chart.
                              # Stacked rather than side by side because the panel is now a
                              # third of the row — a wide chart would render as a thin strip
                              # across the middle of it.
                              #
                              # THE CATEGORY TABLE IS WRITTEN OUT, not derived with GroupBy.
                              # A group only exists when a row has that value, so GroupBy would
                              # drop empty stages, reorder the slices run to run, and change the
                              # colour of a stage between two refreshes. Written out, the
                              # vocabulary and the ordering are fixed.
                              #
                              # "OTHER" IS WHAT STOPS THE ALLOW-LIST FAILING SILENTLY. It counts
                              # every task whose stage matches NONE of the five, so `tot` is
                              # always the real row count and a live vocabulary that has drifted
                              # from schema.yaml shows up as a labelled purple slice instead of
                              # a ring that quietly renders the wrong proportions. If Other is
                              # ever non-zero, the SharePoint column and this list disagree.
                              #
                              # `uc` is the running total, which Power Fx has no primitive for:
                              # each row sums the rows with a LOWER index, named through `As r`
                              # so the inner Filter's scope cannot shadow the outer one.
                              #
                              # EVERY COORDINATE IS A WHOLE NUMBER, and the viewBox is 10x the
                              # natural size so that the circumference is 1000 units and a slice
                              # still has a tenth of a percent of precision. Fractions have to be
                              # rendered with Text(), which brings the locale decimal separator
                              # into an SVG attribute; an attribute Power Fx cannot render is an
                              # EMPTY attribute, and an empty stroke-dasharray does not draw a
                              # thin arc — it draws a SOLID RING in the last slice's colour.
                              Image: |
                                =With(
                                    { cats: AddColumns(
                                                Table( { i: 1, k: "Not Started", c: "#B9C0C8" },
                                                       { i: 2, k: "Planning",    c: "#6E7882" },
                                                       { i: 3, k: "Drafting",    c: "#005A9E" },
                                                       { i: 4, k: "Finalizing",  c: "#D69828" },
                                                       { i: 5, k: "Complete",    c: "#31825D" },
                                                       { i: 6, k: "Other",       c: "#8A5AA8" } ) As cat,
                                                n, If( cat.k = "Other",
                                                       CountRows( Filter( colMyTasks,
                                                           !( task_stage.Value = "Not Started"
                                                           || task_stage.Value = "Planning"
                                                           || task_stage.Value = "Drafting"
                                                           || task_stage.Value = "Finalizing"
                                                           || task_stage.Value = "Complete" ) ) ),
                                                       CountRows( Filter(colMyTasks, task_stage.Value = cat.k) ) ) ) },
                                    With( { tot: Max(1, Sum(cats, n)) },
                                        With(
                                            { arcs: AddColumns( cats As r,
                                                        u, Round( r.n / tot * 1000, 0 ),
                                                        uc, Round( Coalesce( Sum( Filter(cats, i < r.i), n ), 0 )
                                                                   / tot * 1000, 0 ) ),
                                              // The legend lists only categories that HAVE rows, so it needs
                                              // its own 1..n ordinal — `i` is the fixed slot in the vocabulary
                                              // and would leave a blank line wherever a value is unused.
                                              leg: ForAll( Sequence( CountRows(Filter(cats, n > 0)) ) As s,
                                                       With( { g: Index(Filter(cats, n > 0), s.Value) },
                                                           { j: s.Value, lk: g.k, ln: g.n, lc: g.c } ) ) },
                                            "data:image/svg+xml," & EncodeUrl(
                                                // HEIGHT GROWS WITH THE LEGEND so the chart stays close to
                                                // square and fills a third-width panel. The ring's radius is
                                                // FIXED at 159.155 — that is what makes the circumference
                                                // exactly 1000, which the integer dasharray depends on.
                                                "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 440 "
                                              & (410 + CountRows(leg) * 34 + 12) & "'>"
                                              & "<circle cx='220' cy='200' r='159.155' fill='none'"
                                              & " stroke='#EEF1F5' stroke-width='40'/>"
                                              & Concat( Filter(arcs, u > 0),
                                                    "<circle cx='220' cy='200' r='159.155' fill='none' stroke='" & c
                                                  & "' stroke-width='40' stroke-dasharray='"
                                                  & u & " " & (1000 - u)
                                                  & "' stroke-dashoffset='" & Mod(1250 - uc, 1000) & "'/>" )
                                              & "<text x='220' y='215' text-anchor='middle' font-size='90'"
                                              & " font-weight='600' font-family='Segoe UI, sans-serif' fill='#20262D'>"
                                              & CountRows(colMyTasks) & "</text>"
                                              & "<text x='220' y='262' text-anchor='middle' font-size='34'"
                                              & " font-family='Segoe UI, sans-serif' fill='#6E7882'>TASKS</text>"
                                              & Concat( leg,
                                                    "<rect x='120' y='" & (410 + (j - 1) * 34 + 4)
                                                  & "' width='26' height='26' rx='6' fill='" & lc & "'/>"
                                                  & "<text x='158' y='" & (410 + (j - 1) * 34 + 24) & "' font-size='28'"
                                                  & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                                  & EncodeHTML(lk) & "  " & ln & "</text>" )
                                              & "</svg>" ) ) ) )
                  - pnlPieIssues:
