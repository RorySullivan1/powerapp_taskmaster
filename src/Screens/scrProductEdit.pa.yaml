# =============================================================================
# scrProductEdit  —  create / edit ONE product. Compact by instruction.
#
# REACHABLE FROM EXACTLY TWO PLACES, like scrClientEdit:
#   1. scrReference ▸ Products        — maintenance
#   2. cmpPicker ▸ "＋ New"          — quick creation mid-flow
# Not in gNavMenu. A product is reference data, not a destination.
#
# THREE required columns and no Person, so this is genuinely small: a business
# key, a type path, a description. See scrClientEdit for the return contract and
# for why quick-create is a screen rather than a "+" inside the picker dialog.
#
# product_uid IS A BUSINESS KEY (ISIN / Ticker / internal ID) and schema.yaml
# calls it unique. SharePoint does not enforce that, so the save checks for a
# duplicate BEFORE writing — a delegable `=` on an indexed Text column. Without
# it the app would happily create a second row for the same instrument and every
# lookup pointing at it would then be ambiguous.
#
# BAND ARITHMETIC (1366x768):
#      0 ..  64   header (absolute)
#     64 .. 700   bodyRoot, vertical auto-layout, 24 padding
#    700 .. 768   actionBar (opaque, absolute)
# =============================================================================
Screens:
  scrProductEdit:
    Properties:
      Fill: =gTheme.Color.Bg
      OnVisible: |
        =Set( gSaving, false );   // see btnPdSave
        Set( gPdUid,      If( gPdMode = "Edit", Coalesce(gEditProduct.product_uid, ""), "" ) );
        Set( gPdTypeId,   If( gPdMode = "Edit", Coalesce(gEditProduct.product_type_id, 0), 0 ) );
        Set( gPdTypePath, If( gPdMode = "Edit", Coalesce(gEditProduct.product_type_path, ""), "" ) );
        Set( gPdDesc,     If( gPdMode = "Edit", Coalesce(gEditProduct.product_description, ""), "" ) );
        ClearCollect( colMapProdType, mapping_producttype );
        // FROM Choices() ON THE COLUMN, never a literal list. product_assetclass ships
        // with PLACEHOLDER values in the golden source, so whatever is actually
        // provisioned appears here with no app change — and a label the Choice would
        // refuse can never be written, which is what broke issue_type on 2026-08-13.
        //
        // cmpSelection needs {Id, Label} and Choices() returns only Value, so the Id is
        // synthesised POSITIONALLY. The Ids mean nothing beyond "which row", so DefaultId
        // looks up by Label.
        //
        // NO "(none)" ROW — the column is REQUIRED, so there is nothing to represent.
        ClearCollect( colPdAssetOpts,
                      With( { ch: Choices([@taskmaster_products].product_assetclass) },
                            ForAll( Sequence( CountRows(ch) ) As n,
                                    { Id:    n.Value,
                                      Label: Index(ch, n.Value).Value } ) ) );
        // A NEW PRODUCT OPENS ON THE FIRST CHOICE, so the ORDER of the column's values
        // decides its default — order them with the safest first.
        //
        // Seeding it rather than leaving it blank is deliberate: cmpSelection's DefaultId
        // falls back to row 1 whichever way, so a blank global would leave the strip
        // HIGHLIGHTING a value the save does not hold. A display that disagrees with the
        // write is the defect that got scrTask deleted.
        Set( gPdAsset, If( gPdMode = "Edit",
                           Coalesce( gEditProduct.product_assetclass.Value,
                                     First(colPdAssetOpts).Label ),
                           First(colPdAssetOpts).Label ) );
        Set( gPdDup, false );
        // A toggle re-reads Default and cmpSelection re-reads DefaultId ONLY on Reset —
        // without these the previous product's values survive into the next one, and the
        // control then DISAGREES WITH THE SAVE rather than failing visibly.
        Reset( txtPdUid ); Reset( txtPdDesc ); Reset( pickPdType );
        Reset( tglPdEsg ); Reset( selPdAsset )
    Children:
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Primary
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =gTheme.Space.HeaderH
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: =If(gPdMode = "Edit", "Edit product", "New product")
            Color: =gTheme.Color.OnPrimary
            Font: =gTheme.Font
            Size: =gTheme.Size.H2
            FontWeight: =FontWeight.Semibold
            VerticalAlign: =VerticalAlign.Middle
            X: =gTheme.Space.Gutter
            Y: =0
            Width: =Parent.Width - 120
            Height: =gTheme.Space.HeaderH
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =gTheme.Color.OnPrimary
            HoverColor: =gTheme.Color.OnPrimary
            HoverFill: =RGBA(255, 255, 255, 0.15)
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            Tooltip: ="Close without saving"
            X: =Parent.Width - 24 - gTheme.Space.Gutter
            Y: =(gTheme.Space.HeaderH - 24) / 2
            Width: =24
            Height: =24
            OnSelect: =Back()
      - bodyRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Start
            LayoutGap: =12
            PaddingTop: =gTheme.Space.Gutter
            PaddingBottom: =gTheme.Space.Gutter
            PaddingLeft: =gTheme.Space.Gutter
            PaddingRight: =gTheme.Space.Gutter
            LayoutOverflowY: =LayoutOverflow.Scroll
            Fill: =gTheme.Color.Surface
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 68
          Children:
            - lblPdUidCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Product ID  *   (ISIN, ticker or internal ID)"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinHeight: =18
                  Width: =Parent.Width - 48
                  Height: =18
            - txtPdUid:
                Control: ModernTextInput@1.1.1
                Properties:
                  Default: =If(gPdMode = "Edit", gEditProduct.product_uid, "")
                  Placeholder: ="e.g. XS1234567890"
                  TriggerOutput: =TriggerOutput.Delayed
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  FillPortions: =0
                  LayoutMinHeight: =36
                  Width: =Parent.Width - 48
                  Height: =36
                  OnChange: |
                    =Set( gPdUid, Trim(txtPdUid.Text) );
                     Set( gPdDup, false )
            - lblPdDup:
                Control: Label@2.5.1
                Properties:
                  Visible: =gPdDup = true
                  Text: ="A product with this ID already exists. Use it instead of creating a second one."
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.Danger
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinHeight: =18
                  Width: =Parent.Width - 48
                  Height: =18
            # WRAPPED IN A COL — a component instance cannot carry FillPortions
            # or LayoutMinHeight; the wrapper holds the auto-layout contract.
            - colPdType:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =0
                  FillPortions: =0
                  LayoutMinHeight: =64
                  Width: =Parent.Width - 48
                  Height: =64
                Children:
                  - pickPdType:
                      Control: CanvasComponent
                      ComponentName: cmpNestedSelect
                      Properties:
                        Terms: =colMapProdType
                        Caption: ="Product type  *"
                        DefaultPath: =gPdTypePath
                        Separator: =" | "
                        Width: =Parent.Width
                        Height: =64
                        OnChange: |
                          =Set( gPdTypeId,   pickPdType.SelectedId );
                           Set( gPdTypePath, pickPdType.SelectedPath )
            - lblPdAssetCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Asset class  *"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinHeight: =18
                  Width: =Parent.Width - 48
                  Height: =18
            # A cmpSelection INSTANCE takes no FillPortions/LayoutMinHeight — the
            # contract check rejects them there — so it carries Width/Height only.
            - selPdAsset:
                Control: CanvasComponent
                ComponentName: cmpSelection
                Properties:
                  Width: =Parent.Width - 48
                  Height: =40
                  Items: =colPdAssetOpts
                  DefaultId: =Coalesce( LookUp(colPdAssetOpts, Label = gPdAsset, Id), 1 )
                  OnChange: =Set( gPdAsset, selPdAsset.Selected.Label )
            # A Classic/Toggle, NOT a check box: the check-box token is not grounded for
            # this dialect and an unverified control fails the WHOLE screen paste. Same
            # control the two scrTaskEdit section switches use.
            #
            # No global behind it. Default seeds from the record and the save reads
            # tglPdEsg.Value directly, exactly as txtPdUid/txtPdDesc do — a global would
            # be a third copy of the same fact.
            - rowPdEsg:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =12
                  FillPortions: =0
                  LayoutMinHeight: =34
                  Width: =Parent.Width - 48
                  Height: =34
                Children:
                  - tglPdEsg:
                      Control: Classic/Toggle@2.1.0
                      Properties:
                        # Coalesce, not a bare read: a Yes/No column added to a list that
                        # already has rows comes back BLANK on those rows, not false.
                        Default: |
                          =If( gPdMode = "Edit",
                               Coalesce(gEditProduct.product_esg, false), false )
                        FalseText: =""
                        TrueText: =""
                        FillPortions: =0
                        LayoutMinWidth: =60
                        Width: =60
                        Height: =30
                  - lblPdEsgCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="ESG product"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Body
                        Color: =gTheme.Color.TextPrimary
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =1
                        LayoutMinWidth: =140
                        Height: =34
            - lblPdDescCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Description  *"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinHeight: =18
                  Width: =Parent.Width - 48
                  Height: =18
            - txtPdDesc:
                Control: ModernTextInput@1.1.1
                Properties:
                  Default: =If(gPdMode = "Edit", gEditProduct.product_description, "")
                  Placeholder: ="What this product is"
                  Type: =TextInputType.Multiline
                  TriggerOutput: =TriggerOutput.Delayed
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  FillPortions: =0
                  LayoutMinHeight: =84
                  Width: =Parent.Width - 48
                  Height: =84
                  OnChange: =Set( gPdDesc, txtPdDesc.Text )
      - actionBarBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            BorderColor: =gTheme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =Parent.Height - 68
            Width: =Parent.Width
            Height: =68
      - lblPdMissing:
          Control: Label@2.5.1
          Properties:
            Visible: =Len(Self.Text) > 0
            Text: |
              =Trim(
              If( Len(Trim(txtPdUid.Text)) = 0, "a product ID   ", "" ) &
              If( Len(gPdTypePath) = 0,         "a product type   ", "" ) &
              // Can only fire if the column has no Choice values provisioned at all —
              // otherwise the strip always holds one. Cheap, and it turns a rejected
              // Patch into a sentence.
              If( Len(gPdAsset) = 0,            "an asset class   ", "" ) &
              If( Len(Trim(txtPdDesc.Text)) = 0, "a description   ", "" ) )
            Font: =gTheme.Font
            Size: =gTheme.Size.Small
            Color: =gTheme.Color.Danger
            VerticalAlign: =VerticalAlign.Middle
            X: =gTheme.Space.Gutter
            Y: =Parent.Height - 68
            Width: =Parent.Width - gTheme.Space.Gutter - 320
            Height: =68
      - btnPdCancel:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Cancel"
            Fill: =gTheme.Color.Surface
            Color: =gTheme.Color.Primary
            BorderColor: =gTheme.Color.Primary
            BorderThickness: =1
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            X: =Parent.Width - gTheme.Space.Gutter - 140 - 8 - 140
            Y: =Parent.Height - 68 + 12
            Width: =140
            Height: =44
            OnSelect: =Back()
      - btnPdSave:
          Control: Classic/Button@2.2.0
          Properties:
            Text: |
              =If( gSaving, "Saving…",
                   If(gPdMode = "Edit", "Save product", "Create product") )
            Fill: =gTheme.Color.Primary
            Color: =gTheme.Color.OnPrimary
            BorderColor: =gTheme.Color.Primary
            BorderThickness: =0
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            X: =Parent.Width - gTheme.Space.Gutter - 140
            Y: =Parent.Height - 68 + 12
            Width: =140
            Height: =44
            # ALWAYS ENABLED — a disabled button cannot say why it is disabled.
            OnSelect: |
              =If( gSaving,
              // A SECOND TAP WHILE THE FIRST WRITE IS STILL IN FLIGHT. Do nothing.
              // A SharePoint Patch takes seconds; the button stayed live throughout, so a
              // double-tap ran the whole handler twice and Defaults() built a SECOND new
              // record. `Set` applies immediately within a behaviour chain, so the flag is
              // already true by the time the second tap is evaluated.
              // NO DisplayMode GATE — see this button's ALWAYS ENABLED note. A disabled
              // button cannot fire OnSelect and cannot say why; the Text says "Saving…"
              // instead, and the guard below is what actually blocks the duplicate.
              false,
              Set( gSaving, true );
              If( Len(lblPdMissing.Text) > 0,
              Notify( "Can't save yet — this product still needs: " & lblPdMissing.Text,
              NotificationType.Error ),
              // BLANK THE RECORD, NOT JUST THE MESSAGE. Left holding the last
              // successful save, gPdSaved makes the IsBlank(.ID) guard below pass on a
              // PREVIOUS record — so a write that fails with an empty error message
              // reported success and handed the caller's form the WRONG record.
              // scrTaskEdit has always blanked its equivalent; these two did not.
              Set( gPdSaved, Blank() );
              Set( gPdErr, "" );
              // product_uid is a business key and SharePoint does not enforce uniqueness,
              // so check first. The query is `=` on an indexed Text column ONLY — an
              // `ID <>` clause used to sit here too, and `<>` DOES NOT DELEGATE on ID
              // (delegation.md [id]), which quietly made the whole LookUp local: past the
              // data row limit a duplicate slipped through with no warning. Excluding the
              // row being edited is a comparison on the RESULT, not part of the query.
              Set( gPdClash,
              LookUp( taskmaster_products, product_uid = Trim(txtPdUid.Text) ) );
              If( !IsBlank(gPdClash.ID)
              && gPdClash.ID <> If(gPdMode = "Edit", gEditProduct.ID, 0),
              Set( gPdDup, true );
              Notify( "A product with ID " & Trim(txtPdUid.Text) & " already exists.",
              NotificationType.Error ),
              Set( gPdDup, false );
              IfError(
              Set( gPdSaved,
              Patch( taskmaster_products,
              If( gPdMode = "Edit", gEditProduct, Defaults(taskmaster_products) ),
              { product_uid:         Trim(txtPdUid.Text),
              product_type_id:     gPdTypeId,
              product_type_path:   gPdTypePath,
              product_description: txtPdDesc.Text,
              product_assetclass:  { Value: gPdAsset },
              product_esg:         tglPdEsg.Value } ) ),
              Set( gPdErr, FirstError.Message ) );
              // Trust the RECORD, never the message.
              If( IsBlank(gPdSaved.ID) && Len(gPdErr) = 0,
              Set( gPdErr, "SharePoint returned no record and no error message, so nothing was saved." ) );
              If( Len(gPdErr) > 0,
              Notify( "Couldn't save the product: " & gPdErr, NotificationType.Error ) );
              If( Len(gPdErr) = 0 && !IsBlank(gPdSaved.ID),
              // TWO ONE-ARMED Ifs, not one two-armed one: the task branch Collects and
              // the transaction branch Sets, and an If's arms have to agree on type —
              // Collect returns a table, Set a boolean. A task takes MANY products now,
              // so a newly created one is appended to the staging collection rather than
              // replacing a single global.
              If( gPdReturn = "TaskProduct",
              Collect( colTkProducts, { Id: gPdSaved.ID, Uid: gPdSaved.product_uid } ) );
              If( gPdReturn = "TxProduct",
              Set( gTxProduct, { Id: gPdSaved.ID, Value: gPdSaved.product_uid } ) );
              Set( gPdReturn, "" );
              Notify( If(gPdMode = "Edit", "Product saved", "Product created"), NotificationType.Success );
              Back() ) ) );
              Set( gSaving, false ) )
