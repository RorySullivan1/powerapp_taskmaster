# =============================================================================
# scrProductEdit — create / edit ONE product. Compact by instruction.
# Reachable from scrReference ▸ Products and from cmpPicker ▸ "＋ New" only; a product
# is reference data, not a destination, so it is not in gNavMenu.
#
# product_uid IS A BUSINESS KEY (ISIN / Ticker / internal ID) and schema.yaml calls it
# unique. SHAREPOINT DOES NOT ENFORCE THAT, so the save checks for a duplicate BEFORE
# writing — without it a second row for the same instrument makes every lookup
# pointing at it ambiguous.
#
# BAND ARITHMETIC (1366x768): 0..64 header (absolute) · 64..700 bodyRoot, vertical
# auto-layout, 24 padding · 700..768 actionBar (opaque, absolute).
# =============================================================================
Screens:
  scrProductEdit:
    Properties:
      Fill: =gTheme.Color.Bg
      OnVisible: |
        =Set( gSaving, false );   // see btnPdSave
        Set( gPdUid,      If( gPdMode = "Edit", Coalesce(gEditProduct.product_uid, ""), "" ) );
        Set( gPdTypeId,   If( gPdMode = "Edit", Coalesce(gEditProduct.product_type_id, 0), 0 ) );
        Set( gPdTypePath, If( gPdMode = "Edit", Coalesce(gEditProduct.product_type_path, ""), "" ) );
        Set( gPdDesc,     If( gPdMode = "Edit", Coalesce(gEditProduct.product_description, ""), "" ) );
        // gPdUnd IS THE UNDERLYING BOX'S Default, not a copy of it. A suggestion chip appends
        // to this global and Resets the control — the only way to write into a text input,
        // which has no .Text setter.
        Set( gPdUnd, If( gPdMode = "Edit", Coalesce(gEditProduct.product_underlying, ""), "" ) );
        // ONCE PER SESSION, NOT ONCE PER VISIT. All three are reference data and independent
        // of the product being edited, so an EMPTY collection is the only reason to fetch one
        // again; someone else's addition is picked up on the next app start. IsEmpty, never
        // IsBlank: these are tables.
        //
        // THE GUARD MATTERS MORE HERE THAN ANYWHERE. This screen is reachable mid-flow from the
        // task and transaction pickers ("+ New product"), so an unguarded fetch is paid at the
        // deepest point of someone else's save, every time, to type one product.
        Concurrent(
            If( IsEmpty(colMapProdType),
                ClearCollect( colMapProdType, mapping_producttype ) ),
            // THE TICKER VOCABULARY IS EMERGENT — every ticker any product already names, not a
            // governed list. Concat joins every stored value into one comma-string and Split breaks
            // it back, which is what makes a multi-ticker product contribute each separately.
            // NOT DELEGABLE, and it does not need to be: Concat reads up to the data row limit and
            // taskmaster_products is reference data. Past 2000 rows the suggestions go stale
            // silently and nothing else breaks.
            // A typo becomes a suggestion — the accepted cost, and why the chips are a convenience
            // and never a constraint.
            // This is the whole-list read the guard above exists for; btnPdSave keeps it current
            // for this session's own saves without refetching it.
            If( IsEmpty(colPdUndAll),
                ClearCollect( colPdUndAll,
                      Sort( Distinct( Filter( ForAll( Split( Concat( taskmaster_products,
                                                                     Coalesce(product_underlying, "") & "," ),
                                                             "," ) As t,
                                                      { Tk: Trim(Upper(t.Value)) } ),
                                              Len(Tk) > 0 ),
                                      Tk ),
                            Value ) ) ),
            // FROM Choices() ON THE COLUMN, never a literal list. product_assetclass ships with
            // PLACEHOLDER values in the golden source, so whatever is provisioned appears here with
            // no app change — and a label the Choice would refuse can never be written.
            // cmpSelection needs {Id, Label} and Choices() returns only Value, so the Id is
            // synthesised POSITIONALLY. The Ids mean nothing beyond "which row" — DefaultId looks
            // the value up by Label. No "(none)" row: the column is REQUIRED.
            // Cached, the synthesised Ids are MORE stable, not less: they stop moving mid-session.
            If( IsEmpty(colPdAssetOpts),
                ClearCollect( colPdAssetOpts,
                      With( { ch: Choices([@taskmaster_products].product_assetclass) },
                            ForAll( Sequence( CountRows(ch) ) As n,
                                    { Id:    n.Value,
                                      Label: Index(ch, n.Value).Value } ) ) ) ) );
        // A NEW PRODUCT OPENS ON THE FIRST CHOICE, so the ORDER of the column's values decides
        // its default — order them with the safest first. Seeding it rather than leaving it
        // blank is deliberate: cmpSelection's DefaultId falls back to row 1 either way, so a
        // blank global would leave the strip HIGHLIGHTING a value the save does not hold.
        Set( gPdAsset, If( gPdMode = "Edit",
                           Coalesce( gEditProduct.product_assetclass.Value,
                                     First(colPdAssetOpts).Label ),
                           First(colPdAssetOpts).Label ) );
        Set( gPdDup, false );
        // A toggle re-reads Default and cmpSelection re-reads DefaultId ONLY on Reset —
        // without these the previous product's values survive and the control DISAGREES WITH
        // THE SAVE rather than failing visibly.
        Reset( txtPdUid ); Reset( txtPdDesc ); Reset( pickPdType );
        Reset( tglPdEsg ); Reset( selPdAsset );
        Reset( txtPdUnd ); Reset( txtPdWrapper ); Reset( numPdMaturity ); Reset( txtPdFeatures )
    Children:
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Primary
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =gTheme.Space.HeaderH
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: =If(gPdMode = "Edit", "Edit product", "New product")
            Color: =gTheme.Color.OnPrimary
            Font: =gTheme.Font
            Size: =gTheme.Size.H2
            FontWeight: =FontWeight.Semibold
            VerticalAlign: =VerticalAlign.Middle
            X: =gTheme.Space.Gutter
            Y: =0
            Width: =Parent.Width - 120
            Height: =gTheme.Space.HeaderH
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =gTheme.Color.OnPrimary
            HoverColor: =gTheme.Color.OnPrimary
            HoverFill: =RGBA(255, 255, 255, 0.15)
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            Tooltip: ="Close without saving"
            X: =Parent.Width - 24 - gTheme.Space.Gutter
            Y: =(gTheme.Space.HeaderH - 24) / 2
            Width: =24
            Height: =24
            OnSelect: =Back()
      - bodyRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Start
            LayoutGap: =12
            PaddingTop: =gTheme.Space.Gutter
            PaddingBottom: =gTheme.Space.Gutter
            PaddingLeft: =gTheme.Space.Gutter
            PaddingRight: =gTheme.Space.Gutter
            LayoutOverflowY: =LayoutOverflow.Scroll
            Fill: =gTheme.Color.Surface
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 68
          Children:
            - lblPdUidCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Product ID  *   (ISIN, ticker or internal ID)"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinHeight: =18
                  Width: =Parent.Width - 48
                  Height: =18
            - txtPdUid:
                Control: ModernTextInput@1.1.1
                Properties:
                  Default: =If(gPdMode = "Edit", gEditProduct.product_uid, "")
                  Placeholder: ="e.g. XS1234567890"
                  TriggerOutput: =TriggerOutput.Delayed
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  FillPortions: =0
                  LayoutMinHeight: =36
                  Width: =Parent.Width - 48
                  Height: =36
                  OnChange: |
                    =Set( gPdUid, Trim(txtPdUid.Text) );
                     Set( gPdDup, false )
            - lblPdDup:
                Control: Label@2.5.1
                Properties:
                  Visible: =gPdDup = true
                  Text: ="A product with this ID already exists. Use it instead of creating a second one."
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.Danger
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinHeight: =18
                  Width: =Parent.Width - 48
                  Height: =18
            # WRAPPED IN A COL — a component instance cannot carry FillPortions or
            # LayoutMinHeight; the wrapper holds the auto-layout contract.
            - colPdType:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =0
                  FillPortions: =0
                  LayoutMinHeight: =64
                  Width: =Parent.Width - 48
                  Height: =64
                Children:
                  - pickPdType:
                      Control: CanvasComponent
                      ComponentName: cmpNestedSelect
                      Properties:
                        Terms: =colMapProdType
                        Caption: ="Product type  *"
                        DefaultPath: =gPdTypePath
                        Separator: =" | "
                        Width: =Parent.Width
                        Height: =64
                        OnChange: |
                          =Set( gPdTypeId,   pickPdType.SelectedId );
                           Set( gPdTypePath, pickPdType.SelectedPath )
            - lblPdAssetCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Asset class  *"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinHeight: =18
                  Width: =Parent.Width - 48
                  Height: =18
            # A cmpSelection INSTANCE takes no FillPortions/LayoutMinHeight — the contract
            # check rejects them there — so it carries Width/Height only.
            - selPdAsset:
                Control: CanvasComponent
                ComponentName: cmpSelection
                Properties:
                  Width: =Parent.Width - 48
                  Height: =40
                  Items: =colPdAssetOpts
                  DefaultId: =Coalesce( LookUp(colPdAssetOpts, Label = gPdAsset, Id), 1 )
                  OnChange: =Set( gPdAsset, selPdAsset.Selected.Label )
            # A Classic/Toggle, NOT a check box: the check-box token is not grounded for this
            # dialect and an unverified control fails the WHOLE screen paste.
            # No global behind it — the save reads tglPdEsg.Value directly, exactly as
            # txtPdUid/txtPdDesc do. A global would be a third copy of the same fact.
            - rowPdEsg:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =12
                  FillPortions: =0
                  LayoutMinHeight: =34
                  Width: =Parent.Width - 48
                  Height: =34
                Children:
                  - tglPdEsg:
                      Control: Classic/Toggle@2.1.0
                      Properties:
                        # Coalesce, not a bare read: a Yes/No column added to a list that already has
                        # rows comes back BLANK on those rows, not false.
                        Default: |
                          =If( gPdMode = "Edit",
                               Coalesce(gEditProduct.product_esg, false), false )
                        FalseText: =""
                        TrueText: =""
                        FillPortions: =0
                        LayoutMinWidth: =60
                        Width: =60
                        Height: =30
                  - lblPdEsgCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="ESG product"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Body
                        Color: =gTheme.Color.TextPrimary
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =1
                        LayoutMinWidth: =140
                        Height: =34
            # ---- #20 fields. All four OPTIONAL, so none appears in lblPdMissing. ----
            - lblPdUndCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Underlying   (ticker, or several separated by commas)"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinHeight: =18
                  Width: =Parent.Width - 48
                  Height: =18
            # Default reads gPdUnd, NOT the record, because a suggestion chip has to write into
            # this box and a text input has no .Text setter. OnChange keeps the global in step
            # while typing, so whichever way the text arrived, both agree.
            - txtPdUnd:
                Control: ModernTextInput@1.1.1
                Properties:
                  Default: =gPdUnd
                  Placeholder: ="e.g. AAPL, MSFT, SX5E"
                  TriggerOutput: =TriggerOutput.Delayed
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  FillPortions: =0
                  LayoutMinHeight: =36
                  Width: =Parent.Width - 48
                  Height: =36
                  OnChange: =Set( gPdUnd, txtPdUnd.Text )
            # THE CHIPS ARE A CONVENIENCE, NOT A CONSTRAINT — the box takes anything. A ticker
            # already in the box is filtered out, so clicking twice cannot double an entry.
            # BOTH SIDES ARE COMMA-WRAPPED AND DE-SPACED so the test is on a whole token. `in` is
            # a SUBSTRING test, so the bare form would hide AA whenever AAPL was in the box.
            - galPdUndSug:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                Properties:
                  Items: |
                    =FirstN( Filter( colPdUndAll,
                                     !( ("," & Value & ",")
                                        in ( ","
                                             & Substitute(Upper(Coalesce(gPdUnd, "")), " ", "")
                                             & "," ) ) ),
                             12 )
                  # Horizontal strip: WrapCount high enough that the 12 rows lay out as one line.
                  WrapCount: =12
                  TemplateSize: =28
                  TemplatePadding: =0
                  TemplateFill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  ShowScrollbar: =false
                  Visible: =CountRows(colPdUndAll) > 0
                  FillPortions: =0
                  LayoutMinHeight: =32
                  Width: =Parent.Width - 48
                  Height: =32
                Children:
                  - chipPdUnd:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: =ThisItem.Value
                        Fill: =gTheme.Color.Bg
                        Color: =gTheme.Color.Primary
                        HoverFill: =gTheme.Color.Accent
                        PressedFill: =gTheme.Color.Accent
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth - 6
                        Height: =26
                        # Strips ONE trailing comma before joining, so a box reading "AAPL," does not become
                        # "AAPL,, MSFT". Reset is what makes the box re-read gPdUnd.
                        OnSelect: |
                          =Set( gPdUnd,
                                With( { b: Trim(Coalesce(gPdUnd, "")) },
                                      If( Len(b) = 0,
                                          ThisItem.Value,
                                          If( Right(b, 1) = ",",
                                              Trim(Left(b, Len(b) - 1)),
                                              b ) & ", " & ThisItem.Value ) ) );
                           Reset( txtPdUnd )
            - lblPdWrapperCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Wrapper"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinHeight: =18
                  Width: =Parent.Width - 48
                  Height: =18
            - txtPdWrapper:
                Control: ModernTextInput@1.1.1
                Properties:
                  Default: |
                    =If( gPdMode = "Edit", Coalesce(gEditProduct.product_wrapper, ""), "" )
                  Placeholder: ="e.g. Note, Certificate, Fund, Swap"
                  TriggerOutput: =TriggerOutput.Delayed
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  FillPortions: =0
                  LayoutMinHeight: =36
                  Width: =Parent.Width - 48
                  Height: =36
            - lblPdMatCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Maturity   (years — 0.25 is three months)"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinHeight: =18
                  Width: =Parent.Width - 48
                  Height: =18
            # CLASSIC, not modern: there is no grounded modern number-input token and
            # `TextInputType.Number` is a guess that would fail the whole paste. HintText, not
            # Placeholder — the classic control names it differently.
            - numPdMaturity:
                Control: Classic/TextInput@2.3.2
                Properties:
                  # The NUMBER itself, not Text() of it. A blank column stays blank rather
                  # than becoming "0".
                  Default: |
                    =If( gPdMode = "Edit", gEditProduct.product_maturity, Blank() )
                  # Restricts typing to digits. Without it `Value(.Text)` on a non-numeric entry is
                  # blank, and the save writes blank with nothing on screen to point at.
                  Format: =TextFormat.Number
                  HintText: ="e.g. 5"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  FillPortions: =0
                  LayoutMinHeight: =36
                  Width: =240
                  Height: =36
            - lblPdFeatCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Features"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinHeight: =18
                  Width: =Parent.Width - 48
                  Height: =18
            - txtPdFeatures:
                Control: ModernTextInput@1.1.1
                Properties:
                  Default: |
                    =If( gPdMode = "Edit", Coalesce(gEditProduct.product_features, ""), "" )
                  Placeholder: ="Barriers, coupons, autocall triggers, capital protection…"
                  Type: =TextInputType.Multiline
                  TriggerOutput: =TriggerOutput.Delayed
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  FillPortions: =0
                  LayoutMinHeight: =84
                  Width: =Parent.Width - 48
                  Height: =84
            - lblPdDescCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Description  *"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinHeight: =18
                  Width: =Parent.Width - 48
                  Height: =18
            - txtPdDesc:
                Control: ModernTextInput@1.1.1
                Properties:
                  Default: =If(gPdMode = "Edit", gEditProduct.product_description, "")
                  Placeholder: ="What this product is"
                  Type: =TextInputType.Multiline
                  TriggerOutput: =TriggerOutput.Delayed
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  FillPortions: =0
                  LayoutMinHeight: =84
                  Width: =Parent.Width - 48
                  Height: =84
                  OnChange: =Set( gPdDesc, txtPdDesc.Text )
      - actionBarBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            BorderColor: =gTheme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =Parent.Height - 68
            Width: =Parent.Width
            Height: =68
      - lblPdMissing:
          Control: Label@2.5.1
          Properties:
            Visible: =Len(Self.Text) > 0
            Text: |
              =With(
                 { m: Concat( Filter( Table(
                        { L: "Product ID",   M: Len(Trim(txtPdUid.Text)) = 0 },
                        { L: "Product Type", M: Len(gPdTypePath) = 0 },
                        // Can only fire if the column has no Choice values provisioned at all —
                        // otherwise the strip always holds one. Cheap, and it turns a rejected
                        // Patch into a sentence.
                        { L: "Asset Class",  M: Len(gPdAsset) = 0 },
                        { L: "Description",  M: Len(Trim(txtPdDesc.Text)) = 0 } ),
                      M ), L, " | " ) },
                 If( Len(m) > 0, "Required Fields Remaining: " & m, "" ) )
            Font: =gTheme.Font
            Size: =gTheme.Size.Small
            Color: =gTheme.Color.Danger
            VerticalAlign: =VerticalAlign.Middle
            X: =gTheme.Space.Gutter
            Y: =Parent.Height - 68
            Width: =Parent.Width - gTheme.Space.Gutter - 320
            Height: =68
      - btnPdCancel:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Cancel"
            Fill: =gTheme.Color.Surface
            Color: =gTheme.Color.Primary
            BorderColor: =gTheme.Color.Primary
            BorderThickness: =1
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            X: =Parent.Width - gTheme.Space.Gutter - 140 - 8 - 140
            Y: =Parent.Height - 68 + 12
            Width: =140
            Height: =44
            OnSelect: =Back()
      - btnPdSave:
          Control: Classic/Button@2.2.0
          Properties:
            Text: |
              =If( gSaving, "Saving…",
                   If(gPdMode = "Edit", "Save product", "Create product") )
            Fill: =gTheme.Color.Primary
            Color: =gTheme.Color.OnPrimary
            BorderColor: =gTheme.Color.Primary
            BorderThickness: =0
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            X: =Parent.Width - gTheme.Space.Gutter - 140
            Y: =Parent.Height - 68 + 12
            Width: =140
            Height: =44
            # ALWAYS ENABLED — a disabled button cannot say why it is disabled.
            OnSelect: |
              =If( gSaving,
              // A SECOND TAP WHILE THE FIRST WRITE IS STILL IN FLIGHT. Do nothing — a Patch takes
              // seconds and the button stays live, so a double-tap ran the handler twice and built a
              // SECOND record. `Set` applies immediately within a behaviour chain.
              false,
              Set( gSaving, true );
              If( Len(lblPdMissing.Text) > 0,
              Notify( "Can't save yet. " & lblPdMissing.Text,
              NotificationType.Error ),
              // BLANK THE RECORD, NOT JUST THE MESSAGE. Left holding the last successful save,
              // this makes the IsBlank(.ID) guard below pass on a PREVIOUS record — so a write that
              // fails with an empty error message reports success and hands back the WRONG record.
              Set( gPdSaved, Blank() );
              Set( gPdErr, "" );
              // product_uid is a business key and SharePoint does not enforce uniqueness, so check
              // first. The query is `=` on an indexed Text column ONLY — an `ID <>` clause here made
              // the whole LookUp local, because `<>` DOES NOT DELEGATE on ID, and past the data row
              // limit a duplicate slipped through with no warning. Excluding the row being edited is
              // a comparison on the RESULT, not part of the query.
              Set( gPdClash,
              LookUp( taskmaster_products, product_uid = Trim(txtPdUid.Text) ) );
              If( !IsBlank(gPdClash.ID)
              && gPdClash.ID <> If(gPdMode = "Edit", gEditProduct.ID, 0),
              Set( gPdDup, true );
              Notify( "A product with ID " & Trim(txtPdUid.Text) & " already exists.",
              NotificationType.Error ),
              Set( gPdDup, false );
              // NORMALISED HERE, NOT IN THE BOX. Uppercasing as the user types would need a Reset
              // per keystroke and would fight the cursor. Per-token, so spacing is regular whatever
              // was typed. The trailing separator is cut afterwards rather than avoided — Concat's
              // separator argument is not grounded in this dialect.
              Set( gPdUndNorm,
              Trim( Concat( ForAll( Split( Coalesce(txtPdUnd.Text, ""), "," ) As t,
              { V: Trim(Upper(t.Value)) } ),
              If( Len(V) > 0, V & ", ", "" ) ) ) );
              Set( gPdUndNorm,
              If( Right(gPdUndNorm, 1) = ",",
              Left( gPdUndNorm, Len(gPdUndNorm) - 1 ),
              gPdUndNorm ) );
              IfError(
              Set( gPdSaved,
              Patch( taskmaster_products,
              If( gPdMode = "Edit", gEditProduct, Defaults(taskmaster_products) ),
              { product_uid:         Trim(txtPdUid.Text),
              product_type_id:     gPdTypeId,
              product_type_path:   gPdTypePath,
              product_description: txtPdDesc.Text,
              product_assetclass:  { Value: gPdAsset },
              product_esg:         tglPdEsg.Value,
              product_underlying:  gPdUndNorm,
              product_wrapper:     Trim(txtPdWrapper.Text),
              // BLANK, NOT ZERO, WHEN THE BOX IS EMPTY. Writing it explicitly says an unset
              // maturity is unknown rather than a zero-year tenor — the two look identical in a list.
              product_maturity:    If( Len(Trim(numPdMaturity.Text)) = 0, Blank(),
              Value(numPdMaturity.Text) ),
              product_features:    txtPdFeatures.Text } ) ),
              Set( gPdErr, FirstError.Message ) );
              // Trust the RECORD, never the message.
              If( IsBlank(gPdSaved.ID) && Len(gPdErr) = 0,
              Set( gPdErr, "SharePoint returned no record and no error message, so nothing was saved." ) );
              If( Len(gPdErr) > 0,
              Notify( "Couldn't save the product: " & gPdErr, NotificationType.Error ) );
              If( Len(gPdErr) = 0 && !IsBlank(gPdSaved.ID),
              // KEEP THE TICKER CACHE CURRENT WITHOUT REFETCHING IT. colPdUndAll is collected
              // once per session, so a ticker saved here would otherwise not reach the chips
              // until the next app start. gPdUndNorm is the normalised string just written.
              //
              // STAGED THROUGH A SCRATCH COLLECTION because the merge both reads colPdUndAll and
              // replaces it, and a ClearCollect over the collection it is filling is not a shape
              // to trust. Distinct restores the single Value column colPdUndAll is built on and
              // drops the duplicates; the Sort is not cosmetic — the chip strip is FirstN(..., 12)
              // over this order, so an appended tail would never be seen.
              ClearCollect( colPdUndMerge, colPdUndAll );
              Collect( colPdUndMerge,
              ForAll( Split( gPdUndNorm, "," ) As t, { Value: Trim(Upper(t.Value)) } ) );
              ClearCollect( colPdUndAll,
              Sort( Distinct( Filter(colPdUndMerge, Len(Value) > 0), Value ), Value ) );
              // TWO ONE-ARMED Ifs, not one two-armed one: the task branch Collects and the
              // transaction branch Sets, and an If's arms must agree on type. A task takes MANY
              // products, so a newly created one is appended rather than replacing a global.
              If( gPdReturn = "TaskProduct",
              Collect( colTkProducts, { Id: gPdSaved.ID, Uid: gPdSaved.product_uid } ) );
              If( gPdReturn = "TxProduct",
              Set( gTxProduct, { Id: gPdSaved.ID, Value: gPdSaved.product_uid } ) );
              // NxProduct is the STAGED transaction inside scrProjectEdit, which takes ONE
              // product — so this Sets rather than Collects.
              If( gPdReturn = "NxProduct",
              Set( gNxProduct, { Id: gPdSaved.ID, Value: gPdSaved.product_uid } ) );
              Set( gPdReturn, "" );
              Notify( If(gPdMode = "Edit", "Product saved", "Product created"), NotificationType.Success );
              Back() ) ) );
              Set( gSaving, false ) )
