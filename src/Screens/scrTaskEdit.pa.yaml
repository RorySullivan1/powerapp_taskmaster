                                          Tooltip: ="Clear"
                                          FillPortions: =0
                                          LayoutMinWidth: =16
                                          Width: =16
                                          Height: =16
                                          OnSelect: |
                                            =Set( gTkLead, { DisplayName: "", Mail: "" } );
                                             Reset( cmpTkPeople );
                                             Set( gTkPicker, "" )
                        - colTkStart:
                            Control: GroupContainer@1.5.0
