# scrTaskEdit — REWORKED 2026-08-07.  Tabs removed, layout moved to containers.
#
# WHAT CHANGED, and why each one is not just cosmetic:
#
#  - NO TAB LIST.  Output was a second tab; it is now an optional SECTION behind a
#    toggle.  On an existing task the toggle opens already on when the task has an
#    output format, so the record itself says whether the section is relevant.
#    Switching it OFF on an edit CLEARS every output field on save — otherwise the
#    section would hide values that are still stored.
#
#  - PROJECT IS GONE FROM THE FORM.  A task is always created against a project, so
#    `gTkProject` is derived in OnVisible (from the task on Edit, from gSelProject on
#    New) and never asked for.  It is still WRITTEN, and it still drives the C3
#    rollup at the end of Save.
#
#  - COMPLETION DATE IS DERIVED, NOT ENTERED.  Picking Complete stamps it; anything
#    else clears it.  (The "Archived keeps whatever was there" arm went with the stage
#    itself on 2026-08-12 — task_stage no longer has an Archived value.)  It is shown
#    read-only so the value is visible without being editable.
#
#  - STAGE / HEALTH / PRIORITY are combo boxes whose text colour follows the value.
#    `Color` is the current modern combo box's text colour (it was `FontColor` before
#    the revision).
#
#  - DUE DATE flags itself.  A date picker has no grounded colour property, so the
#    CAPTION carries the warning — a Label's Color is beyond doubt.
#
# LAYOUT IS CONTAINERS.  Every auto-layout child sets FillPortions EXPLICITLY; it
# defaults to 1 at every nesting level and one unset child silently steals space from
# its siblings.  The action bar and the picker panel stay absolute: the bar is a fixed
# footer on the screen, and the panel has to float ABOVE the form rather than sit in
# its flow.
Screens:
  scrTaskEdit:
    Properties:
      Fill: =gTheme.Color.Bg
      OnVisible: |
        =Set( gSaving, false );   // see btnTkSave
        // WHICH task this visit is for. The resume guard below matches on it rather than
        // on a bare boolean, because a boolean latch leaks: the picker sets it before
        // navigating away to create a client or product, and NOTHING clears it unless the
        // user comes back here. Leave that flow by any other route and the next task opened
        // skips every seed and every Reset below — which is the whole screen, since they
        // all live in this guard's else arm — and shows the PREVIOUS task's client and
        // output data. Matching on identity makes a stale flag harmless: a different task
        // cannot match, so it seeds normally.
        Set( gTkKey, If( gEditMode = "Edit", "E" & gEditTask.ID, "N" & gSelProject.ID ) );
        If( gTkResumeKey = gTkKey && Len(gTkKey) > 1,
         Set( gTkResumeKey, "" ),
         Set( gTkProject,
              If( gEditMode = "Edit",
                  { Id: gEditTask.task_project_id.Id,
                    // NOT redundant. The lookup column's live display field is the target's ID,
                    // so `.Value` is a NUMBER — see schema.yaml on this column. Resolving the
                    // name app-side is the fix from 2026-08-09; do not "optimise" it away.
                    Value: LookUp(taskmaster_projects, ID = gEditTask.task_project_id.Id, project_name) },
                  gSelProject.ID > 0,
                  { Id: gSelProject.ID, Value: gSelProject.project_name },
                  { Id: 0, Value: "" } ) );
        Set( gTkLead,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditTask.task_lead.DisplayName, ""),
                    Mail:        Coalesce(gEditTask.task_lead.Email, "") },
                  { DisplayName: Coalesce(User().FullName, ""), Mail: Coalesce(User().Email, "") } ) );
        Set( gTkSupporter,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditTask.task_supporter.DisplayName, ""),
                    Mail:        Coalesce(gEditTask.task_supporter.Email, "") },
                  { DisplayName: "", Mail: "" } ) );
        Set( gTkClient,
              If( gEditMode = "Edit" && gEditTask.task_client_name.Id > 0,
                  { Id: gEditTask.task_client_name.Id, Value: gEditTask.task_client_name.Value },
                  { Id: 0, Value: "" } ) );
        // PRODUCTS ARE MULTI NOW. colTkProducts is the staging set the form edits;
        // taskmaster_taskproduct is only touched on save. Seeded from the junction on
        // Edit and left empty on New.
        //
        // INSIDE THE RESUME GUARD, like every other seed on this screen — coming
        // back from "create a new product" must not wipe what the user already staged.
        //
        // Shaped to {Id, Uid} on read: taskproduct_product_uid is the denormalised
        // copy, and reading it here avoids a LookUp per link just to show a name.
        Clear( colTkProducts );
        If( gEditMode = "Edit",
            Collect( colTkProducts,
                     ForAll( Filter( taskmaster_taskproduct,
                                     taskproduct_task_id.Id = gEditTask.ID ) As lk,
                             { Id:  lk.taskproduct_product_id.Id,
                               Uid: lk.taskproduct_product_uid } ) ) );
        // OPTION TABLES FOR THE THREE STRIPS. cmpSelection needs {Id, Label} and
        // Choices() returns only Value, so the Id is synthesised POSITIONALLY:
        // Sequence() numbers the rows and Index() reads the nth choice back out.
        // The Ids mean nothing beyond "which row" — never hard-code one, look it up
        // by Label, which is what each DefaultId does.
        //
        // All three columns are REQUIRED with a default (C9), so none of them gets a
        // "(none)" row: there is no legal blank to write back.
        ClearCollect( colTkStageOpts,
                      With( { ch: Choices([@taskmaster_tasks].task_stage) },
                            ForAll( Sequence( CountRows(ch) ) As n,
                                    { Id: n.Value, Label: Index(ch, n.Value).Value } ) ) );
        ClearCollect( colTkStatusOpts,
                      With( { ch: Choices([@taskmaster_tasks].task_status) },
                            ForAll( Sequence( CountRows(ch) ) As n,
                                    { Id: n.Value, Label: Index(ch, n.Value).Value } ) ) );
        ClearCollect( colTkPriorityOpts,
                      With( { ch: Choices([@taskmaster_tasks].task_priority) },
                            ForAll( Sequence( CountRows(ch) ) As n,
                                    { Id: n.Value, Label: Index(ch, n.Value).Value } ) ) );
        Set( gTkStage,    If( gEditMode = "Edit", Coalesce(gEditTask.task_stage.Value, "Not Started"), "Not Started" ) );
        Set( gTkStatus,   If( gEditMode = "Edit", Coalesce(gEditTask.task_status.Value, "Green"), "Green" ) );
        Set( gTkPriority, If( gEditMode = "Edit", Coalesce(gEditTask.task_priority.Value, "Moderate"), "Moderate" ) );
        Set( gTkLanguage, If( gEditMode = "Edit", Coalesce(gEditTask.task_output_language.Value, "(none)"), "(none)" ) );
        Set( gTkFormat,   If( gEditMode = "Edit", Coalesce(gEditTask.task_output_format.Value, "(none)"), "(none)" ) );
        Set( gTkBranding, If( gEditMode = "Edit", Coalesce(gEditTask.task_output_branding.Value, "(none)"), "(none)" ) );
        Set( gTkClientStage, If( gEditMode = "Edit", Coalesce(gEditTask.task_client_stage.Value, "(none)"), "(none)" ) );
        Set( gTkPicker, "" );
        Reset( txtTkName ); Reset( txtTkDesc );
        Reset( cmpTkPick );
        Set( gTkQuery, "" );
        Reset( txtTkApprovalId );
        // THE OPTION LISTS LOAD HERE, AFTER the modal and query state is cleared and
        // before the combo Resets that read them. Order is defensive: a Choices() call
        // that errors stops the whole OnVisible, and anything left above it never runs —
        // so nothing that decides whether the screen is USABLE may sit below this block.
        // EVERY OPTION LIST COMES FROM ITS COLUMN, not a literal copy of it. A literal
        // drifts the moment someone edits the Choice in SharePoint, and the failure is
        // silent both ways: a removed value stays offered and will not save, a new one
        // never appears. "(none)" is Collected FIRST so it sorts to the top; it is an
        // app concept, not a column value, and the save maps it back to Blank().
        // THE Opts SUFFIX IS LOAD-BEARING. This screen names its column containers col*
        // too — colTkFormat, colTkLang, colTkBrand are CONTROLS — so a collection named
        // after the container it sits in resolves to the control instead, and every
        // reader of it fails as an incompatible type one hop away from the cause.
        ClearCollect( colTkFmtOpts, { Value: "(none)" } );
        Collect( colTkFmtOpts,
                 ForAll( Choices([@taskmaster_tasks].task_output_format) As c,
                         { Value: c.Value } ) );
        ClearCollect( colTkLangOpts, { Value: "(none)" } );
        Collect( colTkLangOpts,
                 ForAll( Choices([@taskmaster_tasks].task_output_language) As c,
                         { Value: c.Value } ) );
        ClearCollect( colTkBrandOpts, { Value: "(none)" } );
        Collect( colTkBrandOpts,
                 ForAll( Choices([@taskmaster_tasks].task_output_branding) As c,
                         { Value: c.Value } ) );
        ClearCollect( colTkCliStageOpts, { Value: "(none)" } );
        Collect( colTkCliStageOpts,
                 ForAll( Choices([@taskmaster_tasks].task_client_stage) As c,
                         { Value: c.Value } ) );
        // cmpSelection re-reads its DefaultId ONLY on Reset — without these the
        // previous task's stage/health/priority survive into the next one, and the
        // strip then DISAGREES WITH THE SAVE rather than failing visibly.
        Reset( selTkStage ); Reset( selTkStatus ); Reset( selTkPriority );
        // A combo box re-reads DefaultSelectedItems ONLY on Reset.
        Reset( cboTkLanguage ); Reset( cboTkFormat ); Reset( cboTkBranding ); Reset( cboTkClientStage );
        Reset( tglTkOutput ); Reset( tglTkClient );
        // A date picker re-reads DefaultDate ONLY on Reset. Without these the seeds
        // never take on a second visit and the Patch writes Blank() over the stored
        // dates. The completion date is derived on save and has no picker at all.
        Reset( dtpTkStart ); Reset( dtpTkTarget )
        )
    Children:
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Primary
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =gTheme.Space.HeaderH
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: |
              =If(gEditMode = "Edit", "Edit task", "New task") &
               If( gTkProject.Id > 0, "   ·   " & gTkProject.Value, "" )
            Color: =gTheme.Color.OnPrimary
            Font: =gTheme.Font
            Size: =gTheme.Size.H2
            FontWeight: =FontWeight.Semibold
            VerticalAlign: =VerticalAlign.Middle
            X: =gTheme.Space.Gutter
            Y: =0
            Width: =Parent.Width - 120
            Height: =gTheme.Space.HeaderH
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =gTheme.Color.OnPrimary
            HoverColor: =gTheme.Color.OnPrimary
            HoverFill: =RGBA(255, 255, 255, 0.15)
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            Tooltip: ="Close without saving"
            X: =Parent.Width - 24 - gTheme.Space.Gutter
            Y: =(gTheme.Space.HeaderH - 24) / 2
            Width: =24
            Height: =24
            OnSelect: =Back()
      - bodyRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Start
            LayoutGap: =gTheme.Space.Gap
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =gTheme.Space.Gutter
            PaddingBottom: =gTheme.Space.Gutter
            PaddingLeft: =gTheme.Space.Gutter
            PaddingRight: =gTheme.Space.Gutter
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 88
          Children:
            - secTkDetails:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =10
                  PaddingTop: =14
                  PaddingBottom: =14
                  PaddingLeft: =20
                  PaddingRight: =20
                  Fill: =gTheme.Color.Surface
                  BorderColor: =gTheme.Color.Border
                  BorderThickness: =1
                  FillPortions: =0
                  LayoutMinHeight: =268
                  Width: =Parent.Width - 48
                  Height: =268
                Children:
                  - lblsecTkDetailsHead:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Task"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.H3
                        FontWeight: =FontWeight.Semibold
                        Color: =gTheme.Color.Primary
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =0
                        LayoutMinHeight: =26
                        Width: =Parent.Width - 40
                        Height: =26
                  - rowTkName:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =20
                        FillPortions: =0
                        LayoutMinHeight: =62
                        Width: =Parent.Width - 40
                        Height: =62
                      Children:
                        - colTkName:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              FillPortions: =1
                              LayoutMinWidth: =320
                              Height: =62
                            Children:
                              - lblTkNameCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="Task name  *"
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - txtTkName:
                                  Control: ModernTextInput@1.1.1
                                  Properties:
                                    Default: =If(gEditMode = "Edit", gEditTask.task_name, "")
                                    Placeholder: ="What has to be done?"
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    FillPortions: =0
                                    LayoutMinHeight: =36
                                    Width: =Parent.Width
                                    Height: =36
                  - rowTkDesc:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =20
                        FillPortions: =0
                        LayoutMinHeight: =148
                        Width: =Parent.Width - 40
                        Height: =148
                      Children:
                        - colTkDesc:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              FillPortions: =1
                              LayoutMinWidth: =320
                              Height: =148
                            Children:
                              - lblTkDescCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="Description"
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - txtTkDesc:
                                  Control: ModernTextInput@1.1.1
                                  Properties:
                                    Default: =If(gEditMode = "Edit", gEditTask.task_description, "")
                                    Placeholder: ="Instructions, context, acceptance criteria…"
                                    Type: =TextInputType.Multiline
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    FillPortions: =0
                                    LayoutMinHeight: =120
                                    Width: =Parent.Width
                                    Height: =120
            - secTkState:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =10
                  PaddingTop: =14
                  PaddingBottom: =14
                  PaddingLeft: =20
                  PaddingRight: =20
                  Fill: =gTheme.Color.Surface
                  BorderColor: =gTheme.Color.Border
                  BorderThickness: =1
                  FillPortions: =0
                  LayoutMinHeight: =198
                  Width: =Parent.Width - 48
                  Height: =198
                Children:
                  - lblsecTkStateHead:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Status"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.H3
                        FontWeight: =FontWeight.Semibold
                        Color: =gTheme.Color.Primary
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =0
                        LayoutMinHeight: =26
                        Width: =Parent.Width - 40
                        Height: =26
                  # STAGE ON ITS OWN ROW, health and priority sharing the next.
                  # A five-option strip in a third-width cell gives each label about
                  # 60px, and "Not Started" does not fit in 60px at any legible size.
                  # A vertical stack rather than a two-row grid because a GridLayout
                  # span did not render full width when scrIssueEdit tried it.
                  - stackTkState:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =10
                        FillPortions: =0
                        LayoutMinHeight: =134
                        Width: =Parent.Width - 40
                        Height: =134
                      Children:
                        - colTkStage:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              FillPortions: =0
                              LayoutMinHeight: =62
                              Width: =Parent.Width
                              Height: =62
                            Children:
                              - lblTkStageCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="Stage  *"
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - selTkStage:
                                  Control: CanvasComponent
                                  ComponentName: cmpSelection
                                  Properties:
                                    Width: =Parent.Width
                                    Height: =40
                                    Items: =colTkStageOpts
                                    DefaultId: =Coalesce( LookUp(colTkStageOpts, Label = gTkStage, Id), 1 )
                                    OnChange: =Set(gTkStage, selTkStage.Selected.Label)
                        - rowTkStatePair:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =16
                              FillPortions: =0
                              LayoutMinHeight: =62
                              Width: =Parent.Width
                              Height: =62
                            Children:
                              - colTkStatus:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutGap: =4
                                    FillPortions: =1
                                    LayoutMinWidth: =200
                                    Height: =62
                                  Children:
                                    - lblTkStatusCap:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: ="Health  *"
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Small
                                          Color: =gTheme.Color.TextMuted
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =0
                                          LayoutMinHeight: =18
                                          Width: =Parent.Width
                                          Height: =18
                                    - selTkStatus:
                                        Control: CanvasComponent
                                        ComponentName: cmpSelection
                                        Properties:
                                          Width: =Parent.Width
                                          Height: =40
                                          Items: =colTkStatusOpts
                                          DefaultId: =Coalesce( LookUp(colTkStatusOpts, Label = gTkStatus, Id), 1 )
                                          OnChange: =Set(gTkStatus, selTkStatus.Selected.Label)
                              - colTkPriority:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutGap: =4
                                    FillPortions: =1
                                    LayoutMinWidth: =200
                                    Height: =62
                                  Children:
                                    - lblTkPriorityCap:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: ="Priority  *"
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Small
                                          Color: =gTheme.Color.TextMuted
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =0
                                          LayoutMinHeight: =18
                                          Width: =Parent.Width
                                          Height: =18
                                    - selTkPriority:
                                        Control: CanvasComponent
                                        ComponentName: cmpSelection
                                        Properties:
                                          Width: =Parent.Width
                                          Height: =40
                                          Items: =colTkPriorityOpts
                                          DefaultId: =Coalesce( LookUp(colTkPriorityOpts, Label = gTkPriority, Id), 1 )
                                          OnChange: =Set(gTkPriority, selTkPriority.Selected.Label)
            - secTkPeopleDates:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =10
                  PaddingTop: =14
                  PaddingBottom: =14
                  PaddingLeft: =20
                  PaddingRight: =20
                  Fill: =gTheme.Color.Surface
                  BorderColor: =gTheme.Color.Border
                  BorderThickness: =1
                  FillPortions: =0
                  LayoutMinHeight: =224
                  Width: =Parent.Width - 48
                  Height: =224
                Children:
                  - lblsecTkPeopleDatesHead:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="People and dates"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.H3
                        FontWeight: =FontWeight.Semibold
                        Color: =gTheme.Color.Primary
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =0
                        LayoutMinHeight: =26
                        Width: =Parent.Width - 40
                        Height: =26
                  - gridTkPeopleDates:
                      Control: GroupContainer@1.5.0
                      Variant: GridLayout
                      Properties:
                        LayoutGridColumns: =2
                        LayoutGridRows: =2
                        FillPortions: =0
                        LayoutMinHeight: =160
                        Width: =Parent.Width - 40
                        Height: =160
                      Children:
                        - colTkLead:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              LayoutGridColumnStart: =1
                              LayoutGridColumnEnd: =1
                              LayoutGridRowStart: =1
                              LayoutGridRowEnd: =1
                              Height: =62
                            Children:
                              - fldLead:
                                  Control: CanvasComponent
                                  ComponentName: cmpLookupField
                                  Properties:
                                    Caption: ="Lead  *"
                                    PickLabel: ="＋  Choose a lead"
                                    HasValue: =Len(gTkLead.Mail) > 0
                                    Display: =gTkLead.DisplayName
                                    Width: =Parent.Width
                                    Height: =62
                                    OnPick: |
                                      =Set( gTkPicker, "Lead" );
                                       Reset( cmpTkPick );
                                       Set( gTkQuery, "" )
