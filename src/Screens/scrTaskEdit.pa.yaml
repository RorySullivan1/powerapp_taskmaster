                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =16
                              FillPortions: =0
                              LayoutMinHeight: =62
                              Width: =Parent.Width
                              Height: =62
                            Children:
                              - colTkPriority:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutGap: =4
                                    FillPortions: =1
                                    LayoutMinWidth: =200
                                    Height: =62
                                  Children:
                                    - lblTkPriorityCap:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: ="Priority  *"
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Small
                                          Color: =gTheme.Color.TextMuted
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =0
                                          LayoutMinHeight: =18
                                          Width: =Parent.Width
                                          Height: =18
                                    - selTkPriority:
                                        Control: CanvasComponent
                                        ComponentName: cmpSelection
                                        Properties:
                                          Width: =Parent.Width
                                          Height: =40
                                          Items: =colTkPriorityOpts
                                          DefaultId: =Coalesce( LookUp(colTkPriorityOpts, Label = gTkPriority, Id), 1 )
                                          OnChange: =Set(gTkPriority, selTkPriority.Selected.Label)
            - secTkPeopleDates:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
