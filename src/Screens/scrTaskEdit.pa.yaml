                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              FillPortions: =1
                              LayoutMinWidth: =320
                              Height: =62
                            Children:
                              - lblTkNameCap:
                                  Control: Label@2.5.1
