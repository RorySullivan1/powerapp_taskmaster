            Y: =476
            Width: =208
            Height: =36
            VerticalAlign: =VerticalAlign.Middle
      - icoTkSuppClear:
          Control: Classic/Icon@2.5.0
          Properties:
            Visible: =gTaskEditTab = 1 && Len(gTkSupporter.Mail) > 0
            Icon: =Icon.Cancel
            Color: =Theme.Color.TextMuted
            Height: =16
            Width: =16
            X: =524
            Y: =486
            OnSelect: |
              =Set(gTkSupporter, { DisplayName: "", Mail: "" })
      # ---- Right side of tab 1: lifecycle, dates, category ------------------
      - lblTkStageCap:
          Control: Label@2.5.1
          Properties:
            Visible: =gTaskEditTab = 1
            Text: ="Stage  *  —  changing this recalculates the project's completion"
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Color: =Theme.Color.TextMuted
            X: =580
            Y: =140
            Width: =760
            Height: =18
      - selTkStage:
          Control: CanvasComponent
          ComponentName: cmpSelection
          Properties:
            FontSize: =10
            Visible: =gTaskEditTab = 1
            X: =580
            Y: =160
            Width: =760
            Height: =40
            Items: |
              =Table( { Id: 1, Label: "Not Started" }, { Id: 2, Label: "Planning" },
                      { Id: 3, Label: "Drafting" },    { Id: 4, Label: "Under Review" },
                      { Id: 5, Label: "Finalizing" },  { Id: 6, Label: "Complete" },
                      { Id: 7, Label: "Archived" } )
            DefaultId: |
              =Switch( If(gEditMode = "Edit", Coalesce(gEditTask.task_stage.Value, "Not Started"), "Not Started"),
                       "Not Started", 1, "Planning", 2, "Drafting", 3,
                       "Under Review", 4, "Finalizing", 5, "Complete", 6, 7 )
            OnChange: |
              =Set(gTkStage, selTkStage.Selected.Label)
      - lblTkStatusCap:
          Control: Label@2.5.1
          Properties:
            Visible: =gTaskEditTab = 1
            Text: ="Health  *"
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Color: =Theme.Color.TextMuted
            X: =580
            Y: =210
            Width: =300
            Height: =18
      - selTkStatus:
          Control: CanvasComponent
          ComponentName: cmpSelection
          Properties:
            FontSize: =12
            Visible: =gTaskEditTab = 1
            X: =580
            Y: =230
            Width: =300
            Height: =40
            Items: |
              =Table( { Id: 1, Label: "Green" }, { Id: 2, Label: "Amber" }, { Id: 3, Label: "Red" } )
            DefaultId: |
              =Switch( If(gEditMode = "Edit", Coalesce(gEditTask.task_status.Value, "Green"), "Green"),
                       "Green", 1, "Amber", 2, 3 )
            OnChange: |
              =Set(gTkStatus, selTkStatus.Selected.Label)
      - lblTkPriorityCap:
