      # ==================================================================
      # PICKER PANEL — ONE floating panel, absolute, ABOVE the form.
      #
      # Absolute on purpose: results must float OVER the fields rather than push
      # them down, and a container child cannot overlap its siblings. All five
      # galleries share one rectangle because only one picker is ever open, so
      # they cannot collide with each other.
      #
      # Each is gated on its OWN search text as well as gTkPicker: querying
      # SearchUserV2 with an empty term returns the whole directory, which is the
      # always-open-gallery defect this repo already paid for once.
      # ==================================================================
      - pnlTkPickerBg:
          Control: Rectangle@2.3.0
          Properties:
            Visible: =Len(gTkPicker) > 0
            Fill: =Theme.Color.Surface
            BorderColor: =Theme.Color.Primary
            BorderThickness: =1
            X: =(Parent.Width - 620) / 2
            Y: =Theme.Space.HeaderH + 72
            Width: =620
            Height: =332
      - lblTkPickerHead:
          Control: Label@2.5.1
          Properties:
            Visible: =Len(gTkPicker) > 0
            Text: ="Pick a " & Lower(gTkPicker)
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Color: =Theme.Color.TextMuted
            VerticalAlign: =VerticalAlign.Middle
            X: =(Parent.Width - 620) / 2 + 16
            Y: =Theme.Space.HeaderH + 72
            Width: =540
            Height: =32
      - icoTkPickerClose:
          Control: Classic/Icon@2.5.0
          Properties:
            Visible: =Len(gTkPicker) > 0
            Icon: =Icon.Cancel
            Color: =Theme.Color.TextMuted
            Tooltip: ="Close"
            X: =(Parent.Width - 620) / 2 + 620 - 32
            Y: =Theme.Space.HeaderH + 80
            Width: =16
            Height: =16
            OnSelect: =Set( gTkPicker, "" )
      - galTkLead:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
          Properties:
            Visible: |
              =gTkPicker = "Lead" && Len(txtTkLeadSearch.Text) >= 2
            Items: |
              =Office365Users.SearchUserV2({ searchTerm: txtTkLeadSearch.Text, top: 15 }).value
            WrapCount: =1
            TemplateSize: =40
            TemplatePadding: =0
            TemplateFill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            ShowScrollbar: =true
            X: =(Parent.Width - 620) / 2 + 8
            Y: =Theme.Space.HeaderH + 108
            Width: =604
            Height: =288
          Children:
            - rowTkLeadRow:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.DisplayName & "   ·   " & ThisItem.Mail
                  Font: =Theme.Font
                  Size: =Theme.Size.Body
                  Color: =Theme.Color.TextPrimary
                  VerticalAlign: =VerticalAlign.Middle
                  X: =12
                  Y: =0
                  Width: =Parent.TemplateWidth - 24
                  Height: =39
            - galTkLeadHit:
                Control: Classic/Button@2.2.0
                Properties:
                  # A gallery's own OnSelect does not reliably fire when the click lands
                  # on a child control, so the row's action lives on a transparent
                  # full-template button declared LAST. Confirmed in Studio 2026-08-03.
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  OnSelect: |
                    =Set( gTkLead, { DisplayName: ThisItem.DisplayName, Mail: ThisItem.Mail } );
                    Set( gTkPicker, "" )
