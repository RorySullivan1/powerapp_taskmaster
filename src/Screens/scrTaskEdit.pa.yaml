            LayoutAlignItems: =LayoutAlignItems.Start
            LayoutGap: =Theme.Space.Gap
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =Theme.Space.Gutter
            PaddingBottom: =Theme.Space.Gutter
            PaddingLeft: =Theme.Space.Gutter
            PaddingRight: =Theme.Space.Gutter
            X: =0
            Y: =Theme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - Theme.Space.HeaderH - 88
          Children:
            - secTkDetails:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =10
                  PaddingTop: =14
                  PaddingBottom: =14
                  PaddingLeft: =20
                  PaddingRight: =20
                  Fill: =Theme.Color.Surface
                  BorderColor: =Theme.Color.Border
                  BorderThickness: =1
                  FillPortions: =0
                  LayoutMinHeight: =268
                  Width: =Parent.Width - 48
                  Height: =268
                Children:
                  - lblsecTkDetailsHead:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Task"
                        Font: =Theme.Font
                        Size: =Theme.Size.H3
                        FontWeight: =FontWeight.Semibold
                        Color: =Theme.Color.Primary
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =0
                        LayoutMinHeight: =26
                        Width: =Parent.Width - 40
                        Height: =26
                  - rowTkName:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =20
                        FillPortions: =0
                        LayoutMinHeight: =62
                        Width: =Parent.Width - 40
                        Height: =62
                      Children:
                        - colTkName:
                            Control: GroupContainer@1.5.0
