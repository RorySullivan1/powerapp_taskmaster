                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              LayoutGridColumnStart: =1
                              LayoutGridColumnEnd: =1
                              LayoutGridRowStart: =1
                              LayoutGridRowEnd: =1
                              Height: =62
                            Children:
                              - lblTkLeadCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="Lead  *"
                                    Font: =Theme.Font
                                    Size: =Theme.Size.Small
                                    Color: =Theme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              # THE EMPTY PERSON BOX. Was a search input that filtered a
                              # floating gallery as you typed; it is now a button that
                              # opens cmpTkPeople, where the search lives. Reset() on the
                              # instance is what clears the previous field's query and
                              # highlight — without it the dialog opens showing whatever
                              # was picked last, and the check would commit it.
                              - btnTkLeadPick:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Visible: =Len(gTkLead.Mail) = 0
                                    Text: ="＋  Choose a lead"
                                    Align: =Align.Left
                                    Fill: =Theme.Color.Bg
                                    Color: =Theme.Color.TextMuted
                                    BorderColor: =Theme.Color.Border
                                    BorderThickness: =1
                                    Font: =Theme.Font
                                    Size: =Theme.Size.Body
                                    FillPortions: =0
                                    LayoutMinHeight: =36
                                    Width: =Parent.Width
                                    Height: =36
                                    OnSelect: |
                                      =Set( gTkPicker, "Lead" );
                                       Reset( cmpTkPeople );
                                       Set( gTkPeopleQuery, "" )
                              # The chip REPLACES the search box once somebody is chosen —
                              # same shape as scrProjectEdit. One row either way.
                              - chipTkLead:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    Visible: =Len(gTkLead.Mail) > 0
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =6
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    Fill: =Theme.Color.Bg
                                    BorderColor: =Theme.Color.Border
                                    BorderThickness: =1
                                    FillPortions: =0
                                    LayoutMinHeight: =36
                                    Width: =Parent.Width
                                    Height: =36
                                  Children:
                                    - lblchipTkLeadName:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =gTkLead.DisplayName
                                          Font: =Theme.Font
                                          Size: =Theme.Size.Body
                                          Color: =Theme.Color.TextPrimary
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =1
                                          LayoutMinWidth: =80
                                          Height: =24
