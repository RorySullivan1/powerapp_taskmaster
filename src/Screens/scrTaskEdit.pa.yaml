            WrapCount: =1
            TemplateSize: =40
            TemplatePadding: =0
            TemplateFill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            ShowScrollbar: =true
            X: =(Parent.Width - 620) / 2 + 8
            Y: =Theme.Space.HeaderH + 108
            Width: =604
            Height: =288
          Children:
            - rowTkClientRow:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.client_name
                  Font: =Theme.Font
                  Size: =Theme.Size.Body
                  Color: =Theme.Color.TextPrimary
                  VerticalAlign: =VerticalAlign.Middle
                  X: =12
                  Y: =0
                  Width: =Parent.TemplateWidth - 24
                  Height: =39
            - galTkClientHit:
                Control: Classic/Button@2.2.0
                Properties:
                  # A gallery's own OnSelect does not reliably fire when the click lands
                  # on a child control, so the row's action lives on a transparent
                  # full-template button declared LAST. Confirmed in Studio 2026-08-03.
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  OnSelect: |
                    =Set( gTkClient, { Id: ThisItem.ID, Value: ThisItem.client_name } );
                    Set( gTkPicker, "" )
      - galTkProduct:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
          Properties:
            Visible: |
              =gTkPicker = "Product" && Len(txtTkProductSearch.Text) >= 1
            Items: |
              =Sort( Filter( taskmaster_products, StartsWith(product_uid, txtTkProductSearch.Text) ), product_uid )
            WrapCount: =1
            TemplateSize: =40
            TemplatePadding: =0
            TemplateFill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            ShowScrollbar: =true
            X: =(Parent.Width - 620) / 2 + 8
            Y: =Theme.Space.HeaderH + 108
            Width: =604
            Height: =288
          Children:
            - rowTkProductRow:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.product_uid
                  Font: =Theme.Font
                  Size: =Theme.Size.Body
                  Color: =Theme.Color.TextPrimary
                  VerticalAlign: =VerticalAlign.Middle
                  X: =12
                  Y: =0
                  Width: =Parent.TemplateWidth - 24
                  Height: =39
            - galTkProductHit:
                Control: Classic/Button@2.2.0
                Properties:
                  # A gallery's own OnSelect does not reliably fire when the click lands
                  # on a child control, so the row's action lives on a transparent
                  # full-template button declared LAST. Confirmed in Studio 2026-08-03.
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  OnSelect: |
                    =Set( gTkProduct, { Id: ThisItem.ID, Value: ThisItem.product_uid } );
                    Set( gTkPicker, "" )
      # ==================================================================
      # ACTION BAR — fixed footer: one opaque backing rectangle and one
      # auto-layout row on the IDENTICAL anchor, so they cannot drift apart.
      # ==================================================================
      - actionBarBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Surface
            BorderColor: =Theme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
      - actionBarRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
          Children:
            - lblTkMissing:
                Control: Label@2.5.1
                Properties:
                  Visible: =Len(Self.Text) > 0
                  # Flat on purpose: one Trim over an &-chain, nothing nested. The
                  # nested version cost a round trip once — a single `&` mistyped as
                  # `,` turns it into Trim(a, b), which reads as a bug in the formula.
                  Text: |
                    =Trim(
                    If( Len(Trim(txtTkName.Text)) = 0, "task name   ", "" ) &
                    If( Len(gTkLead.Mail) = 0,         "lead   ", "" ) &
                    If( gTkProject.Id = 0,             "a parent project   ", "" ) )
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.Danger
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =1
                  LayoutMinWidth: =120
                  Height: =48
            - btnTkCancel:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =Theme.Color.Surface
                  Color: =Theme.Color.Primary
                  BorderColor: =Theme.Color.Primary
                  BorderThickness: =1
                  Font: =Theme.Font
                  Size: =Theme.Size.Body
                  Text: ="Cancel"
                  FillPortions: =0
                  LayoutMinWidth: =140
                  Width: =140
                  Height: =48
                  OnSelect: =Back()
            - btnTkSave:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =Theme.Color.Primary
                  Color: =Theme.Color.OnPrimary
                  BorderColor: =Theme.Color.Primary
                  BorderThickness: =0
                  Font: =Theme.Font
                  Size: =Theme.Size.Body
                  Text: =If(gEditMode = "Edit", "Save task", "Create task")
                  DisplayMode: |
                    =If( Len(lblTkMissing.Text) = 0, DisplayMode.Edit, DisplayMode.Disabled )
                  FillPortions: =0
                  LayoutMinWidth: =200
                  Width: =200
                  Height: =48
                  OnSelect: |
                    =Set( gTkSaved, Blank() );
                    Set( gTkErr, "" );
                    Set( gTkWarn, "" );
                    IfError(
                    Set( gTkSaved,
                    Patch( taskmaster_tasks,
                    If( gEditMode = "Edit", gEditTask, Defaults(taskmaster_tasks) ),
                    { task_name:        Trim(txtTkName.Text),
                    task_project_id:  { Id: gTkProject.Id, Value: gTkProject.Value },
                    task_description: txtTkDesc.Text,
                    task_stage:       { Value: gTkStage },
                    task_status:      { Value: gTkStatus },
                    task_priority:    { Value: gTkPriority },
                    task_lead: { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",   Claims:      ClaimPrefix & Lower(gTkLead.Mail),   DisplayName: gTkLead.DisplayName,   Email:       gTkLead.Mail,   Department: "", JobTitle: "", Picture: "" },
                    task_date_start:  dtpTkStart.SelectedDate,
                    task_date_target: dtpTkTarget.SelectedDate,
                    // DERIVED, not entered. Complete stamps it and keeps the original on a
                    // re-save; Archived PRESERVES whatever was there, because archiving a
                    // finished task must not erase when it finished; anything else CLEARS it.
                    task_date_completion:
                    If( gTkStage = "Complete",
                    Coalesce(gEditTask.task_date_completion, Now()),
                    gTkStage = "Archived",
                    gEditTask.task_date_completion,
                    Blank() ) } ) ),
                    Set( gTkErr, FirstError.Message ) );
                    // Trust the RECORD, never the message — a write can fail and still leave
                    // FirstError.Message empty, and reading that as success is what corrupted
                    // scrProjectEdit's state on 2026-08-06.
                    If( IsBlank(gTkSaved.ID) && Len(gTkErr) = 0,
                    Set( gTkErr, "SharePoint returned no record and no error message, so nothing was saved." ) );
                    If( Len(gTkErr) > 0,
                    Notify("Couldn't save the task: " & gTkErr, NotificationType.Error) );
                    If( Len(gTkErr) = 0 && !IsBlank(gTkSaved.ID),
                    If( Len(gTkSupporter.Mail) > 0,
                    IfError( Set( gTkOpt, Patch(taskmaster_tasks, gTkSaved, { task_supporter: { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",   Claims:      ClaimPrefix & Lower(gTkSupporter.Mail),   DisplayName: gTkSupporter.DisplayName,   Email:       gTkSupporter.Mail,   Department: "", JobTitle: "", Picture: "" } }) ), Set( gTkWarn, gTkWarn & "the supporter didn't stick: " & FirstError.Message & "   " )),
                    gEditMode = "Edit",
                    IfError( Set( gTkOpt, Patch(taskmaster_tasks, gTkSaved, { task_supporter: Blank() }) ), Set( gTkWarn, gTkWarn & "the supporter didn't clear: " & FirstError.Message & "   " )) );
                    // EVERY optional field is gated on its SECTION TOGGLE as well as its own
                    // value. Switching a section off on an edit has to CLEAR what is stored, or
                    // the form would hide values that are still on the record. Client and client
                    // stage follow tglTkClient; the rest follow tglTkOutput.
                    If( tglTkOutput.Value && Len(Trim(txtTkApprovalId.Text)) > 0,
                    IfError( Set( gTkOpt, Patch(taskmaster_tasks, gTkSaved, { task_output_approval_id: Trim(txtTkApprovalId.Text) }) ), Set( gTkWarn, gTkWarn & "the approval id didn't stick: " & FirstError.Message & "   " )),
                    gEditMode = "Edit",
                    IfError( Set( gTkOpt, Patch(taskmaster_tasks, gTkSaved, { task_output_approval_id: Blank() }) ), Set( gTkWarn, gTkWarn & "the approval id didn't clear: " & FirstError.Message & "   " )) );
                    If( tglTkClient.Value && gTkClient.Id > 0,
                    IfError( Set( gTkOpt, Patch(taskmaster_tasks, gTkSaved, { task_client_name: { Id: gTkClient.Id, Value: gTkClient.Value } }) ), Set( gTkWarn, gTkWarn & "the client link didn't stick: " & FirstError.Message & "   " )),
                    gEditMode = "Edit",
                    IfError( Set( gTkOpt, Patch(taskmaster_tasks, gTkSaved, { task_client_name: Blank() }) ), Set( gTkWarn, gTkWarn & "the client link didn't clear: " & FirstError.Message & "   " )) );
                    If( tglTkOutput.Value && gTkProduct.Id > 0,
                    IfError( Set( gTkOpt, Patch(taskmaster_tasks, gTkSaved, { task_product_id: { Id: gTkProduct.Id, Value: gTkProduct.Value } }) ), Set( gTkWarn, gTkWarn & "the product link didn't stick: " & FirstError.Message & "   " )),
                    gEditMode = "Edit",
                    IfError( Set( gTkOpt, Patch(taskmaster_tasks, gTkSaved, { task_product_id: Blank() }) ), Set( gTkWarn, gTkWarn & "the product link didn't clear: " & FirstError.Message & "   " )) );
                    If( tglTkOutput.Value && gTkLanguage <> "(none)",
                    IfError( Set( gTkOpt, Patch(taskmaster_tasks, gTkSaved, { task_output_language: { Value: gTkLanguage } }) ), Set( gTkWarn, gTkWarn & "the language didn't stick: " & FirstError.Message & "   " )),
                    gEditMode = "Edit",
                    IfError( Set( gTkOpt, Patch(taskmaster_tasks, gTkSaved, { task_output_language: Blank() }) ), Set( gTkWarn, gTkWarn & "the language didn't clear: " & FirstError.Message & "   " )) );
                    If( tglTkOutput.Value && gTkFormat <> "(none)",
                    IfError( Set( gTkOpt, Patch(taskmaster_tasks, gTkSaved, { task_output_format: { Value: gTkFormat } }) ), Set( gTkWarn, gTkWarn & "the format didn't stick: " & FirstError.Message & "   " )),
                    gEditMode = "Edit",
                    IfError( Set( gTkOpt, Patch(taskmaster_tasks, gTkSaved, { task_output_format: Blank() }) ), Set( gTkWarn, gTkWarn & "the format didn't clear: " & FirstError.Message & "   " )) );
                    If( tglTkOutput.Value && gTkBranding <> "(none)",
                    IfError( Set( gTkOpt, Patch(taskmaster_tasks, gTkSaved, { task_output_branding: { Value: gTkBranding } }) ), Set( gTkWarn, gTkWarn & "the branding didn't stick: " & FirstError.Message & "   " )),
                    gEditMode = "Edit",
                    IfError( Set( gTkOpt, Patch(taskmaster_tasks, gTkSaved, { task_output_branding: Blank() }) ), Set( gTkWarn, gTkWarn & "the branding didn't clear: " & FirstError.Message & "   " )) );
                    If( tglTkClient.Value && gTkClientStage <> "(none)",
                    IfError( Set( gTkOpt, Patch(taskmaster_tasks, gTkSaved, { task_client_stage: { Value: gTkClientStage } }) ), Set( gTkWarn, gTkWarn & "the client stage didn't stick: " & FirstError.Message & "   " )),
                    gEditMode = "Edit",
                    IfError( Set( gTkOpt, Patch(taskmaster_tasks, gTkSaved, { task_client_stage: Blank() }) ), Set( gTkWarn, gTkWarn & "the client stage didn't clear: " & FirstError.Message & "   " )) );
                    // --- C3: rewrite the parent project's weighted completion ---------
                    // LAST, because it must read the task's POST-save stage. Delegable Filter
                    // on the indexed FK plus an Or-of-equals over the six live stages
                    // (`<> "Archived"` is a Text <> and would NOT delegate).
                    With( { pid: gTkProject.Id },
                    With( { proj: LookUp(taskmaster_projects, ID = pid),
                    scored:
                    AddColumns(
                    Filter( taskmaster_tasks,
                    task_project_id.Id = pid
                    && ( task_stage.Value = "Not Started"  || task_stage.Value = "Planning"
                    || task_stage.Value = "Drafting"     || task_stage.Value = "Under Review"
                    || task_stage.Value = "Finalizing"   || task_stage.Value = "Complete" ) ),
                    wgt, Coalesce(LookUp(StageWeights, Stage = task_stage.Value, Weight), 0) ) },
                    If( IsBlank(proj),
                    Notify("Task saved. Parent project not found, so completion was left unchanged.",
                    NotificationType.Warning),
                    CountRows(scored) >= 500,
                    Notify("Task saved. This project has too many tasks to compute completion accurately, so it was left unchanged.",
                    NotificationType.Warning),
                    IfError(
                    Set( gSelProject,
                    Patch( taskmaster_projects, proj,
                    { project_perc_completion:
                    If( CountRows(scored) = 0, 0,
                    RoundDown(Average(scored, wgt), 0) ) } ) ), Set( gTkWarn, gTkWarn & "Task saved, but the project rollup didn't update: " & FirstError.Message & "   " )) ) ) );
                    If( Len(gTkWarn) > 0,
                    Notify( "Task saved, but: " & gTkWarn, NotificationType.Warning ) );
                    If( Len(gTkWarn) = 0,
                    Notify( If(gEditMode = "Edit", "Task saved", "Task created"), NotificationType.Success ) );
                    Back() )
