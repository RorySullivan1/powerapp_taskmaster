            Width: =440
            Height: =40
            Items: |
              =Table( { Id: 1, Label: "Low" }, { Id: 2, Label: "Moderate" },
                      { Id: 3, Label: "High" }, { Id: 4, Label: "Critical" } )
            DefaultId: |
              =Switch( If(gEditMode = "Edit", Coalesce(gEditTask.task_priority.Value, "Moderate"), "Moderate"),
                       "Low", 1, "Moderate", 2, "High", 3, 4 )
            OnChange: |
              =Set(gTkPriority, selTkPriority.Selected.Label)
      - lblTkStartCap:
          Control: Label@2.5.1
          Properties:
            Visible: =gTaskEditTab = 1
            # C4: task_date_start is a real DateTime written at creation, not a
            # Calculated column — that is what makes it indexable and sortable.
            Text: ="Start date"
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Color: =Theme.Color.TextMuted
            X: =580
            Y: =282
            Width: =240
            Height: =18
      - dtpTkStart:
          Control: ModernDatePicker@1.0.0
          Properties:
            DefaultDate: =If(gEditMode = "Edit", gEditTask.task_date_start, Blank())
            Placeholder: ="Start date"
            Format: =DatePickerFormat.LongAbbreviated
            StartOfWeek: =StartOfWeek.Monday
            IsEditable: =true
            Height: =32
            X: =580
            Y: =302
            Width: =160
            Visible: =gTaskEditTab = 1
      - lblTkTargetCap:
          Control: Label@2.5.1
          Properties:
            Visible: =gTaskEditTab = 1
            Text: ="Due date"
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Color: =Theme.Color.TextMuted
            X: =920
            Y: =282
            Width: =240
            Height: =18
