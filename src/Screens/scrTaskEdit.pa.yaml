          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Visible: =gTkPicker = "Product" && ( gTaskEditTab = 2 && Len(txtTkProductSearch.Text) >= 2 && gTkProduct.Id <= 0 )
            Items: |
              =Sort( Filter( taskmaster_products,
                         StartsWith(product_uid, txtTkProductSearch.Text) ),
                     product_uid )
            TemplateSize: =32
            TemplatePadding: =0
            BorderColor: =Theme.Color.Border
            BorderThickness: =1
            X: =312
            Y: =292
            Width: =280
            Height: =132
            TemplateFill: =Theme.Color.Surface
          Children:
            - rowTkProduct:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.product_uid
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextPrimary
                  X: =8
                  Y: =0
                  Width: =Parent.TemplateWidth - 16
                  Height: =32
                  VerticalAlign: =VerticalAlign.Middle
            - galTkProductHit:
                Control: Classic/Button@2.2.0
                Properties:
                  # The row's action lives HERE, not on the gallery's OnSelect: a gallery's own
                  # OnSelect does not reliably fire when the click lands on a child control, so
                  # without a transparent full-template button declared LAST the rows look right
                  # and do nothing. Confirmed in Studio on the nav rail, 2026-08-03.
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  OnSelect: |
                    =Select(Parent);
                     Set(gTkProduct, { Id: ThisItem.ID, Value: ThisItem.product_uid })
