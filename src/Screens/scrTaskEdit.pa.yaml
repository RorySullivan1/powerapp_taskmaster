            Font: =Theme.Font
            Size: =Theme.Size.Body
            X: =24
            Y: =160
            Width: =520
            Height: =40
      - lblTkProjCap:
          Control: Label@2.5.1
          Properties:
            Visible: =gTaskEditTab = 1
            Text: ="Project  *"
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Color: =Theme.Color.TextMuted
            X: =24
            Y: =210
            Width: =520
            Height: =18
      - txtTkProjectSearch:
          Control: ModernTextInput@1.0.0
          Properties:
            Type: =TextInputType.Search
            OnChange: =Set(gTkPicker, "Project")
            Visible: =gTaskEditTab = 1
            Placeholder: ="Type to find a project…"
            TriggerOutput: =TriggerOutput.Delayed
            Font: =Theme.Font
            Size: =Theme.Size.Small
            X: =24
            Y: =230
            Width: =280
            Height: =36
      - lblTkProjChip:
          Control: Label@2.5.1
