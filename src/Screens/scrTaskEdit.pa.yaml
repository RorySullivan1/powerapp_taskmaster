                                    Text: ="Description"
                                    Font: =Theme.Font
                                    Size: =Theme.Size.Small
                                    Color: =Theme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - txtTkDesc:
