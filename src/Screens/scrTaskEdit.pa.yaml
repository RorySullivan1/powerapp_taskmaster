                                    Color: =Theme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - cboTkStatus:
                                  Control: ModernCombobox@1.1.1
                                  Properties:
                                    Items: =["Green", "Amber", "Red"]
                                    ItemDisplayText: =ThisItem.Value
                                    DefaultSelectedItems: =Filter( [gTkStatus], !IsBlank(Value) )
                                    SelectMultiple: =false
                                    IsSearchable: =false
                                    InputTextPlaceholder: ="Select…"
                                    Color: |
