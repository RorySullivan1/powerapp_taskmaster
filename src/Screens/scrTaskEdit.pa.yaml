                        - colTkTarget:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              LayoutGridColumnStart: =2
                              LayoutGridColumnEnd: =2
                              LayoutGridRowStart: =2
                              LayoutGridRowEnd: =2
                              Height: =62
                            Children:
                              - lblTkTargetCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |
                                      ="Due date" &
                                       If( !IsBlank(dtpTkTarget.SelectedDate)
                                       && dtpTkTarget.SelectedDate < Today()
                                       && gTkStage <> "Completed",
                                           "   ·   OVERDUE", "" )
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: |
                                      =If( !IsBlank(dtpTkTarget.SelectedDate)
                                      && dtpTkTarget.SelectedDate < Today()
                                      && gTkStage <> "Completed",
                                           gTheme.Color.Danger, gTheme.Color.TextMuted )
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - dtpTkTarget:
                                  Control: ModernDatePicker@1.0.1
                                  Properties:
                                    DefaultDate: |
                                      =If(gEditMode = "Edit", gEditTask.task_date_target, Blank())
                                    Placeholder: ="Pick a date"
                                    FillPortions: =0
                                    LayoutMinHeight: =36
                                    Width: =Parent.Width
                                    Height: =36
            - secTkClient:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =10
                  PaddingTop: =14
                  PaddingBottom: =14
                  PaddingLeft: =20
                  PaddingRight: =20
                  Fill: =gTheme.Color.Surface
                  BorderColor: =gTheme.Color.Border
                  BorderThickness: =1
                  FillPortions: =0
                  LayoutMinHeight: =172
                  Width: =Parent.Width - 48
                  Height: =172
                Children:
                  - lblsecTkClientHead:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Client"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.H3
                        FontWeight: =FontWeight.Semibold
                        Color: =gTheme.Color.Primary
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =0
                        LayoutMinHeight: =26
                        Width: =Parent.Width - 40
                        Height: =26
                  - rowTkClientToggle:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =12
                        FillPortions: =0
                        LayoutMinHeight: =36
                        Width: =Parent.Width - 40
                        Height: =36
                      Children:
                        - tglTkClient:
                            Control: Classic/Toggle@2.1.0
                            Properties:
                              Default: |
                                =If( gEditMode = "Edit",
                                     gEditTask.task_client_name.Id > 0
                                  || !IsBlank(gEditTask.task_client_stage.Value),
                                     false )
                              FalseText: =""
                              TrueText: =""
                              FillPortions: =0
                              LayoutMinWidth: =60
                              Width: =60
                              Height: =30
                        - lbltglTkClientCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Client Section?"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Body
                              Color: =gTheme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =1
                              LayoutMinWidth: =200
                              Height: =24
                  - rowTkClientFields:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =20
                        FillPortions: =0
                        Visible: =tglTkClient.Value
                        LayoutMinHeight: =62
                        Width: =Parent.Width - 40
                        Height: =62
                      Children:
                        - colTkClient:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              FillPortions: =1
                              LayoutMinWidth: =200
                              Height: =62
                            Children:
                              - fldClient:
                                  Control: CanvasComponent
                                  ComponentName: cmpLookupField
                                  Properties:
                                    Caption: ="Client"
                                    PickLabel: ="＋  Choose a client"
                                    HasValue: =gTkClient.Id > 0
                                    Display: =gTkClient.Value
                                    Width: =Parent.Width
                                    Height: =62
                                    OnPick: |
                                      =Set( gTkPicker, "Client" );
                                       Reset( cmpTkPick );
                                       Set( gTkQuery, "" )
                                    OnClear: |
                                      =Set( gTkClient, { Id: 0, Value: "" } )
                        - colTkCliStage:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              FillPortions: =1
                              LayoutMinWidth: =150
                              Height: =62
                            Children:
                              - lblTkClientStageCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="Client lifecycle stage"
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - cboTkClientStage:
                                  Control: ModernCombobox@1.1.1
                                  Properties:
                                    Items: =colTkCliStageOpts
                                    ItemDisplayText: =ThisItem.Value
                                    DefaultSelectedItems: =Filter( [gTkClientStage], !IsBlank(Value) )
                                    SelectMultiple: =false
                                    IsSearchable: =false
                                    InputTextPlaceholder: ="Select…"
                                    Color: |
                                      =gTheme.Color.TextPrimary
                                    FillPortions: =0
                                    LayoutMinHeight: =36
                                    Width: =Parent.Width
                                    Height: =36
                                    OnChange: =Set(gTkClientStage, cboTkClientStage.Selected.Value)
            - secTkOutput:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =10
                  PaddingTop: =14
                  PaddingBottom: =14
                  PaddingLeft: =20
                  PaddingRight: =20
                  Fill: =gTheme.Color.Surface
                  BorderColor: =gTheme.Color.Border
                  BorderThickness: =1
                  FillPortions: =0
                  # Shown: 14 + head 26 + 10 + toggle 36 + 10 + log 194 + 10 + products 124 + 14 = 438.
                  # Hidden: 14 + 26 + 10 + 36 + 14 = 100.
                  LayoutMinHeight: =If( tglTkOutput.Value, 438, 100 )
                  Width: =Parent.Width - 48
                  Height: =If( tglTkOutput.Value, 438, 100 )
                Children:
                  - lblsecTkOutputHead:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Outputs & Products"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.H3
                        FontWeight: =FontWeight.Semibold
                        Color: =gTheme.Color.Primary
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =0
                        LayoutMinHeight: =26
                        Width: =Parent.Width - 40
                        Height: =26
                  - rowTkOutputToggle:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =12
                        FillPortions: =0
                        LayoutMinHeight: =36
                        Width: =Parent.Width - 40
                        Height: =36
                      Children:
                        # SHOW/HIDE ONLY. Nothing reads this toggle in a write path: the output log
                        # and the product links save the same whether it is on or off. Do not gate a
                        # write on it — that turns it into a delete button.
                        - tglTkOutput:
                            Control: Classic/Toggle@2.1.0
                            Properties:
                              Default: |
                                =If( gEditMode = "Edit",
                                     !IsEmpty(colTkOut) || !IsEmpty(colTkProducts),
                                     false )
                              FalseText: =""
                              TrueText: =""
                              FillPortions: =0
                              LayoutMinWidth: =60
                              Width: =60
                              Height: =30
                        - lbltglTkOutputCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                ="Task Produces Output?" &
                                 If( !tglTkOutput.Value && !IsEmpty(colTkOut),
                                     "   (" & CountRows(colTkOut) & " output(s) hidden — still saved with the task)", "" )
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Body
                              Color: =gTheme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =1
                              LayoutMinWidth: =200
                              Height: =24
                  # THE OUTPUT LOG. Read-only rows; every edit goes through the modal (mdTkOut*), so
                  # no input control sits inside the gallery. Nothing here writes to SharePoint —
                  # btnTkSave does, after the task Patch.
                  # 194 = head 28 + 6 + gallery 160 (5 rows of 32). The empty label takes 22 + 6 out
                  # of the gallery, which flexes down to 132.
                  - blkTkOutLog:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =6
                        FillPortions: =0
                        Visible: =tglTkOutput.Value
                        LayoutMinHeight: =194
                        Width: =Parent.Width - 40
                        Height: =194
                      Children:
                        - rowTkOutHead:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =12
                              FillPortions: =0
                              LayoutMinHeight: =28
                              Width: =Parent.Width
                              Height: =28
                            Children:
                              - lblTkOutCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |
                                      ="Output log" &
                                       If( CountRows(colTkOut) > 0, "   (" & CountRows(colTkOut) & ")", "" ) &
                                       If( !IsEmpty( Filter(colTkOut, Dirty) ) || !IsEmpty(colTkOutDel),
                                           "   ·   unsaved changes — Save to keep them", "" )
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =140
                                    Height: =28
                              # PREFILLS format, audience, language and branding from the LAST row, so a
                              # run of similar outputs is one field each. Name and approval start blank.
                              - btnTkAddOutput:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: ="＋  Add output"
                                    Fill: =gTheme.Color.Surface
                                    Color: =gTheme.Color.Primary
                                    HoverFill: =gTheme.Color.Hover
                                    PressedFill: =gTheme.Color.Press
                                    BorderColor: =gTheme.Color.Primary
                                    BorderThickness: =1
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    FillPortions: =0
                                    LayoutMinWidth: =160
                                    Width: =160
                                    Height: =28
                                    OnSelect: |
                                      =Set( gTkOutSid, 0 );
                                       Set( gTkOutName, "" );
                                       Set( gTkOutDate, Today() );
                                       Set( gTkOutFmt,   Coalesce( Last(colTkOut).Format, "" ) );
                                       Set( gTkOutAud,   Coalesce( Last(colTkOut).Audience, "" ) );
                                       Set( gTkOutLang,  Coalesce( Last(colTkOut).Language, "" ) );
                                       Set( gTkOutBrand, Coalesce( Last(colTkOut).Branding, "" ) );
                                       Set( gTkOutFlag, false );
                                       Set( gTkOutAppr, "" );
                                       Reset( txtTkOutName ); Reset( dtpTkOutDate );
                                       Reset( cboTkOutFmt ); Reset( cboTkOutAud ); Reset( cboTkOutLang ); Reset( cboTkOutBrand );
                                       Reset( tglTkOutFlag ); Reset( txtTkOutAppr );
                                       Set( gTkOutOpen, true )
                        - lblTkOutEmpty:
                            Control: Label@2.5.1
                            Properties:
                              Visible: =IsEmpty(colTkOut)
                              Text: ="No outputs logged yet."
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =22
                              Width: =Parent.Width
                              Height: =22
                        - galTkOut:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                            Properties:
                              # A LOCAL collection, so nothing here has to delegate.
                              Items: =colTkOut
                              WrapCount: =1
                              TemplateSize: =32
                              TemplatePadding: =0
                              TemplateFill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              ShowScrollbar: =true
                              FillPortions: =1
                              LayoutMinHeight: =60
                              Width: =Parent.Width
                              Height: =160
                            Children:
                              # Row budget: pad 4 + 4, five gaps of 10 and fixed 96 + 170 + 20 + 20 cost
                              # 364; name and meta split the rest (min 140 + 200, so >= 704 wide).
                              - rowTkOutBody:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =10
                                    PaddingLeft: =4
                                    PaddingRight: =4
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =Parent.TemplateHeight - 1
                                  Children:
                                    - cellTkOutName:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =ThisItem.Name
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Body
                                          Color: =gTheme.Color.Primary
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =1
                                          LayoutMinWidth: =140
                                          Height: =26
                                          OnSelect: |
                                            =Set( gTkOutSid, ThisItem.Sid );
                                             Set( gTkOutName, ThisItem.Name );
                                             Set( gTkOutDate, ThisItem.ODate );
                                             Set( gTkOutFmt, ThisItem.Format );
                                             Set( gTkOutAud, ThisItem.Audience );
                                             Set( gTkOutLang, ThisItem.Language );
                                             Set( gTkOutBrand, ThisItem.Branding );
                                             Set( gTkOutFlag, ThisItem.Flag );
                                             Set( gTkOutAppr, ThisItem.ApprId );
                                             Reset( txtTkOutName ); Reset( dtpTkOutDate );
                                             Reset( cboTkOutFmt ); Reset( cboTkOutAud ); Reset( cboTkOutLang ); Reset( cboTkOutBrand );
                                             Reset( tglTkOutFlag ); Reset( txtTkOutAppr );
                                             Set( gTkOutOpen, true )
                                    - cellTkOutDate:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =If( IsBlank(ThisItem.ODate), "No date", Text(ThisItem.ODate, "dd mmm yyyy") )
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Small
                                          Color: =gTheme.Color.TextMuted
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =0
                                          LayoutMinWidth: =96
                                          Width: =96
                                          Height: =26
                                    - cellTkOutMeta:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |
                                            =ThisItem.Format & "  ·  " & ThisItem.Audience & "  ·  " &
                                             ThisItem.Language & "  ·  " & ThisItem.Branding
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Small
                                          Color: =gTheme.Color.TextPrimary
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =1
                                          LayoutMinWidth: =200
                                          Height: =26
                                    # RED while the flag is on and the id is blank — that row is what
                                    # lblTkMissing names when the stage is Completed.
                                    - cellTkOutAppr:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |
                                            =If( !ThisItem.Flag, "",
                                                 Len(Trim(ThisItem.ApprId)) > 0, "Approval " & ThisItem.ApprId,
                                                 "Approval ID missing" )
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Small
                                          Color: |
                                            =If( ThisItem.Flag && Len(Trim(ThisItem.ApprId)) = 0,
                                                 gTheme.Color.Danger, gTheme.Color.TextMuted )
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =0
                                          LayoutMinWidth: =170
                                          Width: =170
                                          Height: =26
                                    - icoTkOutEdit:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          Icon: =Icon.Edit
                                          Color: =gTheme.Color.TextMuted
                                          HoverColor: =gTheme.Color.Primary
                                          HoverFill: =RGBA(0, 0, 0, 0)
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          Tooltip: ="Edit this output"
                                          FillPortions: =0
                                          LayoutMinWidth: =20
                                          Width: =20
                                          Height: =20
                                          # Same handler as cellTkOutName — keep the two in step.
                                          OnSelect: |
                                            =Set( gTkOutSid, ThisItem.Sid );
                                             Set( gTkOutName, ThisItem.Name );
                                             Set( gTkOutDate, ThisItem.ODate );
                                             Set( gTkOutFmt, ThisItem.Format );
                                             Set( gTkOutAud, ThisItem.Audience );
                                             Set( gTkOutLang, ThisItem.Language );
                                             Set( gTkOutBrand, ThisItem.Branding );
                                             Set( gTkOutFlag, ThisItem.Flag );
                                             Set( gTkOutAppr, ThisItem.ApprId );
                                             Reset( txtTkOutName ); Reset( dtpTkOutDate );
                                             Reset( cboTkOutFmt ); Reset( cboTkOutAud ); Reset( cboTkOutLang ); Reset( cboTkOutBrand );
                                             Reset( tglTkOutFlag ); Reset( txtTkOutAppr );
                                             Set( gTkOutOpen, true )
                                    - icoTkOutDel:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          Icon: =Icon.Cancel
                                          Color: =gTheme.Color.TextMuted
                                          HoverColor: =gTheme.Color.Danger
                                          HoverFill: =RGBA(197, 58, 58, 0.08)
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          Tooltip: ="Remove this output from the task"
                                          FillPortions: =0
                                          LayoutMinWidth: =20
                                          Width: =20
                                          Height: =20
                                          # Staging only. A row already in SharePoint is queued in colTkOutDel
                                          # and removed by btnTkSave; the Collect must come BEFORE the RemoveIf.
                                          OnSelect: |
                                            =If( !gSaving,
                                                 If( ThisItem.OutId > 0, Collect( colTkOutDel, { OutId: ThisItem.OutId } ) );
                                                 RemoveIf( colTkOut, Sid = ThisItem.Sid ) )
                              - rowTkOutLine:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =gTheme.Color.Border
                                    X: =0
                                    Y: =Parent.TemplateHeight - 1
                                    Width: =Parent.TemplateWidth
                                    Height: =1
                  # PRODUCTS ARE 1:n. A task is 1:1 with a client but can carry several products,
                  # so this is a staged LIST plus an add button, in a full-width block of its own.
                  - blkTkProducts:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =6
                        FillPortions: =0
                        Visible: =tglTkOutput.Value
                        LayoutMinHeight: =124
                        Width: =Parent.Width - 40
                        Height: =124
                      Children:
                        - rowTkProdHead:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =12
                              FillPortions: =0
                              LayoutMinHeight: =28
                              Width: =Parent.Width
                              Height: =28
                            Children:
                              - lblTkProductsCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |
                                      ="Products" & If( CountRows(colTkProducts) > 0,
                                                        "   (" & CountRows(colTkProducts) & ")", "" )
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =140
                                    Height: =28
                              - btnTkAddProduct:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: ="＋  Add a product"
                                    Fill: =gTheme.Color.Surface
                                    Color: =gTheme.Color.Primary
                                    HoverFill: =gTheme.Color.Hover
                                    PressedFill: =gTheme.Color.Press
                                    BorderColor: =gTheme.Color.Primary
                                    BorderThickness: =1
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    FillPortions: =0
                                    LayoutMinWidth: =160
                                    Width: =160
                                    Height: =28
                                    OnSelect: |
                                      =Set( gTkPicker, "Product" );
                                       Reset( cmpTkPick );
                                       Set( gTkQuery, "" )
                        - lblTkProductsEmpty:
                            Control: Label@2.5.1
                            Properties:
                              Visible: =IsEmpty(colTkProducts)
                              Text: ="No products linked yet."
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =22
                              Width: =Parent.Width
                              Height: =22
                        - galTkProducts:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                            Properties:
                              # A LOCAL collection, so nothing here has to delegate.
                              Items: =colTkProducts
                              WrapCount: =1
                              TemplateSize: =30
                              TemplatePadding: =0
                              TemplateFill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              ShowScrollbar: =true
                              FillPortions: =1
                              LayoutMinHeight: =60
                              Width: =Parent.Width
                              Height: =90
                            Children:
                              - rowTkProdBody:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =10
                                    PaddingLeft: =4
                                    PaddingRight: =4
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =Parent.TemplateHeight - 1
                                  Children:
                                    - cellTkProdUid:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =ThisItem.Uid
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Body
                                          Color: =gTheme.Color.TextPrimary
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =1
                                          LayoutMinWidth: =140
                                          Height: =26
                                    - icoTkProdRemove:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          Icon: =Icon.Cancel
                                          Color: =gTheme.Color.TextMuted
                                          HoverColor: =gTheme.Color.Danger
                                          HoverFill: =RGBA(197, 58, 58, 0.08)
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          Tooltip: ="Remove this product from the task"
                                          FillPortions: =0
                                          LayoutMinWidth: =20
                                          Width: =20
                                          Height: =20
                                          # Staging only — the junction is not touched until Save reconciles it.
                                          OnSelect: =Remove( colTkProducts, ThisItem )
                              - rowTkProdLine:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =gTheme.Color.Border
                                    X: =0
                                    Y: =Parent.TemplateHeight - 1
                                    Width: =Parent.TemplateWidth
                                    Height: =1
      - actionBarBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            BorderColor: =gTheme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
      - actionBarRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
          Children:
            # DESTRUCTIVE, so it sits hard left, away from Save. Edit mode only. Arms the
            # dialog and deletes nothing; gDelRefs is counted here so the dialog can say
            # what else changes.
            - btnTkDelete:
                Control: Classic/Button@2.2.0
                Properties:
                  Visible: =gEditMode = "Edit"
                  Text: ="Delete"
                  Fill: =gTheme.Color.Surface
                  Color: =gTheme.Color.Danger
                  BorderColor: =gTheme.Color.Danger
                  BorderThickness: =1
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  FillPortions: =0
                  LayoutMinWidth: =140
                  Width: =140
                  Height: =48
                  OnSelect: |
                    =Set( gDelKind, "Task" );
                     Set( gDelId, gEditTask.ID );
                     Set( gDelName, gEditTask.task_name );
                     Set( gDelRefs, CountRows( Filter(taskmaster_issues, issue_task_name.Id = gEditTask.ID) ) );
                     // Outputs in SharePoint as loaded: rows still staged plus rows removed in the
                     // log but not yet saved. The cascade itself deletes by FK, not from this count.
                     Set( gTkDelOutN, CountRows( Filter(colTkOut, OutId > 0) ) + CountRows(colTkOutDel) )
            - lblTkMissing:
                Control: Label@2.5.1
                Properties:
                  Visible: =Len(Self.Text) > 0
                  Text: |
                    =With(
                       { m: Concat( Filter( Table(
                              { L: "Task Name",       M: Len(Trim(txtTkName.Text)) = 0 },
                              { L: "Lead",            M: Len(gTkLead.Mail) = 0 },
                              { L: "Parent Project",  M: gTkProject.Id = 0 },
                              { L: "Stage",           M: Len(gTkStage) = 0 },
                              { L: "Priority",        M: Len(gTkPriority) = 0 } ),
                            M ), L, " | " ),
                         // THE APPROVAL GATE, per staged output row, whether or not the section is
                         // shown. Only once the task is being COMPLETED — the portal issues the id
                         // late, so requiring it earlier would block ordinary drafting.
                         o: If( gTkStage = "Completed",
                                Concat( Filter( colTkOut, Flag && Len(Trim(ApprId)) = 0 ),
                                        "Output '" & Name & "': Approval ID", " | " ),
                                "" ) },
                       With( { a: m & If( Len(m) > 0 && Len(o) > 0, " | ", "" ) & o },
                             If( Len(a) > 0, "Required Fields Remaining: " & a, "" ) ) )
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.Danger
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =1
                  LayoutMinWidth: =120
                  Height: =48
            - btnTkCancel:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =gTheme.Color.Surface
                  Color: =gTheme.Color.Primary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =1
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Text: ="Cancel"
                  FillPortions: =0
                  LayoutMinWidth: =140
                  Width: =140
                  Height: =48
                  # Clears the resume key: abandoning the form must not leave one armed.
                  OnSelect: =Set( gTkResumeKey, "" ); Back()
            - btnTkSave:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =gTheme.Color.Primary
                  Color: =gTheme.Color.OnPrimary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =0
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Text: |
                    =If( gSaving, "Saving…",
                         If(gEditMode = "Edit", "Save task", "Create task") )
                  # DELIBERATELY ALWAYS ENABLED — do not put a DisplayMode gate back. A DISABLED
                  # BUTTON CANNOT FIRE OnSelect, so a task missing a required field produced a
                  # click that did nothing at all: no Notify, no Back(), no error. The requirement
                  # is enforced one line down in OnSelect, where it can actually SPEAK.
                  FillPortions: =0
                  LayoutMinWidth: =200
                  Width: =200
                  Height: =48
                  OnSelect: |
                    =If( gSaving,
                    // A SECOND TAP WHILE THE FIRST WRITE IS STILL IN FLIGHT. Do nothing. A SharePoint
                    // Patch takes seconds and the button stays live, so a double-tap ran the whole
                    // handler twice and Defaults() built a SECOND record. `Set` applies immediately
                    // within a behaviour chain, so the flag is already true by the second tap.
                    false,
                    Set( gSaving, true );
                    If( Len(lblTkMissing.Text) > 0,
                    // Enforced HERE so a blocked save says which field is blocking it. All three are
                    // `required: true`, so SharePoint would reject the write anyway — this only
                    // decides whether the user is TOLD.
                    Notify( "Can't save yet. " & lblTkMissing.Text,
                    NotificationType.Error ),
                    Set( gTkSaved, Blank() );
                    Set( gTkErr, "" );
                    Set( gTkWarn, "" );
                    // BOTH PRE-WRITE READS, ISSUED TOGETHER. Neither depends on the other and both
                    // must settle before the Patch — Concurrent completes before the next statement,
                    // so gTkHealth below still sees a finished colTkHlIss.
                    Concurrent(
                    // THE PARENT PROJECT, READ ONCE AND USED TWICE — the archived mirror in the Patch
                    // record below and the C3 rollup at the end of this handler both read gTkParentProj.
                    // Do not put either LookUp back: that was two round trips for one row.
                    // Keyed on gTkProject.Id, the task's OWN parent, and read LIVE from the list: a
                    // snapshot carried in a global would stamp `false` for a project archived since the
                    // task was opened, and the row would stay in scope forever.
                    Set( gTkParentProj, LookUp( taskmaster_projects, ID = gTkProject.Id ) ),
                    // HEALTH IS DERIVED, NEVER CHOSEN. Only the ISSUE-DERIVED half is stored; overdue
                    // is folded in by readers because it changes with no write. See rollups.task_health.
                    // A NEW TASK IS GREEN WITHOUT A QUERY, and that guard is load-bearing: in New mode
                    // there is no ID, and `issue_task_name.Id = Blank()` matches every issue with NO
                    // task — which would open a brand-new task at Red.
                    // OpenIssues, NOT the raw list. It already carries `issue_status = "Open"`, so
                    // that test is not repeated here. It also excludes archived PROJECTS, which
                    // costs nothing: an archived project's tasks cannot be reached at all, because
                    // every route to this screen runs through ActiveProjects. The raw list is the
                    // unsafe option — it pages across archived issues before reaching this task's,
                    // and a fetch that comes up short reads GREEN on a task that has open issues.
                    If( gEditMode = "Edit",
                    ClearCollect( colTkHlIss,
                    Filter( OpenIssues,
                    issue_task_name.Id = gEditTask.ID ) ),
                    Clear( colTkHlIss ) ) );
                    // AMBER IS THE RESIDUAL — "any other open issue" — NOT the four amber types
                    // enumerated. Enumerated, a type added in SharePoint and not added here falls
                    // through to GREEN: an allow-list failing closed, silently, on a warning signal.
                    Set( gTkHealth,
                    If( CountRows( Filter( colTkHlIss,
                    issue_impact.Value = "Critical"
                    || issue_type.Value = "Blockage"
                    || issue_type.Value = "Exception"
                    || issue_type.Value = "Limitation" ) ) > 0, "Red",
                    CountRows(colTkHlIss) > 0, "Amber",
                    "Green" ) );
                    IfError(
                    Set( gTkSaved,
                    Patch( taskmaster_tasks,
                    If( gEditMode = "Edit", gEditTask, Defaults(taskmaster_tasks) ),
                    // Mirrors the PARENT's phase so cross-project queries can exclude archived work
                    // with a delegable `= false`. Written on every save, from the record the
                    // Concurrent above read at save time.
                    { task_project_archived:
                          Coalesce( gTkParentProj.project_phase.Value, "" ) = "Archived",
                    task_name:        Trim(txtTkName.Text),
                    task_project_id:  { Id: gTkProject.Id, Value: gTkProject.Value },
                    task_description: txtTkDesc.Text,
                    task_stage:       { Value: gTkStage },
                    task_status:      { Value: gTkHealth },
                    task_priority:    { Value: gTkPriority },
                    task_lead: { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",   Claims:      gClaimPrefix & Lower(gTkLead.Mail),   DisplayName: gTkLead.DisplayName,   Email:       gTkLead.Mail,   Department: "", JobTitle: "", Picture: "" },
                    task_date_start:  dtpTkStart.SelectedDate,
                    task_date_target: dtpTkTarget.SelectedDate,
                    // DERIVED, not entered. Complete stamps it and keeps the original on a re-save;
                    // anything else CLEARS it.
                    // THE NEW BRANCH IS SEPARATE, AND THAT IS THE WHOLE POINT. `gEditTask` is never
                    // cleared on New, so a Coalesce here let a task created straight after editing a
                    // completed one inherit that task's completion date. Insert and update are split
                    // explicitly rather than trusting a Coalesce to notice.
                    task_date_completion:
                    If( gEditMode <> "Edit",
                    If( gTkStage = "Completed", Now(), Blank() ),
                    gTkStage = "Completed",
                    Coalesce(gEditTask.task_date_completion, Now()),
                    Blank() ),
                    task_supporter:
                    If( Len(gTkSupporter.Mail) > 0,
                    { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",   Claims:      gClaimPrefix & Lower(gTkSupporter.Mail),   DisplayName: gTkSupporter.DisplayName,   Email:       gTkSupporter.Mail,   Department: "", JobTitle: "", Picture: "" },
                    Blank() ),
                    task_client_name:
                    If( tglTkClient.Value && gTkClient.Id > 0,
                    { Id: gTkClient.Id, Value: gTkClient.Value }, Blank() ),
                    // task_product_summary IS NOT WRITTEN HERE. It is written after the reconcile,
                    // from what the junction actually holds — written before, the task row could claim
                    // products with no links behind it, and reopening (which seeds from the JUNCTION)
                    // showed none.
                    // NO OUTPUT COLUMNS ON THE TASK ROW. Outputs are rows of taskmaster_output,
                    // written below once the task has an ID.
                    task_client_stage:
                    If( tglTkClient.Value && gTkClientStage <> "(none)", { Value: gTkClientStage }, Blank() ) } ) ),
                    Set( gTkErr, FirstError.Message ) );
                    // Trust the RECORD, never the message — a write can fail and still leave
                    // FirstError.Message empty.
                    If( IsBlank(gTkSaved.ID) && Len(gTkErr) = 0,
                    Set( gTkErr, "SharePoint returned no record and no error message, so nothing was saved." ) );
                    If( Len(gTkErr) > 0,
                    Notify("Couldn't save the task: " & gTkErr, NotificationType.Error) );
                    If( Len(gTkErr) = 0 && !IsBlank(gTkSaved.ID),
                    // --- reconcile taskmaster_taskproduct against the staged set -------
                    // NOT GATED ON tglTkOutput. It was, and that made the toggle a DELETE BUTTON:
                    // switching the Output section off left colTkWanted empty and the reconcile removed
                    // every link, silently, on a save the user thought was unrelated. The toggle governs
                    // VISIBILITY only.
                    // GATED ON THE STAGED SET vs WHAT WAS LOADED, which is a different question from
                    // the toggle and safe to ask: three junction reads and a second task Patch are
                    // wasted on a save that never touched the products. A user who deliberately clears
                    // every product still produces a difference, so the deletes still run.
                    // Both tests are collection-against-collection — no query behind either.
                    If( CountRows(colTkProducts) <> CountRows(colTkProductsLoaded)
                    || !IsEmpty( Filter( colTkProducts, !(Id in colTkProductsLoaded.Id) ) ),
                    Clear( colTkWanted );
                    Collect( colTkWanted, colTkProducts );
                    // DELETES LOOP OVER A LOCAL COPY, NEVER THE LIST: Studio rejects a Remove on the
                    // data source a ForAll is iterating. So the task's links are read first (the FK
                    // filter delegates), then the `in` test runs client-side over that handful, and
                    // each link to drop is looked up by ID (`=` on ID delegates) and removed.
                    // THE RAW LIST HERE, deliberately, where every read below uses LiveTaskProducts:
                    // this pass must see EVERY link — a mis-flagged one hidden from it survives as a
                    // stale row. Same rule as the delete cascade on scrProject.
                    // Value(Text(...)) on the ID: an ID copied straight out of a ForAll row does not
                    // match in a later LookUp.
                    ClearCollect( colTkLinkDel,
                    ForAll( Filter( taskmaster_taskproduct,
                    taskproduct_task_id.Id = gTkSaved.ID ) As lk,
                    { LinkId: Value( Text(lk.ID) ),
                    ProdId: lk.taskproduct_product_id.Id } ) );
                    ForAll( Filter( colTkLinkDel, !(ProdId in colTkWanted.Id) ) As d,
                    With( { x: LookUp( taskmaster_taskproduct, ID = d.LinkId ) },
                    If( !IsBlank(x.ID), Remove( taskmaster_taskproduct, x ) ) ) );
                    // Read AFTER the delete, so the add diff is against live state. Only the lookup
                    // subfield is projected — `<collection>.taskproduct_product_id.Id` is not a
                    // projection Power Fx will give you, which is why the shaping exists at all.
                    ClearCollect( colTkLinksNow,
                    ForAll( Filter( LiveTaskProducts,
                    taskproduct_task_id.Id = gTkSaved.ID ) As lk,
                    { ProdId: lk.taskproduct_product_id.Id } ) );
                    // The lookup pair is written as {Id, Value}. taskproduct_product_uid is NOT written:
                    // SharePoint derives it from taskproduct_product_id, so it is read-only to the app
                    // and naming it in the record fails every add.
                    // THE ADDS CANNOT BE WRAPPED, SO THE ERROR IS READ AFTERWARDS. Set() is not callable
                    // inside ForAll and IfError's arms must be type-compatible, so a bare Collect cannot
                    // sit against a Set either. Errors() reports failures against a DATA SOURCE after
                    // the fact, which is the shape a loop of writes needs.
                    ForAll( Filter( colTkWanted, !(Id in colTkLinksNow.ProdId) ) As add,
                    Collect( taskmaster_taskproduct,
                    { taskproduct_task_id:     { Id: gTkSaved.ID, Value: gTkSaved.task_name },
                    taskproduct_product_id:  { Id: add.Id, Value: add.Uid },
                    taskproduct_project_id:  gTkProject.Id,
                    // FALSE EXPLICITLY, and NOT redundant with the column default. A `= false`
                    // filter is an OData equality and does not match a null, so a link left
                    // unwritten here is invisible to every query built on this column. The app
                    // cannot add a child to an archived project, so false is always correct.
                    taskproduct_project_archived: false } ) );
                    If( !IsEmpty( Errors(taskmaster_taskproduct) ),
                    Set( gTkWarn, gTkWarn & "the product links didn't save: "
                    & First(Errors(taskmaster_taskproduct)).Message & "   " ) );
                    // RE-READ AND COUNT — this matters MORE than the IfError above, because it catches
                    // a write dropped without throwing as well as one that threw. Also the source for
                    // the summary, so one read serves both and they cannot disagree. The Uid comes from
                    // taskmaster_products, as on load — never from the derived taskproduct_product_uid.
                    ClearCollect( colTkLinksAfter,
                    ForAll( Filter( LiveTaskProducts,
                    taskproduct_task_id.Id = gTkSaved.ID ) As lk,
                    { Uid: LookUp( taskmaster_products,
                    ID = lk.taskproduct_product_id.Id, product_uid ) } ) );
                    If( CountRows(colTkLinksAfter) <> CountRows(colTkWanted),
                    Set( gTkWarn, gTkWarn & "the product links didn't save: expected "
                    & CountRows(colTkWanted) & ", the list holds " & CountRows(colTkLinksAfter) & ".   " ) );
                    // THE SUMMARY IS WRITTEN FROM THE JUNCTION, NOT FROM THE FORM, and only now that
                    // the junction is settled. It must never claim a link the junction does not hold.
                    // Inside the gate with the reconcile, and correctly so: the summary is derived from
                    // the junction, so an untouched junction cannot have changed it.
                    IfError(
                    Set( gTkSummarySaved,
                    Patch( taskmaster_tasks, gTkSaved,
                    { task_product_summary: Concat(colTkLinksAfter, Uid, ", ") } ) ),
                    Set( gTkWarn, gTkWarn & "the product summary didn't update: " & FirstError.Message & "   " ) ) );
                    // --- the output log: deletes, then upserts, then a re-read ---------
                    // AFTER the task Patch, so a new task's ID exists. NOT gated on tglTkOutput — that
                    // toggle only shows or hides the log.
                    // DELETES LOOP OVER THE LOCAL QUEUE, NEVER THE LIST: Studio rejects a Remove on
                    // the data source a ForAll is iterating. Each queued ID is looked up (`=` on ID
                    // delegates) and removed only if it is still there; the re-read below reports
                    // any that survive.
                    If( !IsEmpty(colTkOutDel),
                    ForAll( colTkOutDel As d,
                    With( { x: LookUp( taskmaster_output, ID = d.OutId ) },
                    If( !IsBlank(x.ID), Remove( taskmaster_output, x ) ) ) ) );
                    // UPSERTS, only rows the modal touched. ForAll may run its rows in any order, so each
                    // result is Collected (no Set inside), and every IfError arm is Text.
                    Clear( colTkOutRes );
                    ForAll( Filter( colTkOut, Dirty ) As o,
                    Collect( colTkOutRes,
                    { Sid: o.Sid, Name: o.Name,
                    // TRUST THE RECORD, NEVER THE MESSAGE: a write can be dropped with no error at all,
                    // so a returned record without an ID is a failure too. Every arm is Text.
                    Message:
                    IfError( If( IsBlank(
                    Patch( taskmaster_output,
                    If( o.OutId > 0, LookUp( taskmaster_output, ID = o.OutId ), Defaults(taskmaster_output) ),
                    { output_name:             o.Name,
                    output_project_id:       gTkProject.Id,
                    output_task_id:          gTkSaved.ID,
                    // The same expression the task Patch wrote to task_project_archived. Written on
                    // every save: `= false` does not match a blank, so an unwritten row vanishes
                    // from LiveOutputs.
                    output_project_archived: Coalesce( gTkParentProj.project_phase.Value, "" ) = "Archived",
                    output_date:             o.ODate,
                    output_format:           { Value: o.Format },
                    output_audience:         { Value: o.Audience },
                    output_language:         { Value: o.Language },
                    output_branding:         { Value: o.Branding },
                    output_approval_flag:    o.Flag,
                    output_approval_id:      If( Len(Trim(o.ApprId)) > 0, Trim(o.ApprId), Blank() ) } ).ID ),
                    "SharePoint returned no record", "" ),
                    Coalesce( FirstError.Message, "SharePoint rejected the row" ) ) } ) );
                    // RE-READ — the truth the checks below and a retry rebuild run against.
                    ClearCollect( colTkOutNow,
                    ForAll( Filter( taskmaster_output, output_task_id = gTkSaved.ID ) As o,
                    { Sid:      Value(Text(o.ID)),
                    OutId:    Value(Text(o.ID)),
                    Name:     o.output_name,
                    ODate:    If( IsBlank(o.output_date), Blank(),
                    Date( Year(o.output_date), Month(o.output_date), Day(o.output_date) ) ),
                    Format:   o.output_format.Value,
                    Audience: o.output_audience.Value,
                    Language: o.output_language.Value,
                    Branding: o.output_branding.Value,
                    Flag:     Coalesce(o.output_approval_flag, false),
                    ApprId:   Coalesce(o.output_approval_id, ""),
                    Dirty:    false } ) );
                    ClearCollect( colTkOutDelLeft,
                    ShowColumns( Filter( colTkOutNow, OutId in colTkOutDel.OutId ), OutId ) );
                    Set( gTkOutFailN, CountRows( Filter( colTkOutRes, Len(Message) > 0 ) ) );
                    // A write can be dropped without throwing; the count catches that too.
                    If( gTkOutFailN = 0 && IsEmpty(colTkOutDelLeft) && CountRows(colTkOutNow) <> CountRows(colTkOut),
                    Set( gTkWarn, gTkWarn & "the output log holds " & CountRows(colTkOutNow)
                    & " output(s), expected " & CountRows(colTkOut) & ".   " ) );
                    // --- C3: rewrite the parent project's weighted completion ---------
                    // SKIPPED ENTIRELY unless the stage moved. The rollup is a weighted average over
                    // task STAGES, so any other edit cannot change it — and computing it costs a fetch
                    // of up to 500 rows and a write.
                    If( !(gEditMode = "Edit" && gTkStage = gEditTask.task_stage.Value),
                    // ONE READ HERE, NOT TWO: the parent project is already in gTkParentProj, read at
                    // the top of this handler. It has to be a Set — a With() scope cannot carry the
                    // scored table out to the branches below.
                    Set( gTkRollupScored,
                    AddColumns(
                    // Over LiveTasks, not the raw list: this figure is WRITTEN BACK to the
                    // project, so a fetch that pages across archived work first does not just
                    // display wrong, it stores wrong.
                    Filter( LiveTasks,
                    task_project_id.Id = gTkProject.Id ),
                    wgt, Coalesce(LookUp(gStageWeights, Stage = task_stage.Value, Weight), 0) ) );
                    If( IsBlank(gTkParentProj),
                    Notify("Task saved. Parent project not found, so completion was left unchanged.",
                    NotificationType.Warning),
                    CountRows(gTkRollupScored) >= 500,
                    Notify("Task saved. This project has too many tasks to compute completion accurately, so it was left unchanged.",
                    NotificationType.Warning),
                    // A Complete project stays at 100 — the phase overrides the rollup, as on scrProject.
                    With( { newPc: If( Coalesce(gTkParentProj.project_phase.Value, "") = "Complete", 100,
                    CountRows(gTkRollupScored) = 0, 0, RoundDown(Average(gTkRollupScored, wgt), 0) ) },
                    // Don't spend a write on a number that has not moved.
                    // Coalesce to -1: a just-inserted row holds NULL and newPc is 0, so a bare compare
                    // would skip the write and leave NULL — and Average() drops blanks from the
                    // denominator, so portfolio completion then reads high.
                    If( newPc <> Coalesce(gTkParentProj.project_perc_completion, -1),
                    IfError(
                    // PATCH, THEN RE-READ. Do NOT keep the Patch return: scrProject renders entirely
                    // from gSelProject, and a record carried into a variable can come back with columns
                    // trimmed, drawing the screen as a blank template. The LookUp is one delegable read
                    // on an indexed ID and is the only thing that guarantees a full record.
                    // gTkRollupSaved exists only to hold the discarded return — IfError's arms must be
                    // type-compatible, so the Patch cannot stand bare beside a Set.
                    Set( gTkRollupSaved,
                    Patch( taskmaster_projects, gTkParentProj, { project_perc_completion: newPc } ) );
                    Set( gSelProject, LookUp( taskmaster_projects, ID = gTkParentProj.ID ) ),
                    Set( gTkWarn, gTkWarn & "Task saved, but the project rollup didn't update: " & FirstError.Message & "   " )) ) ) ) );
                    // AN OUTPUT ROW FAILED: STAY, so it can be retried. Failed rows stay staged (still
                    // Dirty); everything else is rebuilt from the re-read. The task now EXISTS, so the
                    // screen becomes an edit of it — a second Save must update it, never insert again.
                    If( gTkOutFailN > 0 || !IsEmpty(colTkOutDelLeft),
                    ClearCollect( colTkOutKeep,
                    Filter( colTkOut, Sid in ShowColumns( Filter( colTkOutRes, Len(Message) > 0 ), Sid ) ) );
                    ClearCollect( colTkOut,
                    Filter( colTkOutNow, !(OutId in colTkOutKeep.OutId) && !(OutId in colTkOutDelLeft.OutId) ),
                    colTkOutKeep );
                    ClearCollect( colTkOutDel, colTkOutDelLeft );
                    Set( gEditTask, LookUp( taskmaster_tasks, ID = gTkSaved.ID ) );
                    If( IsBlank(gEditTask.ID), Set( gEditTask, gTkSaved ) );
                    Set( gEditMode, "Edit" );
                    Set( gTkKey, "E" & gTkSaved.ID );
                    Notify( "Task saved, but the output log didn't fully save — the rows are still listed, press Save to retry.   "
                    & If( gTkOutFailN > 0,
                    gTkOutFailN & " output(s) failed. '" & First( Filter( colTkOutRes, Len(Message) > 0 ) ).Name
                    & "': " & First( Filter( colTkOutRes, Len(Message) > 0 ) ).Message & "   ", "" )
                    & If( !IsEmpty(colTkOutDelLeft),
                    CountRows(colTkOutDelLeft) & " removed output(s) are still in the list.   ", "" )
                    & gTkWarn,
                    NotificationType.Error ) );
                    If( gTkOutFailN = 0 && IsEmpty(colTkOutDelLeft),
                    If( Len(gTkWarn) > 0,
                    Notify( "Task saved, but: " & gTkWarn, NotificationType.Warning ) );
                    If( Len(gTkWarn) = 0,
                    Notify( If(gEditMode = "Edit", "Task saved", "Task created"), NotificationType.Success ) );
                    Set( gTkResumeKey, "" );
                    Back() ) ) );
                    Set( gSaving, false ) )
      # =====================================================================
      # OUTPUT MODAL — add or edit ONE staged row of colTkOut. Card 640 x 570; geometry in
      # the file header. Above the action bar, so the scrim blocks Save while it is open.
      # Writes only the staging collection; btnTkSave writes SharePoint.
      # =====================================================================
      - mdTkOutScrim:
          Control: Rectangle@2.3.0
          Properties:
            Visible: =gTkOutOpen
            Fill: =RGBA(32, 38, 45, 0.45)
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            OnSelect: =Set( gTkOutOpen, false ); Set( gTkOutSid, 0 )
      - mdTkOutBg:
          Control: Rectangle@2.3.0
          Properties:
            Visible: =gTkOutOpen
            Fill: =gTheme.Color.Surface
            BorderColor: =gTheme.Color.Border
            BorderThickness: =1
            X: =(Parent.Width - 640) / 2
            Y: =(Parent.Height - 570) / 2
            Width: =640
            Height: =570
      - mdTkOutBody:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Visible: =gTkOutOpen
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =24
            PaddingBottom: =16
            PaddingLeft: =24
            PaddingRight: =24
            X: =(Parent.Width - 640) / 2
            Y: =(Parent.Height - 570) / 2
            Width: =640
            Height: =486
          Children:
            - mdTkOutTitle:
                Control: Label@2.5.1
                Properties:
                  Text: =If( gTkOutSid <> 0, "Edit output", "Add an output" )
                  Font: =gTheme.Font
                  FontWeight: =FontWeight.Semibold
