# scrTaskEdit — one task, on containers. Output is an optional section behind a
# toggle; switching it OFF on an edit CLEARS every output field on save, or the
# section would hide values that are still stored.
#
# DERIVED, WITH NO CONTROL ON THIS SCREEN: the project (from the task on Edit, from
# gSelProject on New), the completion date (Complete stamps it, anything else clears
# it), and health — see rollups.task_health in schema.yaml.
#
# EVERY AUTO-LAYOUT CHILD SETS FillPortions EXPLICITLY. It defaults to 1 at every
# nesting level, and one unset child silently steals space from its siblings.
# The action bar and the picker panel stay absolute: the bar is a fixed footer, and
# the panel has to float ABOVE the form rather than sit in its flow.
Screens:
  scrTaskEdit:
    Properties:
      Fill: =gTheme.Color.Bg
      OnVisible: |
        =Set( gSaving, false );   // see btnTkSave
        // WHICH task this visit is for. The resume guard matches on identity, not on a bare
        // boolean: a boolean latch leaks — the picker sets it before navigating away to create
        // a client or product, and nothing clears it unless the user comes back. Leaving by any
        // other route would make the next task skip every seed and Reset in this guard's else
        // arm, showing the PREVIOUS task's data. A stale key simply cannot match.
        Set( gTkKey, If( gEditMode = "Edit", "E" & gEditTask.ID, "N" & gSelProject.ID ) );
        If( gTkResumeKey = gTkKey && Len(gTkKey) > 1,
         Set( gTkResumeKey, "" ),
         Set( gTkProject,
              If( gEditMode = "Edit",
                  { Id: gEditTask.task_project_id.Id,
                    // NOT redundant. The lookup column's live display field is the target's ID, so
                    // `.Value` is a NUMBER — see schema.yaml. Do not "optimise" this away.
                    Value: LookUp(taskmaster_projects, ID = gEditTask.task_project_id.Id, project_name) },
                  gSelProject.ID > 0,
                  { Id: gSelProject.ID, Value: gSelProject.project_name },
                  { Id: 0, Value: "" } ) );
        Set( gTkLead,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditTask.task_lead.DisplayName, ""),
                    Mail:        Coalesce(gEditTask.task_lead.Email, "") },
                  { DisplayName: Coalesce(User().FullName, ""), Mail: Coalesce(User().Email, "") } ) );
        Set( gTkSupporter,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditTask.task_supporter.DisplayName, ""),
                    Mail:        Coalesce(gEditTask.task_supporter.Email, "") },
                  { DisplayName: "", Mail: "" } ) );
        Set( gTkClient,
              If( gEditMode = "Edit" && gEditTask.task_client_name.Id > 0,
                  { Id: gEditTask.task_client_name.Id, Value: gEditTask.task_client_name.Value },
                  { Id: 0, Value: "" } ) );
        // PRODUCTS ARE MULTI. colTkProducts is the staging set the form edits;
        // taskmaster_taskproduct is only touched on save.
        // INSIDE THE RESUME GUARD, like every other seed here — coming back from
        // "create a new product" must not wipe what the user already staged.
        // Shaped to {Id, Uid} on read: taskproduct_product_uid is the denormalised copy,
        // which avoids a LookUp per link just to show a name.
        Clear( colTkProducts );
        If( gEditMode = "Edit",
            Collect( colTkProducts,
                     ForAll( Filter( LiveTaskProducts,
                                     taskproduct_task_id.Id = gEditTask.ID ) As lk,
                             { Id:  lk.taskproduct_product_id.Id,
                               Uid: lk.taskproduct_product_uid } ) ) );
        // THE SET AS LOADED — the baseline the save compares against to tell a real product
        // change from a save that never touched them. Copied from colTkProducts, NOT read from
        // the junction a second time. Inside the resume guard with every other seed: coming back
        // from "create a new product" must not re-baseline what the user has already staged.
        ClearCollect( colTkProductsLoaded, colTkProducts );
        // cmpSelection needs {Id, Label} and Choices() returns only Value, so the Id is
        // synthesised POSITIONALLY. The Ids mean nothing beyond "which row" — never
        // hard-code one, look it up by Label, which is what each DefaultId does.
        // Both columns are REQUIRED with a default, so neither gets a "(none)" row.
        // ONCE PER SESSION, NOT ONCE PER VISIT. A Choice vocabulary changes on the order of
        // weeks, so an EMPTY list is the only reason to pay for it again — a new value is
        // picked up on the next app start. IsEmpty, never IsBlank: these are tables.
        Concurrent(
            If( IsEmpty(colTkStageOpts),
                ClearCollect( colTkStageOpts,
                      With( { ch: Choices([@taskmaster_tasks].task_stage) },
                            ForAll( Sequence( CountRows(ch) ) As n,
                                    { Id: n.Value, Label: Index(ch, n.Value).Value } ) ) ) ),
            If( IsEmpty(colTkPriorityOpts),
                ClearCollect( colTkPriorityOpts,
                      With( { ch: Choices([@taskmaster_tasks].task_priority) },
                            ForAll( Sequence( CountRows(ch) ) As n,
                                    { Id: n.Value, Label: Index(ch, n.Value).Value } ) ) ) ) );
        Set( gTkStage,    If( gEditMode = "Edit", Coalesce(gEditTask.task_stage.Value, "Not Started"), "Not Started" ) );
        Set( gTkPriority, If( gEditMode = "Edit", Coalesce(gEditTask.task_priority.Value, "Moderate"), "Moderate" ) );
        Set( gTkLanguage, If( gEditMode = "Edit", Coalesce(gEditTask.task_output_language.Value, "(none)"), "(none)" ) );
        Set( gTkFormat,   If( gEditMode = "Edit", Coalesce(gEditTask.task_output_format.Value, "(none)"), "(none)" ) );
        Set( gTkBranding, If( gEditMode = "Edit", Coalesce(gEditTask.task_output_branding.Value, "(none)"), "(none)" ) );
        Set( gTkAudience, If( gEditMode = "Edit", Coalesce(gEditTask.task_output_audience.Value, "(none)"), "(none)" ) );
        Set( gTkClientStage, If( gEditMode = "Edit", Coalesce(gEditTask.task_client_stage.Value, "(none)"), "(none)" ) );
        Set( gTkPicker, "" );
        Reset( txtTkName ); Reset( txtTkDesc );
        Reset( cmpTkPick );
        Set( gTkQuery, "" );
        Reset( txtTkApprovalId );
        // THE OPTION LISTS LOAD HERE, after the modal and query state is cleared and before
        // the combo Resets that read them: nothing that decides whether the screen is USABLE
        // may sit below this block. Concurrent's arms fail INDEPENDENTLY — a Choices() that
        // errors leaves its own list empty and the rest still load, where the serial chain
        // this replaces stopped dead at the first failure.
        // EVERY OPTION LIST COMES FROM ITS COLUMN, not a literal copy — a literal drifts
        // silently both ways when someone edits the Choice in SharePoint. "(none)" is the
        // FIRST ITEM so it sorts to the top; it is an app concept, and the save maps it back
        // to Blank(). ClearCollect takes several items, which is what keeps each list to ONE
        // statement — and a Concurrent arm is one formula.
        // THE Opts SUFFIX IS LOAD-BEARING. This screen names its column containers col* too
        // (colTkFormat, colTkLang, colTkBrand are CONTROLS), so a collection named after the
        // container it sits in resolves to the control instead, and every reader of it fails
        // as an incompatible type one hop from the cause.
        // <= 1, NOT IsEmpty, AND THE DIFFERENCE MATTERS. These five carry a "(none)" row this
        // screen adds itself, so a Choices() that returned nothing still leaves the list
        // non-empty — IsEmpty would latch that one-row list for the whole session and every
        // save would write Blank() from a dropdown that offered nothing else. Counting the
        // sentinel out means "the fetch delivered no members", which is worth retrying.
        Concurrent(
            If( CountRows(colTkFmtOpts) <= 1,
                ClearCollect( colTkFmtOpts, { Value: "(none)" },
                         ForAll( Choices([@taskmaster_tasks].task_output_format) As c,
                                 { Value: c.Value } ) ) ),
            If( CountRows(colTkLangOpts) <= 1,
                ClearCollect( colTkLangOpts, { Value: "(none)" },
                         ForAll( Choices([@taskmaster_tasks].task_output_language) As c,
                                 { Value: c.Value } ) ) ),
            If( CountRows(colTkBrandOpts) <= 1,
                ClearCollect( colTkBrandOpts, { Value: "(none)" },
                         ForAll( Choices([@taskmaster_tasks].task_output_branding) As c,
                                 { Value: c.Value } ) ) ),
            If( CountRows(colTkAudOpts) <= 1,
                ClearCollect( colTkAudOpts, { Value: "(none)" },
                         ForAll( Choices([@taskmaster_tasks].task_output_audience) As c,
                                 { Value: c.Value } ) ) ),
            If( CountRows(colTkCliStageOpts) <= 1,
                ClearCollect( colTkCliStageOpts, { Value: "(none)" },
                         ForAll( Choices([@taskmaster_tasks].task_client_stage) As c,
                                 { Value: c.Value } ) ) ) );
        // cmpSelection re-reads its DefaultId ONLY on Reset — without these the previous
        // task's stage/priority survive and the strip DISAGREES WITH THE SAVE.
        Reset( selTkStage ); Reset( selTkPriority );
        // A combo box re-reads DefaultSelectedItems ONLY on Reset.
        Reset( cboTkLanguage ); Reset( cboTkFormat ); Reset( cboTkBranding ); Reset( cboTkAudience ); Reset( cboTkClientStage );
        Reset( tglTkOutput ); Reset( tglTkClient ); Reset( tglTkApprovalReq );
        // A date picker re-reads DefaultDate ONLY on Reset. Without these the seeds never
        // take on a second visit and the Patch writes Blank() over the stored dates.
        Reset( dtpTkStart ); Reset( dtpTkTarget )
        )
    Children:
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Primary
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =gTheme.Space.HeaderH
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: |
              =If(gEditMode = "Edit", "Edit task", "New task") &
               If( gTkProject.Id > 0, "   ·   " & gTkProject.Value, "" )
            Color: =gTheme.Color.OnPrimary
            Font: =gTheme.Font
            Size: =gTheme.Size.H2
            FontWeight: =FontWeight.Semibold
            VerticalAlign: =VerticalAlign.Middle
            X: =gTheme.Space.Gutter
            Y: =0
            Width: =Parent.Width - 120
            Height: =gTheme.Space.HeaderH
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =gTheme.Color.OnPrimary
            HoverColor: =gTheme.Color.OnPrimary
            HoverFill: =RGBA(255, 255, 255, 0.15)
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            Tooltip: ="Close without saving"
            X: =Parent.Width - 24 - gTheme.Space.Gutter
            Y: =(gTheme.Space.HeaderH - 24) / 2
            Width: =24
            Height: =24
            OnSelect: =Back()
      - bodyRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Start
            LayoutGap: =gTheme.Space.Gap
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =gTheme.Space.Gutter
            PaddingBottom: =gTheme.Space.Gutter
            PaddingLeft: =gTheme.Space.Gutter
            PaddingRight: =gTheme.Space.Gutter
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 88
          Children:
            - secTkDetails:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =10
                  PaddingTop: =14
                  PaddingBottom: =14
                  PaddingLeft: =20
                  PaddingRight: =20
                  Fill: =gTheme.Color.Surface
                  BorderColor: =gTheme.Color.Border
                  BorderThickness: =1
                  FillPortions: =0
                  LayoutMinHeight: =268
                  Width: =Parent.Width - 48
                  Height: =268
                Children:
                  - lblsecTkDetailsHead:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Task"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.H3
                        FontWeight: =FontWeight.Semibold
                        Color: =gTheme.Color.Primary
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =0
                        LayoutMinHeight: =26
                        Width: =Parent.Width - 40
                        Height: =26
                  - rowTkName:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =20
                        FillPortions: =0
                        LayoutMinHeight: =62
                        Width: =Parent.Width - 40
                        Height: =62
                      Children:
                        - colTkName:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              FillPortions: =1
                              LayoutMinWidth: =320
                              Height: =62
                            Children:
                              - lblTkNameCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="Task name  *"
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - txtTkName:
                                  Control: ModernTextInput@1.1.1
                                  Properties:
                                    Default: =If(gEditMode = "Edit", gEditTask.task_name, "")
                                    Placeholder: ="What has to be done?"
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    FillPortions: =0
                                    LayoutMinHeight: =36
                                    Width: =Parent.Width
                                    Height: =36
                  - rowTkDesc:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =20
                        FillPortions: =0
                        LayoutMinHeight: =148
                        Width: =Parent.Width - 40
                        Height: =148
                      Children:
                        - colTkDesc:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              FillPortions: =1
                              LayoutMinWidth: =320
                              Height: =148
                            Children:
                              - lblTkDescCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="Description"
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - txtTkDesc:
                                  Control: ModernTextInput@1.1.1
                                  Properties:
                                    Default: =If(gEditMode = "Edit", gEditTask.task_description, "")
                                    Placeholder: ="Instructions, context, acceptance criteria…"
                                    Type: =TextInputType.Multiline
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    FillPortions: =0
                                    LayoutMinHeight: =120
                                    Width: =Parent.Width
                                    Height: =120
            - secTkState:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =10
                  PaddingTop: =14
                  PaddingBottom: =14
                  PaddingLeft: =20
                  PaddingRight: =20
                  Fill: =gTheme.Color.Surface
                  BorderColor: =gTheme.Color.Border
                  BorderThickness: =1
                  FillPortions: =0
                  LayoutMinHeight: =198
                  Width: =Parent.Width - 48
                  Height: =198
                Children:
                  - lblsecTkStateHead:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Status"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.H3
                        FontWeight: =FontWeight.Semibold
                        Color: =gTheme.Color.Primary
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =0
                        LayoutMinHeight: =26
                        Width: =Parent.Width - 40
                        Height: =26
                  # STAGE ON ITS OWN ROW, priority on the next. A five-option strip in a
                  # third-width cell gives each label ~60px, and "Not Started" does not fit.
                  # A vertical stack rather than a GridLayout — a grid span did not render
                  # full width when scrIssueEdit tried it.
                  - stackTkState:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =10
                        FillPortions: =0
                        LayoutMinHeight: =134
                        Width: =Parent.Width - 40
                        Height: =134
                      Children:
                        - colTkStage:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              FillPortions: =0
                              LayoutMinHeight: =62
                              Width: =Parent.Width
                              Height: =62
                            Children:
                              - lblTkStageCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="Stage  *"
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - selTkStage:
                                  Control: CanvasComponent
                                  ComponentName: cmpSelection
                                  Properties:
                                    Width: =Parent.Width
                                    Height: =40
                                    Items: =colTkStageOpts
                                    DefaultId: =Coalesce( LookUp(colTkStageOpts, Label = gTkStage, Id), 1 )
                                    OnChange: =Set(gTkStage, selTkStage.Selected.Label)
                        - rowTkStatePair:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =16
                              FillPortions: =0
                              LayoutMinHeight: =62
                              Width: =Parent.Width
                              Height: =62
                            Children:
                              - colTkPriority:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutGap: =4
                                    FillPortions: =1
                                    LayoutMinWidth: =200
                                    Height: =62
                                  Children:
                                    - lblTkPriorityCap:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: ="Priority  *"
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Small
                                          Color: =gTheme.Color.TextMuted
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =0
                                          LayoutMinHeight: =18
                                          Width: =Parent.Width
                                          Height: =18
                                    - selTkPriority:
                                        Control: CanvasComponent
                                        ComponentName: cmpSelection
                                        Properties:
                                          Width: =Parent.Width
                                          Height: =40
                                          Items: =colTkPriorityOpts
                                          DefaultId: =Coalesce( LookUp(colTkPriorityOpts, Label = gTkPriority, Id), 1 )
                                          OnChange: =Set(gTkPriority, selTkPriority.Selected.Label)
            - secTkPeopleDates:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =10
                  PaddingTop: =14
                  PaddingBottom: =14
                  PaddingLeft: =20
                  PaddingRight: =20
                  Fill: =gTheme.Color.Surface
                  BorderColor: =gTheme.Color.Border
                  BorderThickness: =1
                  FillPortions: =0
                  LayoutMinHeight: =224
                  Width: =Parent.Width - 48
                  Height: =224
                Children:
                  - lblsecTkPeopleDatesHead:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="People and dates"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.H3
                        FontWeight: =FontWeight.Semibold
                        Color: =gTheme.Color.Primary
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =0
                        LayoutMinHeight: =26
                        Width: =Parent.Width - 40
                        Height: =26
                  - gridTkPeopleDates:
                      Control: GroupContainer@1.5.0
                      Variant: GridLayout
                      Properties:
                        LayoutGridColumns: =2
                        LayoutGridRows: =2
                        FillPortions: =0
                        LayoutMinHeight: =160
                        Width: =Parent.Width - 40
                        Height: =160
                      Children:
                        - colTkLead:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              LayoutGridColumnStart: =1
                              LayoutGridColumnEnd: =1
                              LayoutGridRowStart: =1
                              LayoutGridRowEnd: =1
                              Height: =62
                            Children:
                              - fldLead:
                                  Control: CanvasComponent
                                  ComponentName: cmpLookupField
                                  Properties:
                                    Caption: ="Lead  *"
                                    PickLabel: ="＋  Choose a lead"
                                    HasValue: =Len(gTkLead.Mail) > 0
                                    Display: =gTkLead.DisplayName
                                    Width: =Parent.Width
                                    Height: =62
                                    OnPick: |
                                      =Set( gTkPicker, "Lead" );
                                       Reset( cmpTkPick );
                                       Set( gTkQuery, "" )
                                    OnClear: |
                                      =Set( gTkLead, { DisplayName: "", Mail: "" } )
                        - colTkStart:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              LayoutGridColumnStart: =2
                              LayoutGridColumnEnd: =2
                              LayoutGridRowStart: =1
                              LayoutGridRowEnd: =1
                              Height: =62
                            Children:
                              - lblTkStartCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="Start date"
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - dtpTkStart:
                                  Control: ModernDatePicker@1.0.1
                                  Properties:
                                    DefaultDate: |
                                      =If(gEditMode = "Edit", gEditTask.task_date_start, Blank())
                                    Placeholder: ="Pick a date"
                                    FillPortions: =0
                                    LayoutMinHeight: =36
                                    Width: =Parent.Width
                                    Height: =36
                        - colTkSupp:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              LayoutGridColumnStart: =1
                              LayoutGridColumnEnd: =1
                              LayoutGridRowStart: =2
                              LayoutGridRowEnd: =2
                              Height: =62
                            Children:
                              - fldSupporter:
                                  Control: CanvasComponent
                                  ComponentName: cmpLookupField
                                  Properties:
                                    Caption: ="Supporter"
                                    PickLabel: ="＋  Choose a supporter"
                                    HasValue: =Len(gTkSupporter.Mail) > 0
                                    Display: =gTkSupporter.DisplayName
                                    Width: =Parent.Width
                                    Height: =62
                                    OnPick: |
                                      =Set( gTkPicker, "Supporter" );
                                       Reset( cmpTkPick );
                                       Set( gTkQuery, "" )
                                    OnClear: |
                                      =Set( gTkSupporter, { DisplayName: "", Mail: "" } )
                        - colTkTarget:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              LayoutGridColumnStart: =2
                              LayoutGridColumnEnd: =2
                              LayoutGridRowStart: =2
                              LayoutGridRowEnd: =2
                              Height: =62
                            Children:
                              - lblTkTargetCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |
                                      ="Due date" &
                                       If( !IsBlank(dtpTkTarget.SelectedDate)
                                       && dtpTkTarget.SelectedDate < Today()
                                       && gTkStage <> "Completed",
                                           "   ·   OVERDUE", "" )
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: |
                                      =If( !IsBlank(dtpTkTarget.SelectedDate)
                                      && dtpTkTarget.SelectedDate < Today()
                                      && gTkStage <> "Completed",
                                           gTheme.Color.Danger, gTheme.Color.TextMuted )
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - dtpTkTarget:
                                  Control: ModernDatePicker@1.0.1
                                  Properties:
                                    DefaultDate: |
