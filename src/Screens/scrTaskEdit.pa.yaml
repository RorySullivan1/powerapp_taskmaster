                        Font: =gTheme.Font
                        Size: =gTheme.Size.H3
                        FontWeight: =FontWeight.Semibold
                        Color: =gTheme.Color.Primary
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =0
                        LayoutMinHeight: =26
                        Width: =Parent.Width - 40
                        Height: =26
                  - rowTkName:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =20
                        FillPortions: =0
                        LayoutMinHeight: =62
                        Width: =Parent.Width - 40
                        Height: =62
                      Children:
                        - colTkName:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              FillPortions: =1
                              LayoutMinWidth: =320
                              Height: =62
                            Children:
                              - lblTkNameCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="Task name  *"
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - txtTkName:
                                  Control: ModernTextInput@1.1.1
                                  Properties:
                                    Default: =If(gEditMode = "Edit", gEditTask.task_name, "")
                                    Placeholder: ="What has to be done?"
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    FillPortions: =0
                                    LayoutMinHeight: =36
                                    Width: =Parent.Width
                                    Height: =36
                  - rowTkDesc:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =20
                        FillPortions: =0
                        LayoutMinHeight: =148
                        Width: =Parent.Width - 40
                        Height: =148
                      Children:
                        - colTkDesc:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              FillPortions: =1
                              LayoutMinWidth: =320
                              Height: =148
                            Children:
                              - lblTkDescCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="Description"
