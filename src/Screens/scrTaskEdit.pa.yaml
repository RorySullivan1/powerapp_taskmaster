                                    Items: =["Not Started", "Planning", "Drafting", "Finalizing", "Complete"]
                                    ItemDisplayText: =ThisItem.Value
                                    DefaultSelectedItems: =Filter( [gTkStage], !IsBlank(Value) )
                                    SelectMultiple: =false
                                    IsSearchable: =false
                                    InputTextPlaceholder: ="Select…"
                                    Color: |
