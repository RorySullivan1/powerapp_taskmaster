# =============================================================================
# scrTaskEdit  —  create / edit a task, full field set.
#
# Entered with:  Set(gEditMode, "New" | "Edit");  Set(gEditTask, <record>)
# If gSelProject is set, a NEW task is pre-attached to that project.
#
# RELATIONSHIP TO scrTask: scrTask is the QUICK edit reached from a project's
# task list — name, stage, health, priority, and the C3 rollup. This screen is
# the full editor. BOTH can change task_stage, so BOTH must rewrite the parent
# project's weighted completion; the block at the end of btnTaskSave.OnSelect is
# the same one documented in App.Formulas and implemented in scrTask. If it is
# ever changed in one place it must be changed in the other.
#
# TWO TABS, because a canvas screen does not scroll and the task list carries
# twenty columns: "Task" (identity, ownership, lifecycle, dates, category) and
# "Output" (the approval / language / format / branding / client block).
#
# task_output_asset is DELIBERATELY ABSENT: asset_library has no schema
# (schema.yaml -> asset_library, columns: []), so any binding to it is blocked.
#
# Follows the shared edit-screen pattern — see scrIssueEdit's header and
# _EDIT-NOTES.md. CONNECTION PREREQUISITE: Office 365 Users. See HANDOFF.md.
# Every column token resolves to schema/schema.yaml (golden source).
# =============================================================================
Screens:
  scrTaskEdit:
    Properties:
      Fill: =Theme.Color.Bg
      OnVisible: |
        =Set( gTaskEditTab, 1 );
        Set( gTkProject,
              If( gEditMode = "Edit",
                  { Id: gEditTask.task_project_id.Id, Value: gEditTask.task_project_id.Value },
                  gSelProject.ID > 0,
                  { Id: gSelProject.ID, Value: gSelProject.project_name },
                  { Id: 0, Value: "" } ) );
        Set( gTkLead,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditTask.task_lead.DisplayName, ""),
                    Mail:        Coalesce(gEditTask.task_lead.Email, "") },
                  { DisplayName: Coalesce(User().FullName, ""), Mail: Coalesce(User().Email, "") } ) );
        Set( gTkSupporter,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditTask.task_supporter.DisplayName, ""),
                    Mail:        Coalesce(gEditTask.task_supporter.Email, "") },
                  { DisplayName: "", Mail: "" } ) );
        Set( gTkApproval,
              If( gEditMode = "Edit" && gEditTask.task_output_approval.Id > 0,
                  { Id: gEditTask.task_output_approval.Id, Value: gEditTask.task_output_approval.Value },
                  { Id: 0, Value: "" } ) );
        Set( gTkClient,
              If( gEditMode = "Edit" && gEditTask.task_client_name.Id > 0,
                  { Id: gEditTask.task_client_name.Id, Value: gEditTask.task_client_name.Value },
                  { Id: 0, Value: "" } ) );
        Set( gTkProduct,
              If( gEditMode = "Edit" && gEditTask.task_product_id.Id > 0,
                  { Id: gEditTask.task_product_id.Id, Value: gEditTask.task_product_id.Value },
                  { Id: 0, Value: "" } ) );
        Set( gTkStage,    If( gEditMode = "Edit", Coalesce(gEditTask.task_stage.Value, "Not Started"), "Not Started" ) );
        Set( gTkStatus,   If( gEditMode = "Edit", Coalesce(gEditTask.task_status.Value, "Green"), "Green" ) );
        Set( gTkPriority, If( gEditMode = "Edit", Coalesce(gEditTask.task_priority.Value, "Moderate"), "Moderate" ) );
        Set( gTkLanguage, If( gEditMode = "Edit", Coalesce(gEditTask.task_output_language.Value, "(none)"), "(none)" ) );
        Set( gTkFormat,   If( gEditMode = "Edit", Coalesce(gEditTask.task_output_format.Value, "(none)"), "(none)" ) );
        Set( gTkBranding, If( gEditMode = "Edit", Coalesce(gEditTask.task_output_branding.Value, "(none)"), "(none)" ) );
        Set( gTkClientStage, If( gEditMode = "Edit", Coalesce(gEditTask.task_client_stage.Value, "(none)"), "(none)" ) );
        // Managed metadata (C10). What the connector returns for an EXISTING value
        // is not in the picker's path form, so on EDIT these start empty and the
        // column is left untouched unless the user actively re-picks. The current
        // label is shown read-only beside the picker so nothing looks lost.
        //
        // No term collection is built: the picker reads the term store directly
        // through Choices() on its instance.
        // Managed metadata: hold the connector's OWN Choices() record, seeded from
        // the task under edit. Blank on New, because the LookUp finds nothing.
        Set( gTkCat, LookUp( Choices([@taskmaster_tasks].task_category),
                             Label = Coalesce(gEditTask.task_category.Value, "") ) );
        Reset( txtTkName ); Reset( txtTkDesc );
          
        Reset( txtTkProjectSearch ); Reset( txtTkLeadSearch ); Reset( txtTkSupporterSearch );
        Reset( txtTkApprovalSearch ); Reset( txtTkClientSearch ); Reset( txtTkProductSearch );
        Reset( cboTkCategory );
        // A date picker re-reads DefaultDate ONLY on Reset. Without these three the
        // seeds above never take on a second visit, and the Patch writes Blank()
        // over task_date_start / _target / _completion.
        Reset( dtpTkStart ); Reset( dtpTkTarget ); Reset( dtpTkDone )
    Children:
      # ---- Header ----------------------------------------------------------
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Primary
            Height: =Theme.Space.HeaderH
            Width: =Parent.Width
            X: =0
            Y: =0
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: |
              =If(gEditMode = "Edit", "Edit task", "New task")
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            FontWeight: =FontWeight.Semibold
            Size: =Theme.Size.H2
            Height: =Theme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Theme.Space.Gutter
            Y: =0
            Width: =400
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =Theme.Color.OnPrimary
            Height: =24
            Width: =24
            X: =Parent.Width - 24 - Theme.Space.Gutter
            Y: =(Theme.Space.HeaderH - 24) / 2
            OnSelect: =Back()
      # TABS ARE PLAIN BUTTONS, NOT A cmpSelection STRIP.
      # The strip set the tab from `<strip>.Selected.Id` inside its OnChange, which the
      # component raises straight after `Select(Parent)` — so the consumer reads the
      # gallery's selection in the same behaviour pass that sets it. Tab switching did
      # not work in Studio. A button carries its own value in its own OnSelect, so
      # there is nothing to propagate and nothing to race.
      - tabTaskEdit:
          Control: ModernTabList@1.0.0
          Properties:
            Items: =["Task", "Output"]
            Default: ="Task"
            Appearance: =TabListAppearance.Underline
            Alignment: =TabListAlignment.Start
            Size: =14
            FontWeight: =FontWeight.Semibold
            AccessibleLabel: ="scrTaskEdit sections"
            X: =24
            Y: =84
            Width: =320
            Height: =48
            OnChange: |
              =Set(gTaskEditTab, Switch(tabTaskEdit.Selected.Value, "Task", 1, 2))
      # ================= TAB 1 — TASK ======================================
      - lblTkNameCap:
          Control: Label@2.5.1
          Properties:
            Visible: =gTaskEditTab = 1
            Text: ="Task name  *"
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Color: =Theme.Color.TextMuted
            X: =24
            Y: =140
            Width: =520
            Height: =18
      - txtTkName:
          Control: ModernTextInput@1.0.0
