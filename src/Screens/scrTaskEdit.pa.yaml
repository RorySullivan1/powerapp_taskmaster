                    =Trim(
                    If( Len(Trim(txtTkName.Text)) = 0, "a task name   ", "" ) &
                    If( Len(gTkLead.Mail) = 0,         "a lead   ", "" ) &
                    If( gTkProject.Id = 0,             "a parent project   ", "" ) &
                    If( Len(gTkStage) = 0,             "a stage   ", "" ) &
                    If( Len(gTkPriority) = 0,          "a priority   ", "" ) &
                    // A task that produces output must say who for. A task FLAGGED as needing
                    // approval must also carry the external id, but only once it is being
                    // COMPLETED — the portal issues that id late, so requiring it earlier would
                    // block ordinary drafting.
                    If( tglTkOutput.Value && gTkAudience = "(none)",
                        "an output audience   ", "" ) &
                    If( tglTkOutput.Value && gTkStage = "Completed"
                        && tglTkApprovalReq.Value
                        && Len(Trim(txtTkApprovalId.Text)) = 0,
                        "an approval ID before completing   ", "" ) )
