# scrTaskEdit — REWORKED 2026-08-07.  Tabs removed, layout moved to containers.
#
# WHAT CHANGED, and why each one is not just cosmetic:
#
#  - NO TAB LIST.  Output was a second tab; it is now an optional SECTION behind a
#    toggle.  On an existing task the toggle opens already on when the task has an
#    output format, so the record itself says whether the section is relevant.
#    Switching it OFF on an edit CLEARS every output field on save — otherwise the
#    section would hide values that are still stored.
#
#  - PROJECT IS GONE FROM THE FORM.  A task is always created against a project, so
#    `gTkProject` is derived in OnVisible (from the task on Edit, from gSelProject on
#    New) and never asked for.  It is still WRITTEN, and it still drives the C3
#    rollup at the end of Save.
#
#  - COMPLETION DATE IS DERIVED, NOT ENTERED.  Picking Complete stamps it; picking
#    anything other than Complete or Archived clears it.  Archived KEEPS whatever was
#    there, because archiving a finished task must not erase when it finished.  It is
#    shown read-only so the value is visible without being editable.
#
#  - STAGE / HEALTH / PRIORITY are combo boxes whose text colour follows the value.
#    `Color` is the current modern combo box's text colour (it was `FontColor` before
#    the revision).
#
#  - DUE DATE flags itself.  A date picker has no grounded colour property, so the
#    CAPTION carries the warning — a Label's Color is beyond doubt.
#
# LAYOUT IS CONTAINERS.  Every auto-layout child sets FillPortions EXPLICITLY; it
# defaults to 1 at every nesting level and one unset child silently steals space from
# its siblings.  The action bar and the picker panel stay absolute: the bar is a fixed
# footer on the screen, and the panel has to float ABOVE the form rather than sit in
# its flow.
Screens:
  scrTaskEdit:
    Properties:
      Fill: =Theme.Color.Bg
      OnVisible: |
        =Set( gTkProject,
              If( gEditMode = "Edit",
                  { Id: gEditTask.task_project_id.Id,
                    Value: LookUp(taskmaster_projects, ID = gEditTask.task_project_id.Id, project_name) },
                  gSelProject.ID > 0,
                  { Id: gSelProject.ID, Value: gSelProject.project_name },
                  { Id: 0, Value: "" } ) );
        Set( gTkLead,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditTask.task_lead.DisplayName, ""),
                    Mail:        Coalesce(gEditTask.task_lead.Email, "") },
                  { DisplayName: Coalesce(User().FullName, ""), Mail: Coalesce(User().Email, "") } ) );
        Set( gTkSupporter,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditTask.task_supporter.DisplayName, ""),
                    Mail:        Coalesce(gEditTask.task_supporter.Email, "") },
                  { DisplayName: "", Mail: "" } ) );
        // task_output_approval_id is now a plain text pointer to the external approval
        // portal — no lookup, no picker global. It is seeded via txtTkApprovalId.Default.
        Set( gTkClient,
              If( gEditMode = "Edit" && gEditTask.task_client_name.Id > 0,
                  { Id: gEditTask.task_client_name.Id, Value: gEditTask.task_client_name.Value },
                  { Id: 0, Value: "" } ) );
        Set( gTkProduct,
              If( gEditMode = "Edit" && gEditTask.task_product_id.Id > 0,
                  { Id: gEditTask.task_product_id.Id, Value: gEditTask.task_product_id.Value },
                  { Id: 0, Value: "" } ) );
        Set( gTkStage,    If( gEditMode = "Edit", Coalesce(gEditTask.task_stage.Value, "Not Started"), "Not Started" ) );
        Set( gTkStatus,   If( gEditMode = "Edit", Coalesce(gEditTask.task_status.Value, "Green"), "Green" ) );
        Set( gTkPriority, If( gEditMode = "Edit", Coalesce(gEditTask.task_priority.Value, "Moderate"), "Moderate" ) );
        Set( gTkLanguage, If( gEditMode = "Edit", Coalesce(gEditTask.task_output_language.Value, "(none)"), "(none)" ) );
        Set( gTkFormat,   If( gEditMode = "Edit", Coalesce(gEditTask.task_output_format.Value, "(none)"), "(none)" ) );
        Set( gTkBranding, If( gEditMode = "Edit", Coalesce(gEditTask.task_output_branding.Value, "(none)"), "(none)" ) );
        Set( gTkClientStage, If( gEditMode = "Edit", Coalesce(gEditTask.task_client_stage.Value, "(none)"), "(none)" ) );
        Set( gTkPicker, "" );
        Reset( txtTkName ); Reset( txtTkDesc );
        // Reset(<instance>) fires the component's OnReset, which clears its query,
        // its highlight and its search box. The lead and supporter pickers are the
        // SAME instance, reused across every record this screen opens, so this is
        // what stops task B's dialog opening on task A's highlighted person.
        // The query global is the screen's half of that same state, so it clears here too.
        Reset( cmpTkPeople );
        Set( gTkPeopleQuery, "" );
        Reset( txtTkApprovalId );
        // A combo box re-reads DefaultSelectedItems ONLY on Reset, so without these
        // the previous task's stage/health/priority survive into the next one.
        Reset( cboTkStage ); Reset( cboTkStatus ); Reset( cboTkPriority );
        Reset( cboTkLanguage ); Reset( cboTkFormat ); Reset( cboTkBranding ); Reset( cboTkClientStage );
        Reset( tglTkOutput ); Reset( tglTkClient );
        // A date picker re-reads DefaultDate ONLY on Reset. Without these the seeds
        // never take on a second visit and the Patch writes Blank() over the stored
        // dates. The completion date is derived on save and has no picker at all.
        Reset( dtpTkStart ); Reset( dtpTkTarget )
    Children:
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Primary
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Theme.Space.HeaderH
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: |
              =If(gEditMode = "Edit", "Edit task", "New task") &
               If( gTkProject.Id > 0, "   ·   " & gTkProject.Value, "" )
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            Size: =Theme.Size.H2
            FontWeight: =FontWeight.Semibold
            VerticalAlign: =VerticalAlign.Middle
            X: =Theme.Space.Gutter
            Y: =0
            Width: =Parent.Width - 120
            Height: =Theme.Space.HeaderH
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =Theme.Color.OnPrimary
            Tooltip: ="Close without saving"
            X: =Parent.Width - 24 - Theme.Space.Gutter
            Y: =(Theme.Space.HeaderH - 24) / 2
            Width: =24
            Height: =24
            OnSelect: =Back()
      - bodyRoot:
