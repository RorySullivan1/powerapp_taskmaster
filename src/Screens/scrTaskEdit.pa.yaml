                                    Font: =Theme.Font
                                    Size: =Theme.Size.Small
                                    Color: =Theme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - cboTkStage:
                                  Control: ModernCombobox@1.1.1
                                  Properties:
                                    # FIVE stages as of 2026-08-12. "Under Review" is gone —
                                    # review is signalled by raising an ISSUE — and "Archived"
