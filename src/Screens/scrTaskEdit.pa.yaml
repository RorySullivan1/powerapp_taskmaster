            Format: =DatePickerFormat.LongAbbreviated
            StartOfWeek: =StartOfWeek.Monday
            IsEditable: =true
            Height: =32
            X: =920
            Y: =302
            Width: =160
            Visible: =gTaskEditTab = 1
      - lblTkDoneCap:
          Control: Label@2.5.1
          Properties:
            Visible: =gTaskEditTab = 1
            Text: ="Completion date"
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Color: =Theme.Color.TextMuted
            X: =580
            Y: =348
            Width: =240
            Height: =18
      - dtpTkDone:
          Control: ModernDatePicker@1.0.0
          Properties:
            DefaultDate: =If(gEditMode = "Edit", gEditTask.task_date_completion, Blank())
            Placeholder: ="Completion date"
            Format: =DatePickerFormat.LongAbbreviated
            StartOfWeek: =StartOfWeek.Monday
            IsEditable: =true
            Height: =32
            X: =580
            Y: =368
            Width: =160
            Visible: =gTaskEditTab = 1
      # ---- Category (Managed Metadata, C10) --------------------------------
      - lblTkCatCurrent:
          Control: Label@2.5.1
          Properties:
            Visible: =gTaskEditTab = 1
            Text: |
              =If( !IsBlank(gTkCat), "✓ " & gTkCat.Label,
                   gEditMode = "Edit",
                   "Currently: " & Coalesce(gEditTask.task_category.Value, "not set")
                     & "   —   leave it alone to keep it",
                   "Nothing picked yet" )
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Color: =Theme.Color.TextMuted
            X: =580
            Y: =414
            Width: =760
            Height: =18
      - cboTkCategory:
          Control: ModernCombobox@1.0.0
          Properties:
            Visible: =gTaskEditTab = 1
            # Straight at the term store. Choices() returns the term set; Label is the
            # only field read, and Selected is handed back to SharePoint unchanged.
            # Capped at 20 terms by the connector — swap Items for a flow-fed
            # collection of the same shape if this vocabulary outgrows that.
            Items: =Choices([@taskmaster_tasks].task_category)
            ItemDisplayText: =ThisItem.Label
            DefaultSelectedItems: =Filter( Choices([@taskmaster_tasks].task_category),
                                           Label = Coalesce(gEditTask.task_category.Value, "") )
