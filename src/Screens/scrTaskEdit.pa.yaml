                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    FillPortions: =0
                                    LayoutMinHeight: =120
                                    Width: =Parent.Width
                                    Height: =120
            - secTkState:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =10
                  PaddingTop: =14
                  PaddingBottom: =14
                  PaddingLeft: =20
                  PaddingRight: =20
                  Fill: =gTheme.Color.Surface
                  BorderColor: =gTheme.Color.Border
                  BorderThickness: =1
                  FillPortions: =0
                  LayoutMinHeight: =198
                  Width: =Parent.Width - 48
                  Height: =198
                Children:
                  - lblsecTkStateHead:
                      Control: Label@2.5.1
                      Properties:
