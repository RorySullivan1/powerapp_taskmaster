                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =10
                  PaddingTop: =14
                  PaddingBottom: =14
                  PaddingLeft: =20
                  PaddingRight: =20
                  Fill: =gTheme.Color.Surface
                  BorderColor: =gTheme.Color.Border
                  BorderThickness: =1
                  FillPortions: =0
                  LayoutMinHeight: =268
                  Width: =Parent.Width - 48
                  Height: =268
                Children:
