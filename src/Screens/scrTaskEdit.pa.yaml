                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =10
                  PaddingTop: =14
                  PaddingBottom: =14
                  PaddingLeft: =20
                  PaddingRight: =20
                  Fill: =Theme.Color.Surface
                  BorderColor: =Theme.Color.Border
                  BorderThickness: =1
                  FillPortions: =0
                  LayoutMinHeight: =224
                  Width: =Parent.Width - 48
                  Height: =224
                Children:
                  - lblsecTkPeopleDatesHead:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="People and dates"
                        Font: =Theme.Font
                        Size: =Theme.Size.H3
                        FontWeight: =FontWeight.Semibold
                        Color: =Theme.Color.Primary
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =0
                        LayoutMinHeight: =26
                        Width: =Parent.Width - 40
                        Height: =26
                  - gridTkPeopleDates:
                      Control: GroupContainer@1.5.0
                      Variant: GridLayout
                      Properties:
                        LayoutGridColumns: =2
                        LayoutGridRows: =2
                        FillPortions: =0
                        LayoutMinHeight: =160
                        Width: =Parent.Width - 40
                        Height: =160
