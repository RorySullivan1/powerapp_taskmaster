                  # A vertical stack rather than a GridLayout — a grid span did not render
                  # full width when scrIssueEdit tried it.
                  - stackTkState:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =10
                        FillPortions: =0
                        LayoutMinHeight: =134
                        Width: =Parent.Width - 40
                        Height: =134
                      Children:
                        - colTkStage:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              FillPortions: =0
                              LayoutMinHeight: =62
                              Width: =Parent.Width
                              Height: =62
                            Children:
                              - lblTkStageCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="Stage  *"
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - selTkStage:
