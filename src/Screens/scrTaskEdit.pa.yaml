                  Size: =gTheme.Size.Body
                  Text: ="Cancel"
                  FillPortions: =0
                  LayoutMinWidth: =140
                  Width: =140
                  Height: =48
                  # Clears the resume key too: abandoning the form must not leave one armed
                  # for a task the user is walking away from.
                  OnSelect: =Set( gTkResumeKey, "" ); Back()
            - btnTkSave:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =gTheme.Color.Primary
                  Color: =gTheme.Color.OnPrimary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =0
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Text: |
                    =If( gSaving, "Saving…",
                         If(gEditMode = "Edit", "Save task", "Create task") )
                  # DELIBERATELY ALWAYS ENABLED — do not put the DisplayMode gate back.
                  # It used to read `If(Len(lblTkMissing.Text) = 0, Edit, Disabled)`, and a
                  # DISABLED BUTTON CANNOT FIRE OnSelect, so a task missing a required
                  # field produced a click that did NOTHING: no Notify, no Back(), no
                  # error. Reported 2026-08-10 as "I clicked Save task and nothing
                  # happened". The gate could only ever trip on an EDIT — in New mode
                  # gTkLead defaults to User() and gTkProject to gSelProject, so both are
                  # always populated. The requirement is still enforced, one line down in
                  # OnSelect, where it can actually SPEAK.
                  FillPortions: =0
                  LayoutMinWidth: =200
                  Width: =200
                  Height: =48
                  OnSelect: |
                    =If( gSaving,
                    // A SECOND TAP WHILE THE FIRST WRITE IS STILL IN FLIGHT. Do nothing.
                    // A SharePoint Patch takes seconds; the button stayed live throughout, so a
                    // double-tap ran the whole handler twice and Defaults() built a SECOND new
                    // record. `Set` applies immediately within a behaviour chain, so the flag is
                    // already true by the time the second tap is evaluated.
                    // NO DisplayMode GATE — see this button's ALWAYS ENABLED note. A disabled
                    // button cannot fire OnSelect and cannot say why; the Text says "Saving…"
                    // instead, and the guard below is what actually blocks the duplicate.
                    false,
                    Set( gSaving, true );
                    If( Len(lblTkMissing.Text) > 0,
                    // The requirement that used to disable the button. Enforced HERE so a
                    // blocked save says which field is blocking it. All three are
                    // `required: true` in schema.yaml, so SharePoint would reject the
                    // write anyway — this only decides whether the user is TOLD.
                    Notify( "Can't save yet — this task still needs: " & lblTkMissing.Text,
                    NotificationType.Error ),
                    Set( gTkSaved, Blank() );
                    Set( gTkErr, "" );
                    Set( gTkWarn, "" );
                    IfError(
                    Set( gTkSaved,
                    Patch( taskmaster_tasks,
                    If( gEditMode = "Edit", gEditTask, Defaults(taskmaster_tasks) ),
                    // Mirrors the PARENT's phase so cross-project queries can exclude
                    // archived work with a delegable `= false`. Written on every save, not
                    // just on insert. Read LIVE from the list, not from `gSelProject`: that
                    // global is a gallery snapshot taken when the project was opened, so a
                    // project archived since then would stamp `false` here and the row would
                    // stay in scope forever. One delegable LookUp on ID.
                    { task_project_archived:
                          Coalesce( LookUp( taskmaster_projects, ID = gSelProject.ID,
                                            project_phase.Value ), "" ) = "Archived",
                    task_name:        Trim(txtTkName.Text),
                    task_project_id:  { Id: gTkProject.Id, Value: gTkProject.Value },
                    task_description: txtTkDesc.Text,
                    task_stage:       { Value: gTkStage },
                    task_status:      { Value: gTkStatus },
                    task_priority:    { Value: gTkPriority },
                    task_lead: { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",   Claims:      gClaimPrefix & Lower(gTkLead.Mail),   DisplayName: gTkLead.DisplayName,   Email:       gTkLead.Mail,   Department: "", JobTitle: "", Picture: "" },
                    task_date_start:  dtpTkStart.SelectedDate,
                    task_date_target: dtpTkTarget.SelectedDate,
                    // DERIVED, not entered. Complete stamps it and keeps the original on a
                    // re-save; anything else CLEARS it. The "Archived" arm that used to
                    // preserve the date is gone with the stage itself (2026-08-12).
                    //
                    // THE NEW BRANCH IS SEPARATE, AND THAT IS THE WHOLE POINT.
                    // `gEditTask` IS NEVER CLEARED ON NEW — this screen only ever reads it
                    // under a `gEditMode = "Edit"` guard, and every other read here has one.
                    // This was the one that did not, so a task CREATED straight after editing
                    // a completed task inherited that task's completion date: Coalesce found
                    // the stale value and kept it instead of stamping Now(). Same defect
                    // class as `project_date_complete` on scrProjectEdit, fixed 2026-08-11 —
                    // and fixed the same way, by splitting insert from update explicitly
                    // rather than trusting a Coalesce to notice.
                    task_date_completion:
                    If( gEditMode <> "Edit",
                    If( gTkStage = "Complete", Now(), Blank() ),
                    gTkStage = "Complete",
                    Coalesce(gEditTask.task_date_completion, Now()),
                    Blank() ),
                    task_supporter:
                    If( Len(gTkSupporter.Mail) > 0,
                    { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",   Claims:      gClaimPrefix & Lower(gTkSupporter.Mail),   DisplayName: gTkSupporter.DisplayName,   Email:       gTkSupporter.Mail,   Department: "", JobTitle: "", Picture: "" },
                    Blank() ),
                    task_output_approval_id:
                    If( tglTkOutput.Value && Len(Trim(txtTkApprovalId.Text)) > 0,
                    Trim(txtTkApprovalId.Text), Blank() ),
                    task_client_name:
                    If( tglTkClient.Value && gTkClient.Id > 0,
                    { Id: gTkClient.Id, Value: gTkClient.Value }, Blank() ),
                    // task_product_id is RETIRED — the junction replaced it and this
                    // screen no longer writes it. The column keeps its stored values.
                    // task_product_summary IS NOT WRITTEN HERE. It used to be, from the
                    // staged collection, BEFORE the junction was touched and regardless of
                    // whether the junction write succeeded — so the task row claimed
                    // products with no links behind it, and reopening (which seeds from the
                    // JUNCTION) showed none. It is written after the reconcile instead,
                    // from what the junction actually holds.
                    task_output_language:
                    If( tglTkOutput.Value && gTkLanguage <> "(none)", { Value: gTkLanguage }, Blank() ),
                    task_output_format:
                    If( tglTkOutput.Value && gTkFormat <> "(none)", { Value: gTkFormat }, Blank() ),
                    task_output_branding:
                    If( tglTkOutput.Value && gTkBranding <> "(none)", { Value: gTkBranding }, Blank() ),
                    task_client_stage:
                    If( tglTkClient.Value && gTkClientStage <> "(none)", { Value: gTkClientStage }, Blank() ) } ) ),
                    Set( gTkErr, FirstError.Message ) );
                    // Trust the RECORD, never the message — a write can fail and still leave
                    // FirstError.Message empty, and reading that as success is what corrupted
                    // scrProjectEdit's state on 2026-08-06.
                    If( IsBlank(gTkSaved.ID) && Len(gTkErr) = 0,
                    Set( gTkErr, "SharePoint returned no record and no error message, so nothing was saved." ) );
                    If( Len(gTkErr) > 0,
                    Notify("Couldn't save the task: " & gTkErr, NotificationType.Error) );
                    If( Len(gTkErr) = 0 && !IsBlank(gTkSaved.ID),
                    // --- reconcile taskmaster_taskproduct against the staged set -------
                    // Gated on the same toggle as every other output field: with the
                    // section off the task keeps no products, so colTkWanted is empty and
                    // every existing link is removed.
                    // NOT GATED ON tglTkOutput. It was, and that made the toggle a delete
                    // button: switching the Output section off left colTkWanted empty and the
                    // reconcile below removed every link, silently and on a save the user
                    // thought was unrelated. The toggle governs VISIBILITY only. The design
                    // already says products are not an output attribute — the toggle's own
                    // Default special-cases a non-empty product list to stop hiding them.
                    Clear( colTkWanted );
                    Collect( colTkWanted, colTkProducts );
                    // THE FILTER DELEGATES, THE TEST DOES NOT — so they are separated.
                    // `in` against a local collection cannot be delegated, and as one
                    // RemoveIf predicate it dragged the delegable FK test down with it, so
                    // the delete only ever saw the first page of the WHOLE junction list and
                    // would silently stop removing links as that list grew.
                    // Filtering on the indexed FK delegates and returns one task's links;
                    // the undelegable membership test then runs client-side over that
                    // handful. Remove() takes the SCOPE RECORD itself — never `lk.ID`
                    // projected into a collection, which is the construct that failed three
                    // ways here and is why RemoveIf was reached for in the first place.
                    ForAll( Filter( taskmaster_taskproduct,
                    taskproduct_task_id.Id = gTkSaved.ID ) As lk,
                    If( !(lk.taskproduct_product_id.Id in colTkWanted.Id),
                    Remove( taskmaster_taskproduct, lk ) ) );
                    // Read AFTER the delete, so what is here is what survives and the add
                    // diff is against live state. Only the lookup subfield is projected —
                    // `<collection>.taskproduct_product_id.Id` is not a projection Power Fx
                    // will give you, which is why the shaping exists at all.
                    ClearCollect( colTkLinksNow,
                    ForAll( Filter( taskmaster_taskproduct,
                    taskproduct_task_id.Id = gTkSaved.ID ) As lk,
                    { ProdId: lk.taskproduct_product_id.Id } ) );
                    // The lookup pair is written as {Id, Value} — the shape SharePoint
                    // wants — and taskproduct_product_uid is the flat copy that can be
                    // sorted server-side, which a lookup column cannot.
                    // THE ADDS CANNOT BE WRAPPED, SO THE ERROR IS READ AFTERWARDS.
                    // Set() is not callable inside ForAll — Studio rejects it outright — and
                    // IfError's arms must be type-compatible, so a bare Collect cannot sit
                    // against a Set either. Between them those two rules leave no way to
                    // catch this write in place. Errors() is the documented route: it
                    // reports failures against a DATA SOURCE, after the fact, which is
                    // exactly the shape a loop of writes needs.
                    ForAll( Filter( colTkWanted, !(Id in colTkLinksNow.ProdId) ) As add,
                    Collect( taskmaster_taskproduct,
                    { taskproduct_task_id:     { Id: gTkSaved.ID, Value: gTkSaved.task_name },
                    taskproduct_product_id:  { Id: add.Id, Value: add.Uid },
                    taskproduct_product_uid: add.Uid,
                    taskproduct_project_id:  gTkProject.Id } ) );
                    If( !IsEmpty( Errors(taskmaster_taskproduct) ),
                    Set( gTkWarn, gTkWarn & "the product links didn't save: "
                    & First(Errors(taskmaster_taskproduct)).Message & "   " ) );
                    // RE-READ AND COUNT — this matters MORE than the IfError above, because
                    // it catches a write that was dropped without throwing as well as one
                    // that threw. Also the source for the summary, so the two cannot
                    // disagree: one read, both uses.
                    ClearCollect( colTkLinksAfter,
                    ForAll( Filter( taskmaster_taskproduct,
                    taskproduct_task_id.Id = gTkSaved.ID ) As lk,
                    { Uid: lk.taskproduct_product_uid } ) );
                    If( CountRows(colTkLinksAfter) <> CountRows(colTkWanted),
                    Set( gTkWarn, gTkWarn & "the product links didn't save: expected "
                    & CountRows(colTkWanted) & ", the list holds " & CountRows(colTkLinksAfter) & ".   " ) );
                    // THE SUMMARY IS WRITTEN FROM THE JUNCTION, NOT FROM THE FORM, and only
                    // now that the junction is settled. It is a denormalised copy for
                    // galleries, so it must never claim a link the junction does not hold.
                    IfError(
                    Set( gTkSummarySaved,
                    Patch( taskmaster_tasks, gTkSaved,
                    { task_product_summary: Concat(colTkLinksAfter, Uid, ", ") } ) ),
                    Set( gTkWarn, gTkWarn & "the product summary didn't update: " & FirstError.Message & "   " ) );
                    // --- C3: rewrite the parent project's weighted completion ---------
                    // SKIPPED ENTIRELY unless the stage moved. The rollup is a weighted average
                    // over task STAGES, so editing a description, a date, a priority or any
                    // output field cannot change it — and computing it costs a LookUp, a fetch of
                    // up to 500 task rows and a write. On New there is no previous stage, so the
                    // test is false and it always runs.
                    If( !(gEditMode = "Edit" && gTkStage = gEditTask.task_stage.Value),
                    // The two reads are independent, so issue them together instead of in
                    // series. They have to be Sets — Concurrent takes behaviour formulas, so a
                    // With() scope cannot carry the results out.
                    Concurrent(
                    Set( gTkRollupProj, LookUp(taskmaster_projects, ID = gTkProject.Id) ),
                    Set( gTkRollupScored,
                    AddColumns(
                    // Delegable: `=` on an indexed Lookup FK, and nothing else needed.
                    // The six-stage Or-chain that used to sit here is gone — task_stage
                    // has no "Archived" value to exclude any more.
                    Filter( taskmaster_tasks,
                    task_project_id.Id = gTkProject.Id ),
                    wgt, Coalesce(LookUp(gStageWeights, Stage = task_stage.Value, Weight), 0) ) ) );
                    If( IsBlank(gTkRollupProj),
                    Notify("Task saved. Parent project not found, so completion was left unchanged.",
                    NotificationType.Warning),
                    CountRows(gTkRollupScored) >= 500,
                    Notify("Task saved. This project has too many tasks to compute completion accurately, so it was left unchanged.",
                    NotificationType.Warning),
                    With( { newPc: If( CountRows(gTkRollupScored) = 0, 0, RoundDown(Average(gTkRollupScored, wgt), 0) ) },
                    // Don't spend a write on a number that has not moved. Most stage changes
                    // inside a big project leave the rounded average where it was.
                    // Coalesce to -1: a just-inserted row holds NULL and newPc is 0, so a bare
                    // compare can skip the write and leave NULL. Average() drops blanks from the
                    // denominator, so portfolio completion then reads high.
                    If( newPc <> Coalesce(gTkRollupProj.project_perc_completion, -1),
                    IfError(
                    // PATCH, THEN RE-READ. Do NOT keep the Patch return: scrProject renders
                    // entirely from gSelProject, and a record carried into a variable can come
                    // back with columns trimmed, so the screen draws as a blank template with
                    // every field empty. The LookUp is one delegable read on an indexed ID and
                    // is the only thing that guarantees a full record.
                    // gTkRollupSaved exists only to hold the discarded return — IfError's
                    // arms must be type-compatible, so the Patch cannot stand bare beside a
                    // Set. The ID comes from gTkRollupProj, which is untouched and came
                    // straight from the data source, so it is a full record.
                    Set( gTkRollupSaved,
                    Patch( taskmaster_projects, gTkRollupProj, { project_perc_completion: newPc } ) );
                    Set( gSelProject, LookUp( taskmaster_projects, ID = gTkRollupProj.ID ) ),
                    Set( gTkWarn, gTkWarn & "Task saved, but the project rollup didn't update: " & FirstError.Message & "   " )) ) ) ) );
                    If( Len(gTkWarn) > 0,
                    Notify( "Task saved, but: " & gTkWarn, NotificationType.Warning ) );
                    If( Len(gTkWarn) = 0,
                    Notify( If(gEditMode = "Edit", "Task saved", "Task created"), NotificationType.Success ) );
                    Set( gTkResumeKey, "" );
                    Back() ) );
                    Set( gSaving, false ) )
      # =====================================================================
      # PICKER — ONE cmpPicker instance for BOTH person fields AND both
      # lookups. Declared LAST so the dialog paints above the fixed footer.
      #
      # Was two instances of two near-identical components. gTkPicker already
      # named the field being filled; now it also selects which KIND of row the
      # one dialog lists, so Visible, Title, Results and OnConfirm all branch on
      # the same global and there is one Reset target instead of two.
      #
      # Screen-sized and absolute. A component clips its children to its own
      # bounds, so a field-sized instance could not paint a dialog over the
      # form — which is why the person BOX stays on the screen (the cmpLookupField
      # rows) and only the dialog lives in here.
      # =====================================================================
      - cmpTkPick:
          Control: CanvasComponent
          ComponentName: cmpPicker
          Properties:
            Visible: =Len( Coalesce(gTkPicker, "") ) > 0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: |
              =Switch( gTkPicker,
                       "Lead",      "Select lead",
                       "Supporter", "Select supporter",
                       "Client",    "Select client",
                       "Product",   "Select product" )
            # THE QUERIES RUN HERE, NOT IN THE COMPONENT. With AccessAppScope
            # false it cannot reach Office365Users or a list any more than it can
            # reach gTheme, so it takes rows in.
            #
            # Bound to gTkQuery, which OnSearch sets — NOT to cmpTkPick.Query
            # directly. Feeding an instance's own output into its own input is a
            # same-instance cycle Studio may reject; the global sidesteps it, and
            # it keeps the call on SUBMIT: this only re-evaluates when OnSearch
            # hands over a new query.
            #
            # ForAll(... As alias, {record}) on EVERY branch, people included, so
            # all four yield the same {Key, Primary, Secondary} the component
            # declares and the If chain type-checks. ShowColumns cannot be used
            # here: it can only keep the source's own column names, and there is
            # no `Key` column in either a directory row or a list row.
            # Key is TEXT for both kinds — Mail for a person, Text(ID) for a
            # record. That single change is what let the two pickers become one.
            # Each branch repeats the >= 2 guard and there is NO else branch, so
            # an unmatched state yields blank of the right shape.
            # FirstN caps the record pages: Filter delegates, ForAll does not.
            # THE RECORD BRANCHES ARE NOT GATED ON QUERY LENGTH — StartsWith(col, "")
            # is true for every row, so one branch serves both the default page and
            # the search. FirstN is what makes it 10 with nothing typed and 50 with a
            # query. Sort is INSIDE the Filter, on an indexed column, so it folds.
            # The directory branches keep the >= 2 gate: there is no "first 10 people"
            # to show, so their default is the current user — one tap to self-assign.
            Results: |
              =If( (gTkPicker = "Lead" || gTkPicker = "Supporter") && Len(gTkQuery) >= 2,
              ForAll( Office365Users.SearchUserV2({ searchTerm: gTkQuery, top: 25 }).value As u,
              { Key:       u.Mail,
              Primary:   u.DisplayName,
              Secondary: u.Mail } ),
              gTkPicker = "Lead" || gTkPicker = "Supporter",
              Table( { Key:       User().Email,
              Primary:   User().FullName,
              Secondary: User().Email } ),
              gTkPicker = "Client",
              ForAll( FirstN( Sort( Filter( taskmaster_clients,
              StartsWith(client_name, gTkQuery) ), client_name ),
              If( Len(gTkQuery) >= 2, 50, 10 ) ) As c,
              { Key:       Text(c.ID),
              Primary:   c.client_name,
              Secondary: Coalesce(c.client_type.Value, "") } ),
              gTkPicker = "Product",
              ForAll( FirstN( Sort( Filter( taskmaster_products,
              StartsWith(product_uid, gTkQuery) ), product_uid ),
              If( Len(gTkQuery) >= 2, 50, 10 ) ) As p,
              { Key:       Text(p.ID),
              Primary:   p.product_uid,
              Secondary: Coalesce(p.product_type_path, "") } ) )
            OnSearch: =Set( gTkQuery, cmpTkPick.Query )
            AllowCreate: =gTkPicker = "Client" || gTkPicker = "Product"
            OnConfirm: |
              =Switch( gTkPicker,
              "Lead",      Set( gTkLead,      { DisplayName: cmpTkPick.Picked.Primary, Mail: cmpTkPick.Picked.Secondary } ),
              "Supporter", Set( gTkSupporter, { DisplayName: cmpTkPick.Picked.Primary, Mail: cmpTkPick.Picked.Secondary } ),
              "Client",    Set( gTkClient,    { Id: Value(cmpTkPick.Picked.Key), Value: cmpTkPick.Picked.Primary } ) );
              // PRODUCT CANNOT SIT IN THE SWITCH ABOVE. It Collects rather than Sets,
              // and Switch's arms have to agree on type — Collect returns a TABLE while
              // Set returns a boolean, the same mismatch that made IfError reject the
              // documented Remove/Notify idiom on scrProject.
              //
              // The LookUp is a duplicate guard: the picker will happily offer a product
              // that is already staged, and two identical links would double-count it in
              // the summary and in every count drawn from the junction.
              If( gTkPicker = "Product"
               && IsBlank( LookUp(colTkProducts, Id = Value(cmpTkPick.Picked.Key)) ),
                  Collect( colTkProducts,
                           { Id:  Value(cmpTkPick.Picked.Key),
                             Uid: cmpTkPick.Picked.Primary } ) );
              Set( gTkPicker, "" )
            OnCreateNew: |
              =Set( gTkResumeKey, gTkKey );
               If( gTkPicker = "Client",
                   Set( gClMode, "New" ); Set( gClReturn, "TaskClient" ); Set( gTkPicker, "" );
                   Navigate( scrClientEdit, ScreenTransition.Cover ),
                   Set( gPdMode, "New" ); Set( gPdReturn, "TaskProduct" ); Set( gTkPicker, "" );
                   Navigate( scrProductEdit, ScreenTransition.Cover ) )
            OnCancel: =Set( gTkPicker, "" )
