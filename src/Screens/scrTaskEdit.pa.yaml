                                  Properties:
                                    Text: ="Stage  *"
                                    Font: =Theme.Font
                                    Size: =Theme.Size.Small
                                    Color: =Theme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - cboTkStage:
                                  Control: ModernCombobox@1.1.1
                                  Properties:
                                    Items: =["Not Started", "Planning", "Drafting", "Under Review", "Finalizing", "Complete", "Archived"]
                                    ItemDisplayText: =ThisItem.Value
                                    DefaultSelectedItems: =Filter( [gTkStage], !IsBlank(Value) )
                                    SelectMultiple: =false
                                    IsSearchable: =false
                                    InputTextPlaceholder: ="Select…"
                                    Color: |
                                      =Switch( gTkStage,
                                      "Complete",     Theme.Color.Success,
                                      "Under Review", Theme.Color.Warning,
                                      "Finalizing",   Theme.Color.Warning,
                                      "Archived",     Theme.Color.TextMuted,
                                      "Not Started",  Theme.Color.TextMuted,
                                      Theme.Color.TextPrimary )
                                    FillPortions: =0
                                    LayoutMinHeight: =36
                                    Width: =Parent.Width
                                    Height: =40
                                    OnChange: =Set(gTkStage, cboTkStage.Selected.Value)
                        - colTkStatus:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              LayoutGridColumnStart: =2
                              LayoutGridColumnEnd: =2
                              LayoutGridRowStart: =1
                              LayoutGridRowEnd: =1
                              Height: =80
                            Children:
                              - lblTkStatusCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="Health  *"
                                    Font: =Theme.Font
                                    Size: =Theme.Size.Small
                                    Color: =Theme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - cboTkStatus:
                                  Control: ModernCombobox@1.1.1
                                  Properties:
                                    Items: =["Green", "Amber", "Red"]
                                    ItemDisplayText: =ThisItem.Value
                                    DefaultSelectedItems: =Filter( [gTkStatus], !IsBlank(Value) )
                                    SelectMultiple: =false
                                    IsSearchable: =false
                                    InputTextPlaceholder: ="Select…"
                                    Color: |
                                      =Switch( gTkStatus,
                                      "Green", Theme.Color.Success,
                                      "Amber", Theme.Color.Warning,
                                      "Red",   Theme.Color.Danger,
                                      Theme.Color.TextPrimary )
                                    FillPortions: =0
                                    LayoutMinHeight: =36
                                    Width: =Parent.Width
                                    Height: =40
                                    OnChange: =Set(gTkStatus, cboTkStatus.Selected.Value)
                        - colTkPriority:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              LayoutGridColumnStart: =3
                              LayoutGridColumnEnd: =3
                              LayoutGridRowStart: =1
                              LayoutGridRowEnd: =1
                              Height: =80
                            Children:
                              - lblTkPriorityCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="Priority  *"
                                    Font: =Theme.Font
                                    Size: =Theme.Size.Small
                                    Color: =Theme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
