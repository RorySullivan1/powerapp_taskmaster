                                    FillPortions: =0
                                    LayoutMinHeight: =36
                                    Width: =Parent.Width
                                    Height: =36
                        - colTkSupp:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              LayoutGridColumnStart: =1
                              LayoutGridColumnEnd: =1
                              LayoutGridRowStart: =2
                              LayoutGridRowEnd: =2
                              Height: =62
                            Children:
                              - fldSupporter:
                                  Control: CanvasComponent
                                  ComponentName: cmpLookupField
                                  Properties:
                                    Caption: ="Supporter"
                                    PickLabel: ="＋  Choose a supporter"
                                    HasValue: =Len(gTkSupporter.Mail) > 0
                                    Display: =gTkSupporter.DisplayName
                                    Width: =Parent.Width
                                    Height: =62
                                    OnPick: |
