            Visible: =gTaskEditTab = 2 && gTkClient.Id > 0
            Icon: =Icon.Cancel
            Color: =Theme.Color.TextMuted
            Height: =16
            Width: =16
            X: =524
            Y: =236
            OnSelect: |
              =Set(gTkClient, { Id: 0, Value: "" })
      - lblTkProductCap:
          Control: Label@2.5.1
          Properties:
            Visible: =gTaskEditTab = 2
            Text: ="Product"
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Color: =Theme.Color.TextMuted
            X: =24
            Y: =272
            Width: =520
            Height: =18
