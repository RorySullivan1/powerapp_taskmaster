                                    FillPortions: =0
                                    LayoutMinHeight: =36
                                    Width: =Parent.Width
                                    Height: =36
                        - colTkSupp:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =4
                              LayoutGridColumnStart: =1
                              LayoutGridColumnEnd: =1
                              LayoutGridRowStart: =2
                              LayoutGridRowEnd: =2
                              Height: =62
                            Children:
                              - lblTkSuppCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="Supporter"
                                    Font: =Theme.Font
                                    Size: =Theme.Size.Small
                                    Color: =Theme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              # Empty person box — see btnTkLeadPick.
                              - btnTkSuppPick:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Visible: =Len(gTkSupporter.Mail) = 0
                                    Text: ="＋  Choose a supporter"
                                    Align: =Align.Left
                                    Fill: =Theme.Color.Bg
                                    Color: =Theme.Color.TextMuted
                                    BorderColor: =Theme.Color.Border
                                    BorderThickness: =1
                                    Font: =Theme.Font
                                    Size: =Theme.Size.Body
                                    FillPortions: =0
                                    LayoutMinHeight: =36
                                    Width: =Parent.Width
                                    Height: =36
                                    OnSelect: |
                                      =Set( gTkPicker, "Supporter" );
                                       Reset( cmpTkPeople );
                                       Set( gTkPeopleQuery, "" )
                              # The chip REPLACES the search box once somebody is chosen —
                              # same shape as scrProjectEdit. One row either way.
                              - chipTkSupp:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    Visible: =Len(gTkSupporter.Mail) > 0
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =6
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    Fill: =Theme.Color.Bg
                                    BorderColor: =Theme.Color.Border
