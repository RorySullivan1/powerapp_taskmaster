# Create / edit a client. Reachable from scrReference and from cmpPicker's "+ New".
# taskmaster_clients has four required columns. client_sales is OPTIONAL and is the only
# Person column here; people are never created here, it is filled from Microsoft 365.
Screens:
  scrClientEdit:
    Properties:
      Fill: =gTheme.Color.Bg
      OnVisible: |
        =Set( gSaving, false );   // see btnClSave
        Set( gClName,   If( gClMode = "Edit", Coalesce(gEditClient.client_name, ""), "" ) );
        // Choice values come from the column itself — never a literal here.
        // ONCE PER SESSION, NOT ONCE PER VISIT. The region list joins the two vocabularies
        // here because all three are reference data and independent of the record; an EMPTY
        // collection is the only reason to fetch one again, and a new value is picked up on
        // the next app start. IsEmpty, never IsBlank: these are tables.
        Concurrent(
            If( IsEmpty(colClTypeChoices),
                ClearCollect( colClTypeChoices, Choices([@taskmaster_clients].client_type) ) ),
            If( IsEmpty(colClCovChoices),
                ClearCollect( colClCovChoices,  Choices([@taskmaster_clients].client_coverage) ) ),
            If( IsEmpty(colMapRegionCl),
                ClearCollect( colMapRegionCl, mapping_region ) ) );
        Set( gClType, If( gClMode = "Edit", Coalesce(gEditClient.client_type.Value, ""), "" ) );
        Set( gClCov,  If( gClMode = "Edit", Coalesce(gEditClient.client_coverage.Value, ""), "" ) );
        Set( gClSales,
              If( gClMode = "Edit",
                  { DisplayName: Coalesce(gEditClient.client_sales.DisplayName, ""),
                    Mail:        Coalesce(gEditClient.client_sales.Email, "") },
                  { DisplayName: "", Mail: "" } ) );
        Set( gClRegionId,   If( gClMode = "Edit", Coalesce(gEditClient.client_region_id, 0), 0 ) );
        Set( gClRegionPath, If( gClMode = "Edit", Coalesce(gEditClient.client_region_path, ""), "" ) );
        Set( gClNotes, If( gClMode = "Edit", Coalesce(gEditClient.client_notes, ""), "" ) );
        Set( gClPicker, "" );
        Reset( txtClName ); Reset( txtClNotes );
        Reset( cboClType ); Reset( cboClCov );
        Reset( pickClRegion );
        Reset( cmpClPick )
    Children:
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Primary
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =gTheme.Space.HeaderH
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: =If(gClMode = "Edit", "Edit client", "New client")
            Color: =gTheme.Color.OnPrimary
            Font: =gTheme.Font
            Size: =gTheme.Size.H2
            FontWeight: =FontWeight.Semibold
            VerticalAlign: =VerticalAlign.Middle
            X: =gTheme.Space.Gutter
            Y: =0
            Width: =Parent.Width - 120
            Height: =gTheme.Space.HeaderH
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =gTheme.Color.OnPrimary
            HoverColor: =gTheme.Color.OnPrimary
            HoverFill: =RGBA(255, 255, 255, 0.15)
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            Tooltip: ="Close without saving"
            X: =Parent.Width - 24 - gTheme.Space.Gutter
            Y: =(gTheme.Space.HeaderH - 24) / 2
            Width: =24
            Height: =24
            OnSelect: =Back()
      - bodyRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Start
            LayoutGap: =12
            PaddingTop: =gTheme.Space.Gutter
            PaddingBottom: =gTheme.Space.Gutter
            PaddingLeft: =gTheme.Space.Gutter
            PaddingRight: =gTheme.Space.Gutter
            LayoutOverflowY: =LayoutOverflow.Scroll
            Fill: =gTheme.Color.Surface
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 68
          Children:
            - lblClNameCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Client name  *"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinHeight: =18
                  Width: =Parent.Width - 48
                  Height: =18
            - txtClName:
                Control: ModernTextInput@1.1.1
                Properties:
                  Default: =If(gClMode = "Edit", gEditClient.client_name, "")
                  Placeholder: ="Legal or trading name"
                  TriggerOutput: =TriggerOutput.Delayed
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  FillPortions: =0
                  LayoutMinHeight: =36
                  Width: =Parent.Width - 48
                  Height: =36
                  OnChange: =Set( gClName, Trim(txtClName.Text) )
            - lblClTypeCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Type  *"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinHeight: =18
                  Width: =Parent.Width - 48
                  Height: =18
            - cboClType:
                Control: ModernCombobox@1.1.1
                Properties:
                  Items: =colClTypeChoices
                  ItemDisplayText: =ThisItem.Value
                  DefaultSelectedItems: =Filter( colClTypeChoices, Value = gClType )
                  SelectMultiple: =false
                  IsSearchable: =true
                  InputTextPlaceholder: ="Select a client type"
                  FillPortions: =0
                  LayoutMinHeight: =32
                  Width: =Parent.Width - 48
                  Height: =32
                  OnChange: =Set( gClType, cboClType.Selected.Value )
            - lblClCovCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Coverage  *"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinHeight: =18
                  Width: =Parent.Width - 48
                  Height: =18
            - cboClCov:
                Control: ModernCombobox@1.1.1
                Properties:
                  Items: =colClCovChoices
                  ItemDisplayText: =ThisItem.Value
                  DefaultSelectedItems: =Filter( colClCovChoices, Value = gClCov )
                  SelectMultiple: =false
                  IsSearchable: =true
                  InputTextPlaceholder: ="Select a coverage group"
                  FillPortions: =0
                  LayoutMinHeight: =32
                  Width: =Parent.Width - 48
                  Height: =32
                  OnChange: =Set( gClCov, cboClCov.Selected.Value )
            # WRAPPED IN A COL — a component instance cannot carry FillPortions or
            # LayoutMinHeight, so the wrapper has to exist for the auto-layout contract.
            - colClSales:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =0
                  FillPortions: =0
                  LayoutMinHeight: =62
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - fldSales:
                      Control: CanvasComponent
                      ComponentName: cmpLookupField
                      Properties:
                        Caption: ="Sales owner"
                        PickLabel: ="＋  Choose a sales owner"
                        HasValue: =Len(gClSales.Mail) > 0
                        Display: =gClSales.DisplayName
                        Width: =Parent.Width
                        Height: =62
                        OnPick: |
                          =Set( gClPicker, "Sales" );
                           Reset( cmpClPick );
                           Set( gClQuery, "" )
                        OnClear: |
                          =Set( gClSales, { DisplayName: "", Mail: "" } )
            - colClRegion:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =0
                  FillPortions: =0
                  LayoutMinHeight: =64
                  Width: =Parent.Width - 48
                  Height: =64
                Children:
                  - pickClRegion:
                      Control: CanvasComponent
                      ComponentName: cmpNestedSelect
                      Properties:
                        Terms: =colMapRegionCl
                        Caption: ="Region  *"
                        DefaultPath: =gClRegionPath
                        Separator: =" | "
                        Width: =Parent.Width
                        Height: =64
                        OnChange: |
                          =Set( gClRegionId,   pickClRegion.SelectedId );
                           Set( gClRegionPath, pickClRegion.SelectedPath )
            - lblClNotesCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Notes"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinHeight: =18
                  Width: =Parent.Width - 48
                  Height: =18
            - txtClNotes:
                Control: ModernTextInput@1.1.1
                Properties:
                  Default: =If(gClMode = "Edit", gEditClient.client_notes, "")
                  Placeholder: ="Optional"
                  Type: =TextInputType.Multiline
                  TriggerOutput: =TriggerOutput.Delayed
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  FillPortions: =0
                  LayoutMinHeight: =60
                  Width: =Parent.Width - 48
                  Height: =60
                  OnChange: =Set( gClNotes, txtClNotes.Text )
      - actionBarBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            BorderColor: =gTheme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =Parent.Height - 68
            Width: =Parent.Width
            Height: =68
      - lblClMissing:
          Control: Label@2.5.1
          Properties:
            Visible: =Len(Self.Text) > 0
            Text: |
              =With(
                 { m: Concat( Filter( Table(
                        { L: "Name",           M: Len(Trim(txtClName.Text)) = 0 },
                        { L: "Type",           M: Len(gClType) = 0 },
                        { L: "Coverage Group", M: Len(gClCov) = 0 },
                        { L: "Region",         M: Len(gClRegionPath) = 0 } ),
                      M ), L, " | " ) },
                 If( Len(m) > 0, "Required Fields Remaining: " & m, "" ) )
            Font: =gTheme.Font
            Size: =gTheme.Size.Small
            Color: =gTheme.Color.Danger
            VerticalAlign: =VerticalAlign.Middle
            X: =gTheme.Space.Gutter
            Y: =Parent.Height - 68
            Width: =Parent.Width - gTheme.Space.Gutter - 320
            Height: =68
      - btnClCancel:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Cancel"
            Fill: =gTheme.Color.Surface
            Color: =gTheme.Color.Primary
            BorderColor: =gTheme.Color.Primary
            BorderThickness: =1
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            X: =Parent.Width - gTheme.Space.Gutter - 140 - 8 - 140
            Y: =Parent.Height - 68 + 12
            Width: =140
            Height: =44
            OnSelect: =Back()
      - btnClSave:
          Control: Classic/Button@2.2.0
          Properties:
            Text: |
              =If( gSaving, "Saving…",
                   If(gClMode = "Edit", "Save client", "Create client") )
            Fill: =gTheme.Color.Primary
            Color: =gTheme.Color.OnPrimary
            BorderColor: =gTheme.Color.Primary
            BorderThickness: =0
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            X: =Parent.Width - gTheme.Space.Gutter - 140
            Y: =Parent.Height - 68 + 12
            Width: =140
            Height: =44
            # ALWAYS ENABLED — a disabled button cannot say why it is disabled.
            OnSelect: |
              =If( gSaving,
              // A SECOND TAP WHILE THE FIRST WRITE IS STILL IN FLIGHT. Do nothing — a Patch takes
              // seconds and the button stays live, so a double-tap ran the handler twice and built a
              // SECOND record. `Set` applies immediately within a behaviour chain.
              false,
              Set( gSaving, true );
              If( Len(lblClMissing.Text) > 0,
              Notify( "Can't save yet. " & lblClMissing.Text,
              NotificationType.Error ),
              // BLANK THE RECORD, NOT JUST THE MESSAGE. Left holding the last successful save,
              // this makes the IsBlank(.ID) guard below pass on a PREVIOUS record — so a write that
              // fails with an empty error message reports success and hands back the WRONG record.
              Set( gClSaved, Blank() );
              Set( gClErr, "" );
              IfError(
              Set( gClSaved,
              Patch( taskmaster_clients,
              If( gClMode = "Edit", gEditClient, Defaults(taskmaster_clients) ),
              { client_name:        Trim(txtClName.Text),
              client_type:        { Value: gClType },
              client_coverage:    { Value: gClCov },
              // OPTIONAL. An empty Mail must write Blank(), NOT a record — gClaimPrefix & ""
              // is a malformed claim and the connector rejects the WHOLE Patch, not the field.
              // Blank() is also what CLEARS the column when a set owner is removed.
              client_sales:
              If( Len(gClSales.Mail) > 0,
              { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",   Claims:      gClaimPrefix & Lower(gClSales.Mail),   DisplayName: gClSales.DisplayName,   Email:       gClSales.Mail,   Department: "", JobTitle: "", Picture: "" },
              Blank() ),
              client_region_id:   gClRegionId,
              client_region_path: gClRegionPath,
              client_notes:       txtClNotes.Text } ) ),
              Set( gClErr, FirstError.Message ) );
              // Trust the RECORD, never the message.
              If( IsBlank(gClSaved.ID) && Len(gClErr) = 0,
              Set( gClErr, "SharePoint returned no record and no error message, so nothing was saved." ) );
              If( Len(gClErr) > 0,
              Notify( "Couldn't save the client: " & gClErr, NotificationType.Error ) );
              If( Len(gClErr) = 0 && !IsBlank(gClSaved.ID),
              If( gClReturn = "TaskClient",
              Set( gTkClient,  { Id: gClSaved.ID, Value: gClSaved.client_name } ),
              gClReturn = "TxClient",
              Set( gTxClient,  { Id: gClSaved.ID, Value: gClSaved.client_name } ),
              // NxClient is the STAGED transaction inside scrProjectEdit, not the transaction
              // editor — the staged row is written from gNx* when the project saves.
              gClReturn = "NxClient",
              Set( gNxClient,  { Id: gClSaved.ID, Value: gClSaved.client_name } ) );
              Set( gClReturn, "" );
              Notify( If(gClMode = "Edit", "Client saved", "Client created"), NotificationType.Success );
              Back() ) );
              Set( gSaving, false ) )
      # ---- Picker — declared LAST so it paints above the action bar ---------
      # One state only here (the sales owner). See scrTaskEdit's instance for the contract.
      - cmpClPick:
          Control: CanvasComponent
          ComponentName: cmpPicker
          Properties:
            Visible: =gClPicker = "Sales"
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: ="Select sales owner"
            # The directory call runs HERE — the component cannot reach a data source with
            # AccessAppScope false. Bound to the global OnSearch fills, not to the instance's own
            # Query output, which would be a same-instance cycle. The default row is the current
            # user — one tap to make yourself the sales owner.
            Results: |
              =If( Len(gClQuery) >= 2,
              ForAll( Office365Users.SearchUserV2({ searchTerm: gClQuery, top: 25 }).value As u,
              { Key:       u.Mail,
              Primary:   u.DisplayName,
              Secondary: u.Mail } ),
              Table( { Key:       User().Email,
              Primary:   User().FullName,
              Secondary: User().Email } ) )
            OnSearch: =Set( gClQuery, cmpClPick.Query )
            AllowCreate: =false
            OnConfirm: |
              =Set( gClSales,
                    { DisplayName: cmpClPick.Picked.Primary,
                      Mail:        cmpClPick.Picked.Secondary } );
               Set( gClPicker, "" )
            OnCancel: =Set( gClPicker, "" )
