# =============================================================================
# scrReports  —  Power BI dashboard panel (screen-map §2). CORE-SHELL: header +
# nav + the real Q2 empty-state (unlicensed users get a card, never a broken
# embed). Phase 3 adds the PowerBI control for licensed users + the native SVG
# KPI fallback (distillation C1). Header + nav identical to scrHome by design.
# DIALECT: modern structured schema; positional z-order. Header + nav are one
# component (cmpAppBar), declared LAST so the fly-out floats over the content.
# =============================================================================
Screens:
  scrReports:
    Properties:
      Fill: =gTheme.Color.Bg
      # ---- PHASE-2 DATA (Q2 licence-free fallback) --------------------------
      # SCOPE MATTERS: SharePoint cannot count org-wide accurately from the app —
      # CountRows never delegates, so it only ever counts the rows already pulled
      # (the data row limit). Every figure here is therefore deliberately scoped
      # to a set small enough to be exact: YOUR tasks, and the active projects
      # list. Org-wide analytics stay in Power BI, which imports the lists whole.
      OnVisible: |
        =
        // SELF-HEAL, and it is not belt-and-braces. App.OnStart is NON-BLOCKING, so this
        // screen can run before it finishes. A blank gUserEmail makes the Person filters
        // below match NOTHING, and these KPIs are imperative Sets — they run once and never
        // re-fire when the global later arrives, so the dashboard latches at zero until a
        // manual refresh. Declarative properties like gTheme self-heal; these cannot.
        If( IsBlank(gUserEmail), Set( gUserEmail, Lower(User().Email) ) );
        Concurrent(
            ClearCollect( colMyTasks,
                Filter( LiveTasks,
                    task_lead.Email = gUserEmail || task_supporter.Email = gUserEmail ) ),
            ClearCollect( colMyProjects,
                Filter( ActiveProjects,
                    project_manager.Email = gUserEmail || project_supporter.Email = gUserEmail ) )
        );
        Set( gRptOpen, Filter(colMyTasks, task_stage.Value <> "Complete") );
        Set( gRptOnTrack,
             If( CountRows(gRptOpen) = 0, 0,
                 RoundDown( CountRows(Filter(gRptOpen, task_status.Value = "Green"))
                            / CountRows(gRptOpen) * 100, 0 ) ) );
        Set( gRptAtRisk,
             If( CountRows(gRptOpen) = 0, 0,
                 RoundDown( CountRows(Filter(gRptOpen,
                              task_status.Value = "Amber" || task_status.Value = "Red"))
                            / CountRows(gRptOpen) * 100, 0 ) ) );
        Set( gRptPortfolio,
             If( CountRows(colMyProjects) = 0, 0,
                 RoundDown( Average( AddColumns( colMyProjects, pc,
                     Coalesce(project_perc_completion, 0) ), pc ), 0 ) ) )
    Children:
      - LicenceCard:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            Height: =220
            Width: =Min(560, Parent.Width - (gTheme.Space.Gutter * 2))
            X: =gTheme.Space.Gutter
            Y: =gTheme.Space.HeaderH + gTheme.Space.Gutter
            Visible: =Not(gHasPowerBiLicence)
      - LicenceIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.DetailList
            Color: =gTheme.Color.Accent
            # Decorative. Pinned so a passing mouse does not dim it.
            HoverColor: =gTheme.Color.Accent
            HoverFill: =RGBA(0, 0, 0, 0)
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            Height: =40
            Width: =40
            X: =LicenceCard.X + gTheme.Space.Gutter
            Y: =LicenceCard.Y + gTheme.Space.Gutter
            Visible: =Not(gHasPowerBiLicence)
      - LicenceHeading:
          Control: Label@2.5.1
          Properties:
            Text: ="Reporting needs a Power BI licence"
            Font: =gTheme.Font
            FontWeight: =FontWeight.Semibold
            Size: =gTheme.Size.H2
            Color: =gTheme.Color.TextPrimary
            X: =LicenceIcon.X + 40 + gTheme.Space.Gap
            Y: =LicenceCard.Y + gTheme.Space.Gutter
            Width: =LicenceCard.Width - (LicenceIcon.X - LicenceCard.X) - 40 - (gTheme.Space.Gap * 2)
            Height: =40
            VerticalAlign: =VerticalAlign.Middle
            Visible: =Not(gHasPowerBiLicence)
      - LicenceBody:
          Control: Label@2.5.1
          Properties:
            Text: ="Your account isn't licensed for the embedded dashboard. Headline status still appears on Home and across the app — no Power BI required."
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            Color: =gTheme.Color.TextMuted
            X: =LicenceHeading.X
            Y: =LicenceHeading.Y + LicenceHeading.Height + gTheme.Space.Gap
            Width: =LicenceHeading.Width
            Height: =90
            Visible: =Not(gHasPowerBiLicence)
      # ---- Native SVG KPI fallback (Q2 / distillation C1) ------------------
      # Licence-free headline visuals via cmpKpiRing, fed by the locals Set in
      # OnVisible. Rings 1-2 read task_status (health), which is required with a
      # Green default (C9), so green% + amber-red% now sum to 100. Ring 3 is the
      # mean of project_perc_completion, the app-side weighted rollup (C3) — it
      # reads 0 until the write-back is placed on a task-edit screen.
      - hdrFallback:
          Control: CanvasComponent
          ComponentName: cmpSectionHeader
          Properties:
            Visible: =Not(gHasPowerBiLicence)
            X: =gTheme.Space.Gutter
            Y: =gTheme.Space.HeaderH + gTheme.Space.Gutter + 220 + gTheme.Space.Gutter
            Width: =Parent.Width - (gTheme.Space.Gutter * 2)
            Height: =60
            Title: ="Headline status"
            Subtitle: ="Drawn natively — no Power BI licence required. Scoped to your tasks and active projects; org-wide analysis lives in Power BI."
            ShowAction: =false
      - ringOnTrack:
          Control: CanvasComponent
          ComponentName: cmpKpiRing
          Properties:
            Visible: =Not(gHasPowerBiLicence)
            X: =gTheme.Space.Gutter
            Y: =gTheme.Space.HeaderH + gTheme.Space.Gutter + 220 + gTheme.Space.Gutter + 60 + gTheme.Space.Gap
            Width: =140
            Height: =140
            Percent: =gRptOnTrack
            Label: =gRptOnTrack & "% green"
            AccentHex: ="#31825D"
      - ringAtRisk:
          Control: CanvasComponent
          ComponentName: cmpKpiRing
          Properties:
            Visible: =Not(gHasPowerBiLicence)
            X: =gTheme.Space.Gutter + 140 + gTheme.Space.Gutter
            Y: =gTheme.Space.HeaderH + gTheme.Space.Gutter + 220 + gTheme.Space.Gutter + 60 + gTheme.Space.Gap
            Width: =140
            Height: =140
            Percent: =gRptAtRisk
            Label: =gRptAtRisk & "% amber/red"
            AccentHex: ="#D69828"
      - ringPortfolio:
          Control: CanvasComponent
          ComponentName: cmpKpiRing
          Properties:
            Visible: =Not(gHasPowerBiLicence)
            X: =gTheme.Space.Gutter + 2 * (140 + gTheme.Space.Gutter)
            Y: =gTheme.Space.HeaderH + gTheme.Space.Gutter + 220 + gTheme.Space.Gutter + 60 + gTheme.Space.Gap
            Width: =140
            Height: =140
            Percent: =gRptPortfolio
            Label: =gRptPortfolio & "% of yours"
            AccentHex: ="#005A9E"
      # ---- The whole shell is one component: header bar + fly-out nav rail ----
      # DECLARED LAST so positional z-order floats the fly-out over the content.
      #
      # Height is dynamic and that is the whole trick: a component intercepts every
      # click inside its bounds, so closed it must own nothing but the 64px header
      # strip. Open, covering the screen is exactly right — the scrim wants the click.
      #
      # cmpAppBar cannot Navigate (a component can't see app screens), so it reports
      # the chosen entry and this screen does the navigating.
      - appBar:
          Control: CanvasComponent
          ComponentName: cmpAppBar
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =If(gNavOpen, Parent.Height, gTheme.Space.HeaderH)
            Items: =gNavMenu
            ActiveKey: =2
            HasLicence: =gHasPowerBiLicence
            AppTitle: ="EQD Taskmaster"
            ScreenTitle: ="Reports"
            IsOpen: =gNavOpen
            OnToggle: =Set(gNavOpen, !gNavOpen)
            OnNavigate: |
              =Switch( appBar.SelectedKey,
                       1, Navigate(scrHome, ScreenTransition.Fade),
                       2, Navigate(scrReports, ScreenTransition.Fade),
                       3, Navigate(scrProjects, ScreenTransition.Fade),
                          Navigate(scrReference, ScreenTransition.Fade) );
              Set(gNavOpen, false)
