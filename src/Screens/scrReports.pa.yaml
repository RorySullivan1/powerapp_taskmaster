                                    & (n * 44 + 16) & "'>"
                                    & Concat( colRptReqBar,
                                          "<text x='0' y='" & ((Idx - 1) * 44 + 26)
                                        & "' font-size='17' font-family='Segoe UI, sans-serif' fill='#20262D'>"
                                        & EncodeHTML( If(Len(K) > 22, Left(K, 21) & "..", K) ) & "</text>"
                                        & "<rect x='210' y='" & ((Idx - 1) * 44 + 12)
                                        & "' width='330' height='20' rx='10' fill='#EEF1F5'/>"
                                        & "<rect x='210' y='" & ((Idx - 1) * 44 + 12) & "' width='"
                                        & Max(2, Round(N / Max(1, gRptReqMax) * 330, 0))
                                        & "' height='20' rx='10' fill='"
                                        & If( K = "Other" || K = "Unassigned", "#B9C0C8", "#005A9E" ) & "'/>"
                                        & "<text x='598' y='" & ((Idx - 1) * 44 + 27)
                                        & "' text-anchor='end' font-size='16'"
                                        & " font-family='Segoe UI, sans-serif' fill='#6E7882'>" & N & "</text>" )
                                    & "</svg>" ) )
