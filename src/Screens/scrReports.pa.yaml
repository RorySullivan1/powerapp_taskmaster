                        # THE SUBTITLE CARRIES BOTH GAPS, because a slice cannot. A large Unspecified
                        # wedge means the column is YOUNGER than the backlog, not that the report is
                        # broken, and those two look identical on a pie. Other outranks it: rarer, and
                        # a data question.
                        - lblRptAudS:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                =If( LookUp(colRptAudBar, K = "Other", N) > 0,
                                     "Other is non-zero — a value the column no longer offers.",
                                     LookUp(colRptAudBar, K = "Unspecified", N) > 0,
                                     LookUp(colRptAudBar, K = "Unspecified", N) & " of "
                                       & CountRows(colRptOpenTag) & " unspecified.",
                                     "Open tasks that produce output." )
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: |
                                =If( LookUp(colRptAudBar, K = "Other", N) > 0,
                                     gTheme.Color.Danger,
                                     LookUp(colRptAudBar, K = "Unspecified", N) > 0,
                                     gTheme.Color.Warning,
                                     gTheme.Color.TextMuted )
                              FillPortions: =0
                              LayoutMinHeight: =32
                              Width: =Parent.Width - 32
                              Height: =32
                        - imgRptAud:
                            Control: Image@2.2.3
                            Properties:
                              ImagePosition: =ImagePosition.Fit
                              FillPortions: =1
                              LayoutMinHeight: =120
                              Width: =Parent.Width - 32
                              Height: =Parent.Height - 80
                              # A PIE IS N STACKED CIRCLES, not arc paths: circumference 100 at r 15.9155, so
                              # a slice IS its percentage and no Cos/Sin appears anywhere. stroke-width 31.831
                              # is 2r, which fills the stroke to the centre and makes the ring a disc.
                              # dashoffset 125 - Off, not 25 - Off: the pattern repeats every 100 units so the
                              # two are the same rotation, and this one can never go negative.
                              Image: |
                                =With( { n: CountRows(colRptAudPie) },
                                    "data:image/svg+xml;charset=utf-8," & EncodeUrl(
                                        "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 150'>"
