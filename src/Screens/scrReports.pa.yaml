                                      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 220'>"
                                    & "<line x1='0' y1='180' x2='900' y2='180' stroke='#E1E5EB' stroke-width='2'/>"
                                    & Concat( colRptBuckets,
                                          "<rect x='" & (10 + (Idx - 1) * w) & "' y='"
                                        & (180 - Round(TxP / Max(1, gRptTxMax) * 150, 0)) & "' width='"
                                        & Max(4, w - 12) & "' height='"
                                        & Round(TxP / Max(1, gRptTxMax) * 150, 0) & "' fill='#E1E5EB'/>"
                                        & "<rect x='" & (10 + (Idx - 1) * w + 6) & "' y='"
                                        & (180 - Round(Tx / Max(1, gRptTxMax) * 150, 0)) & "' width='"
                                        & Max(4, w - 24) & "' height='"
                                        & Round(Tx / Max(1, gRptTxMax) * 150, 0) & "' fill='#005A9E'/>"
                                        & "<text x='" & (10 + (Idx - 1) * w + RoundDown(w / 2, 0)) & "' y='202'"
                                        & " text-anchor='middle' font-size='14'"
                                        & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                        & EncodeHTML(Lbl) & "</text>" )
                                    & "</svg>" ) ) )
                  - galRptCcy:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                      Properties:
                        # NEVER SUMMED ACROSS CURRENCIES — one tile each. Cross-currency
                        # conversion is out of scope, so there is no blended total.
                        Items: =Sort(colRptCcy, N, SortOrder.Descending)
                        WrapCount: =5
                        TemplateSize: =56
                        TemplatePadding: =0
                        TemplateFill: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        # SCROLLS, and two rows deep. The column has five values today, so
                        # WrapCount 5 fits exactly — which is precisely why a sixth added in
                        # SharePoint would have gone silently unreachable.
                        ShowScrollbar: =true
                        FillPortions: =0
                        LayoutMinHeight: =120
                        Width: =Parent.Width - 32
                        Height: =120
                      Children:
                        - colRptCcyBody:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =0
                              PaddingLeft: =8
                              PaddingRight: =8
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth - 8
                              Height: =Parent.TemplateHeight - 4
                            Children:
                              - lblRptCcyK:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =ThisItem.K & "   (" & ThisItem.N & ")"
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextMuted
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - lblRptCcyV:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =Text(ThisItem.Tot, "[$-en-US]#,###")
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.H3
                                    FontWeight: =FontWeight.Semibold
                                    Color: =gTheme.Color.TextPrimary
                                    FillPortions: =0
                                    LayoutMinHeight: =26
                                    Width: =Parent.Width
                                    Height: =26
                  - lblRptGridT:
                      Control: Label@2.5.1
                      Properties:
                        Text: |
                          ="Coverage x product type" &
                           If( gRptCoverage <> "All coverage", "   ·   " & gRptCoverage, "" )
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Body
                        FontWeight: =FontWeight.Semibold
                        Color: =gTheme.Color.TextPrimary
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =0
                        LayoutMinHeight: =22
                        Width: =Parent.Width - 32
                        Height: =22
                  # LEGIBILITY CEILING ~60 CELLS. Past that the heatmap is suppressed and
                  # the ranked gap list carries the section on its own — a grid nobody can
                  # read is worse than no grid.
                  - imgRptGrid:
                      Control: Image@2.2.3
                      Properties:
                        Visible: =gRptNCov * gRptNPrd <= 60 && gRptNCov > 0 && gRptNPrd > 0
                        ImagePosition: =ImagePosition.Fit
                        FillPortions: =0
                        LayoutMinHeight: =150
                        Width: =Parent.Width - 32
                        Height: =150
                        # Zero cells are DRAWN, hollow with a hairline border, so a gap is
                        # visible rather than absent. Shade is a whole-number alpha step.
                        # THE COMBO FILTERS THIS TOO. Selecting one coverage leaves exactly
                        # one row, so the row ordinal collapses to 1 rather than staying at
                        # the cell's index in the full grid — otherwise the single row drew
                        # at its original y and the chart looked empty. The heading said
                        # "filtered" while the picture showed everything.
                        Image: |
                          =With( { cw: RoundDown(760 / Max(1, gRptNPrd), 0),
                                   all: gRptCoverage = "All coverage" },
                              "data:image/svg+xml;charset=utf-8," & EncodeUrl(
                                  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 "
                                & (30 + If(all, gRptNCov, 1) * 40 + 10) & "'>"
                                & Concat( Filter(colRptGrid, Pi = 1 && (all || Cov = gRptCoverage)),
                                      "<text x='0' y='" & (30 + If(all, Ci - 1, 0) * 40 + 26)
                                    & "' font-size='15' font-family='Segoe UI, sans-serif' fill='#20262D'>"
                                    & EncodeHTML( If(Len(Cov) > 16, Left(Cov, 15) & "..", Cov) ) & "</text>" )
                                & Concat( Filter(colRptGrid, Ci = 1),
                                      "<text x='" & (140 + (Pi - 1) * cw + RoundDown(cw / 2, 0))
                                    & "' y='20' text-anchor='middle' font-size='13'"
                                    & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                    & EncodeHTML( If(Len(Prd) > 10, Left(Prd, 9) & "..", Prd) ) & "</text>" )
                                & Concat( Filter(colRptGrid, all || Cov = gRptCoverage),
                                      "<rect x='" & (140 + (Pi - 1) * cw) & "' y='"
                                    & (30 + If(all, Ci - 1, 0) * 40)
                                    & "' width='" & Max(4, cw - 4) & "' height='36' rx='4' fill='"
                                    & If(N = 0, "#FFFFFF", "#005A9E") & "' fill-opacity='"
                                    // The "%" belongs to the NUMERIC branch only. Appended
                                    // unconditionally it turned the empty-cell opacity into
                                    // fill-opacity='1%' — 1 percent, not fully opaque — so a
                                    // gap rendered as a near-invisible smudge rather than a
                                    // white cell with a hairline border.
                                    & If( N = 0, "1",
                                          Text( Max(15, Round(N / Max(1, gRptGridMax) * 100, 0)) ) & "%" )
                                    & "' stroke='" & If(N = 0, "#E1E5EB", "none")
                                    & "' stroke-width='1'/>"
                                    & "<text x='" & (140 + (Pi - 1) * cw + RoundDown(cw / 2, 0)) & "' y='"
                                    & (30 + If(all, Ci - 1, 0) * 40 + 23) & "' text-anchor='middle' font-size='14'"
                                    & " font-family='Segoe UI, sans-serif' fill='"
                                    & If(N = 0, "#B9C0C8", "#20262D") & "'>" & N & "</text>" )
                                & "</svg>" ) )
                  - lblRptGridSup:
                      Control: Label@2.5.1
                      Properties:
                        Visible: =gRptNCov * gRptNPrd > 60
                        Text: |
                          ="Grid suppressed — " & (gRptNCov * gRptNPrd)
                           & " cells is past the legible ceiling. The gap list below carries the section."
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        FillPortions: =0
                        LayoutMinHeight: =18
                        Width: =Parent.Width - 32
                        Height: =18
                  - lblRptUnmapped:
                      Control: Label@2.5.1
                      Properties:
                        Visible: =gRptUnmapped > 0
                        Text: |
                          =gRptUnmapped & If(gRptUnmapped = 1, " transaction has", " transactions have")
                           & " no client coverage or no product type, so they appear in NO cell above"
                           & " — the grid understates the period by that much."
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.Warning
                        FillPortions: =0
                        LayoutMinHeight: =18
                        Width: =Parent.Width - 32
                        Height: =18
                  - lblRptGapT:
                      Control: Label@2.5.1
                      Properties:
                        # SAME PREDICATE AS THE GALLERY BELOW. Counting every coverage while
                        # the list showed one made the header contradict what was on screen.
                        Text: |
                          ="Offering gaps   ("
                           & CountRows( Filter( colRptGrid,
                                                N = 0
                                             && ( gRptCoverage = "All coverage"
                                               || Cov = gRptCoverage ) ) ) & ")"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Body
                        FontWeight: =FontWeight.Semibold
                        Color: =gTheme.Color.TextPrimary
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =0
                        LayoutMinHeight: =22
                        Width: =Parent.Width - 32
                        Height: =22
                  - galRptGaps:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                      Properties:
                        # SIZED BY CLIENT COUNT, so the opportunity is quantified rather
                        # than merely listed. The coverage combo filters it and never
                        # refetches — colRptGrid is already in memory.
                        Items: |
                          =Sort(
                             Filter( colRptGrid,
                                     N = 0
                                  && ( gRptCoverage = "All coverage" || Cov = gRptCoverage ) ),
                             CN, SortOrder.Descending )
                        WrapCount: =1
                        TemplateSize: =32
                        TemplatePadding: =0
                        TemplateFill: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        ShowScrollbar: =true
                        FillPortions: =1
                        LayoutMinHeight: =90
                        Width: =Parent.Width - 32
                        Height: =Parent.Height - 480
                      Children:
                        - rowRptGapBody:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =10
                              PaddingLeft: =8
                              PaddingRight: =8
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight - 1
                            Children:
                              - cellRptGapTxt:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |
                                      =ThisItem.Cov & " — " & ThisItem.CN
                                       & If(ThisItem.CN = 1, " client", " clients")
                                       & ", no " & ThisItem.Prd & " transactions"
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextPrimary
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =240
                                    Height: =26
                        - rowRptGapLine:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =gTheme.Color.Border
                              X: =0
                              Y: =Parent.TemplateHeight - 1
                              Width: =Parent.TemplateWidth
                              Height: =1
            # ---- provenance --------------------------------------------------
            - lblRptProv:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    ="Window: " & Text(gRptFrom, "[$-en-US]d mmm yyyy") & " to today   ·   "
                     & "archived work excluded   ·   "
                     & If( Len(Coalesce(gRptTrunc, "")) > 0,
                           "TRUNCATED on " & gRptTrunc, "no fetch hit the row limit" )
                     & "   ·   notional is per currency only, never blended."
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  FillPortions: =0
                  LayoutMinHeight: =20
                  Width: =Parent.Width - 48
                  Height: =20
      # =====================================================================
      # PERSON OVERLAY — a panel, NOT a screen.
      # =====================================================================
      # A Navigate would cost a fresh OnVisible and throw away every fold, which
      # is the whole reason the folds exist. Declared after bodyRoot so it paints
      # over the content, and before appBar so the nav fly-out still floats above
      # it. BOTH parts are gated on gRptSelPerson: an ungated full-screen control
      # swallows every click on the screen beneath it, transparent or not.
      - ovlRptScrim:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =Len(Coalesce(gRptSelPerson, "")) > 0
            Text: =""
            Fill: =RGBA(32, 38, 45, 0.35)
            HoverFill: =RGBA(32, 38, 45, 0.35)
            PressedFill: =RGBA(32, 38, 45, 0.45)
            BorderThickness: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            # Clicking away closes it. The row tap toggles too, so the same person
            # can be reopened without hunting for the close icon.
            OnSelect: =Set( gRptSelPerson, "" )
