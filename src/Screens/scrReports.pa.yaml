                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =190
                        Height: =96
                      Children:
                        - lblRptOvdCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Overdue"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextMuted
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width - 32
                              Height: =18
                        - lblRptOvdVal:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Text(gRptOvdN)
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H1
                              FontWeight: =FontWeight.Semibold
                              Color: =If(gRptOvdN > 0, gTheme.Color.Danger, gTheme.Color.TextPrimary)
                              FillPortions: =0
                              LayoutMinHeight: =34
                              Width: =Parent.Width - 32
                              Height: =34
                        - lblRptOvdSub:
                            Control: Label@2.5.1
                            Properties:
                              # A GUARD IS NOT A DIVISION FIX. Before the load runs these
                              # globals are BLANK, not 0, so `= 0` does not reliably take
                              # the safe branch and the else arm divides blank by blank.
                              # Max() ignores blanks and returns 1, so the denominator
                              # cannot be zero whatever the comparison does; the If stays
                              # because it chooses the wording, not because it protects.
                              Text: |
                                =If( Coalesce(gRptOpenN, 0) = 0, "none open",
                                     RoundDown(gRptOvdN / Max(1, gRptOpenN) * 100, 0) & "% of open work" )
                              Font: =gTheme.Font
