                            Properties:
                              ImagePosition: =ImagePosition.Fit
                              FillPortions: =1
                              LayoutMinHeight: =120
                              Width: =Parent.Width - 32
                              Height: =Parent.Height - 80
                              # A PIE IS N STACKED CIRCLES, not arc paths: circumference 100 at
                              # r 15.9155, so a slice IS its percentage and no Cos/Sin appears
                              # anywhere. stroke-width 31.831 is 2r, which fills the stroke to
                              # the centre and makes the ring a disc. The fractions here are
                              # STRING LITERALS and never computed — a computed fraction goes
                              # through Text(), drags the locale decimal separator into the
                              # attribute, and the slice renders EMPTY. Everything Power Fx
                              # supplies (Pct, Off, the legend coordinates) is a whole number.
                              # dashoffset 125 - Off, not 25 - Off: the pattern repeats every
                              # 100 units so the two are the same rotation, and this one can
                              # never go negative.
                              Image: |
                                =With( { n: CountRows(colRptRgnPie) },
                                    "data:image/svg+xml;charset=utf-8," & EncodeUrl(
                                        "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 150'>"
                                      & "<g transform='translate(75 75) scale(2)'>"
                                      & "<circle cx='0' cy='0' r='15.9155' fill='none'"
                                      & " stroke='#EEF1F5' stroke-width='31.831'/>"
                                      & Concat( colRptRgnPie,
                                            "<circle cx='0' cy='0' r='15.9155' fill='none' stroke='"
                                          & Hx & "' stroke-width='31.831' stroke-dasharray='"
                                          & Pct & " " & (100 - Pct) & "' stroke-dashoffset='"
                                          & (125 - Off) & "'/>" )
                                      & "</g>"
                                      & Concat( colRptRgnPie,
                                            "<rect x='160' y='" & ((Li - 1) * 22 + 10)
                                          & "' width='10' height='10' rx='2' fill='" & Hx & "'/>"
                                          & "<text x='176' y='" & ((Li - 1) * 22 + 19)
                                          & "' font-size='13' font-family='Segoe UI, sans-serif'"
                                          & " fill='#20262D'>"
                                          & EncodeHTML( If(Len(K) > 16, Left(K, 15) & "..", K) ) & "</text>"
                                          & "<text x='318' y='" & ((Li - 1) * 22 + 19)
                                          & "' text-anchor='end' font-size='13'"
                                          & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                          & N & "</text>" )
                                      & If( n = 0,
                                            "<text x='230' y='79' text-anchor='middle' font-size='14'"
                                          & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                          & "No open tasks</text>", "" )
                                      & "</svg>" ) )
            # =============================================================
            # BAND 4 — how projects are trending
            # =============================================================
            # BUILT ENTIRELY FROM DATED EVENTS. project_perc_completion, task_stage and
            # project_phase are CURRENT STATE with no snapshot anywhere, so "completion
            # over time" is impossible natively — every series here comes from
            # project_date_start / project_date_complete instead.
            - pnlRptTrend:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =6
                  PaddingTop: =12
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  Fill: =gTheme.Color.Surface
                  BorderColor: =gTheme.Color.Border
                  BorderThickness: =1
                  FillPortions: =0
                  LayoutMinHeight: =320
                  Width: =Parent.Width - 48
                  Height: =320
                Children:
                  - lblRptTrendT:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Projects started, completed, and net open"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.H3
                        FontWeight: =FontWeight.Semibold
                        Color: =gTheme.Color.Primary
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =0
                        LayoutMinHeight: =24
                        Width: =Parent.Width - 32
                        Height: =24
                  - lblRptTrendS:
                      Control: Label@2.5.1
                      Properties:
                        Text: |
                          ="Blue bars started · green bars completed · line is cumulative net open. "
                           & "Archived projects are outside the query, so their completions are not counted."
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        FillPortions: =0
                        LayoutMinHeight: =16
                        Width: =Parent.Width - 32
                        Height: =16
                  # ONE SCALE for all three series — they are all project counts, so a
                  # second axis would only make the line look bigger than it is.
                  - imgRptTrend:
                      Control: Image@2.2.3
                      Properties:
                        ImagePosition: =ImagePosition.Fit
                        FillPortions: =1
                        LayoutMinHeight: =160
                        Width: =Parent.Width - 32
                        Height: =Parent.Height - 80
                        Image: |
                          =With( { n: Max(1, CountRows(colRptBuckets)) },
                              With( { w: RoundDown(880 / n, 0) },
                                  "data:image/svg+xml;charset=utf-8," & EncodeUrl(
                                      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 300'>"
                                    & "<line x1='0' y1='250' x2='900' y2='250' stroke='#E1E5EB' stroke-width='2'/>"
                                    & Concat( colRptBuckets,
                                          "<rect x='" & (10 + (Idx - 1) * w) & "' y='"
                                        & (250 - Round(St / Max(1, gRptTrendMax) * 210, 0)) & "' width='"
                                        & Max(3, RoundDown(w / 2, 0) - 4) & "' height='"
                                        & Round(St / Max(1, gRptTrendMax) * 210, 0) & "' fill='#005A9E'/>"
                                        & "<rect x='" & (10 + (Idx - 1) * w + RoundDown(w / 2, 0)) & "' y='"
                                        & (250 - Round(Cp / Max(1, gRptTrendMax) * 210, 0)) & "' width='"
                                        & Max(3, RoundDown(w / 2, 0) - 4) & "' height='"
                                        & Round(Cp / Max(1, gRptTrendMax) * 210, 0) & "' fill='#31825D'/>"
                                        & "<text x='" & (10 + (Idx - 1) * w + RoundDown(w / 2, 0)) & "' y='272'"
                                        & " text-anchor='middle' font-size='15'"
                                        & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                        & EncodeHTML(Lbl) & "</text>" )
                                    & "<polyline fill='none' stroke='#D69828' stroke-width='4'"
                                    & " stroke-linejoin='round' points='"
                                    & Concat( colRptBuckets,
                                          (10 + (Idx - 1) * w + RoundDown(w / 2, 0)) & ","
                                        & (250 - Round(Net / Max(1, gRptTrendMax) * 210, 0)) & " " )
                                    & "'/>"
                                    & "</svg>" ) ) )
                  - rowRptAge:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =20
                        FillPortions: =0
                        LayoutMinHeight: =30
                        Width: =Parent.Width - 32
                        Height: =30
                      Children:
                        - lblRptAge:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                ="Open projects by age:   <30d " & gRptAgeA
                                 & "    30-90d " & gRptAgeB
                                 & "    90-180d " & gRptAgeC
                                 & "    180d+ " & gRptAgeD
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =2
                              LayoutMinWidth: =320
                              Height: =30
                        - lblRptStall:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                ="Stalled " & gRptStalled & "    ·    no target date " & gRptNoTarget
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              FontWeight: =FontWeight.Semibold
                              Color: |
                                =If( gRptStalled > 0, gTheme.Color.Danger, gTheme.Color.TextMuted )
                              Align: =Align.Right
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =1
                              LayoutMinWidth: =200
                              Height: =30
            # =============================================================
            # BAND 5 — transactions (secondary)
            # =============================================================
            # THREE COLUMNS, READ LEFT TO RIGHT AS WHO, WHEN, WHAT: the leads who own the
            # desks the trades sit on, the trend over the window, the product mix. Reading
            # one against the others is the point of the band.
            #
            # FillPortions 1 : 2 : 2 — the trend and the pies carry 900- and 320-wide
            # viewBoxes and need the room; the lead bars are a six-row list and do not. The
            # minimums add to ~1120px before the row overflows, in line with band 3.
            - rowRptTx:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =gTheme.Space.Gap
                  FillPortions: =0
                  LayoutMinHeight: =360
                  Width: =Parent.Width - 48
                  Height: =360
                Children:
                  - pnlRptLd:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =6
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =280
                        Height: =360
                      Children:
                        - lblRptLdT:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Project leads by transaction count"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H3
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.Primary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =24
                              Width: =Parent.Width - 32
                              Height: =24
                        # THE BASIS IS ON THE FACE OF THE PANEL. This is the measure that was
                        # wrong beside the per-person TASK figures and is right here: it counts
                        # trades booked to projects the person MANAGES, which is neither their
                        # own task work nor sales credit.
                        - lblRptLdS:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                ="Top 6 by count of transactions on projects they manage. "
                                 & "A count, never a notional — those are never blended."
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              FillPortions: =0
                              LayoutMinHeight: =32
                              Width: =Parent.Width - 32
                              Height: =32
                        - imgRptLd:
                            Control: Image@2.2.3
                            Properties:
                              ImagePosition: =ImagePosition.Fit
                              FillPortions: =1
                              LayoutMinHeight: =120
                              Width: =Parent.Width - 32
                              Height: =Parent.Height - 90
                              # Same bar shape as the requestor chart, and the viewBox height is
                              # COMPUTED for the same reason: the row count is top-6-plus-Other
                              # and is not known at author time.
                              Image: |
                                =With( { n: Max(1, CountRows(colRptLdBar)) },
                                  "data:image/svg+xml;charset=utf-8," & EncodeUrl(
                                      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 "
                                    & (n * 44 + 16) & "'>"
                                    & Concat( colRptLdBar,
                                          "<text x='0' y='" & ((Idx - 1) * 44 + 26)
                                        & "' font-size='17' font-family='Segoe UI, sans-serif' fill='#20262D'>"
                                        & EncodeHTML( If(Len(K) > 22, Left(K, 21) & "..", K) ) & "</text>"
                                        & "<rect x='210' y='" & ((Idx - 1) * 44 + 12)
                                        & "' width='330' height='20' rx='10' fill='#EEF1F5'/>"
                                        & "<rect x='210' y='" & ((Idx - 1) * 44 + 12) & "' width='"
                                        & Max(2, Round(N / Max(1, gRptLdMax) * 330, 0))
                                        & "' height='20' rx='10' fill='"
                                        & If( K = "Other" || K = "Unassigned", "#B9C0C8", "#005A9E" ) & "'/>"
                                        & "<text x='598' y='" & ((Idx - 1) * 44 + 27)
                                        & "' text-anchor='end' font-size='16'"
                                        & " font-family='Segoe UI, sans-serif' fill='#6E7882'>" & N & "</text>" )
                                    & If( n = 0 || CountRows(colRptTxEnriched) = 0,
                                          "<text x='300' y='30' text-anchor='middle' font-size='16'"
                                        & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                        & "No transactions in this window</text>", "" )
                                    & "</svg>" ) )
                  - pnlRptTx:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =8
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =2
                        LayoutMinWidth: =420
                        Height: =360
                      Children:
                        - lblRptTxT:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Transactions"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H3
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.Primary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =24
                              Width: =Parent.Width - 32
                              Height: =24
                        - imgRptTxTrend:
                            Control: Image@2.2.3
                            Properties:
                              ImagePosition: =ImagePosition.Fit
                              FillPortions: =1
                              LayoutMinHeight: =130
                              Width: =Parent.Width - 32
                              Height: =130
                              # Current window SPLIT BY CURRENCY, prior window greyed BEHIND it.
                              # THE SEGMENTS ARE A SEPARATE Concat over colRptTxSeg, not one nested
                              # inside the bucket Concat: colRptTxSeg carries its own bucket index
                              # Bi, so the x position is computed from the row rather than from an
                              # outer record scope. A nested Concat would have to reach the outer
                              # Idx, and that is exactly the ambiguity that fails at paste time.
                              # Each segment's height is the DIFFERENCE of two rounded tops, so the
                              # stack cannot drift past the total the bar is scaled to.
                              Image: |
                                =With( { n: Max(1, CountRows(colRptBuckets)) },
                                    With( { w: RoundDown(880 / n, 0) },
                                        "data:image/svg+xml;charset=utf-8," & EncodeUrl(
                                            "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 220'>"
                                          & "<line x1='0' y1='180' x2='900' y2='180' stroke='#E1E5EB' stroke-width='2'/>"
                                          & Concat( colRptBuckets,
                                                "<rect x='" & (10 + (Idx - 1) * w) & "' y='"
                                              & (180 - Round(TxP / Max(1, gRptTxMax) * 150, 0)) & "' width='"
                                              & Max(4, w - 12) & "' height='"
                                              & Round(TxP / Max(1, gRptTxMax) * 150, 0) & "' fill='#E1E5EB'/>"
                                              & "<text x='" & (10 + (Idx - 1) * w + RoundDown(w / 2, 0)) & "' y='202'"
                                              & " text-anchor='middle' font-size='14'"
                                              & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                              & EncodeHTML(Lbl) & "</text>" )
                                          & Concat( colRptTxSeg,
                                                "<rect x='" & (10 + (Bi - 1) * w + 6) & "' y='"
                                              & (180 - Round((Base + N) / Max(1, gRptTxMax) * 150, 0))
                                              & "' width='" & Max(4, w - 24) & "' height='"
                                              & Max( 1, Round((Base + N) / Max(1, gRptTxMax) * 150, 0)
                                                        - Round(Base / Max(1, gRptTxMax) * 150, 0) )
                                              & "' fill='" & Hx & "'/>" )
                                          & "</svg>" ) ) )
                        - galRptCcy:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                            Properties:
                              # NEVER SUMMED ACROSS CURRENCIES — one tile each. Cross-currency
                              # conversion is out of scope, so there is no blended total.
                              Items: =Sort(colRptCcy, N, SortOrder.Descending)
                              WrapCount: =5
                              TemplateSize: =56
                              TemplatePadding: =0
                              TemplateFill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              # SCROLLS, and two rows deep. The column has five values today, so
                              # WrapCount 5 fits exactly — which is precisely why a sixth added in
                              # SharePoint would have gone silently unreachable.
                              ShowScrollbar: =true
                              FillPortions: =0
                              LayoutMinHeight: =120
                              Width: =Parent.Width - 32
                              Height: =120
                            Children:
                              - colRptCcyBody:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutGap: =0
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth - 8
                                    Height: =Parent.TemplateHeight - 4
                                  Children:
                                    # THE TILE IS THE CHART'S LEGEND. Same Switch as colRptTxSeg's
                                    # Hx, keyed on the currency value so the two cannot drift apart
                                    # — a swatch that disagrees with the bar is worse than none.
                                    - lblRptCcyK:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =ThisItem.K & "   (" & ThisItem.N & ")"
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Small
                                          FontWeight: =FontWeight.Semibold
                                          Color: |
                                            =Switch( ThisItem.K,
                                                     "EUR", RGBA(0, 90, 158, 1),
                                                     "USD", RGBA(46, 139, 154, 1),
                                                     "GBP", RGBA(214, 152, 40, 1),
                                                     "JPY", RGBA(122, 111, 176, 1),
                                                     "CHF", RGBA(192, 95, 60, 1),
                                                            RGBA(74, 158, 99, 1) )
                                          FillPortions: =0
                                          LayoutMinHeight: =18
                                          Width: =Parent.Width
                                          Height: =18
                                    - lblRptCcyV:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =Text(ThisItem.Tot, "[$-en-US]#,###")
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.H3
                                          FontWeight: =FontWeight.Semibold
                                          Color: =gTheme.Color.TextPrimary
                                          FillPortions: =0
                                          LayoutMinHeight: =26
                                          Width: =Parent.Width
                                          Height: =26
                  - pnlRptPrd:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =6
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =2
                        LayoutMinWidth: =420
                        Height: =360
                      Children:
                        - lblRptPrdT:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Transactions by product type"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H3
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.Primary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =24
                              Width: =Parent.Width - 32
                              Height: =24
                        # Unclassified is A REAL SLICE, not a dropped row: a product with no
                        # type path still traded, and hiding it would make the pie disagree
                        # with the transaction count beside it.
                        - lblRptPrdS:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                ="Level 1 left, level 2 right — top 5 and Other on each. "
                                 & "A product whose path has only one segment counts under "
                                 & "Top level only rather than being dropped."
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              FillPortions: =0
                              LayoutMinHeight: =32
                              Width: =Parent.Width - 32
                              Height: =32
                        # SIDE BY SIDE, not stacked: two 320x150 charts read as a pair at a
                        # glance, and stacked they wasted the panel's width while cramping its
                        # height. Each takes half the row, and ImagePosition.Fit keeps the
                        # aspect — so they shrink together rather than distorting.
                        - rowRptPrdPies:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =8
                              FillPortions: =1
                              LayoutMinHeight: =120
                              Width: =Parent.Width - 32
                              Height: =Parent.Height - 90
                            Children:
                              - imgRptPrd:
                                  Control: Image@2.2.3
                                  Properties:
                                    ImagePosition: =ImagePosition.Fit
                                    FillPortions: =1
                                    LayoutMinWidth: =150
                                    Width: =(Parent.Width - 8) / 2
                                    Height: =Parent.Height
                                    # Same construction as the band-3 pies — circumference 100 at
                                    # r 15.9155, stroke-width 2r so the ring is a disc, and every
                                    # value Power Fx supplies is a whole number.
                                    Image: |
                                      =With( { n: CountRows(colRptPrdPie) },
                                          "data:image/svg+xml;charset=utf-8," & EncodeUrl(
                                              "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 150'>"
                                            & "<g transform='translate(75 75) scale(2)'>"
                                            & "<circle cx='0' cy='0' r='15.9155' fill='none'"
                                            & " stroke='#EEF1F5' stroke-width='31.831'/>"
                                            & Concat( colRptPrdPie,
                                                  "<circle cx='0' cy='0' r='15.9155' fill='none' stroke='"
                                                & Hx & "' stroke-width='31.831' stroke-dasharray='"
                                                & Pct & " " & (100 - Pct) & "' stroke-dashoffset='"
                                                & (125 - Off) & "'/>" )
                                            & "</g>"
                                            & Concat( colRptPrdPie,
                                                  "<rect x='160' y='" & ((Li - 1) * 22 + 10)
                                                & "' width='10' height='10' rx='2' fill='" & Hx & "'/>"
                                                & "<text x='176' y='" & ((Li - 1) * 22 + 19)
                                                & "' font-size='13' font-family='Segoe UI, sans-serif'"
                                                & " fill='#20262D'>"
                                                & EncodeHTML( If(Len(K) > 16, Left(K, 15) & "..", K) ) & "</text>"
                                                & "<text x='318' y='" & ((Li - 1) * 22 + 19)
                                                & "' text-anchor='end' font-size='13'"
                                                & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                                & N & "</text>" )
                                            & If( n = 0,
                                                  "<text x='230' y='79' text-anchor='middle' font-size='14'"
                                                & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                                & "No transactions in this window</text>", "" )
                                            & "</svg>" ) )
                              - imgRptPr2:
                                  Control: Image@2.2.3
                                  Properties:
                                    ImagePosition: =ImagePosition.Fit
                                    FillPortions: =1
                                    LayoutMinWidth: =150
                                    Width: =(Parent.Width - 8) / 2
                                    Height: =Parent.Height
                                    # Same construction as the band-3 pies — circumference 100 at
                                    # r 15.9155, stroke-width 2r so the ring is a disc, and every
                                    # value Power Fx supplies is a whole number.
                                    Image: |
                                      =With( { n: CountRows(colRptPr2Pie) },
                                          "data:image/svg+xml;charset=utf-8," & EncodeUrl(
                                              "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 150'>"
                                            & "<g transform='translate(75 75) scale(2)'>"
                                            & "<circle cx='0' cy='0' r='15.9155' fill='none'"
                                            & " stroke='#EEF1F5' stroke-width='31.831'/>"
                                            & Concat( colRptPr2Pie,
                                                  "<circle cx='0' cy='0' r='15.9155' fill='none' stroke='"
                                                & Hx & "' stroke-width='31.831' stroke-dasharray='"
                                                & Pct & " " & (100 - Pct) & "' stroke-dashoffset='"
                                                & (125 - Off) & "'/>" )
                                            & "</g>"
                                            & Concat( colRptPr2Pie,
                                                  "<rect x='160' y='" & ((Li - 1) * 22 + 10)
                                                & "' width='10' height='10' rx='2' fill='" & Hx & "'/>"
                                                & "<text x='176' y='" & ((Li - 1) * 22 + 19)
                                                & "' font-size='13' font-family='Segoe UI, sans-serif'"
                                                & " fill='#20262D'>"
                                                & EncodeHTML( If(Len(K) > 16, Left(K, 15) & "..", K) ) & "</text>"
                                                & "<text x='318' y='" & ((Li - 1) * 22 + 19)
                                                & "' text-anchor='end' font-size='13'"
                                                & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                                & N & "</text>" )
                                            & If( n = 0,
                                                  "<text x='230' y='79' text-anchor='middle' font-size='14'"
                                                & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                                & "No transactions in this window</text>", "" )
                                            & "</svg>" ) )
            # ---- provenance --------------------------------------------------
            - lblRptProv:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    ="Window: " & Text(gRptFrom, "[$-en-US]d mmm yyyy") & " to today   ·   "
                     & "archived work excluded   ·   "
                     & If( Len(Coalesce(gRptTrunc, "")) > 0,
                           "TRUNCATED on " & gRptTrunc, "no fetch hit the row limit" )
                     & "   ·   notional is per currency only, never blended."
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  FillPortions: =0
                  LayoutMinHeight: =20
                  Width: =Parent.Width - 48
                  Height: =20
      # =====================================================================
      # PERSON OVERLAY — a panel, NOT a screen.
      # =====================================================================
      # A Navigate would cost a fresh OnVisible and throw away every fold, which
      # is the whole reason the folds exist. Declared after bodyRoot so it paints
      # over the content, and before appBar so the nav fly-out still floats above
      # it. BOTH parts are gated on gRptSelPerson: an ungated full-screen control
      # swallows every click on the screen beneath it, transparent or not.
      - ovlRptScrim:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =Len(Coalesce(gRptSelPerson, "")) > 0
            Text: =""
            Fill: =RGBA(32, 38, 45, 0.35)
            HoverFill: =RGBA(32, 38, 45, 0.35)
            PressedFill: =RGBA(32, 38, 45, 0.45)
            BorderThickness: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            # Clicking away closes it. The row tap toggles too, so the same person
            # can be reopened without hunting for the close icon.
            OnSelect: =Set( gRptSelPerson, "" )
      - ovlRptCard:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Visible: =Len(Coalesce(gRptSelPerson, "")) > 0
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Start
            LayoutGap: =8
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =16
            PaddingBottom: =16
            PaddingLeft: =20
            PaddingRight: =20
            Fill: =gTheme.Color.Surface
            BorderColor: =gTheme.Color.Border
            BorderThickness: =1
            # 912 IS 760 + 20%. Both guards matter now that the card is wide enough to
            # approach a narrow window: Min stops it overflowing the screen, and Max stops
            # the centring arithmetic pushing X negative and hanging it off the left edge.
            # Neither reads Self, so there is no circular reference between X and Width.
            X: =Max(0, (Parent.Width - 912) / 2)
            Y: =80
            Width: =Min(912, Parent.Width)
            Height: =Parent.Height - 160
          Children:
            - rowRptOvlHead:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =12
                  FillPortions: =0
                  LayoutMinHeight: =34
                  Width: =Parent.Width - 40
                  Height: =34
                Children:
                  - lblRptOvlName:
                      Control: Label@2.5.1
                      Properties:
                        Text: =gRptSelName
                        Font: =gTheme.Font
                        Size: =gTheme.Size.H2
                        FontWeight: =FontWeight.Semibold
                        Color: =gTheme.Color.TextPrimary
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =1
                        LayoutMinWidth: =200
                        Height: =34
                  - icoRptOvlClose:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Icon: =Icon.Cancel
                        Color: =gTheme.Color.TextMuted
                        HoverColor: =gTheme.Color.Danger
                        HoverFill: =gTheme.Color.Hover
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        Tooltip: ="Close"
                        FillPortions: =0
                        LayoutMinWidth: =24
                        Width: =24
                        Height: =24
                        OnSelect: =Set( gRptSelPerson, "" )
            # Reads the SELECTED ROW, which is the same fold the gallery renders —
            # recomputing these here would be a second definition of the same number.
            - lblRptOvlStats:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    ="Owns " & gRptSelRow.Owns & "   ·   supports " & gRptSelRow.Sups
                     & "   ·   overdue " & gRptSelRow.Ovd
                     & "   ·   completed " & gRptSelRow.Dn
                     & "   ·   median " & If(gRptSelRow.Med < 0, "—", gRptSelRow.Med & "d")
                     & "   ·   on-time " & If(gRptSelRow.OnTp < 0, "—", gRptSelRow.OnTp & "%")
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinHeight: =22
                  Width: =Parent.Width - 40
                  Height: =22
            - lblRptOvlBasis:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    ="Every task this person leads or supports — open work, plus anything "
                     & "finished inside the selected period. A task held in both roles is "
                     & "listed once."
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  FillPortions: =0
                  LayoutMinHeight: =32
                  Width: =Parent.Width - 40
                  Height: =32
            # THE CAPTIONS LINE UP BY CONSTRUCTION, not by eye: PaddingLeft 8 and LayoutGap 8
            # over widths 280/90/70/84 put each caption at 8, 296, 394, 472, 564 — exactly the
            # absolute X the gallery template below uses. Change one and change both.
            # THE CAPTIONS AND THE ROW BELOW SHARE FillPortions AND LayoutMinWidth, PAIR FOR
            # PAIR, and neither declares an X or a Width. That is the idiom the people table
            # already uses, and it is the reason the columns cannot drift apart: the layout
            # engine derives both from the same portions against the same width. An earlier
            # version positioned the cells absolutely on a hand-computed X grid and the row
            # overlapped — a modern Label does not hold a declared Width the way that
            # arithmetic assumed.
            - rowRptOvlTaskHead:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  Fill: =gTheme.Color.Bg
                  FillPortions: =0
                  LayoutMinHeight: =24
                  Width: =Parent.Width - 40
                  Height: =24
                Children:
                  - hdRptOvlTNm:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Task"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =4
                        LayoutMinWidth: =180
                        Height: =24
                  - hdRptOvlStg:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Status"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =1
                        LayoutMinWidth: =80
                        Height: =24
                  # A BLANK CAPTION OVER THE HEALTH DOT. The dot is its own column so the
                  # row needs no nested container, and pairing stays one caption to one cell —
                  # which is the whole guarantee. "Health" sits over the word beside it.
                  - hdRptOvlDot:
                      Control: Label@2.5.1
                      Properties:
                        Text: =""
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =0
                        LayoutMinWidth: =14
                        Height: =24
                  - hdRptOvlHth:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Health"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =1
                        LayoutMinWidth: =62
                        Height: =24
                  - hdRptOvlDst:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Opened"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =1
                        LayoutMinWidth: =80
                        Height: =24
                  - hdRptOvlDtl:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Due"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =2
                        LayoutMinWidth: =150
                        Height: =24
            - galRptOvlTask:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                Properties:
                  # ALREADY SORTED IN THE FOLD. Re-sorting here would scan the collection
                  # on every repaint for an order that cannot have changed.
                  Items: =colRptPTask
                  WrapCount: =1
                  TemplateSize: =34
                  TemplatePadding: =0
                  TemplateFill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  ShowScrollbar: =true
                  FillPortions: =1
                  LayoutMinHeight: =200
                  Width: =Parent.Width - 40
                  Height: =Parent.Height - 200
                Children:
                  # ONE AUTO-LAYOUT CHILD holding every cell, exactly as the people gallery
                  # does. The separator is the template's only other child and stays absolute,
                  # because it is positioned against the template rather than the row.
                  - rowRptOvlTaskBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight - 1
                      Children:
                        - cellRptOvlTNm:
                            Control: Label@2.5.1
                            Properties:
                              Text: =ThisItem.TNm
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Body
                              Color: =gTheme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =4
                              LayoutMinWidth: =180
                              Height: =32
                        - cellRptOvlStg:
                            Control: Label@2.5.1
                            Properties:
                              Text: =ThisItem.Stg
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =1
                              LayoutMinWidth: =80
                              Height: =32
                        # A DOT, not a coloured word: the health vocabulary IS colour names,
                        # and "Green" printed in green says the same thing twice.
                        - dotRptOvlHth:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: |
                                =Switch( ThisItem.Hth,
                                         "Green", gTheme.Color.Success,
                                         "Amber", gTheme.Color.Warning,
                                         "Red",   gTheme.Color.Danger,
                                                  gTheme.Color.Border )
                              FillPortions: =0
                              LayoutMinWidth: =14
                              Height: =10
                        - cellRptOvlHth:
                            Control: Label@2.5.1
                            Properties:
                              Text: =ThisItem.Hth
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =1
                              LayoutMinWidth: =62
                              Height: =32
                        - cellRptOvlDst:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                =If( IsBlank(ThisItem.Dst), "—",
                                     Text(ThisItem.Dst, "[$-en-US]d mmm yy") )
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =1
                              LayoutMinWidth: =80
                              Height: =32
                        # THE PARENTHETICAL IS ONLY ON OPEN WORK. Days left against today is
                        # meaningless once a task is finished, and printing it there would
                        # invite someone to read a completed task as overdue.
                        - cellRptOvlDtl:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                =If( IsBlank(ThisItem.Dtl), "—",
                                     Text(ThisItem.Dtl, "[$-en-US]d mmm yy")
                                     & If( ThisItem.Op <> 1, "",
                                           With( { d: DateDiff(Today(), ThisItem.Dtl, TimeUnit.Days) },
                                               If( d < 0, "  (" & -d & "d overdue)",
                                                   d = 0,  "  (due today)",
                                                           "  (" & d & "d left)" ) ) ) )
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: |
                                =If( ThisItem.Op = 1 && !IsBlank(ThisItem.Dtl)
                                     && ThisItem.Dtl < Today(),
                                     gTheme.Color.Danger, gTheme.Color.TextMuted )
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =2
                              LayoutMinWidth: =150
                              Height: =32
                  - rowRptOvlTaskLine:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =gTheme.Color.Border
                        X: =0
                        Y: =Parent.TemplateHeight - 1
                        Width: =Parent.TemplateWidth
                        Height: =1
            - lblRptOvlTaskEmpty:
                Control: Label@2.5.1
                Properties:
                  Visible: =IsEmpty(colRptPTask)
                  Text: ="No tasks in this role for the selected period."
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  FillPortions: =0
                  LayoutMinHeight: =20
                  Width: =Parent.Width - 40
                  Height: =20
      # ---- The whole shell is one component: header bar + fly-out nav rail ----
      # DECLARED LAST so positional z-order floats the fly-out over the content.
      - appBar:
          Control: CanvasComponent
          ComponentName: cmpAppBar
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =If(gNavOpen, Parent.Height, gTheme.Space.HeaderH)
            Items: =gNavMenu
            ActiveKey: =2
            AppTitle: ="EQD Taskmaster"
            ScreenTitle: ="Reports"
            IsOpen: =gNavOpen
            OnToggle: =Set(gNavOpen, !gNavOpen)
            OnNavigate: |
              =Switch( appBar.SelectedKey,
                       1, Navigate(scrHome, ScreenTransition.Fade),
                       2, Navigate(scrReports, ScreenTransition.Fade),
                       3, Navigate(scrProjects, ScreenTransition.Fade),
                          Navigate(scrReference, ScreenTransition.Fade) );
              Set(gNavOpen, false)
