            # =============================================================
            # BAND 4 — how projects are trending
            # =============================================================
            # BUILT ENTIRELY FROM DATED EVENTS. project_perc_completion, task_stage and
            # project_phase are CURRENT STATE with no snapshot anywhere, so "completion
            # over time" is impossible natively — every series here comes from
            # project_date_start / project_date_complete instead.
            - pnlRptTrend:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =6
                  PaddingTop: =12
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  Fill: =gTheme.Color.Surface
                  BorderColor: =gTheme.Color.Border
                  BorderThickness: =1
                  FillPortions: =0
                  LayoutMinHeight: =320
                  Width: =Parent.Width - 48
                  Height: =320
                Children:
                  - lblRptTrendT:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Projects started, completed, and net open"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.H3
                        FontWeight: =FontWeight.Semibold
                        Color: =gTheme.Color.Primary
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =0
                        LayoutMinHeight: =24
                        Width: =Parent.Width - 32
                        Height: =24
                  - lblRptTrendS:
                      Control: Label@2.5.1
                      Properties:
                        Text: |
                          ="Blue bars started · green bars completed · line is cumulative net open. "
                           & "Archived projects are outside the query, so their completions are not counted."
