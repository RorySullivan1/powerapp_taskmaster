# =============================================================================
# scrReports  —  native analytics. Power BI is OUT OF SCOPE; every chart here is
# SVG in an Image control. Design note: docs/reports-screen-design.md.
#
# BANDS: 0 period + scope strips, refresh, truncation banner · 1 desk pulse ·
# 2 people, sortable, with an inline SVG health bar · 3 where the work sits ·
# 4 project trend + ageing · 5 transactions · provenance. The person overlay is
# a panel, not a screen, so the folds survive it.
#
# ARCHITECTURE — fetch bounded, fold once, render from folds.
#   * Every fact fetch is delegable and date- or state-bounded.
#   * Everything renders from small pre-aggregated collections. NO CountRows,
#     LookUp or Filter over a fact collection may appear in a gallery Items or
#     row property — that is the N+1, and a 40-row people gallery each scanning
#     800 tasks is 32,000 row-scans PER REPAINT.
#
# EVERY DENOMINATOR IN A PROPERTY FORMULA IS WRAPPED IN Max(1, ...) AT THE POINT
# OF USE, even where the global was already Set with Max(1, ...). A property
# formula is evaluated in the EDITOR, where the load has never run and every
# global is BLANK — and blank divides as zero. Setting the guard at load time
# protects the running app and does nothing for the editor. An `If(x = 0, ...)`
# guard does not help either: blank is not reliably equal to 0 for an untyped
# global, so the else arm is what runs. Max() ignores blanks and returns 1.
# The divisions inside btnRptLoad.OnSelect are exempt — a behaviour formula runs
# only when invoked, by which point the Sets above it have happened.
#
# THE LOAD LIVES IN ONE PLACE — btnRptLoad.OnSelect — and OnVisible, the refresh
# icon and the period strip all reach it with Select(). MS Learn is explicit that
# "Select QUEUES the target OnSelect for later processing... it does not cause it
# to evaluate immediately, nor does it wait": so nothing may read a fold in the
# same formula that Selects the loader. Nothing here does — the bands are
# declarative over the collections and simply repaint when they fill.
#
# BANDS: header 0..64 absolute, control bar 64..136 absolute (fixed, outside the
# scroll), bodyRoot 136..bottom vertical auto-layout with LayoutOverflowY Scroll.
# Sections stack, so there is NO manual Y arithmetic below the control bar.
# =============================================================================
Screens:
  scrReports:
    Properties:
      Fill: =gTheme.Color.Bg
      # Defaults + the reload guard, and nothing else. The fetches are in
      # btnRptLoad so that the period strip and the refresh icon run the same
      # code rather than three copies that drift apart.
      OnVisible: |
        =
        // SELF-HEAL. App.OnStart is NON-BLOCKING, so this screen can run before it
        // finishes; a blank gUserEmail makes every "mine" test match nothing, and these
        // are imperative Sets that never re-fire.
        If( IsBlank(gUserEmail), Set( gUserEmail, Lower(User().Email) ) );
        If( IsBlank(gRptPeriod), Set( gRptPeriod, "1QTR" ) );
        // Scope holds a project manager's EMAIL, or "" for All. IsBlank cannot seed it —
        // "" is the All value and is itself blank — so it is set unconditionally.
        Set( gRptScope, Coalesce(gRptScope, "") );
        If( IsBlank(gRptSort),   Set( gRptSort, "Owns" ); Set( gRptSortDesc, true ) );
        Set( gRptSelPerson, "" );
        // Refetch ONLY when the period changed, or on the first visit. A revisit with
        // the same window repaints from folds already in memory.
        Set( gRptKey, gRptPeriod );
        If( gRptKey <> gRptLoadedKey, Select( btnRptLoad ) )
    Children:
      # =====================================================================
      # THE LOAD. One copy, reached with Select() from three places.
      # =====================================================================
      # Hidden, and Visible: =false is safe — Select fires regardless of
      # visibility. It must NOT be disabled: Select does nothing on a control
      # whose DisplayMode is Disabled.
      - btnRptLoad:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =false
            Text: =""
            X: =0
            Y: =0
            Width: =1
            Height: =1
            # EVERY ClearCollect NAMES ITS COLUMNS. Explicit Column Selection is on by
            # default and trims retrieved columns to those it can prove are used;
            # Microsoft documents that column lineage is occasionally lost when data
            # moves through collections and variables, and ECS then drops the column.
            # This is the most collection-heavy screen in the app. A dropped column
            # renders as a blank number, which across the one-way gap comes back only
            # as "it didn't work".
            OnSelect: |
              =Set( gRptBusy, true );
              // ---- the window ------------------------------------------------------
              // A QUARTER IS THE WIDEST USEFUL WINDOW: the archive flow takes work out of
              // these lists at roughly 100 days, so a year-long window would report a
              // year of history over rows that no longer exist and read as a collapse in
              // activity. Three rolling windows, no calendar anchoring — a calendar
              // quarter put gRptFrom ON Today() every 1 April, and every span derived
              // from it collapsed to zero.
              Set( gRptSpanDays,
                   Switch( gRptPeriod, "1W", 7, "1M", 30, "1QTR", 90, 90 ) );
              Set( gRptFrom, DateAdd( Today(), -gRptSpanDays, TimeUnit.Days ) );
              // Exactly ONE window before gRptFrom. The prior-period delta has to compare
              // equal spans or it is measuring two differently sized things; the old
              // 14-day floor silently made the 1W comparison the window 21-28 days back.
              // One transaction fetch from here serves current, prior and the trend bars.
              Set( gRptFrom2x, DateAdd( gRptFrom, -gRptSpanDays, TimeUnit.Days ) );
              // BAR GRANULARITY FOLLOWS THE WINDOW. Month buckets over a 7-day window
              // give ONE bar, which is not a trend. Days for a week, weeks for a month
              // or a quarter — 7, 5 and 13 bars, all within what the chart already sizes.
              Set( gRptBucketDays, If( gRptPeriod = "1W", 1, 7 ) );
              Set( gRptBucketN, RoundUp( gRptSpanDays / gRptBucketDays, 0 ) );
              // ---- F1..F5 ----------------------------------------------------------
              // EVERY FILTER HERE DELEGATES; the ForAll around it is a LOCAL projection over
              // the rows that come back, exactly as colRptPrj does below.
              //
              // ShowColumns MUST NOT BE USED OVER ANYTHING ROOTED IN A NAMED FORMULA, and a
              // Filter wrapped around one does NOT fix it. The collection is created, ID and
              // the Choice/Person/date columns resolve, and then a plain TEXT column reads
              // back as an ERROR type — `task_name` off LiveTasks, exactly as `project_name`
              // off ActiveProjects did. Two independent instances, same symptom, same fix:
              // write the record out by hand so the shape is stated rather than inferred.
              // colRptTx below keeps ShowColumns because it filters a DATA SOURCE directly,
              // which is the only form that is actually safe.
              //
              // F1 is unbounded but SELF-LIMITING: open work does not accumulate.
              // The stages are ENUMERATED because a Text <> does not delegate.
              // The Choice and Person columns are copied WHOLE, so task_stage.Value and
              // task_lead.Email still resolve downstream.
              Concurrent(
                  ClearCollect( colRptOpen,
                      ForAll(
                          Filter( LiveTasks,
                                  task_stage.Value = "Not Started" || task_stage.Value = "Planning"
                               || task_stage.Value = "Drafting"    || task_stage.Value = "Finalizing" ) As s,
                          { ID:                   s.ID,
                            task_name:            s.task_name,
                            task_stage:           s.task_stage,
                            task_status:          s.task_status,
                            task_date_start:      s.task_date_start,
                            task_date_target:     s.task_date_target,
                            task_lead:            s.task_lead,
                            task_supporter:       s.task_supporter,
                            task_project_id:      s.task_project_id,
                            task_output_audience: s.task_output_audience } ) ),
                  // BOUNDED ON STAGE ALONE; the period is applied locally below.
                  // task_date_completion is optional and `>= gRptFrom` is FALSE for a blank
                  // date, so a task that reached Completed without one never entered this
                  // collection at all — Done, the median and the on-time rate then read
                  // empty with nothing on screen to say why. Completed work DOES accumulate
                  // where open work does not, which is what the truncation banner is for.
                  ClearCollect( colRptDoneAll,
                      ForAll( Filter( LiveTasks, task_stage.Value = "Completed" ) As d,
                          { ID:                   d.ID,
                            task_name:            d.task_name,
                            task_status:          d.task_status,
                            task_date_start:      d.task_date_start,
                            task_date_completion: d.task_date_completion,
                            task_date_target:     d.task_date_target,
                            task_lead:            d.task_lead,
                            task_supporter:       d.task_supporter,
                            task_project_id:      d.task_project_id } ) ),
                  // F3 is the LOAD-BEARING bound — transactions grow fastest.
                  ClearCollect( colRptTx,
                      ShowColumns(
                          Filter( taskmaster_transactions,
                                  transaction_project_archived = false
                               && transaction_date >= gRptFrom2x ),
                          ID, transaction_date, transaction_client_name, transaction_project_id,
                          transaction_product_id, transaction_currency, transaction_notional ) ),
                  // AN EXPLICIT ForAll PROJECTION for the same reason F1 and F2 are: this
                  // one reads `p.project_name` off ActiveProjects, a named formula.
                  // The Choice and Person columns are copied WHOLE, so project_phase.Value
                  // and project_manager.Email still resolve downstream.
                  ClearCollect( colRptPrj,
                      ForAll( ActiveProjects As p,
                          { ID:                      p.ID,
                            project_name:            p.project_name,
                            project_phase:           p.project_phase,
                            project_perc_completion: p.project_perc_completion,
                            project_date_start:      p.project_date_start,
                            project_date_target:     p.project_date_target,
                            project_date_complete:   p.project_date_complete,
                            project_type_path:       p.project_type_path,
                            project_region_path:     p.project_region_path,
                            project_requestor:       p.project_requestor,
                            project_manager:         p.project_manager,
                            project_supporter:       p.project_supporter } ) ),
                  // ShowColumns over a named formula, and only safe because NOTHING EVER
                  // READS A FIELD OFF THIS. It feeds one CountRows. Reading a text column
                  // off it would hit the same error type F1 and F2 exist to avoid — project
                  // it by hand first if that day comes.
                  ClearCollect( colRptIss, ShowColumns( OpenIssues, ID, issue_project_id ) )
              );
              // A completed task with NO completion date is in, in every window: the app
              // cannot place it in time, and dropping it silently understates whoever did
              // the work. The count is stated beside the people table instead, the same
              // rule gRptNoSup follows — a total that does not reconcile is worse than one
              // that explains itself.
              ClearCollect( colRptDone,
                  Filter( colRptDoneAll,
                          IsBlank(task_date_completion) || task_date_completion >= gRptFrom ) );
              Set( gRptDoneNoDate,
                   CountRows( Filter(colRptDoneAll, IsBlank(task_date_completion)) ) );
              // ---- D1 dimension ----------------------------------------------------
              // product_type_path is the authoritative value and every product grouping on
              // this screen splits it at " | ". Fetched whole because a transaction reaches
              // a product by ID, not by path.
              ClearCollect( colRptProducts,
                  ShowColumns( taskmaster_products, ID, product_uid, product_type_path ) );
              // ---- truncation ------------------------------------------------------
              // Aggregates never delegate, so every figure is computed locally over
              // fetched rows. This is the ONLY place the app can notice it ran out.
              Set( gRptTrunc,
                   Trim(
                     If( CountRows(colRptOpen) >= 2000, "open tasks  ", "" ) &
                     If( CountRows(colRptDoneAll) >= 2000, "completed tasks  ", "" ) &
                     If( CountRows(colRptTx)   >= 2000, "transactions  ", "" ) &
                     If( CountRows(colRptPrj)  >= 2000, "projects  ", "" ) &
                     // F5 and the product fetch count too. Issues feed a tile of their
                     // own, and a capped product list silently shortens the type-path
                     // vocabulary every product grouping on this screen splits on.
                     If( CountRows(colRptIss)      >= 2000, "issues  ", "" ) &
                     If( CountRows(colRptProducts) >= 2000, "products  ", "" ) ) );
              // Transactions inside the CURRENT window; colRptTx holds two windows.
              ClearCollect( colRptTxCur, Filter( colRptTx, transaction_date >= gRptFrom ) );
              // ---- project map -----------------------------------------------------
              // Level 1 of a "A | B | C" path with Find/Left, NOT Split: the separator
              // is part of the stored data and blanks need their own bucket.
              ClearCollect( colRptPrjMap,
                  ForAll( colRptPrj As p,
                      { PId:  p.ID,
                        PNm:  p.project_name,
                        Fam:  With( { s: Trim(Coalesce(p.project_type_path, "")) },
                                  With( { i: Find(" | ", s) },
                                      If( IsBlank(s), "Unclassified",
                                          If( i > 0, Left(s, i - 1), s ) ) ) ),
                        // Level 1 of the region path, split exactly as Fam is.
                        Rgn:  With( { s: Trim(Coalesce(p.project_region_path, "")) },
                                  With( { i: Find(" | ", s) },
                                      If( IsBlank(s), "Unassigned",
                                          If( i > 0, Left(s, i - 1), s ) ) ) ),
                        // project_requestor is OPTIONAL, so it needs its own bucket rather
                        // than a blank slice. Display name first, email as the fallback: a
                        // person column can carry one without the other.
                        Req:  With( { n: Coalesce(p.project_requestor.DisplayName, ""),
                                      e: Coalesce(p.project_requestor.Email, "") },
                                  If( Len(n) > 0, n, If( Len(e) > 0, e, "Unassigned" ) ) ),
                        Mgr:  Lower(Coalesce(p.project_manager.Email, "")),
                        // The display name is carried alongside the email because the scope
                        // picker lists PEOPLE and matches on IDENTITY: email is the key,
                        // the name is only ever shown.
                        MgrNm: Coalesce(p.project_manager.DisplayName, ""),
                        Sup:  Lower(Coalesce(p.project_supporter.Email, "")) } ) );
              // ---- scope options ---------------------------------------------------
              // "All" plus one row per project manager, built from the projects actually
              // in the window — so the list can never offer a manager with nothing to show.
              // Em is the key and is BLANK for "All", which is what the filter tests; a
              // manager with no display name falls back to the email rather than
              // rendering an unpickable blank row.
              ClearCollect( colRptMgrOpts, { Value: "All", Em: "" } );
              Collect( colRptMgrOpts,
                  Sort( ForAll( Distinct( Filter(colRptPrjMap, Len(Mgr) > 0), Mgr ) As m,
                            { Value: With( { n: LookUp(colRptPrjMap, Mgr = m.Value, MgrNm) },
                                         If( Len(Coalesce(n, "")) > 0, n, m.Value ) ),
                              Em:    m.Value } ),
                        Value ) );
              // ---- person unpivot --------------------------------------------------
              // TWO ATTRIBUTION PATHS, BOTH FROM TASKS: task_lead owns and
              // task_supporter supports. They are counted separately and NEVER summed
              // into one workload number — that double-counts the desk total.
              // transaction_sales is NOT a third path (user-confirmed 2026-08-17): the
              // person who sold the trade did not do the desk work measured here.
              //
              // Ungroup flattens the two-row table each task emits. Days and OnT carry
              // -1 for "not applicable" so the medians and rates can exclude them
              // without confusing a real zero with a missing value.
              Clear( colRptPersonSrc );
              Collect( colRptPersonSrc,
                  Filter( Ungroup(
                      ForAll( colRptOpen As t,
                          // NO PROJECT LOOKUP HERE. These rows used to carry the activity
                          // family and the output format for the overlay's mini-charts; the
                          // overlay lists TASKS now and reads neither, so the join that fed
                          // them is gone rather than merely unread. colRptOpenTag still does
                          // that join, once, for the band-3 charts that need it.
                          With( { stg: Coalesce( t.task_stage.Value, "Unspecified" ),
                                  // Carried on the row so the person overlay can list the
                                  // TASKS themselves off this collection and refetch nothing.
                                  hth: Coalesce( t.task_status.Value, "—" ),
                                  // Hoisted: this is compared on every measure of the supports
                                  // row, and left inline it was six Lower/Coalesce pairs per task.
                                  dup: Lower(Coalesce(t.task_supporter.Email, "")) = Lower(Coalesce(t.task_lead.Email, "")) },
                          { r: Table(
                              { Em: Lower(Coalesce(t.task_lead.Email, "")),
                                Nm: Coalesce(t.task_lead.DisplayName, ""),
                                Role: "Owns", PId: t.task_project_id.Id, Op: 1,
                                Ovd: If( !IsBlank(t.task_date_target) && t.task_date_target < Today(), 1, 0 ),
                                Gc: If(t.task_status.Value = "Green", 1, 0),
                                Ac: If(t.task_status.Value = "Amber", 1, 0),
                                Rc: If(t.task_status.Value = "Red",   1, 0),
                                Dn: 0, Days: -1, OnT: -1, Stg: stg,
                                TId: t.ID, TNm: t.task_name, Hth: hth,
                                Dst: t.task_date_start, Dtl: t.task_date_target, Dup: false },
                              // SAME PERSON ON BOTH COLUMNS IS COUNTED IN BOTH ROLES, ONCE
                              // PER MEASURE. The schema permits lead = supporter, and this
                              // row used to be DROPPED entirely — which kept Overdue honest
                              // but also meant supporting a task you lead scored nothing at
                              // all, understating the support count this screen exists to
                              // report. The defect was never the row; it was that its
                              // MEASURES double-counted. So the row stays and carries the
                              // role, while dup zeroes every measure on it: Ovd/Gc/Ac/Rc/Dn
                              // to 0, Days/OnT to -1, which the median and on-time folds
                              // already read as "not applicable".
                              { Em: Lower(Coalesce(t.task_supporter.Email, "")),
                                Nm: Coalesce(t.task_supporter.DisplayName, ""),
                                Role: "Supports",
                                                                PId: t.task_project_id.Id, Op: 1,
                                Ovd: If( dup, 0,
                                         If( !IsBlank(t.task_date_target) && t.task_date_target < Today(), 1, 0 ) ),
                                Gc: If( dup, 0,
                                        If(t.task_status.Value = "Green", 1, 0) ),
                                Ac: If( dup, 0,
                                        If(t.task_status.Value = "Amber", 1, 0) ),
                                Rc: If( dup, 0,
                                        If(t.task_status.Value = "Red",   1, 0) ),
                                Dn: 0, Days: -1, OnT: -1, Stg: stg,
                                TId: t.ID, TNm: t.task_name, Hth: hth,
                                Dst: t.task_date_start, Dtl: t.task_date_target, Dup: dup } ) } ) ),
                      r ), Len(Em) > 0 ) );
              Collect( colRptPersonSrc,
                  Filter( Ungroup(
                      ForAll( colRptDone As t,
                          With( { hth: Coalesce( t.task_status.Value, "—" ),
                                  // A COMPLETED TASK MAY CARRY NO COMPLETION DATE — that is
                                  // exactly why colRptDoneAll is fetched on stage alone. Both
                                  // durations need one, so both fall back to "not applicable"
                                  // rather than measuring against a blank.
                                  nod: IsBlank(t.task_date_completion),
                                  dup: Lower(Coalesce(t.task_supporter.Email, "")) = Lower(Coalesce(t.task_lead.Email, "")) },
                          { r: Table(
                              { Em: Lower(Coalesce(t.task_lead.Email, "")),
                                Nm: Coalesce(t.task_lead.DisplayName, ""),
                                Role: "Owns", PId: t.task_project_id.Id, Op: 0,
                                Ovd: 0, Gc: 0, Ac: 0, Rc: 0, Dn: 1,
                                Days: If( nod || IsBlank(t.task_date_start), -1,
                                          DateDiff(t.task_date_start, t.task_date_completion, TimeUnit.Days) ),
                                OnT:  If( nod || IsBlank(t.task_date_target), -1,
                                          If(t.task_date_completion <= t.task_date_target, 1, 0) ),
                                Stg: "Completed",
                                TId: t.ID, TNm: t.task_name, Hth: hth,
                                Dst: t.task_date_start, Dtl: t.task_date_target, Dup: false },
                              { Em: Lower(Coalesce(t.task_supporter.Email, "")),
                                Nm: Coalesce(t.task_supporter.DisplayName, ""),
                                Role: "Supports",
                                                                PId: t.task_project_id.Id, Op: 0,
                                // Dn is the measure that double-counts on a completed task,
                                // and Days/OnT would pull the same task into the median and
                                // the on-time rate twice. Zeroed on a duplicate, exactly as
                                // on the open branch; the row itself survives so the role is
                                // still counted.
                                Ovd: 0, Gc: 0, Ac: 0, Rc: 0,
                                Dn: If( dup, 0, 1 ),
                                Days: If( dup || nod, -1,
                                          If( IsBlank(t.task_date_start), -1,
                                          DateDiff(t.task_date_start, t.task_date_completion, TimeUnit.Days) ) ),
                                OnT:  If( dup || nod, -1,
                                          If( IsBlank(t.task_date_target), -1,
                                          If(t.task_date_completion <= t.task_date_target, 1, 0) ) ),
                                Stg: "Completed",
                                TId: t.ID, TNm: t.task_name, Hth: hth,
                                Dst: t.task_date_start, Dtl: t.task_date_target, Dup: dup } ) } ) ),
                      r ), Len(Em) > 0 ) );
              // ---- person fold -----------------------------------------------------
              // ~40 rows, every measure precomputed. This costs persons x rows ONCE per
              // load; the rule it exists to obey is that no gallery row may scan a fact
              // collection.
              //
              // MEDIAN is hand-rolled: Power Fx has no Median. Sort, then take the
              // lower-middle element. On an even count that is the lower of the two
              // central days rather than their mean — deliberate, on integer days.
              // HOW MANY OPEN TASKS RECORD NO SUPPORTER AT ALL. Without this a support
              // count of zero means two entirely different things — nobody supports
              // anything, or the column is empty — and the screen cannot tell you which.
              // task_supporter carries no stored value for older tasks, so a correct
              // report over an empty column looks identical to a broken one. State the
              // gap rather than let a zero speak for it.
              Set( gRptNoSup,
                   CountRows( Filter( colRptOpen, IsBlank(task_supporter.Email) ) ) );
              ClearCollect( colRptPerson,
                  ForAll( Distinct( Filter(colRptPersonSrc, Len(Em) > 0), Em ) As pp,
                      With( { rw: Filter(colRptPersonSrc, Em = pp.Value) },
                          { Em:   pp.Value,
                            Nm:   First(rw).Nm,
                            // BOTH COLUMNS COUNT EVERY TASK IN THE ROLE, open or finished
                            // (user, 2026-08-18). Neither carries Op = 1 any more: that
                            // restricted them to open work, so anyone whose tasks had all
                            // completed read zero in a table meant to show what they do.
                            // The reach is the fetch, not all of history: open tasks are
                            // unbounded but completed ones come back only inside the selected
                            // period, so both are "still open, plus finished in the window"
                            // and both move with the period control.
                            // The MEASURES beside them stay lifecycle-scoped and are not
                            // affected — Ovd/Gc/Ac/Rc are zero on a completed row, Dn counts
                            // only completed ones. Volume is what changed, not health.
                            Owns: CountRows( Filter(rw, Role = "Owns") ),
                            Sups: CountRows( Filter(rw, Role = "Supports") ),
                            Ovd:  Sum(rw, Ovd),
                            Gc:   Sum(rw, Gc), Ac: Sum(rw, Ac), Rc: Sum(rw, Rc),
                            Dn:   Sum(rw, Dn),
                            Med:  With( { ds: Sort( Filter(rw, Days >= 0), Days ) },
                                      With( { n: CountRows(ds) },
                                          If( n = 0, -1, Index(ds, RoundUp(n / 2, 0)).Days ) ) ),
                            OnTp: With( { dt: Filter(rw, OnT >= 0) },
                                      If( CountRows(dt) = 0, -1,
                                          RoundDown( Sum(dt, OnT) / Max(1, CountRows(dt)) * 100, 0 ) ) ) } ) ) );
              // ---- desk pulse ------------------------------------------------------
              Set( gRptOpenN,  CountRows(colRptOpen) );
              Set( gRptOvdN,   CountRows( Filter( colRptOpen,
                                   !IsBlank(task_date_target) && task_date_target < Today() ) ) );
              Set( gRptTxN,    CountRows(colRptTxCur) );
              Set( gRptTxPrev, CountRows( Filter(colRptTx, transaction_date < gRptFrom) ) );
              Set( gRptIssN,   CountRows(colRptIss) );
              // ---- BAND 3 folds: where the work sits --------------------------------
              // Tag each open task ONCE with everything the breakdowns group on. Every
              // chart below then reads a tagged collection instead of re-joining to the
              // project map per category. The LookUp is HOISTED: family, region and
              // requestor all come off the same project row, and three separate LookUps
              // would triple a join that is already O(tasks x projects).
              ClearCollect( colRptOpenTag,
                  ForAll( colRptOpen As t,
                      With( { pm: LookUp(colRptPrjMap, PId = t.task_project_id.Id) },
                          { Fam: Coalesce( pm.Fam, "Unclassified" ),
                            Rgn: Coalesce( pm.Rgn, "Unassigned" ),
                            Req: Coalesce( pm.Req, "Unassigned" ),
                            Aud: Coalesce( t.task_output_audience.Value, "Unspecified" ) } ) ) );
              ClearCollect( colRptFamAll,
                  ForAll( Distinct(colRptOpenTag, Fam) As f,
                      { K: f.Value, N: CountRows( Filter(colRptOpenTag, Fam = f.Value) ) } ) );
              // TOP 6 + Other. Sorted here, once, so the renderer can index straight in.
              ClearCollect( colRptFam, FirstN( Sort(colRptFamAll, N, SortOrder.Descending), 6 ) );
              Set( gRptFamOther, CountRows(colRptOpenTag) - Coalesce(Sum(colRptFam, N), 0) );
              Clear( colRptFamBar );
              Collect( colRptFamBar,
                  ForAll( Sequence( CountRows(colRptFam) ) As s,
                      With( { r: Index(colRptFam, s.Value) },
                          { Idx: s.Value, K: r.K, N: r.N } ) ) );
              If( gRptFamOther > 0,
                  Collect( colRptFamBar,
                      { Idx: CountRows(colRptFam) + 1, K: "Other", N: gRptFamOther } ) );
              Set( gRptFamMax, Max( 1, Coalesce(Max(colRptFamBar, N), 0) ) );
              // THE VOCABULARY COMES FROM THE COLUMN, via Choices(). A literal list here
              // was a second copy of the column that drifts the moment someone edits it in
              // SharePoint, and this chart would then under-count in silence.
              // Choices() keeps the property this section actually needs — it returns EVERY
              // value the column offers, including ones no task currently holds, so an
              // unused format still draws a zero bar. That is the same reason the gap grid
              // reads its axes from the dimension lists: a GroupBy over the facts would
              // delete exactly the categories worth seeing.
              ClearCollect( colRptAudVocab,
                  ForAll( Choices([@taskmaster_tasks].task_output_audience) As c,
                          { K: c.Value } ) );
              Clear( colRptAudBar );
              Collect( colRptAudBar,
                  ForAll( Sequence( CountRows(colRptAudVocab) ) As s,
                      With( { k: Index(colRptAudVocab, s.Value).K },
                          { Idx: s.Value, K: k,
                            N: CountRows( Filter(colRptOpenTag, Aud = k) ) } ) ) );
              // Blank is not a Choice value, so it needs its own bucket, and here it is the
              // bucket that MATTERS: task_output_audience is younger than most of the open
              // backlog, so Unspecified is mostly "predates the column", not "nobody bothered".
              // scrTaskEdit blocks the save until an audience is picked whenever the Output
              // section is on, so this bucket drains as tasks are touched — which is why the
              // subtitle states its size rather than letting the pie imply the column is broken.
              // "Other" means a value tasks still HOLD that the column no longer offers.
              Collect( colRptAudBar,
                  { Idx: CountRows(colRptAudVocab) + 1, K: "Unspecified",
                    N: CountRows( Filter(colRptOpenTag, Aud = "Unspecified") ) },
                  { Idx: CountRows(colRptAudVocab) + 2, K: "Other",
                    N: CountRows( Filter( colRptOpenTag,
                           Aud <> "Unspecified" && !(Aud in colRptAudVocab.K) ) ) } );
              // THE AUDIENCE CHART IS A PIE, so it needs slice geometry rather than a bar
              // maximum. Same fold shape as the three below it; see the pie note there.
              Set( gRptAudTot, Max( 1, Coalesce(Sum(colRptAudBar, N), 0) ) );
              ClearCollect( colRptAudPie,
                  ForAll( Filter(colRptAudBar, N > 0) As r,
                      With( { cb: Coalesce( Sum( Filter(colRptAudBar, Idx < r.Idx), N ), 0 ) },
                          { Idx: r.Idx, K: r.K, N: r.N,
                            // LEGEND ROW, not Idx: Idx comes from the pre-filter sequence, so
                            // a dropped zero-count row would leave a gap in the legend.
                            Li:  CountRows( Filter(colRptAudBar, N > 0 && Idx <= r.Idx) ),
                            Off: RoundDown( cb / gRptAudTot * 100, 0 ),
                            Pct: RoundDown( (cb + r.N) / gRptAudTot * 100, 0 )
                                 - RoundDown( cb / gRptAudTot * 100, 0 ),
                            Hx:  If( r.K = "Other", "#C53A3A",
                                     If( r.K = "Unspecified", "#B9C0C8",
                                         Switch( Mod(r.Idx - 1, 6),
                                                 0, "#005A9E", 1, "#2E8B9A", 2, "#D69828",
                                                 3, "#7A6FB0", 4, "#C05F3C", "#4A9E63" ) ) ) } ) ) );
              // ---- open tasks by requestor (bar) -----------------------------------
              // Top 6 + Other, exactly as the family chart: the requestor list is open-ended
              // and a chart with forty rows is not a chart.
              ClearCollect( colRptReqAll,
                  ForAll( Distinct(colRptOpenTag, Req) As r,
                      { K: r.Value, N: CountRows( Filter(colRptOpenTag, Req = r.Value) ) } ) );
              ClearCollect( colRptReqTop, FirstN( Sort(colRptReqAll, N, SortOrder.Descending), 6 ) );
              Set( gRptReqOther, CountRows(colRptOpenTag) - Coalesce(Sum(colRptReqTop, N), 0) );
              Clear( colRptReqBar );
              Collect( colRptReqBar,
                  ForAll( Sequence( CountRows(colRptReqTop) ) As s,
                      With( { r: Index(colRptReqTop, s.Value) },
                          { Idx: s.Value, K: r.K, N: r.N } ) ) );
              If( gRptReqOther > 0,
                  Collect( colRptReqBar,
                      { Idx: CountRows(colRptReqTop) + 1, K: "Other", N: gRptReqOther } ) );
              Set( gRptReqMax, Max( 1, Coalesce(Max(colRptReqBar, N), 0) ) );
              // ---- open tasks by region, level 1 (pie) -----------------------------
              // PIE SLICES ARE WHOLE PERCENTAGES DERIVED FROM A RUNNING CUMULATIVE, never
              // rounded one slice at a time: Pct = Cum(i) - Cum(i-1), so the rounding error
              // stays inside a slice and the wedges always close the circle. Off is the same
              // cumulative, which is the dashoffset the renderer needs. Both are INTEGERS
              // and must stay that way — a computed fraction goes through Text(), drags the
              // locale decimal separator into the SVG attribute, and the slice renders EMPTY.
              // Zero-count slices are dropped: a Pct of 0 draws nothing but still consumes a
              // legend row.
              ClearCollect( colRptRgnAll,
                  ForAll( Distinct(colRptOpenTag, Rgn) As r,
                      { K: r.Value, N: CountRows( Filter(colRptOpenTag, Rgn = r.Value) ) } ) );
              ClearCollect( colRptRgnTop, FirstN( Sort(colRptRgnAll, N, SortOrder.Descending), 5 ) );
              Set( gRptRgnOther, CountRows(colRptOpenTag) - Coalesce(Sum(colRptRgnTop, N), 0) );
              Clear( colRptRgnSeq );
              Collect( colRptRgnSeq,
                  ForAll( Sequence( CountRows(colRptRgnTop) ) As s,
                      With( { r: Index(colRptRgnTop, s.Value) },
                          { Idx: s.Value, K: r.K, N: r.N } ) ) );
              If( gRptRgnOther > 0,
                  Collect( colRptRgnSeq,
                      { Idx: CountRows(colRptRgnTop) + 1, K: "Other", N: gRptRgnOther } ) );
              Set( gRptRgnTot, Max( 1, Coalesce(Sum(colRptRgnSeq, N), 0) ) );
              ClearCollect( colRptRgnPie,
                  ForAll( Filter(colRptRgnSeq, N > 0) As r,
                      With( { cb: Coalesce( Sum( Filter(colRptRgnSeq, Idx < r.Idx), N ), 0 ) },
                          { Idx: r.Idx, K: r.K, N: r.N,
                            // LEGEND ROW, not Idx: Idx comes from the pre-filter sequence, so
                            // a dropped zero-count row would leave a gap in the legend.
                            Li:  CountRows( Filter(colRptRgnSeq, N > 0 && Idx <= r.Idx) ),
                            Off: RoundDown( cb / gRptRgnTot * 100, 0 ),
                            Pct: RoundDown( (cb + r.N) / gRptRgnTot * 100, 0 )
                                 - RoundDown( cb / gRptRgnTot * 100, 0 ),
                            Hx:  If( r.K = "Other" || r.K = "Unassigned", "#B9C0C8",
                                     Switch( Mod(r.Idx - 1, 6),
                                             0, "#005A9E", 1, "#2E8B9A", 2, "#D69828",
                                             3, "#7A6FB0", 4, "#C05F3C", "#4A9E63" ) ) } ) ) );
              // ---- BAND 4 folds: project trend -------------------------------------
              // BUCKETS KEYED ON A WHOLE NUMBER OF DAYS SINCE gRptFrom — not on date
              // comparison, and not on a calendar month, so one keying serves all three
              // windows and no month-length or timezone edge exists.
              // EVERY BUCKET FILTER CARRIES ITS OWN LOWER BOUND. RoundDown truncates
              // TOWARD ZERO, so a date BEFORE gRptFrom yields -0.4 -> 0 and would land in
              // bucket 1. colRptPrj is not date-bounded — it holds every open project,
              // most of them started long before the window — so without the bound the
              // first bar absorbs the entire backlog.
              // The prior window is aligned POSITIONALLY: bucket i of this window is
              // compared with bucket i of the window before it.
              ClearCollect( colRptBucketsRaw,
                  ForAll( Sequence( gRptBucketN ) As s,
                      With( { d: DateAdd( gRptFrom, (s.Value - 1) * gRptBucketDays, TimeUnit.Days ),
                              k: s.Value - 1 },
                              { Idx: s.Value,
                                Lbl: If( gRptBucketDays = 1,
                                         Text(d, "[$-en-US]ddd"),
                                         Text(d, "[$-en-US]d mmm") ),
                                St: CountRows( Filter( colRptPrj,
                                        !IsBlank(project_date_start)
                                     && project_date_start >= gRptFrom
                                     && RoundDown( DateDiff(gRptFrom, project_date_start, TimeUnit.Days)
                                                   / gRptBucketDays, 0 ) = k ) ),
                                Cp: CountRows( Filter( colRptPrj,
                                        !IsBlank(project_date_complete)
                                     && project_date_complete >= gRptFrom
                                     && RoundDown( DateDiff(gRptFrom, project_date_complete, TimeUnit.Days)
                                                   / gRptBucketDays, 0 ) = k ) ),
                                // colRptTxCur, NOT colRptTx. colRptTx spans TWO windows, so
                                // reading it here counts the prior window into the current bars.
                                Tx: CountRows( Filter( colRptTxCur,
                                        RoundDown( DateDiff(gRptFrom, transaction_date, TimeUnit.Days)
                                                   / gRptBucketDays, 0 ) = k ) ),
                                // Keyed off gRptFrom2x, so bucket i here is the same offset
                                // into the prior window as bucket i is into the current one.
                                TxP: CountRows( Filter( colRptTx,
                                        transaction_date < gRptFrom
                                     && RoundDown( DateDiff(gRptFrom2x, transaction_date, TimeUnit.Days)
                                                   / gRptBucketDays, 0 ) = k ) ) } ) ) );
              // CUMULATIVE NET OPEN — started minus completed, running. This is the direct
              // answer to "how are projects trending" and it needs no snapshot list,
              // because it is built from dated EVENTS rather than stateful columns.
              ClearCollect( colRptBuckets,
                  ForAll( colRptBucketsRaw As m,
                      { Idx: m.Idx, Lbl: m.Lbl, St: m.St, Cp: m.Cp, Tx: m.Tx, TxP: m.TxP,
                        Net: Coalesce( Sum( Filter(colRptBucketsRaw, Idx <= m.Idx), St ), 0 )
                           - Coalesce( Sum( Filter(colRptBucketsRaw, Idx <= m.Idx), Cp ), 0 ) } ) );
              Set( gRptTrendMax,
                   Max( 1, Coalesce(Max(colRptBuckets, St), 0),
                           Coalesce(Max(colRptBuckets, Cp), 0),
                           Coalesce(Max(colRptBuckets, Net), 0) ) );
              Set( gRptTxMax,
                   Max( 1, Coalesce(Max(colRptBuckets, Tx), 0),
                           Coalesce(Max(colRptBuckets, TxP), 0) ) );
              // Ageing of OPEN projects, by days since start.
              Set( gRptAgeA, CountRows( Filter( colRptPrj, project_phase.Value <> "Complete"
                                 && !IsBlank(project_date_start)
                                 && DateDiff(project_date_start, Today(), TimeUnit.Days) < 30 ) ) );
              Set( gRptAgeB, CountRows( Filter( colRptPrj, project_phase.Value <> "Complete"
                                 && !IsBlank(project_date_start)
                                 && DateDiff(project_date_start, Today(), TimeUnit.Days) >= 30
                                 && DateDiff(project_date_start, Today(), TimeUnit.Days) < 90 ) ) );
              Set( gRptAgeC, CountRows( Filter( colRptPrj, project_phase.Value <> "Complete"
                                 && !IsBlank(project_date_start)
                                 && DateDiff(project_date_start, Today(), TimeUnit.Days) >= 90
                                 && DateDiff(project_date_start, Today(), TimeUnit.Days) < 180 ) ) );
              Set( gRptAgeD, CountRows( Filter( colRptPrj, project_phase.Value <> "Complete"
                                 && !IsBlank(project_date_start)
                                 && DateDiff(project_date_start, Today(), TimeUnit.Days) >= 180 ) ) );
              Set( gRptStalled,  CountRows( Filter(colRptPrj, project_phase.Value = "Stalled") ) );
              Set( gRptNoTarget, CountRows( Filter( colRptPrj, project_phase.Value <> "Complete"
                                     && IsBlank(project_date_target) ) ) );
              // ---- BAND 5 folds: transactions --------------------------------------
              // ACCEPTED COST, NOT AN OVERSIGHT: a linear LookUp per transaction, so this
              // is O(tx x products) + O(tx x projects) and it re-runs on every period change.
              // Power Fx has no hash join and no index on a collection, so there is no cheaper
              // shape — and it is bounded by the same 2000-row cap the truncation banner
              // reports. If it ever becomes the bottleneck, the fix is denormalised columns on
              // the transaction, not a smarter join here.
              // ONE LookUp PER DIMENSION, both levels of the path off the product one and the
              // lead off the project one. Splitting the path twice, or reading the manager's
              // name and email separately, would double a join the note above already calls
              // the accepted cost. Level 2 is the segment after the first " | "; a path with
              // only one segment has none, which is its own bucket and not "Unclassified" —
              // the product IS classified, just not that deep.
              ClearCollect( colRptTxEnriched,
                  ForAll( colRptTxCur As x,
                      With( { sp: Trim( Coalesce( LookUp( colRptProducts,
                                            ID = x.transaction_product_id.Id ).product_type_path, "" ) ),
                              pm: LookUp( colRptPrjMap, PId = x.transaction_project_id.Id ) },
                          With( { i: Find(" | ", sp) },
                              // Right, not Mid: the " | " separator is 3 characters, so the
                              // remainder starts at i + 3 and runs to the end. Left is the
                              // idiom this file already uses for the other half of the split.
                              With( { rest: If( i > 0, Trim(Right(sp, Len(sp) - i - 2)), "" ) },
                                  With( { j: Find(" | ", rest) },
                                      { Prd: If( IsBlank(sp), "Unclassified",
                                                 If( i > 0, Left(sp, i - 1), sp ) ),
                                        Pr2: If( Len(rest) = 0, "Top level only",
                                                 If( j > 0, Left(rest, j - 1), rest ) ),
                                        // THE PROJECT'S MANAGER, and the label is resolved
                                        // here rather than in the chart fold so the display
                                        // name and the email fallback travel together.
                                        Ld:  With( { n: Coalesce(pm.MgrNm, ""),
                                                     e: Coalesce(pm.Mgr, "") },
                                                 If( Len(n) > 0, n,
                                                     If( Len(e) > 0, e, "Unassigned" ) ) ),
                                        Dt:  x.transaction_date,
                                        Ccy: Coalesce(x.transaction_currency.Value, "—"),
                                        Amt: Coalesce(x.transaction_notional, 0) } ) ) ) ) ) );
              // PER CURRENCY, NEVER SUMMED ACROSS THEM. Cross-currency conversion is out
              // of scope for this project, so there is no blended figure to show.
              ClearCollect( colRptCcy,
                  ForAll( Distinct(colRptTxEnriched, Ccy) As c,
                      { K: c.Value,
                        N:   CountRows( Filter(colRptTxEnriched, Ccy = c.Value) ),
                        Tot: Coalesce( Sum( Filter(colRptTxEnriched, Ccy = c.Value), Amt ), 0 ) } ) );
              // ---- transactions by project lead (bar) ------------------------------
              // ATTRIBUTION IS PROJECT-LEVEL AND SAYS SO ON THE PANEL. This counts
              // transactions on projects the person MANAGES; it is not task work and it is
              // not sales credit, which is why it belongs in the transactions band and not
              // beside the per-person task measures where it used to sit.
              ClearCollect( colRptLdAll,
                  ForAll( Distinct(colRptTxEnriched, Ld) As d,
                      { K: d.Value, N: CountRows( Filter(colRptTxEnriched, Ld = d.Value) ) } ) );
              ClearCollect( colRptLdTop, FirstN( Sort(colRptLdAll, N, SortOrder.Descending), 6 ) );
              Set( gRptLdOther, CountRows(colRptTxEnriched) - Coalesce(Sum(colRptLdTop, N), 0) );
              Clear( colRptLdBar );
              Collect( colRptLdBar,
                  ForAll( Sequence( CountRows(colRptLdTop) ) As s,
                      With( { r: Index(colRptLdTop, s.Value) },
                          { Idx: s.Value, K: r.K, N: r.N } ) ) );
              If( gRptLdOther > 0,
                  Collect( colRptLdBar,
                      { Idx: CountRows(colRptLdTop) + 1, K: "Other", N: gRptLdOther } ) );
              Set( gRptLdMax, Max( 1, Coalesce(Max(colRptLdBar, N), 0) ) );
              // ---- transactions by product type, levels 1 and 2 (pies) -------------
              // Same running-cumulative slice geometry as the region pie; see the note
              // there for why the percentages are derived rather than rounded per slice.
              ClearCollect( colRptPrdAll,
                  ForAll( Distinct(colRptTxEnriched, Prd) As d,
                      { K: d.Value, N: CountRows( Filter(colRptTxEnriched, Prd = d.Value) ) } ) );
              ClearCollect( colRptPrdTop, FirstN( Sort(colRptPrdAll, N, SortOrder.Descending), 5 ) );
              Set( gRptPrdOther, CountRows(colRptTxEnriched) - Coalesce(Sum(colRptPrdTop, N), 0) );
              Clear( colRptPrdSeq );
              Collect( colRptPrdSeq,
                  ForAll( Sequence( CountRows(colRptPrdTop) ) As s,
                      With( { r: Index(colRptPrdTop, s.Value) },
                          { Idx: s.Value, K: r.K, N: r.N } ) ) );
              If( gRptPrdOther > 0,
                  Collect( colRptPrdSeq,
                      { Idx: CountRows(colRptPrdTop) + 1, K: "Other", N: gRptPrdOther } ) );
              Set( gRptPrdTot, Max( 1, Coalesce(Sum(colRptPrdSeq, N), 0) ) );
              ClearCollect( colRptPrdPie,
                  ForAll( Filter(colRptPrdSeq, N > 0) As r,
                      With( { cb: Coalesce( Sum( Filter(colRptPrdSeq, Idx < r.Idx), N ), 0 ) },
                          { Idx: r.Idx, K: r.K, N: r.N,
                            // LEGEND ROW, not Idx: Idx comes from the pre-filter sequence, so
                            // a dropped zero-count row would leave a gap in the legend.
                            Li:  CountRows( Filter(colRptPrdSeq, N > 0 && Idx <= r.Idx) ),
                            Off: RoundDown( cb / gRptPrdTot * 100, 0 ),
                            Pct: RoundDown( (cb + r.N) / gRptPrdTot * 100, 0 )
                                 - RoundDown( cb / gRptPrdTot * 100, 0 ),
                            Hx:  If( r.K = "Other" || r.K = "Unclassified", "#B9C0C8",
                                     Switch( Mod(r.Idx - 1, 6),
                                             0, "#005A9E", 1, "#2E8B9A", 2, "#D69828",
                                             3, "#7A6FB0", 4, "#C05F3C", "#4A9E63" ) ) } ) ) );
              ClearCollect( colRptPr2All,
                  ForAll( Distinct(colRptTxEnriched, Pr2) As d,
                      { K: d.Value, N: CountRows( Filter(colRptTxEnriched, Pr2 = d.Value) ) } ) );
              ClearCollect( colRptPr2Top, FirstN( Sort(colRptPr2All, N, SortOrder.Descending), 5 ) );
              Set( gRptPr2Other, CountRows(colRptTxEnriched) - Coalesce(Sum(colRptPr2Top, N), 0) );
              Clear( colRptPr2Seq );
              Collect( colRptPr2Seq,
                  ForAll( Sequence( CountRows(colRptPr2Top) ) As s,
                      With( { r: Index(colRptPr2Top, s.Value) },
                          { Idx: s.Value, K: r.K, N: r.N } ) ) );
              If( gRptPr2Other > 0,
                  Collect( colRptPr2Seq,
                      { Idx: CountRows(colRptPr2Top) + 1, K: "Other", N: gRptPr2Other } ) );
              Set( gRptPr2Tot, Max( 1, Coalesce(Sum(colRptPr2Seq, N), 0) ) );
              ClearCollect( colRptPr2Pie,
                  ForAll( Filter(colRptPr2Seq, N > 0) As r,
                      With( { cb: Coalesce( Sum( Filter(colRptPr2Seq, Idx < r.Idx), N ), 0 ) },
                          { Idx: r.Idx, K: r.K, N: r.N,
                            // LEGEND ROW, not Idx: Idx comes from the pre-filter sequence, so
                            // a dropped zero-count row would leave a gap in the legend.
                            Li:  CountRows( Filter(colRptPr2Seq, N > 0 && Idx <= r.Idx) ),
                            Off: RoundDown( cb / gRptPr2Tot * 100, 0 ),
                            Pct: RoundDown( (cb + r.N) / gRptPr2Tot * 100, 0 )
                                 - RoundDown( cb / gRptPr2Tot * 100, 0 ),
                            Hx:  If( r.K = "Other" || r.K = "Top level only", "#B9C0C8",
                                     Switch( Mod(r.Idx - 1, 6),
                                             0, "#005A9E", 1, "#2E8B9A", 2, "#D69828",
                                             3, "#7A6FB0", 4, "#C05F3C", "#4A9E63" ) ) } ) ) );
              // ---- currency segments for the trend bars ----------------------------
              // The bar chart stacks by currency, and an SVG Concat cannot carry a running
              // total — so the base each segment sits on is computed HERE. Bucketed once per
              // transaction rather than once per bucket-currency cell, which turns a
              // DateDiff per cell into a DateDiff per row.
              ClearCollect( colRptTxBk,
                  ForAll( colRptTxEnriched As e,
                      { Bi: RoundDown( DateDiff(gRptFrom, e.Dt, TimeUnit.Days)
                                       / Max(1, gRptBucketDays), 0 ) + 1,
                        K:  e.Ccy } ) );
              // ORDERED ONCE, so a currency keeps the same stacking position in every bar.
              ClearCollect( colRptCcyKeys,
                  ForAll( Sequence( CountRows(colRptCcy) ) As s,
                      With( { r: Index( Sort(colRptCcy, N, SortOrder.Descending), s.Value ) },
                          { Ord: s.Value, K: r.K } ) ) );
              ClearCollect( colRptTxSegRaw,
                  ForAll( Sequence( gRptBucketN * Max(1, CountRows(colRptCcyKeys)) ) As s,
                      With( { bi: RoundDown( (s.Value - 1)
                                             / Max(1, CountRows(colRptCcyKeys)), 0 ) + 1,
                              ci: Mod( s.Value - 1, Max(1, CountRows(colRptCcyKeys)) ) + 1 },
                          With( { k: Index(colRptCcyKeys, ci).K },
                              { Bi: bi, Ci: ci, K: k,
                                N: CountRows( Filter(colRptTxBk, Bi = bi && K = k) ) } ) ) ) );
              // FIXED BY VALUE, NOT BY POSITION: EUR is the same colour whatever its share
              // is this period, so two loads can be compared by eye.
              ClearCollect( colRptTxSeg,
                  ForAll( Filter(colRptTxSegRaw, N > 0) As g,
                      { Bi: g.Bi, Ci: g.Ci, K: g.K, N: g.N,
                        Base: Coalesce( Sum( Filter(colRptTxSegRaw, Bi = g.Bi && Ci < g.Ci), N ), 0 ),
                        Hx: Switch( g.K, "EUR", "#005A9E", "USD", "#2E8B9A", "GBP", "#D69828",
                                         "JPY", "#7A6FB0", "CHF", "#C05F3C", "#4A9E63" ) } ) );
              // The people on the scoped manager's projects, resolved to a flat email
              // list so the gallery filters with `in` over ~40 rows rather than scanning
              // the unpivot on every repaint. Recomputed HERE as well as in the picker's
              // OnChange because a period change rebuilds colRptPersonSrc underneath a
              // scope that is already set — the two must stay identical.
              ClearCollect( colRptScopeEm,
                  Distinct( Filter( colRptPersonSrc,
                                    PId in Filter(colRptPrjMap, Mgr = Coalesce(gRptScope, "")).PId ),
                            Em ) );
              Set( gRptAsAt,   Text(Now(), "[$-en-US]hh:mm") );
              Set( gRptLoadedKey, gRptKey );
              Set( gRptBusy, false )
      # =====================================================================
      # BAND 0 — control bar. FIXED, outside the scroll body.
      # =====================================================================
      - rowRptControl:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =gTheme.Space.Gap
            PaddingLeft: =gTheme.Space.Gutter
            PaddingRight: =gTheme.Space.Gutter
            Fill: =gTheme.Color.Surface
            BorderColor: =gTheme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =72
          Children:
            - wrapRptPeriod:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =2
                  FillPortions: =0
                  LayoutMinWidth: =300
                  Width: =300
                  Height: =56
                Children:
                  - lblRptPeriodCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Period"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        FillPortions: =0
                        LayoutMinHeight: =16
                        Width: =Parent.Width
                        Height: =16
                  # A LITERAL option list is right here and nowhere else on this screen:
                  # these are app concepts, not a SharePoint column, so there is no
                  # Choices() to bind and no vocabulary that can drift.
                  - selRptPeriod:
                      Control: CanvasComponent
                      ComponentName: cmpSelection
                      Properties:
                        FontSize: =10
                        Width: =Parent.Width
                        Height: =36
                        Items: |
                          =Table( { Id: 1, Label: "1W" }, { Id: 2, Label: "1M" },
                                  { Id: 3, Label: "1QTR" } )
                        DefaultId: |
                          =Switch( gRptPeriod, "1W", 1, "1M", 2, "1QTR", 3, 3 )
                        # The ONLY interaction that refetches. Select() queues the load;
                        # nothing after it may read a fold, and nothing does.
                        OnChange: |
                          =Set( gRptPeriod, selRptPeriod.Selected.Label );
                           Set( gRptKey, selRptPeriod.Selected.Label );
                           Select( btnRptLoad )
            - wrapRptScope:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =2
                  FillPortions: =0
                  LayoutMinWidth: =260
                  Width: =260
                  Height: =56
                Children:
                  - lblRptScopeCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Scope"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        FillPortions: =0
                        LayoutMinHeight: =16
                        Width: =Parent.Width
                        Height: =16
                  # Scope NEVER refetches — it re-filters a ~40-row collection.
                  # A COMBOBOX, not a cmpSelection strip: the option list is one row per
                  # project manager and grows with the desk, so it cannot be a fixed-width
                  # strip of buttons. Bound to colRptMgrOpts rather than a literal table
                  # for the same reason.
                  - cboRptScope:
                      Control: ModernCombobox@1.1.1
                      Properties:
                        Items: =colRptMgrOpts
                        ItemDisplayText: =ThisItem.Value
                        # Matched on Em, never on the display name: two people can share a
                        # name and neither would select reliably.
                        DefaultSelectedItems: |
                          =Filter( colRptMgrOpts, Em = Coalesce(gRptScope, "") )
                        SelectMultiple: =false
                        IsSearchable: =true
                        InputTextPlaceholder: ="Scope"
                        FillPortions: =0
                        LayoutMinWidth: =Parent.Width
                        Width: =Parent.Width
                        Height: =36
                        # Re-folds the scoped email list. Same fold as the one at the end
                        # of btnRptLoad.OnSelect — keep the two identical.
                        OnChange: |
                          =Set( gRptScope, Coalesce(cboRptScope.Selected.Em, "") );
                           ClearCollect( colRptScopeEm,
                               Distinct( Filter( colRptPersonSrc,
                                                 PId in Filter( colRptPrjMap,
                                                                Mgr = Coalesce(cboRptScope.Selected.Em, "") ).PId ),
                                         Em ) )
            - lblRptAsAt:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =If( gRptBusy, "Loading…",
                         Len(Coalesce(gRptLoadedKey, "")) = 0, "Not loaded",
                         "as at " & gRptAsAt )
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  Align: =Align.Right
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =1
                  LayoutMinWidth: =120
                  Height: =56
            - icoRptRefresh:
                Control: Classic/Icon@2.5.0
                Properties:
                  Icon: =Icon.Reload
                  Color: =gTheme.Color.Primary
                  HoverColor: =gTheme.Color.PrimaryDark
                  HoverFill: =gTheme.Color.Hover
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  Tooltip: ="Refetch everything for the current period"
                  FillPortions: =0
                  LayoutMinWidth: =28
                  Width: =28
                  Height: =28
                  # Refresh(...) first so the connector does not serve the same page
                  # back, THEN the load. Both are queued behaviours, so the order here
                  # is the order they are issued in, not a guarantee of completion.
                  OnSelect: |
                    =Refresh(taskmaster_tasks); Refresh(taskmaster_transactions);
                     Refresh(taskmaster_projects); Refresh(taskmaster_issues);
                     // Products too — the load re-collects the type-path vocabulary, so
                     // refreshing only the fact lists lets a stale product path through.
                     Refresh(taskmaster_products);
                     Set( gRptLoadedKey, "" );
                     Select( btnRptLoad )
