                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        FillPortions: =0
                        LayoutMinHeight: =16
                        Width: =Parent.Width - 32
                        Height: =16
                  # ONE SCALE for all three series — they are all project counts, so a
                  # second axis would only make the line look bigger than it is.
                  - imgRptTrend:
                      Control: Image@2.2.3
                      Properties:
                        ImagePosition: =ImagePosition.Fit
                        FillPortions: =1
                        LayoutMinHeight: =160
                        Width: =Parent.Width - 32
                        Height: =Parent.Height - 80
                        Image: |
                          =With( { n: Max(1, CountRows(colRptBuckets)) },
                              With( { w: RoundDown(880 / n, 0) },
                                  "data:image/svg+xml;charset=utf-8," & EncodeUrl(
                                      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 300'>"
                                    & "<line x1='0' y1='250' x2='900' y2='250' stroke='#E1E5EB' stroke-width='2'/>"
                                    & Concat( colRptBuckets,
                                          "<rect x='" & (10 + (Idx - 1) * w) & "' y='"
                                        & (250 - Round(St / Max(1, gRptTrendMax) * 210, 0)) & "' width='"
                                        & Max(3, RoundDown(w / 2, 0) - 4) & "' height='"
                                        & Round(St / Max(1, gRptTrendMax) * 210, 0) & "' fill='#005A9E'/>"
                                        & "<rect x='" & (10 + (Idx - 1) * w + RoundDown(w / 2, 0)) & "' y='"
                                        & (250 - Round(Cp / Max(1, gRptTrendMax) * 210, 0)) & "' width='"
                                        & Max(3, RoundDown(w / 2, 0) - 4) & "' height='"
                                        & Round(Cp / Max(1, gRptTrendMax) * 210, 0) & "' fill='#31825D'/>"
                                        & "<text x='" & (10 + (Idx - 1) * w + RoundDown(w / 2, 0)) & "' y='272'"
                                        & " text-anchor='middle' font-size='15'"
                                        & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                        & EncodeHTML(Lbl) & "</text>" )
                                    & "<polyline fill='none' stroke='#D69828' stroke-width='4'"
                                    & " stroke-linejoin='round' points='"
                                    & Concat( colRptBuckets,
                                          (10 + (Idx - 1) * w + RoundDown(w / 2, 0)) & ","
                                        & (250 - Round(Net / Max(1, gRptTrendMax) * 210, 0)) & " " )
                                    & "'/>"
                                    & "</svg>" ) ) )
                  - rowRptAge:
