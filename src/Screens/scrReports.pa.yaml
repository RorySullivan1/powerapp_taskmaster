# =============================================================================
# scrReports — native analytics. Every chart is SVG in an Image control.
# Layout and chart choices: docs/reports-screen-design.md. Reasoning: .claude/memory/.
#
# FOUR RULES THIS SCREEN BREAKS IF THEY ARE IGNORED:
#  1. Fold once in btnRptLoad.OnSelect, render from the folds. NO CountRows,
#     LookUp or Filter over a fact collection in a gallery Items or row property.
#  2. Every value Power Fx feeds an SVG attribute is a WHOLE NUMBER. A fraction
#     goes through Text(), which drags the locale decimal separator into the
#     attribute and renders it EMPTY. Fractions written as string literals are safe.
#  3. Every denominator in a PROPERTY formula is wrapped Max(1, ...) at the point
#     of use. The editor evaluates property formulas with every global blank, and
#     blank divides as zero. Behaviour formulas inside btnRptLoad are exempt.
#  4. Select() QUEUES btnRptLoad — nothing may read a fold in the formula that
#     Selects it.
#
# Header and control bar are absolute (0..136); bodyRoot below them is a vertical
# auto-layout that scrolls, so no band does manual Y arithmetic.
# =============================================================================
Screens:
  scrReports:
    Properties:
      Fill: =gTheme.Color.Bg
      # Defaults and the reload guard only; the fetches live in btnRptLoad.
      OnVisible: |
        =
        // App.OnStart is non-blocking, so this screen can run before gUserEmail is set.
        If( IsBlank(gUserEmail), Set( gUserEmail, Lower(User().Email) ) );
        // SAME REASON, AND THE COST OF MISSING IT IS A FALSE BANNER: blank compares as zero, so
        // an unseeded gDataRowLimit makes every `>= gDataRowLimit` below true and gRptTrunc
        // reports all six datasets truncated. Must match App.OnStart.
        If( IsBlank(gDataRowLimit), Set( gDataRowLimit, 2000 ) );
        If( IsBlank(gRptPeriod), Set( gRptPeriod, "1QTR" ) );
        // "" is the All value and is itself blank, so IsBlank cannot seed this.
        Set( gRptScope, Coalesce(gRptScope, "") );
        If( IsBlank(gRptSort),   Set( gRptSort, "Owns" ); Set( gRptSortDesc, true ) );
        Set( gRptSelPerson, "" );
        // Refetch only when the period changed, or on the first visit.
        Set( gRptKey, gRptPeriod );
        If( gRptKey <> gRptLoadedKey, Select( btnRptLoad ) )
    Children:
      # THE LOAD. One copy, reached with Select() from three places. Hidden is fine —
      # Select fires regardless of Visible, but does NOTHING if DisplayMode is Disabled.
      - btnRptLoad:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =false
            Text: =""
            X: =0
            Y: =0
            Width: =1
            Height: =1
            # EVERY ClearCollect NAMES ITS COLUMNS. Explicit Column Selection drops a column
            # whose lineage it loses, and the loss renders as a blank number, not an error.
            OnSelect: |
              =Set( gRptBusy, true );
              // A quarter is the widest useful window: the archive flow takes rows out of these
              // lists at ~100 days. Rolling, never calendar-anchored — a calendar quarter put
              // gRptFrom on Today() every 1 April and collapsed every span derived from it.
              Set( gRptSpanDays,
                   Switch( gRptPeriod, "1W", 7, "1M", 30, "1QTR", 90, 90 ) );
              Set( gRptFrom, DateAdd( Today(), -gRptSpanDays, TimeUnit.Days ) );
              // Exactly ONE window before gRptFrom — the prior-period delta has to compare equal
              // spans. One transaction fetch serves current, prior and the trend bars.
              Set( gRptFrom2x, DateAdd( gRptFrom, -gRptSpanDays, TimeUnit.Days ) );
              // Bar granularity follows the window: days for 1W, weeks otherwise.
              Set( gRptBucketDays, If( gRptPeriod = "1W", 1, 7 ) );
              Set( gRptBucketN, RoundUp( gRptSpanDays / gRptBucketDays, 0 ) );
              // EVERY FILTER HERE DELEGATES; the ForAll is a LOCAL projection over what returns.
              //
              // ShowColumns MUST NOT BE USED OVER ANYTHING ROOTED IN A NAMED FORMULA, and a
              // Filter wrapped around one does NOT fix it: text columns read back as an ERROR
              // type. Burned twice — task_name off LiveTasks, project_name off ActiveProjects.
              // colRptTx below keeps ShowColumns because it filters a DATA SOURCE directly,
              // which is the only safe form. Stages are enumerated because Text <> won't delegate.
              Concurrent(
                  ClearCollect( colRptOpen,
                      ForAll(
                          Filter( LiveTasks,
                                  task_stage.Value = "Not Started" || task_stage.Value = "Planning"
                               || task_stage.Value = "Drafting"    || task_stage.Value = "Finalizing" ) As s,
                          { ID:                   s.ID,
                            task_name:            s.task_name,
                            task_stage:           s.task_stage,
                            task_status:          s.task_status,
                            task_date_start:      s.task_date_start,
                            task_date_target:     s.task_date_target,
                            task_lead:            s.task_lead,
                            task_supporter:       s.task_supporter,
                            task_project_id:      s.task_project_id,
                            task_output_audience: s.task_output_audience } ) ),
                  // BOUNDED ON STAGE ALONE. task_date_completion is optional and `>= gRptFrom` is
                  // FALSE for a blank date, so bounding the fetch on the period would drop every
                  // dateless Completed task and leave Done and the medians silently empty.
                  ClearCollect( colRptDoneAll,
                      ForAll( Filter( LiveTasks, task_stage.Value = "Completed" ) As d,
                          { ID:                   d.ID,
                            task_name:            d.task_name,
                            task_status:          d.task_status,
                            task_date_start:      d.task_date_start,
                            task_date_completion: d.task_date_completion,
                            task_date_target:     d.task_date_target,
                            task_lead:            d.task_lead,
                            task_supporter:       d.task_supporter,
                            task_project_id:      d.task_project_id } ) ),
                  // F3 is the LOAD-BEARING bound — transactions grow fastest.
                  ClearCollect( colRptTx,
                      ShowColumns(
                          Filter( taskmaster_transactions,
                                  transaction_project_archived = false
                               && transaction_date >= gRptFrom2x ),
                          ID, transaction_date, transaction_client_name, transaction_project_id,
                          transaction_product_id, transaction_currency, transaction_notional ) ),
                  // Explicit projection for the same reason as F1: project_name off ActiveProjects,
                  // a named formula. Choice and Person columns are copied WHOLE so .Value resolves.
                  ClearCollect( colRptPrj,
                      ForAll( ActiveProjects As p,
                          { ID:                      p.ID,
                            project_name:            p.project_name,
                            project_phase:           p.project_phase,
                            project_perc_completion: p.project_perc_completion,
                            project_date_start:      p.project_date_start,
                            project_date_target:     p.project_date_target,
                            project_date_complete:   p.project_date_complete,
                            project_type_path:       p.project_type_path,
                            project_region_path:     p.project_region_path,
                            project_requestor:       p.project_requestor,
                            project_manager:         p.project_manager,
                            project_supporter:       p.project_supporter } ) ),
                  // ShowColumns over a named formula, safe ONLY because nothing reads a field off
                  // this — it feeds one CountRows. Project it by hand before reading a column.
                  ClearCollect( colRptIss, ShowColumns( OpenIssues, ID, issue_project_id ) )
              );
              // A completed task with NO completion date is in, in every window. The count is
              // stated beside the people table rather than dropped.
              ClearCollect( colRptDone,
                  Filter( colRptDoneAll,
                          IsBlank(task_date_completion) || task_date_completion >= gRptFrom ) );
              Set( gRptDoneNoDate,
                   CountRows( Filter(colRptDoneAll, IsBlank(task_date_completion)) ) );
              // Fetched whole because a transaction reaches a product by ID, not by path.
              ClearCollect( colRptProducts,
                  ShowColumns( taskmaster_products, ID, product_uid, product_type_path ) );
              // Aggregates never delegate, so this is the only place the app can notice it ran out.
              // gDataRowLimit, never a literal: the ceiling is a Studio setting no paste carries,
              // and six copies of it is six places to miss when the app is rebuilt.
              Set( gRptTrunc,
                   Trim(
                     If( CountRows(colRptOpen) >= gDataRowLimit, "open tasks  ", "" ) &
                     If( CountRows(colRptDoneAll) >= gDataRowLimit, "completed tasks  ", "" ) &
                     If( CountRows(colRptTx)   >= gDataRowLimit, "transactions  ", "" ) &
                     If( CountRows(colRptPrj)  >= gDataRowLimit, "projects  ", "" ) &
                     If( CountRows(colRptIss)      >= gDataRowLimit, "issues  ", "" ) &
                     If( CountRows(colRptProducts) >= gDataRowLimit, "products  ", "" ) ) );
              // Transactions inside the CURRENT window; colRptTx holds two windows.
              ClearCollect( colRptTxCur, Filter( colRptTx, transaction_date >= gRptFrom ) );
              // Level 1 of an "A | B | C" path with Find/Left, NOT Split — the separator is part
              // of the stored data and blanks need their own bucket.
              ClearCollect( colRptPrjMap,
                  ForAll( colRptPrj As p,
                      { PId:  p.ID,
                        PNm:  p.project_name,
                        Fam:  With( { s: Trim(Coalesce(p.project_type_path, "")) },
                                  With( { i: Find(" | ", s) },
                                      If( IsBlank(s), "Unclassified",
                                          If( i > 0, Left(s, i - 1), s ) ) ) ),
                        Rgn:  With( { s: Trim(Coalesce(p.project_region_path, "")) },
                                  With( { i: Find(" | ", s) },
                                      If( IsBlank(s), "Unassigned",
                                          If( i > 0, Left(s, i - 1), s ) ) ) ),
                        // project_requestor is OPTIONAL and needs its own bucket. Display name first,
                        // email as fallback: a Person column can carry one without the other.
                        Req:  With( { n: Coalesce(p.project_requestor.DisplayName, ""),
                                      e: Coalesce(p.project_requestor.Email, "") },
                                  If( Len(n) > 0, n, If( Len(e) > 0, e, "Unassigned" ) ) ),
                        Mgr:  Lower(Coalesce(p.project_manager.Email, "")),
                        // Email is the key, the name is only ever shown.
                        MgrNm: Coalesce(p.project_manager.DisplayName, ""),
                        Sup:  Lower(Coalesce(p.project_supporter.Email, "")) } ) );
              // "All" plus one row per manager on a project in the window. Em is the key and is
              // BLANK for "All", which is what the filter tests.
              ClearCollect( colRptMgrOpts, { Value: "All", Em: "" } );
              Collect( colRptMgrOpts,
                  Sort( ForAll( Distinct( Filter(colRptPrjMap, Len(Mgr) > 0), Mgr ) As m,
                            { Value: With( { n: LookUp(colRptPrjMap, Mgr = m.Value, MgrNm) },
                                         If( Len(Coalesce(n, "")) > 0, n, m.Value ) ),
                              Em:    m.Value } ),
                        Value ) );
              // TWO ATTRIBUTION PATHS, BOTH FROM TASKS: task_lead owns, task_supporter supports.
              // Counted separately and NEVER summed into one workload number — that double-counts
              // the desk. Days and OnT carry -1 for "not applicable" so the medians and rates can
              // exclude them without confusing a real zero with a missing value.
              Clear( colRptPersonSrc );
              Collect( colRptPersonSrc,
                  Filter( Ungroup(
                      ForAll( colRptOpen As t,
                          With( { stg: Coalesce( t.task_stage.Value, "Unspecified" ),
                                  // EFFECTIVE HEALTH, NOT THE STORED COLUMN. task_status holds only
                                  // the issue-derived half; OVERDUE IS FOLDED IN HERE because it
                                  // changes with no write. Reading task_status raw UNDER-REPORTS Red.
                                  // See rollups.task_health in schema.yaml.
                                  hth: If( !IsBlank(t.task_date_target)
                                        && t.task_date_target < Today(), "Red",
                                           Coalesce( t.task_status.Value, "—" ) ),
                                  // Hoisted: compared on every measure of the supports row.
                                  dup: Lower(Coalesce(t.task_supporter.Email, "")) = Lower(Coalesce(t.task_lead.Email, "")) },
                          { r: Table(
                              { Em: Lower(Coalesce(t.task_lead.Email, "")),
                                Nm: Coalesce(t.task_lead.DisplayName, ""),
                                Role: "Owns", PId: t.task_project_id.Id, Op: 1,
                                Ovd: If( !IsBlank(t.task_date_target) && t.task_date_target < Today(), 1, 0 ),
                                Gc: If(hth = "Green", 1, 0),
                                Ac: If(hth = "Amber", 1, 0),
                                Rc: If(hth = "Red",   1, 0),
                                Dn: 0, Days: -1, OnT: -1, Stg: stg,
                                TId: t.ID, TNm: t.task_name, Hth: hth,
                                Dst: t.task_date_start, Dtl: t.task_date_target, Dup: false },
                              // SAME PERSON ON BOTH COLUMNS IS COUNTED IN BOTH ROLES, ONCE PER
                              // MEASURE. The row stays and carries the role; dup zeroes every
                              // measure on it — Ovd/Gc/Ac/Rc/Dn to 0, Days/OnT to -1, which the
                              // median and on-time folds already read as "not applicable".
                              { Em: Lower(Coalesce(t.task_supporter.Email, "")),
                                Nm: Coalesce(t.task_supporter.DisplayName, ""),
                                Role: "Supports",
                                                                PId: t.task_project_id.Id, Op: 1,
                                Ovd: If( dup, 0,
                                         If( !IsBlank(t.task_date_target) && t.task_date_target < Today(), 1, 0 ) ),
                                Gc: If( dup, 0, If(hth = "Green", 1, 0) ),
                                Ac: If( dup, 0, If(hth = "Amber", 1, 0) ),
                                Rc: If( dup, 0, If(hth = "Red",   1, 0) ),
                                Dn: 0, Days: -1, OnT: -1, Stg: stg,
                                TId: t.ID, TNm: t.task_name, Hth: hth,
                                Dst: t.task_date_start, Dtl: t.task_date_target, Dup: dup } ) } ) ),
                      r ), Len(Em) > 0 ) );
              Collect( colRptPersonSrc,
                  Filter( Ungroup(
                      ForAll( colRptDone As t,
                          // No overdue fold here: a finished task is not at risk for having landed late.
                          With( { hth: Coalesce( t.task_status.Value, "—" ),
                                  // A completed task may carry no completion date, so both durations
                                  // fall back to "not applicable" rather than measuring against a blank.
                                  nod: IsBlank(t.task_date_completion),
                                  dup: Lower(Coalesce(t.task_supporter.Email, "")) = Lower(Coalesce(t.task_lead.Email, "")) },
                          { r: Table(
                              { Em: Lower(Coalesce(t.task_lead.Email, "")),
                                Nm: Coalesce(t.task_lead.DisplayName, ""),
                                Role: "Owns", PId: t.task_project_id.Id, Op: 0,
                                Ovd: 0, Gc: 0, Ac: 0, Rc: 0, Dn: 1,
                                Days: If( nod || IsBlank(t.task_date_start), -1,
                                          DateDiff(t.task_date_start, t.task_date_completion, TimeUnit.Days) ),
                                OnT:  If( nod || IsBlank(t.task_date_target), -1,
                                          If(t.task_date_completion <= t.task_date_target, 1, 0) ),
                                Stg: "Completed",
                                TId: t.ID, TNm: t.task_name, Hth: hth,
                                Dst: t.task_date_start, Dtl: t.task_date_target, Dup: false },
                              { Em: Lower(Coalesce(t.task_supporter.Email, "")),
                                Nm: Coalesce(t.task_supporter.DisplayName, ""),
                                Role: "Supports",
                                                                PId: t.task_project_id.Id, Op: 0,
                                // Zeroed on a duplicate exactly as on the open branch; the row itself
                                // survives so the role is still counted.
                                Ovd: 0, Gc: 0, Ac: 0, Rc: 0,
                                Dn: If( dup, 0, 1 ),
                                Days: If( dup || nod, -1,
                                          If( IsBlank(t.task_date_start), -1,
                                          DateDiff(t.task_date_start, t.task_date_completion, TimeUnit.Days) ) ),
                                OnT:  If( dup || nod, -1,
                                          If( IsBlank(t.task_date_target), -1,
                                          If(t.task_date_completion <= t.task_date_target, 1, 0) ) ),
                                Stg: "Completed",
                                TId: t.ID, TNm: t.task_name, Hth: hth,
                                Dst: t.task_date_start, Dtl: t.task_date_target, Dup: dup } ) } ) ),
                      r ), Len(Em) > 0 ) );
              // ~40 rows, every measure precomputed once per load — no gallery row may scan a
              // fact collection.
              // MEDIAN is hand-rolled because Power Fx has none: sort, take the lower-middle
              // element. On an even count that is the lower of the two, deliberately.
              // gRptNoSup states how many open tasks record NO supporter at all — without it a
              // support count of zero means two different things and the screen cannot say which.
              Set( gRptNoSup,
                   CountRows( Filter( colRptOpen, IsBlank(task_supporter.Email) ) ) );
              ClearCollect( colRptPerson,
                  ForAll( Distinct( Filter(colRptPersonSrc, Len(Em) > 0), Em ) As pp,
                      With( { rw: Filter(colRptPersonSrc, Em = pp.Value) },
                          { Em:   pp.Value,
                            Nm:   First(rw).Nm,
                            // BOTH COLUMNS COUNT EVERY TASK IN THE ROLE, open or finished.
                            // The MEASURES beside them stay lifecycle-scoped: Ovd/Gc/Ac/Rc are
                            // zero on a completed row, Dn counts only completed ones.
                            Owns: CountRows( Filter(rw, Role = "Owns") ),
                            Sups: CountRows( Filter(rw, Role = "Supports") ),
                            Ovd:  Sum(rw, Ovd),
                            Gc:   Sum(rw, Gc), Ac: Sum(rw, Ac), Rc: Sum(rw, Rc),
                            Dn:   Sum(rw, Dn),
                            Med:  With( { ds: Sort( Filter(rw, Days >= 0), Days ) },
                                      With( { n: CountRows(ds) },
                                          If( n = 0, -1, Index(ds, RoundUp(n / 2, 0)).Days ) ) ),
                            OnTp: With( { dt: Filter(rw, OnT >= 0) },
                                      If( CountRows(dt) = 0, -1,
                                          RoundDown( Sum(dt, OnT) / Max(1, CountRows(dt)) * 100, 0 ) ) ) } ) ) );
              // ---- desk pulse ------------------------------------------------------
              Set( gRptOpenN,  CountRows(colRptOpen) );
              Set( gRptOvdN,   CountRows( Filter( colRptOpen,
                                   !IsBlank(task_date_target) && task_date_target < Today() ) ) );
              Set( gRptTxN,    CountRows(colRptTxCur) );
              Set( gRptTxPrev, CountRows( Filter(colRptTx, transaction_date < gRptFrom) ) );
              Set( gRptIssN,   CountRows(colRptIss) );
              // Tag each open task ONCE with everything the breakdowns group on, so no chart
              // re-joins per category. The LookUp is HOISTED — family, region and requestor all
              // come off the same project row, and three LookUps would triple the join.
              ClearCollect( colRptOpenTag,
                  ForAll( colRptOpen As t,
                      With( { pm: LookUp(colRptPrjMap, PId = t.task_project_id.Id) },
                          { Fam: Coalesce( pm.Fam, "Unclassified" ),
                            Rgn: Coalesce( pm.Rgn, "Unassigned" ),
                            Req: Coalesce( pm.Req, "Unassigned" ),
                            Aud: Coalesce( t.task_output_audience.Value, "Unspecified" ) } ) ) );
              ClearCollect( colRptFamAll,
                  ForAll( Distinct(colRptOpenTag, Fam) As f,
                      { K: f.Value, N: CountRows( Filter(colRptOpenTag, Fam = f.Value) ) } ) );
              // TOP 6 + Other. Sorted here, once, so the renderer can index straight in.
              ClearCollect( colRptFam, FirstN( Sort(colRptFamAll, N, SortOrder.Descending), 6 ) );
              Set( gRptFamOther, CountRows(colRptOpenTag) - Coalesce(Sum(colRptFam, N), 0) );
              Clear( colRptFamBar );
              Collect( colRptFamBar,
                  ForAll( Sequence( CountRows(colRptFam) ) As s,
                      With( { r: Index(colRptFam, s.Value) },
                          { Idx: s.Value, K: r.K, N: r.N } ) ) );
              If( gRptFamOther > 0,
                  Collect( colRptFamBar,
                      { Idx: CountRows(colRptFam) + 1, K: "Other", N: gRptFamOther } ) );
              Set( gRptFamMax, Max( 1, Coalesce(Max(colRptFamBar, N), 0) ) );
              // THE VOCABULARY COMES FROM THE COLUMN via Choices(), never a literal list that
              // drifts when someone edits the column. It returns EVERY value the column offers,
              // so a value no task holds still draws a zero bar — which a GroupBy would delete.
              ClearCollect( colRptAudVocab,
                  ForAll( Choices([@taskmaster_tasks].task_output_audience) As c,
                          { K: c.Value } ) );
              Clear( colRptAudBar );
              Collect( colRptAudBar,
                  ForAll( Sequence( CountRows(colRptAudVocab) ) As s,
                      With( { k: Index(colRptAudVocab, s.Value).K },
                          { Idx: s.Value, K: k,
                            N: CountRows( Filter(colRptOpenTag, Aud = k) ) } ) ) );
              // Blank is not a Choice value and needs its own bucket. Unspecified is mostly
              // "predates the column", not "nobody bothered"; "Other" means a value tasks still
              // hold that the column no longer offers.
              Collect( colRptAudBar,
                  { Idx: CountRows(colRptAudVocab) + 1, K: "Unspecified",
                    N: CountRows( Filter(colRptOpenTag, Aud = "Unspecified") ) },
                  { Idx: CountRows(colRptAudVocab) + 2, K: "Other",
                    N: CountRows( Filter( colRptOpenTag,
                           Aud <> "Unspecified" && !(Aud in colRptAudVocab.K) ) ) } );
              // A PIE, so it needs slice geometry rather than a bar maximum.
              Set( gRptAudTot, Max( 1, Coalesce(Sum(colRptAudBar, N), 0) ) );
              ClearCollect( colRptAudPie,
                  ForAll( Filter(colRptAudBar, N > 0) As r,
                      With( { cb: Coalesce( Sum( Filter(colRptAudBar, Idx < r.Idx), N ), 0 ) },
                          { Idx: r.Idx, K: r.K, N: r.N,
                            // LEGEND ROW, not Idx — a dropped zero-count row would gap the legend.
                            Li:  CountRows( Filter(colRptAudBar, N > 0 && Idx <= r.Idx) ),
                            Off: RoundDown( cb / gRptAudTot * 100, 0 ),
                            Pct: RoundDown( (cb + r.N) / gRptAudTot * 100, 0 )
                                 - RoundDown( cb / gRptAudTot * 100, 0 ),
                            Hx:  If( r.K = "Other", "#C53A3A",
                                     If( r.K = "Unspecified", "#B9C0C8",
                                         Switch( Mod(r.Idx - 1, 6),
                                                 0, "#005A9E", 1, "#2E8B9A", 2, "#D69828",
                                                 3, "#7A6FB0", 4, "#C05F3C", "#4A9E63" ) ) ) } ) ) );
              // Top 6 + Other: the requestor list is open-ended and forty rows is not a chart.
              ClearCollect( colRptReqAll,
                  ForAll( Distinct(colRptOpenTag, Req) As r,
                      { K: r.Value, N: CountRows( Filter(colRptOpenTag, Req = r.Value) ) } ) );
              ClearCollect( colRptReqTop, FirstN( Sort(colRptReqAll, N, SortOrder.Descending), 6 ) );
              Set( gRptReqOther, CountRows(colRptOpenTag) - Coalesce(Sum(colRptReqTop, N), 0) );
              Clear( colRptReqBar );
              Collect( colRptReqBar,
                  ForAll( Sequence( CountRows(colRptReqTop) ) As s,
                      With( { r: Index(colRptReqTop, s.Value) },
                          { Idx: s.Value, K: r.K, N: r.N } ) ) );
              If( gRptReqOther > 0,
                  Collect( colRptReqBar,
                      { Idx: CountRows(colRptReqTop) + 1, K: "Other", N: gRptReqOther } ) );
              Set( gRptReqMax, Max( 1, Coalesce(Max(colRptReqBar, N), 0) ) );
              // PIE SLICES ARE WHOLE PERCENTAGES FROM A RUNNING CUMULATIVE, never rounded one
              // slice at a time: Pct = Cum(i) - Cum(i-1), so the rounding error stays inside a
              // slice and the wedges always close the circle. Off is that same cumulative.
              // Zero-count slices are dropped — a Pct of 0 draws nothing but eats a legend row.
              ClearCollect( colRptRgnAll,
                  ForAll( Distinct(colRptOpenTag, Rgn) As r,
                      { K: r.Value, N: CountRows( Filter(colRptOpenTag, Rgn = r.Value) ) } ) );
              ClearCollect( colRptRgnTop, FirstN( Sort(colRptRgnAll, N, SortOrder.Descending), 5 ) );
              Set( gRptRgnOther, CountRows(colRptOpenTag) - Coalesce(Sum(colRptRgnTop, N), 0) );
              Clear( colRptRgnSeq );
              Collect( colRptRgnSeq,
                  ForAll( Sequence( CountRows(colRptRgnTop) ) As s,
                      With( { r: Index(colRptRgnTop, s.Value) },
                          { Idx: s.Value, K: r.K, N: r.N } ) ) );
              If( gRptRgnOther > 0,
                  Collect( colRptRgnSeq,
                      { Idx: CountRows(colRptRgnTop) + 1, K: "Other", N: gRptRgnOther } ) );
              Set( gRptRgnTot, Max( 1, Coalesce(Sum(colRptRgnSeq, N), 0) ) );
              ClearCollect( colRptRgnPie,
                  ForAll( Filter(colRptRgnSeq, N > 0) As r,
                      With( { cb: Coalesce( Sum( Filter(colRptRgnSeq, Idx < r.Idx), N ), 0 ) },
                          { Idx: r.Idx, K: r.K, N: r.N,
                            // LEGEND ROW, not Idx — a dropped zero-count row would gap the legend.
                            Li:  CountRows( Filter(colRptRgnSeq, N > 0 && Idx <= r.Idx) ),
                            Off: RoundDown( cb / gRptRgnTot * 100, 0 ),
                            Pct: RoundDown( (cb + r.N) / gRptRgnTot * 100, 0 )
                                 - RoundDown( cb / gRptRgnTot * 100, 0 ),
                            Hx:  If( r.K = "Other" || r.K = "Unassigned", "#B9C0C8",
                                     Switch( Mod(r.Idx - 1, 6),
                                             0, "#005A9E", 1, "#2E8B9A", 2, "#D69828",
                                             3, "#7A6FB0", 4, "#C05F3C", "#4A9E63" ) ) } ) ) );
              // Buckets keyed on a whole number of DAYS since gRptFrom, so one keying serves all
              // three windows with no month-length or timezone edge.
              // EVERY BUCKET FILTER CARRIES ITS OWN LOWER BOUND: RoundDown truncates toward
              // zero, so a date before gRptFrom yields -0.4 -> 0 and lands in bucket 1. colRptPrj
              // is not date-bounded, so without the bound the first bar absorbs the whole backlog.
              // The prior window is aligned POSITIONALLY: bucket i against bucket i.
              ClearCollect( colRptBucketsRaw,
                  ForAll( Sequence( gRptBucketN ) As s,
                      With( { d: DateAdd( gRptFrom, (s.Value - 1) * gRptBucketDays, TimeUnit.Days ),
                              k: s.Value - 1 },
                              { Idx: s.Value,
                                Lbl: If( gRptBucketDays = 1,
                                         Text(d, "[$-en-US]ddd"),
                                         Text(d, "[$-en-US]d mmm") ),
                                St: CountRows( Filter( colRptPrj,
                                        !IsBlank(project_date_start)
                                     && project_date_start >= gRptFrom
                                     && RoundDown( DateDiff(gRptFrom, project_date_start, TimeUnit.Days)
                                                   / gRptBucketDays, 0 ) = k ) ),
                                Cp: CountRows( Filter( colRptPrj,
                                        !IsBlank(project_date_complete)
                                     && project_date_complete >= gRptFrom
                                     && RoundDown( DateDiff(gRptFrom, project_date_complete, TimeUnit.Days)
                                                   / gRptBucketDays, 0 ) = k ) ),
                                // colRptTxCur, NOT colRptTx. colRptTx spans TWO windows, so
                                // reading it here counts the prior window into the current bars.
                                Tx: CountRows( Filter( colRptTxCur,
                                        RoundDown( DateDiff(gRptFrom, transaction_date, TimeUnit.Days)
                                                   / gRptBucketDays, 0 ) = k ) ),
                                // Keyed off gRptFrom2x, so bucket i here is the same offset
                                // into the prior window as bucket i is into the current one.
                                TxP: CountRows( Filter( colRptTx,
                                        transaction_date < gRptFrom
                                     && RoundDown( DateDiff(gRptFrom2x, transaction_date, TimeUnit.Days)
                                                   / gRptBucketDays, 0 ) = k ) ) } ) ) );
              // CUMULATIVE NET OPEN — started minus completed, running. Built from dated EVENTS,
              // so it needs no snapshot list.
              ClearCollect( colRptBuckets,
                  ForAll( colRptBucketsRaw As m,
                      { Idx: m.Idx, Lbl: m.Lbl, St: m.St, Cp: m.Cp, Tx: m.Tx, TxP: m.TxP,
                        Net: Coalesce( Sum( Filter(colRptBucketsRaw, Idx <= m.Idx), St ), 0 )
                           - Coalesce( Sum( Filter(colRptBucketsRaw, Idx <= m.Idx), Cp ), 0 ) } ) );
              Set( gRptTrendMax,
                   Max( 1, Coalesce(Max(colRptBuckets, St), 0),
                           Coalesce(Max(colRptBuckets, Cp), 0),
                           Coalesce(Max(colRptBuckets, Net), 0) ) );
              Set( gRptTxMax,
                   Max( 1, Coalesce(Max(colRptBuckets, Tx), 0),
                           Coalesce(Max(colRptBuckets, TxP), 0) ) );
              // A FIXED SEQUENCE, NOT Distinct. project_phase is a closed vocabulary, so
              // enumerating it holds lifecycle order and pins one colour per phase across
              // refreshes; Distinct would reorder both the moment a phase emptied.
              ClearCollect( colRptPhSeq,
                  ForAll( Sequence(5) As s,
                      With( { k: Switch( s.Value, 1, "Not Started", 2, "Planning",
                                                  3, "Active",      4, "Stalled",
                                                     "Complete" ) },
                          { Idx: s.Value, K: k,
                            N:  CountRows( Filter(colRptPrj, project_phase.Value = k) ),
                            Hx: Switch( s.Value, 1, "#B9C0C8", 2, "#2E8B9A", 3, "#005A9E",
                                                 4, "#C05F3C", "#31825D" ) } ) ) );
              Set( gRptPhTot, Max( 1, Coalesce(Sum(colRptPhSeq, N), 0) ) );
              ClearCollect( colRptPhPie,
                  ForAll( Filter(colRptPhSeq, N > 0) As r,
                      With( { cb: Coalesce( Sum( Filter(colRptPhSeq, Idx < r.Idx), N ), 0 ) },
                          { Idx: r.Idx, K: r.K, N: r.N, Hx: r.Hx,
                            Li:  CountRows( Filter(colRptPhSeq, N > 0 && Idx <= r.Idx) ),
                            Off: RoundDown( cb / gRptPhTot * 100, 0 ),
                            Pct: RoundDown( (cb + r.N) / gRptPhTot * 100, 0 )
                                 - RoundDown( cb / gRptPhTot * 100, 0 ) } ) ) );
              // Nothing else on the screen counts open work with no date to be late by.
              Set( gRptNoTarget, CountRows( Filter( colRptPrj, project_phase.Value <> "Complete"
                                     && IsBlank(project_date_target) ) ) );
              // FORWARD-LOOKING AND DELIBERATELY OUTSIDE THE PERIOD WINDOW — keyed on Today(),
              // so the period strip does not move it. A task whose target has already passed is
              // still open and counts as overdue beside the chart, not in a bar.
              ClearCollect( colRptDueSrc,
                  ForAll( Filter(colRptOpen, !IsBlank(task_date_target)) As t,
                      { Dd: DateDiff( Today(), t.task_date_target, TimeUnit.Days ) } ) );
              Set( gRptDueOver,   CountRows( Filter(colRptDueSrc, Dd < 0) ) );
              Set( gRptDueBeyond, CountRows( Filter(colRptDueSrc, Dd > 14) ) );
              Set( gRptDueNone,   CountRows( Filter(colRptOpen, IsBlank(task_date_target)) ) );
              // Weekend is read off the FORMATTED day name, not Weekday() — that function appears
              // nowhere else in this app and its numbering cannot be confirmed here. "[$-en-US]ddd"
              // is already the format the trend bucket labels use.
              ClearCollect( colRptDueBars,
                  ForAll( Sequence(15) As s,
                      With( { dv: s.Value - 1 },
                          With( { dt: DateAdd( Today(), s.Value - 1, TimeUnit.Days ) },
                              { Idx: s.Value,
                                Lbl: Text( dt, "[$-en-US]d" ),
                                // Month only where it changes, so the day numbers stay readable.
                                Mon: If( s.Value = 1 || Text(dt, "[$-en-US]d") = "1",
                                         Text(dt, "[$-en-US]mmm"), "" ),
                                We:  With( { w: Text(dt, "[$-en-US]ddd") },
                                         If( w = "Sat" || w = "Sun", 1, 0 ) ),
                                N:   CountRows( Filter(colRptDueSrc, Dd = dv) ) } ) ) ) );
              Set( gRptDueMax, Max( 1, Coalesce(Max(colRptDueBars, N), 0) ) );
              // ACCEPTED COST, NOT AN OVERSIGHT: a linear LookUp per transaction, so this is
              // O(tx x products) + O(tx x projects) and re-runs on every period change. Power Fx
              // has no hash join and no index on a collection. If it ever becomes the bottleneck
              // the fix is denormalised columns on the transaction, not a smarter join here.
              // ONE LookUp PER DIMENSION. Level 2 is the segment after the first " | "; a path
              // with only one segment has none, which is its own bucket and NOT "Unclassified".
              ClearCollect( colRptTxEnriched,
                  ForAll( colRptTxCur As x,
                      With( { sp: Trim( Coalesce( LookUp( colRptProducts,
                                            ID = x.transaction_product_id.Id ).product_type_path, "" ) ),
                              pm: LookUp( colRptPrjMap, PId = x.transaction_project_id.Id ) },
                          With( { i: Find(" | ", sp) },
                              // Right, not Mid: the " | " separator is 3 characters, so the
                              // remainder starts at i + 3 and runs to the end.
                              With( { rest: If( i > 0, Trim(Right(sp, Len(sp) - i - 2)), "" ) },
                                  With( { j: Find(" | ", rest) },
                                      { Prd: If( IsBlank(sp), "Unclassified",
                                                 If( i > 0, Left(sp, i - 1), sp ) ),
                                        Pr2: If( Len(rest) = 0, "Top level only",
                                                 If( j > 0, Left(rest, j - 1), rest ) ),
                                        // Resolved here so the display name and the email fallback travel together.
                                        Ld:  With( { n: Coalesce(pm.MgrNm, ""),
                                                     e: Coalesce(pm.Mgr, "") },
                                                 If( Len(n) > 0, n,
                                                     If( Len(e) > 0, e, "Unassigned" ) ) ),
                                        Dt:  x.transaction_date,
                                        Ccy: Coalesce(x.transaction_currency.Value, "—"),
                                        Amt: Coalesce(x.transaction_notional, 0) } ) ) ) ) ) );
              // PER CURRENCY, NEVER SUMMED ACROSS THEM — cross-currency conversion is out of scope.
              ClearCollect( colRptCcy,
                  ForAll( Distinct(colRptTxEnriched, Ccy) As c,
                      { K: c.Value,
                        N:   CountRows( Filter(colRptTxEnriched, Ccy = c.Value) ),
                        Tot: Coalesce( Sum( Filter(colRptTxEnriched, Ccy = c.Value), Amt ), 0 ) } ) );
              // ATTRIBUTION IS PROJECT-LEVEL AND SAYS SO ON THE PANEL: transactions on projects
              // the person MANAGES. Neither their own task work nor sales credit.
              ClearCollect( colRptLdAll,
                  ForAll( Distinct(colRptTxEnriched, Ld) As d,
                      { K: d.Value, N: CountRows( Filter(colRptTxEnriched, Ld = d.Value) ) } ) );
              ClearCollect( colRptLdTop, FirstN( Sort(colRptLdAll, N, SortOrder.Descending), 6 ) );
              Set( gRptLdOther, CountRows(colRptTxEnriched) - Coalesce(Sum(colRptLdTop, N), 0) );
              Clear( colRptLdBar );
              Collect( colRptLdBar,
                  ForAll( Sequence( CountRows(colRptLdTop) ) As s,
                      With( { r: Index(colRptLdTop, s.Value) },
                          { Idx: s.Value, K: r.K, N: r.N } ) ) );
              If( gRptLdOther > 0,
                  Collect( colRptLdBar,
                      { Idx: CountRows(colRptLdTop) + 1, K: "Other", N: gRptLdOther } ) );
              Set( gRptLdMax, Max( 1, Coalesce(Max(colRptLdBar, N), 0) ) );
              // Same running-cumulative slice geometry as the region pie above.
              ClearCollect( colRptPrdAll,
                  ForAll( Distinct(colRptTxEnriched, Prd) As d,
                      { K: d.Value, N: CountRows( Filter(colRptTxEnriched, Prd = d.Value) ) } ) );
              ClearCollect( colRptPrdTop, FirstN( Sort(colRptPrdAll, N, SortOrder.Descending), 5 ) );
              Set( gRptPrdOther, CountRows(colRptTxEnriched) - Coalesce(Sum(colRptPrdTop, N), 0) );
              Clear( colRptPrdSeq );
              Collect( colRptPrdSeq,
                  ForAll( Sequence( CountRows(colRptPrdTop) ) As s,
                      With( { r: Index(colRptPrdTop, s.Value) },
                          { Idx: s.Value, K: r.K, N: r.N } ) ) );
              If( gRptPrdOther > 0,
                  Collect( colRptPrdSeq,
                      { Idx: CountRows(colRptPrdTop) + 1, K: "Other", N: gRptPrdOther } ) );
              Set( gRptPrdTot, Max( 1, Coalesce(Sum(colRptPrdSeq, N), 0) ) );
              ClearCollect( colRptPrdPie,
                  ForAll( Filter(colRptPrdSeq, N > 0) As r,
                      With( { cb: Coalesce( Sum( Filter(colRptPrdSeq, Idx < r.Idx), N ), 0 ) },
                          { Idx: r.Idx, K: r.K, N: r.N,
                            // LEGEND ROW, not Idx — a dropped zero-count row would gap the legend.
                            Li:  CountRows( Filter(colRptPrdSeq, N > 0 && Idx <= r.Idx) ),
                            Off: RoundDown( cb / gRptPrdTot * 100, 0 ),
                            Pct: RoundDown( (cb + r.N) / gRptPrdTot * 100, 0 )
                                 - RoundDown( cb / gRptPrdTot * 100, 0 ),
                            Hx:  If( r.K = "Other" || r.K = "Unclassified", "#B9C0C8",
                                     Switch( Mod(r.Idx - 1, 6),
                                             0, "#005A9E", 1, "#2E8B9A", 2, "#D69828",
                                             3, "#7A6FB0", 4, "#C05F3C", "#4A9E63" ) ) } ) ) );
              ClearCollect( colRptPr2All,
                  ForAll( Distinct(colRptTxEnriched, Pr2) As d,
                      { K: d.Value, N: CountRows( Filter(colRptTxEnriched, Pr2 = d.Value) ) } ) );
              ClearCollect( colRptPr2Top, FirstN( Sort(colRptPr2All, N, SortOrder.Descending), 5 ) );
              Set( gRptPr2Other, CountRows(colRptTxEnriched) - Coalesce(Sum(colRptPr2Top, N), 0) );
              Clear( colRptPr2Seq );
              Collect( colRptPr2Seq,
                  ForAll( Sequence( CountRows(colRptPr2Top) ) As s,
                      With( { r: Index(colRptPr2Top, s.Value) },
                          { Idx: s.Value, K: r.K, N: r.N } ) ) );
              If( gRptPr2Other > 0,
                  Collect( colRptPr2Seq,
                      { Idx: CountRows(colRptPr2Top) + 1, K: "Other", N: gRptPr2Other } ) );
              Set( gRptPr2Tot, Max( 1, Coalesce(Sum(colRptPr2Seq, N), 0) ) );
              ClearCollect( colRptPr2Pie,
                  ForAll( Filter(colRptPr2Seq, N > 0) As r,
                      With( { cb: Coalesce( Sum( Filter(colRptPr2Seq, Idx < r.Idx), N ), 0 ) },
                          { Idx: r.Idx, K: r.K, N: r.N,
                            // LEGEND ROW, not Idx — a dropped zero-count row would gap the legend.
                            Li:  CountRows( Filter(colRptPr2Seq, N > 0 && Idx <= r.Idx) ),
                            Off: RoundDown( cb / gRptPr2Tot * 100, 0 ),
                            Pct: RoundDown( (cb + r.N) / gRptPr2Tot * 100, 0 )
                                 - RoundDown( cb / gRptPr2Tot * 100, 0 ),
                            Hx:  If( r.K = "Other" || r.K = "Top level only", "#B9C0C8",
                                     Switch( Mod(r.Idx - 1, 6),
                                             0, "#005A9E", 1, "#2E8B9A", 2, "#D69828",
                                             3, "#7A6FB0", 4, "#C05F3C", "#4A9E63" ) ) } ) ) );
              // An SVG Concat cannot carry a running total, so the base each segment sits on is
              // computed HERE. Bucketed once per transaction, not once per bucket-currency cell.
              ClearCollect( colRptTxBk,
                  ForAll( colRptTxEnriched As e,
                      { Bi: RoundDown( DateDiff(gRptFrom, e.Dt, TimeUnit.Days)
                                       / Max(1, gRptBucketDays), 0 ) + 1,
                        K:  e.Ccy } ) );
              // ORDERED ONCE, so a currency keeps the same stacking position in every bar.
              ClearCollect( colRptCcyKeys,
                  ForAll( Sequence( CountRows(colRptCcy) ) As s,
                      With( { r: Index( Sort(colRptCcy, N, SortOrder.Descending), s.Value ) },
                          { Ord: s.Value, K: r.K } ) ) );
              ClearCollect( colRptTxSegRaw,
                  ForAll( Sequence( gRptBucketN * Max(1, CountRows(colRptCcyKeys)) ) As s,
                      With( { bi: RoundDown( (s.Value - 1)
                                             / Max(1, CountRows(colRptCcyKeys)), 0 ) + 1,
                              ci: Mod( s.Value - 1, Max(1, CountRows(colRptCcyKeys)) ) + 1 },
                          With( { k: Index(colRptCcyKeys, ci).K },
                              { Bi: bi, Ci: ci, K: k,
                                N: CountRows( Filter(colRptTxBk, Bi = bi && K = k) ) } ) ) ) );
              // FIXED BY VALUE, NOT BY POSITION: EUR is the same colour whatever its share, so
              // two loads can be compared by eye.
              ClearCollect( colRptTxSeg,
                  ForAll( Filter(colRptTxSegRaw, N > 0) As g,
                      { Bi: g.Bi, Ci: g.Ci, K: g.K, N: g.N,
                        Base: Coalesce( Sum( Filter(colRptTxSegRaw, Bi = g.Bi && Ci < g.Ci), N ), 0 ),
                        Hx: Switch( g.K, "EUR", "#005A9E", "USD", "#2E8B9A", "GBP", "#D69828",
                                         "JPY", "#7A6FB0", "CHF", "#C05F3C", "#4A9E63" ) } ) );
              // Flat email list so the gallery filters with `in` over ~40 rows rather than scanning
              // the unpivot on every repaint. Recomputed here AND in the picker's OnChange — a
              // period change rebuilds colRptPersonSrc under a scope already set. Keep them identical.
              ClearCollect( colRptScopeEm,
                  Distinct( Filter( colRptPersonSrc,
                                    PId in Filter(colRptPrjMap, Mgr = Coalesce(gRptScope, "")).PId ),
                            Em ) );
              Set( gRptAsAt,   Text(Now(), "[$-en-US]hh:mm") );
              Set( gRptLoadedKey, gRptKey );
              Set( gRptBusy, false )
      # BAND 0 — control bar. Fixed, outside the scroll body.
      - rowRptControl:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =gTheme.Space.Gap
            PaddingLeft: =gTheme.Space.Gutter
            PaddingRight: =gTheme.Space.Gutter
            Fill: =gTheme.Color.Surface
            BorderColor: =gTheme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =72
          Children:
            - wrapRptPeriod:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =2
                  FillPortions: =0
                  LayoutMinWidth: =300
                  Width: =300
                  Height: =56
                Children:
                  - lblRptPeriodCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Period"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        FillPortions: =0
                        LayoutMinHeight: =16
                        Width: =Parent.Width
                        Height: =16
                  # A literal option list is right here and nowhere else on this screen: these are app
                  # concepts, not a SharePoint column, so there is no Choices() to bind.
                  - selRptPeriod:
                      Control: CanvasComponent
                      ComponentName: cmpSelection
                      Properties:
                        FontSize: =10
                        Width: =Parent.Width
                        Height: =36
                        Items: |
                          =Table( { Id: 1, Label: "1W" }, { Id: 2, Label: "1M" },
                                  { Id: 3, Label: "1QTR" } )
                        DefaultId: |
                          =Switch( gRptPeriod, "1W", 1, "1M", 2, "1QTR", 3, 3 )
                        # The ONLY interaction that refetches. Select() queues the load; nothing after it
                        # may read a fold, and nothing does.
                        OnChange: |
                          =Set( gRptPeriod, selRptPeriod.Selected.Label );
                           Set( gRptKey, selRptPeriod.Selected.Label );
                           Select( btnRptLoad )
            - wrapRptScope:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =2
                  FillPortions: =0
                  LayoutMinWidth: =260
                  Width: =260
                  Height: =56
                Children:
                  - lblRptScopeCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Scope"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        FillPortions: =0
                        LayoutMinHeight: =16
                        Width: =Parent.Width
                        Height: =16
                  # Scope NEVER refetches — it re-filters a ~40-row collection. A combobox, not a
                  # cmpSelection strip: one row per manager, so the list grows with the desk.
                  - cboRptScope:
                      Control: ModernCombobox@1.1.1
                      Properties:
                        Items: =colRptMgrOpts
                        ItemDisplayText: =ThisItem.Value
                        # Matched on Em, never on the display name — two people can share a name.
                        DefaultSelectedItems: |
                          =Filter( colRptMgrOpts, Em = Coalesce(gRptScope, "") )
                        SelectMultiple: =false
                        IsSearchable: =true
                        InputTextPlaceholder: ="Scope"
                        FillPortions: =0
                        LayoutMinWidth: =Parent.Width
                        Width: =Parent.Width
                        Height: =36
                        # Same fold as the end of btnRptLoad.OnSelect. Keep the two identical.
                        OnChange: |
                          =Set( gRptScope, Coalesce(cboRptScope.Selected.Em, "") );
                           ClearCollect( colRptScopeEm,
                               Distinct( Filter( colRptPersonSrc,
                                                 PId in Filter( colRptPrjMap,
                                                                Mgr = Coalesce(cboRptScope.Selected.Em, "") ).PId ),
                                         Em ) )
            - lblRptAsAt:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =If( gRptBusy, "Loading…",
                         Len(Coalesce(gRptLoadedKey, "")) = 0, "Not loaded",
                         "as at " & gRptAsAt )
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  Align: =Align.Right
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =1
                  LayoutMinWidth: =120
                  Height: =56
            - icoRptRefresh:
                Control: Classic/Icon@2.5.0
                Properties:
                  Icon: =Icon.Reload
                  Color: =gTheme.Color.Primary
                  HoverColor: =gTheme.Color.PrimaryDark
                  HoverFill: =gTheme.Color.Hover
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  Tooltip: ="Refetch everything for the current period"
                  FillPortions: =0
                  LayoutMinWidth: =28
                  Width: =28
                  Height: =28
                  # Refresh() first so the connector does not serve the same page back, THEN the load.
                  OnSelect: |
                    =Refresh(taskmaster_tasks); Refresh(taskmaster_transactions);
                     Refresh(taskmaster_projects); Refresh(taskmaster_issues);
                     // Products too — refreshing only the fact lists lets a stale product path through.
                     Refresh(taskmaster_products);
                     Set( gRptLoadedKey, "" );
                     Select( btnRptLoad )
      # BODY — everything below the control bar stacks and scrolls.
      - bodyRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Start
            LayoutGap: =gTheme.Space.Gap
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =gTheme.Space.Gutter
            PaddingBottom: =gTheme.Space.Gutter
            PaddingLeft: =gTheme.Space.Gutter
            PaddingRight: =gTheme.Space.Gutter
            X: =0
            Y: =gTheme.Space.HeaderH + 72
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 72
          Children:
            # A report that silently undercounts is worse than no report.
            - barRptTrunc:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Visible: =Len(Coalesce(gRptTrunc, "")) > 0
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  Fill: =RGBA(214, 152, 40, 0.12)
                  BorderColor: =gTheme.Color.Warning
                  BorderThickness: =1
                  FillPortions: =0
                  LayoutMinHeight: =44
                  Width: =Parent.Width - 48
                  Height: =44
                Children:
                  - lblRptTrunc:
                      Control: Label@2.5.1
                      Properties:
                        Text: |
                          ="Hit the data row limit on: " & gRptTrunc
                           & "   —   every figure below is a FLOOR, not a total."
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        FontWeight: =FontWeight.Semibold
                        Color: =gTheme.Color.TextPrimary
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =1
                        LayoutMinWidth: =200
                        Height: =44
            # BAND 1 — desk pulse
            - rowRptPulse:
