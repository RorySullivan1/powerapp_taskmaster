                              # 480-WIDE viewBox, not the 900 this carried while it had the whole band.
                              # ImagePosition.Fit scales the box to the control, so a 900-unit box in a
                              # third-width column shrinks a 15pt label to about 7px on screen.
                              Image: |
                                =With( { n: Max(1, CountRows(colRptBuckets)) },
                                    With( { w: RoundDown(460 / n, 0),
                                            sk: If( CountRows(colRptBuckets) > 8, 2, 1 ) },
                                        "data:image/svg+xml;charset=utf-8," & EncodeUrl(
                                            "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300'>"
                                          & "<line x1='10' y1='40' x2='470' y2='40' stroke='#E1E5EB'"
                                          & " stroke-width='1' stroke-dasharray='4 4'/>"
                                          & "<text x='10' y='34' font-size='13'"
                                          & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                          & gRptTrendMax & "</text>"
                                          & "<line x1='0' y1='250' x2='480' y2='250' stroke='#E1E5EB' stroke-width='2'/>"
                                          & Concat( colRptBuckets,
                                                "<rect x='" & (10 + (Idx - 1) * w) & "' y='"
                                              & (250 - Round(St / Max(1, gRptTrendMax) * 210, 0)) & "' width='"
                                              & Max(3, RoundDown(w / 2, 0) - 3) & "' height='"
                                              & Round(St / Max(1, gRptTrendMax) * 210, 0) & "' fill='#005A9E'/>"
                                              & "<rect x='" & (10 + (Idx - 1) * w + RoundDown(w / 2, 0)) & "' y='"
                                              & (250 - Round(Cp / Max(1, gRptTrendMax) * 210, 0)) & "' width='"
                                              & Max(3, RoundDown(w / 2, 0) - 3) & "' height='"
                                              & Round(Cp / Max(1, gRptTrendMax) * 210, 0) & "' fill='#31825D'/>"
                                              // EVERY OTHER LABEL past 8 buckets: a "d mmm" label runs ~42 units
                                              // and a quarter's buckets are only 35 apart.
                                              & If( Mod(Idx - 1, sk) = 0,
                                                    "<text x='" & (10 + (Idx - 1) * w + RoundDown(w / 2, 0)) & "' y='272'"
                                                  & " text-anchor='middle' font-size='14'"
                                                  & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                                  & EncodeHTML(Lbl) & "</text>", "" ) )
                                          & "<polyline fill='none' stroke='#D69828' stroke-width='3'"
                                          & " stroke-linejoin='round' points='"
                                          & Concat( colRptBuckets,
                                                (10 + (Idx - 1) * w + RoundDown(w / 2, 0)) & ","
