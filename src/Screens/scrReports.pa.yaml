# =============================================================================
# scrReports  —  native analytics. Power BI is OUT OF SCOPE; every chart here is
# SVG in an Image control. Design note: docs/reports-screen-design.md.
#
# BUILT: band 0 (period + scope strips, coverage combo, refresh, truncation
# banner), band 1 (desk pulse), band 2 (people, sortable, with an inline SVG
# health bar).
#
# ALSO BUILT: band 3 (activity family, output format, median cycle time),
# band 4 (started/completed/net-open combo + ageing), band 5 (activity trend,
# per-currency tiles, coverage x product heatmap, ranked gap list), provenance.
#
# ALSO BUILT: the person overlay — a panel, not a screen, so the folds survive.
#
# ARCHITECTURE — fetch bounded, fold once, render from folds.
#   * Every fact fetch is delegable and date- or state-bounded.
#   * Everything renders from small pre-aggregated collections. NO CountRows,
#     LookUp or Filter over a fact collection may appear in a gallery Items or
#     row property — that is the N+1, and a 40-row people gallery each scanning
#     800 tasks is 32,000 row-scans PER REPAINT.
#
# EVERY DENOMINATOR IN A PROPERTY FORMULA IS WRAPPED IN Max(1, ...) AT THE POINT
# OF USE, even where the global was already Set with Max(1, ...). A property
# formula is evaluated in the EDITOR, where the load has never run and every
# global is BLANK — and blank divides as zero. Setting the guard at load time
# protects the running app and does nothing for the editor. An `If(x = 0, ...)`
# guard does not help either: blank is not reliably equal to 0 for an untyped
# global, so the else arm is what runs. Max() ignores blanks and returns 1.
# The divisions inside btnRptLoad.OnSelect are exempt — a behaviour formula runs
# only when invoked, by which point the Sets above it have happened.
#
# THE LOAD LIVES IN ONE PLACE — btnRptLoad.OnSelect — and OnVisible, the refresh
# icon and the period strip all reach it with Select(). MS Learn is explicit that
# "Select QUEUES the target OnSelect for later processing... it does not cause it
# to evaluate immediately, nor does it wait": so nothing may read a fold in the
# same formula that Selects the loader. Nothing here does — the bands are
# declarative over the collections and simply repaint when they fill.
#
# BANDS: header 0..64 absolute, control bar 64..136 absolute (fixed, outside the
# scroll), bodyRoot 136..bottom vertical auto-layout with LayoutOverflowY Scroll.
# Sections stack, so there is NO manual Y arithmetic below the control bar.
# =============================================================================
Screens:
  scrReports:
    Properties:
      Fill: =gTheme.Color.Bg
      # Defaults + the reload guard, and nothing else. The fetches are in
      # btnRptLoad so that the period strip and the refresh icon run the same
      # code rather than three copies that drift apart.
      OnVisible: |
        =
        // SELF-HEAL. App.OnStart is NON-BLOCKING, so this screen can run before it
        // finishes; a blank gUserEmail makes every "mine" test match nothing, and these
        // are imperative Sets that never re-fire.
        If( IsBlank(gUserEmail), Set( gUserEmail, Lower(User().Email) ) );
        If( IsBlank(gRptPeriod), Set( gRptPeriod, "1QTR" ) );
        // Scope holds a project manager's EMAIL, or "" for All. IsBlank cannot seed it —
        // "" is the All value and is itself blank — so it is set unconditionally.
        Set( gRptScope, Coalesce(gRptScope, "") );
        If( IsBlank(gRptSort),   Set( gRptSort, "Owns" ); Set( gRptSortDesc, true ) );
        If( IsBlank(gRptCoverage), Set( gRptCoverage, "All coverage" ) );
        Set( gRptSelPerson, "" );
        // Refetch ONLY when the period changed, or on the first visit. A revisit with
        // the same window repaints from folds already in memory.
        Set( gRptKey, gRptPeriod );
        If( gRptKey <> gRptLoadedKey, Select( btnRptLoad ) )
    Children:
      # =====================================================================
      # THE LOAD. One copy, reached with Select() from three places.
      # =====================================================================
      # Hidden, and Visible: =false is safe — Select fires regardless of
      # visibility. It must NOT be disabled: Select does nothing on a control
      # whose DisplayMode is Disabled.
      - btnRptLoad:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =false
            Text: =""
            X: =0
            Y: =0
            Width: =1
            Height: =1
            # EVERY ClearCollect NAMES ITS COLUMNS. Explicit Column Selection is on by
            # default and trims retrieved columns to those it can prove are used;
            # Microsoft documents that column lineage is occasionally lost when data
            # moves through collections and variables, and ECS then drops the column.
            # This is the most collection-heavy screen in the app. A dropped column
            # renders as a blank number, which across the one-way gap comes back only
            # as "it didn't work".
            OnSelect: |
              =Set( gRptBusy, true );
              // ---- the window ------------------------------------------------------
              // A QUARTER IS THE WIDEST USEFUL WINDOW: the archive flow takes work out of
              // these lists at roughly 100 days, so a year-long window would report a
              // year of history over rows that no longer exist and read as a collapse in
              // activity. Three rolling windows, no calendar anchoring — a calendar
              // quarter put gRptFrom ON Today() every 1 April, and every span derived
              // from it collapsed to zero.
              Set( gRptSpanDays,
                   Switch( gRptPeriod, "1W", 7, "1M", 30, "1QTR", 90, 90 ) );
              Set( gRptFrom, DateAdd( Today(), -gRptSpanDays, TimeUnit.Days ) );
              // Exactly ONE window before gRptFrom. The prior-period delta has to compare
              // equal spans or it is measuring two differently sized things; the old
              // 14-day floor silently made the 1W comparison the window 21-28 days back.
              // One transaction fetch from here serves current, prior and the trend bars.
              Set( gRptFrom2x, DateAdd( gRptFrom, -gRptSpanDays, TimeUnit.Days ) );
              // BAR GRANULARITY FOLLOWS THE WINDOW. Month buckets over a 7-day window
              // give ONE bar, which is not a trend. Days for a week, weeks for a month
              // or a quarter — 7, 5 and 13 bars, all within what the chart already sizes.
              Set( gRptBucketDays, If( gRptPeriod = "1W", 1, 7 ) );
              Set( gRptBucketN, RoundUp( gRptSpanDays / gRptBucketDays, 0 ) );
              // ---- F1..F5, all delegable ------------------------------------------
              // F1 is unbounded but SELF-LIMITING: open work does not accumulate.
              // The stages are ENUMERATED because a Text <> does not delegate.
              Concurrent(
                  ClearCollect( colRptOpen,
                      ShowColumns(
                          Filter( LiveTasks,
                                  task_stage.Value = "Not Started" || task_stage.Value = "Planning"
                               || task_stage.Value = "Drafting"    || task_stage.Value = "Finalizing" ),
                          ID, task_name, task_stage, task_status, task_date_target,
                          task_lead, task_supporter, task_project_id, task_output_format ) ),
                  ClearCollect( colRptDone,
                      ShowColumns(
                          Filter( LiveTasks,
                                  task_stage.Value = "Completed"
                               && task_date_completion >= gRptFrom ),
                          ID, task_date_start, task_date_completion, task_date_target,
                          task_lead, task_supporter, task_project_id, task_output_format ) ),
                  // F3 is the LOAD-BEARING bound — transactions grow fastest.
                  ClearCollect( colRptTx,
                      ShowColumns(
                          Filter( taskmaster_transactions,
                                  transaction_project_archived = false
                               && transaction_date >= gRptFrom2x ),
                          ID, transaction_date, transaction_client_name, transaction_project_id,
                          transaction_product_id, transaction_currency, transaction_notional ) ),
                  // AN EXPLICIT ForAll PROJECTION, NOT ShowColumns, AND THE ONLY FETCH ON
                  // THIS SCREEN THAT NEEDS TO BE. ShowColumns over a BARE NAMED FORMULA
                  // accepts the column names but does not carry the schema into the
                  // collection, so `ClearCollect` reports no error while every later
                  // `p.project_name` reads as "not recognized". The three fetches above
                  // are immune because their first argument is a Filter EXPRESSION, whose
                  // type resolves directly to the data source; colRptIss survives the same
                  // bare-named-formula shape only because nothing ever reads a field off
                  // it. Writing the record out by hand states the shape outright, which
                  // is both the fix and a stronger guarantee than ShowColumns gave against
                  // Explicit Column Selection dropping a column.
                  // The Choice and Person columns are copied WHOLE, so project_phase.Value
                  // and project_manager.Email still resolve downstream.
                  ClearCollect( colRptPrj,
                      ForAll( ActiveProjects As p,
                          { ID:                      p.ID,
                            project_name:            p.project_name,
                            project_phase:           p.project_phase,
                            project_perc_completion: p.project_perc_completion,
                            project_date_start:      p.project_date_start,
                            project_date_target:     p.project_date_target,
                            project_date_complete:   p.project_date_complete,
                            project_type_path:       p.project_type_path,
                            project_manager:         p.project_manager,
                            project_supporter:       p.project_supporter } ) ),
                  ClearCollect( colRptIss, ShowColumns( OpenIssues, ID, issue_project_id ) )
              );
              // ---- D1..D4 dimensions ----------------------------------------------
              // THE VOCABULARIES COME FROM THE DIMENSION LISTS, never from the
              // transactions. A gap is an ABSENT group — deriving the axes from the
              // data would delete exactly the cells the gap grid exists to show.
              // Bound with Choices() so the screen is agnostic to the values.
              Concurrent(
                  ClearCollect( colRptClients,  ShowColumns( taskmaster_clients, ID, client_name, client_coverage ) ),
                  ClearCollect( colRptProducts, ShowColumns( taskmaster_products, ID, product_uid, product_type_path ) ),
                  ClearCollect( colRptCoverage, Choices([@taskmaster_clients].client_coverage) ),
                  ClearCollect( colRptProdL1,   Distinct( mapping_producttype, level1 ) )
              );
              // "All coverage" is Collected FIRST so it leads the list and makes the
              // unfiltered view selectable without a separate clear button — the pattern
              // scrProjects already lands.
              ClearCollect( colRptCovOpts, { Value: "All coverage" } );
              Collect( colRptCovOpts, ForAll( colRptCoverage As c, { Value: c.Value } ) );
              // ---- truncation ------------------------------------------------------
              // Aggregates never delegate, so every figure is computed locally over
              // fetched rows. This is the ONLY place the app can notice it ran out.
              Set( gRptTrunc,
                   Trim(
                     If( CountRows(colRptOpen) >= 2000, "open tasks  ", "" ) &
                     If( CountRows(colRptDone) >= 2000, "completed tasks  ", "" ) &
                     If( CountRows(colRptTx)   >= 2000, "transactions  ", "" ) &
                     If( CountRows(colRptPrj)  >= 2000, "projects  ", "" ) &
                     // F5 and the two dimension fetches count too. Issues feed a tile of
                     // their own, and a capped dimension list silently shrinks the gap
                     // grid's vocabulary — both are exactly what this banner exists for.
                     If( CountRows(colRptIss)      >= 2000, "issues  ", "" ) &
                     If( CountRows(colRptClients)  >= 2000, "clients  ", "" ) &
                     If( CountRows(colRptProducts) >= 2000, "products  ", "" ) &
                     // Distinct() over a data source does not delegate, and THIS is what
                     // defines the grid's product axis — a capped product-type list
                     // silently shortens the axis and invents gaps that are not gaps.
                     If( CountRows(colRptProdL1)   >= 2000, "product types  ", "" ) ) );
              // Transactions inside the CURRENT window; colRptTx holds two windows.
              ClearCollect( colRptTxCur, Filter( colRptTx, transaction_date >= gRptFrom ) );
              // ---- project map -----------------------------------------------------
              // Level 1 of a "A | B | C" path with Find/Left, NOT Split: the separator
              // is part of the stored data and blanks need their own bucket.
              ClearCollect( colRptPrjMap,
                  ForAll( colRptPrj As p,
                      { PId:  p.ID,
                        PNm:  p.project_name,
                        Fam:  With( { s: Trim(Coalesce(p.project_type_path, "")) },
                                  With( { i: Find(" | ", s) },
                                      If( IsBlank(s), "Unclassified",
                                          If( i > 0, Left(s, i - 1), s ) ) ) ),
                        Mgr:  Lower(Coalesce(p.project_manager.Email, "")),
                        // The display name is carried alongside the email because the scope
                        // picker lists PEOPLE and matches on IDENTITY: email is the key,
                        // the name is only ever shown.
                        MgrNm: Coalesce(p.project_manager.DisplayName, ""),
                        Sup:  Lower(Coalesce(p.project_supporter.Email, "")) } ) );
              // ---- scope options ---------------------------------------------------
              // "All" plus one row per project manager, built from the projects actually
              // in the window — so the list can never offer a manager with nothing to show.
              // Em is the key and is BLANK for "All", which is what the filter tests; a
              // manager with no display name falls back to the email rather than
              // rendering an unpickable blank row.
              ClearCollect( colRptMgrOpts, { Value: "All", Em: "" } );
              Collect( colRptMgrOpts,
                  Sort( ForAll( Distinct( Filter(colRptPrjMap, Len(Mgr) > 0), Mgr ) As m,
                            { Value: With( { n: LookUp(colRptPrjMap, Mgr = m.Value, MgrNm) },
                                         If( Len(Coalesce(n, "")) > 0, n, m.Value ) ),
                              Em:    m.Value } ),
                        Value ) );
              // ---- person unpivot --------------------------------------------------
              // TWO ATTRIBUTION PATHS, BOTH FROM TASKS: task_lead owns and
              // task_supporter supports. They are counted separately and NEVER summed
              // into one workload number — that double-counts the desk total.
              // transaction_sales is NOT a third path (user-confirmed 2026-08-17): the
              // person who sold the trade did not do the desk work measured here.
              //
              // Ungroup flattens the two-row table each task emits. Days and OnT carry
              // -1 for "not applicable" so the medians and rates can exclude them
              // without confusing a real zero with a missing value.
              Clear( colRptPersonSrc );
              Collect( colRptPersonSrc,
                  Filter( Ungroup(
                      ForAll( colRptOpen As t,
                          // Tagged HERE, in a With, so the project LookUp runs once per
                          // task rather than once per emitted row. The overlay reads these
                          // straight back out — that is what makes it refetch nothing.
                          With( { fam: Coalesce( LookUp(colRptPrjMap, PId = t.task_project_id.Id, Fam),
                                                 "Unclassified" ),
                                  fmt: Coalesce( t.task_output_format.Value, "Unspecified" ),
                                  stg: Coalesce( t.task_stage.Value, "Unspecified" ) },
                          { r: Table(
                              { Em: Lower(Coalesce(t.task_lead.Email, "")),
                                Nm: Coalesce(t.task_lead.DisplayName, ""),
                                Role: "Owns", Dup: false, PId: t.task_project_id.Id, Op: 1,
                                Ovd: If( !IsBlank(t.task_date_target) && t.task_date_target < Today(), 1, 0 ),
                                Gc: If(t.task_status.Value = "Green", 1, 0),
                                Ac: If(t.task_status.Value = "Amber", 1, 0),
                                Rc: If(t.task_status.Value = "Red",   1, 0),
                                Dn: 0, Days: -1, OnT: -1, Fam: fam, Fmt: fmt, Stg: stg },
                              { Em: Lower(Coalesce(t.task_supporter.Email, "")),
                                Nm: Coalesce(t.task_supporter.DisplayName, ""),
                                Role: "Supports",
                                // SAME PERSON ON BOTH COLUMNS COUNTS ONCE. The schema permits
                                // lead = supporter, and counting both rows gave an Overdue
                                // larger than the person's own task count.
                                Dup: Lower(Coalesce(t.task_supporter.Email, "")) = Lower(Coalesce(t.task_lead.Email, "")),
                                PId: t.task_project_id.Id, Op: 1,
                                Ovd: If( !IsBlank(t.task_date_target) && t.task_date_target < Today(), 1, 0 ),
                                Gc: If(t.task_status.Value = "Green", 1, 0),
                                Ac: If(t.task_status.Value = "Amber", 1, 0),
                                Rc: If(t.task_status.Value = "Red",   1, 0),
                                Dn: 0, Days: -1, OnT: -1, Fam: fam, Fmt: fmt, Stg: stg } ) } ) ),
                      r ), Len(Em) > 0 && !Dup ) );
              Collect( colRptPersonSrc,
                  Filter( Ungroup(
                      ForAll( colRptDone As t,
                          With( { fam: Coalesce( LookUp(colRptPrjMap, PId = t.task_project_id.Id, Fam),
                                                 "Unclassified" ),
                                  fmt: Coalesce( t.task_output_format.Value, "Unspecified" ) },
                          { r: Table(
                              { Em: Lower(Coalesce(t.task_lead.Email, "")),
                                Nm: Coalesce(t.task_lead.DisplayName, ""),
                                Role: "Owns", Dup: false, PId: t.task_project_id.Id, Op: 0,
                                Ovd: 0, Gc: 0, Ac: 0, Rc: 0, Dn: 1,
                                Days: If( IsBlank(t.task_date_start), -1,
                                          DateDiff(t.task_date_start, t.task_date_completion, TimeUnit.Days) ),
                                OnT:  If( IsBlank(t.task_date_target), -1,
                                          If(t.task_date_completion <= t.task_date_target, 1, 0) ),
                                Fam: fam, Fmt: fmt, Stg: "Completed" },
                              { Em: Lower(Coalesce(t.task_supporter.Email, "")),
                                Nm: Coalesce(t.task_supporter.DisplayName, ""),
                                Role: "Supports",
                                Dup: Lower(Coalesce(t.task_supporter.Email, "")) = Lower(Coalesce(t.task_lead.Email, "")),
                                PId: t.task_project_id.Id, Op: 0,
                                Ovd: 0, Gc: 0, Ac: 0, Rc: 0, Dn: 1,
                                Days: If( IsBlank(t.task_date_start), -1,
                                          DateDiff(t.task_date_start, t.task_date_completion, TimeUnit.Days) ),
                                OnT:  If( IsBlank(t.task_date_target), -1,
                                          If(t.task_date_completion <= t.task_date_target, 1, 0) ),
                                Fam: fam, Fmt: fmt, Stg: "Completed" } ) } ) ),
                      r ), Len(Em) > 0 && !Dup ) );
              // ---- person fold -----------------------------------------------------
              // ~40 rows, every measure precomputed. This costs persons x rows ONCE per
              // load; the rule it exists to obey is that no gallery row may scan a fact
              // collection.
              //
              // MEDIAN is hand-rolled: Power Fx has no Median. Sort, then take the
              // lower-middle element. On an even count that is the lower of the two
              // central days rather than their mean — deliberate, on integer days.
              ClearCollect( colRptPerson,
                  ForAll( Distinct( Filter(colRptPersonSrc, Len(Em) > 0), Em ) As pp,
                      With( { rw: Filter(colRptPersonSrc, Em = pp.Value) },
                          { Em:   pp.Value,
                            Nm:   First(rw).Nm,
                            Owns: CountRows( Filter(rw, Role = "Owns"     && Op = 1) ),
                            Sups: CountRows( Filter(rw, Role = "Supports" && Op = 1) ),
                            Ovd:  Sum(rw, Ovd),
                            Gc:   Sum(rw, Gc), Ac: Sum(rw, Ac), Rc: Sum(rw, Rc),
                            Dn:   Sum(rw, Dn),
                            Med:  With( { ds: Sort( Filter(rw, Days >= 0), Days ) },
                                      With( { n: CountRows(ds) },
                                          If( n = 0, -1, Index(ds, RoundUp(n / 2, 0)).Days ) ) ),
                            OnTp: With( { dt: Filter(rw, OnT >= 0) },
                                      If( CountRows(dt) = 0, -1,
                                          RoundDown( Sum(dt, OnT) / Max(1, CountRows(dt)) * 100, 0 ) ) ),
                            // HOISTED. Left inside the predicate this re-filtered every
                            // project for every transaction for every person — ~40 x 2000 x 300
                            // row evaluations, the N+1 this file's own header forbids, merely
                            // moved to load time. With() evaluates it once per person.
                            Tx:   With( { pids: Filter(colRptPrjMap, Mgr = pp.Value || Sup = pp.Value).PId },
                                      CountRows( Filter(colRptTxCur, transaction_project_id.Id in pids) ) ) } ) ) );
              // ---- desk pulse ------------------------------------------------------
              Set( gRptOpenN,  CountRows(colRptOpen) );
              Set( gRptOvdN,   CountRows( Filter( colRptOpen,
                                   !IsBlank(task_date_target) && task_date_target < Today() ) ) );
              Set( gRptTxN,    CountRows(colRptTxCur) );
              Set( gRptTxPrev, CountRows( Filter(colRptTx, transaction_date < gRptFrom) ) );
              Set( gRptIssN,   CountRows(colRptIss) );
              // ---- BAND 3 folds: where the work sits --------------------------------
              // Tag each open task ONCE with its activity family and output format.
              // Every breakdown below then reads a tagged collection instead of
              // re-joining to the project map per category.
              ClearCollect( colRptOpenTag,
                  ForAll( colRptOpen As t,
                      { Fam: Coalesce( LookUp(colRptPrjMap, PId = t.task_project_id.Id, Fam),
                                       "Unclassified" ),
                        Fmt: Coalesce( t.task_output_format.Value, "Unspecified" ) } ) );
              ClearCollect( colRptFamAll,
                  ForAll( Distinct(colRptOpenTag, Fam) As f,
                      { K: f.Value, N: CountRows( Filter(colRptOpenTag, Fam = f.Value) ) } ) );
              // TOP 6 + Other. Sorted here, once, so the renderer can index straight in.
              ClearCollect( colRptFam, FirstN( Sort(colRptFamAll, N, SortOrder.Descending), 6 ) );
              Set( gRptFamOther, CountRows(colRptOpenTag) - Coalesce(Sum(colRptFam, N), 0) );
              Clear( colRptFamBar );
              Collect( colRptFamBar,
                  ForAll( Sequence( CountRows(colRptFam) ) As s,
                      With( { r: Index(colRptFam, s.Value) },
                          { Idx: s.Value, K: r.K, N: r.N } ) ) );
              If( gRptFamOther > 0,
                  Collect( colRptFamBar,
                      { Idx: CountRows(colRptFam) + 1, K: "Other", N: gRptFamOther } ) );
              Set( gRptFamMax, Max( 1, Coalesce(Max(colRptFamBar, N), 0) ) );
              // THE VOCABULARY COMES FROM THE COLUMN, via Choices(). A literal list here
              // was a second copy of the column that drifts the moment someone edits it in
              // SharePoint, and this chart would then under-count in silence.
              // Choices() keeps the property this section actually needs — it returns EVERY
              // value the column offers, including ones no task currently holds, so an
              // unused format still draws a zero bar. That is the same reason the gap grid
              // reads its axes from the dimension lists: a GroupBy over the facts would
              // delete exactly the categories worth seeing.
              ClearCollect( colRptFmtVocab,
                  ForAll( Choices([@taskmaster_tasks].task_output_format) As c,
                          { K: c.Value } ) );
              Clear( colRptFmtBar );
              Collect( colRptFmtBar,
                  ForAll( Sequence( CountRows(colRptFmtVocab) ) As s,
                      With( { k: Index(colRptFmtVocab, s.Value).K },
                          { Idx: s.Value, K: k,
                            N: CountRows( Filter(colRptOpenTag, Fmt = k) ) } ) ) );
              // Blank is not a Choice value, so it needs its own bucket. "Other" now means
              // a value tasks still HOLD that the column no longer offers — retired in
              // SharePoint while rows kept it — which is a data question, not the
              // schema.yaml disagreement it used to mean.
              Collect( colRptFmtBar,
                  { Idx: CountRows(colRptFmtVocab) + 1, K: "Unspecified",
                    N: CountRows( Filter(colRptOpenTag, Fmt = "Unspecified") ) },
                  { Idx: CountRows(colRptFmtVocab) + 2, K: "Other",
                    N: CountRows( Filter( colRptOpenTag,
                           Fmt <> "Unspecified" && !(Fmt in colRptFmtVocab.K) ) ) } );
              Set( gRptFmtMax, Max( 1, Coalesce(Max(colRptFmtBar, N), 0) ) );
              // Median cycle time by family — the elapsed-time counterpart to the two
              // volume charts, and the only genuine duration signal in the model.
              ClearCollect( colRptDoneTag,
                  ForAll( Filter(colRptDone, !IsBlank(task_date_start)) As t,
                      { Fam: Coalesce( LookUp(colRptPrjMap, PId = t.task_project_id.Id, Fam),
                                       "Unclassified" ),
                        D:   DateDiff(t.task_date_start, t.task_date_completion, TimeUnit.Days) } ) );
              ClearCollect( colRptCycAll,
                  ForAll( Distinct(colRptDoneTag, Fam) As f,
                      With( { ds: Sort( Filter(colRptDoneTag, Fam = f.Value), D ) },
                          With( { n: CountRows(ds) },
                              { K: f.Value, N: n,
                                Med: If( n = 0, -1, Index(ds, RoundUp(n / 2, 0)).D ) } ) ) ) );
              Clear( colRptCycBar );
              Collect( colRptCycBar,
                  ForAll( Sequence( CountRows(colRptCycAll) ) As s,
                      With( { r: Index( Sort(colRptCycAll, Med, SortOrder.Descending), s.Value ) },
                          { Idx: s.Value, K: r.K, N: r.N, Med: r.Med } ) ) );
              Set( gRptCycMax, Max( 1, Coalesce(Max(colRptCycBar, Med), 0) ) );
              // ---- BAND 4 folds: project trend -------------------------------------
              // BUCKETS KEYED ON A WHOLE NUMBER OF DAYS SINCE gRptFrom — not on date
              // comparison, and not on a calendar month, so one keying serves all three
              // windows and no month-length or timezone edge exists.
              // EVERY BUCKET FILTER CARRIES ITS OWN LOWER BOUND. RoundDown truncates
              // TOWARD ZERO, so a date BEFORE gRptFrom yields -0.4 -> 0 and would land in
              // bucket 1. colRptPrj is not date-bounded — it holds every open project,
              // most of them started long before the window — so without the bound the
              // first bar absorbs the entire backlog.
              // The prior window is aligned POSITIONALLY: bucket i of this window is
              // compared with bucket i of the window before it.
              ClearCollect( colRptBucketsRaw,
                  ForAll( Sequence( gRptBucketN ) As s,
                      With( { d: DateAdd( gRptFrom, (s.Value - 1) * gRptBucketDays, TimeUnit.Days ),
                              k: s.Value - 1 },
                              { Idx: s.Value,
                                Lbl: If( gRptBucketDays = 1,
                                         Text(d, "[$-en-US]ddd"),
                                         Text(d, "[$-en-US]d mmm") ),
                                St: CountRows( Filter( colRptPrj,
                                        !IsBlank(project_date_start)
                                     && project_date_start >= gRptFrom
                                     && RoundDown( DateDiff(gRptFrom, project_date_start, TimeUnit.Days)
                                                   / gRptBucketDays, 0 ) = k ) ),
                                Cp: CountRows( Filter( colRptPrj,
                                        !IsBlank(project_date_complete)
                                     && project_date_complete >= gRptFrom
                                     && RoundDown( DateDiff(gRptFrom, project_date_complete, TimeUnit.Days)
                                                   / gRptBucketDays, 0 ) = k ) ),
                                // colRptTxCur, NOT colRptTx. colRptTx spans TWO windows, so
                                // reading it here counts the prior window into the current bars.
                                Tx: CountRows( Filter( colRptTxCur,
                                        RoundDown( DateDiff(gRptFrom, transaction_date, TimeUnit.Days)
                                                   / gRptBucketDays, 0 ) = k ) ),
                                // Keyed off gRptFrom2x, so bucket i here is the same offset
                                // into the prior window as bucket i is into the current one.
                                TxP: CountRows( Filter( colRptTx,
                                        transaction_date < gRptFrom
                                     && RoundDown( DateDiff(gRptFrom2x, transaction_date, TimeUnit.Days)
                                                   / gRptBucketDays, 0 ) = k ) ) } ) ) );
              // CUMULATIVE NET OPEN — started minus completed, running. This is the direct
              // answer to "how are projects trending" and it needs no snapshot list,
              // because it is built from dated EVENTS rather than stateful columns.
              ClearCollect( colRptBuckets,
                  ForAll( colRptBucketsRaw As m,
                      { Idx: m.Idx, Lbl: m.Lbl, St: m.St, Cp: m.Cp, Tx: m.Tx, TxP: m.TxP,
                        Net: Coalesce( Sum( Filter(colRptBucketsRaw, Idx <= m.Idx), St ), 0 )
                           - Coalesce( Sum( Filter(colRptBucketsRaw, Idx <= m.Idx), Cp ), 0 ) } ) );
              Set( gRptTrendMax,
                   Max( 1, Coalesce(Max(colRptBuckets, St), 0),
                           Coalesce(Max(colRptBuckets, Cp), 0),
                           Coalesce(Max(colRptBuckets, Net), 0) ) );
              Set( gRptTxMax,
                   Max( 1, Coalesce(Max(colRptBuckets, Tx), 0),
                           Coalesce(Max(colRptBuckets, TxP), 0) ) );
              // Ageing of OPEN projects, by days since start.
              Set( gRptAgeA, CountRows( Filter( colRptPrj, project_phase.Value <> "Complete"
                                 && !IsBlank(project_date_start)
                                 && DateDiff(project_date_start, Today(), TimeUnit.Days) < 30 ) ) );
              Set( gRptAgeB, CountRows( Filter( colRptPrj, project_phase.Value <> "Complete"
                                 && !IsBlank(project_date_start)
                                 && DateDiff(project_date_start, Today(), TimeUnit.Days) >= 30
                                 && DateDiff(project_date_start, Today(), TimeUnit.Days) < 90 ) ) );
              Set( gRptAgeC, CountRows( Filter( colRptPrj, project_phase.Value <> "Complete"
                                 && !IsBlank(project_date_start)
                                 && DateDiff(project_date_start, Today(), TimeUnit.Days) >= 90
                                 && DateDiff(project_date_start, Today(), TimeUnit.Days) < 180 ) ) );
              Set( gRptAgeD, CountRows( Filter( colRptPrj, project_phase.Value <> "Complete"
                                 && !IsBlank(project_date_start)
                                 && DateDiff(project_date_start, Today(), TimeUnit.Days) >= 180 ) ) );
              Set( gRptStalled,  CountRows( Filter(colRptPrj, project_phase.Value = "Stalled") ) );
              Set( gRptNoTarget, CountRows( Filter( colRptPrj, project_phase.Value <> "Complete"
                                     && IsBlank(project_date_target) ) ) );
              // ---- BAND 5 folds: transactions --------------------------------------
              // Coverage reaches a transaction through its CLIENT, not its project
              // (decided 2026-08-17): the grid reads "this coverage team has never traded
              // that product type".
              //
              // ACCEPTED COST, NOT AN OVERSIGHT: two linear LookUps per transaction, so
              // this is O(tx x clients) + O(tx x products) and it re-runs on every period
              // change. Power Fx has no hash join and no index on a collection, so there
              // is no cheaper shape — and it is bounded by the same 2000-row cap the
              // truncation banner reports. If it ever becomes the bottleneck, the fix is a
              // denormalised coverage column on the transaction, not a smarter join here.
              ClearCollect( colRptTxEnriched,
                  ForAll( colRptTxCur As x,
                      { Cov: Coalesce( LookUp( colRptClients,
                                           ID = x.transaction_client_name.Id ).client_coverage.Value,
                                       "Unassigned" ),
                        Prd: With( { sp: Trim( Coalesce( LookUp( colRptProducts,
                                                   ID = x.transaction_product_id.Id ).product_type_path, "" ) ) },
                                 With( { i: Find(" | ", sp) },
                                     If( IsBlank(sp), "Unclassified",
                                         If( i > 0, Left(sp, i - 1), sp ) ) ) ),
                        Ccy: Coalesce(x.transaction_currency.Value, "—"),
                        Amt: Coalesce(x.transaction_notional, 0) } ) );
              // PER CURRENCY, NEVER SUMMED ACROSS THEM. Cross-currency conversion is out
              // of scope for this project, so there is no blended figure to show.
              ClearCollect( colRptCcy,
                  ForAll( Distinct(colRptTxEnriched, Ccy) As c,
                      { K: c.Value,
                        N:   CountRows( Filter(colRptTxEnriched, Ccy = c.Value) ),
                        Tot: Coalesce( Sum( Filter(colRptTxEnriched, Ccy = c.Value), Amt ), 0 ) } ) );
              ClearCollect( colRptCovClients,
                  ForAll( colRptCoverage As c,
                      { K: c.Value,
                        N: CountRows( Filter(colRptClients, client_coverage.Value = c.Value) ) } ) );
              // THE FULL CROSS PRODUCT, zero cells included. A gap is an ABSENT group, so
              // the grid is built from the two VOCABULARIES rather than from the
              // transactions — deriving it from the data would delete exactly the cells
              // this section exists to show. Cell s maps to row/col with RoundDown and Mod,
              // which also hands the SVG the coordinates it needs.
              Set( gRptNCov, CountRows(colRptCoverage) );
              Set( gRptNPrd, CountRows(colRptProdL1) );
              ClearCollect( colRptGrid,
                  ForAll( Sequence( gRptNCov * gRptNPrd ) As s,
                      With( { ci: RoundDown( (s.Value - 1) / Max(1, gRptNPrd), 0 ) + 1,
                              pi: Mod( s.Value - 1, Max(1, gRptNPrd) ) + 1 },
                          With( { cv: Index(colRptCoverage, ci).Value,
                                  pv: Index(colRptProdL1, pi).Value },
                              { Ci: ci, Pi: pi, Cov: cv, Prd: pv,
                                CN: Coalesce( LookUp(colRptCovClients, K = cv, N), 0 ),
                                N:  CountRows( Filter(colRptTxEnriched, Cov = cv && Prd = pv) ) } ) ) ) );
              Set( gRptGridMax, Max( 1, Coalesce(Max(colRptGrid, N), 0) ) );
              // A client with no coverage, or a product with no type path, gets a fallback
              // label that matches NO axis value — so those transactions sit in no cell
              // while still counting in the KPI tile and the currency totals. Counted here
              // and stated under the grid, because a total that does not reconcile is
              // worse than one that explains itself.
              Set( gRptUnmapped,
                   CountRows( Filter( colRptTxEnriched,
                                      Cov = "Unassigned" || Prd = "Unclassified" ) ) );
              // The people on the scoped manager's projects, resolved to a flat email
              // list so the gallery filters with `in` over ~40 rows rather than scanning
              // the unpivot on every repaint. Recomputed HERE as well as in the picker's
              // OnChange because a period change rebuilds colRptPersonSrc underneath a
              // scope that is already set — the two must stay identical.
              ClearCollect( colRptScopeEm,
                  Distinct( Filter( colRptPersonSrc,
                                    PId in Filter(colRptPrjMap, Mgr = Coalesce(gRptScope, "")).PId ),
                            Em ) );
              Set( gRptAsAt,   Text(Now(), "[$-en-US]hh:mm") );
              Set( gRptLoadedKey, gRptKey );
              Set( gRptBusy, false )
      # =====================================================================
      # BAND 0 — control bar. FIXED, outside the scroll body.
      # =====================================================================
      - rowRptControl:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =gTheme.Space.Gap
            PaddingLeft: =gTheme.Space.Gutter
            PaddingRight: =gTheme.Space.Gutter
            Fill: =gTheme.Color.Surface
            BorderColor: =gTheme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =72
          Children:
            - wrapRptPeriod:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =2
                  FillPortions: =0
                  LayoutMinWidth: =300
                  Width: =300
                  Height: =56
                Children:
                  - lblRptPeriodCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Period"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        FillPortions: =0
                        LayoutMinHeight: =16
                        Width: =Parent.Width
                        Height: =16
                  # A LITERAL option list is right here and nowhere else on this screen:
                  # these are app concepts, not a SharePoint column, so there is no
                  # Choices() to bind and no vocabulary that can drift.
                  - selRptPeriod:
                      Control: CanvasComponent
                      ComponentName: cmpSelection
                      Properties:
                        FontSize: =10
                        Width: =Parent.Width
                        Height: =36
                        Items: |
                          =Table( { Id: 1, Label: "1W" }, { Id: 2, Label: "1M" },
                                  { Id: 3, Label: "1QTR" } )
                        DefaultId: |
                          =Switch( gRptPeriod, "1W", 1, "1M", 2, "1QTR", 3, 3 )
                        # The ONLY interaction that refetches. Select() queues the load;
                        # nothing after it may read a fold, and nothing does.
                        OnChange: |
                          =Set( gRptPeriod, selRptPeriod.Selected.Label );
                           Set( gRptKey, selRptPeriod.Selected.Label );
                           Select( btnRptLoad )
            - wrapRptScope:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =2
                  FillPortions: =0
                  LayoutMinWidth: =260
                  Width: =260
                  Height: =56
                Children:
                  - lblRptScopeCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Scope"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        FillPortions: =0
                        LayoutMinHeight: =16
                        Width: =Parent.Width
                        Height: =16
                  # Scope NEVER refetches — it re-filters a ~40-row collection.
                  # A COMBOBOX, not a cmpSelection strip: the option list is one row per
                  # project manager and grows with the desk, so it cannot be a fixed-width
                  # strip of buttons. Bound to colRptMgrOpts rather than a literal table
                  # for the same reason.
                  - cboRptScope:
                      Control: ModernCombobox@1.1.1
                      Properties:
                        Items: =colRptMgrOpts
                        ItemDisplayText: =ThisItem.Value
                        # Matched on Em, never on the display name: two people can share a
                        # name and neither would select reliably.
                        DefaultSelectedItems: |
                          =Filter( colRptMgrOpts, Em = Coalesce(gRptScope, "") )
                        SelectMultiple: =false
                        IsSearchable: =true
                        InputTextPlaceholder: ="Scope"
                        FillPortions: =0
                        LayoutMinWidth: =Parent.Width
                        Width: =Parent.Width
                        Height: =36
                        # Re-folds the scoped email list. Same fold as the one at the end
                        # of btnRptLoad.OnSelect — keep the two identical.
                        OnChange: |
                          =Set( gRptScope, Coalesce(cboRptScope.Selected.Em, "") );
                           ClearCollect( colRptScopeEm,
                               Distinct( Filter( colRptPersonSrc,
                                                 PId in Filter( colRptPrjMap,
                                                                Mgr = Coalesce(cboRptScope.Selected.Em, "") ).PId ),
                                         Em ) )
            - wrapRptCov:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =2
                  FillPortions: =0
                  LayoutMinWidth: =220
                  Width: =220
                  Height: =56
                Children:
                  - lblRptCovCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Coverage"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        FillPortions: =0
                        LayoutMinHeight: =16
                        Width: =Parent.Width
                        Height: =16
                  # Filters the transaction bands ONLY, and never refetches — it
                  # re-filters folds already in memory. Bound to Choices() via
                  # colRptCovOpts, so the vocabulary is whatever the column holds.
                  - cboRptCoverage:
                      Control: ModernCombobox@1.1.1
                      Properties:
                        Items: =colRptCovOpts
                        ItemDisplayText: =ThisItem.Value
                        DefaultSelectedItems: |
                          =Table( { Value: "All coverage" } )
                        SelectMultiple: =false
                        IsSearchable: =false
                        InputTextPlaceholder: ="Coverage"
                        FillPortions: =0
                        LayoutMinWidth: =220
                        Width: =220
                        Height: =36
                        OnChange: |
                          =Set( gRptCoverage,
                                Coalesce(cboRptCoverage.Selected.Value, "All coverage") )
            - lblRptAsAt:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =If( gRptBusy, "Loading…",
                         Len(Coalesce(gRptLoadedKey, "")) = 0, "Not loaded",
                         "as at " & gRptAsAt )
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  Align: =Align.Right
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =1
                  LayoutMinWidth: =120
                  Height: =56
            - icoRptRefresh:
                Control: Classic/Icon@2.5.0
                Properties:
                  Icon: =Icon.Reload
                  Color: =gTheme.Color.Primary
                  HoverColor: =gTheme.Color.PrimaryDark
                  HoverFill: =gTheme.Color.Hover
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  Tooltip: ="Refetch everything for the current period"
                  FillPortions: =0
                  LayoutMinWidth: =28
                  Width: =28
                  Height: =28
                  # Refresh(...) first so the connector does not serve the same page
                  # back, THEN the load. Both are queued behaviours, so the order here
                  # is the order they are issued in, not a guarantee of completion.
                  OnSelect: |
                    =Refresh(taskmaster_tasks); Refresh(taskmaster_transactions);
                     Refresh(taskmaster_projects); Refresh(taskmaster_issues);
                     // The dimensions too — the load re-collects them, so refreshing only
                     // the fact lists lets a stale coverage or product vocabulary through.
                     Refresh(taskmaster_clients); Refresh(taskmaster_products);
                     Refresh(mapping_producttype);
                     Set( gRptLoadedKey, "" );
                     Select( btnRptLoad )
      # =====================================================================
      # BODY — everything below the control bar stacks and scrolls.
      # =====================================================================
      - bodyRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Start
            LayoutGap: =gTheme.Space.Gap
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =gTheme.Space.Gutter
            PaddingBottom: =gTheme.Space.Gutter
            PaddingLeft: =gTheme.Space.Gutter
            PaddingRight: =gTheme.Space.Gutter
            X: =0
            Y: =gTheme.Space.HeaderH + 72
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 72
          Children:
            # ---- truncation banner ------------------------------------------
            # A report that silently undercounts is worse than no report.
            - barRptTrunc:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
