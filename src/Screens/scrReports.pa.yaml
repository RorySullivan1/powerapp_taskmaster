                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =190
                        Height: =96
                      Children:
                        - lblRptIssCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Open issues"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.TextMuted
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width - 32
                              Height: =18
