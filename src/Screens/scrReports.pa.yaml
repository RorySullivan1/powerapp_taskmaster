                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        FillPortions: =0
                        LayoutMinHeight: =24
                        Width: =Parent.Width - 32
                        Height: =24
                  - galRptPeople:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                      Properties:
                        # SCOPE RE-FILTERS A ~40-ROW FOLD; it never refetches.
                        # TWO BRANCHES, because Name is text and every other key is a number — one Switch
                        # returning both would be a type conflict. SortByColumns would collapse this to
                        # one line, but whether it still accepts a string post-3.24042 is not grounded
                        # here, and a wrong guess fails the whole paste.
                        Items: |
                          =With( { sc: If( Len(Coalesce(gRptScope, "")) = 0,
                                           colRptPerson,
                                           Filter(colRptPerson, Em in colRptScopeEm.Value) ),
                                   dr: If(gRptSortDesc, SortOrder.Descending, SortOrder.Ascending) },
                               If( gRptSort = "Nm",
                                   Sort( sc, Nm, dr ),
                                   Sort( sc,
                                         Switch( gRptSort,
                                                 "Owns", Owns, "Sups", Sups, "Ovd",  Ovd,
                                                 "Dn",   Dn,   "Med",  Med,  "OnTp", OnTp,
                                                 // Owns, NOT Owns + Sups — this band's own subtitle forbids summing them.
                                                 Owns ),
                                         dr ) ) )
                        WrapCount: =1
                        TemplateSize: =40
                        TemplatePadding: =0
                        TemplateFill: |
                          =If( ThisItem.Em = gRptSelPerson, gTheme.Color.Accent, RGBA(0, 0, 0, 0) )
                        BorderThickness: =0
                        ShowScrollbar: =true
                        FillPortions: =1
                        LayoutMinHeight: =200
                        Width: =Parent.Width - 32
                        Height: =Parent.Height - 120
                      Children:
                        - rowRptPersonBody:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight - 1
                            Children:
                              - cellRptNm:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =Coalesce(ThisItem.Nm, ThisItem.Em)
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    Color: =gTheme.Color.TextPrimary
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =3
                                    LayoutMinWidth: =140
                                    Height: =32
                              - cellRptOwns:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =Text(ThisItem.Owns)
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    FontWeight: =FontWeight.Semibold
                                    Color: =gTheme.Color.TextPrimary
                                    Align: =Align.Right
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =52
                                    Height: =32
                              - cellRptSups:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =Text(ThisItem.Sups)
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    Color: =gTheme.Color.TextMuted
                                    Align: =Align.Right
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =66
                                    Height: =32
                              - cellRptOvd:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =Text(ThisItem.Ovd)
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    FontWeight: =FontWeight.Semibold
                                    Color: |
                                      =If(ThisItem.Ovd > 0, gTheme.Color.Danger, gTheme.Color.TextMuted)
                                    Align: =Align.Right
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =62
                                    Height: =32
                              # A PLAIN Image, NOT cmpKpiRing. A canvas component cannot be inserted into a
                              # gallery (MS Learn known limitation #4) and the validator hard-fails on it.
                              - cellRptHealth:
                                  Control: Image@2.2.3
                                  Properties:
                                    ImagePosition: =ImagePosition.Fit
                                    FillPortions: =2
                                    LayoutMinWidth: =90
                                    Height: =18
                                    # CUMULATIVE BOUNDARIES, NOT INDEPENDENT WIDTHS. Rounding each segment
                                    # separately overflows — Gc=3, Ac=5, Rc=0 gave a red segment of width='-1',
                                    # an SVG error that kills the whole drawing. Rounding the running boundary
                                    # is monotonic, so every width is >= 0 and they always total 300.
                                    # NO OPEN TASKS DRAWS THE EMPTY TRACK, not a solid red bar.
                                    Image: |
                                      =With( { tot: ThisItem.Gc + ThisItem.Ac + ThisItem.Rc },
                                          With( { g:  If( tot = 0, 0, Round(ThisItem.Gc / Max(1, tot) * 300, 0) ),
                                                  ga: If( tot = 0, 0,
                                                          Round((ThisItem.Gc + ThisItem.Ac) / Max(1, tot) * 300, 0) ) },
                                              "data:image/svg+xml," & EncodeUrl(
                                                  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 40'>"
                                                & "<rect x='0' y='10' width='300' height='20' rx='10' fill='#EEF1F5'/>"
                                                & If( tot = 0, "",
                                                      "<rect x='0' y='10' width='" & g
                                                    & "' height='20' fill='#31825D'/>"
                                                    & "<rect x='" & g & "' y='10' width='" & (ga - g)
                                                    & "' height='20' fill='#D69828'/>"
                                                    & "<rect x='" & ga & "' y='10' width='" & (300 - ga)
                                                    & "' height='20' fill='#C53A3A'/>" )
                                                & "</svg>" ) ) )
                              - cellRptDn:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =Text(ThisItem.Dn)
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    Color: =gTheme.Color.TextPrimary
                                    Align: =Align.Right
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =52
                                    Height: =32
                              # -1 is "not applicable", not zero: a dash, so a real 0-day turnaround is not
                              # confused with a missing one.
                              - cellRptMed:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =If(ThisItem.Med < 0, "—", Text(ThisItem.Med))
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    Color: =gTheme.Color.TextMuted
                                    Align: =Align.Right
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =70
                                    Height: =32
                              - cellRptOnT:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =If(ThisItem.OnTp < 0, "—", ThisItem.OnTp & "%")
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    Color: |
                                      =If( ThisItem.OnTp < 0,  gTheme.Color.TextMuted,
                                           ThisItem.OnTp >= 80, gTheme.Color.Success,
                                           ThisItem.OnTp >= 50, gTheme.Color.Warning,
                                                                gTheme.Color.Danger )
                                    Align: =Align.Right
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =64
                                    Height: =32
                        - rowRptPersonLine:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =gTheme.Color.Border
                              X: =0
                              Y: =Parent.TemplateHeight - 1
                              Width: =Parent.TemplateWidth
                              Height: =1
                        - galRptPeopleHit:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: =""
                              Fill: =RGBA(0, 0, 0, 0)
                              HoverFill: =gTheme.Color.Hover
                              PressedFill: =gTheme.Color.Press
                              BorderThickness: =0
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              # Selects, never navigates. The detail is an OVERLAY on this screen — a
                              # Navigate would cost a fresh OnVisible and throw away every fold.
                              # Built INLINE rather than through Select() on a hidden button: Select
                              # queues, and a queued build would paint the previous person's list for a frame.
                              OnSelect: |
                                =Select(Parent);
                                 If( gRptSelPerson = ThisItem.Em,
                                     Set( gRptSelPerson, "" ),
                                     Set( gRptSelPerson, ThisItem.Em );
                                     Set( gRptSelName, Coalesce(ThisItem.Nm, ThisItem.Em) );
                                     Set( gRptSelRow, ThisItem );
                                     // DUP ROWS DROPPED — a person who both leads and supports a task
                                     // has two rows here, and listing it twice reads as a defect.
                                     // Sk IS THE WHOLE SORT, because Sort takes ONE column.
                                     ClearCollect( colRptPTask,
                                         Sort(
                                             ForAll( Filter( colRptPersonSrc,
                                                             Em = ThisItem.Em && Dup = false ) As r,
                                                 { TNm: r.TNm, Stg: r.Stg, Hth: r.Hth,
                                                   Dst: r.Dst, Dtl: r.Dtl, Op: r.Op,
                                                   Sk: If( r.Op <> 1, 100000,
                                                           If( IsBlank(r.Dtl), 90000,
                                                               DateDiff(Today(), r.Dtl, TimeUnit.Days) ) ) } ),
                                             Sk, SortOrder.Ascending ) ) )
