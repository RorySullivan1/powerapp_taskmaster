                        Color: =gTheme.Color.TextMuted
                        FillPortions: =0
                        LayoutMinHeight: =24
                        Width: =Parent.Width - 32
                        Height: =24
                  - galRptPeople:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                      Properties:
                        # SCOPE RE-FILTERS A ~40-ROW FOLD. It never refetches, and no row
                        # property here touches a fact collection.
                        # TWO BRANCHES, because Name is text and every other key is a
                        # number: one Switch returning both would be a type conflict.
                        # SortByColumns takes a column NAME and would collapse this to one
                        # line, but whether it still accepts a string post-3.24042 is not
                        # grounded here, and a wrong guess fails the whole paste.
                        Items: |
                          =With( { sc: If( Len(Coalesce(gRptScope, "")) = 0,
                                           colRptPerson,
                                           Filter(colRptPerson, Em in colRptScopeEm.Value) ),
                                   dr: If(gRptSortDesc, SortOrder.Descending, SortOrder.Ascending) },
                               If( gRptSort = "Nm",
                                   Sort( sc, Nm, dr ),
                                   Sort( sc,
                                         Switch( gRptSort,
                                                 "Owns", Owns, "Sups", Sups, "Ovd",  Ovd,
                                                 "Dn",   Dn,   "Med",  Med,  "OnTp", OnTp,
                                                 // Owns, NOT Owns + Sups. This fallback is
                                                 // unreachable while gRptSort holds one of the
                                                 // keys above, but it must not sum the two —
                                                 // which this band's own subtitle forbids.
                                                 Owns ),
                                         dr ) ) )
                        WrapCount: =1
                        TemplateSize: =40
                        TemplatePadding: =0
                        TemplateFill: |
                          =If( ThisItem.Em = gRptSelPerson, gTheme.Color.Accent, RGBA(0, 0, 0, 0) )
                        BorderThickness: =0
                        ShowScrollbar: =true
                        FillPortions: =1
                        LayoutMinHeight: =200
                        Width: =Parent.Width - 32
                        Height: =Parent.Height - 120
                      Children:
                        - rowRptPersonBody:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight - 1
                            Children:
                              - cellRptNm:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =Coalesce(ThisItem.Nm, ThisItem.Em)
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    Color: =gTheme.Color.TextPrimary
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =3
                                    LayoutMinWidth: =140
                                    Height: =32
                              - cellRptOwns:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =Text(ThisItem.Owns)
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    FontWeight: =FontWeight.Semibold
                                    Color: =gTheme.Color.TextPrimary
                                    Align: =Align.Right
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =52
                                    Height: =32
                              - cellRptSups:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =Text(ThisItem.Sups)
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    Color: =gTheme.Color.TextMuted
                                    Align: =Align.Right
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =66
                                    Height: =32
                              - cellRptOvd:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =Text(ThisItem.Ovd)
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    FontWeight: =FontWeight.Semibold
                                    Color: |
                                      =If(ThisItem.Ovd > 0, gTheme.Color.Danger, gTheme.Color.TextMuted)
                                    Align: =Align.Right
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =62
                                    Height: =32
                              # A PLAIN Image, NOT cmpKpiRing. A canvas component cannot be
                              # inserted into a gallery (MS Learn known limitation #4) and the
                              # validator hard-fails on it.
                              #
                              # Whole numbers only: a fraction would have to go through Text(),
                              # which drags the locale decimal separator into an SVG attribute,
                              # and an attribute Power Fx cannot render comes out EMPTY — a
                              # width='' rect is not a thin rect, it is no rect.
                              - cellRptHealth:
                                  Control: Image@2.2.3
                                  Properties:
                                    ImagePosition: =ImagePosition.Fit
                                    FillPortions: =2
                                    LayoutMinWidth: =90
                                    Height: =18
                                    # CUMULATIVE BOUNDARIES, NOT INDEPENDENT WIDTHS. Rounding each
                                    # segment separately overflows — Gc=3, Ac=5, Rc=0 gives
                                    # Round(112.5)=113 and Round(187.5)=188, so the red segment came
                                    # out width='-1', an SVG error that kills the whole drawing.
                                    # Rounding the running boundary instead is monotonic, so every
                                    # width is >= 0 by construction and they always total 300.
                                    #
                                    # NO OPEN TASKS DRAWS THE EMPTY TRACK. Max(1, 0) used to make the
                                    # denominator 1 with a zero numerator, painting a solid RED bar
                                    # for anyone who had finished all their work.
                                    Image: |
                                      =With( { tot: ThisItem.Gc + ThisItem.Ac + ThisItem.Rc },
                                          With( { g:  If( tot = 0, 0, Round(ThisItem.Gc / Max(1, tot) * 300, 0) ),
                                                  ga: If( tot = 0, 0,
                                                          Round((ThisItem.Gc + ThisItem.Ac) / Max(1, tot) * 300, 0) ) },
                                              "data:image/svg+xml," & EncodeUrl(
                                                  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 40'>"
                                                & "<rect x='0' y='10' width='300' height='20' rx='10' fill='#EEF1F5'/>"
                                                & If( tot = 0, "",
                                                      "<rect x='0' y='10' width='" & g
                                                    & "' height='20' fill='#31825D'/>"
                                                    & "<rect x='" & g & "' y='10' width='" & (ga - g)
                                                    & "' height='20' fill='#D69828'/>"
                                                    & "<rect x='" & ga & "' y='10' width='" & (300 - ga)
                                                    & "' height='20' fill='#C53A3A'/>" )
                                                & "</svg>" ) ) )
                              - cellRptDn:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =Text(ThisItem.Dn)
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    Color: =gTheme.Color.TextPrimary
                                    Align: =Align.Right
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =52
                                    Height: =32
                              # -1 is "not applicable", not zero: a dash where no completed
                              # task carried a start date, so a real 0-day turnaround is not
                              # confused with a missing one.
                              - cellRptMed:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =If(ThisItem.Med < 0, "—", Text(ThisItem.Med))
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    Color: =gTheme.Color.TextMuted
                                    Align: =Align.Right
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =70
                                    Height: =32
                              - cellRptOnT:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =If(ThisItem.OnTp < 0, "—", ThisItem.OnTp & "%")
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    Color: |
                                      =If( ThisItem.OnTp < 0,  gTheme.Color.TextMuted,
                                           ThisItem.OnTp >= 80, gTheme.Color.Success,
                                           ThisItem.OnTp >= 50, gTheme.Color.Warning,
                                                                gTheme.Color.Danger )
                                    Align: =Align.Right
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =64
                                    Height: =32
                        - rowRptPersonLine:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =gTheme.Color.Border
                              X: =0
                              Y: =Parent.TemplateHeight - 1
                              Width: =Parent.TemplateWidth
                              Height: =1
                        - galRptPeopleHit:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: =""
                              Fill: =RGBA(0, 0, 0, 0)
                              HoverFill: =gTheme.Color.Hover
                              PressedFill: =gTheme.Color.Press
                              BorderThickness: =0
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              # Selects, never navigates. The detail is an OVERLAY on this
                              # screen: a Navigate would cost a fresh OnVisible and throw
                              # away every fold, which is the whole point of folding.
                              # THE OVERLAY LISTS THE TASKS THEMSELVES, off colRptPersonSrc,
                              # which is already in memory — no refetch, which is the whole
                              # payoff for folding at person grain. Built INLINE rather than
                              # through Select() on a hidden button: Select queues, and a
                              # queued build would paint the previous person's list for a
                              # frame. This is one pass over one person's rows.
                              OnSelect: |
                                =Select(Parent);
                                 If( gRptSelPerson = ThisItem.Em,
                                     Set( gRptSelPerson, "" ),
                                     Set( gRptSelPerson, ThisItem.Em );
                                     Set( gRptSelName, Coalesce(ThisItem.Nm, ThisItem.Em) );
                                     Set( gRptSelRow, ThisItem );
                                     // DUP ROWS DROPPED. A person who is both lead and
                                     // supporter on a task has two rows here; listing the task
                                     // twice reads as a defect, and the measures beside it
                                     // already zero the duplicate.
                                     // Sk IS THE WHOLE SORT, because Sort takes ONE column:
                                     // open work ranks by days-to-due so overdue leads, undated
                                     // open work sits after it, and completed work lands last.
                                     ClearCollect( colRptPTask,
                                         Sort(
                                             ForAll( Filter( colRptPersonSrc,
                                                             Em = ThisItem.Em && Dup = false ) As r,
                                                 { TNm: r.TNm, Stg: r.Stg, Hth: r.Hth,
                                                   Dst: r.Dst, Dtl: r.Dtl, Op: r.Op,
                                                   Sk: If( r.Op <> 1, 100000,
                                                           If( IsBlank(r.Dtl), 90000,
                                                               DateDiff(Today(), r.Dtl, TimeUnit.Days) ) ) } ),
                                             Sk, SortOrder.Ascending ) ) )
            # =============================================================
            # BAND 3 — where the work sits
            # =============================================================
            # EVERY COORDINATE POWER FX SUPPLIES IS A WHOLE NUMBER. A fraction would have
            # to go through Text(), which drags the locale decimal separator into an SVG
            # attribute, and an attribute Power Fx cannot render comes out EMPTY — a
            # width='' rect is not a thin rect, it is no rect. The viewBoxes are scaled up
            # instead. Fractions that appear as STRING LITERALS (the pie radius) never pass
            # through Text() and are safe.
            #
            # FOUR COLUMNS AT LayoutMinWidth 260 need ~1100px before they overflow. Raising
            # a panel's minimum without dropping one from the row is what breaks this band.
            - rowRptWork:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =gTheme.Space.Gap
                  FillPortions: =0
                  LayoutMinHeight: =300
                  Width: =Parent.Width - 48
                  Height: =300
                Children:
                  - pnlRptFam:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =6
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =260
                        Height: =300
                      Children:
                        - lblRptFamT:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Open tasks by activity family"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H3
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.Primary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =24
                              Width: =Parent.Width - 32
                              Height: =24
                        - lblRptFamS:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Top 6, joined through the parent project."
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              FillPortions: =0
                              LayoutMinHeight: =32
                              Width: =Parent.Width - 32
                              Height: =32
                        - imgRptFam:
                            Control: Image@2.2.3
                            Properties:
                              ImagePosition: =ImagePosition.Fit
                              FillPortions: =1
                              LayoutMinHeight: =120
                              Width: =Parent.Width - 32
                              Height: =Parent.Height - 80
                              Image: |
                                =With( { n: CountRows(colRptFamBar) },
                                    "data:image/svg+xml;charset=utf-8," & EncodeUrl(
                                        "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 "
                                      & If(n = 0, 60, n * 44 + 8) & "'>"
                                      & Concat( colRptFamBar,
                                            "<text x='0' y='" & ((Idx - 1) * 44 + 26)
                                          & "' font-size='17' font-family='Segoe UI, sans-serif' fill='#20262D'>"
                                          & EncodeHTML( If(Len(K) > 22, Left(K, 21) & "..", K) ) & "</text>"
                                          & "<rect x='210' y='" & ((Idx - 1) * 44 + 12)
                                          & "' width='330' height='20' rx='10' fill='#EEF1F5'/>"
                                          & "<rect x='210' y='" & ((Idx - 1) * 44 + 12) & "' width='"
                                          & Max(2, Round(N / Max(1, gRptFamMax) * 330, 0))
                                          & "' height='20' rx='10' fill='"
                                          & If(K = "Other", "#8A5AA8", "#005A9E") & "'/>"
                                          & "<text x='598' y='" & ((Idx - 1) * 44 + 27)
                                          & "' text-anchor='end' font-size='16'"
                                          & " font-family='Segoe UI, sans-serif' fill='#6E7882'>" & N & "</text>" )
                                      & If( n = 0,
                                            "<text x='300' y='34' text-anchor='middle' font-size='17'"
                                          & " font-family='Segoe UI, sans-serif' fill='#6E7882'>No open tasks</text>", "" )
                                      & "</svg>" ) )
                  - pnlRptAud:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =6
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =gTheme.Color.Surface
                        BorderColor: =gTheme.Color.Border
                        BorderThickness: =1
                        FillPortions: =1
                        LayoutMinWidth: =260
                        Height: =300
                      Children:
                        - lblRptAudT:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Open tasks by output audience"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.H3
                              FontWeight: =FontWeight.Semibold
                              Color: =gTheme.Color.Primary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =24
                              Width: =Parent.Width - 32
                              Height: =24
                        # THE SUBTITLE CARRIES BOTH GAPS, because a slice cannot. A large
                        # Unspecified wedge here means the column is YOUNGER than the backlog,
                        # not that the report is broken — and those two look identical on a
                        # pie. Other outranks it: a value tasks still hold that the column no
                        # longer offers is a data question and rarer, so it must not be hidden
                        # behind the commoner message.
                        - lblRptAudS:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                =If( LookUp(colRptAudBar, K = "Other", N) > 0,
                                     "Other is NON-ZERO — tasks hold an audience the column no longer offers.",
                                     LookUp(colRptAudBar, K = "Unspecified", N) > 0,
                                     LookUp(colRptAudBar, K = "Unspecified", N) & " of "
                                       & CountRows(colRptOpenTag)
                                       & " predate the column or produce no output.",
                                     "Required on any task that produces output." )
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: |
                                =If( LookUp(colRptAudBar, K = "Other", N) > 0,
                                     gTheme.Color.Danger,
                                     LookUp(colRptAudBar, K = "Unspecified", N) > 0,
                                     gTheme.Color.Warning,
                                     gTheme.Color.TextMuted )
                              FillPortions: =0
                              LayoutMinHeight: =32
                              Width: =Parent.Width - 32
                              Height: =32
                        - imgRptAud:
                            Control: Image@2.2.3
                            Properties:
                              ImagePosition: =ImagePosition.Fit
                              FillPortions: =1
                              LayoutMinHeight: =120
                              Width: =Parent.Width - 32
                              Height: =Parent.Height - 80
                              # A PIE IS N STACKED CIRCLES, not arc paths: circumference 100 at
                              # r 15.9155, so a slice IS its percentage and no Cos/Sin appears
                              # anywhere. stroke-width 31.831 is 2r, which fills the stroke to
                              # the centre and makes the ring a disc. The fractions here are
                              # STRING LITERALS and never computed — a computed fraction goes
                              # through Text(), drags the locale decimal separator into the
                              # attribute, and the slice renders EMPTY. Everything Power Fx
                              # supplies (Pct, Off, the legend coordinates) is a whole number.
                              # dashoffset 125 - Off, not 25 - Off: the pattern repeats every
                              # 100 units so the two are the same rotation, and this one can
                              # never go negative.
                              Image: |
                                =With( { n: CountRows(colRptAudPie) },
                                    "data:image/svg+xml;charset=utf-8," & EncodeUrl(
                                        "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 150'>"
                                      & "<g transform='translate(75 75) scale(2)'>"
                                      & "<circle cx='0' cy='0' r='15.9155' fill='none'"
                                      & " stroke='#EEF1F5' stroke-width='31.831'/>"
                                      & Concat( colRptAudPie,
                                            "<circle cx='0' cy='0' r='15.9155' fill='none' stroke='"
                                          & Hx & "' stroke-width='31.831' stroke-dasharray='"
                                          & Pct & " " & (100 - Pct) & "' stroke-dashoffset='"
                                          & (125 - Off) & "'/>" )
                                      & "</g>"
                                      & Concat( colRptAudPie,
                                            "<rect x='160' y='" & ((Li - 1) * 22 + 10)
                                          & "' width='10' height='10' rx='2' fill='" & Hx & "'/>"
                                          & "<text x='176' y='" & ((Li - 1) * 22 + 19)
                                          & "' font-size='13' font-family='Segoe UI, sans-serif'"
                                          & " fill='#20262D'>"
                                          & EncodeHTML( If(Len(K) > 16, Left(K, 15) & "..", K) ) & "</text>"
                                          & "<text x='318' y='" & ((Li - 1) * 22 + 19)
                                          & "' text-anchor='end' font-size='13'"
                                          & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                          & N & "</text>" )
                                      & If( n = 0,
                                            "<text x='230' y='79' text-anchor='middle' font-size='14'"
                                          & " font-family='Segoe UI, sans-serif' fill='#6E7882'>"
                                          & "No open tasks</text>", "" )
                                      & "</svg>" ) )
                  - pnlRptReq:
