                                          PaddingLeft: =8
                                          PaddingRight: =8
                                          X: =0
                                          Y: =0
                                          Width: =Parent.TemplateWidth
                                          Height: =Parent.TemplateHeight - 1
                                        Children:
                                          # LIFECYCLE glyph, bound to task_stage — the same
                                          # progression the project rows use. task_status is a
                                          # separate RAG health column and is NOT what this shows.
                                          - icoTaskStage:
                                              Control: Image@2.2.3
                                              Properties:
                                                ImagePosition: =ImagePosition.Fit
                                                FillPortions: =0
                                                LayoutMinWidth: =24
                                                Width: =24
                                                Height: =24
                                                Image: |
                                                  =With(
                                                      { g: Switch( Coalesce(ThisItem.task_stage.Value, ""),
                                                            "Not Started",
                                                                "<circle cx='18' cy='18' r='13' fill='none' stroke='#B9C0C8' stroke-width='2.5'/>",
                                                            "Planning",
                                                                "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'/>"
                                                              & "<circle cx='12.5' cy='18' r='1.7' fill='#6E7882'/>"
                                                              & "<circle cx='18'   cy='18' r='1.7' fill='#6E7882'/>"
                                                              & "<circle cx='23.5' cy='18' r='1.7' fill='#6E7882'/>",
                                                            "Drafting",
                                                                "<circle cx='18' cy='18' r='13' fill='none' stroke='#005A9E' stroke-width='3'/>"
                                                              & "<circle cx='18' cy='18' r='5' fill='#005A9E'/>",
                                                            "Finalizing",
                                                                "<circle cx='18' cy='18' r='13' fill='none' stroke='#D69828' stroke-width='3'/>"
                                                              & "<circle cx='18' cy='18' r='9' fill='#D69828'/>",
                                                            "Completed",
                                                                "<circle cx='18' cy='18' r='14.5' fill='#31825D'/>"
                                                              & "<path d='M11 18.5 L16 23.5 L25 13.5' fill='none' stroke='#FFFFFF'"
                                                              & " stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/>",
                                                                "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'"
                                                              & " stroke-dasharray='4 3'/>"
                                                              & "<text x='18' y='22.5' text-anchor='middle' font-size='13'"
                                                              & " font-family='Segoe UI, sans-serif' fill='#6E7882'>?</text>" ) },
                                                      "data:image/svg+xml," & EncodeUrl(
                                                          "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'>" & g & "</svg>" )
                                                  )
                                          - cellTaskName:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =ThisItem.task_name
                                                Font: =gTheme.Font
                                                Size: =gTheme.Size.Body
                                                Color: =gTheme.Color.TextPrimary
                                                VerticalAlign: =VerticalAlign.Middle
                                                FillPortions: =3
                                                LayoutMinWidth: =140
                                                Height: =44
                                          - cellTaskWho:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =Coalesce(ThisItem.task_lead.DisplayName, "Unassigned")
                                                Font: =gTheme.Font
                                                Size: =gTheme.Size.Small
                                                Color: =gTheme.Color.TextMuted
                                                VerticalAlign: =VerticalAlign.Middle
                                                FillPortions: =2
                                                LayoutMinWidth: =110
                                                Height: =44
                                          - cellTaskPriority:
