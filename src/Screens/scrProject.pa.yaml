                                                Set( gEditMode, "Edit" );
                                                Navigate( scrTransactionEdit, ScreenTransition.Cover ) )
                        # Preserved from the tabbed version, decision and all: there is no
                        # cross-currency total to show, because since Q14 the app stores only
                        # the native notional. Totalling ONE currency at a time is the honest
                        # thing an app can do. CROSS-CURRENCY CONVERSION IS OUT OF SCOPE for this
                        # project (2026-08-17) — other tools handle it, so no blended figure is owed
                        # here and none should be invented. Sum and
