                                          Color: =gTheme.Color.Danger
                                          HoverColor: =gTheme.Color.Danger
                                          HoverFill: =RGBA(197, 58, 58, 0.08)
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          Tooltip: ="Delete this issue"
                                          FillPortions: =0
                                          LayoutMinWidth: =24
                                          Width: =24
                                          Height: =24
                                          OnSelect: |
                                            =Set( gDelKind, "Issue" );
                                             Set( gDelId, ThisItem.ID );
                                             Set( gDelName, ThisItem.issue_name );
                                             Set( gDelRefs, 0 )
                              - rowIssLine:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =gTheme.Color.Border
                                    X: =0
                                    Y: =Parent.TemplateHeight - 1
                                    Width: =Parent.TemplateWidth
                                    Height: =1
                              - galIssuesHit:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: =""
                                    Fill: =RGBA(0, 0, 0, 0)
                                    HoverFill: =gTheme.Color.Hover
                                    PressedFill: =gTheme.Color.Press
                                    BorderThickness: =0
                                    X: =0
                                    Y: =0
                                    # Stops short of the delete icon's strip, so a tap aimed at delete
                                    # cannot fall through to "open the editor" instead.
                                    # STOPS SHORT OF THE DELETE ICON. The icon is the row container's last
                                    # auto-layout child, and this transparent button is declared AFTER that
                                    # container — so at full width it would sit on top of the icon and swallow
                                    # every tap meant for it.
                                    Width: =Parent.TemplateWidth - 46
                                    Height: =Parent.TemplateHeight
                                    # Re-read on the way in — see the transaction row for
                                    # why the live-Filter binding makes this a freshness
                                    # fix rather than an identity one.
                                    OnSelect: |
                                      =Select(Parent);
                                       Set( gEditIssue, LookUp(taskmaster_issues, ID = ThisItem.ID) );
                                       If( IsBlank(gEditIssue.ID),
                                           Notify( "That issue no longer exists — it may have been deleted. Reopen the project to refresh the list.",
                                                   NotificationType.Error ),
                                           Set( gEditMode, "Edit" );
                                           Navigate( scrIssueEdit, ScreenTransition.Cover ) )

      # =====================================================================
      # DELETE CONFIRMATION — one instance serving all three galleries, keyed by
      # gDelKind. Declared LAST so positional z-order floats it over the content.
      #
      # STUDIO CHECK BEFORE THIS SCREEN IS PASTED: cmpConfirmDialog had NO consumer
      # anywhere in src/ until now, so its custom properties may never have been
      # declared in Studio at all. A component crosses the gap in TWO parts and only
      # the CONTROLS paste — every custom property is declared and typed BY HAND.
      # That is exactly how cmpSelection silently returned blank for weeks. Confirm
      # IsOpen / Title / Message / ConfirmLabel / CancelLabel / Destructive are
      # INPUTS and OnConfirm / OnCancel are EVENTS before trusting this.
      #
      # Visible is gated as well as IsOpen: a component intercepts every click
      # inside its bounds, so a full-screen instance left visible while closed would
      # swallow every tap on the screen underneath it.
      # =====================================================================
      - cmpPrjConfirmDel:
          Control: CanvasComponent
          ComponentName: cmpConfirmDialog
          Properties:
            Visible: =Len( Coalesce(gDelKind, "") ) > 0
            IsOpen: =Len( Coalesce(gDelKind, "") ) > 0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: |
              =Switch( gDelKind,
                       "Task",        "Delete this task?",
                       "Transaction", "Delete this transaction?",
                       "Issue",       "Delete this issue?",
                       "Delete?" )
            # Says what ELSE changes, which is the whole reason this is a dialog and
            # not the two-press arm the project delete uses. An arm cannot explain
            # that issues are about to be detached.
            Message: |
              =Switch( gDelKind,
                       "Task",
                       "Delete " & gDelName & "? Its product links go with it." &
                       If( gDelRefs > 0,
                           " " & gDelRefs & " issue(s) raised against it will be KEPT — only the link to this task is cleared.",
                           "" ) &
                       " This cannot be undone.",
                       "Transaction",
                       "Delete " & gDelName & "?" &
                       If( gDelRefs > 0,
                           " " & gDelRefs & " issue(s) linked to it will be KEPT — only the link to this transaction is cleared.",
                           "" ) &
                       " This cannot be undone.",
                       "Issue",
                       "Delete " & gDelName & "? Nothing else references an issue. This cannot be undone.",
                       "" )
            ConfirmLabel: ="Delete"
            CancelLabel: ="Cancel"
            Destructive: =true
            # Order is deliberate: DETACH the referencing issues first, then remove the
            # row. The reverse leaves issues pointing at a row that no longer exists.
            #
            # IfError( Remove(...), Notify(...) ) — MS Learn's own idiom — is REJECTED
            # by Studio: Remove and ForAll/Patch return a TABLE while Notify and Set
            # return a boolean, and IfError requires all arguments to be type-compatible.
            # Hence Set-into-a-scrap on both arms, and a DIFFERENT scrap name per call
            # site: a global's type unifies across every Set, so one name holding
            # differently-shaped tables is a type conflict.
            OnConfirm: |
              =Set( gDelErr, "" );
               Set( gDelBlock, false );
               // COUNT, THEN REFUSE — never half-do it. The detach is a local ForAll over
               // a delegable Filter, so past the data row limit it would clear SOME
               // references, raise NO error, and then delete the parent anyway. Same
               // shape as the project cascade above.
               // THE ROW THAT KNOWS THE TASK IS ABOUT TO BE DELETED, so the link is read
               // now. Deleting the last open Blockage on a task must take that task back
               // off Red, and after the Remove there is nothing left to ask.
               Set( gDelIssTask,
                    If( gDelKind = "Issue",
                        Coalesce( LookUp(taskmaster_issues, ID = gDelId).issue_task_name.Id, 0 ),
                        0 ) );
               If( gDelRefs >= 500, Set( gDelBlock, true ) );
               If( !gDelBlock && gDelKind = "Task" && gDelRefs > 0,
                   IfError( Set( gDelScrapDT,
                                 ForAll( Filter( taskmaster_issues, issue_task_name.Id = gDelId ) As iss,
                                         Patch( taskmaster_issues, iss, { issue_task_name: Blank() } ) ) ),
                            Set( gDelErr, FirstError.Message ) ) );
               If( !gDelBlock && gDelKind = "Transaction" && gDelRefs > 0,
                   IfError( Set( gDelScrapDX,
                                 ForAll( Filter( taskmaster_issues, issue_transaction_name.Id = gDelId ) As iss,
                                         Patch( taskmaster_issues, iss, { issue_transaction_name: Blank() } ) ) ),
                            Set( gDelErr, FirstError.Message ) ) );
               // LookUp, not the gallery record: colProjectTasks is a snapshot, and a
               // task's product links are removed by SharePoint's own CASCADE on
               // taskproduct_task_id — the app must not try to delete them itself.
               If( Len(gDelErr) = 0 && !gDelBlock,
                   Switch( gDelKind,
                           "Task",
                           IfError( Set( gDelScrapT,
                                         Remove( taskmaster_tasks, LookUp(taskmaster_tasks, ID = gDelId) ) ),
                                    Set( gDelErr, FirstError.Message ) ),
                           "Transaction",
                           IfError( Set( gDelScrapX,
                                         Remove( taskmaster_transactions, LookUp(taskmaster_transactions, ID = gDelId) ) ),
                                    Set( gDelErr, FirstError.Message ) ),
                           "Issue",
                           IfError( Set( gDelScrapI,
                                         Remove( taskmaster_issues, LookUp(taskmaster_issues, ID = gDelId) ) ),
                                    Set( gDelErr, FirstError.Message ) ) ) );
               If( gDelBlock,
                   Notify( "Too many issues reference this to detach in one pass. Nothing was deleted — ask for the cleanup workflow.",
                           NotificationType.Error ),
                   Len(gDelErr) > 0,
                   // No transaction exists here: by the time the Remove fails, the detach
                   // has already committed. Say so rather than implying nothing changed.
                   Notify( "Couldn't delete it: " & gDelErr
                             & " Some issue links may already have been cleared — reopen the project to check.",
                           NotificationType.Error ),
                   Notify( gDelKind & " deleted.", NotificationType.Success );
                   If( gDelIssTask > 0,
                       ClearCollect( colHlTasks, { Id: gDelIssTask } );
                       Select( btnPrjHealth ) );
                   // The ONE call that repairs project_phase and the completion rollup.
                   Select( btnPrjRecompute ) );
               Set( gDelKind, "" )
            OnCancel: =Set( gDelKind, "" )
