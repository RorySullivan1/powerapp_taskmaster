                                                FillPortions: =0
                                                LayoutMinWidth: =24
                                                Width: =24
                                                Height: =24
                                                OnSelect: |
                                                  =Set( gDelKind, "Task" );
                                                   Set( gDelId, ThisItem.ID );
                                                   Set( gDelName, ThisItem.task_name );
                                                   Set( gDelRefs, CountRows( Filter(taskmaster_issues, issue_task_name.Id = ThisItem.ID) ) )
                                    - rowTasksLine:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          Fill: =gTheme.Color.Border
                                          X: =0
                                          Y: =Parent.TemplateHeight - 1
                                          Width: =Parent.TemplateWidth
                                          Height: =1
                                    - galTasksHit:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          # The row's action lives HERE, not on the gallery's
                                          # OnSelect: a gallery's own OnSelect does not reliably
                                          # fire when the click lands on a child control, so
                                          # without a transparent full-template button declared
                                          # LAST the rows look right and do nothing. Confirmed
                                          # in Studio on the nav rail, 2026-08-03.
                                          Text: =""
                                          Fill: =RGBA(0, 0, 0, 0)
                                          HoverFill: =gTheme.Color.Hover
                                          PressedFill: =gTheme.Color.Press
                                          BorderThickness: =0
                                          X: =0
                                          Y: =0
                                          # Stops short of the delete icon's strip, so a tap aimed at delete
                                          # cannot fall through to "open the editor" instead.
                                          # STOPS SHORT OF THE DELETE ICON. The icon is the row container's last
                                          # auto-layout child, and this transparent button is declared AFTER that
                                          # container — so at full width it would sit on top of the icon and swallow
                                          # every tap meant for it.
                                          Width: =Parent.TemplateWidth - 46
                                          Height: =Parent.TemplateHeight
                                          # Goes STRAIGHT to the editor, exactly like the
                                          # transaction and issue rows below. The old
                                          # scrTask detail screen was deleted 2026-08-10:
                                          # it was a second, weaker writer for the same
                                          # row that seeded every control from `Default`
                                          # and never called `Reset()`, so on the second
                                          # task opened it still displayed the FIRST
                                          # task's name, stage, health and priority — and
                                          # saving wrote those stale values back. It also
                                          # wrote `task_stage` WITHOUT the derived
                                          # `task_date_completion` that scrTaskEdit
                                          # maintains, so completing a task from there
                                          # left the completion date blank.
                                          #
                                          # LookUp, not ThisItem: colProjectTasks is a
                                          # snapshot taken in OnVisible, and the editor
                                          # Patches against whatever record it is handed.
                                          # Re-reading the live row on the way in costs
                                          # one delegable ID lookup and removes a whole
                                          # class of write-stale-data bug.
                                          #
                                          # A LookUp can MISS — the row may have been
                                          # deleted by someone else since OnVisible took
                                          # the snapshot. Opening the editor on a blank
                                          # record would show an empty "Edit task" form
                                          # and then Patch against nothing, so refuse and
                                          # say so instead.
                                          OnSelect: |
                                            =Select(Parent);
                                            Set( gEditTask, LookUp(taskmaster_tasks, ID = ThisItem.ID) );
                                            If( IsBlank(gEditTask.ID),
                                                Notify( "That task no longer exists — it may have been deleted. Reopen the project to refresh the list.",
                                                        NotificationType.Error ),
                                                Set( gEditMode, "Edit" );
