# scrProject — the project cockpit.  REWORKED 2026-08-07, tabs removed entirely.
#
#   +--------------------------------------------------------------+
#   | name + 8 explicit facts             | ring |  edit / delete   |   info card
#   +---------------------------------+----------------------------+
#   | Tasks        n of m complete  [+]|  Issues              [+]  |
#   |   ...list...                     |  name | linked | status   |
#   | Transactions       n        [+]  |         | type | impact   |   work band
#   |   ...list...                     |  ...list...               |
#   +---------------------------------+----------------------------+
#
# WHY NO TABS.  The tab list hid two thirds of a project behind a click, and its
# `Default` had to be an ITEM rather than a value, which is what was erroring.
# Everything is on screen at once now, so there is no tab state to seed and
# `gProjTab` is gone.
#
# WHY ISSUES SIT APART.  A task or a transaction is a unit of work under the
# project; an issue is raised AGAINST the project and points at one of them.  It
# needs five columns to be worth reading, so it gets its own full-height column
# rather than a third of a stacked list.
#
# LAYOUT IS CONTAINERS, NOT COORDINATES.  This screen used to be ~30 absolutely
# positioned controls whose Y values encoded a tab-bar height that did not match
# the tab bar (see the 2026-08-07 band-collision fix).  Everything below the
# header band is now auto-layout, so nothing has to agree with anything else's
# height.  The header band itself stays absolute — three controls, no collisions.
#
# EVERY auto-layout child sets FillPortions EXPLICITLY.  It defaults to 1 at
# every nesting level, so one unset child silently steals height from its
# siblings; that default has cost this repo four round trips.  0 = "keep your own
# size", 1+ = "share what is left".
#
# A CHILD'S WIDTH MUST SUBTRACT ITS PARENT'S HORIZONTAL PADDING (fixed 2026-08-11).
# `Parent.Width` inside a container returns the container's FULL width, padding
# included — it is NOT the content box.  A child written `Width: =Parent.Width`
# is therefore placed at the content-box LEFT edge but sized to the FULL width,
# so it hangs off the right by exactly PaddingLeft + PaddingRight.  Every child on
# this screen had that bug; scrProjectEdit, the container reference, has always
# written `=Parent.Width - 48` inside its 24-padded containers.  Resolved at
# 1366x768, and this is what the overlapping task row actually was:
#
#            was                                    now
#   rowWork   24 .. 1390  (24 OFF-SCREEN)     rowWork   24 .. 1342
#   galTasks  40 ..  850  (16 past its card)  galTasks  40 ..  818
#   cellTaskWho  615 .. 842                   cellTaskWho  600 .. 810
#                ^ 24 past the tasks card border and 8 into colIssues,
#                  which begins at 850 — "Assigned to" drawn over the
#                  issues column.  Now it stops 8px inside its own card.
#
# Bands, so Studio's numbers can be checked by eye:
#      0 ..  64   header       (absolute: HeaderBar / AppTitle / BackIcon)
#     64 .. 768   bodyRoot     (padding 24 -> content 24..1342 x 88..744)
#     88 .. 260   cardInfo     (172 tall, FillPortions 0)
#    276 .. 744   rowWork      (FillPortions 1; colLists 3 : colIssues 2)
Screens:
  scrProject:
    Properties:
      Fill: =Theme.Color.Bg
      OnVisible: |
        =ClearCollect( colProjectTasks,
            Filter( taskmaster_tasks,
                task_project_id.Id = gSelProject.ID ) );
        // NO gProjArchived. It counted this project's individually-archived TASKS, and
        // task_stage has no "Archived" value as of 2026-08-12 — so the query could only
        // ever return 0 and the "N archived (hidden)" caption it fed could never show.
        // Nothing is hidden from the task list any more: it is every task on the project.
        // Delete is a TWO-PRESS action and must never open already armed.
        Set( gPrDelArm, false )
    Children:
      # =====================================================================
      # HEADER BAND — absolute, three controls, no collisions.
      # =====================================================================
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Primary
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Theme.Space.HeaderH
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="EQD Taskmaster"
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            Size: =Theme.Size.H2
            FontWeight: =FontWeight.Semibold
            VerticalAlign: =VerticalAlign.Middle
            X: =Theme.Space.Gutter
            Y: =0
            Width: =360
            Height: =Theme.Space.HeaderH
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =Theme.Color.OnPrimary
            Tooltip: ="Back to projects"
            X: =Parent.Width - 24 - Theme.Space.Gutter
            Y: =(Theme.Space.HeaderH - 24) / 2
            Width: =24
            Height: =24
            OnSelect: =Back()
      # =====================================================================
      # BODY — one vertical container holding the info card and the work band.
      # =====================================================================
      - bodyRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Start
            LayoutGap: =Theme.Space.Gap
            PaddingTop: =Theme.Space.Gutter
            PaddingBottom: =Theme.Space.Gutter
            PaddingLeft: =Theme.Space.Gutter
            PaddingRight: =Theme.Space.Gutter
            X: =0
            Y: =Theme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - Theme.Space.HeaderH
          Children:
            # -------------------------------------------------------------
            # 1. PROJECT INFORMATION — stated outright, not left to be guessed.
            # -------------------------------------------------------------
            - cardInfo:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =24
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =20
                  PaddingRight: =20
                  Fill: =Theme.Color.Surface
                  BorderColor: =Theme.Color.Border
                  BorderThickness: =1
                  FillPortions: =0
                  LayoutMinHeight: =172
                  Width: =Parent.Width - 48
                  Height: =172
                Children:
                  - colFacts:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =8
                        FillPortions: =1
                        LayoutMinWidth: =420
                        Height: =140
                      Children:
                        - lblProjName:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Coalesce(gSelProject.project_name, "—")
                              Font: =Theme.Font
                              Size: =Theme.Size.H2
                              FontWeight: =FontWeight.Semibold
                              Color: =Theme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =36
                              Width: =Parent.Width
                              Height: =36
                        - rowFacts1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =32
                              FillPortions: =0
                              LayoutMinHeight: =40
                              Width: =Parent.Width
                              Height: =40
                            Children:
                              - colFact10:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutGap: =2
                                    FillPortions: =1
                                    LayoutMinWidth: =110
                                    Height: =40
                                  Children:
                                    - lblFactCap10:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: ="Status"
                                          Font: =Theme.Font
                                          Size: =Theme.Size.Small
                                          Color: =Theme.Color.TextMuted
                                          FillPortions: =0
                                          LayoutMinHeight: =16
                                          Width: =Parent.Width
                                          Height: =16
                                    - lblFactVal10:
