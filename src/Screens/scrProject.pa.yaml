                                                Align: =Align.Right
                                                VerticalAlign: =VerticalAlign.Middle
                                                FillPortions: =2
                                                LayoutMinWidth: =96
                                                Height: =44
                                          # LAST CHILD OF THE AUTO-LAYOUT ROW, CARRYING NO X AND NO Y AT ALL.
                                          # X DID NOT SURVIVE A SCREEN PASTE in either absolute form — off
                                          # Parent.TemplateWidth or off this container's Width — while Y and every other
                                          # property came through (user, 2026-08-18). Pasting the icon ALONE worked, so
                                          # whatever drops it is a property of the whole-screen paste, not of the value.
                                          # Auto-layout is what the design skill already prescribes for this: a child with
                                          # no X has nothing to lose. FillPortions 0, against the flexible columns to its
                                          # left, parks it hard right inside the strip the hit button stops short of.
                                          - icoDelTask:
                                              Control: Classic/Icon@2.5.0
                                              Properties:
                                                Icon: =Icon.Trash
                                                Color: =gTheme.Color.Danger
                                                HoverColor: =gTheme.Color.Danger
                                                HoverFill: =RGBA(197, 58, 58, 0.08)
                                                HoverBorderColor: =RGBA(0, 0, 0, 0)
