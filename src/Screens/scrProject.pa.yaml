                                          Text: =""
                                          Fill: =RGBA(0, 0, 0, 0)
                                          HoverFill: =gTheme.Color.Hover
                                          PressedFill: =gTheme.Color.Press
                                          BorderThickness: =0
                                          X: =0
                                          Y: =0
                                          # Stops short of the delete icon's strip, so a tap aimed at delete
                                          # cannot fall through to "open the editor" instead.
                                          # STOPS SHORT OF THE DELETE ICON. The icon is the row container's last
                                          # auto-layout child, and this transparent button is declared AFTER that
                                          # container — so at full width it would sit on top of the icon and swallow
                                          # every tap meant for it.
                                          Width: =Parent.TemplateWidth - 46
                                          Height: =Parent.TemplateHeight
                                          # Re-read on the way in, like the task row. This
                                          # gallery binds to a LIVE Filter rather than a
                                          # ClearCollect snapshot, so the exposure is
                                          # smaller than the task one was — ThisItem is a
                                          # genuine data-source row and Patch hits the
                                          # right ID either way. What it does NOT give is
                                          # freshness: the query result is cached between
                                          # refreshes, so the editor can seed its form
                                          # from values someone else has since changed and
                                          # patch them straight back. The LookUp costs one
                                          # delegable read; the guard covers the row being
                                          # gone entirely.
                                          OnSelect: |
                                            =Select(Parent);
                                            Set( gEditTransaction, LookUp(taskmaster_transactions, ID = ThisItem.ID) );
                                            If( IsBlank(gEditTransaction.ID),
