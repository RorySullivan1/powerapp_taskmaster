            Tooltip: ="Back to projects"
            X: =Parent.Width - 24 - gTheme.Space.Gutter
            Y: =(gTheme.Space.HeaderH - 24) / 2
            Width: =24
            Height: =24
            # AN EXPLICIT DESTINATION, NOT Back(). This screen has four inbound edges,
            # and Back() alternates between the two most recently displayed screens rather
            # than unwinding a stack — so saving a project then pressing X went back INTO
            # the editor. UnCover is the inverse of the Cover every inbound Navigate uses.
            OnSelect: =Navigate( scrProjects, ScreenTransition.UnCover )
