                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =12
                                    FillPortions: =0
                                    LayoutMinWidth: =120
                                    Width: =120
                                    Height: =120
                                  Children:
                                    - icoEditProject:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          Icon: =Icon.Edit
                                          Color: =gTheme.Color.Primary
                                          HoverColor: =gTheme.Color.PrimaryDark
                                          HoverFill: =gTheme.Color.Hover
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          Tooltip: ="Edit this project"
                                          FillPortions: =0
                                          LayoutMinHeight: =28
                                          Width: =28
                                          Height: =28
                                          OnSelect: |
                                            =Set( gEditMode, "Edit" );
                                             Set( gEditProject, gSelProject );
                                             Navigate( scrProjectEdit, ScreenTransition.Cover )
                                    - icoDeleteProject:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          Icon: =If( gPrDelArm, Icon.Warning, Icon.Trash )
                                          Color: =gTheme.Color.Danger
                                          HoverColor: =gTheme.Color.Danger
                                          # A RED wash, not gTheme.Color.Hover — a blue tint behind a red destructive icon
                                          # reads as a different control.
                                          HoverFill: =RGBA(197, 58, 58, 0.08)
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          Tooltip: |
                                            =If( gPrDelArm,
                                                 "Press again to delete this project and everything attached to it",
                                                 "Delete this project" )
                                          FillPortions: =0
                                          LayoutMinHeight: =28
                                          Width: =28
                                          Height: =28
                                          OnSelect: |
                                            =If( !gPrDelArm,
                                                 Set( gPrDelArm, true ),
                                                 Set( gPrDelErr, "" );
                                                 // Children FIRST. Every child carries a REQUIRED lookup to the
                                                 // project, so removing the parent while they exist leaves rows
                                                 // SharePoint will not let anything edit afterwards.
                                                 //
                                                 // RemoveIf is NOT delegable: it pulls matching rows up to the data
                                                 // row limit and deletes them one by one, and a partial pass raises
                                                 // NO error. COUNT, THEN REFUSE — never half-do it.
                                                 Set( gPrDelBlock, false );
                                                 With( { nI: CountRows( Filter(taskmaster_issues,       issue_project_id.Id       = gSelProject.ID) ),
                                                         nX: CountRows( Filter(taskmaster_transactions, transaction_project_id.Id = gSelProject.ID) ),
                                                         nT: CountRows( Filter(taskmaster_tasks,        task_project_id.Id        = gSelProject.ID) ) },
                                                     If( nI >= 500 || nX >= 500 || nT >= 500,
                                                         Set( gPrDelBlock, true ),
                                                         IfError( Set( gPrDelScrapI,
                                                                       RemoveIf( taskmaster_issues,
                                                                                 issue_project_id.Id = gSelProject.ID ) ),
                                                                  Set( gPrDelErr, FirstError.Message ) );
                                                         IfError( Set( gPrDelScrapX,
                                                                       RemoveIf( taskmaster_transactions,
                                                                                 transaction_project_id.Id = gSelProject.ID ) ),
                                                                  Set( gPrDelErr, FirstError.Message ) );
                                                         IfError( Set( gPrDelScrapT,
                                                                       RemoveIf( taskmaster_tasks,
                                                                                 task_project_id.Id = gSelProject.ID ) ),
                                                                  Set( gPrDelErr, FirstError.Message ) ) ) );
                                                 If( Len(gPrDelErr) = 0 && !gPrDelBlock,
                                                     IfError( Set( gPrDelScrapP,
                                                                   Remove( taskmaster_projects, gSelProject ) ),
                                                              Set( gPrDelErr, FirstError.Message ) ) );
                                                 If( gPrDelBlock,
                                                     Notify( "This project has too many attached items to delete in one pass. Nothing was deleted — ask for the cleanup workflow.",
                                                             NotificationType.Error ),
                                                     Len(gPrDelErr) > 0,
                                                     // No transaction here: by the time the parent fails, the child removals
                                                     // have already committed. Say so.
                                                     Notify( "Couldn't finish deleting the project: " & gPrDelErr
                                                               & " Some attached items may already have been removed — reopen the project to check.",
                                                             NotificationType.Error ),
                                                     Set( gSelProject, Blank() );
                                                     Set( gEditProject, Blank() );
                                                     Clear( colProjectTasks );
                                                     Clear( colProjectTx );
                                                     Clear( colProjectIss );
                                                     Notify( "Project deleted, with everything attached to it.",
                                                             NotificationType.Success );
                                                     Navigate( scrProjects, ScreenTransition.UnCover ) );
                                                 Set( gPrDelArm, false ) )
                                    # THE ONLY WAY A PROJECT REACHES "Complete". Every other phase is derived on
                                    # this screen's OnVisible; this button is the one place a human decides.
                                    - lblDelArmed:
                                        Control: Label@2.5.1
                                        Properties:
                                          Visible: =gPrDelArm
                                          Text: ="again"
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Small
                                          Color: =gTheme.Color.Danger
                                          Align: =Align.Center
                                          FillPortions: =0
                                          LayoutMinHeight: =16
                                          Width: =Parent.Width
                                          Height: =16
                        - btnPrjComplete:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Visible: |
                                =Coalesce(gSelProject.project_phase.Value, "") <> "Complete"
                              # DISABLED until nothing is outstanding. A disabled button cannot say why, so
                              # lblPrjCompleteWhy spells out what is blocking it — the two always appear together.
                              DisplayMode: |
                                =If( gPrjOpenIss = 0 && gPrjOpenTasks = 0,
                                     DisplayMode.Edit, DisplayMode.Disabled )
                              Text: ="✓  Mark complete"
                              Fill: =gTheme.Color.Success
                              Color: =gTheme.Color.OnPrimary
                              BorderColor: =gTheme.Color.Success
                              BorderThickness: =0
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Body
                              FillPortions: =0
                              LayoutMinHeight: =36
                              Width: =Parent.Width
                              Height: =36
                              OnSelect: |
                                =Set( gPrjCompErr, "" );
                                 IfError(
                                     Set( gPrjCompSaved,
                                          Patch( taskmaster_projects,
                                                 LookUp(taskmaster_projects, ID = gSelProject.ID),
                                                 { project_phase:         { Value: "Complete" },
                                                   project_date_complete: Now() } ) ),
                                     Set( gPrjCompErr, FirstError.Message ) );
                                 // Trust the RECORD, never the message — a write can fail and still leave
                                 // FirstError.Message empty.
                                 If( IsBlank(gPrjCompSaved.ID) && Len(gPrjCompErr) = 0,
                                     Set( gPrjCompErr, "SharePoint returned no record and no error message." ) );
                                 If( Len(gPrjCompErr) > 0,
                                     Notify( "Couldn't mark it complete: " & gPrjCompErr,
                                             NotificationType.Error ),
                                     Set( gSelProject, LookUp(taskmaster_projects, ID = gSelProject.ID) );
                                     Notify( "Project marked complete.", NotificationType.Success ) )
                        - lblPrjCompleteWhy:
                            Control: Label@2.5.1
                            Properties:
                              Visible: |
                                =Coalesce(gSelProject.project_phase.Value, "") <> "Complete"
                                 && (gPrjOpenIss > 0 || gPrjOpenTasks > 0)
                              Text: |
                                =Trim(
                                   "Blocked by "
                                   & If( gPrjOpenTasks > 0,
                                         gPrjOpenTasks & If(gPrjOpenTasks = 1, " open task", " open tasks"), "" )
                                   & If( gPrjOpenTasks > 0 && gPrjOpenIss > 0, " and ", "" )
                                   & If( gPrjOpenIss > 0,
                                         gPrjOpenIss & If(gPrjOpenIss = 1, " open issue", " open issues"), "" ) )
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width
                              Height: =18
            - rowWork:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =gTheme.Space.Gap
                  FillPortions: =1
                  LayoutMinHeight: =320
                  Width: =Parent.Width - 48
                  Height: =Parent.Height - 48 - 172 - gTheme.Space.Gap
                Children:
                  - colLists:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =gTheme.Space.Gap
                        FillPortions: =3
                        LayoutMinWidth: =520
                        Height: =Parent.Height
                      Children:
                        - secTasks:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =8
                              PaddingTop: =12
                              PaddingBottom: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                              Fill: =gTheme.Color.Surface
                              BorderColor: =gTheme.Color.Border
                              BorderThickness: =1
                              FillPortions: =1
                              LayoutMinHeight: =160
                              Width: =Parent.Width
                              Height: =(Parent.Height - gTheme.Space.Gap) / 2
                            Children:
                              - rowTasksHead:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =12
                                    FillPortions: =0
                                    LayoutMinHeight: =40
                                    Width: =Parent.Width - 32
                                    Height: =40
                                  Children:
                                    - lblTasksTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |
                                            ="Tasks   " & CountRows( Filter(colProjectTasks, task_stage.Value = "Completed") )
                                            & " of " & CountRows(colProjectTasks) & " complete"
