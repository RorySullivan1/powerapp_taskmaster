# One project: info card + KPI ring over a work band — tasks and transactions stacked
# left, issues full height right. Containers throughout below the header.
Screens:
  scrProject:
    Properties:
      Fill: =gTheme.Color.Bg
      # THIN ON PURPOSE. Everything derived from the project's children now lives in
      # btnPrjRecompute's OnSelect, because this screen deletes children too and each
      # delete invalidates the same numbers. Four callers, ONE copy of the block.
      OnVisible: |
        =Set( gPrDelArm, false );
         Set( gDelKind, "" );
         Set( gDelErr, "" );
         Select( btnPrjRecompute )
    Children:
      # =====================================================================
      # THE RECOMPUTE BLOCK — hidden, and CALLED rather than duplicated.
      #
      # WHY IT IS A CONTROL: Power Fx cannot name a behaviour block, and this one
      # has four callers — OnVisible plus the three delete handlers. Inlining it in
      # each would create four writers of project_phase and project_perc_completion
      # that can drift apart, which is the exact failure the 500-cap comment below
      # already guards against. A control's OnSelect is the only reusable behaviour
      # unit the language offers, and Select() invokes it.
      #
      # WHY Visible:=false IS SAFE, and not folklore: confirmed in Studio
      # 2026-08-18. tests/scrProbeRerun scored Select() on a visible button, a 1x1
      # transparent button and a hidden button IDENTICALLY, with a passing positive
      # control. Select() does NOT no-op on an invisible control. Do not "fix" this
      # into a 1x1 transparent button — hidden is deliberate and grounded.
      #
      # It RE-READS colProjectTasks rather than trusting each caller to patch the
      # snapshot: one delegable Filter on an indexed FK is cheaper than three delete
      # handlers each remembering to keep a collection in step, and it cannot drift.
      # =====================================================================
      # =====================================================================
      # HEALTH RECOMPUTE. Hidden, 1x1, declared FIRST so it can never cover a
      # control — z-order is positional in this dialect. Select() DOES fire on an
      # invisible control (probe, tests/README.md). Seed colHlTasks with the task
      # ids to recompute, then Select this.
      # =====================================================================
      - btnPrjHealth:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Visible: =false
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            X: =0
            Y: =0
            Width: =1
            Height: =1
            OnSelect: |
              =// Recomputes the STORED half of task health for every task in colHlTasks.
               // The rules, and why OVERDUE IS DELIBERATELY NOT IN HERE, live in one place:
               // rollups.task_health in schema.yaml. Do not restate them at the call sites.
               //
               // THIS BODY IS DUPLICATED ON scrIssueEdit AND scrProject and must stay
               // identical — a control can only be Selected from its own screen, so there is
               // no shared copy to call. Change one, change the other.
               //
               // NARROW SERVER-SIDE, TEST LOCALLY. The outer Filter uses issue_task_name and
               // issue_status, both INDEXED, so it delegates; issue_type and issue_impact are
               // NOT indexed and are only ever tested against the few rows it returns. Written
               // as one flat Filter the whole query would go non-delegable and silently read a
               // page of the issues list instead of one task's issues.
               //
               // The RAW list, not OpenIssues: that named formula also excludes archived
               // projects, which would drive every task under one to Green rather than leave
               // it alone. This query is already scoped to a single task.
               ClearCollect( colHlWork,
                   ForAll( colHlTasks As t,
                       { Id: t.Id,
                         Hl: With( { iss: Filter( taskmaster_issues,
                                                  issue_task_name.Id = t.Id
                                               && issue_status.Value = "Open" ) },
                                 // AMBER IS THE RESIDUAL — "any other open issue" — NOT the
                                 // four amber types enumerated. Enumerated, a type added in
                                 // SharePoint and not added here falls through to GREEN: an
                                 // allow-list failing CLOSED, silently, on the one signal that
                                 // exists to warn people. As a residual it fails SAFE — an
                                 // unknown or blank type reads Amber, which is visible.
                                 If( CountRows( Filter( iss,
                                         issue_impact.Value = "Critical"
                                      || issue_type.Value = "Blockage"
                                      || issue_type.Value = "Exception"
                                      || issue_type.Value = "Limitation" ) ) > 0, "Red",
                                     CountRows(iss) > 0, "Amber",
                                     "Green" ) ) } ) );
               // WRITE ONLY ON A CHANGE, exactly like project_phase: most issue edits leave
               // the task's health where it was, and a no-op Patch is still a round trip.
               //
               // NO Set() INSIDE THIS ForAll. MS Learn sanctions Patch and Collect as the
               // actions a ForAll body may take, and rules out the functions that HOLD A
               // VARIABLE — UpdateContext, Clear, ClearCollect — because ForAll may run its
               // records in any order and in parallel. Set is the global-scope twin of
               // UpdateContext and Studio rejects it here for the same reason. Patch's
               // return value is not captured either, and deliberately: the same page notes
               // that an uncaptured ForAll result is never built, so there is no per-record
               // data source copy to pay for.
               //
               // A failed health write is NOT worth interrupting a save or a delete for —
               // the next recompute retries it and only a stale colour is wrong meanwhile.
               // IfError is the documented way to catch a Patch failure; the error is
               // DISCARDED on purpose. If it ever needs surfacing, Notify() or a Collect()
               // into a log are the two things this body is allowed to do.
               ForAll( colHlWork As w,
                   With( { tk: LookUp(taskmaster_tasks, ID = w.Id) },
                       If( !IsBlank(tk.ID) && Coalesce(tk.task_status.Value, "") <> w.Hl,
                           IfError( Patch( taskmaster_tasks, tk,
                                           { task_status: { Value: w.Hl } } ),
                                    Blank() ) ) ) )
      - btnPrjRecompute:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Visible: =false
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            X: =0
            Y: =0
            Width: =1
            Height: =1
            OnSelect: |
              =ClearCollect( colProjectTasks,
                  Filter( taskmaster_tasks,
                      task_project_id.Id = gSelProject.ID ) );
              // PHASE IS DERIVED HERE, not chosen by anyone. scrProjectEdit has no phase
              // control; this screen recomputes on open and writes back only on a change.
              //   any OPEN issue                        -> Stalled
              //   any started task, or any transaction  -> Active
              //   any child at all, no started task     -> Planning
              //   nothing attached                      -> Not Started
              // Counted from the QUERY, not from a gallery — a gallery pages as the user
              // scrolls, so its AllItems would make the phase depend on how far someone had
              // scrolled. colProjectTasks is a full ClearCollect, so it is safe to count.
              Set( gPrjOpenIss,
                   CountRows( Filter( taskmaster_issues,
                                      issue_project_id.Id = gSelProject.ID
                                   && issue_status.Value = "Open" ) ) );
              Set( gPrjOpenTasks,
                   CountRows( Filter( colProjectTasks, task_stage.Value <> "Completed" ) ) );
              Set( gPrjDerived,
                   With( { nT: CountRows(colProjectTasks),
                           nStarted: CountRows( Filter(colProjectTasks, task_stage.Value <> "Not Started") ),
                           nX: CountRows( Filter( taskmaster_transactions,
                                                  transaction_project_id.Id = gSelProject.ID ) ),
                           nI: CountRows( Filter( taskmaster_issues,
                                                  issue_project_id.Id = gSelProject.ID ) ) },
                       If( gPrjOpenIss > 0,          "Stalled",
                           nStarted > 0 || nX > 0,   "Active",
                           nT + nX + nI > 0,         "Planning",
                                                     "Not Started" ) ) );
              // COMPLETE AND ARCHIVED ARE TERMINAL. Complete is reachable only through the
              // Mark complete button, and Archived only through the external cleanup flow —
              // the derivation must never drag a project back out of either.
              If( Coalesce(gSelProject.project_phase.Value, "") <> "Complete"
               && Coalesce(gSelProject.project_phase.Value, "") <> "Archived"
               && gPrjDerived <> Coalesce(gSelProject.project_phase.Value, ""),
                  IfError( Set( gPrjPhaseScrap,
                                Patch( taskmaster_projects,
                                       LookUp(taskmaster_projects, ID = gSelProject.ID),
                                       { project_phase: { Value: gPrjDerived } } ) ),
                           // A failed re-phase is not worth interrupting a read-only screen
                           // for: the next open retries it, and nothing downstream is wrong
                           // in the meantime except a stale label.
                           Set( gPrjPhaseErr, FirstError.Message ) );
                  Set( gSelProject, LookUp(taskmaster_projects, ID = gSelProject.ID) ) );
              // WEIGHTED COMPLETION IS DERIVED HERE TOO, for the same reason as the phase
              // above: this screen already holds every task on the project, so the number
              // costs nothing to compute and is always current — whereas the STORED value is
              // only ever as fresh as the last task save whose STAGE MOVED. Saving a task
              // without changing its stage deliberately skips the rollup, so the column can
              // sit stale indefinitely, and it is blank outright on any project untouched
              // since it was recreated. A screen that shows a ring should not depend on that.
              // Written back only on a change, exactly like the phase, so opening a project
              // repairs the stored copy the other screens read.
              Set( gPrjPc,
                   If( CountRows(colProjectTasks) = 0, 0,
                       RoundDown( Average( AddColumns( colProjectTasks, wgt,
                                      Coalesce( LookUp(gStageWeights,
                                                       Stage = task_stage.Value, Weight), 0 ) ),
                                  wgt ), 0 ) ) );
              // HOW MANY TASKS CARRY A STAGE gStageWeights DOES NOT KNOW. Every weight lookup
              // Coalesces a miss to 0, so a stale weights table and a project of genuinely
              // unstarted work produce the SAME 0% and the screen cannot tell them apart.
              // gStageWeights lives in App.OnStart — a formula-bar property no paste carries —
              // so it is the one input to this number that can silently be a version behind.
              // Stated below rather than left to inference; see issue #16.
              Set( gPrjNoWgt,
                   CountRows( Filter( colProjectTasks,
                                      IsBlank( LookUp(gStageWeights, Stage = task_stage.Value, Weight) ) ) ) );
              // The 500 cap matches scrTaskEdit's rollup so the two writers cannot disagree:
              // past it the average is over a truncated fetch, and a wrong number written back
              // is worse than a stale one left alone.
              If( CountRows(colProjectTasks) < 500
               && gPrjPc <> Coalesce(gSelProject.project_perc_completion, -1),
                  IfError( Set( gPrjPcScrap,
                                Patch( taskmaster_projects,
                                       LookUp(taskmaster_projects, ID = gSelProject.ID),
                                       { project_perc_completion: gPrjPc } ) ),
                           Set( gPrjPcErr, FirstError.Message ) );
                  Set( gSelProject, LookUp(taskmaster_projects, ID = gSelProject.ID) ) );
              // NO gProjArchived. It counted this project's individually-archived TASKS, and
              // task_stage has no "Archived" value as of 2026-08-12 — so the query could only
              // ever return 0 and the "N archived (hidden)" caption it fed could never show.
              // Nothing is hidden from the task list any more: it is every task on the project.
