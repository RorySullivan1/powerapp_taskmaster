                                                        & "<circle cx='18' cy='18' r='7' fill='#005A9E'/>",
                                                      "Closed - Resolved",
                                                          "<circle cx='18' cy='18' r='14.5' fill='#31825D'/>"
                                                        & "<path d='M11 18.5 L16 23.5 L25 13.5' fill='none' stroke='#FFFFFF'"
                                                        & " stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/>",
                                                      "Closed - Unresolved",
                                                          "<circle cx='18' cy='18' r='14.5' fill='#C53A3A'/>"
                                                        & "<path d='M12 12 L24 24 M24 12 L12 24' stroke='#FFFFFF'"
                                                        & " stroke-width='3.5' stroke-linecap='round'/>",
                                                      "Closed - No Change",
                                                          "<circle cx='18' cy='18' r='14.5' fill='#6E7882'/>"
                                                        & "<rect x='10' y='16' width='16' height='4' rx='2' fill='#FFFFFF'/>",
                                                          "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'"
                                                        & " stroke-dasharray='4 3'/>"
                                                        & "<text x='18' y='22.5' text-anchor='middle' font-size='13'"
                                                        & " font-family='Segoe UI, sans-serif' fill='#6E7882'>?</text>" ) },
                                                "data:image/svg+xml," & EncodeUrl(
                                                    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'>" & g & "</svg>" )
                                            )
                                    # IMPACT: signal bars, so severity is read from HEIGHT and
                                    # count rather than from colour alone. This is the sort key,
                                    # which is why it sits beside the status mark.
                                    - icoIssImpact:
                                        Control: Image@2.2.3
                                        Properties:
                                          ImagePosition: =ImagePosition.Fit
                                          FillPortions: =0
                                          LayoutMinWidth: =22
                                          Width: =22
                                          Height: =22
                                          Image: |
                                            =With(
                                                { n: Switch( Coalesce(ThisItem.issue_impact.Value, ""),
                                                             "Critical", 4, "High", 3, "Moderate", 2, "Low", 1, 0 ),
                                                  c: Switch( Coalesce(ThisItem.issue_impact.Value, ""),
                                                             "Critical", "#C53A3A", "High", "#D69828",
                                                             "Moderate", "#005A9E", "Low", "#6E7882", "#D5DAE0" ) },
                                                "data:image/svg+xml," & EncodeUrl(
                                                    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'>"
                                                  & "<rect x='4'  y='24' width='6' height='8'  rx='1.5' fill='" & If(n >= 1, c, "#E1E5EB") & "'/>"
                                                  & "<rect x='12' y='19' width='6' height='13' rx='1.5' fill='" & If(n >= 2, c, "#E1E5EB") & "'/>"
                                                  & "<rect x='20' y='13' width='6' height='19' rx='1.5' fill='" & If(n >= 3, c, "#E1E5EB") & "'/>"
                                                  & "<rect x='28' y='6'  width='6' height='26' rx='1.5' fill='" & If(n >= 4, c, "#E1E5EB") & "'/>"
                                                  & "</svg>" )
                                            )
                                    - cellIssName:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =ThisItem.issue_name
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Body
                                          Color: =gTheme.Color.TextPrimary
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =3
                                          LayoutMinWidth: =130
                                          Height: =38
                                    - cellIssLinked:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |
                                            =Coalesce( ThisItem.issue_task_name.Value,
                                                       ThisItem.issue_transaction_name.Value, "—" )
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Small
                                          Color: =gTheme.Color.TextMuted
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =2
                                          LayoutMinWidth: =100
                                          Height: =38
                                    - cellIssType:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =Coalesce(ThisItem.issue_type.Value, "—")
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Small
                                          Color: =gTheme.Color.TextMuted
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =1
                                          LayoutMinWidth: =80
                                          Height: =38
                                    - cellIssDue:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |
                                            =If( IsBlank(ThisItem.issue_date_target), "-",
                                                 With( { d: DateDiff(Today(), ThisItem.issue_date_target, TimeUnit.Days) },
                                                       If( d < 0,  Abs(d) & "d overdue",
                                                           d = 0,  "due today",
                                                           d = 1,  "1d left",
                                                                   d & "d left" ) ) )
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Small
                                          Color: |
                                            =If( !IsBlank(ThisItem.issue_date_target)
                                              && ThisItem.issue_date_target < Today()
                                              && ThisItem.issue_status.Value = "Open",
                                                 gTheme.Color.Danger, gTheme.Color.TextMuted )
                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =2
                                          LayoutMinWidth: =96
                                          Height: =38
                              - rowIssLine:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =gTheme.Color.Border
                                    X: =0
                                    Y: =Parent.TemplateHeight - 1
                                    Width: =Parent.TemplateWidth
                                    Height: =1
                              - galIssuesHit:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: =""
                                    Fill: =RGBA(0, 0, 0, 0)
                                    HoverFill: =gTheme.Color.Hover
                                    PressedFill: =gTheme.Color.Press
                                    BorderThickness: =0
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =Parent.TemplateHeight
                                    # Re-read on the way in — see the transaction row for
                                    # why the live-Filter binding makes this a freshness
                                    # fix rather than an identity one.
                                    OnSelect: |
                                      =Select(Parent);
                                       Set( gEditIssue, LookUp(taskmaster_issues, ID = ThisItem.ID) );
                                       If( IsBlank(gEditIssue.ID),
                                           Notify( "That issue no longer exists — it may have been deleted. Reopen the project to refresh the list.",
                                                   NotificationType.Error ),
                                           Set( gEditMode, "Edit" );
                                           Navigate( scrIssueEdit, ScreenTransition.Cover ) )
