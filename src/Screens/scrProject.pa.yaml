# One project: info card + KPI ring over a work band — tasks and transactions stacked
# left, issues full height right. Containers throughout below the header.
Screens:
  scrProject:
    Properties:
      Fill: =gTheme.Color.Bg
      OnVisible: |
        =ClearCollect( colProjectTasks,
            Filter( taskmaster_tasks,
                task_project_id.Id = gSelProject.ID ) );
        // NO gProjArchived. It counted this project's individually-archived TASKS, and
        // task_stage has no "Archived" value as of 2026-08-12 — so the query could only
        // ever return 0 and the "N archived (hidden)" caption it fed could never show.
        // Nothing is hidden from the task list any more: it is every task on the project.
        // Delete is a TWO-PRESS action and must never open already armed.
        Set( gPrDelArm, false )
    Children:
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Primary
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =gTheme.Space.HeaderH
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="EQD Taskmaster"
            Color: =gTheme.Color.OnPrimary
            Font: =gTheme.Font
            Size: =gTheme.Size.H2
            FontWeight: =FontWeight.Semibold
            VerticalAlign: =VerticalAlign.Middle
            X: =gTheme.Space.Gutter
            Y: =0
            Width: =360
            Height: =gTheme.Space.HeaderH
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =gTheme.Color.OnPrimary
            Tooltip: ="Back to projects"
            X: =Parent.Width - 24 - gTheme.Space.Gutter
            Y: =(gTheme.Space.HeaderH - 24) / 2
            Width: =24
            Height: =24
            OnSelect: =Back()
