                        - icoEditProject:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Icon: =Icon.Edit
                              Color: =gTheme.Color.Primary
                              Tooltip: ="Edit this project"
                              FillPortions: =0
                              LayoutMinHeight: =28
                              Width: =28
                              Height: =28
                              OnSelect: |
                                =Set( gEditMode, "Edit" );
                                 Set( gEditProject, gSelProject );
                                 Navigate( scrProjectEdit, ScreenTransition.Cover )
                        - icoDeleteProject:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Icon: =If( gPrDelArm, Icon.Warning, Icon.Trash )
                              Color: =gTheme.Color.Danger
                              Tooltip: |
                                =If( gPrDelArm,
                                     "Press again to delete this project and everything attached to it",
                                     "Delete this project" )
                              FillPortions: =0
                              LayoutMinHeight: =28
                              Width: =28
                              Height: =28
                              OnSelect: |
                                =If( !gPrDelArm,
                                     Set( gPrDelArm, true ),
                                     Set( gPrDelErr, "" );
                                     // Children FIRST. Every child carries a REQUIRED lookup
                                     // to the project, so removing the parent while they
                                     // exist would leave rows SharePoint will not let
                                     // anything edit afterwards.
                                     //
                                     // Each removal is wrapped in a Set. MS Learn's own idiom
                                     // is IfError( Remove(...), Notify(...) ), but Remove and
                                     // RemoveIf "return the modified data source as a TABLE"
                                     // while Notify and Set return a boolean, and IfError
                                     // requires ALL its arguments to be type-compatible — so
                                     // the documented form is rejected. Four DIFFERENT scrap names: a global's
                                     // type unifies across every Set, so one name holding four
                                     // differently-shaped tables is a type conflict. They exist
                                     // only to make both arms a Set.
                                     //
                                     // RemoveIf is NOT delegable: it pulls matching rows up to the
                                     // data row limit and deletes them one by one. A partial pass
                                     // raises NO error, so without the count first the parent
                                     // would be removed on top of surviving children — and a child
                                     // holding a required lookup to a deleted project cannot be
                                     // edited or deleted by anything afterwards. Count, then refuse
                                     // rather than half-do it. Same shape as the archive cascade.
                                     Set( gPrDelBlock, false );
                                     With( { nI: CountRows( Filter(taskmaster_issues,       issue_project_id.Id       = gSelProject.ID) ),
                                             nX: CountRows( Filter(taskmaster_transactions, transaction_project_id.Id = gSelProject.ID) ),
                                             nT: CountRows( Filter(taskmaster_tasks,        task_project_id.Id        = gSelProject.ID) ) },
                                         If( nI >= 500 || nX >= 500 || nT >= 500,
                                             Set( gPrDelBlock, true ),
                                             IfError( Set( gPrDelScrapI,
                                                           RemoveIf( taskmaster_issues,
                                                                     issue_project_id.Id = gSelProject.ID ) ),
                                                      Set( gPrDelErr, FirstError.Message ) );
                                             IfError( Set( gPrDelScrapX,
                                                           RemoveIf( taskmaster_transactions,
                                                                     transaction_project_id.Id = gSelProject.ID ) ),
                                                      Set( gPrDelErr, FirstError.Message ) );
                                             IfError( Set( gPrDelScrapT,
                                                           RemoveIf( taskmaster_tasks,
                                                                     task_project_id.Id = gSelProject.ID ) ),
                                                      Set( gPrDelErr, FirstError.Message ) ) ) );
                                     If( Len(gPrDelErr) = 0 && !gPrDelBlock,
                                         IfError( Set( gPrDelScrapP,
                                                       Remove( taskmaster_projects, gSelProject ) ),
                                                  Set( gPrDelErr, FirstError.Message ) ) );
                                     If( gPrDelBlock,
                                         Notify( "This project has too many attached items to delete in one pass. Nothing was deleted — ask for the cleanup workflow.",
                                                 NotificationType.Error ),
                                         Len(gPrDelErr) > 0,
                                         // Say that the children may be gone. There is no
                                         // transaction here: by the time the parent fails, the
                                         // child removals have already committed.
                                         Notify( "Couldn't finish deleting the project: " & gPrDelErr
                                                   & " Some attached items may already have been removed — reopen the project to check.",
                                                 NotificationType.Error ),
                                         Set( gSelProject, Blank() );
                                         Set( gEditProject, Blank() );
                                         Clear( colProjectTasks );
                                         Notify( "Project deleted, with everything attached to it.",
                                                 NotificationType.Success );
                                         Navigate( scrProjects, ScreenTransition.UnCover ) );
                                     Set( gPrDelArm, false ) )
                        - lblDelArmed:
