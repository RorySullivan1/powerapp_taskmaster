# One project: info card + KPI ring over a work band — tasks and transactions stacked
# left, issues full height right. Containers throughout below the header.
#
# THREE RULES EVERY GALLERY ROW ON THIS SCREEN OBEYS:
#  1. The delete icon is the row container's LAST auto-layout child and carries NO X
#     and NO Y. An absolute X did not survive a whole-screen paste in either form
#     (user, 2026-08-18), and a child with no X has nothing to lose.
#  2. The row's action lives on a transparent full-template button declared LAST, not
#     on the gallery's OnSelect — a gallery's own OnSelect does not reliably fire when
#     the click lands on a child control.
#  3. That button is TemplateWidth - 46, stopping short of the delete icon's strip, or
#     it sits over the icon and swallows every tap meant for it.
#
# EVERY CHILD COUNT, GALLERY AND TOTAL READS ONE OF THE THREE COLLECTIONS btnPrjRecompute
# folds — colProjectTasks, colProjectTx, colProjectIss. Never a gallery's AllItems (that is
# "what is on screen so far"), and never a fresh Filter of the list: those round trips are
# what the collections exist to remove. Anything that changes a child re-Selects the recompute.
#
# IfError( Remove(...), Notify(...) ) — MS Learn's own idiom — is REJECTED by Studio:
# Remove and ForAll/Patch return a TABLE while Notify and Set return a boolean, and
# IfError requires type-compatible arguments. Hence Set-into-a-scrap on both arms,
# with a DIFFERENT scrap name per call site — a global's type unifies across every
# Set, so one name holding differently-shaped tables is a type conflict.
Screens:
  scrProject:
    Properties:
      Fill: =gTheme.Color.Bg
      # THIN ON PURPOSE. Everything derived from the project's children lives in
      # btnPrjRecompute's OnSelect — four callers, one copy of the block.
      OnVisible: |
        =Set( gPrDelArm, false );
         Set( gDelKind, "" );
         Set( gDelErr, "" );
         Select( btnPrjRecompute )
    Children:
      # =====================================================================
      # THE RECOMPUTE BLOCK — hidden, 1x1, declared FIRST so it can never cover a
      # control (z-order is positional here). Seed colHlTasks, then Select this.
      #
      # IT IS A CONTROL because Power Fx cannot name a behaviour block and this one has
      # four callers; a control's OnSelect is the only reusable behaviour unit there is.
      # Visible:=false IS GROUNDED, not folklore — tests/scrProbeRerun scored Select()
      # on visible, 1x1-transparent and hidden buttons identically (Studio, 2026-08-18).
      # Do not "fix" it into a 1x1 transparent button.
      # It RE-READS colProjectTasks rather than trusting callers to patch the snapshot.
      # =====================================================================
      - btnPrjHealth:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Visible: =false
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            X: =0
            Y: =0
            Width: =1
            Height: =1
            OnSelect: |
              =// Recomputes the STORED half of task health for every task in colHlTasks.
               // The rules, and why OVERDUE IS DELIBERATELY NOT IN HERE, live in one place:
               // rollups.task_health in schema.yaml. Do not restate them at the call sites.
               //
               // THIS BODY IS DUPLICATED ON scrIssueEdit AND scrProject and must stay identical —
               // a control can only be Selected from its own screen. Change one, change the other.
               //
               // NARROW SERVER-SIDE, TEST LOCALLY: the outer Filter uses issue_task_name and
               // issue_status, both INDEXED, so it delegates; issue_type and issue_impact are not
               // indexed and are only tested against the few rows it returns. Written as one flat
               // Filter the whole query goes non-delegable and reads an arbitrary page.
               // The RAW list, not OpenIssues — that named formula also excludes archived projects,
               // which would drive every task under one to Green instead of leaving it alone.
               ClearCollect( colHlWork,
                   ForAll( colHlTasks As t,
                       { Id: t.Id,
                         Hl: With( { iss: Filter( taskmaster_issues,
                                                  issue_task_name.Id = t.Id
                                               && issue_status.Value = "Open" ) },
                                 // AMBER IS THE RESIDUAL — "any other open issue" — NOT the four
                                 // amber types enumerated. Enumerated, a type added in SharePoint and
                                 // not added here falls through to GREEN: an allow-list failing closed,
                                 // silently, on the one signal that exists to warn people.
                                 If( CountRows( Filter( iss,
                                         issue_impact.Value = "Critical"
                                      || issue_type.Value = "Blockage"
                                      || issue_type.Value = "Exception"
                                      || issue_type.Value = "Limitation" ) ) > 0, "Red",
                                     CountRows(iss) > 0, "Amber",
                                     "Green" ) ) } ) );
               // WRITE ONLY ON A CHANGE: most issue edits leave the task's health where it was,
               // and a no-op Patch is still a round trip.
               // NO Set() INSIDE THIS ForAll. MS Learn sanctions Patch and Collect and rules out
               // the functions that HOLD A VARIABLE, because ForAll may run its records in any
               // order; Set is the global twin of UpdateContext and Studio rejects it the same way.
               // Patch's return is not captured either — an uncaptured ForAll result is never
               // built, so there is no per-record data source copy to pay for.
               // A failed health write is not worth interrupting a save for, so IfError discards it;
               // the next recompute retries and only a stale colour is wrong meanwhile.
               ForAll( colHlWork As w,
                   With( { tk: LookUp(taskmaster_tasks, ID = w.Id) },
                       If( !IsBlank(tk.ID) && Coalesce(tk.task_status.Value, "") <> w.Hl,
                           IfError( Patch( taskmaster_tasks, tk,
                                           { task_status: { Value: w.Hl } } ),
                                    Blank() ) ) ) )
      - btnPrjRecompute:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Visible: =false
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            X: =0
            Y: =0
            Width: =1
            Height: =1
            OnSelect: |
              =// ONE FETCH PER CHILD LIST, ISSUED TOGETHER — every count, gallery, title and total
              // on this screen reads these three collections, so nothing below re-queries a list.
              // Concurrent's arms must not share state: three arms, three collections.
              // Each Filter is a delegable = on an indexed FK, so each fetch is one server call.
              Concurrent(
                  ClearCollect( colProjectTasks,
                      Filter( taskmaster_tasks,
                          task_project_id.Id = gSelProject.ID ) ),
                  ClearCollect( colProjectTx,
                      Filter( taskmaster_transactions,
                          transaction_project_id.Id = gSelProject.ID ) ),
                  ClearCollect( colProjectIss,
                      Filter( taskmaster_issues,
                          issue_project_id.Id = gSelProject.ID ) ) );
              // PHASE IS DERIVED HERE, not chosen by anyone — scrProjectEdit has no phase control.
              //   any OPEN issue                        -> Stalled
              //   any started task, or any transaction  -> Active
              //   any child at all, no started task     -> Planning
              //   nothing attached                      -> Not Started
              Set( gPrjOpenIss,
                   CountRows( Filter( colProjectIss, issue_status.Value = "Open" ) ) );
              Set( gPrjOpenTasks,
                   CountRows( Filter( colProjectTasks, task_stage.Value <> "Completed" ) ) );
              Set( gPrjDerived,
                   With( { nT: CountRows(colProjectTasks),
                           nStarted: CountRows( Filter(colProjectTasks, task_stage.Value <> "Not Started") ),
                           nX: CountRows(colProjectTx),
                           nI: CountRows(colProjectIss) },
                       If( gPrjOpenIss > 0,          "Stalled",
                           nStarted > 0 || nX > 0,   "Active",
                           nT + nX + nI > 0,         "Planning",
                                                     "Not Started" ) ) );
              // COMPLETE AND ARCHIVED ARE TERMINAL. Complete is reachable only through the Mark
              // complete button, Archived only through the external cleanup flow — the derivation
              // must never drag a project back out of either.
              If( Coalesce(gSelProject.project_phase.Value, "") <> "Complete"
               && Coalesce(gSelProject.project_phase.Value, "") <> "Archived"
               && gPrjDerived <> Coalesce(gSelProject.project_phase.Value, ""),
                  IfError( Set( gPrjPhaseScrap,
                                Patch( taskmaster_projects,
                                       LookUp(taskmaster_projects, ID = gSelProject.ID),
                                       { project_phase: { Value: gPrjDerived } } ) ),
                           // A failed re-phase is not worth interrupting a read-only screen for.
                           Set( gPrjPhaseErr, FirstError.Message ) );
                  Set( gSelProject, LookUp(taskmaster_projects, ID = gSelProject.ID) ) );
              // DERIVED HERE for the same reason as the phase: the STORED value is only ever as
              // fresh as the last task save whose STAGE MOVED, and is blank outright on an
              // untouched project. Written back on a change, so opening a project repairs the
              // stored copy the other screens read.
              Set( gPrjPc,
                   If( CountRows(colProjectTasks) = 0, 0,
                       RoundDown( Average( AddColumns( colProjectTasks, wgt,
                                      Coalesce( LookUp(gStageWeights,
                                                       Stage = task_stage.Value, Weight), 0 ) ),
                                  wgt ), 0 ) ) );
              // HOW MANY TASKS CARRY A STAGE gStageWeights DOES NOT KNOW. Every weight lookup
              // Coalesces a miss to 0, so a stale weights table and a project of genuinely
              // unstarted work produce the SAME 0%. gStageWeights lives in App.OnStart, a
              // formula-bar property no paste carries — the one input that can be a version behind.
              Set( gPrjNoWgt,
                   CountRows( Filter( colProjectTasks,
                                      IsBlank( LookUp(gStageWeights, Stage = task_stage.Value, Weight) ) ) ) );
              // The 500 cap matches scrTaskEdit's rollup so the two writers cannot disagree:
              // a wrong number written back is worse than a stale one left alone.
              If( CountRows(colProjectTasks) < 500
               && gPrjPc <> Coalesce(gSelProject.project_perc_completion, -1),
                  IfError( Set( gPrjPcScrap,
                                Patch( taskmaster_projects,
                                       LookUp(taskmaster_projects, ID = gSelProject.ID),
                                       { project_perc_completion: gPrjPc } ) ),
                           Set( gPrjPcErr, FirstError.Message ) );
                  Set( gSelProject, LookUp(taskmaster_projects, ID = gSelProject.ID) ) );
