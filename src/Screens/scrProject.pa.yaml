                                    Width: =Parent.Width - 32
                                    Height: =24
                              - galTransactions:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                                  Properties:
                                    Items: |
                                      =Sort( colProjectTx, transaction_date, SortOrder.Descending )
                                    WrapCount: =1
                                    TemplateSize: =52
                                    TemplatePadding: =0
                                    TemplateFill: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    ShowScrollbar: =true
                                    FillPortions: =1
                                    LayoutMinHeight: =104
                                    Width: =Parent.Width - 32
                                    Height: =Parent.Height - 80
                                  Children:
                                    # AUTO-LAYOUT ROW — the columns carry no X.
                                    - rowTxBody:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutGap: =10
                                          PaddingLeft: =8
                                          PaddingRight: =8
                                          X: =0
                                          Y: =0
                                          Width: =Parent.TemplateWidth
                                          Height: =Parent.TemplateHeight - 1
                                        Children:
                                          # DERIVED, NOT STORED. taskmaster_transactions has no status
                                          # column, so this reads booked / today / scheduled off
                                          # transaction_date. Bind to a real status column if one is added.
                                          - icoTxState:
                                              Control: Image@2.2.3
                                              Properties:
                                                ImagePosition: =ImagePosition.Fit
                                                FillPortions: =0
                                                LayoutMinWidth: =24
                                                Width: =24
                                                Height: =24
                                                Image: |
                                                  =With(
                                                      { g: If( IsBlank(ThisItem.transaction_date),
                                                                   "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'"
                                                                 & " stroke-dasharray='4 3'/>"
                                                                 & "<text x='18' y='22.5' text-anchor='middle' font-size='13'"
                                                                 & " font-family='Segoe UI, sans-serif' fill='#6E7882'>?</text>",
                                                               ThisItem.transaction_date < Today(),
                                                                   "<circle cx='18' cy='18' r='14.5' fill='#31825D'/>"
                                                                 & "<path d='M11 18.5 L16 23.5 L25 13.5' fill='none' stroke='#FFFFFF'"
