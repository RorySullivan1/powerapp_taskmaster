                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width
                              Height: =18
            - rowWork:
                Control: GroupContainer@1.5.0
