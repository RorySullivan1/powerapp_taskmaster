                                          Color: =Theme.Color.TextPrimary
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =0
                                          LayoutMinHeight: =22
                                          Width: =Parent.Width
                                          Height: =22
                              - colFact13:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutGap: =2
                                    FillPortions: =1
                                    LayoutMinWidth: =110
                                    Height: =40
                                  Children:
                                    - lblFactCap13:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: ="Target"
                                          Font: =Theme.Font
                                          Size: =Theme.Size.Small
                                          Color: =Theme.Color.TextMuted
                                          FillPortions: =0
                                          LayoutMinHeight: =16
                                          Width: =Parent.Width
                                          Height: =16
                                    - lblFactVal13:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |
                                            =If( IsBlank(gSelProject.project_date_target), "—",
                                            Text(gSelProject.project_date_target, "dd mmm yyyy") )
                                          Font: =Theme.Font
                                          Size: =Theme.Size.Small
                                          FontWeight: =FontWeight.Semibold
                                          Color: =Theme.Color.TextPrimary
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =0
                                          LayoutMinHeight: =22
                                          Width: =Parent.Width
                                          Height: =22
                        - rowFacts2:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =32
                              FillPortions: =0
                              LayoutMinHeight: =40
                              Width: =Parent.Width
                              Height: =40
                            Children:
                              - colFact20:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutGap: =2
                                    FillPortions: =1
                                    LayoutMinWidth: =110
                                    Height: =40
                                  Children:
                                    - lblFactCap20:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: ="Region"
                                          Font: =Theme.Font
                                          Size: =Theme.Size.Small
                                          Color: =Theme.Color.TextMuted
                                          FillPortions: =0
                                          LayoutMinHeight: =16
                                          Width: =Parent.Width
                                          Height: =16
                                    - lblFactVal20:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |
                                            =Coalesce(gSelProject.project_region_path, "—")
                                          Font: =Theme.Font
                                          Size: =Theme.Size.Small
                                          FontWeight: =FontWeight.Semibold
                                          Color: =Theme.Color.TextPrimary
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =0
                                          LayoutMinHeight: =22
                                          Width: =Parent.Width
                                          Height: =22
                              - colFact21:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutGap: =2
                                    FillPortions: =1
                                    LayoutMinWidth: =110
                                    Height: =40
                                  Children:
                                    - lblFactCap21:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: ="Project type"
                                          Font: =Theme.Font
                                          Size: =Theme.Size.Small
                                          Color: =Theme.Color.TextMuted
                                          FillPortions: =0
                                          LayoutMinHeight: =16
                                          Width: =Parent.Width
                                          Height: =16
                                    - lblFactVal21:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |
                                            =Coalesce(gSelProject.project_type_path, "—")
                                          Font: =Theme.Font
                                          Size: =Theme.Size.Small
                                          FontWeight: =FontWeight.Semibold
                                          Color: =Theme.Color.TextPrimary
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =0
                                          LayoutMinHeight: =22
                                          Width: =Parent.Width
                                          Height: =22
                              - colFact22:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutGap: =2
                                    FillPortions: =1
                                    LayoutMinWidth: =110
                                    Height: =40
                                  Children:
                                    - lblFactCap22:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: ="Coverage"
                                          Font: =Theme.Font
                                          Size: =Theme.Size.Small
                                          Color: =Theme.Color.TextMuted
                                          FillPortions: =0
                                          LayoutMinHeight: =16
                                          Width: =Parent.Width
                                          Height: =16
                                    - lblFactVal22:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |
                                            =Coalesce(gSelProject.project_coverage.Value, "—")
                                          Font: =Theme.Font
                                          Size: =Theme.Size.Small
                                          FontWeight: =FontWeight.Semibold
                                          Color: =Theme.Color.TextPrimary
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =0
                                          LayoutMinHeight: =22
                                          Width: =Parent.Width
                                          Height: =22
                              - colFact23:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutGap: =2
                                    FillPortions: =1
                                    LayoutMinWidth: =110
                                    Height: =40
                                  Children:
                                    - lblFactCap23:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: ="Started"
                                          Font: =Theme.Font
                                          Size: =Theme.Size.Small
                                          Color: =Theme.Color.TextMuted
                                          FillPortions: =0
                                          LayoutMinHeight: =16
                                          Width: =Parent.Width
                                          Height: =16
                                    - lblFactVal23:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |
                                            =If( IsBlank(gSelProject.project_date_start), "—",
                                            Text(gSelProject.project_date_start, "dd mmm yyyy") )
                                          Font: =Theme.Font
                                          Size: =Theme.Size.Small
                                          FontWeight: =FontWeight.Semibold
                                          Color: =Theme.Color.TextPrimary
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =0
                                          LayoutMinHeight: =22
                                          Width: =Parent.Width
                                          Height: =22
                  # The ring sits between the facts and the actions, as asked.
                  #
                  # It is WRAPPED because the layout properties belong on the wrapper,
                  # not on the instance: FillPortions and LayoutMinWidth are proven on
                  # GroupContainer but NOT on a CanvasComponent instance, and the
                  # contract check rejects them there. scrProjectEdit's pickers set
                  # only Width/Height for the same reason. Without a pinned wrapper the
                  # ring would default to FillPortions 1 and stretch across the card.
                  - wrapRing:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =0
                        FillPortions: =0
                        LayoutMinWidth: =120
                        Width: =120
                        Height: =120
                      Children:
                        - ringProject:
                            Control: CanvasComponent
                            ComponentName: cmpKpiRing
                            Properties:
                              # The app-side weighted rollup (C3), maintained by scrTaskEdit.
                              Width: =120
                              Height: =120
                              Percent: =Coalesce(gSelProject.project_perc_completion, 0)
                              Label: =Coalesce(gSelProject.project_perc_completion, 0) & "%"
                              AccentHex: ="#005A9E"
                  # Edit and delete, stacked, as icons.
                  - colActions:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =12
                        FillPortions: =0
                        LayoutMinWidth: =44
                        Width: =44
                        Height: =110
                      Children:
                        - icoEditProject:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Icon: =Icon.Edit
                              Color: =Theme.Color.Primary
                              Tooltip: ="Edit this project"
                              FillPortions: =0
                              LayoutMinHeight: =28
                              Width: =28
                              Height: =28
                              OnSelect: |
                                =Set( gEditMode, "Edit" );
                                 Set( gEditProject, gSelProject );
                                 Navigate( scrProjectEdit, ScreenTransition.Cover )
                        # Two presses. The first only ARMS it — the icon changes to a
                        # filled bin and the caption below says so — because there is
                        # no undo behind this. OnVisible disarms, so leaving the screen
                        # is always a way out.
                        - icoDeleteProject:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Icon: =If( gPrDelArm, Icon.Warning, Icon.Trash )
                              Color: =Theme.Color.Danger
                              Tooltip: |
                                =If( gPrDelArm,
                                     "Press again to delete this project and everything attached to it",
                                     "Delete this project" )
                              FillPortions: =0
                              LayoutMinHeight: =28
                              Width: =28
                              Height: =28
                              OnSelect: |
                                =If( !gPrDelArm,
                                     Set( gPrDelArm, true ),
                                     Set( gPrDelErr, "" );
                                     // Children FIRST. Every child carries a REQUIRED lookup
                                     // to the project, so removing the parent while they
                                     // exist would leave rows SharePoint will not let
                                     // anything edit afterwards.
                                     //
                                     // Each removal is wrapped in a Set. MS Learn's own idiom
                                     // is IfError( Remove(...), Notify(...) ), but Remove and
                                     // RemoveIf "return the modified data source as a TABLE"
                                     // while Notify and Set return a boolean, and IfError
                                     // requires ALL its arguments to be type-compatible — so
                                     // the documented form is rejected. gPrDelScrap exists
                                     // only to make both arms a Set.
                                     //
                                     // RemoveIf is NOT delegable: it pulls matching rows up
                                     // to the data row limit and deletes them one by one, so
                                     // a project with more children than that limit needs a
                                     // second press to finish.
                                     IfError( Set( gPrDelScrap,
                                                   RemoveIf( taskmaster_issues,
                                                             issue_project_id.Id = gSelProject.ID ) ),
                                              Set( gPrDelErr, FirstError.Message ) );
                                     IfError( Set( gPrDelScrap,
                                                   RemoveIf( taskmaster_transactions,
                                                             transaction_project_id.Id = gSelProject.ID ) ),
                                              Set( gPrDelErr, FirstError.Message ) );
                                     IfError( Set( gPrDelScrap,
                                                   RemoveIf( taskmaster_tasks,
                                                             task_project_id.Id = gSelProject.ID ) ),
                                              Set( gPrDelErr, FirstError.Message ) );
                                     If( Len(gPrDelErr) = 0,
                                         IfError( Set( gPrDelScrap,
                                                       Remove( taskmaster_projects, gSelProject ) ),
                                                  Set( gPrDelErr, FirstError.Message ) ) );
                                     If( Len(gPrDelErr) > 0,
                                         Notify( "Couldn't delete the project: " & gPrDelErr,
                                                 NotificationType.Error ),
                                         Set( gSelProject, Blank() );
                                         Set( gEditProject, Blank() );
                                         Clear( colProjectTasks );
                                         Notify( "Project deleted, with everything attached to it.",
                                                 NotificationType.Success );
                                         Navigate( scrProjects, ScreenTransition.UnCover ) );
                                     Set( gPrDelArm, false ) )
                        - lblDelArmed:
                            Control: Label@2.5.1
                            Properties:
                              Visible: =gPrDelArm
                              Text: ="again"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.Danger
                              Align: =Align.Center
                              FillPortions: =0
                              LayoutMinHeight: =16
                              Width: =Parent.Width
                              Height: =16
            # -------------------------------------------------------------
            # 2 + 3. WORK BAND — tasks/transactions stacked on the left,
            #        issues full height on the right.
            # -------------------------------------------------------------
            - rowWork:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =Theme.Space.Gap
                  FillPortions: =1
                  LayoutMinHeight: =320
                  Width: =Parent.Width - 48
                  Height: =Parent.Height - 48 - 172 - Theme.Space.Gap
                Children:
                  - colLists:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =Theme.Space.Gap
                        FillPortions: =3
                        LayoutMinWidth: =520
                        Height: =Parent.Height
                      Children:
                        - secTasks:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =8
                              PaddingTop: =12
                              PaddingBottom: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                              Fill: =Theme.Color.Surface
                              BorderColor: =Theme.Color.Border
                              BorderThickness: =1
                              FillPortions: =1
                              LayoutMinHeight: =160
                              Width: =Parent.Width
                              Height: =(Parent.Height - Theme.Space.Gap) / 2
                            Children:
                              # Title and the New button on ONE line, as asked.
                              - rowTasksHead:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =12
                                    FillPortions: =0
                                    LayoutMinHeight: =40
                                    Width: =Parent.Width - 32
                                    Height: =40
                                  Children:
                                    - lblTasksTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |
                                            ="Tasks   " & CountRows( Filter(colProjectTasks, task_stage.Value = "Complete") )
                                            & " of " & CountRows(colProjectTasks) & " complete"
                                          Font: =Theme.Font
                                          Size: =Theme.Size.H3
                                          FontWeight: =FontWeight.Semibold
                                          Color: =Theme.Color.Primary
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =1
                                          LayoutMinWidth: =160
                                          Height: =32
                                    - btnNewTask:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          Fill: =Theme.Color.Surface
                                          Color: =Theme.Color.Primary
                                          BorderColor: =Theme.Color.Primary
                                          BorderThickness: =1
                                          Font: =Theme.Font
                                          Size: =Theme.Size.Body
                                          Text: ="+  New task"
                                          FillPortions: =0
                                          LayoutMinWidth: =160
                                          Width: =160
                                          Height: =36
                                          OnSelect: |
                                            =Set( gEditMode, "New" );
                                            Navigate( scrTaskEdit, ScreenTransition.Cover )
                              - lblTasksEmpty:
                                  Control: Label@2.5.1
                                  Properties:
