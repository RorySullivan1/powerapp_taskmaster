                                          Size: =gTheme.Size.H3
                                          FontWeight: =FontWeight.Semibold
                                          Color: =gTheme.Color.Primary
                                          VerticalAlign: =VerticalAlign.Middle
                                          FillPortions: =1
                                          LayoutMinWidth: =160
                                          Height: =32
                                    - btnNewTask:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          Visible: =Coalesce(gSelProject.project_phase.Value, "") <> "Archived"
                                          Fill: =gTheme.Color.Surface
                                          Color: =gTheme.Color.Primary
                                          BorderColor: =gTheme.Color.Primary
                                          BorderThickness: =1
                                          Font: =gTheme.Font
                                          Size: =gTheme.Size.Body
                                          Text: ="+  New task"
                                          FillPortions: =0
                                          LayoutMinWidth: =160
                                          Width: =160
                                          Height: =36
                                          OnSelect: |
                                            =Set( gEditMode, "New" );
                                            Navigate( scrTaskEdit, ScreenTransition.Cover )
                              - lblTasksEmpty:
                                  Control: Label@2.5.1
                                  Properties:
                                    Visible: =CountRows(galTasks.AllItems) = 0
                                    Text: ="No tasks on this project yet."
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextMuted
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinHeight: =24
                                    Width: =Parent.Width - 32
                                    Height: =24
                              - galTasks:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                                  Properties:
                                    # ONE composite sort key, not two chained Sorts — Power Fx does not
                                    # guarantee a stable sort. priority * 100000 dominates, the day count
                                    # breaks ties, and +50000 keeps an overdue (negative) count positive.
                                    Items: |
                                      =Sort( colProjectTasks,
                                             Switch( task_priority.Value,
                                                     "Critical", 1, "High", 2,
                                                     "Moderate", 3, "Low", 4, 5 ) * 100000
                                             + If( IsBlank(task_date_target), 99999,
                                                   DateDiff(Today(), task_date_target, TimeUnit.Days) + 50000 ) )
                                    WrapCount: =1
                                    TemplateSize: =52
                                    TemplatePadding: =0
                                    TemplateFill: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    ShowScrollbar: =true
                                    FillPortions: =1
                                    LayoutMinHeight: =104
                                    Width: =Parent.Width - 32
                                    Height: =Parent.Height - 80
                                  Children:
                                    # AUTO-LAYOUT ROW. The columns carry no X, so they cannot overlap
                                    # at any TemplateWidth.
                                    - rowTaskBody:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutGap: =10
                                          PaddingLeft: =8
                                          PaddingRight: =8
                                          X: =0
                                          Y: =0
                                          Width: =Parent.TemplateWidth
                                          Height: =Parent.TemplateHeight - 1
                                        Children:
                                          # LIFECYCLE glyph, bound to task_stage. task_status is a separate
                                          # RAG health column and is NOT what this shows.
                                          - icoTaskStage:
                                              Control: Image@2.2.3
                                              Properties:
                                                ImagePosition: =ImagePosition.Fit
                                                FillPortions: =0
                                                LayoutMinWidth: =24
                                                Width: =24
                                                Height: =24
                                                Image: |
                                                  =With(
                                                      { g: Switch( Coalesce(ThisItem.task_stage.Value, ""),
                                                            "Not Started",
                                                                "<circle cx='18' cy='18' r='13' fill='none' stroke='#B9C0C8' stroke-width='2.5'/>",
                                                            "Planning",
                                                                "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'/>"
                                                              & "<circle cx='12.5' cy='18' r='1.7' fill='#6E7882'/>"
                                                              & "<circle cx='18'   cy='18' r='1.7' fill='#6E7882'/>"
                                                              & "<circle cx='23.5' cy='18' r='1.7' fill='#6E7882'/>",
                                                            "Drafting",
                                                                "<circle cx='18' cy='18' r='13' fill='none' stroke='#005A9E' stroke-width='3'/>"
                                                              & "<circle cx='18' cy='18' r='5' fill='#005A9E'/>",
                                                            "Finalizing",
                                                                "<circle cx='18' cy='18' r='13' fill='none' stroke='#D69828' stroke-width='3'/>"
                                                              & "<circle cx='18' cy='18' r='9' fill='#D69828'/>",
                                                            "Completed",
                                                                "<circle cx='18' cy='18' r='14.5' fill='#31825D'/>"
                                                              & "<path d='M11 18.5 L16 23.5 L25 13.5' fill='none' stroke='#FFFFFF'"
                                                              & " stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/>",
                                                                "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'"
                                                              & " stroke-dasharray='4 3'/>"
                                                              & "<text x='18' y='22.5' text-anchor='middle' font-size='13'"
                                                              & " font-family='Segoe UI, sans-serif' fill='#6E7882'>?</text>" ) },
                                                      "data:image/svg+xml," & EncodeUrl(
                                                          "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'>" & g & "</svg>" )
                                                  )
                                          - cellTaskName:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =ThisItem.task_name
                                                Font: =gTheme.Font
                                                Size: =gTheme.Size.Body
                                                Color: =gTheme.Color.TextPrimary
                                                VerticalAlign: =VerticalAlign.Middle
                                                FillPortions: =3
                                                LayoutMinWidth: =140
                                                Height: =44
                                          - cellTaskWho:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =Coalesce(ThisItem.task_lead.DisplayName, "Unassigned")
                                                Font: =gTheme.Font
                                                Size: =gTheme.Size.Small
                                                Color: =gTheme.Color.TextMuted
                                                VerticalAlign: =VerticalAlign.Middle
                                                FillPortions: =2
                                                LayoutMinWidth: =110
                                                Height: =44
                                          - cellTaskPriority:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =Coalesce(ThisItem.task_priority.Value, "—")
                                                Font: =gTheme.Font
                                                FontWeight: =FontWeight.Semibold
                                                Size: =gTheme.Size.Small
                                                Color: |
                                                  =Switch( ThisItem.task_priority.Value,
                                                           "Critical", gTheme.Color.Danger,
                                                           "High",     gTheme.Color.Warning,
                                                           "Moderate", gTheme.Color.Primary,
                                                                       gTheme.Color.TextMuted )
                                                VerticalAlign: =VerticalAlign.Middle
                                                FillPortions: =1
                                                LayoutMinWidth: =70
                                                Height: =44
                                          - cellTaskDue:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: |
                                                  =If( IsBlank(ThisItem.task_date_target), "-",
                                                       With( { d: DateDiff(Today(), ThisItem.task_date_target, TimeUnit.Days) },
                                                             If( d < 0,  Abs(d) & "d overdue",
                                                                 d = 0,  "due today",
                                                                 d = 1,  "1d left",
                                                                         d & "d left" ) ) )
                                                Font: =gTheme.Font
                                                Size: =gTheme.Size.Small
                                                Color: |
                                                  =If( !IsBlank(ThisItem.task_date_target)
                                                    && ThisItem.task_date_target < Today()
                                                    && ThisItem.task_stage.Value <> "Completed",
                                                       gTheme.Color.Danger, gTheme.Color.TextMuted )
                                                Align: =Align.Right
                                                VerticalAlign: =VerticalAlign.Middle
                                                FillPortions: =2
                                                LayoutMinWidth: =96
                                                Height: =44
                                          - icoDelTask:
                                              Control: Classic/Icon@2.5.0
                                              Properties:
                                                Icon: =Icon.Trash
                                                Color: =gTheme.Color.Danger
                                                HoverColor: =gTheme.Color.Danger
                                                HoverFill: =RGBA(197, 58, 58, 0.08)
                                                HoverBorderColor: =RGBA(0, 0, 0, 0)
                                                Tooltip: ="Delete this task"
                                                FillPortions: =0
                                                LayoutMinWidth: =24
                                                Width: =24
                                                Height: =24
                                                OnSelect: |
                                                  =Set( gDelKind, "Task" );
                                                   Set( gDelId, ThisItem.ID );
                                                   Set( gDelName, ThisItem.task_name );
                                                   Set( gDelRefs, CountRows( Filter(taskmaster_issues, issue_task_name.Id = ThisItem.ID) ) )
                                    - rowTasksLine:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          Fill: =gTheme.Color.Border
                                          X: =0
                                          Y: =Parent.TemplateHeight - 1
                                          Width: =Parent.TemplateWidth
                                          Height: =1
                                    - galTasksHit:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          Text: =""
                                          Fill: =RGBA(0, 0, 0, 0)
                                          HoverFill: =gTheme.Color.Hover
                                          PressedFill: =gTheme.Color.Press
                                          BorderThickness: =0
                                          X: =0
                                          Y: =0
                                          Width: =Parent.TemplateWidth - 46
                                          Height: =Parent.TemplateHeight
                                          # LookUp, not ThisItem: colProjectTasks is a snapshot
