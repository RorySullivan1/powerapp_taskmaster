# =============================================================================
# scrAdmin  —  Admin (screen-map §9). CORE-SHELL: header + nav + titled
# placeholder. Phase 2/3 wires tmLookups maintenance, bulk archive, orphan
# detection (FK integrity is app logic — no real joins on SharePoint).
# DIALECT: modern structured schema; positional z-order. Header + nav are one
# component (cmpAppBar), declared LAST so the fly-out floats over the content.
# =============================================================================
Screens:
  scrAdmin:
    Properties:
      Fill: =Theme.Color.Bg
    Children:
      # ---- Content placeholder --------------------------------------------
      - AdminEmpty:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Surface
            Height: =Parent.Height - Theme.Space.HeaderH - (Theme.Space.Gutter * 2)
            Width: =Parent.Width - (Theme.Space.Gutter * 2)
            X: =Theme.Space.Gutter
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter
      # ---- Reference data ---------------------------------------------------
      # scrClientEdit and scrProductEdit are reachable from EXACTLY two places:
      # here, and cmpRecordPicker's "＋ New". They are deliberately NOT in
      # NavMenu — reference data is something you maintain, not somewhere you
      # browse to. Both are opened in New mode with an EMPTY return contract, so
      # the save just comes back here rather than filling a caller's field.
      - lblAdminRefHead:
          Control: Label@2.5.1
          Properties:
            Text: ="Reference data"
            Font: =Theme.Font
            Size: =Theme.Size.H3
            FontWeight: =FontWeight.Semibold
            Color: =Theme.Color.TextPrimary
            VerticalAlign: =VerticalAlign.Middle
            X: =Theme.Space.Gutter * 2
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter * 2
            Width: =400
            Height: =28
      - btnAdminNewClient:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="＋  New client"
            Fill: =Theme.Color.Primary
            Color: =Theme.Color.OnPrimary
            BorderColor: =Theme.Color.Primary
            BorderThickness: =0
            Font: =Theme.Font
            Size: =Theme.Size.Body
            X: =Theme.Space.Gutter * 2
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter * 2 + 40
            Width: =180
            Height: =44
            OnSelect: |
              =Set( gEditMode, "New" );
               Set( gClReturn, "" );
               Navigate( scrClientEdit, ScreenTransition.Cover )
      - btnAdminNewProduct:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="＋  New product"
            Fill: =Theme.Color.Primary
            Color: =Theme.Color.OnPrimary
            BorderColor: =Theme.Color.Primary
            BorderThickness: =0
            Font: =Theme.Font
            Size: =Theme.Size.Body
            X: =Theme.Space.Gutter * 2 + 180 + 12
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter * 2 + 40
            Width: =180
            Height: =44
            OnSelect: |
              =Set( gEditMode, "New" );
               Set( gPdReturn, "" );
               Navigate( scrProductEdit, ScreenTransition.Cover )
      - AdminEmptyLabel:
          Control: Label@2.5.1
          Properties:
            Text: ="Bulk archive and orphan detection will live here (Phase 2/3)."
            Font: =Theme.Font
            Size: =Theme.Size.Body
            Color: =Theme.Color.TextMuted
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            # Plain arithmetic, not `AdminEmpty.X`. Positioning off a sibling is
            # evaluated mid-paste, when that sibling may not be where it ends up,
            # and freezes wrong — see the NOTE in validate_pa_yaml.py.
            X: =Theme.Space.Gutter
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter + 160
            Width: =Parent.Width - (Theme.Space.Gutter * 2)
            Height: =Parent.Height - Theme.Space.HeaderH - (Theme.Space.Gutter * 2) - 160
      # ---- The whole shell is one component: header bar + fly-out nav rail ----
      # DECLARED LAST so positional z-order floats the fly-out over the content.
      #
      # Height is dynamic and that is the whole trick: a component intercepts every
      # click inside its bounds, so closed it must own nothing but the 64px header
      # strip. Open, covering the screen is exactly right — the scrim wants the click.
      #
      # cmpAppBar cannot Navigate (a component can't see app screens), so it reports
      # the chosen entry and this screen does the navigating.
      - appBar:
          Control: CanvasComponent
          ComponentName: cmpAppBar
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =If(gNavOpen, Parent.Height, Theme.Space.HeaderH)
            Items: =NavMenu
            ActiveKey: =5
            HasLicence: =gHasPowerBiLicence
            AppTitle: ="EQD Taskmaster"
            ScreenTitle: ="Admin"
            IsOpen: =gNavOpen
            OnToggle: =Set(gNavOpen, !gNavOpen)
            OnNavigate: |
              =Switch( appBar.SelectedKey,
                       1, Navigate(scrHome, ScreenTransition.Fade),
                       2, Navigate(scrReports, ScreenTransition.Fade),
                       3, Navigate(scrProjects, ScreenTransition.Fade),
                       4, Navigate(scrReference, ScreenTransition.Fade),
                          Navigate(scrAdmin, ScreenTransition.Fade) );
              Set(gNavOpen, false)
