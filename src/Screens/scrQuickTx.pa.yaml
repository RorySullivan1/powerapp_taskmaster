                                       Set( gQtPicker, "Client" );
                                       Reset( cmpQtPick );
                                       Set( gQtQuery, "" )
                              # ALWAYS VISIBLE, painted transparent when there is nothing to clear:
                              # a hidden auto-layout child gives its width away, which would pull
