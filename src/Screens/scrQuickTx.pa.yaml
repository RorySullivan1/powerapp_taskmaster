                                    HoverColor: =If( ThisItem.q_productId > 0, gTheme.Color.Danger, RGBA(0, 0, 0, 0) )
                                    HoverFill: =RGBA(0, 0, 0, 0)
                                    HoverBorderColor: =RGBA(0, 0, 0, 0)
