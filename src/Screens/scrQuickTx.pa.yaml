                              # Sales owner goes through the screen's ONE picker, like client and
                              # product. Optional.
                              - btnQtRowSales:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: =If( Len(ThisItem.q_salesMail) > 0, ThisItem.q_salesName, "＋  Sales owner" )
                                    Align: =Align.Left
                                    Fill: =gTheme.Color.Bg
                                    Color: =If( Len(ThisItem.q_salesMail) > 0, gTheme.Color.TextPrimary, gTheme.Color.TextMuted )
                                    HoverFill: =gTheme.Color.Hover
                                    PressedFill: =gTheme.Color.Press
                                    BorderColor: =gTheme.Color.Border
                                    BorderThickness: =1
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    FillPortions: =2
                                    LayoutMinWidth: =120
                                    Height: =36
                                    OnSelect: |
                                      =Set( gQtPickRow, ThisItem.q_rid );
                                       Set( gQtPicker, "Sales" );
                                       Reset( cmpQtPick );
                                       Set( gQtQuery, "" )
                              # ALWAYS VISIBLE, transparent when empty — see icoQtRowClientClr.
                              - icoQtRowSalesClr:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Icon: =Icon.Cancel
                                    Color: =If( Len(ThisItem.q_salesMail) > 0, gTheme.Color.TextMuted, RGBA(0, 0, 0, 0) )
                                    HoverColor: =If( Len(ThisItem.q_salesMail) > 0, gTheme.Color.Danger, RGBA(0, 0, 0, 0) )
                                    HoverFill: =RGBA(0, 0, 0, 0)
                                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                                    Tooltip: ="Clear the sales owner"
                                    FillPortions: =0
                                    LayoutMinWidth: =16
                                    Width: =16
                                    Height: =16
                                    OnSelect: |
                                      =Patch( colQtRows, LookUp( colQtRows, q_rid = ThisItem.q_rid ),
                                              { q_salesName: "", q_salesMail: "" } )
                              # THE OUTPUT LIVES ON THE ROW (q_hasOut, q_o*) and is edited only in
                              # the pop-up. Opening it seeds the pop-up's globals from this row and
                              # Resets its inputs, which re-read their defaults only on Reset.
                              # gQtORowName / gQtORowDate are what the row shows NOW; mdQtOOk
                              # compares against them to decide whether the name and date follow
                              # the row (stored empty) or were chosen in the pop-up.
                              - btnQtRowOutput:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: =If( ThisItem.q_hasOut, "✓  " & ThisItem.q_oFmt, "＋  Output" )
                                    Align: =Align.Left
                                    Fill: =gTheme.Color.Bg
                                    Color: =If( ThisItem.q_hasOut, gTheme.Color.TextPrimary, gTheme.Color.TextMuted )
                                    HoverFill: =gTheme.Color.Hover
                                    PressedFill: =gTheme.Color.Press
                                    BorderColor: =gTheme.Color.Border
                                    BorderThickness: =1
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    FillPortions: =0
                                    LayoutMinWidth: =110
                                    Width: =110
                                    Height: =36
                                    OnSelect: |
                                      =// What the row SHOWS (its sibling inputs), not ThisItem: a label typed
                                       // just now may not have blurred into the row yet.
                                       // NO PER-FIELD If ON q_hasOut: a row without an output already holds
                                       // the empty output fields (gQtBlankRow), so the row's values ARE the
                                       // pop-up's defaults. Only q_oDate, a type seed on such a row, is gated.
                                       If( !gSaving,
                                           With( { rowName: Trim(txtQtRowName.Text),
                                                   rowDate: Coalesce( dtpQtRowDate.SelectedDate, Today() ) },
                                               Set( gQtOutRow,   ThisItem.q_rid );
                                               Set( gQtOHad,     ThisItem.q_hasOut );
                                               Set( gQtORowName, rowName );
                                               Set( gQtORowDate, rowDate );
                                               Set( gQtOName,    Coalesce( ThisItem.q_oName, rowName ) );
                                               Set( gQtODate,    Coalesce( If( ThisItem.q_hasOut, ThisItem.q_oDate ), rowDate ) );
                                               Set( gQtOFmt,     ThisItem.q_oFmt );
                                               Set( gQtOAud,     ThisItem.q_oAud );
                                               Set( gQtOLang,    ThisItem.q_oLang );
                                               Set( gQtOBrand,   ThisItem.q_oBrand );
                                               Set( gQtOFlag,    ThisItem.q_oFlag );
                                               Set( gQtOAppr,    ThisItem.q_oAppr ) );
                                           Reset( txtQtOName ); Reset( dtpQtODate );
                                           Reset( cboQtOFmt ); Reset( cboQtOAud );
                                           Reset( cboQtOLang ); Reset( cboQtOBrand );
                                           Reset( tglQtOFlag ); Reset( txtQtOAppr );
                                           Set( gQtOutOpen, true ) )
                              # Ignored while a save is in flight: the save removes rows by q_rid
                              # when it finishes.
                              - icoQtRowDel:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Icon: =Icon.Trash
                                    Color: =gTheme.Color.TextMuted
                                    HoverColor: =gTheme.Color.Danger
                                    HoverFill: =RGBA(0, 0, 0, 0)
                                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                                    Tooltip: ="Remove this row"
                                    FillPortions: =0
                                    LayoutMinWidth: =20
                                    Width: =20
                                    Height: =20
                                    OnSelect: |
                                      =If( !gSaving, RemoveIf( colQtRows, q_rid = ThisItem.q_rid ) )
                        - rctQtRowLine:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =gTheme.Color.Border
                              X: =0
                              Y: =Parent.TemplateHeight - 1
                              Width: =Parent.TemplateWidth
                              Height: =1
            - rowQtAdd:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =12
                  Width: =Parent.Width - 48
                  Height: =36
                Children:
                  # COPIES the last row's date, currency, client, product and sales owner;
                  # label, notional and output start empty. Ignored while a save is in flight, because a full
                  # success replaces the rows.
                  - btnQtAddRow:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="+  Add row"
                        Fill: =gTheme.Color.Surface
                        Color: =gTheme.Color.Primary
                        HoverFill: =gTheme.Color.Hover
                        PressedFill: =gTheme.Color.Press
                        BorderColor: =gTheme.Color.Primary
                        BorderThickness: =1
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Body
                        FillPortions: =0
                        LayoutMinWidth: =160
                        Width: =160
                        Height: =36
                        OnSelect: |
                          =If( !gSaving,
                               With( { last: Last(colQtRows) },
                                   Collect( colQtRows,
                                       Patch( gQtBlankRow,
                                           { q_rid:          If( IsEmpty(colQtRows), 1, Max(colQtRows, q_rid) + 1 ),
                                             q_date:         Coalesce( last.q_date, Today() ),
                                             q_ccy:          Coalesce( last.q_ccy, "USD" ),
                                             q_clientId:     Coalesce( last.q_clientId, 0 ),
                                             q_clientValue:  Coalesce( last.q_clientValue, "" ),
                                             q_productId:    Coalesce( last.q_productId, 0 ),
                                             q_productValue: Coalesce( last.q_productValue, "" ),
                                             q_salesName:    Coalesce( last.q_salesName, "" ),
                                             q_salesMail:    Coalesce( last.q_salesMail, "" ) } ) ) ) )
                  - lblQtAddHint:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="A new row copies the date, currency, client, product and sales owner of the row above it."
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =1
                        LayoutMinWidth: =200
                        Height: =36
      - rctQtActionBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            BorderColor: =gTheme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
      # 854 + 12 + 140 + 12 + 300 + 48 padding = 1366.
      - rowQtAction:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
          Children:
            # ONE SOURCE OF TRUTH FOR "what is still missing", and it is this Text. The prefix
            # sits INSIDE the If so `Len(Self.Text) = 0` is exactly "nothing missing" — the
            # save handler tests that and does not restate the rules.
            - lblQtMissing:
                Control: Label@2.5.1
                Properties:
                  Visible: =Len(Self.Text) > 0
                  Text: |
                    =With(
                       { mProj: Concat( Filter( Table(
                              { L: "Project",         M: gQtMode = "Existing" && gQtProject.Id <= 0 },
                              { L: "Project Name",    M: gQtMode = "New" && Len(Trim(txtQtPrName.Text)) = 0 },
                              { L: "Project Manager", M: gQtMode = "New" && Len(gQtManager.Mail) = 0 },
                              { L: "Region",          M: gQtMode = "New" && Len(gQtRegionPath) = 0 },
                              { L: "Project Type",    M: gQtMode = "New" && Len(gQtTypePath) = 0 },
                              // Reachable only if Choices() came back empty — {Value: ""} would lose the insert.
                              { L: "Coverage",        M: gQtMode = "New" && Len(gQtCov) = 0 },
                              { L: "Transactions",    M: IsEmpty(colQtRows) } ),
                            M ), L, " | " ),
                         mRows: Concat( Filter(
                              ForAll( colQtRows As r,
                                  // No output rule: the output pop-up validates its own fields, so
                                  // a row's output is either complete (q_hasOut) or absent.
                                  With( { bad: Concat( Filter( Table(
                                              { L: "Label",      M: Len(Trim(r.q_name)) = 0 },
                                              { L: "Trade Date", M: IsBlank(r.q_date) },
                                              { L: "Currency",   M: Len(r.q_ccy) = 0 },
                                              // A VALIDITY test, not a missing-field one: the notional is
                                              // optional, so only an entry that will not parse fires it.
                                              { L: "Notional",   M: Len(Trim(r.q_notional)) > 0 && IsBlank(Value(r.q_notional)) } ),
                                            M ), L, ", " ) },
                                      { Msg: If( Len(bad) > 0,
                                                 "Row " & CountRows( Filter(colQtRows, q_rid <= r.q_rid) ) & " " & bad,
                                                 "" ) } ) ),
                              Len(Msg) > 0 ), Msg, " | " ) },
                       With( { m: mProj & If( Len(mProj) > 0 && Len(mRows) > 0, " | ", "" ) & mRows },
                             If( Len(m) > 0, "Required Fields Remaining: " & m, "" ) ) )
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.Danger
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.Width - 512
                  Height: =48
            - btnQtCancel:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =gTheme.Color.Surface
                  Color: =gTheme.Color.Primary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =1
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Text: ="Cancel"
                  Width: =140
                  Height: =48
                  OnSelect: =If( gQtFrom = "Projects", Navigate( scrProjects, ScreenTransition.UnCover ),
                                 Navigate( scrHome, ScreenTransition.UnCover ) )
            # ALWAYS ENABLED — a disabled button cannot say why. The rules live in lblQtMissing.
            # Order: project (insert + re-read when New) -> rows -> outcome. Once a new project
            # exists the screen switches to Existing with it picked, WHATEVER the rows did, so a
            # retry can never insert the project twice.
            - btnQtSave:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =gTheme.Color.Primary
                  Color: =gTheme.Color.OnPrimary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =0
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Text: |
                    =If( gSaving, "Saving…",
                         "Save " & CountRows(colQtRows) & If( CountRows(colQtRows) = 1, " transaction", " transactions" ) &
                         If( gQtMode = "New", " + project", "" ) )
                  Width: =300
                  Height: =48
                  OnSelect: |
                    =// SAVE WHAT IS ON SCREEN. Each row input writes itself to colQtRows on OnChange,
                    // but a value typed just before pressing Save may not have committed yet, and a
                    // reused gallery row can show a date or currency its record no longer holds
                    // (the combobox and date picker re-read their defaults only on Reset). So the
                    // visible values are copied back first. AllItems is complete here: the gallery
                    // is bound to a local collection, not a paged data source.
                    // The output is not copied: it has no control in the row, and the pop-up writes
                    // it to colQtRows directly.
                    If( !gSaving,
                        ClearCollect( colQtSync,
                            ForAll( galQtRows.AllItems As g,
                                { s_rid:  g.q_rid,
                                  s_name: g.txtQtRowName.Text,
                                  s_date: g.dtpQtRowDate.SelectedDate,
                                  s_not:  g.numQtRowNotional.Text,
                                  s_ccy:  g.cboQtRowCcy.Selected.Value } ) );
                        ForAll( colQtSync As s,
                            Patch( colQtRows, LookUp( colQtRows, q_rid = s.s_rid ),
                                   { q_name: s.s_name, q_date: s.s_date,
                                     q_notional: s.s_not, q_ccy: s.s_ccy } ) ) );
                    If( gSaving,
                    // A SECOND TAP WHILE THE FIRST WRITE IS STILL IN FLIGHT. Do nothing — the button
                    // stays live during a Patch, and a double-tap ran the handler twice.
                    false,
                    Len(lblQtMissing.Text) > 0,
                    Notify( "Can't save yet. " & lblQtMissing.Text, NotificationType.Error ),
                    Set( gSaving, true );
                    Set( gQtWasNew, gQtMode = "New" );
                    // The values the fresh row inherits after a full success. Taken now: a full
                    // success empties colQtRows before the new row is built.
                    Set( gQtCarry, Last(colQtRows) );
                    Set( gQtErr, "" );
                    Set( gQtPrSaved, Blank() );
                    Set( gQtPid,   If( gQtWasNew, 0, gQtProject.Id ) );
                    Set( gQtPname, If( gQtWasNew, Trim(txtQtPrName.Text), gQtProject.Value ) );
                    Set( gQtArchived, false );
                    Clear( colQtResult );
                    Clear( colQtOutResult );
                    Set( gQtOutOkN, 0 );
                    Set( gQtOutFailN, 0 );
                    // --- 1. the project ----------------------------------------------------
                    If( gQtWasNew,
                        // The INSERT half of scrProjectEdit's Patch, for the columns this form owns.
                        // project_perc_completion's initial 0 is written here rather than by a
                        // second rollup write: a new project has no tasks, so the rollup is 0.
                        IfError(
                            Set( gQtPrSaved,
                                Patch( taskmaster_projects, Defaults(taskmaster_projects),
                                    { project_name:            Trim(txtQtPrName.Text),
                                      project_phase:           { Value: "Not Started" },
                                      project_priority:        { Value: gQtPriority },
                                      project_manager:
                                          { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                            Claims:      gClaimPrefix & Lower(gQtManager.Mail),
                                            DisplayName: gQtManager.DisplayName,
                                            Email:       gQtManager.Mail,
                                            Department: "", JobTitle: "", Picture: "" },
                                      project_region_id:       gQtRegionId,
                                      project_region_path:     gQtRegionPath,
                                      project_type_id:         gQtTypeId,
                                      project_type_path:       gQtTypePath,
                                      project_coverage:        { Value: gQtCov },
                                      project_perc_completion: 0 } ) ),
                            Set( gQtErr, FirstError.Message ) );
                        // TRUST THE RECORD, NEVER THE MESSAGE: a write can fail and leave
                        // FirstError.Message empty.
                        If( IsBlank(gQtPrSaved.ID) && Len(gQtErr) = 0,
                            Set( gQtErr, "SharePoint returned no record and no error message, so nothing was saved. Check the required columns on taskmaster_projects." ) );
                        If( Len(gQtErr) = 0,
                            // Read it back by ID — Patch's return is not guaranteed to carry every column.
                            Set( gQtPrRead, LookUp( taskmaster_projects, ID = gQtPrSaved.ID ) );
                            If( IsBlank(gQtPrRead.ID), Set( gQtPrRead, gQtPrSaved ) );
                            Set( gQtPid,   gQtPrRead.ID );
                            Set( gQtPname, gQtPrRead.project_name );
                            Set( gQtProject, { Id: gQtPid, Value: gQtPname } );
                            Set( gQtMode, "Existing" );
                            Select( btnQtSeedNew ) ),
                        // Read LIVE: the picked project may have been archived since it was listed.
                        Set( gQtArchived,
                             Coalesce( LookUp( taskmaster_projects, ID = gQtPid, project_phase.Value ), "" ) = "Archived" ) );
                    If( Len(gQtErr) > 0,
                        Notify( "Couldn't create the project: " & gQtErr, NotificationType.Error ),
                        // --- 2. the rows ---------------------------------------------------
                        // Collect, never Set, inside ForAll. res is the new row's ID as text, or
                        // "!" + the reason; an empty res is a write that returned no record, which
                        // counts as a failure. ONE text value because IfError's arms must agree on
                        // type. Message "" means written; TxId carries the ID for the row's output.
                        // NEVER NAME transaction_comment HERE: the column may not exist yet, and a
                        // write naming a missing column fails the whole row.
                        ForAll( colQtRows As r,
                            Collect( colQtResult,
                                With( { res:
                                          IfError(
                                              Text(
                                                  Patch( taskmaster_transactions, Defaults(taskmaster_transactions),
                                                         { transaction_project_archived: gQtArchived },
                                                         { transaction_name:       Trim(r.q_name),
                                                           transaction_project_id: { Id: gQtPid, Value: gQtPname },
                                                           // OPTIONAL lookups and Person: Blank() when unset, never
                                                           // {Id: 0} or a claim built from "" — the connector
                                                           // rejects the WHOLE Patch for either.
                                                           transaction_client_name:
                                                               If( r.q_clientId > 0,
                                                                   { Id: r.q_clientId, Value: r.q_clientValue },
                                                                   Blank() ),
                                                           transaction_product_id:
                                                               If( r.q_productId > 0,
                                                                   { Id: r.q_productId, Value: r.q_productValue },
                                                                   Blank() ),
                                                           transaction_sales:
                                                               If( Len(r.q_salesMail) > 0,
                                                                   { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                                     Claims:      gClaimPrefix & Lower(r.q_salesMail),
                                                                     DisplayName: r.q_salesName,
                                                                     Email:       r.q_salesMail,
                                                                     Department: "", JobTitle: "", Picture: "" },
                                                                   Blank() ),
                                                           transaction_currency:   { Value: r.q_ccy },
                                                           transaction_notional:   Value(r.q_notional),
                                                           transaction_date:       r.q_date } ).ID ),
                                              "!" & Coalesce( FirstError.Message, "SharePoint rejected the row" ) ) },
                                      { Rid:     r.q_rid,
                                        Name:    Trim(r.q_name),
                                        TxId:    If( Len(res) = 0 || StartsWith(res, "!"), 0, Value(res) ),
                                        Message: If( StartsWith(res, "!"), Mid(res, 2),
                                                     Len(res) = 0, "SharePoint returned no record and no error message.",
                                                     "" ) } ) ) );
                        Set( gQtFailN, CountRows( Filter( colQtResult, Len(Message) > 0 ) ) );
                        Set( gQtOkN,   CountRows( colQtResult ) - gQtFailN );
                        // --- 2b. outputs ---------------------------------------------------
                        // BEFORE the saved rows leave colQtRows, which is where their output
                        // lives. Only a saved transaction whose row has an output (q_hasOut, set
                        // only by the pop-up after it validated all four choices) gets one. Same
                        // res contract as above. A failed output does NOT keep its transaction in
                        // the grid — the transaction is saved, and a retry would insert it twice —
                        // so the Notify sends the user to the transaction screen.
                        // output_task_id is NEVER named: a row has at most one parent.
                        // The Coalesces ARE the follow-the-row rule: an empty q_oName / blank
                        // q_oDate takes the row's label and date as synced above, not as they
                        // were when the pop-up opened.
                        ForAll( Filter( colQtResult, Len(Message) = 0 && TxId > 0 ) As k,
                            With( { r: LookUp( colQtRows, q_rid = k.Rid ) },
                                If( r.q_hasOut,
                                    Collect( colQtOutResult,
                                        With( { res:
                                                  IfError(
                                                      Text(
                                                          Patch( taskmaster_output, Defaults(taskmaster_output),
                                                                 { output_name:             Coalesce( Trim(r.q_oName), Trim(r.q_name) ),
                                                                   output_project_id:       gQtPid,
                                                                   output_transaction_id:   k.TxId,
                                                                   // Written on EVERY row, never left to the column
                                                                   // default: `= false` does not match a blank.
                                                                   output_project_archived: gQtArchived,
                                                                   output_date:             Coalesce( r.q_oDate, r.q_date ),
                                                                   output_format:           { Value: r.q_oFmt },
                                                                   output_audience:         { Value: r.q_oAud },
                                                                   output_language:         { Value: r.q_oLang },
                                                                   output_branding:         { Value: r.q_oBrand },
                                                                   output_approval_flag:    r.q_oFlag,
                                                                   // Optional: Blank() when empty, never "".
                                                                   output_approval_id:
                                                                       If( Len(Trim(r.q_oAppr)) > 0, Trim(r.q_oAppr), Blank() ) } ).ID ),
                                                      "!" & Coalesce( FirstError.Message, "SharePoint rejected the output" ) ) },
                                              { Rid:     k.Rid,
                                                Name:    k.Name,
                                                Message: If( StartsWith(res, "!"), Mid(res, 2),
                                                             Len(res) = 0, "SharePoint returned no record and no error message.",
                                                             "" ) } ) ) ) ) );
                        Set( gQtOutFailN, CountRows( Filter( colQtOutResult, Len(Message) > 0 ) ) );
                        Set( gQtOutOkN,   CountRows( colQtOutResult ) - gQtOutFailN );
                        Set( gQtOutMsg,
                             If( gQtOutOkN > 0,
                                 "   " & gQtOutOkN & If( gQtOutOkN = 1, " output", " outputs" ) & " logged.",
                                 "" ) &
                             If( gQtOutFailN > 0,
                                 "   " & gQtOutFailN & If( gQtOutFailN = 1, " output", " outputs" )
                                   & " could not be saved. Transaction """
                                   & First( Filter( colQtOutResult, Len(Message) > 0 ) ).Name
                                   & """ is saved without its output ("
                                   & First( Filter( colQtOutResult, Len(Message) > 0 ) ).Message
                                   & ") — add the output on the transaction screen.",
                                 "" ) );
                        // Saved rows leave; failed rows stay, untouched, for a retry.
                        RemoveIf( colQtRows,
                                  q_rid in ShowColumns( Filter( colQtResult, Len(Message) = 0 ), Rid ) );
                        // --- 3. outcome ----------------------------------------------------
                        // BOTH ARMS END IN Notify, so the If's arms agree on type.
                        If( gQtFailN = 0,
                            Clear( colQtRows );
                            Collect( colQtRows,
                                Patch( gQtBlankRow,
                                    { q_rid:          Coalesce( gQtCarry.q_rid, 0 ) + 1,
                                      q_date:         Coalesce( gQtCarry.q_date, Today() ),
                                      q_ccy:          Coalesce( gQtCarry.q_ccy, "USD" ),
                                      q_clientId:     Coalesce( gQtCarry.q_clientId, 0 ),
                                      q_clientValue:  Coalesce( gQtCarry.q_clientValue, "" ),
                                      q_productId:    Coalesce( gQtCarry.q_productId, 0 ),
                                      q_productValue: Coalesce( gQtCarry.q_productValue, "" ),
                                      q_salesName:    Coalesce( gQtCarry.q_salesName, "" ),
                                      q_salesMail:    Coalesce( gQtCarry.q_salesMail, "" ) } ) );
                            Notify( "Logged " & gQtOkN & If( gQtOkN = 1, " transaction", " transactions" )
                                      & " to " & gQtPname & "." & gQtOutMsg,
                                    If( gQtOutFailN > 0, NotificationType.Warning, NotificationType.Success ) ),
                            Notify( If( gQtWasNew, "Project """ & gQtPname & """ was created. ", "" )
                                      & gQtFailN & " of " & CountRows(colQtResult)
                                      & " transactions could not be saved — they are still listed, press Save to retry.   """
                                      & First( Filter( colQtResult, Len(Message) > 0 ) ).Name & """: "
                                      & First( Filter( colQtResult, Len(Message) > 0 ) ).Message
                                      & gQtOutMsg,
                                    NotificationType.Error ) ) );
                    Set( gSaving, false ) )
      # =======================================================================
      # POP-UP — ONE ROW'S OUTPUT     card 780 x 500, buttons pinned to the card
      # Edits the colQtRows row gQtOutRow names; nothing reaches SharePoint until Save.
      # Declared after the footer so the scrim covers Save; before cmpQtPick, which cannot
      # open while the scrim is up. Every part is gated on gQtOutOpen and shares the card's
      # anchor expressions. Card band at 1366 x 768: x 293..1073, y 134..634.
      #   body 134..554 (420 tall; content 412 = 24 pad + 28 title + 4 x (12 + 62) rows
      #        + 12 + 36 message + 16 pad), so it never scrolls at this size
      #   buttons y 570..610 (card bottom - 24 - 40): Remove x 317..467 (left),
      #        Cancel x 767..887, Save x 899..1049 (right)
      # =======================================================================
      - mdQtOScrim:
          Control: Rectangle@2.3.0
          Properties:
            Visible: =gQtOutOpen
            Fill: =RGBA(32, 38, 45, 0.45)
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            OnSelect: =Set( gQtOutOpen, false )
      - mdQtOBg:
          Control: Rectangle@2.3.0
          Properties:
            Visible: =gQtOutOpen
            Fill: =gTheme.Color.Surface
            BorderColor: =gTheme.Color.Border
            BorderThickness: =1
            X: =(Parent.Width - 780) / 2
            Y: =(Parent.Height - 500) / 2
            Width: =780
            Height: =500
      - mdQtOBody:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Visible: =gQtOutOpen
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =24
            PaddingBottom: =16
            PaddingLeft: =24
            PaddingRight: =24
            X: =(Parent.Width - 780) / 2
            Y: =(Parent.Height - 500) / 2
            Width: =780
            Height: =420
          Children:
            # Position, not q_rid — the same count lblQtRowNo shows.
            - mdQtOTitle:
                Control: Label@2.5.1
                Properties:
                  Text: ="Output for row " & CountRows( Filter( colQtRows, q_rid <= gQtOutRow ) )
                  Font: =gTheme.Font
                  FontWeight: =FontWeight.Semibold
                  Size: =gTheme.Size.H3
                  Color: =gTheme.Color.TextPrimary
                  Width: =Parent.Width - 48
                  Height: =28
            - rowQtOName:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblQtONameCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Output name  *"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Width: =Parent.Width
                        Height: =18
                  - txtQtOName:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: =gQtOName
                        Placeholder: ="e.g. Q3 autocall deck"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Width: =Parent.Width
                        Height: =36
                  - lblQtODateCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Output date  *"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Width: =Parent.Width
                        Height: =18
                  - dtpQtODate:
                      Control: ModernDatePicker@1.0.1
                      Properties:
                        DefaultDate: =gQtODate
                        Placeholder: ="Output date"
                        Format: =DatePickerFormat.LongAbbreviated
                        StartOfWeek: =StartOfWeek.Monday
                        # CALENDAR ONLY. A typed date the picker cannot parse leaves SelectedDate
                        # blank, and lblQtOMissing would then block with no hint why.
                        IsEditable: =false
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Width: =Parent.Width
                        Height: =36
            # THE FOUR CHOICES ARE LIST-REQUIRED, so no "(none)" row. A blank global shows an
            # empty box; the Filter keeps a blank out of DefaultSelectedItems.
            - rowQtOFmt:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblQtOFmtCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Format  *"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Width: =Parent.Width
                        Height: =18
                  - cboQtOFmt:
                      Control: ModernCombobox@1.1.1
                      Properties:
                        Items: =colQtOutFmtOpts
                        ItemDisplayText: =ThisItem.Value
                        DefaultSelectedItems: =Filter( [gQtOFmt], !IsBlank(Value) )
                        SelectMultiple: =false
                        IsSearchable: =false
                        InputTextPlaceholder: ="Select…"
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Width: =Parent.Width
                        Height: =36
                        OnChange: =Set(gQtOFmt, cboQtOFmt.Selected.Value)
                  - lblQtOAudCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Audience  *"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Width: =Parent.Width
                        Height: =18
                  - cboQtOAud:
                      Control: ModernCombobox@1.1.1
                      Properties:
                        Items: =colQtOutAudOpts
                        ItemDisplayText: =ThisItem.Value
                        DefaultSelectedItems: =Filter( [gQtOAud], !IsBlank(Value) )
                        SelectMultiple: =false
                        IsSearchable: =false
                        InputTextPlaceholder: ="Select…"
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Width: =Parent.Width
                        Height: =36
                        OnChange: =Set(gQtOAud, cboQtOAud.Selected.Value)
            - rowQtOLang:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblQtOLangCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Language  *"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Width: =Parent.Width
                        Height: =18
                  - cboQtOLang:
                      Control: ModernCombobox@1.1.1
                      Properties:
                        Items: =colQtOutLangOpts
                        ItemDisplayText: =ThisItem.Value
                        DefaultSelectedItems: =Filter( [gQtOLang], !IsBlank(Value) )
                        SelectMultiple: =false
                        IsSearchable: =false
                        InputTextPlaceholder: ="Select…"
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Width: =Parent.Width
                        Height: =36
                        OnChange: =Set(gQtOLang, cboQtOLang.Selected.Value)
                  - lblQtOBrandCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Branding  *"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Width: =Parent.Width
                        Height: =18
                  - cboQtOBrand:
                      Control: ModernCombobox@1.1.1
                      Properties:
                        Items: =colQtOutBrandOpts
                        ItemDisplayText: =ThisItem.Value
                        DefaultSelectedItems: =Filter( [gQtOBrand], !IsBlank(Value) )
                        SelectMultiple: =false
                        IsSearchable: =false
                        InputTextPlaceholder: ="Select…"
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Width: =Parent.Width
                        Height: =36
                        OnChange: =Set(gQtOBrand, cboQtOBrand.Selected.Value)
            # NO GATE ON A TRANSACTION: the flag and the id are recorded, but a transaction has no
            # stage for a missing approval id to block.
            - rowQtOAppr:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblQtOFlagCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Approval Required"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Width: =Parent.Width
                        Height: =18
                  # Wrapped: every toggle in the app sits in an auto-layout container, so the grid
                  # cell goes on the wrapper and the toggle keeps its own 60x30.
                  - stkQtOFlag:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Width: =Parent.Width
                        Height: =36
                      Children:
                        - tglQtOFlag:
                            Control: Classic/Toggle@2.1.0
                            Properties:
                              Default: =gQtOFlag
                              FalseText: =""
                              TrueText: =""
                              FillPortions: =0
                              LayoutMinWidth: =60
                              Width: =60
                              Height: =30
                  - lblQtOApprCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Approval ID"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Width: =Parent.Width
                        Height: =18
                  - txtQtOAppr:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: =gQtOAppr
                        Placeholder: ="Approval ID"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Width: =Parent.Width
                        Height: =36
            # Read by mdQtOOk, which stays enabled so a blocked save can name what is missing.
            # The approval id is NOT here: it may be filled in after the output exists.
            - lblQtOMissing:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =With(
                       { m: Concat( Filter( Table(
                              { L: "Name",     M: Len(Trim(txtQtOName.Text)) = 0 },
                              // Not list-required, but every reader sorts and windows on it.
                              { L: "Date",     M: IsBlank(dtpQtODate.SelectedDate) },
                              { L: "Format",   M: Len(gQtOFmt) = 0 },
                              { L: "Audience", M: Len(gQtOAud) = 0 },
                              { L: "Language", M: Len(gQtOLang) = 0 },
                              { L: "Branding", M: Len(gQtOBrand) = 0 } ),
                            M ), L, " | " ) },
                       If( Len(m) > 0, "Required Fields Remaining: " & m, "" ) )
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.Danger
                  Width: =Parent.Width - 48
                  Height: =36
      # Only for a row that already had an output when the pop-up opened (gQtOHad). Restores
      # gQtBlankRow's empty output fields, which btnQtRowOutput relies on.
      - mdQtORemove:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =gQtOutOpen && gQtOHad
            Fill: =gTheme.Color.Surface
            Color: =gTheme.Color.Danger
            BorderColor: =gTheme.Color.Danger
            BorderThickness: =1
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            Text: ="Remove output"
            X: =(Parent.Width - 780) / 2 + 24
            Y: =(Parent.Height - 500) / 2 + 500 - 24 - 40
            Width: =150
            Height: =40
            OnSelect: |
              =Patch( colQtRows, LookUp( colQtRows, q_rid = gQtOutRow ),
                      { q_hasOut: false, q_oName: "", q_oDate: Blank(),
                        q_oFmt: "", q_oAud: "", q_oLang: "", q_oBrand: "",
                        q_oFlag: false, q_oAppr: "" } );
               Set( gQtOutOpen, false )
      - mdQtOOk:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =gQtOutOpen
            Fill: =gTheme.Color.Primary
            Color: =gTheme.Color.OnPrimary
            BorderColor: =gTheme.Color.Primary
            BorderThickness: =0
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            Text: ="Save output"
            X: =(Parent.Width - 780) / 2 + 780 - 24 - 150
            Y: =(Parent.Height - 500) / 2 + 500 - 24 - 40
            Width: =150
            Height: =40
            # THREE SINGLE-ARM Ifs, not one If with mixed arms: Notify, Patch and Set return
            # different types. None of them changes what the guard reads, so all three agree.
            # A name or date LEFT EQUAL TO THE ROW'S is stored empty, so it follows the row:
            # btnQtSave fills it from the row's label and trade date at save time.
            OnSelect: |
              =If( Len(lblQtOMissing.Text) > 0,
                   Notify( "Can't save this output yet. " & lblQtOMissing.Text, NotificationType.Error ) );
               If( Len(lblQtOMissing.Text) = 0,
                   Patch( colQtRows, LookUp( colQtRows, q_rid = gQtOutRow ),
                          { q_hasOut: true,
                            q_oName:  If( Trim(txtQtOName.Text) = gQtORowName, "", Trim(txtQtOName.Text) ),
                            q_oDate:  If( dtpQtODate.SelectedDate = gQtORowDate, Blank(), dtpQtODate.SelectedDate ),
                            q_oFmt:   gQtOFmt,
                            q_oAud:   gQtOAud,
                            q_oLang:  gQtOLang,
                            q_oBrand: gQtOBrand,
                            q_oFlag:  tglQtOFlag.Value,
                            q_oAppr:  Trim(txtQtOAppr.Text) } ) );
               If( Len(lblQtOMissing.Text) = 0,
                   Set( gQtOutOpen, false ) )
      - mdQtOCancel:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =gQtOutOpen
            Fill: =gTheme.Color.Surface
            Color: =gTheme.Color.Primary
            BorderColor: =gTheme.Color.Primary
            BorderThickness: =1
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            Text: ="Cancel"
            X: =(Parent.Width - 780) / 2 + 780 - 24 - 150 - 12 - 120
            Y: =(Parent.Height - 500) / 2 + 500 - 24 - 40
            Width: =120
            Height: =40
            OnSelect: =Set( gQtOutOpen, false )
      # =====================================================================
      # PICKER — ONE cmpPicker instance, FIVE states: the project (Existing), the manager
      # (New), and a row's client, product or sales owner (gQtPickRow names the row).
      # Manager and Sales share the people search. Declared LAST so
      # it paints above everything; Visible-gated because a component swallows every
      # click inside its bounds. See scrTaskEdit's instance for the contract.
      # =====================================================================
      - cmpQtPick:
          Control: CanvasComponent
          ComponentName: cmpPicker
          Properties:
            Visible: =Len( Coalesce(gQtPicker, "") ) > 0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: |
              =Switch( gQtPicker,
                       "Project", "Select project",
                       "Manager", "Select project manager",
                       "Client",  "Select client",
                       "Product", "Select product",
                       "Sales",   "Select sales owner" )
            # Queries run HERE — AccessAppScope false. Bound to gQtQuery, which OnSearch sets.
            # Each record kind is TWO branches and the pair must stay split: StartsWith(col, "")
            # is an INVALID query SharePoint rejects (tests/README.md, scrProbe-startswith-empty),
            # so the empty-query page must avoid the Filter entirely.
            Results: |
              =If( (gQtPicker = "Manager" || gQtPicker = "Sales") && Len(gQtQuery) >= 2,
              ForAll( Office365Users.SearchUserV2({ searchTerm: gQtQuery, top: 25 }).value As u,
              { Key:       u.Mail,
              Primary:   u.DisplayName,
              Secondary: u.Mail } ),
              gQtPicker = "Manager" || gQtPicker = "Sales",
              Table( { Key:       User().Email,
              Primary:   User().FullName,
              Secondary: User().Email } ),
              gQtPicker = "Project" && Len(gQtQuery) > 0,
              ForAll( FirstN( Sort( Filter( OpenProjects,
              StartsWith(project_name, gQtQuery) ), project_name ),
              If( Len(gQtQuery) >= 2, 50, 10 ) ) As p,
              { Key:       Text(p.ID),
              Primary:   p.project_name,
              Secondary: Coalesce(p.project_phase.Value, "") } ),
              gQtPicker = "Project",
              ForAll( FirstN( Sort( OpenProjects, project_name ), 10 ) As p,
              { Key:       Text(p.ID),
              Primary:   p.project_name,
              Secondary: Coalesce(p.project_phase.Value, "") } ),
              gQtPicker = "Client" && Len(gQtQuery) > 0,
              ForAll( FirstN( Sort( Filter( taskmaster_clients,
              StartsWith(client_name, gQtQuery) ), client_name ),
              If( Len(gQtQuery) >= 2, 50, 10 ) ) As c,
              { Key:       Text(c.ID),
              Primary:   c.client_name,
              Secondary: Coalesce(c.client_type.Value, "") } ),
              gQtPicker = "Client",
              ForAll( FirstN( Sort( taskmaster_clients, client_name ), 10 ) As c,
              { Key:       Text(c.ID),
              Primary:   c.client_name,
              Secondary: Coalesce(c.client_type.Value, "") } ),
              gQtPicker = "Product" && Len(gQtQuery) > 0,
              ForAll( FirstN( Sort( Filter( taskmaster_products,
              StartsWith(product_uid, gQtQuery) ), product_uid ),
              If( Len(gQtQuery) >= 2, 50, 10 ) ) As p,
              { Key:       Text(p.ID),
              Primary:   p.product_uid,
              Secondary: Coalesce(p.product_type_path, "") } ),
              gQtPicker = "Product",
              ForAll( FirstN( Sort( taskmaster_products, product_uid ), 10 ) As p,
              { Key:       Text(p.ID),
              Primary:   p.product_uid,
              Secondary: Coalesce(p.product_type_path, "") } ) )
            OnSearch: =Set( gQtQuery, cmpQtPick.Query )
            # "＋ New" for a ROW'S client or product only. It leaves the screen mid-batch, so
            # OnCreateNew raises gQtResume (OnVisible then keeps everything) and the edit screen
            # writes the new record into the row gQtPickRow names (QtClient / QtProduct).
            AllowCreate: =gQtPicker = "Client" || gQtPicker = "Product"
            OnConfirm: |
              =// THE Set ARMS AND THE Patch ARMS ARE KEPT APART: one Switch mixing a Boolean
              // (Set) with a record (Patch) is the type clash scrTaskEdit and scrProductEdit
              // already split for the same reason.
              Switch( gQtPicker,
              "Project", Set( gQtProject, { Id: Value(cmpQtPick.Picked.Key), Value: cmpQtPick.Picked.Primary } ),
              "Manager", Set( gQtManager, { DisplayName: cmpQtPick.Picked.Primary, Mail: cmpQtPick.Picked.Secondary } ) );
              If( gQtPicker = "Client",
                  Patch( colQtRows, LookUp( colQtRows, q_rid = gQtPickRow ),
                         { q_clientId: Value(cmpQtPick.Picked.Key), q_clientValue: cmpQtPick.Picked.Primary } ) );
              If( gQtPicker = "Product",
                  Patch( colQtRows, LookUp( colQtRows, q_rid = gQtPickRow ),
                         { q_productId: Value(cmpQtPick.Picked.Key), q_productValue: cmpQtPick.Picked.Primary } ) );
              If( gQtPicker = "Sales",
                  Patch( colQtRows, LookUp( colQtRows, q_rid = gQtPickRow ),
                         { q_salesName: cmpQtPick.Picked.Primary, q_salesMail: cmpQtPick.Picked.Secondary } ) );
              Set( gQtPicker, "" )
            OnCreateNew: |
              =Set( gQtResume, true );
               If( gQtPicker = "Client",
                   Set( gClMode, "New" ); Set( gClReturn, "QtClient" ); Set( gQtPicker, "" );
                   Navigate( scrClientEdit, ScreenTransition.Cover ),
                   Set( gPdMode, "New" ); Set( gPdReturn, "QtProduct" ); Set( gQtPicker, "" );
                   Navigate( scrProductEdit, ScreenTransition.Cover ) )
            OnCancel: =Set( gQtPicker, "" )
