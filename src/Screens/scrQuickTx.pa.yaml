# =============================================================================
# scrQuickTx — log one or many transactions against one project in a single Save.
# The project is a new one built from its required fields only (the default), or an
# existing open one. Opened from scrHome or scrProjects; gQtFrom names which, for Close.
#
# Bands (1366 x 768):   0 ..  64  rowQtHead     (auto-layout, owns no X beyond 0)
#                       64 .. 680  frmQtScroll   (scrolls)
#                      680 .. 768  rowQtAction   (OPAQUE bar behind it)
#                       card 293..1073 x 134..634  mdQtO* output pop-up (gQtOutOpen-gated)
#                       full screen cmpQtPick     (declared LAST, Visible-gated)
#
# ONE LINE PER ROW (galQtRows, TemplateSize 44): # | label | date | notional | ccy |
# client | product | sales owner | output | delete. The output is a button that opens
# the pop-up; the row holds the output's fields (q_hasOut, q_oName, q_oDate, q_oFmt,
# q_oAud, q_oLang, q_oBrand, q_oFlag, q_oAppr) and the save writes one taskmaster_output
# row for each saved transaction whose row has one. An EMPTY q_oName / BLANK q_oDate on a
# row with an output means "the row's own label / trade date", read at SAVE time — so a
# label or date edited after the pop-up closed still reaches the output.
#
# THE ROWS LIVE IN colQtRows AND NOWHERE ELSE. Every row input writes itself back on
# OnChange (which fires on blur), and every reader — validation, + Add row, the save,
# the picker, the pop-up — reads the collection, never galQtRows.AllItems. A gallery
# row re-reads its Defaults whenever its record changes, so a value held only in a
# control is lost the moment the picker, a delete or a partial save touches it.
#
# NO ROW-LEVEL ACTION, SO NO FULL-TEMPLATE HIT BUTTON. Each cell is its own target;
# nothing is layered over an input.
#
# FIRST SUSPECTS if a paste is rejected: IsEditable =false on dtpQtODate (fallback: =true),
# then the record-merge Patch( gQtBlankRow, {...} ) in the three row constructors (fallback:
# spell the record out in full). The in-gallery inputs and their OnChange, the AllItems
# sync and the pop-up's shape (scrTransactionEdit's output editor) are proven in Studio.
#
# CONNECTION PREREQUISITES: Office 365 Users (manager and sales-owner picker) and
# taskmaster_output (row outputs).
# =============================================================================
Screens:
  scrQuickTx:
    Properties:
      Fill: =gTheme.Color.Bg
      OnVisible: |
        =Set( gSaving, false );   // see btnQtSave
         Set( gQtOutOpen, false );
         // THE ONE EMPTY ROW. Every row constructor (below, btnQtAddRow, btnQtSave's fresh row)
         // is Patch( gQtBlankRow, {overrides} ), so the collection's shape is defined once.
         // A row WITHOUT an output holds these empty output fields — mdQtORemove restores them
         // — and btnQtRowOutput relies on that. q_oDate is a TYPE SEED only: it is read only
         // under q_hasOut. Set before the If, so a resumed visit has it too.
         Set( gQtBlankRow,
             { q_rid: 1, q_name: "", q_date: Today(), q_notional: "", q_ccy: "USD",
               q_clientId: 0, q_clientValue: "", q_productId: 0, q_productValue: "",
               q_salesName: "", q_salesMail: "",
               q_hasOut: false, q_oName: "", q_oDate: Today(),
               q_oFmt: "", q_oAud: "", q_oLang: "", q_oBrand: "",
               q_oFlag: false, q_oAppr: "" } );
         // RETURNING FROM "+ New client / product" must keep the batch: colQtRows and the new
         // project's fields exist nowhere else until Save. Every caller that opens this screen
         // fresh clears gQtResume first; only the picker's OnCreateNew raises it.
         If( gQtResume,
         Set( gQtResume, false ),
         Set( gQtMode, "New" );
         Set( gQtProject, { Id: 0, Value: "" } );
         Set( gQtPicker, "" ); Set( gQtQuery, "" ); Set( gQtPickRow, 0 );
         Reset( cmpQtPick );
         // Reference lists, ONCE PER SESSION: an empty collection is the only reason to
         // fetch again. colMapRegion / colMapActivity are raw list copies shared with
         // scrProjectEdit; the Choice lists are this screen's own so their shapes cannot drift.
         Concurrent(
             If( IsEmpty(colMapRegion),   ClearCollect( colMapRegion,   mapping_region ) ),
             If( IsEmpty(colMapActivity), ClearCollect( colMapActivity, mapping_activitytype ) ) );
         // cmpSelection needs {Id, Label}; Choices() returns only Value, so the Id is
         // positional and means nothing — every DefaultId looks its value up by Label.
         // colQtCcyOpts ({Value}) feeds the row currency box; the four colQtOut*Opts feed the
         // output pop-up's boxes. No blank rows: every one of these columns is list-required.
         // An unset choice is "", never a row.
         Concurrent(
             If( IsEmpty(colQtPrioOpts),
                 ClearCollect( colQtPrioOpts,
                       With( { ch: Choices([@taskmaster_projects].project_priority) },
                             ForAll( Sequence( CountRows(ch) ) As n,
                                     { Id: n.Value, Label: Index(ch, n.Value).Value } ) ) ) ),
             If( IsEmpty(colQtCovOpts),
                 ClearCollect( colQtCovOpts,
                       With( { ch: Choices([@taskmaster_projects].project_coverage) },
                             ForAll( Sequence( CountRows(ch) ) As n,
                                     { Id: n.Value, Label: Index(ch, n.Value).Value } ) ) ) ),
             If( IsEmpty(colQtCcyOpts),
                 ClearCollect( colQtCcyOpts,
                       ForAll( Choices([@taskmaster_transactions].transaction_currency) As c,
                               { Value: c.Value } ) ) ),
             If( IsEmpty(colQtOutFmtOpts),
                 ClearCollect( colQtOutFmtOpts,
                       ForAll( Choices([@taskmaster_output].output_format) As c,
                               { Value: c.Value } ) ) ),
             If( IsEmpty(colQtOutAudOpts),
                 ClearCollect( colQtOutAudOpts,
                       ForAll( Choices([@taskmaster_output].output_audience) As c,
                               { Value: c.Value } ) ) ),
             If( IsEmpty(colQtOutLangOpts),
                 ClearCollect( colQtOutLangOpts,
                       ForAll( Choices([@taskmaster_output].output_language) As c,
                               { Value: c.Value } ) ) ),
             If( IsEmpty(colQtOutBrandOpts),
                 ClearCollect( colQtOutBrandOpts,
                       ForAll( Choices([@taskmaster_output].output_branding) As c,
                               { Value: c.Value } ) ) ) );
         // ONE empty row dated today. q_notional is the raw TEXT so an entry that will not
         // parse can be named by lblQtMissing instead of saving as blank. Every text field
         // starts "" (not blank): the sales owner and the pop-up's choices test Len().
         Clear( colQtRows );
         Collect( colQtRows, gQtBlankRow );
         Clear( colQtResult );
         Clear( colQtOutResult );
         Set( gQtSeedPending, true ) );
         // Queued — runs after this formula, so colQtCovOpts is already loaded for its seed.
         // Outside the If so neither of its arms ends in a Select.
         If( gQtSeedPending, Set( gQtSeedPending, false ); Select( btnQtSeedNew ) )
    Children:
      # =====================================================================
      # NEW-PROJECT SEED — hidden, 1x1, declared FIRST so it can never cover a control.
      # Two callers: OnVisible, and btnQtSave once a new project exists (so choosing
      # "New project" again starts clean instead of re-creating the last one).
      # Select() QUEUES: nothing in a caller may read what this sets.
      # =====================================================================
      - btnQtSeedNew:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Visible: =false
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            X: =0
            Y: =0
            Width: =1
            Height: =1
            OnSelect: |
              =Set( gQtManager, { DisplayName: Coalesce(User().FullName, ""), Mail: Coalesce(User().Email, "") } );
               Set( gQtPriority, "Moderate" );
               Set( gQtRegionId, 0 ); Set( gQtRegionPath, "" );
               Set( gQtTypeId, 0 );   Set( gQtTypePath, "" );
               // CASING IS LOAD-BEARING: `in` is case-insensitive but a SharePoint Choice write
               // is not, so the literal must be exactly INTERNAL. Falls back to a real member.
               Set( gQtCov, If( "INTERNAL" in colQtCovOpts.Label, "INTERNAL", First(colQtCovOpts).Label ) );
               Reset( txtQtPrName );
               // Selections and nested pickers re-read their defaults only on Reset, and must
               // come after the Sets above.
               Reset( selQtPriority ); Reset( selQtCov );
               Reset( pickQtRegion ); Reset( pickQtType )
      - rowQtHead:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingLeft: =gTheme.Space.Gutter
            PaddingRight: =gTheme.Space.Gutter
            Fill: =gTheme.Color.Primary
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =gTheme.Space.HeaderH
          Children:
            - lblQtTitle:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    ="Quick transaction" &
                     If( gQtMode = "Existing" && gQtProject.Id > 0, "   ·   " & gQtProject.Value, "" )
                  Color: =gTheme.Color.OnPrimary
                  Font: =gTheme.Font
                  FontWeight: =FontWeight.Semibold
                  Size: =gTheme.Size.H2
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =1
                  LayoutMinWidth: =200
                  Height: =gTheme.Space.HeaderH
            # AN EXPLICIT DESTINATION, NOT Back() — Back() alternates between the two most
            # recent screens rather than unwinding (see scrProject's BackIcon).
            - icoQtBack:
                Control: Classic/Icon@2.5.0
                Properties:
                  Icon: =Icon.Cancel
                  Color: =gTheme.Color.OnPrimary
                  HoverColor: =gTheme.Color.OnPrimary
                  HoverFill: =RGBA(255, 255, 255, 0.15)
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  Tooltip: ="Close"
                  FillPortions: =0
                  LayoutMinWidth: =24
                  Width: =24
                  Height: =24
                  OnSelect: =If( gQtFrom = "Projects", Navigate( scrProjects, ScreenTransition.UnCover ),
                                 Navigate( scrHome, ScreenTransition.UnCover ) )
      - rctQtSheet:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 88
      - frmQtScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =20
            PaddingBottom: =28
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 88
          Children:
            - lblQtSecProject:
                Control: Label@2.5.1
                Properties:
                  Text: ="Project"
                  Font: =gTheme.Font
                  FontWeight: =FontWeight.Semibold
                  Size: =gTheme.Size.H3
                  Color: =gTheme.Color.Primary
                  Width: =Parent.Width - 48
                  Height: =24
            # TWO BUTTONS, NOT cmpSelection: each one sets gQtMode itself, so nothing reads a
            # selection in the same chain that changed it.
            - rowQtMode:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =8
                  Width: =Parent.Width - 48
                  Height: =36
                Children:
                  - btnQtModeNew:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="New project"
                        Fill: =If( gQtMode = "New", gTheme.Color.Primary, gTheme.Color.Surface )
                        Color: =If( gQtMode = "New", gTheme.Color.OnPrimary, gTheme.Color.Primary )
                        HoverFill: =If( gQtMode = "New", gTheme.Color.PrimaryDark, gTheme.Color.Hover )
                        PressedFill: =If( gQtMode = "New", gTheme.Color.PrimaryDark, gTheme.Color.Press )
                        BorderColor: =gTheme.Color.Primary
                        BorderThickness: =1
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Body
                        FillPortions: =0
                        LayoutMinWidth: =180
                        Width: =180
                        Height: =36
                        OnSelect: =Set( gQtMode, "New" )
                  - btnQtModeExisting:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="Existing project"
                        Fill: =If( gQtMode = "Existing", gTheme.Color.Primary, gTheme.Color.Surface )
                        Color: =If( gQtMode = "Existing", gTheme.Color.OnPrimary, gTheme.Color.Primary )
                        HoverFill: =If( gQtMode = "Existing", gTheme.Color.PrimaryDark, gTheme.Color.Hover )
                        PressedFill: =If( gQtMode = "Existing", gTheme.Color.PrimaryDark, gTheme.Color.Press )
                        BorderColor: =gTheme.Color.Primary
                        BorderThickness: =1
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Body
                        FillPortions: =0
                        LayoutMinWidth: =180
                        Width: =180
                        Height: =36
                        OnSelect: =Set( gQtMode, "Existing" )
            # ---- Existing: one lookup over OpenProjects ---------------------------
            - boxQtExisting:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Visible: =gQtMode = "Existing"
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =0
                  FillPortions: =0
                  LayoutMinHeight: =62
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - fldQtProject:
                      Control: CanvasComponent
                      ComponentName: cmpLookupField
                      Properties:
                        Caption: ="Project  *"
                        PickLabel: ="＋  Choose a project"
                        HasValue: =gQtProject.Id > 0
                        Display: =gQtProject.Value
                        Width: =Min( 560, Parent.Width )
                        Height: =62
                        OnPick: |
                          =Set( gQtPicker, "Project" );
                           Reset( cmpQtPick );
                           Set( gQtQuery, "" )
                        OnClear: |
                          =Set( gQtProject, { Id: 0, Value: "" } )
            # ---- New: the required, person-entered project columns only ---------
            # project_phase is DERIVED and has no control. 352 = 62 + 62 + 64 + 20 + 64 + 20
            # plus five gaps of 12.
            - boxQtNew:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Visible: =gQtMode = "New"
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =12
                  FillPortions: =0
                  LayoutMinHeight: =352
                  Width: =Parent.Width - 48
                  Height: =352
                Children:
                  - rowQtNew1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =16
                        Width: =Parent.Width
                        Height: =62
                      Children:
                        - boxQtPrName:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =8
                              FillPortions: =2
                              LayoutMinWidth: =280
                              Height: =62
                            Children:
                              - lblQtPrNameCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="Project name  *"
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextMuted
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - txtQtPrName:
                                  Control: ModernTextInput@1.1.1
                                  Properties:
                                    Default: =""
                                    Placeholder: ="What is this project called?"
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Body
                                    FillPortions: =0
                                    LayoutMinHeight: =36
                                    Width: =Parent.Width
                                    Height: =36
                        - boxQtPrPrio:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =8
                              FillPortions: =1
                              LayoutMinWidth: =190
                              Height: =62
                            Children:
                              - lblQtPrPrioCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="Priority  *"
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextMuted
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - selQtPriority:
                                  Control: CanvasComponent
                                  ComponentName: cmpSelection
                                  Properties:
                                    FontSize: =10
                                    Width: =Parent.Width
                                    Height: =36
                                    Items: =colQtPrioOpts
                                    DefaultId: |
                                      =Coalesce( LookUp(colQtPrioOpts, Label = gQtPriority, Id), 1 )
                                    OnChange: =Set( gQtPriority, selQtPriority.Selected.Label )
                  - rowQtNew2:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =16
                        Width: =Parent.Width
                        Height: =62
                      Children:
                        - boxQtMgr:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =0
                              FillPortions: =1
                              LayoutMinWidth: =260
                              Height: =62
                            Children:
                              - fldQtManager:
                                  Control: CanvasComponent
                                  ComponentName: cmpLookupField
                                  Properties:
                                    Caption: ="Project manager  *"
                                    PickLabel: ="＋  Choose a manager"
                                    HasValue: =Len(gQtManager.Mail) > 0
                                    Display: =gQtManager.DisplayName
                                    Width: =Parent.Width
                                    Height: =62
                                    OnPick: |
                                      =Set( gQtPicker, "Manager" );
                                       Reset( cmpQtPick );
                                       Set( gQtQuery, "" )
                                    OnClear: |
                                      =Set( gQtManager, { DisplayName: "", Mail: "" } )
                        - boxQtCov:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =8
                              FillPortions: =2
                              LayoutMinWidth: =300
                              Height: =62
                            Children:
                              - lblQtCovCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="Coverage  *"
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextMuted
                                    FillPortions: =0
                                    LayoutMinHeight: =18
                                    Width: =Parent.Width
                                    Height: =18
                              - selQtCov:
                                  Control: CanvasComponent
                                  ComponentName: cmpSelection
                                  Properties:
                                    FontSize: =10
                                    Width: =Parent.Width
                                    Height: =36
                                    Items: =colQtCovOpts
                                    DefaultId: =Coalesce( LookUp(colQtCovOpts, Label = gQtCov, Id), 1 )
                                    OnChange: =Set( gQtCov, selQtCov.Selected.Label )
                  # Region and Project type are 3-level vocabularies. Height is fixed at 64: a
                  # canvas component cannot size itself to its content.
                  - pickQtRegion:
                      Control: CanvasComponent
                      ComponentName: cmpNestedSelect
                      Properties:
                        Terms: =colMapRegion
                        Caption: ="Region  *"
                        DefaultPath: =gQtRegionPath
                        Separator: =" | "
                        Width: =Parent.Width
                        Height: =64
                        OnChange: |
                          =Set( gQtRegionId,   pickQtRegion.SelectedId );
                           Set( gQtRegionPath, pickQtRegion.SelectedPath )
                  - lblQtRegionState:
                      Control: Label@2.5.1
                      Properties:
                        Text: =If( Len(gQtRegionPath) > 0, "✓ " & gQtRegionPath, "Nothing picked yet" )
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Parent.Width
                        Height: =20
                  - pickQtType:
                      Control: CanvasComponent
                      ComponentName: cmpNestedSelect
                      Properties:
                        Terms: =colMapActivity
                        Caption: ="Project type  *"
                        DefaultPath: =gQtTypePath
                        Separator: =" | "
                        Width: =Parent.Width
                        Height: =64
                        OnChange: |
                          =Set( gQtTypeId,   pickQtType.SelectedId );
                           Set( gQtTypePath, pickQtType.SelectedPath )
                  - lblQtTypeState:
                      Control: Label@2.5.1
                      Properties:
                        Text: =If( Len(gQtTypePath) > 0, "✓ " & gQtTypePath, "Nothing picked yet" )
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Parent.Width
                        Height: =20
            - divQtRows:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =gTheme.Color.Border
                  Width: =Parent.Width - 48
                  Height: =1
            - lblQtSecRows:
                Control: Label@2.5.1
                Properties:
                  Text: ="Transactions"
                  Font: =gTheme.Font
                  FontWeight: =FontWeight.Semibold
                  Size: =gTheme.Size.H3
                  Color: =gTheme.Color.Primary
                  Width: =Parent.Width - 48
                  Height: =24
            # ---------------------------------------------------------------------
            # THE GRID. The heading row and the gallery row carry IDENTICAL FillPortions /
            # LayoutMinWidth pair-for-pair; change one and change the other — nothing in
            # Power Fx keeps them in step. The heading's width is READ from the gallery.
            # 13 cells: # | label 3 | date | notional 2 | ccy | client 2 | clr | product 2 | clr |
            # sales owner 2 | clr | output | delete. At TemplateWidth ~1300: fixed 466
            # (28+170+90+16+16+16+110+20), gaps+padding 112 (12 x 8 + 16), 11 portions share
            # ~722 (~66 each): label ~197, the four 2-portion cells ~131. Mins total 630
            # (160+110+3x120) <= 722; they bind only below TemplateWidth 1238 (portion < 60).
            # The date cell stays at 170: a LongAbbreviated date ("Wed, Sep 30, 2026") beside
            # the calendar icon needs the room. Take width from the label's min, not from it.
            # Row: 36-tall cells centred in 43; rctQtRowLine is the 44th px.
            # The gallery grows a row at a time up to 6, then scrolls. 66 = 18 + 4 + 44.
            # ---------------------------------------------------------------------
            - boxQtGrid:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =4
                  FillPortions: =0
                  LayoutMinHeight: =66
                  Width: =Parent.Width - 48
                  Height: =22 + galQtRows.Height
                Children:
                  - rowQtGridHead:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        Width: =galQtRows.TemplateWidth
                        Height: =18
                      Children:
                        - hdQtNo:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="#"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              Align: =Align.Center
                              FillPortions: =0
                              LayoutMinWidth: =28
                              Width: =28
                              Height: =18
                        - hdQtName:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Transaction label  *"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              FillPortions: =3
                              LayoutMinWidth: =160
                              Height: =18
                        - hdQtDate:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Trade date  *"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              FillPortions: =0
                              LayoutMinWidth: =170
                              Width: =170
                              Height: =18
                        - hdQtNotional:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Notional (native)"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              FillPortions: =2
                              LayoutMinWidth: =110
                              Height: =18
                        - hdQtCcy:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Currency  *"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              FillPortions: =0
                              LayoutMinWidth: =90
                              Width: =90
                              Height: =18
                        - hdQtClient:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Client"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              FillPortions: =2
                              LayoutMinWidth: =120
                              Height: =18
