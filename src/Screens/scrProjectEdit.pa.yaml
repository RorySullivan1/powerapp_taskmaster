                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =6
                  Width: =Parent.Width - 48
                  Height: =58
                Children:
                  - fldNxSales:
                      Control: CanvasComponent
                      ComponentName: cmpLookupField
                      Properties:
                        Caption: ="Sales owner  *  —  anyone in the directory"
                        PickLabel: ="＋  Choose a sales owner"
                        HasValue: =Len(gNxSales.Mail) > 0
                        Display: =gNxSales.DisplayName
                        Width: =Parent.Width
                        Height: =62
                        OnPick: |
                          =Set( gPrPicker, "NxSales" );
                           Reset( cmpPrPick );
                           Set( gPrQuery, "" )
                        OnClear: |
                          =Set( gNxSales, { DisplayName: "", Mail: "" } )
      - mdNxAdd:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =gNxOpen
            Fill: =gTheme.Color.Primary
            Color: =gTheme.Color.OnPrimary
            BorderColor: =gTheme.Color.Primary
            BorderThickness: =0
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            Text: =If( gNxEditSid > 0, "Save transaction", "Add transaction" )
            DisplayMode: |
              =If( Len(Trim(txtNxName.Text)) > 0 && gNxClient.Id > 0 && gNxProduct.Id > 0
                && !IsBlank(dtpNxDate.SelectedDate) && Len(gNxSales.Mail) > 0,
                   DisplayMode.Edit, DisplayMode.Disabled )
            X: =(Parent.Width - 780) / 2 + 780 - 24 - 170
            Y: =(Parent.Height - 680) / 2 + 680 - 24 - 40
            Width: =170
            Height: =40
            OnSelect: |
              =If( gNxEditSid > 0,
                   Patch( colNewTransactions, LookUp(colNewTransactions, sid = gNxEditSid),
                      { x_name:         Trim(txtNxName.Text),
                      x_clientId:     gNxClient.Id,
                      x_clientValue:  gNxClient.Value,
                      x_productId:    gNxProduct.Id,
                      x_productValue: gNxProduct.Value,
                      x_ccy:          gNxCcy,
                      x_notional:     Value(numNxNotional.Text),
                      x_date:         dtpNxDate.SelectedDate,
                      x_salesName:    gNxSales.DisplayName,
                      x_salesMail:    gNxSales.Mail } ),
                   Collect( colNewTransactions,
                      { sid: If( IsEmpty(colNewTransactions), 1, Max(colNewTransactions, sid) + 1 ),
                        x_name:         Trim(txtNxName.Text),
                        x_clientId:     gNxClient.Id,
                        x_clientValue:  gNxClient.Value,
                        x_productId:    gNxProduct.Id,
                        x_productValue: gNxProduct.Value,
                        x_ccy:          gNxCcy,
                        x_notional:     Value(numNxNotional.Text),
                        x_date:         dtpNxDate.SelectedDate,
                        x_salesName:    gNxSales.DisplayName,
                        x_salesMail:    gNxSales.Mail } ) );
               Reset( txtNxName ); Reset( dtpNxDate ); Reset( numNxNotional );
               Reset( cmpPrPick );
               Set( gNxClient, { Id: 0, Value: "" } ); Set( gNxProduct, { Id: 0, Value: "" } );
               Reset( cboNxCcy );
               Set( gNxSales, { DisplayName: "", Mail: "" } );
               Set( gNxCcy, "USD" );
               Set( gNxEditSid, 0 ); Set( gNxName, "" ); Set( gNxDate, Blank() ); Set( gNxNotional, Blank() );
               Set( gNxOpen, false )
      - mdNxCancel:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =gNxOpen
            Fill: =gTheme.Color.Surface
            Color: =gTheme.Color.Primary
            BorderColor: =gTheme.Color.Primary
            BorderThickness: =1
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            Text: ="Cancel"
            X: =(Parent.Width - 780) / 2 + 780 - 24 - 170 - 12 - 120
            Y: =(Parent.Height - 680) / 2 + 680 - 24 - 40
            Width: =120
            Height: =40
            OnSelect: |
              =Reset( txtNxName ); Reset( dtpNxDate ); Reset( numNxNotional );
               Reset( cmpPrPick );
               Set( gNxClient, { Id: 0, Value: "" } ); Set( gNxProduct, { Id: 0, Value: "" } );
               Reset( cboNxCcy );
               Set( gNxSales, { DisplayName: "", Mail: "" } );
               Set( gNxCcy, "USD" );
               Set( gNxEditSid, 0 ); Set( gNxName, "" ); Set( gNxDate, Blank() ); Set( gNxNotional, Blank() );
               Set( gNxOpen, false )
      # =====================================================================
      # PICKER — ONE cmpPicker instance, SEVEN states: three person fields on
      # the project form, the task lead and sales owner inside the STAGED CHILD
      # modals, and the staged transaction's client and product. Declared LAST,
      # after both modals, so the dialog paints above them.
      #
      # AllowCreate is FALSE throughout on purpose: + New would navigate away,
      # and this screen's OnVisible clears colNewTasks / colNewTransactions, so
      # a return would destroy staged children — a much worse loss than the
      # cleared inputs fixed on scrTaskEdit. Creating a client mid-project is
      # available from the transaction editor, or from scrReference.
      # See scrTaskEdit's instance for the full contract commentary.
      # =====================================================================
      - cmpPrPick:
          Control: CanvasComponent
          ComponentName: cmpPicker
          Properties:
            Visible: =Len( Coalesce(gPrPicker, "") ) > 0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: |
              =Switch( gPrPicker,
                       "Manager",   "Select project manager",
                       "Requestor", "Select requestor",
                       "Supporter", "Select supporter",
                       "NtLead",    "Select task lead",
                       "NxSales",   "Select sales owner",
                       "NxClient",  "Select client",
                       "NxProduct", "Select product" )
            # Queries run HERE — AccessAppScope false. Bound to gPrQuery, which
            # OnSearch sets, never to the instance's own Query output.
            # Uniform {Key, Primary, Secondary}; Key is Text for both kinds.
            # The record branches carry no query-length gate — see scrTaskEdit's
            # instance for why one branch serves both the default page and the search.
            Results: |
              =If( (gPrPicker = "Manager" || gPrPicker = "Requestor" || gPrPicker = "Supporter"
              || gPrPicker = "NtLead" || gPrPicker = "NxSales") && Len(gPrQuery) >= 2,
              ForAll( Office365Users.SearchUserV2({ searchTerm: gPrQuery, top: 25 }).value As u,
              { Key:       u.Mail,
              Primary:   u.DisplayName,
              Secondary: u.Mail } ),
              gPrPicker = "Manager" || gPrPicker = "Requestor" || gPrPicker = "Supporter"
              || gPrPicker = "NtLead" || gPrPicker = "NxSales",
              Table( { Key:       User().Email,
              Primary:   User().FullName,
              Secondary: User().Email } ),
              gPrPicker = "NxClient",
              ForAll( FirstN( Sort( Filter( taskmaster_clients,
              StartsWith(client_name, gPrQuery) ), client_name ),
              If( Len(gPrQuery) >= 2, 50, 10 ) ) As c,
              { Key:       Text(c.ID),
              Primary:   c.client_name,
              Secondary: Coalesce(c.client_type.Value, "") } ),
              gPrPicker = "NxProduct",
              ForAll( FirstN( Sort( Filter( taskmaster_products,
              StartsWith(product_uid, gPrQuery) ), product_uid ),
              If( Len(gPrQuery) >= 2, 50, 10 ) ) As p,
              { Key:       Text(p.ID),
              Primary:   p.product_uid,
              Secondary: Coalesce(p.product_type_path, "") } ) )
            OnSearch: =Set( gPrQuery, cmpPrPick.Query )
            AllowCreate: =false
            OnConfirm: |
              =Switch( gPrPicker,
              "Manager",   Set( gPrManager,   { DisplayName: cmpPrPick.Picked.Primary, Mail: cmpPrPick.Picked.Secondary } ),
              "Requestor", Set( gPrRequestor, { DisplayName: cmpPrPick.Picked.Primary, Mail: cmpPrPick.Picked.Secondary } ),
              "Supporter", Set( gPrSupporter, { DisplayName: cmpPrPick.Picked.Primary, Mail: cmpPrPick.Picked.Secondary } ),
              "NtLead",    Set( gNtLead,      { DisplayName: cmpPrPick.Picked.Primary, Mail: cmpPrPick.Picked.Secondary } ),
              "NxSales",   Set( gNxSales,     { DisplayName: cmpPrPick.Picked.Primary, Mail: cmpPrPick.Picked.Secondary } ),
              "NxClient",  Set( gNxClient,    { Id: Value(cmpPrPick.Picked.Key), Value: cmpPrPick.Picked.Primary } ),
              "NxProduct", Set( gNxProduct,   { Id: Value(cmpPrPick.Picked.Key), Value: cmpPrPick.Picked.Primary } ) );
              Set( gPrPicker, "" )
            OnCancel: =Set( gPrPicker, "" )
