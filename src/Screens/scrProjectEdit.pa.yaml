      - actionBarBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            BorderColor: =gTheme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
      - actionBarRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
          Children:
            # Message first, buttons right — and the "Still required:" caption is
            # folded into this one label, so `Len(Self.Text) = 0` is still the exact
            # test btnPrSave.DisplayMode needs.
            - lblPrMissing:
                Control: Label@2.5.1
                Properties:
                  # ONE SOURCE OF TRUTH FOR "what is still missing", and it is this Text.
                  # It used to carry a literal `"Still required:   " &` prefix, which made
                  # `Len(Self.Text)` ALWAYS non-zero — so the emptiness of this label could
                  # not be tested and `btnPrSave` had to restate the whole condition in a
                  # DisplayMode formula. Two copies of one rule is how they drift. The
                  # prefix now lives in the Notify that btnPrSave raises, and both the
                  # Visible below and the save gate read this one string.
                  # Same shape as lblTxMissing / lblIssMissing / lblTkMissing.
                  Visible: =Len(Self.Text) > 0
                  Text: |
                    =Trim(
                       If( Len(Trim(txtPrName.Text)) = 0, "project name   ", "" ) &
                       If( Len(gPrManager.Mail) = 0,      "project manager   ", "" ) &
                       If( Len(gPrPhase) = 0,             "phase   ", "" ) &
                       If( gEditMode = "New" && Len(gPrRegionPath) = 0, "Region   ", "" ) &
                       If( gEditMode = "New" && Len(gPrTypePath) = 0,   "Project type   ", "" ) )
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.Danger
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.Width - 512
                  Height: =48
            - btnPrCancel:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =gTheme.Color.Surface
                  Color: =gTheme.Color.Primary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =1
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Text: |
                    =If( CountRows(colNewTasks) + CountRows(colNewTransactions) > 0,
                         "Discard", "Cancel" )
                  Width: =140
                  Height: =48
                  OnSelect: =Back()
            - btnPrSave:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =gTheme.Color.Primary
                  Color: =gTheme.Color.OnPrimary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =0
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Text: |
                    =If( gSaving, "Saving…",
                     If( gEditMode = "Edit", "Save project", "Create project" ) &
                     If( CountRows(colNewTasks) + CountRows(colNewTransactions) > 0,
                         " + " & ( CountRows(colNewTasks) + CountRows(colNewTransactions) ) & " item(s)", "" ) )
                  # ALWAYS ENABLED — the DisplayMode gate is GONE. It read
                  # `If(<four required fields>, Edit, Disabled)`, and A DISABLED BUTTON
                  # CANNOT FIRE OnSelect, so a project missing one of them produced a
                  # click that did nothing and said nothing: no Notify, no error, no clue
                  # which field. That is the defect reported on 2026-08-10 as "I clicked
                  # Save and nothing happened"; it was fixed on the other three editors
                  # then and this button was missed. The requirement is not relaxed — it
                  # moved into OnSelect, where it can NAME the missing field.
                  Width: =300
                  Height: =48
                  OnSelect: |
                    =If( gSaving,
                    // A SECOND TAP WHILE THE FIRST WRITE IS STILL IN FLIGHT. Do nothing.
                    // A SharePoint Patch takes seconds; the button stayed live throughout, so a
                    // double-tap ran the whole handler twice and Defaults() built a SECOND new
                    // record. `Set` applies immediately within a behaviour chain, so the flag is
                    // already true by the time the second tap is evaluated.
                    // NO DisplayMode GATE — see this button's ALWAYS ENABLED note. A disabled
                    // button cannot fire OnSelect and cannot say why; the Text says "Saving…"
                    // instead, and the guard below is what actually blocks the duplicate.
                    false,
                    Len(lblPrMissing.Text) > 0,
                    Notify( "Can't save yet — this project still needs: " & lblPrMissing.Text,
                    NotificationType.Error ),
                    Set( gSaving, true );
                    // WHETHER THE C3 ROLLUP NEEDS TO RUN, DECIDED NOW AND NOT AT STEP 5.
                    // The rollup is a weighted average over child task STAGES, so only two
                    // things can move it: a brand new project, or child tasks staged in
                    // THIS save. Neither can be tested where the rollup actually runs —
                    // by then `Set(gEditMode,"Edit")` has already fired, and step 4's
                    // RemoveIf has stripped the successful rows out of colNewTasks, so a
                    // count taken there would see only the FAILURES and read exactly
                    // backwards. Capture it here, before either mutation.
                    // ONE definition of "this save INSERTS", captured before anything
                    // mutates gEditMode. It must match the Patch's own base-record test
                    // below EXACTLY — `gEditMode = "New" || IsBlank(gEditProject.ID)`,
                    // which includes the self-heal for an Edit that arrived with no
                    // record. Writing `gEditMode <> "Edit"` here instead left the
                    // self-heal path inserting a brand-new project with gPrRollup FALSE,
                    // so the rollup was skipped and project_perc_completion never got
                    // its initial 0 — the one thing the guard exists to guarantee.
                    Set( gPrInsert, gEditMode = "New" || IsBlank(gEditProject.ID) );
                    // DOES THIS SAVE CROSS THE ARCHIVED BOUNDARY? Captured HERE, for the
                    // same reason as gPrInsert: step 4 re-reads gEditProject from the
                    // server, after which the OLD phase is gone and the comparison is
                    // impossible. An insert never crosses — a new project is not archived
                    // and has no children yet.
                    Set( gPrWasArchived, !gPrInsert && gEditProject.project_phase.Value = "Archived" );
                    Set( gPrNowArchived, gPrPhase = "Archived" );
                    Set( gPrArcFlip, !gPrInsert && gPrWasArchived <> gPrNowArchived );
                    Set( gPrRollup, gPrInsert || CountRows(colNewTasks) > 0 );
                    Set( gPrSaved, Blank() );
                    Set( gPrErr, "" );
                    Set( gPrWarn, "" );
                    Set( gPrNameSaved, Trim(txtPrName.Text) );
                    // gEditMode says Edit only because a previous save SAID it
                    // succeeded. If there is no record behind it, patching that
                    // record fails forever and no amount of re-typing helps — so
                    // treat a missing ID as New and insert instead. This is the
                    // self-heal for the state described at step 4 below.
                    // ONE WRITE, ONE RECORD. This used to be two near-identical Patches
                    // (insert vs update) followed by FIVE guarded follow-up Patches against
                    // the row just written — up to nine serial round trips to fix a typo.
                    // The base record is now chosen by If() and every column, required and
                    // optional, is in the single record. Same fold scrTaskEdit took on
                    // 2026-08-10, and the same rationale: the follow-ups' per-field error
                    // attribution is replaced by SharePoint's own error, which names the
                    // offending column.
                    //
                    // `insert` means gEditMode = "New" OR a missing ID — the self-heal
                    // below. It is tested twice here rather than hoisted because a Patch
                    // record is a value, not a behaviour chain, so there is nowhere to put
                    // a local.
                    IfError(
                        Set( gPrSaved,
                            Patch( taskmaster_projects,
                                If( gPrInsert,
                                    Defaults(taskmaster_projects), gEditProject ),
                                { project_name:        Trim(txtPrName.Text),
                                  project_description: txtPrDesc.Text,
                                  project_pathway:     txtPrPathway.Text,
                                  project_phase:       { Value: gPrPhase },
                                  project_priority:    { Value: gPrPriority },
                                  project_manager:
                                      { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                        Claims:      gClaimPrefix & Lower(gPrManager.Mail),
                                        DisplayName: gPrManager.DisplayName,
                                        Email:       gPrManager.Mail,
                                        Department: "", JobTitle: "", Picture: "" },
                                  project_region_id:   gPrRegionId,
                                  project_region_path: gPrRegionPath,
                                  project_type_id:     gPrTypeId,
                                  project_type_path:   gPrTypePath,
                                  // GUARDED. This was a bare { Value: gPrCov } on the insert
                                  // path while the Edit path guarded the identical write, and
                                  // gPrCov seeds to "" on New with no required-field gate —
                                  // so an unpicked Coverage sent an empty Choice member, which
                                  // is not a member, and the connector rejected the insert.
                                  project_coverage:
                                      If( Len(gPrCov) > 0, { Value: gPrCov }, Blank() ),
                                  project_date_start:    dtpPrStart.SelectedDate,
                                  project_date_target:   dtpPrTarget.SelectedDate,
                                  project_date_complete:
                                      If( gPrInsert,
                                          If( gPrPhase = "Complete", Now(), Blank() ),
                                          If( gPrPhase = "Complete",
                                              Coalesce(gEditProject.project_date_complete, Now()),
                                              gEditProject.project_date_complete ) ),
                                  project_requestor:
                                      If( Len(gPrRequestor.Mail) > 0,
                                          { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                            Claims:      gClaimPrefix & Lower(gPrRequestor.Mail),
                                            DisplayName: gPrRequestor.DisplayName,
                                            Email:       gPrRequestor.Mail,
                                            Department: "", JobTitle: "", Picture: "" },
                                          Blank() ),
                                  project_supporter:
                                      If( Len(gPrSupporter.Mail) > 0,
                                          { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                            Claims:      gClaimPrefix & Lower(gPrSupporter.Mail),
                                            DisplayName: gPrSupporter.DisplayName,
                                            Email:       gPrSupporter.Mail,
                                            Department: "", JobTitle: "", Picture: "" },
                                          Blank() ) } ) ),
                        Set( gPrErr, FirstError.Message ) );
                    // TRUST THE RECORD, NEVER THE MESSAGE. A write can fail and
                    // still leave FirstError.Message empty, and the old code read
                    // that empty message as success: it then set gEditProject to a
                    // BLANK gPrSaved and flipped gEditMode to "Edit". After that
                    // txtPrName.Default reads gEditProject.project_name — blank, so
                    // the name appears to clear — and every later save patches a
                    // record that does not exist, so it fails no matter what is
                    // typed back in. If there is no ID, nothing was written.
                    If( IsBlank(gPrSaved.ID) && Len(gPrErr) = 0,
                        Set( gPrErr, "SharePoint returned no record and no error message, so nothing was saved. Check the required columns on taskmaster_projects." ) );
                    If( Len(gPrErr) > 0,
                        Notify( If(gEditMode = "New", "Couldn't create the project: ", "Couldn't save the project: ")
                                  & gPrErr,
                                NotificationType.Error ) );
                    If( Len(gPrErr) = 0 && !IsBlank(gPrSaved.ID),
                        // --- 3. children ------------------------------------------
                        // IfError's third argument is the value returned when NOTHING
                        // errored, which is how each row records success or failure
                        // without a second pass over the data.
                        //
                        // It records the outcome as TEXT, not by collecting into two
                        // different collections, because IfError currently requires ALL
                        // its arguments to be type-compatible — a record from Patch
                        // against two differently-shaped tables from Collect is rejected.
                        // Text(Patch(…).ID) forces the success arm to text so all three
                        // arms match; an empty Message means the row was written.
                        Clear( colChildResult ); Clear( colChildErrors ); Clear( colChildOk );
                        ForAll( colNewTasks As t,
                            Collect( colChildResult,
                                { Kind: "Task", Sid: t.sid, Name: t.t_name,
                                  Message:
                                    IfError( Text(
                                        Patch( taskmaster_tasks, Defaults(taskmaster_tasks),
                                               // Inherits the parent's archived state. Almost
                                               // always false — you cannot add children to an
                                               // archived project — but a project archived in
                                               // the SAME save would otherwise leave them live.
                                               { task_project_archived: gPrNowArchived },
                                            { task_name:       t.t_name,
                                              task_project_id: { Id: gPrSaved.ID, Value: gPrNameSaved },
                                              task_stage:      { Value: t.t_stage },
                                              task_status:     { Value: "Green" },
                                              task_priority:   { Value: t.t_priority },
                                              task_lead:
                                                  { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                    Claims:      gClaimPrefix & Lower(t.t_leadMail),
                                                    DisplayName: t.t_leadName,
                                                    Email:       t.t_leadMail,
                                                    Department: "", JobTitle: "", Picture: "" },
                                              task_date_start:  Now(),
                                              task_date_target: t.t_target } )
                                    .ID ),
                                    FirstError.Message,
                                    "" ) } ) );
                        ForAll( colNewTransactions As x,
                            Collect( colChildResult,
                                { Kind: "Transaction", Sid: x.sid, Name: x.x_name,
                                  Message:
                                    IfError( Text(
                                        Patch( taskmaster_transactions, Defaults(taskmaster_transactions),
                                               // Inherits the parent's archived state. Almost
                                               // always false — you cannot add children to an
                                               // archived project — but a project archived in
                                               // the SAME save would otherwise leave them live.
                                               { transaction_project_archived: gPrNowArchived },
                                            { transaction_name:        x.x_name,
                                              transaction_project_id:  { Id: gPrSaved.ID, Value: gPrNameSaved },
                                              transaction_client_name: { Id: x.x_clientId,  Value: x.x_clientValue },
                                              transaction_product_id:  { Id: x.x_productId, Value: x.x_productValue },
                                              transaction_sales:
                                                  { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                    Claims:      gClaimPrefix & Lower(x.x_salesMail),
                                                    DisplayName: x.x_salesName,
                                                    Email:       x.x_salesMail,
                                                    Department: "", JobTitle: "", Picture: "" },
                                              transaction_currency:    { Value: x.x_ccy },
                                              transaction_notional:
                                                  x.x_notional,
                                              transaction_date:        x.x_date } )
                                    .ID ),
                                    FirstError.Message,
                                    "" ) } ) );
                        Collect( colChildErrors,
                                 ShowColumns( Filter(colChildResult, Len(Message) > 0), Kind, Name, Message ) );
                        Collect( colChildOk,
                                 ShowColumns( Filter(colChildResult, Len(Message) = 0), Kind, Sid ) );
                        RemoveIf( colNewTasks,
                                  sid in ShowColumns( Filter(colChildOk, Kind = "Task"), Sid ) );
                        RemoveIf( colNewTransactions,
                                  sid in ShowColumns( Filter(colChildOk, Kind = "Transaction"), Sid ) );
                        // --- 4. the project now EXISTS. Never insert it twice. -----
                        // READ IT BACK rather than reusing Patch's return value. That
                        // record is not guaranteed to carry every column, and this one
                        // seeds the whole form: txtPrName.Default is
                        // If(gEditMode = "Edit", gEditProject.project_name, "") and
                        // flipping the mode re-evaluates it, so a thin record empties
                        // the name box in front of the user. This is the "project name
                        // pops" defect. Two statements rather than Coalesce: Coalesce
                        // is documented over VALUES, not records, so falling back to
                        // the thin record is written as an explicit If.
                        Set( gEditProject, LookUp(taskmaster_projects, ID = gPrSaved.ID) );
                        If( IsBlank(gEditProject.ID), Set( gEditProject, gPrSaved ) );
                        Set( gEditMode, "Edit" );
                        Set( gSelProject, gEditProject );
                        // --- 5. C3 rollup, read back from the server ---------------
                        // SKIPPED ENTIRELY unless gPrRollup said so at the top of this
                        // handler. It ran on EVERY save, and it costs a Filter over up to
                        // 500 task rows plus a write — spent in full to rename a project
                        // or move its target date, neither of which a stage-weighted
                        // average can possibly depend on. scrTaskEdit has had this guard
                        // since 2026-08-10; this screen was missed.
                        // A NEW project always runs it, and that is load-bearing: the main
                        // Patch above never writes project_perc_completion, so with no
                        // tasks staged this is the only thing that lands the initial 0.
                        If( gPrRollup,
                        With( { pid: gPrSaved.ID },
                            With( { scored:
                                      AddColumns(
                                          Filter( taskmaster_tasks,
                                              task_project_id.Id = pid ),
                                          wgt, Coalesce(LookUp(gStageWeights, Stage = task_stage.Value, Weight), 0) ) },
                                If( CountRows(scored) >= 500,
                                    Notify("Project saved. It has too many tasks to compute completion accurately, so it was left unchanged.",
                                           NotificationType.Warning),
                                    // Don't spend a write on a number that has not moved —
                                    // the second half of scrTaskEdit's guard. gEditProject was
                                    // re-read from the server four lines up, so it carries the
                                    // stored value; if that read fell back to the thin gPrSaved
                                    // the comparison is against a blank and the write happens,
                                    // which is the safe direction to be wrong in.
                                    With( { newPc: If( CountRows(scored) = 0, 0,
                                                       RoundDown(Average(scored, wgt), 0) ) },
                                        // Coalesce to -1, NOT a bare compare. A just-inserted
                                        // row has project_perc_completion NULL, and newPc is 0
                                        // for a project with no tasks — so a bare `0 <> Blank()`
                                        // may be FALSE, skipping the write and leaving NULL.
                                        // That defeats the initial-0 guarantee, and it is not
                                        // cosmetic: Power BI's AVERAGE drops blanks from the
                                        // denominator instead of counting a 0, so portfolio
                                        // completion reads HIGH. -1 can never equal a real
                                        // percentage, so the first write always happens.
                                        If( newPc <> Coalesce(gEditProject.project_perc_completion, -1),
                                    IfError(
                                        Set( gSelProject,
                                            Patch( taskmaster_projects, gPrSaved,
                                                   { project_perc_completion: newPc } ) ), Set( gPrWarn, gPrWarn & "Project saved, but the completion rollup didn't update: " & FirstError.Message & "   " )) ) ) ) ) ) );
                        // --- 6. CASCADE THE ARCHIVED FLAG TO THE CHILDREN --------
                        // `*_project_archived` is a denormalised mirror of this project's
                        // phase, and it exists so every cross-project query can exclude
                        // archived work with a delegable `= false` instead of a join. This
                        // is the ONE place the app writes project_phase, so it is the one
                        // place the mirror can be kept true.
                        //
                        // ONLY ON A FLIP. Rewriting every child on every project save
                        // would be a ForAll over hundreds of rows to change nothing.
                        //
                        // ForAll + Patch DOES NOT DELEGATE — it pulls up to the data row
                        // limit and writes one row at a time. A project with more children
                        // than that limit would be PARTIALLY cascaded, which is worse than
                        // not at all: the leftovers keep the old flag and quietly stay in
                        // (or out of) every query. So each list is counted FIRST and the
                        // whole cascade refuses rather than half-doing it — the same
                        // shape as the >= 500 refusal in the rollup above.
                        If( gPrArcFlip,
                            With( { nT: CountRows( Filter(taskmaster_tasks,        task_project_id.Id        = gPrSaved.ID) ),
                                    nX: CountRows( Filter(taskmaster_transactions, transaction_project_id.Id = gPrSaved.ID) ),
                                    nI: CountRows( Filter(taskmaster_issues,       issue_project_id.Id       = gPrSaved.ID) ) },
                                If( nT >= 500 || nX >= 500 || nI >= 500,
                                    Set( gPrWarn, gPrWarn & "Project saved, but it has too many attached items to re-flag them all in one pass, so they were left as they were. Ask for the cleanup workflow to re-sync them.   " ),
                                    IfError(
                                        Set( gPrScrap,
                                            ForAll( Filter(taskmaster_tasks, task_project_id.Id = gPrSaved.ID) As t,
                                                    Patch( taskmaster_tasks, t,
                                                           { task_project_archived: gPrNowArchived } ) ) ),
                                        Set( gPrWarn, gPrWarn & "Project saved, but its tasks kept the old archived flag: " & FirstError.Message & "   " ) );
                                    IfError(
                                        Set( gPrScrap2,
                                            ForAll( Filter(taskmaster_transactions, transaction_project_id.Id = gPrSaved.ID) As x,
                                                    Patch( taskmaster_transactions, x,
                                                           { transaction_project_archived: gPrNowArchived } ) ) ),
                                        Set( gPrWarn, gPrWarn & "Project saved, but its transactions kept the old archived flag: " & FirstError.Message & "   " ) );
                                    IfError(
                                        Set( gPrScrap3,
                                            ForAll( Filter(taskmaster_issues, issue_project_id.Id = gPrSaved.ID) As i,
                                                    Patch( taskmaster_issues, i,
                                                           { issue_project_archived: gPrNowArchived } ) ) ),
                                        Set( gPrWarn, gPrWarn & "Project saved, but its issues kept the old archived flag: " & FirstError.Message & "   " ) ) ) ) );
                        If( Len(gPrWarn) > 0,
                            Notify( "Project saved, but: " & gPrWarn, NotificationType.Warning ) );
                        If( IsEmpty(colChildErrors),
                            Notify("Project saved with everything attached.", NotificationType.Success);
                            Navigate( scrProject, ScreenTransition.Cover ),
                            Notify( CountRows(colChildErrors) & " item(s) could not be created — they are still listed below, press Save to retry."
                                      & "   " & First(colChildErrors).Kind & " """ & First(colChildErrors).Name & """: "
                                      & First(colChildErrors).Message,
                                    NotificationType.Error ) )
                    );
                    Set( gSaving, false ) )
