                  Color: =Theme.Color.Primary
                  Width: =Parent.Width - 48
                  Height: =24
            - lblPrClassNote:
                Control: Label@2.5.1
                Properties:
                  Text: ="Region and Project type are required. Pick a value, press + to narrow it down a level, then press the ✓ to record it. One level is a complete answer."
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =Parent.Width - 48
                  Height: =18
            # Region and Project type are 3-level vocabularies, so each gets a
            # cmpNestedSelect. Height is fixed at 64: a canvas component cannot
            # size itself to its content — see the component's header.
            - pickPrRegion:
                Control: CanvasComponent
                ComponentName: cmpNestedSelect
                Properties:
                  Terms: =colMapRegion
                  Caption: ="Region  *"
                  DefaultPath: =gPrRegionPath
                  Width: =Parent.Width - 48
                  Height: =64
                  OnChange: |
                    =Set( gPrRegionId,   pickPrRegion.SelectedId );
                     Set( gPrRegionPath, pickPrRegion.SelectedPath )
            - lblPrRegionState:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =If( Len(gPrRegionPath) > 0, "✓ " & gPrRegionPath,
                         gEditMode = "Edit",
                         "Currently: " & Coalesce(gEditProject.project_region_path, "not set") & "   (leave alone to keep it)",
                         "Nothing picked yet" )
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =Parent.Width - 48
                  Height: =20
                  VerticalAlign: =VerticalAlign.Middle
            - pickPrType:
