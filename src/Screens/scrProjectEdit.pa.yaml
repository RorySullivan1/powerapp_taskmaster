      - actionBarBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            BorderColor: =gTheme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
      - actionBarRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
          Children:
            # The "Still required:" caption is folded into this one label, so
            # `Len(Self.Text) = 0` is the exact test btnPrSave.DisplayMode needs.
            - lblPrMissing:
                Control: Label@2.5.1
                Properties:
                  # ONE SOURCE OF TRUTH FOR "what is still missing", and it is this Text. A literal
                  # prefix here would make `Len(Self.Text)` always non-zero, so the emptiness could not
                  # be tested and btnPrSave would have to restate the whole condition — two copies of
                  # one rule is how they drift. Same shape as lblTxMissing / lblIssMissing / lblTkMissing.
                  Visible: =Len(Self.Text) > 0
                  Text: |
                    =Trim(
                       If( Len(Trim(txtPrName.Text)) = 0, "project name   ", "" ) &
                       If( Len(gPrManager.Mail) = 0,      "project manager   ", "" ) &
                       If( gEditMode = "New" && Len(gPrRegionPath) = 0, "Region   ", "" ) &
                       If( gEditMode = "New" && Len(gPrTypePath) = 0,   "Project type   ", "" ) &
                       // Reachable only if Choices() came back empty — the seed cannot otherwise
                       // leave this blank. That is exactly the case worth catching: an empty
                       // vocabulary would send {Value: ""} and lose the whole insert.
                       If( Len(gPrCov) = 0,                             "Coverage   ", "" ) )
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.Danger
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.Width - 512
                  Height: =48
            - btnPrCancel:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =gTheme.Color.Surface
                  Color: =gTheme.Color.Primary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =1
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Text: |
                    =If( CountRows(colNewTasks) + CountRows(colNewTransactions) > 0,
                         "Discard", "Cancel" )
                  Width: =140
                  Height: =48
                  # Clears the resume key: leaving must not leave one armed.
                  OnSelect: =Set( gPrResumeKey, "" ); Back()
            - btnPrSave:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =gTheme.Color.Primary
                  Color: =gTheme.Color.OnPrimary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =0
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Text: |
                    =If( gSaving, "Saving…",
                     If( gEditMode = "Edit", "Save project", "Create project" ) &
                     If( CountRows(colNewTasks) + CountRows(colNewTransactions) > 0,
                         " + " & ( CountRows(colNewTasks) + CountRows(colNewTransactions) ) & " item(s)", "" ) )
                  # ALWAYS ENABLED — do not put a DisplayMode gate back. A DISABLED BUTTON CANNOT FIRE
                  # OnSelect, so a record missing a required field gave a click that did nothing and said
                  # nothing. The requirement moved into OnSelect, where it can NAME the missing field.
                  Width: =300
                  Height: =48
                  OnSelect: |
                    =If( gSaving,
                    // A SECOND TAP WHILE THE FIRST WRITE IS STILL IN FLIGHT. Do nothing — a Patch takes
                    // seconds and the button stays live, so a double-tap ran the handler twice and built a
                    // SECOND record. `Set` applies immediately within a behaviour chain.
                    false,
                    Len(lblPrMissing.Text) > 0,
                    Notify( "Can't save yet — this project still needs: " & lblPrMissing.Text,
                    NotificationType.Error ),
                    Set( gSaving, true );
                    // WHETHER THE C3 ROLLUP NEEDS TO RUN, DECIDED NOW AND NOT AT STEP 5. Only a brand
                    // new project or child tasks staged in THIS save can move it, and neither can be
                    // tested where the rollup runs: by then Set(gEditMode,"Edit") has fired and step 4's
                    // RemoveIf has stripped the successful rows out of colNewTasks, so a count taken
                    // there would see only the FAILURES and read exactly backwards.
                    // gPrInsert must match the Patch's own base-record test below EXACTLY, including the
                    // self-heal for an Edit that arrived with no record — otherwise the self-heal path
                    // inserts with gPrRollup FALSE and project_perc_completion never gets its initial 0.
                    Set( gPrInsert, gEditMode = "New" || IsBlank(gEditProject.ID) );
                    // DOES THIS SAVE CROSS THE ARCHIVED BOUNDARY? Captured HERE for the same reason as
                    // gPrInsert: step 4 re-reads gEditProject from the server, after which the OLD phase
                    // is gone. An insert never crosses.
                    // NO ARCHIVE BOOKKEEPING: an external flow sets project_phase = "Archived" and OWNS
                    // the three *_project_archived child flags too.
                    Set( gPrRollup, gPrInsert || CountRows(colNewTasks) > 0 );
                    Set( gPrSaved, Blank() );
                    Set( gPrErr, "" );
                    Set( gPrWarn, "" );
                    Set( gPrNameSaved, Trim(txtPrName.Text) );
                    // gEditMode says Edit only because a previous save SAID it succeeded. If there is no
                    // record behind it, patching that record fails forever — so treat a missing ID as New
                    // and insert instead.
                    // ONE WRITE, ONE RECORD. The base record is chosen by If() and every column, required
                    // and optional, is in the single record; SharePoint's own error then names the
                    // offending column. `insert` is tested twice rather than hoisted because a Patch
                    // record is a value, not a behaviour chain, so there is nowhere to put a local.
                    IfError(
                        Set( gPrSaved,
                            Patch( taskmaster_projects,
                                If( gPrInsert,
                                    Defaults(taskmaster_projects), gEditProject ),
                                { project_name:        Trim(txtPrName.Text),
                                  project_description: txtPrDesc.Text,
                                  project_pathway:     txtPrPathway.Text,
                                  // INSERT sets the starting phase; an EDIT writes back what is already
                                  // stored. It cannot be omitted — one Patch serves both paths and a field
                                  // named in a Patch is written — so the edit path rewrites the same value
                                  // rather than clobbering a derived one.
                                  project_phase:
                                      { Value: If( gPrInsert, "Not Started",
                                                   Coalesce(gEditProject.project_phase.Value, "Not Started") ) },
                                  project_priority:    { Value: gPrPriority },
                                  project_manager:
                                      { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                        Claims:      gClaimPrefix & Lower(gPrManager.Mail),
                                        DisplayName: gPrManager.DisplayName,
                                        Email:       gPrManager.Mail,
                                        Department: "", JobTitle: "", Picture: "" },
                                  project_region_id:   gPrRegionId,
                                  project_region_path: gPrRegionPath,
                                  project_type_id:     gPrTypeId,
                                  project_type_path:   gPrTypePath,
                                  // UNGUARDED since #25: coverage is required, the strip has no blank
                                  // row, and the seed always lands on a member the column offers.
                                  // lblPrMissing still nets an empty gPrCov, because {Value: ""} is not a
                                  // member and the connector rejects the whole insert, not the field.
                                  project_coverage: { Value: gPrCov },
                                  project_date_start:    dtpPrStart.SelectedDate,
                                  project_date_target:   dtpPrTarget.SelectedDate,
                                  // Written by the Mark complete button on scrProject, the only thing
                                  // that can set the Complete phase. This screen only preserves it.
                                  project_date_complete:
                                      If( gPrInsert, Blank(), gEditProject.project_date_complete ),
                                  project_requestor:
                                      If( Len(gPrRequestor.Mail) > 0,
                                          { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                            Claims:      gClaimPrefix & Lower(gPrRequestor.Mail),
                                            DisplayName: gPrRequestor.DisplayName,
                                            Email:       gPrRequestor.Mail,
                                            Department: "", JobTitle: "", Picture: "" },
                                          Blank() ),
                                  project_supporter:
                                      If( Len(gPrSupporter.Mail) > 0,
                                          { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                            Claims:      gClaimPrefix & Lower(gPrSupporter.Mail),
                                            DisplayName: gPrSupporter.DisplayName,
                                            Email:       gPrSupporter.Mail,
                                            Department: "", JobTitle: "", Picture: "" },
                                          Blank() ) } ) ),
                        Set( gPrErr, FirstError.Message ) );
                    // TRUST THE RECORD, NEVER THE MESSAGE. A write can fail and still leave
                    // FirstError.Message empty; reading that as success set gEditProject to a
                    // BLANK record and flipped gEditMode to "Edit", after which the name box
                    // appeared to clear and every later save patched a record that did not exist.
                    If( IsBlank(gPrSaved.ID) && Len(gPrErr) = 0,
                        Set( gPrErr, "SharePoint returned no record and no error message, so nothing was saved. Check the required columns on taskmaster_projects." ) );
                    If( Len(gPrErr) > 0,
                        Notify( If(gEditMode = "New", "Couldn't create the project: ", "Couldn't save the project: ")
                                  & gPrErr,
                                NotificationType.Error ) );
                    If( Len(gPrErr) = 0 && !IsBlank(gPrSaved.ID),
                        // --- 3. children ------------------------------------------
                        // IfError's third argument is the value returned when NOTHING errored, which
                        // is how each row records success or failure without a second pass.
                        // The outcome is TEXT, not two differently-shaped collections, because IfError
                        // requires ALL its arguments to be type-compatible. Text(Patch(...).ID) forces
                        // the success arm to text; an empty Message means the row was written.
                        Clear( colChildResult ); Clear( colChildErrors ); Clear( colChildOk );
                        Clear( colChildResultT ); Clear( colChildResultX );
                        // TWO INDEPENDENT UPLOADS. Both depend only on gPrSaved and neither reads the
                        // other's rows, so they are issued together rather than back to back.
                        //
                        // THE SEPARATE RESULT COLLECTIONS ARE THE POINT, not a tidier split: the arms of
                        // Concurrent must not touch shared state, and one colChildResult written by both
                        // loops is exactly that. They are merged below; everything downstream reads the
                        // merge. Collect is also what keeps these bodies legal — ForAll may run its rows
                        // in any order, so it sanctions Patch and Collect and rules out Set.
                        Concurrent(
                            ForAll( colNewTasks As t,
                                Collect( colChildResultT,
                                    { Kind: "Task", Sid: t.sid, Name: t.t_name,
                                      Message:
                                        IfError( Text(
                                            Patch( taskmaster_tasks, Defaults(taskmaster_tasks),
                                                   // This screen cannot archive a project, so a child staged
                                                   // here is never archived.
                                                   { task_project_archived: false },
                                                { task_name:       t.t_name,
                                                  task_project_id: { Id: gPrSaved.ID, Value: gPrNameSaved },
                                                  task_stage:      { Value: t.t_stage },
                                                  // GREEN IS DERIVED, NOT PICKED — a task created
                                                  // here has no issues yet. Not a default to
                                                  // "correct" into a control.
                                                  task_status:     { Value: "Green" },
                                                  task_priority:   { Value: t.t_priority },
                                                  task_lead:
                                                      { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                        Claims:      gClaimPrefix & Lower(t.t_leadMail),
                                                        DisplayName: t.t_leadName,
                                                        Email:       t.t_leadMail,
                                                        Department: "", JobTitle: "", Picture: "" },
                                                  task_date_start:  Now(),
                                                  task_date_target: t.t_target } )
                                        .ID ),
                                        FirstError.Message,
                                        "" ) } ) ),
                            ForAll( colNewTransactions As x,
                                Collect( colChildResultX,
                                    { Kind: "Transaction", Sid: x.sid, Name: x.x_name,
                                      Message:
                                        IfError( Text(
                                            Patch( taskmaster_transactions, Defaults(taskmaster_transactions),
                                                   // This screen cannot archive a project, so a child staged
                                                   // here is never archived.
                                                   { transaction_project_archived: false },
                                                { transaction_name:        x.x_name,
                                                  transaction_project_id:  { Id: gPrSaved.ID, Value: gPrNameSaved },
                                                  transaction_client_name: { Id: x.x_clientId,  Value: x.x_clientValue },
                                                  transaction_product_id:  { Id: x.x_productId, Value: x.x_productValue },
                                                  transaction_sales:
                                                      { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                        Claims:      gClaimPrefix & Lower(x.x_salesMail),
                                                        DisplayName: x.x_salesName,
                                                        Email:       x.x_salesMail,
                                                        Department: "", JobTitle: "", Picture: "" },
                                                  transaction_currency:    { Value: x.x_ccy },
                                                  transaction_notional:
                                                      x.x_notional,
                                                  transaction_date:        x.x_date } )
                                        .ID ),
                                        FirstError.Message,
                                        "" ) } ) ) );
                        // Order is not guaranteed within a loop and now not between them either. Nothing
                        // downstream depends on it: the error/ok splits filter on Message, and the
                        // Save-to-retry RemoveIf matches on Sid.
                        Collect( colChildResult, colChildResultT );
                        Collect( colChildResult, colChildResultX );
                        Collect( colChildErrors,
                                 ShowColumns( Filter(colChildResult, Len(Message) > 0), Kind, Name, Message ) );
                        Collect( colChildOk,
                                 ShowColumns( Filter(colChildResult, Len(Message) = 0), Kind, Sid ) );
                        RemoveIf( colNewTasks,
                                  sid in ShowColumns( Filter(colChildOk, Kind = "Task"), Sid ) );
                        RemoveIf( colNewTransactions,
                                  sid in ShowColumns( Filter(colChildOk, Kind = "Transaction"), Sid ) );
                        // --- 4. the project now EXISTS. Never insert it twice. -----
                        // READ IT BACK rather than reusing Patch's return value: that record is not
                        // guaranteed to carry every column, and this one seeds the whole form, so a
                        // thin record empties the name box in front of the user. Two statements rather
                        // than Coalesce — Coalesce is documented over VALUES, not records.
                        Set( gEditProject, LookUp(taskmaster_projects, ID = gPrSaved.ID) );
                        If( IsBlank(gEditProject.ID), Set( gEditProject, gPrSaved ) );
                        Set( gEditMode, "Edit" );
                        Set( gSelProject, gEditProject );
                        // --- 5. C3 rollup, read back from the server ---------------
                        // SKIPPED ENTIRELY unless gPrRollup said so at the top of this handler: it costs a
                        // Filter over up to 500 task rows plus a write, and a stage-weighted average cannot
                        // depend on a rename or a date change.
                        // A NEW project always runs it, and that is load-bearing: the main Patch never writes
                        // project_perc_completion, so with no tasks staged this is the only thing that
                        // lands the initial 0.
                        If( gPrRollup,
                        With( { pid: gPrSaved.ID },
                            With( { scored:
                                      AddColumns(
                                          Filter( taskmaster_tasks,
                                              task_project_id.Id = pid ),
                                          wgt, Coalesce(LookUp(gStageWeights, Stage = task_stage.Value, Weight), 0) ) },
                                If( CountRows(scored) >= 500,
                                    Notify("Project saved. It has too many tasks to compute completion accurately, so it was left unchanged.",
                                           NotificationType.Warning),
                                    // Don't spend a write on a number that has not moved. gEditProject was
                                    // re-read from the server four lines up, so it carries the stored value.
                                    With( { newPc: If( CountRows(scored) = 0, 0,
                                                       RoundDown(Average(scored, wgt), 0) ) },
                                        // Coalesce to -1, NOT a bare compare. A just-inserted row has NULL and
                                        // newPc is 0 for a project with no tasks, so `0 <> Blank()` may be FALSE,
                                        // skipping the write and leaving NULL. Average() drops blanks from the
                                        // denominator, so portfolio completion then reads HIGH.
                                        If( newPc <> Coalesce(gEditProject.project_perc_completion, -1),
                                    IfError(
                                        Set( gSelProject,
                                            Patch( taskmaster_projects, gPrSaved,
                                                   { project_perc_completion: newPc } ) ), Set( gPrWarn, gPrWarn & "Project saved, but the completion rollup didn't update: " & FirstError.Message & "   " )) ) ) ) ) ) );
                        // --- 6. NO ARCHIVE CASCADE ----------------------
                        // The phase control is gone, so the app cannot archive anything. THE EXTERNAL
                        // CLEANUP FLOW OWNS BOTH HALVES: project_phase = "Archived" AND
                        // task_project_archived / transaction_project_archived / issue_project_archived
                        // on every child. A flow that does the first without the second leaves the
                        // children in every query.
                        If( Len(gPrWarn) > 0,
                            Notify( "Project saved, but: " & gPrWarn, NotificationType.Warning ) );
                        If( IsEmpty(colChildErrors),
                            Notify("Project saved with everything attached.", NotificationType.Success);
                            Set( gPrResumeKey, "" );
                            Navigate( scrProject, ScreenTransition.Cover ),
                            Notify( CountRows(colChildErrors) & " item(s) could not be created — they are still listed below, press Save to retry."
                                      & "   " & First(colChildErrors).Kind & " """ & First(colChildErrors).Name & """: "
                                      & First(colChildErrors).Message,
                                    NotificationType.Error ) )
                    );
                    Set( gSaving, false ) )
