                           Set( gNtName, ThisItem.t_name ); Set( gNtTarget, ThisItem.t_target );
                           Set( gNtPriority, ThisItem.t_priority );
                           Set( gNtLead, { DisplayName: ThisItem.t_leadName, Mail: ThisItem.t_leadMail } );
