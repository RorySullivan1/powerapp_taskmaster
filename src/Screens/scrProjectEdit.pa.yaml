# Create / edit a project, plus its staged child tasks and transactions.
# Layout bands (tablet 1366x768): 0..64 header, 64..680 scrolling form, 680..768 action bar.
# The action bar is OPAQUE and absolute — the scroll must not bleed under it.
# The action bar and the form sheet share one anchor expression — change them together.
Screens:
  scrProjectEdit:
    Properties:
      Fill: =gTheme.Color.Bg
      OnVisible: |
        =Set( gSaving, false );   // see btnPrSave
        // WHICH project this visit is for. Everything below is a SEED or a CLEAR, and
        // returning from "+ New client/product" inside the staged-transaction modal must not
        // run any of it — colNewTasks and colNewTransactions hold work that exists nowhere
        // else until the project is saved. Keyed on identity, not a bare boolean, so a flag
        // left armed by abandoning the create flow cannot match a different project.
        Set( gPrKey, If( gEditMode = "Edit", "E" & gEditProject.ID, "N" ) );
        If( gPrResumeKey = gPrKey && Len(gPrKey) > 0,
        Set( gPrResumeKey, "" ),
        Set( gPrManager,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditProject.project_manager.DisplayName, ""),
                    Mail:        Coalesce(gEditProject.project_manager.Email, "") },
                  { DisplayName: Coalesce(User().FullName, ""), Mail: Coalesce(User().Email, "") } ) );
        Set( gPrRequestor,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditProject.project_requestor.DisplayName, ""),
                    Mail:        Coalesce(gEditProject.project_requestor.Email, "") },
                  { DisplayName: "", Mail: "" } ) );
        Set( gPrSupporter,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditProject.project_supporter.DisplayName, ""),
                    Mail:        Coalesce(gEditProject.project_supporter.Email, "") },
                  { DisplayName: "", Mail: "" } ) );
        // Priority opens on its column default. The phase is DERIVED on scrProject and this
        // screen offers no control for it.
        Set( gPrPriority, If( gEditMode = "Edit", Coalesce(gEditProject.project_priority.Value, "Moderate"), "Moderate" ) );
        // ONCE PER SESSION, NOT ONCE PER VISIT. Both are whole reference lists that change on
        // the order of weeks; an EMPTY collection is the only reason to pull one again, and a
        // new term is picked up on the next app start. IsEmpty, never IsBlank: these are tables.
        Concurrent(
            If( IsEmpty(colMapRegion),   ClearCollect( colMapRegion,   mapping_regions ) ),
            If( IsEmpty(colMapActivity), ClearCollect( colMapActivity, mapping_activitytype ) ) );
        Set( gPrRegionId,   If( gEditMode = "Edit", Coalesce(gEditProject.project_region_id, 0), 0 ) );
        Set( gPrRegionPath, If( gEditMode = "Edit", Coalesce(gEditProject.project_region_path, ""), "" ) );
        Set( gPrTypeId,     If( gEditMode = "Edit", Coalesce(gEditProject.project_type_id, 0), 0 ) );
        Set( gPrTypePath,   If( gEditMode = "Edit", Coalesce(gEditProject.project_type_path, ""), "" ) );
        // cmpSelection needs {Id, Label} and Choices() returns only Value, so the Id is
        // synthesised POSITIONALLY. The Ids mean nothing beyond "which row" — never hard-code
        // one; each DefaultId looks its value up by Label. Required columns get no blank row.
        // Cached for the session like the mapping lists above; colPrCovOpts MUST be loaded
        // before the gPrCov seed below, which resolves the stored value against it.
        Concurrent(
            If( IsEmpty(colPrPriorityOpts),
                ClearCollect( colPrPriorityOpts,
                      With( { ch: Choices([@taskmaster_projects].project_priority) },
                            ForAll( Sequence( CountRows(ch) ) As n,
                                    { Id: n.Value, Label: Index(ch, n.Value).Value } ) ) ) ),
            If( IsEmpty(colPrCovOpts),
                ClearCollect( colPrCovOpts,
                      With( { ch: Choices([@taskmaster_projects].project_coverage) },
                            ForAll( Sequence( CountRows(ch) ) As n,
                                    { Id: n.Value, Label: Index(ch, n.Value).Value } ) ) ) ) );
        // THREE BRANCHES, AND THE THIRD IS NOT PARANOIA. project_coverage is the ONE column
        // whose real vocabulary this repo has never been told — schema.yaml still carries a
        // PLACEHOLDER beside the one confirmed value — so "Internal" is a literal the app
        // cannot verify. Stored value if the column still offers it; else the default if the
        // column offers THAT; else whatever it does offer, so a wrong guess degrades to a real
        // member instead of writing one the connector will reject.
        Set( gPrCov,
             With( { v: If( gEditMode = "Edit", Coalesce(gEditProject.project_coverage.Value, ""), "" ) },
                 If( Len(v) > 0 && v in colPrCovOpts.Label, v,
                     "Internal" in colPrCovOpts.Label,          "Internal",
                                                                First(colPrCovOpts).Label ) ) );
        Clear( colNewTasks ); Clear( colNewTransactions );
        If( gEditMode = "Edit",
            ClearCollect( colLinkedTasks, Filter(taskmaster_tasks, task_project_id.Id = gEditProject.ID) );
            ClearCollect( colLinkedTx,    Filter(taskmaster_transactions, transaction_project_id.Id = gEditProject.ID) ),
            Clear( colLinkedTasks ); Clear( colLinkedTx ) );
        Clear( colChildResult ); Clear( colChildErrors ); Clear( colChildOk );
        Set( gNtOpen, false ); Set( gNxOpen, false );
        Set( gNtEditSid, 0 ); Set( gNxEditSid, 0 );
        Set( gNtName, "" ); Set( gNtTarget, Blank() );
        Set( gNxName, "" ); Set( gNxDate, Blank() ); Set( gNxNotional, Blank() );
        // Both modal option lists come from their columns, not a literal copy. Neither
        // carries a "(none)" row — both columns are REQUIRED. The Opts suffix keeps these
        // clear of the col* CONTAINER names this screen also uses: a collection named after
        // a control resolves to the control.
        Concurrent(
            If( IsEmpty(colNtPrioOpts),
                ClearCollect( colNtPrioOpts,
                      ForAll( Choices([@taskmaster_tasks].task_priority) As c,
                              { Value: c.Value } ) ) ),
            If( IsEmpty(colNxCcyOpts),
                ClearCollect( colNxCcyOpts,
                      ForAll( Choices([@taskmaster_transactions].transaction_currency) As c,
                              { Value: c.Value } ) ) ) );
        // Every default below is a REAL member of the matching Choice column in
        // schema/schema.yaml. Do not seed a value the list does not have.
        Set( gNtPriority, "Moderate" );
        Set( gNtLead,     { DisplayName: "", Mail: "" } );
        Set( gNxCcy,      "USD" );
        Set( gNxSales,    { DisplayName: "", Mail: "" } );
        Set( gNxClient,   { Id: 0, Value: "" } );
        Set( gNxProduct,  { Id: 0, Value: "" } );
        // Text inputs and date pickers re-read their Default only on Reset. Missing these
        // was how an Edit opened with blank dates and then wrote Blank() over the stored ones.
        Reset( txtPrName ); Reset( txtPrPathway ); Reset( txtPrDesc );
        Reset( dtpPrStart ); Reset( dtpPrTarget );
        Set( gPrPicker, "" ); Set( gPrQuery, "" ); Reset( cmpPrPick );
        Reset( txtNtName ); Reset( dtpNtTarget );
        Reset( txtNxName ); Reset( dtpNxDate ); Reset( numNxNotional );
        // Same rule for every combo box: DefaultSelectedItems is re-read only on Reset.
        // Without this, opening project B after A leaves A's priority showing while
        // gPrPriority already holds B's — and re-picking the displayed value fires no
        // OnChange, so the correction cannot be made by hand.
        Reset( selPrPriority );
        // The pickers DO need resetting. A component's inner combo boxes read their
        // DefaultSelectedItems once, so clearing gPrRegionPath is not enough — Reset() on the
        // INSTANCE fires the component's OnReset, the only way in from here. Must come after
        // the Set()s above, so DefaultPath is already cleared.
        Reset( pickPrRegion ); Reset( pickPrType );
        Reset( selPrCov );
        Reset( cboNtPriority ); Reset( cboNxCcy ) )
    Children:
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Primary
            Height: =gTheme.Space.HeaderH
            Width: =Parent.Width
            X: =0
            Y: =0
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: =If(gEditMode = "Edit", "Edit project", "New project")
            Color: =gTheme.Color.OnPrimary
            Font: =gTheme.Font
            FontWeight: =FontWeight.Semibold
            Size: =gTheme.Size.H2
            Height: =gTheme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =gTheme.Space.Gutter
            Y: =0
            Width: =360
      - lblPrStagedCount:
          Control: Label@2.5.1
          Properties:
            Visible: |
              =CountRows(colNewTasks) + CountRows(colNewTransactions) > 0
            Text: |
              =CountRows(colNewTasks) & " task · " & CountRows(colNewTransactions)
               & " transaction  —  staged, not yet saved"
            Color: =gTheme.Color.OnPrimary
            Font: =gTheme.Font
            Size: =gTheme.Size.Small
            Align: =Align.Right
            Height: =gTheme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Parent.Width - 520 - gTheme.Space.Gutter
            Y: =0
            Width: =480
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =gTheme.Color.OnPrimary
            HoverColor: =gTheme.Color.OnPrimary
            HoverFill: =RGBA(255, 255, 255, 0.15)
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            Height: =24
            Width: =24
            X: =Parent.Width - 24 - gTheme.Space.Gutter
            Y: =(gTheme.Space.HeaderH - 24) / 2
            # Clears the resume key: leaving must not leave one armed.
            OnSelect: =Set( gPrResumeKey, "" ); Back()
      # =======================================================================
      # FORM BAND  ·  64 .. Parent.Height - 88
      # An opaque sheet behind the scrolling column. Same anchor expression as
      # frmPrScroll — edit one and you must edit the other.
      # =======================================================================
      - formSheet:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 88
      - frmPrScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =20
            PaddingBottom: =28
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 88
          Children:
            - secHeadDetails:
                Control: Label@2.5.1
                Properties:
                  Text: ="Details"
                  Font: =gTheme.Font
                  FontWeight: =FontWeight.Semibold
                  Size: =gTheme.Size.H3
                  Color: =gTheme.Color.Primary
                  Width: =Parent.Width - 48
                  Height: =24
            # AUTO-LAYOUT, not a grid: a GridLayout child spanning two of three columns did not
            # render at the intended width on scrIssueEdit, so the split is FillPortions 2 and 1.
            - rowPrD1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =16
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - colPrName:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =8
                        FillPortions: =2
                        LayoutMinWidth: =280
                        Height: =62
                      Children:
                        - lblPrNameCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Project name  *"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width
                              Height: =18
                        - txtPrName:
                            Control: ModernTextInput@1.1.1
                            Properties:
                              Default: =If(gEditMode = "Edit", gEditProject.project_name, "")
                              Placeholder: ="What is this project called?"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Body
                              FillPortions: =0
                              LayoutMinHeight: =36
                              Width: =Parent.Width
                              Height: =36
                  - colPrPriority:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =8
                        FillPortions: =1
                        LayoutMinWidth: =190
                        Height: =62
                      Children:
                        - lblPrPriorityCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Priority  *"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width
                              Height: =18
                        # FontSize 10: five options sharing a third of the row.
                        - selPrPriority:
                            Control: CanvasComponent
                            ComponentName: cmpSelection
                            Properties:
                              FontSize: =10
                              Width: =Parent.Width
                              Height: =36
                              Items: =colPrPriorityOpts
                              DefaultId: |
                                =Coalesce( LookUp(colPrPriorityOpts, Label = gPrPriority, Id), 1 )
                              OnChange: =Set(gPrPriority, selPrPriority.Selected.Label)
            - rowPrD2:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =3
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblPrStartCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Start date"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Width: =Parent.Width
                        Height: =18
                  - dtpPrStart:
                      Control: ModernDatePicker@1.0.1
                      Properties:
                        DefaultDate: =If(gEditMode = "Edit", gEditProject.project_date_start, Blank())
                        Placeholder: ="Actual start date"
                        Format: =DatePickerFormat.LongAbbreviated
                        StartOfWeek: =StartOfWeek.Monday
                        IsEditable: =true
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Width: =Parent.Width
                        Height: =36
                  - lblPrTargetCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Target date"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Width: =Parent.Width
                        Height: =18
                  - dtpPrTarget:
                      Control: ModernDatePicker@1.0.1
                      Properties:
                        DefaultDate: =If(gEditMode = "Edit", gEditProject.project_date_target, Blank())
                        Placeholder: ="Target completion"
                        Format: =DatePickerFormat.LongAbbreviated
                        StartOfWeek: =StartOfWeek.Monday
                        IsEditable: =true
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Width: =Parent.Width
                        Height: =36
                  - lblPrPathCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Shared-drive path"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =3
                        LayoutGridColumnEnd: =3
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Width: =Parent.Width
                        Height: =18
                  - txtPrPathway:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: =If(gEditMode = "Edit", gEditProject.project_pathway, "")
                        Placeholder: ="\\share\eqd\projects\…"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        LayoutGridColumnStart: =3
                        LayoutGridColumnEnd: =3
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Width: =Parent.Width
                        Height: =36
            - rowPrD3:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =24
                  Width: =Parent.Width - 48
                  Height: =110
                Children:
                  - colPrDesc:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =Parent.Width
                        Height: =110
                      Children:
                        - lblPrDescCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Description"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - txtPrDesc:
                            Control: ModernTextInput@1.1.1
                            Properties:
                              Default: =If(gEditMode = "Edit", gEditProject.project_description, "")
                              Type: =TextInputType.Multiline
                              Placeholder: ="Background, scope, anything the desk should know."
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Width: =Parent.Width
                              Height: =84
            - divPrPeople:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =gTheme.Color.Border
                  Width: =Parent.Width - 48
                  Height: =1
            - secHeadPeople:
                Control: Label@2.5.1
                Properties:
                  Text: ="People"
                  Font: =gTheme.Font
                  FontWeight: =FontWeight.Semibold
                  Size: =gTheme.Size.H3
                  Color: =gTheme.Color.Primary
                  Width: =Parent.Width - 48
                  Height: =24
            - rowPrPeople:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =16
                  Width: =Parent.Width - 48
                  Height: =58
                Children:
                  - colPrMgr:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =6
                        Width: =(Parent.Width - 32) / 3
                        Height: =58
                      Children:
                        - fldManager:
                            Control: CanvasComponent
                            ComponentName: cmpLookupField
                            Properties:
                              Caption: ="Project manager  *"
                              PickLabel: ="＋  Choose a manager"
                              HasValue: =Len(gPrManager.Mail) > 0
                              Display: =gPrManager.DisplayName
                              Width: =Parent.Width
                              Height: =62
                              OnPick: |
                                =Set( gPrPicker, "Manager" );
                                 Reset( cmpPrPick );
                                 Set( gPrQuery, "" )
                              OnClear: |
                                =Set( gPrManager, { DisplayName: "", Mail: "" } )
                  - colPrReq:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =6
                        Width: =(Parent.Width - 32) / 3
                        Height: =58
                      Children:
                        - fldRequestor:
                            Control: CanvasComponent
                            ComponentName: cmpLookupField
                            Properties:
                              Caption: ="Requestor"
                              PickLabel: ="＋  Choose a requestor"
                              HasValue: =Len(gPrRequestor.Mail) > 0
                              Display: =gPrRequestor.DisplayName
                              Width: =Parent.Width
                              Height: =62
                              OnPick: |
                                =Set( gPrPicker, "Requestor" );
                                 Reset( cmpPrPick );
                                 Set( gPrQuery, "" )
                              OnClear: |
                                =Set( gPrRequestor, { DisplayName: "", Mail: "" } )
                  - colPrSup:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =6
                        Width: =(Parent.Width - 32) / 3
                        Height: =58
                      Children:
                        - fldSupporter:
                            Control: CanvasComponent
                            ComponentName: cmpLookupField
                            Properties:
                              Caption: ="Supporter"
                              PickLabel: ="＋  Choose a supporter"
                              HasValue: =Len(gPrSupporter.Mail) > 0
                              Display: =gPrSupporter.DisplayName
                              Width: =Parent.Width
                              Height: =62
                              OnPick: |
                                =Set( gPrPicker, "Supporter" );
                                 Reset( cmpPrPick );
                                 Set( gPrQuery, "" )
                              OnClear: |
                                =Set( gPrSupporter, { DisplayName: "", Mail: "" } )
            - divPrClass:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =gTheme.Color.Border
                  Width: =Parent.Width - 48
                  Height: =1
            - secHeadClassification:
                Control: Label@2.5.1
                Properties:
                  Text: ="Classification"
                  Font: =gTheme.Font
                  FontWeight: =FontWeight.Semibold
                  Size: =gTheme.Size.H3
                  Color: =gTheme.Color.Primary
                  Width: =Parent.Width - 48
                  Height: =24
            # Region and Project type are 3-level vocabularies, so each gets a cmpNestedSelect.
            # Height is fixed at 64: a canvas component cannot size itself to its content.
            - pickPrRegion:
                Control: CanvasComponent
                ComponentName: cmpNestedSelect
                Properties:
                  Terms: =colMapRegion
                  Caption: ="Region  *"
                  DefaultPath: =gPrRegionPath
                  Separator: =" | "
                  Width: =Parent.Width - 48
                  Height: =64
                  OnChange: |
                    =Set( gPrRegionId,   pickPrRegion.SelectedId );
                     Set( gPrRegionPath, pickPrRegion.SelectedPath )
            - lblPrRegionState:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =If( Len(gPrRegionPath) > 0, "✓ " & gPrRegionPath,
                         gEditMode = "Edit",
                         "Currently: " & Coalesce(gEditProject.project_region_path, "not set") & "   (leave alone to keep it)",
                         "Nothing picked yet" )
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  Width: =Parent.Width - 48
                  Height: =20
                  VerticalAlign: =VerticalAlign.Middle
            - pickPrType:
                Control: CanvasComponent
                ComponentName: cmpNestedSelect
                Properties:
                  Terms: =colMapActivity
                  Caption: ="Project type  *"
                  DefaultPath: =gPrTypePath
                  Separator: =" | "
                  Width: =Parent.Width - 48
                  Height: =64
                  OnChange: |
                    =Set( gPrTypeId,   pickPrType.SelectedId );
                     Set( gPrTypePath, pickPrType.SelectedPath )
            - lblPrTypeState:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =If( Len(gPrTypePath) > 0, "✓ " & gPrTypePath,
                         gEditMode = "Edit",
                         "Currently: " & Coalesce(gEditProject.project_type_path, "not set") & "   (leave alone to keep it)",
                         "Nothing picked yet" )
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  Width: =Parent.Width - 48
                  Height: =20
                  VerticalAlign: =VerticalAlign.Middle
            - lblCapPrCov:
                Control: Label@2.5.1
                Properties:
                  Text: ="Coverage"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  Width: =Parent.Width - 48
                  Height: =18
            # FontSize 10: coverage can carry several options across the full form width,
            # and the labels are business terms rather than single words.
            - selPrCov:
                Control: CanvasComponent
                ComponentName: cmpSelection
                Properties:
                  FontSize: =10
                  Width: =Parent.Width - 48
                  Height: =36
                  Items: =colPrCovOpts
                  DefaultId: =Coalesce( LookUp(colPrCovOpts, Label = gPrCov, Id), 1 )
                  OnChange: =Set( gPrCov, selPrCov.Selected.Label )
            - divPrStaged:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =gTheme.Color.Border
                  Width: =Parent.Width - 48
                  Height: =1
            # ---------------------------------------------------------------------
            # STAGED CHILDREN — two columns, side by side, at the bottom. Fixed 332px however
            # many items are staged; the lists scroll inside their own column instead of pushing
            # the action bar down.
            # 332 = 36 button + 8 gap + 288 gallery, and 288 is 9 WHOLE rows of 32. The exact
            # multiple is the point: a height that is not one leaves a half-drawn last row.
            # THREE levels of FillPortions have to agree, and each defaults to 1: rowPrStaged
            # inside frmPrScroll (vertical, so FillPortions is height), then the button and the
            # gallery inside each column. Pin everything fixed at 0 and let ONE child absorb.
            # The row inside the gallery template is auto-layout, NOT absolute: the x is pinned
            # right by FillPortions 0 against a label with FillPortions 1, so it cannot drift
            # over the text. The label carries OnSelect, so no overlay button is needed.
            # ---------------------------------------------------------------------
            - rowPrStaged:
