                        Width: =285                 # 329 - 44, leaves room for the ✕
                        Height: =30
                  - chipNiHit:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        X: =0
                        Y: =0
                        Width: =297                 # 329 - 32, stops short of the ✕
                        Height: =30
                        OnSelect: |
                          =Select(Parent);
                           Set( gNiName, ThisItem.i_name );
                           Set( gNiStatus, ThisItem.i_status ); Set( gNiImpact, ThisItem.i_impact );
                           Set( gNiAssignee, { DisplayName: ThisItem.i_assigneeName, Mail: ThisItem.i_assigneeMail } );
                           Set( gNiEditSid, ThisItem.sid );
                           Reset(txtNiName); Reset(cboNiStatus); Reset(cboNiImpact); Reset(txtNiAssSearch);
                           Set( gNiOpen, true )
                  - chipNiDel:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Icon: =Icon.Cancel
                        Color: =Theme.Color.TextMuted
                        X: =299                     # 329 - 30: hard right of the chip
                        Y: =8
                        Width: =14
                        Height: =14
                        OnSelect: =RemoveIf(colNewIssues, sid = ThisItem.sid)
      - actionBarBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Surface
            BorderColor: =Theme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
      - actionBarRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
          Children:
            # Message first, buttons right — and the "Still required:" caption is
            # folded into this one label, so `Len(Self.Text) = 0` is still the exact
            # test btnPrSave.DisplayMode needs.
            - lblPrMissing:
                Control: Label@2.5.1
                Properties:
                  Visible: |
                    =Len(Trim(txtPrName.Text)) = 0
                     || Len(gPrManager.Mail) = 0
                     || ( gEditMode = "New" && ( Len(gPrRegionPath) = 0 || Len(gPrTypePath) = 0 ) )
                  # Deliberately flat: one Trim over an &-chain, no With and no inline
                  # record. The nested version was correct but fragile to hand-edit —
                  # a single `&` mistyped as `,` turns it into Trim(a, b) and Studio
                  # reports "expected 1 argument, not 2", which reads like a bug in the
                  # formula rather than a typo. Nothing here takes more than one argument.
                  Text: |
                    ="Still required:   " &
                     Trim(
                       If( Len(Trim(txtPrName.Text)) = 0, "project name   ", "" ) &
                       If( Len(gPrManager.Mail) = 0,      "project manager   ", "" ) &
                       If( gEditMode = "New" && Len(gPrRegionPath) = 0, "Region   ", "" ) &
                       If( gEditMode = "New" && Len(gPrTypePath) = 0,   "Project type   ", "" ) )
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.Danger
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.Width - 512
                  Height: =48
            - btnPrCancel:
                Control: ModernButton@1.0.0
                Properties:
                  Appearance: =ButtonAppearance.Outline
                  Text: |
                    =If( CountRows(colNewTasks) + CountRows(colNewTransactions) + CountRows(colNewIssues) > 0,
                         "Discard", "Cancel" )
                  Width: =140
                  Height: =48
                  OnSelect: =Back()
            - btnPrSave:
                Control: ModernButton@1.0.0
                Properties:
                  Appearance: =ButtonAppearance.Primary
                  Text: |
                    =If( gEditMode = "Edit", "Save project", "Create project" ) &
                     If( CountRows(colNewTasks) + CountRows(colNewTransactions) + CountRows(colNewIssues) > 0,
                         " + " & ( CountRows(colNewTasks) + CountRows(colNewTransactions) + CountRows(colNewIssues) ) & " item(s)", "" )
                  DisplayMode: |
                    =If( Len(Trim(txtPrName.Text)) > 0
                         && Len(gPrManager.Mail) > 0
                         && ( gEditMode = "Edit" || ( Len(gPrRegionPath) > 0 && Len(gPrTypePath) > 0 ) ),
                         DisplayMode.Edit, DisplayMode.Disabled )
                  Width: =300
                  Height: =48
                  OnSelect: |
                    =Set( gPrSaved, Blank() );
                    Set( gPrErr, "" );
                    Set( gPrWarn, "" );
                    If( gEditMode = "New",
                        IfError(
                            Set( gPrSaved,
                                Patch( taskmaster_projects, Defaults(taskmaster_projects),
                                    { project_name:        Trim(txtPrName.Text),
                                      project_description: txtPrDesc.Text,
                                      project_pathway:     txtPrPathway.Text,
                                      project_phase:       { Value: gPrPhase },
                                      project_priority:    { Value: gPrPriority },
                                      project_manager:
                                          { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                            Claims:      ClaimPrefix & Lower(gPrManager.Mail),
                                            DisplayName: gPrManager.DisplayName,
                                            Email:       gPrManager.Mail,
                                            Department: "", JobTitle: "", Picture: "" },
                                      // Classification is two plain columns per vocabulary
                                      // now — a Number and a Text. No taxonomy record, no
                                      // connector shape to get right (C11).
                                      project_region_id:   gPrRegionId,
                                      project_region_path: gPrRegionPath,
                                      project_type_id:     gPrTypeId,
                                      project_type_path:   gPrTypePath,
                                      project_coverage:    { Value: gPrCov },
                                      project_date_start:    dtpPrStart.SelectedDate,
                                      project_date_target:   dtpPrTarget.SelectedDate,
                                      project_date_complete:
                                                        If( gPrPhase = "Complete",
                                                            Coalesce(gEditProject.project_date_complete, Now()),
                                                            gEditProject.project_date_complete ) } ) ),
                            Set( gPrErr, FirstError.Message ) ),
                        IfError(
                            Set( gPrSaved,
                                Patch( taskmaster_projects, gEditProject,
                                    { project_name:        Trim(txtPrName.Text),
                                      project_description: txtPrDesc.Text,
                                      project_pathway:     txtPrPathway.Text,
                                      project_phase:       { Value: gPrPhase },
                                      project_priority:    { Value: gPrPriority },
                                      project_manager:
                                          { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                            Claims:      ClaimPrefix & Lower(gPrManager.Mail),
                                            DisplayName: gPrManager.DisplayName,
                                            Email:       gPrManager.Mail,
                                            Department: "", JobTitle: "", Picture: "" },
                                      project_date_start:    dtpPrStart.SelectedDate,
                                      project_date_target:   dtpPrTarget.SelectedDate,
                                      project_date_complete:
                                                        If( gPrPhase = "Complete",
                                                            Coalesce(gEditProject.project_date_complete, Now()),
                                                            gEditProject.project_date_complete ) } ) ),
                            Set( gPrErr, FirstError.Message ) ) );
                    If( Len(gPrErr) > 0,
                        Notify( If(gEditMode = "New", "Couldn't create the project: ", "Couldn't save the project: ")
                                  & gPrErr,
                                NotificationType.Error ) );
                    If( Len(gPrErr) = 0,
                        // --- 2. optional / re-picked parent fields ----------------
                        If( Len(gPrRequestor.Mail) > 0,
                            IfError( Set( gPrOpt, Patch(taskmaster_projects, gPrSaved,
                                           { project_requestor:
                                               { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                 Claims:      ClaimPrefix & Lower(gPrRequestor.Mail),
                                                 DisplayName: gPrRequestor.DisplayName,
                                                 Email:       gPrRequestor.Mail,
                                                 Department: "", JobTitle: "", Picture: "" } }) ), Set( gPrWarn, gPrWarn & "the requestor didn't stick: " & FirstError.Message & "   " )),
                            gEditMode = "Edit",
                            IfError( Set( gPrOpt, Patch(taskmaster_projects, gPrSaved, { project_requestor: Blank() }) ), Set( gPrWarn, gPrWarn & "the requestor didn't clear: " & FirstError.Message & "   " )) );
                        If( Len(gPrSupporter.Mail) > 0,
                            IfError( Set( gPrOpt, Patch(taskmaster_projects, gPrSaved,
                                           { project_supporter:
                                               { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                 Claims:      ClaimPrefix & Lower(gPrSupporter.Mail),
                                                 DisplayName: gPrSupporter.DisplayName,
                                                 Email:       gPrSupporter.Mail,
                                                 Department: "", JobTitle: "", Picture: "" } }) ), Set( gPrWarn, gPrWarn & "the supporter didn't stick: " & FirstError.Message & "   " )),
                            gEditMode = "Edit",
                            IfError( Set( gPrOpt, Patch(taskmaster_projects, gPrSaved, { project_supporter: Blank() }) ), Set( gPrWarn, gPrWarn & "the supporter didn't clear: " & FirstError.Message & "   " )) );
                        // Classification on EDIT only — on New these went in with the
                        // insert. One Patch each, so a failure can't take the record down.
                        If( gEditMode = "Edit" && Len(gPrRegionPath) > 0,
                            IfError( Set( gPrOpt, Patch(taskmaster_projects, gPrSaved,
                                           { project_region_id: gPrRegionId,
                                             project_region_path: gPrRegionPath }) ), Set( gPrWarn, gPrWarn & "the region didn't stick: " & FirstError.Message & "   " )) );
                        If( gEditMode = "Edit" && Len(gPrTypePath) > 0,
                            IfError( Set( gPrOpt, Patch(taskmaster_projects, gPrSaved,
                                           { project_type_id: gPrTypeId,
                                             project_type_path: gPrTypePath }) ), Set( gPrWarn, gPrWarn & "the type didn't stick: " & FirstError.Message & "   " )) );
                        If( gEditMode = "Edit" && Len(gPrCov) > 0,
                            IfError( Set( gPrOpt, Patch(taskmaster_projects, gPrSaved,
                                           { project_coverage: { Value: gPrCov } }) ), Set( gPrWarn, gPrWarn & "the coverage didn't stick: " & FirstError.Message & "   " )) );
                        If( gEditMode = "Edit" && Len(gPrCov) = 0 && !IsBlank(gEditProject.project_coverage),
                            IfError( Set( gPrOpt, Patch(taskmaster_projects, gPrSaved,
                                           { project_coverage: Blank() }) ), Set( gPrWarn, gPrWarn & "the coverage didn't clear: " & FirstError.Message & "   " )) );
                        // --- 3. children ------------------------------------------
                        // IfError's third argument is the value returned when NOTHING
                        // errored, which is how each row records success or failure
                        // without a second pass over the data.
                        //
                        // It records the outcome as TEXT, not by collecting into two
                        // different collections, because IfError currently requires ALL
                        // its arguments to be type-compatible — a record from Patch
                        // against two differently-shaped tables from Collect is rejected.
                        // Text(Patch(…).ID) forces the success arm to text so all three
                        // arms match; an empty Message means the row was written.
                        Clear( colChildResult ); Clear( colChildErrors ); Clear( colChildOk );
                        ForAll( colNewTasks As t,
                            Collect( colChildResult,
                                { Kind: "Task", Sid: t.sid, Name: t.t_name,
                                  Message:
                                    IfError( Text(
                                        Patch( taskmaster_tasks, Defaults(taskmaster_tasks),
                                            { task_name:       t.t_name,
                                              task_project_id: { Id: gPrSaved.ID, Value: gPrSaved.project_name },
                                              task_stage:      { Value: t.t_stage },
                                              task_status:     { Value: "Green" },
                                              task_priority:   { Value: t.t_priority },
                                              task_lead:
                                                  { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                    Claims:      ClaimPrefix & Lower(t.t_leadMail),
                                                    DisplayName: t.t_leadName,
                                                    Email:       t.t_leadMail,
                                                    Department: "", JobTitle: "", Picture: "" },
                                              task_date_start:  Now(),
                                              task_date_target: t.t_target } )
                                    .ID ),
                                    FirstError.Message,
                                    "" ) } ) );
                        ForAll( colNewTransactions As x,
                            Collect( colChildResult,
                                { Kind: "Transaction", Sid: x.sid, Name: x.x_name,
                                  Message:
                                    IfError( Text(
                                        Patch( taskmaster_transactions, Defaults(taskmaster_transactions),
                                            { transaction_name:        x.x_name,
                                              transaction_project_id:  { Id: gPrSaved.ID, Value: gPrSaved.project_name },
                                              transaction_client_name: { Id: x.x_clientId,  Value: x.x_clientValue },
                                              transaction_product_id:  { Id: x.x_productId, Value: x.x_productValue },
                                              transaction_sales:
                                                  { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                    Claims:      ClaimPrefix & Lower(x.x_salesMail),
                                                    DisplayName: x.x_salesName,
                                                    Email:       x.x_salesMail,
                                                    Department: "", JobTitle: "", Picture: "" },
                                              transaction_currency:    { Value: x.x_ccy },
                                              transaction_notional:
                                                  x.x_notional,
                                              transaction_date:        x.x_date } )
                                    .ID ),
                                    FirstError.Message,
                                    "" ) } ) );
                        // issue_impact IS written now — it used to be staged on every
                        // row and then silently dropped from this record.
                        ForAll( colNewIssues As i,
                            Collect( colChildResult,
                                { Kind: "Issue", Sid: i.sid, Name: i.i_name,
                                  Message:
                                    IfError( Text(
                                        Patch( taskmaster_issues, Defaults(taskmaster_issues),
                                            { issue_name:       i.i_name,
                                              issue_project_id: { Id: gPrSaved.ID, Value: gPrSaved.project_name },
                                              issue_status:     { Value: i.i_status },
                                              issue_impact:     { Value: i.i_impact },
                                              issue_date_open:  Now(),
                                              issue_assignee:
                                                  { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                    Claims:      ClaimPrefix & Lower(i.i_assigneeMail),
                                                    DisplayName: i.i_assigneeName,
                                                    Email:       i.i_assigneeMail,
                                                    Department: "", JobTitle: "", Picture: "" } } )
                                    .ID ),
                                    FirstError.Message,
                                    "" ) } ) );
                        // Split the one result table into the two the screen already uses,
                        // so nothing downstream changes.
                        Collect( colChildErrors,
                                 ShowColumns( Filter(colChildResult, Len(Message) > 0), Kind, Name, Message ) );
                        Collect( colChildOk,
                                 ShowColumns( Filter(colChildResult, Len(Message) = 0), Kind, Sid ) );
                        // Written rows leave staging; failures stay so Save retries them.
                        RemoveIf( colNewTasks,
                                  sid in ShowColumns( Filter(colChildOk, Kind = "Task"), Sid ) );
                        RemoveIf( colNewTransactions,
                                  sid in ShowColumns( Filter(colChildOk, Kind = "Transaction"), Sid ) );
                        RemoveIf( colNewIssues,
                                  sid in ShowColumns( Filter(colChildOk, Kind = "Issue"), Sid ) );
                        // --- 4. the project now EXISTS. Never insert it twice. -----
                        Set( gEditProject, gPrSaved );
                        Set( gEditMode, "Edit" );
                        Set( gSelProject, gPrSaved );
                        // --- 5. C3 rollup, read back from the server ---------------
                        With( { pid: gPrSaved.ID },
                            With( { scored:
                                      AddColumns(
                                          Filter( taskmaster_tasks,
                                              task_project_id.Id = pid
                                           && ( task_stage.Value = "Not Started"  || task_stage.Value = "Planning"
                                             || task_stage.Value = "Drafting"     || task_stage.Value = "Under Review"
                                             || task_stage.Value = "Finalizing"   || task_stage.Value = "Complete" ) ),
                                          wgt, Coalesce(LookUp(StageWeights, Stage = task_stage.Value, Weight), 0) ) },
                                If( CountRows(scored) >= 500,
                                    Notify("Project saved. It has too many tasks to compute completion accurately, so it was left unchanged.",
                                           NotificationType.Warning),
                                    IfError(
                                        Set( gSelProject,
                                            Patch( taskmaster_projects, gPrSaved,
                                                   { project_perc_completion:
                                                         If( CountRows(scored) = 0, 0,
                                                             RoundDown(Average(scored, wgt), 0) ) } ) ), Set( gPrWarn, gPrWarn & "Project saved, but the completion rollup didn't update: " & FirstError.Message & "   " )) ) ) );
                        // One banner for every optional column that didn't stick, rather
                        // than up to seven. gPrWarn is appended to by each guarded Patch's
                        // IfError fallback — the only place FirstError is in scope.
                        If( Len(gPrWarn) > 0,
                            Notify( "Project saved, but: " & gPrWarn, NotificationType.Warning ) );
                        If( IsEmpty(colChildErrors),
                            Notify("Project saved with everything attached.", NotificationType.Success);
                            Navigate( scrProject, ScreenTransition.Cover ),
                            Notify( CountRows(colChildErrors) & " item(s) could not be created — they are still listed below, press Save to retry.",
                                    NotificationType.Error ) )
                    )
      # =======================================================================
      # MODAL — ADD A TASK        card 700 x 540, body scrolls, buttons pinned
      # =======================================================================
      # Declared last so it floats above everything (z-order is positional).
      # Every part shares the card's anchor expressions, so the body and the
      # button row cannot drift apart the way the old action bar did.
      - mdNtScrim:
          Control: Rectangle@2.3.0
          Properties:
            Visible: =gNtOpen
            Fill: =RGBA(32, 38, 45, 0.45)
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            OnSelect: |
              =Reset( txtNtName ); Reset( txtNtLeadSearch ); Reset( dtpNtTarget );
               Reset( cboNtPriority );
               Set( gNtLead, { DisplayName: "", Mail: "" } );
               Set( gNtPriority, "Moderate" );
               Set( gNtEditSid, 0 ); Set( gNtName, "" ); Set( gNtTarget, Blank() );
               Set( gNtOpen, false )
      - mdNtBg:
          Control: Rectangle@2.3.0
          Properties:
            Visible: =gNtOpen
            Fill: =Theme.Color.Surface
            BorderColor: =Theme.Color.Border
            BorderThickness: =1
            X: =(Parent.Width - 700) / 2
            Y: =(Parent.Height - 540) / 2
            Width: =700
            Height: =540
      - mdNtBody:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Visible: =gNtOpen
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =24
            PaddingBottom: =16
            PaddingLeft: =24
            PaddingRight: =24
            X: =(Parent.Width - 700) / 2
            Y: =(Parent.Height - 540) / 2
            Width: =700
            Height: =460
          Children:
            - mdNtTitle:
                Control: Label@2.5.1
                Properties:
                  Text: =If( gNtEditSid > 0, "Edit task", "Add a task" )
                  Font: =Theme.Font
                  FontWeight: =FontWeight.Semibold
                  Size: =Theme.Size.H3
                  Color: =Theme.Color.TextPrimary
                  Width: =Parent.Width - 48
                  Height: =28
            - rowNtName:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =8
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblNtNameCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Task name  *"
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextMuted
                        Width: =Parent.Width
                        Height: =18
                  - txtNtName:
                      Control: ModernTextInput@1.0.0
                      Properties:
                        Default: =gNtName
                        Placeholder: ="What needs doing?"
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Width: =Parent.Width
                        Height: =36
            - rowNtMeta:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =24
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - colNtPriority:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =(Parent.Width - 24) / 2
                        Height: =62
                      Children:
                        - lblNtPriCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Priority"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        # Matches task_priority in schema/schema.yaml exactly.
                        - cboNtPriority:
                            Control: ModernCombobox@1.1.1
                            Properties:
                              Items: =["Low", "Moderate", "High", "Critical"]
                              ItemDisplayText: =ThisItem.Value
                              InputTextPlaceholder: ="Priority"
                              SelectMultiple: =false
                              IsSearchable: =false
                              DefaultSelectedItems: =[gNtPriority]
                              Width: =Parent.Width
                              Height: =36
                              OnChange: =Set(gNtPriority, cboNtPriority.Selected.Value)
                  - colNtTarget:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =(Parent.Width - 24) / 2
                        Height: =62
                      Children:
                        - lblNtTgtCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Target date"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - dtpNtTarget:
                            Control: ModernDatePicker@1.0.0
                            Properties:
                              DefaultDate: =gNtTarget
                              Placeholder: ="Target date"
                              Format: =DatePickerFormat.LongAbbreviated
                              StartOfWeek: =StartOfWeek.Monday
                              IsEditable: =true
                              Width: =Parent.Width
                              Height: =36
            - rowNtLead:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =6
                  Width: =Parent.Width - 48
                  Height: =58
                Children:
                  - lblNtLeadCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Task lead  *  —  anyone in the directory"
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextMuted
                        Width: =Parent.Width
                        Height: =18
                  - txtNtLeadSearch:
                      Control: ModernTextInput@1.0.0
                      Properties:
                        Visible: =!(Len(gNtLead.Mail) > 0)
                        Type: =TextInputType.Search
                        Default: =""
                        Placeholder: ="Type a name…"
                        TriggerOutput: =TriggerOutput.Delayed
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Width: =Parent.Width
                        Height: =36
                  - btnNtLeadChip:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Visible: =Len(gNtLead.Mail) > 0
                        Text: =gNtLead.DisplayName & "     ✕"
                        Align: =Align.Left
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Fill: =RGBA(0, 0, 0, 0)
                        Color: =Theme.Color.TextPrimary
                        BorderColor: =Theme.Color.Border
                        BorderThickness: =1
                        Width: =Parent.Width
                        Height: =36
                        OnSelect: |
                          =Set(gNtLead, { DisplayName: "", Mail: "" });
                           Reset(txtNtLeadSearch)
            - galNtLead:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  Visible: =Len(txtNtLeadSearch.Text) >= 2 && Len(gNtLead.Mail) = 0
                  Items: |
                    =Office365Users.SearchUserV2({ searchTerm: txtNtLeadSearch.Text, top: 6 }).value
                  TemplateSize: =32
                  TemplatePadding: =0
                  TemplateFill: =Theme.Color.Surface
                  BorderColor: =Theme.Color.Border
                  BorderThickness: =1
                  Width: =Parent.Width - 48
                  Height: =132
                Children:
                  - lblNtLeadRow:
                      Control: Label@2.5.1
                      Properties:
                        Text: =ThisItem.DisplayName & "     " & ThisItem.Mail
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextPrimary
                        X: =12
                        Y: =0
                        Width: =Parent.TemplateWidth - 24
                        Height: =32
                        VerticalAlign: =VerticalAlign.Middle
                  - hitNtLead:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        OnSelect: |
                          =Select(Parent);
                           Set(gNtLead, { DisplayName: ThisItem.DisplayName, Mail: ThisItem.Mail });
                           Reset(txtNtLeadSearch)
      # Buttons sit OUTSIDE mdNtBody, on the card's own anchor, so they stay
      # pinned to the card's bottom edge however tall the body grows.
      - mdNtAdd:
          Control: ModernButton@1.0.0
          Properties:
