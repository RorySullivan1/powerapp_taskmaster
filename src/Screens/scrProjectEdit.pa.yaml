            # -----------------------------------------------------------------
            # TASKS  (staged — written after the project's insert returns)
            # -----------------------------------------------------------------
            - divPrStaged:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =Theme.Color.Border
                  Width: =Parent.Width - 48
                  Height: =1
            # ---------------------------------------------------------------------
            # STAGED CHILDREN — two columns, side by side, at the bottom.
            #
            # Was three stacked sections, each a divider + header row + Add button +
            # a strip of tags, and each expanded as items were added. Three columns
            # cost a FIXED 332px no matter how many items are staged; the lists
            # scroll inside their own column instead of pushing the action bar down.
            #
            # 332 = 36 button + 8 gap + 288 gallery, and 288 is 9 WHOLE rows of 32.
            # The exact multiple is the point: a gallery height that is not one leaves
            # a half-drawn last row, which is what "the 2nd is cut off" was.
            #
            # THREE levels of FillPortions have to agree, and each defaults to 1:
            # rowPrStaged inside frmPrScroll (vertical, so FillPortions is height),
            # then the button and the gallery inside each column. Pin everything that
            # has a fixed size at 0 and let exactly ONE child absorb the slack.
            #
            # Each column is: the Add button as its own header, then the staged rows
            # by name with a x on the far right.
            #
            # The row inside the gallery template is an auto-layout container, NOT
            # absolute coordinates. That is deliberate: the x is pinned right by
            # FillPortions 0 against a label with FillPortions 1, so it cannot drift
            # over the text the way a frozen `Parent.TemplateWidth - 30` did. The
            # label carries OnSelect, so no transparent overlay button is needed.
            # ---------------------------------------------------------------------
            - rowPrStaged:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =24
                  FillPortions: =0
                  LayoutMinHeight: =332
                  Width: =Parent.Width - 48
                  Height: =332
                Children:
                  - colStgNt:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =8
                        Width: =(Parent.Width - 24) / 2
                        LayoutMinHeight: =332
                        Height: =332
                      Children:
                        - btnAddNt:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Visible: =gEditMode <> "Edit"
                              Fill: =Theme.Color.Surface
                              Color: =Theme.Color.Primary
                              BorderColor: =Theme.Color.Primary
                              BorderThickness: =1
                              Font: =Theme.Font
                              Size: =Theme.Size.Body
                              Text: |
                                ="+  Add task" &
                                 If( IsEmpty(colNewTasks), "", "   (" & CountRows(colNewTasks) & ")" )
                              FillPortions: =0
                              LayoutMinHeight: =36
                              Width: =Parent.Width
                              Height: =36
                              OnSelect: |
                                =Set( gNtEditSid, 0 ); Set( gNtName, "" ); Set( gNtTarget, Blank() );
                                Reset(txtNtName); Reset(dtpNtTarget); Reset(cboNtPriority); Reset(txtNtLeadSearch);
                                Set( gNtOpen, true )
                        - lblStgNtEmpty:
                            Control: Label@2.5.1
                            Properties:
                              Visible: =gEditMode <> "Edit" && IsEmpty(colNewTasks)
                              Text: ="No tasks added yet."
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              FillPortions: =0
                              LayoutMinHeight: =24
                              Width: =Parent.Width
                              Height: =24
                              VerticalAlign: =VerticalAlign.Middle
                        - galNewNt:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                            Properties:
                              Visible: =gEditMode <> "Edit" && !IsEmpty(colNewTasks)
                              Items: =colNewTasks
                              # One per row. TemplatePadding is taken off BOTH edges,
                              # so usable height is 32 - 2*2 = 28, which clears the
                              # 28px row exactly.
                              WrapCount: =1
                              TemplateSize: =32
                              TemplatePadding: =2
                              TemplateFill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              # THE SCROLL FIX. A child of an auto-layout container has
                              # flexible sizing ON by default, so Height is advisory and
                              # the container splits its own height by FillPortions.
                              # Button and gallery both defaulted to 1, so the gallery
                              # got half the column and the list was cut off mid-row.
                              # Pinning the button at 0 and giving the gallery 1 hands it
                              # every remaining pixel — here, exactly 288.
                              FillPortions: =1
                              LayoutMinHeight: =288
                              Width: =Parent.Width
                              Height: =288
                            Children:
                              - rowStgNt:
