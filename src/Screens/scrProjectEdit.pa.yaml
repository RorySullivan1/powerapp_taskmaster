                   ShowColumns(
                       Office365Users.SearchUserV2({ searchTerm: gPrPeopleQuery, top: 25 }).value,
                       DisplayName, Mail ) )
            OnSearch: =Set( gPrPeopleQuery, cmpPrPeople.Query )
            OnConfirm: |
              =Switch( gPrPicker,
                       "Manager",
                       Set( gPrManager,
                            { DisplayName: cmpPrPeople.Picked.DisplayName,
                              Mail:        cmpPrPeople.Picked.Mail } ),
                       "Requestor",
                       Set( gPrRequestor,
                            { DisplayName: cmpPrPeople.Picked.DisplayName,
                              Mail:        cmpPrPeople.Picked.Mail } ),
                       "Supporter",
                       Set( gPrSupporter,
                            { DisplayName: cmpPrPeople.Picked.DisplayName,
                              Mail:        cmpPrPeople.Picked.Mail } ) );
               Set( gPrPicker, "" )
            OnCancel: =Set( gPrPicker, "" )