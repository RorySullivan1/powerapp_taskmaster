# Create / edit a project, plus its staged child tasks and transactions.
# Layout bands (tablet 1366x768): 0..64 header, 64..680 scrolling form, 680..768 action bar.
# The action bar is OPAQUE and absolute — the scroll must not bleed under it.
# Layout formulas FREEZE at paste, so nothing here may depend on the live screen height.
Screens:
  scrProjectEdit:
    Properties:
      Fill: =gTheme.Color.Bg
      OnVisible: |
        =Set( gSaving, false );   // see btnPrSave
        Set( gPrManager,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditProject.project_manager.DisplayName, ""),
                    Mail:        Coalesce(gEditProject.project_manager.Email, "") },
                  { DisplayName: Coalesce(User().FullName, ""), Mail: Coalesce(User().Email, "") } ) );
        Set( gPrRequestor,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditProject.project_requestor.DisplayName, ""),
                    Mail:        Coalesce(gEditProject.project_requestor.Email, "") },
                  { DisplayName: "", Mail: "" } ) );
        Set( gPrSupporter,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditProject.project_supporter.DisplayName, ""),
                    Mail:        Coalesce(gEditProject.project_supporter.Email, "") },
                  { DisplayName: "", Mail: "" } ) );
        // Phase starts EMPTY on New — the user picks it, rather than being given a
        // default they might not notice and save by accident. It is a required column,
        // so btnPrSave gates on it and lblPrMissing names it.
        Set( gPrPhase,    If( gEditMode = "Edit", Coalesce(gEditProject.project_phase.Value, ""), "" ) );
        Set( gPrPriority, If( gEditMode = "Edit", Coalesce(gEditProject.project_priority.Value, "Moderate"), "Moderate" ) );
        ClearCollect( colMapRegion,   mapping_regions );
        ClearCollect( colMapActivity, mapping_activitytype );
        Set( gPrRegionId,   If( gEditMode = "Edit", Coalesce(gEditProject.project_region_id, 0), 0 ) );
        Set( gPrRegionPath, If( gEditMode = "Edit", Coalesce(gEditProject.project_region_path, ""), "" ) );
        Set( gPrTypeId,     If( gEditMode = "Edit", Coalesce(gEditProject.project_type_id, 0), 0 ) );
        Set( gPrTypePath,   If( gEditMode = "Edit", Coalesce(gEditProject.project_type_path, ""), "" ) );
        ClearCollect( colPrCovChoices, Choices([@taskmaster_projects].project_coverage) );
        Set( gPrCov, If( gEditMode = "Edit", Coalesce(gEditProject.project_coverage.Value, ""), "" ) );
        Clear( colNewTasks ); Clear( colNewTransactions );
        If( gEditMode = "Edit",
            ClearCollect( colLinkedTasks, Filter(taskmaster_tasks, task_project_id.Id = gEditProject.ID) );
            ClearCollect( colLinkedTx,    Filter(taskmaster_transactions, transaction_project_id.Id = gEditProject.ID) ),
            Clear( colLinkedTasks ); Clear( colLinkedTx ) );
        Clear( colChildResult ); Clear( colChildErrors ); Clear( colChildOk );
        Set( gNtOpen, false ); Set( gNxOpen, false );
        Set( gNtEditSid, 0 ); Set( gNxEditSid, 0 );
        Set( gNtName, "" ); Set( gNtTarget, Blank() );
        Set( gNxName, "" ); Set( gNxDate, Blank() ); Set( gNxNotional, Blank() );
        // Modal field state. Every default below is a REAL member of the matching
        // Choice column in schema/schema.yaml — task_priority, transaction_currency,
        // issue_status, issue_impact. Do not seed a value the list does not have.
        Set( gNtPriority, "Moderate" );
        Set( gNtLead,     { DisplayName: "", Mail: "" } );
        Set( gNxCcy,      "USD" );
        Set( gNxSales,    { DisplayName: "", Mail: "" } );
        Set( gNxClient,   { Id: 0, Value: "" } );
        Set( gNxProduct,  { Id: 0, Value: "" } );
        // Text inputs re-read their Default only on Reset; the date pickers re-read
        // DefaultDate the same way. Missing these was how an Edit used to open with
        // blank dates and then write Blank() over the stored ones.
        Reset( txtPrName ); Reset( txtPrPathway ); Reset( txtPrDesc );
        Reset( dtpPrStart ); Reset( dtpPrTarget );
        Set( gPrPicker, "" ); Set( gPrQuery, "" ); Reset( cmpPrPick );
        Reset( txtNtName ); Reset( dtpNtTarget );
        Reset( txtNxName ); Reset( dtpNxDate ); Reset( numNxNotional );
        // The SAME rule applies to every combo box: DefaultSelectedItems is
        // re-read only on Reset. Without these six, opening project B after project A
        // leaves A's phase/priority showing while gPrPhase already holds B's — and
        // re-picking the displayed value fires no OnChange, so the correction can't
        // be made by hand either.
        Reset( cboPrPhase ); Reset( cboPrPriority );
        // The pickers DO need resetting. A component's inner combo boxes read their
        // DefaultSelectedItems once, so clearing gPrRegionPath above is not enough on
        // its own — the previous project's selection stays on screen. Reset() on the
        // INSTANCE fires the component's OnReset, which is the only way in from here.
        // Must come after the Set()s above, so DefaultPath is already cleared.
        Reset( pickPrRegion ); Reset( pickPrType );
        Reset( cboPrCov );
        Reset( cboNtPriority ); Reset( cboNxCcy )
    Children:
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Primary
            Height: =gTheme.Space.HeaderH
            Width: =Parent.Width
            X: =0
            Y: =0
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: =If(gEditMode = "Edit", "Edit project", "New project")
            Color: =gTheme.Color.OnPrimary
            Font: =gTheme.Font
            FontWeight: =FontWeight.Semibold
            Size: =gTheme.Size.H2
            Height: =gTheme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =gTheme.Space.Gutter
            Y: =0
            Width: =360
      - lblPrStagedCount:
          Control: Label@2.5.1
          Properties:
            Visible: |
              =CountRows(colNewTasks) + CountRows(colNewTransactions) > 0
            Text: |
              =CountRows(colNewTasks) & " task · " & CountRows(colNewTransactions)
               & " transaction  —  staged, not yet saved"
            Color: =gTheme.Color.OnPrimary
            Font: =gTheme.Font
            Size: =gTheme.Size.Small
            Align: =Align.Right
            Height: =gTheme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Parent.Width - 520 - gTheme.Space.Gutter
            Y: =0
            Width: =480
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =gTheme.Color.OnPrimary
            HoverColor: =gTheme.Color.OnPrimary
            HoverFill: =RGBA(255, 255, 255, 0.15)
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            Height: =24
            Width: =24
            X: =Parent.Width - 24 - gTheme.Space.Gutter
            Y: =(gTheme.Space.HeaderH - 24) / 2
            OnSelect: =Back()
      # =======================================================================
      # FORM BAND  ·  64 .. Parent.Height - 88
      # =======================================================================
      # An opaque sheet behind the scrolling column, so the form reads as one
      # surface against the grey canvas. Same anchor expression as frmPrScroll,
      # so whatever the paste freezes, the two freeze together.
      - formSheet:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 88
      - frmPrScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =20
            PaddingBottom: =28
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 88
          Children:
            - secHeadDetails:
                Control: Label@2.5.1
                Properties:
                  Text: ="Details"
                  Font: =gTheme.Font
                  FontWeight: =FontWeight.Semibold
                  Size: =gTheme.Size.H3
                  Color: =gTheme.Color.Primary
                  Width: =Parent.Width - 48
                  Height: =24
            - rowPrD1:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =3
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblPrNameCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Project name  *"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Width: =Parent.Width
                        Height: =18
                  - txtPrName:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: =If(gEditMode = "Edit", gEditProject.project_name, "")
                        Placeholder: ="What is this project called?"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Body
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Width: =Parent.Width
                        Height: =36
                  - lblPrPhaseCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Phase  *"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Width: =Parent.Width
                        Height: =18
                  - cboPrPhase:
                      Control: ModernCombobox@1.1.1
                      Properties:
                        Items: =["Planning", "Active", "Blocked", "Complete", "Archived"]
                        ItemDisplayText: =ThisItem.Value
                        InputTextPlaceholder: ="Select a phase"
                        SelectMultiple: =false
                        IsSearchable: =false
                        DefaultSelectedItems: =Filter( [gPrPhase], !IsBlank(Value) )
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Width: =Parent.Width
                        Height: =36
                        OnChange: =Set(gPrPhase, cboPrPhase.Selected.Value)
                  - lblPrPriorityCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Priority  *"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =3
                        LayoutGridColumnEnd: =3
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Width: =Parent.Width
                        Height: =18
                  - cboPrPriority:
                      Control: ModernCombobox@1.1.1
                      Properties:
                        Items: =["Lowest", "Low", "Moderate", "High", "Critical"]
                        ItemDisplayText: =ThisItem.Value
                        InputTextPlaceholder: ="Select a priority"
                        SelectMultiple: =false
                        IsSearchable: =false
                        DefaultSelectedItems: =[gPrPriority]
                        LayoutGridColumnStart: =3
                        LayoutGridColumnEnd: =3
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Width: =Parent.Width
                        Height: =36
                        OnChange: =Set(gPrPriority, cboPrPriority.Selected.Value)
            - rowPrD2:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =3
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblPrStartCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Start date"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Width: =Parent.Width
                        Height: =18
                  - dtpPrStart:
                      Control: ModernDatePicker@1.0.1
                      Properties:
                        DefaultDate: =If(gEditMode = "Edit", gEditProject.project_date_start, Blank())
                        Placeholder: ="Actual start date"
                        Format: =DatePickerFormat.LongAbbreviated
                        StartOfWeek: =StartOfWeek.Monday
                        IsEditable: =true
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Width: =Parent.Width
                        Height: =36
                  - lblPrTargetCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Target date"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Width: =Parent.Width
                        Height: =18
                  - dtpPrTarget:
                      Control: ModernDatePicker@1.0.1
                      Properties:
                        DefaultDate: =If(gEditMode = "Edit", gEditProject.project_date_target, Blank())
                        Placeholder: ="Target completion"
                        Format: =DatePickerFormat.LongAbbreviated
                        StartOfWeek: =StartOfWeek.Monday
                        IsEditable: =true
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Width: =Parent.Width
                        Height: =36
                  - lblPrPathCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Shared-drive path"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =3
                        LayoutGridColumnEnd: =3
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Width: =Parent.Width
                        Height: =18
                  - txtPrPathway:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: =If(gEditMode = "Edit", gEditProject.project_pathway, "")
                        Placeholder: ="\\share\eqd\projects\…"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        LayoutGridColumnStart: =3
                        LayoutGridColumnEnd: =3
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Width: =Parent.Width
                        Height: =36
            - rowPrD3:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =24
                  Width: =Parent.Width - 48
                  Height: =110
                Children:
                  - colPrDesc:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =Parent.Width
                        Height: =110
                      Children:
                        - lblPrDescCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Description"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - txtPrDesc:
                            Control: ModernTextInput@1.1.1
                            Properties:
                              Default: =If(gEditMode = "Edit", gEditProject.project_description, "")
                              Type: =TextInputType.Multiline
                              Placeholder: ="Background, scope, anything the desk should know."
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Width: =Parent.Width
                              Height: =84
            - divPrPeople:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =gTheme.Color.Border
                  Width: =Parent.Width - 48
                  Height: =1
            - secHeadPeople:
                Control: Label@2.5.1
                Properties:
                  Text: ="People"
                  Font: =gTheme.Font
                  FontWeight: =FontWeight.Semibold
                  Size: =gTheme.Size.H3
                  Color: =gTheme.Color.Primary
                  Width: =Parent.Width - 48
                  Height: =24
            - rowPrPeople:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =16
                  Width: =Parent.Width - 48
                  Height: =58
                Children:
                  - colPrMgr:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =6
                        Width: =(Parent.Width - 32) / 3
                        Height: =58
                      Children:
                        - fldManager:
                            Control: CanvasComponent
                            ComponentName: cmpLookupField
                            Properties:
                              Caption: ="Project manager  *"
                              PickLabel: ="＋  Choose a manager"
                              HasValue: =Len(gPrManager.Mail) > 0
                              Display: =gPrManager.DisplayName
                              Width: =Parent.Width
                              Height: =62
                              OnPick: |
                                =Set( gPrPicker, "Manager" );
                                 Reset( cmpPrPick );
                                 Set( gPrQuery, "" )
                              OnClear: |
                                =Set( gPrManager, { DisplayName: "", Mail: "" } )
                  - colPrReq:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =6
                        Width: =(Parent.Width - 32) / 3
                        Height: =58
                      Children:
                        - fldRequestor:
                            Control: CanvasComponent
                            ComponentName: cmpLookupField
                            Properties:
                              Caption: ="Requestor"
                              PickLabel: ="＋  Choose a requestor"
                              HasValue: =Len(gPrRequestor.Mail) > 0
                              Display: =gPrRequestor.DisplayName
                              Width: =Parent.Width
                              Height: =62
                              OnPick: |
                                =Set( gPrPicker, "Requestor" );
                                 Reset( cmpPrPick );
                                 Set( gPrQuery, "" )
                              OnClear: |
                                =Set( gPrRequestor, { DisplayName: "", Mail: "" } )
                  - colPrSup:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =6
                        Width: =(Parent.Width - 32) / 3
                        Height: =58
                      Children:
                        - fldSupporter:
                            Control: CanvasComponent
                            ComponentName: cmpLookupField
                            Properties:
                              Caption: ="Supporter"
                              PickLabel: ="＋  Choose a supporter"
                              HasValue: =Len(gPrSupporter.Mail) > 0
                              Display: =gPrSupporter.DisplayName
                              Width: =Parent.Width
                              Height: =62
                              OnPick: |
                                =Set( gPrPicker, "Supporter" );
                                 Reset( cmpPrPick );
                                 Set( gPrQuery, "" )
                              OnClear: |
                                =Set( gPrSupporter, { DisplayName: "", Mail: "" } )
            - divPrClass:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =gTheme.Color.Border
                  Width: =Parent.Width - 48
                  Height: =1
            - secHeadClassification:
                Control: Label@2.5.1
                Properties:
                  Text: ="Classification"
                  Font: =gTheme.Font
                  FontWeight: =FontWeight.Semibold
                  Size: =gTheme.Size.H3
                  Color: =gTheme.Color.Primary
                  Width: =Parent.Width - 48
                  Height: =24
            # Region and Project type are 3-level vocabularies, so each gets a
            # cmpNestedSelect. Height is fixed at 64: a canvas component cannot
            # size itself to its content — see the component's header.
            - pickPrRegion:
                Control: CanvasComponent
                ComponentName: cmpNestedSelect
                Properties:
                  Terms: =colMapRegion
                  Caption: ="Region  *"
                  DefaultPath: =gPrRegionPath
                  Separator: =" | "
                  Width: =Parent.Width - 48
                  Height: =64
                  OnChange: |
                    =Set( gPrRegionId,   pickPrRegion.SelectedId );
                     Set( gPrRegionPath, pickPrRegion.SelectedPath )
            - lblPrRegionState:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =If( Len(gPrRegionPath) > 0, "✓ " & gPrRegionPath,
                         gEditMode = "Edit",
                         "Currently: " & Coalesce(gEditProject.project_region_path, "not set") & "   (leave alone to keep it)",
                         "Nothing picked yet" )
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  Width: =Parent.Width - 48
                  Height: =20
                  VerticalAlign: =VerticalAlign.Middle
            - pickPrType:
                Control: CanvasComponent
                ComponentName: cmpNestedSelect
                Properties:
                  Terms: =colMapActivity
                  Caption: ="Project type  *"
                  DefaultPath: =gPrTypePath
                  Separator: =" | "
                  Width: =Parent.Width - 48
                  Height: =64
                  OnChange: |
                    =Set( gPrTypeId,   pickPrType.SelectedId );
                     Set( gPrTypePath, pickPrType.SelectedPath )
            - lblPrTypeState:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =If( Len(gPrTypePath) > 0, "✓ " & gPrTypePath,
                         gEditMode = "Edit",
                         "Currently: " & Coalesce(gEditProject.project_type_path, "not set") & "   (leave alone to keep it)",
                         "Nothing picked yet" )
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  Width: =Parent.Width - 48
                  Height: =20
                  VerticalAlign: =VerticalAlign.Middle
            - lblCapPrCov:
                Control: Label@2.5.1
                Properties:
                  Text: ="Coverage"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  Width: =Parent.Width - 48
                  Height: =18
            - cboPrCov:
                Control: ModernCombobox@1.1.1
                Properties:
                  Items: =colPrCovChoices
                  ItemDisplayText: =ThisItem.Value
                  DefaultSelectedItems: =Filter( colPrCovChoices, Value = gPrCov )
                  SelectMultiple: =false
                  IsSearchable: =true
                  InputTextPlaceholder: ="Select a coverage area"
                  Width: =Parent.Width - 48
                  Height: =32
                  OnChange: =Set( gPrCov, cboPrCov.Selected.Value )
            - divPrStaged:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =gTheme.Color.Border
                  Width: =Parent.Width - 48
                  Height: =1
            # ---------------------------------------------------------------------
            # STAGED CHILDREN — two columns, side by side, at the bottom.
            #
            # Was three stacked sections, each a divider + header row + Add button +
            # a strip of tags, and each expanded as items were added. Three columns
            # cost a FIXED 332px no matter how many items are staged; the lists
            # scroll inside their own column instead of pushing the action bar down.
            #
            # 332 = 36 button + 8 gap + 288 gallery, and 288 is 9 WHOLE rows of 32.
            # The exact multiple is the point: a gallery height that is not one leaves
            # a half-drawn last row, which is what "the 2nd is cut off" was.
            #
            # THREE levels of FillPortions have to agree, and each defaults to 1:
            # rowPrStaged inside frmPrScroll (vertical, so FillPortions is height),
            # then the button and the gallery inside each column. Pin everything that
            # has a fixed size at 0 and let exactly ONE child absorb the slack.
            #
            # Each column is: the Add button as its own header, then the staged rows
            # by name with a x on the far right.
            #
            # The row inside the gallery template is an auto-layout container, NOT
            # absolute coordinates. That is deliberate: the x is pinned right by
            # FillPortions 0 against a label with FillPortions 1, so it cannot drift
            # over the text the way a frozen `Parent.TemplateWidth - 30` did. The
            # label carries OnSelect, so no transparent overlay button is needed.
            # ---------------------------------------------------------------------
            - rowPrStaged:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =24
                  FillPortions: =0
                  LayoutMinHeight: =332
                  Width: =Parent.Width - 48
                  Height: =332
                Children:
                  - colStgNt:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =8
                        Width: =(Parent.Width - 24) / 2
                        LayoutMinHeight: =332
                        Height: =332
                      Children:
                        - btnAddNt:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Visible: =gEditMode <> "Edit"
                              Fill: =gTheme.Color.Surface
                              Color: =gTheme.Color.Primary
                              BorderColor: =gTheme.Color.Primary
                              BorderThickness: =1
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Body
                              Text: |
                                ="+  Add task" &
                                 If( IsEmpty(colNewTasks), "", "   (" & CountRows(colNewTasks) & ")" )
                              FillPortions: =0
                              LayoutMinHeight: =36
                              Width: =Parent.Width
                              Height: =36
                              OnSelect: |
                                =Set( gNtEditSid, 0 ); Set( gNtName, "" ); Set( gNtTarget, Blank() );
                                Reset(txtNtName); Reset(dtpNtTarget); Reset(cboNtPriority); Reset( cmpPrPick );
                                Set( gNtOpen, true )
                        - lblStgNtEmpty:
                            Control: Label@2.5.1
                            Properties:
                              Visible: =gEditMode <> "Edit" && IsEmpty(colNewTasks)
