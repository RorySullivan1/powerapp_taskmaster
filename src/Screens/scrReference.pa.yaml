Screens:
  scrReference:
    Properties:
      Fill: =gTheme.Color.Bg
    Children:
      - RefEmpty:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            Height: =Parent.Height - gTheme.Space.HeaderH - (gTheme.Space.Gutter * 2)
            Width: =Parent.Width - (gTheme.Space.Gutter * 2)
            X: =gTheme.Space.Gutter
            Y: =gTheme.Space.HeaderH + gTheme.Space.Gutter
      - lblAdminRefHead:
          Control: Label@2.5.1
          Properties:
            Text: ="Reference data"
            Font: =gTheme.Font
            Size: =gTheme.Size.H3
            FontWeight: =FontWeight.Semibold
            Color: =gTheme.Color.TextPrimary
            VerticalAlign: =VerticalAlign.Middle
            X: =gTheme.Space.Gutter * 2
            Y: =gTheme.Space.HeaderH + gTheme.Space.Gutter * 2
            Width: =400
            Height: =28
      - btnAdminNewClient:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="＋  New client"
            Fill: =gTheme.Color.Primary
            Color: =gTheme.Color.OnPrimary
            BorderColor: =gTheme.Color.Primary
            BorderThickness: =0
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            X: =gTheme.Space.Gutter * 2
            Y: =gTheme.Space.HeaderH + gTheme.Space.Gutter * 2 + 40
            Width: =180
            Height: =44
            OnSelect: |
              =Set( gClMode, "New" );
               Set( gClReturn, "" );
               Navigate( scrClientEdit, ScreenTransition.Cover )
      - btnAdminNewProduct:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="＋  New product"
            Fill: =gTheme.Color.Primary
            Color: =gTheme.Color.OnPrimary
            BorderColor: =gTheme.Color.Primary
            BorderThickness: =0
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            X: =gTheme.Space.Gutter * 2 + 180 + 12
            Y: =gTheme.Space.HeaderH + gTheme.Space.Gutter * 2 + 40
            Width: =180
            Height: =44
            OnSelect: |
              =Set( gPdMode, "New" );
               Set( gPdReturn, "" );
               Navigate( scrProductEdit, ScreenTransition.Cover )
      # ---- Maintenance lists -----------------------------------------------
      # THESE ARE WHAT DEFINE `gEditClient` / `gEditProduct`. Until they existed
      # the two create screens READ those globals but nothing in the app ever
      # Set them, so Studio reported both as unknown — an undefined global has no
      # type, and `gEditClient.client_name` cannot resolve against nothing.
      # The Edit path had no entry point, which was the actual gap: scrReference
      # could only CREATE reference data, never open any.
      #
      # Bands, computed (1366x768):
      #   112..140  heading      152..196  new buttons
      #   210..230  caption      234..270  search      278..744  gallery
      #   left col X 24..675     right col X 691..1342
      - lblAdminClients:
          Control: Label@2.5.1
          Properties:
            Text: ="Clients"
            Font: =gTheme.Font
            Size: =gTheme.Size.Small
            Color: =gTheme.Color.TextMuted
            VerticalAlign: =VerticalAlign.Middle
            X: =gTheme.Space.Gutter
            Y: =210
            Width: =651
            Height: =20
      - txtAdminClientSearch:
          Control: ModernTextInput@1.1.1
          Properties:
            Placeholder: ="Filter by name…"
            TriggerOutput: =TriggerOutput.Delayed
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            X: =gTheme.Space.Gutter
            Y: =234
            Width: =651
            Height: =36
      - galAdminClients:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
          Properties:
            # Delegable: StartsWith on an indexed Text column, and an empty search
            # box matches everything rather than nothing.
            Items: |
              =Sort( Filter( taskmaster_clients,
                             StartsWith(client_name, txtAdminClientSearch.Text) ),
                     client_name )
            WrapCount: =1
            TemplateSize: =44
            TemplatePadding: =0
            TemplateFill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            ShowScrollbar: =true
            X: =gTheme.Space.Gutter
            Y: =278
            Width: =651
            Height: =466
          Children:
            - cellAdminClName:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.client_name
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Color: =gTheme.Color.TextPrimary
                  VerticalAlign: =VerticalAlign.Middle
                  X: =12
                  Y: =0
                  Width: =Parent.TemplateWidth - 24
                  Height: =24
            - cellAdminClMeta:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =Coalesce(ThisItem.client_type.Value, "—") & "   ·   " &
                     Coalesce(ThisItem.client_region_path, "—")
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  X: =12
                  Y: =23
                  Width: =Parent.TemplateWidth - 24
                  Height: =18
            - lineAdminCl:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =gTheme.Color.Border
                  X: =0
                  Y: =43
                  Width: =Parent.TemplateWidth
                  Height: =1
            - hitAdminCl:
                Control: Classic/Button@2.2.0
                Properties:
                  # Transparent full-template button declared LAST — a gallery's
                  # own OnSelect does not reliably fire when the click lands on a
                  # child control.
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =gTheme.Color.Hover
                  PressedFill: =gTheme.Color.Press
                  BorderThickness: =0
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  OnSelect: |
                    =Select(Parent);
                     Set( gEditClient, LookUp(taskmaster_clients, ID = ThisItem.ID) );
                     If( IsBlank(gEditClient.ID),
                         Notify( "That client no longer exists — it may have been deleted.",
                                 NotificationType.Error ),
                         Set( gClMode, "Edit" );
                         Set( gClReturn, "" );
                         Navigate( scrClientEdit, ScreenTransition.Cover ) )
      - lblAdminProducts:
          Control: Label@2.5.1
          Properties:
            Text: ="Products"
            Font: =gTheme.Font
            Size: =gTheme.Size.Small
            Color: =gTheme.Color.TextMuted
            VerticalAlign: =VerticalAlign.Middle
            X: =691
            Y: =210
            Width: =651
            Height: =20
      - txtAdminProductSearch:
          Control: ModernTextInput@1.1.1
          Properties:
            Placeholder: ="Filter by product ID…"
            TriggerOutput: =TriggerOutput.Delayed
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            X: =691
            Y: =234
            Width: =651
            Height: =36
      - galAdminProducts:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
          Properties:
            Items: |
              =Sort( Filter( taskmaster_products,
                             StartsWith(product_uid, txtAdminProductSearch.Text) ),
                     product_uid )
            WrapCount: =1
            # 80, not 44: the #20 fields take a third line and features a fourth. Every Y
            # below is measured against this number and the separator sits on the last
            # pixel of it, so the five move together. THE COST IS ROWS ON SCREEN — the
            # 466px viewport holds ~5.8 products where the 44px row held ~10.
            TemplateSize: =80
            TemplatePadding: =0
            TemplateFill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            ShowScrollbar: =true
            X: =691
            Y: =278
            Width: =651
            Height: =466
          Children:
            - cellAdminPdUid:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.product_uid
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Color: =gTheme.Color.TextPrimary
                  VerticalAlign: =VerticalAlign.Middle
                  X: =12
                  Y: =0
                  Width: =Parent.TemplateWidth - 24
                  Height: =24
            - cellAdminPdMeta:
                Control: Label@2.5.1
                Properties:
                  Text: =Coalesce(ThisItem.product_type_path, "—")
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  X: =12
                  Y: =23
                  Width: =Parent.TemplateWidth - 24
                  Height: =18
            # THE #20 LINE. Blank fields COLLAPSE rather than printing a dash each:
            # three placeholders on a reference row read as damage, and a product with
            # none of these is the normal case, not a defect. The separator is only
            # emitted between two values that both exist, so the line never starts or
            # ends with one. Features get their OWN line below rather than joining this
            # one — prose beside three short tokens reads as one run-on string.
            - cellAdminPdSpec:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =With( { u: Coalesce(ThisItem.product_underlying, ""),
                             w: Coalesce(ThisItem.product_wrapper, ""),
                             m: If( IsBlank(ThisItem.product_maturity), "",
                                    Text(ThisItem.product_maturity) & "y" ) },
                           Trim( u
                                 & If( Len(w) > 0, If(Len(u) > 0, "   ·   ", "") & w, "" )
                                 & If( Len(m) > 0, If(Len(u & w) > 0, "   ·   ", "") & m, "" ) ) )
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  X: =12
                  Y: =41
                  Width: =Parent.TemplateWidth - 24
                  Height: =18
            # FEATURES, ONE LINE, TRUNCATED. Two things have to happen to free text
            # before it can sit in a fixed-height row:
            #   * LINE BREAKS BECOME SPACES. product_features is a Note — a stored
            #     newline would render as one here and push the rest of the sentence out
            #     of the 18px box, so the row would look truncated at a random word.
            #   * A LENGTH CAP with an ellipsis, so a long entry ENDS rather than being
            #     clipped mid-glyph. 100 characters is what fits 627px at Size.Small;
            #     the ellipsis is the signal that the edit form holds the rest.
            - cellAdminPdFeat:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =With( { f: Trim( Substitute( Substitute( Coalesce(ThisItem.product_features, ""),
                                                              Char(13), " " ),
                                                  Char(10), " " ) ) },
                           If( Len(f) = 0,      "",
                               Len(f) <= 100,   f,
                                                Left(f, 99) & "…" ) )
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  X: =12
                  Y: =59
                  Width: =Parent.TemplateWidth - 24
                  Height: =18
            - lineAdminPd:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =gTheme.Color.Border
                  X: =0
                  Y: =79
                  Width: =Parent.TemplateWidth
                  Height: =1
            - hitAdminPd:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =gTheme.Color.Hover
                  PressedFill: =gTheme.Color.Press
                  BorderThickness: =0
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  OnSelect: |
                    =Select(Parent);
                     Set( gEditProduct, LookUp(taskmaster_products, ID = ThisItem.ID) );
                     If( IsBlank(gEditProduct.ID),
                         Notify( "That product no longer exists — it may have been deleted.",
                                 NotificationType.Error ),
                         Set( gPdMode, "Edit" );
                         Set( gPdReturn, "" );
                         Navigate( scrProductEdit, ScreenTransition.Cover ) )

      # ---- The whole shell is one component: header bar + fly-out nav rail ----
      # DECLARED LAST so positional z-order floats the fly-out over the content.
      #
      # Height is dynamic and that is the whole trick: a component intercepts every
      # click inside its bounds, so closed it must own nothing but the 64px header
      # strip. Open, covering the screen is exactly right — the scrim wants the click.
      #
      # cmpAppBar cannot Navigate (a component can't see app screens), so it reports
      # the chosen entry and this screen does the navigating.
      - appBar:
          Control: CanvasComponent
          ComponentName: cmpAppBar
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =If(gNavOpen, Parent.Height, gTheme.Space.HeaderH)
            Items: =gNavMenu
            ActiveKey: =4
            AppTitle: ="EQD Taskmaster"
            ScreenTitle: ="Reference data"
            IsOpen: =gNavOpen
            OnToggle: =Set(gNavOpen, !gNavOpen)
            OnNavigate: |
              =Switch( appBar.SelectedKey,
                       1, Navigate(scrHome, ScreenTransition.Fade),
                       2, Navigate(scrReports, ScreenTransition.Fade),
                       3, Navigate(scrProjects, ScreenTransition.Fade),
                          Navigate(scrReference, ScreenTransition.Fade) );
              Set(gNavOpen, false)
