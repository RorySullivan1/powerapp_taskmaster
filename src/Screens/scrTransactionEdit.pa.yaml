# =============================================================================
# scrTransactionEdit  —  create / edit a transaction.
#
# Entered with:  Set(gEditMode, "New" | "Edit");  Set(gEditTransaction, <record>)
# If gSelProject is set, a NEW transaction is pre-attached to that project.
#
# Follows the shared edit-screen pattern documented in scrIssueEdit's header and
# _EDIT-NOTES.md (seed globals in OnVisible and write from them; normalised picker
# records; overlay galleries declared last; required fields in one Patch).
#
# CURRENCY — read this before adding any total to this screen (Q14, 2026-08-03).
# This form writes the NATIVE notional and its currency, and nothing else. It does
# NOT convert to USD: conversion happens in the report layer, against a proper FX
# dimension in Power BI. A write-time rate freezes whatever number the app happened
# to hold on the day of the trade and nothing downstream can ever correct it;
# report-time conversion can be restated, back-dated and audited.
#
# The consequence is deliberate: **no cross-currency figure can be shown in the
# app.** Per-currency is fine; a mixed total is not.
#
# CONNECTION PREREQUISITE: Office 365 Users (people picker). See HANDOFF.md.
# Every column token resolves to schema/schema.yaml (golden source).
# =============================================================================
Screens:
  scrTransactionEdit:
    Properties:
      Fill: =Theme.Color.Bg
      # RE-ENTRY GUARD. Back() from the ＋ New create screen makes this screen
      # visible again, which fires OnVisible — and OnVisible exists to seed a
      # record from scratch, so it wiped everything the user had typed and
      # overwrote the client/product the create screen had just handed back.
      # On a RETURN there is nothing to seed: the globals already hold the
      # in-progress values. So skip the whole body and clear the flag.
      OnVisible: |
        =Set( gSaving, false );   // see btnTxSave
        If( gTxResume,
         Set( gTxResume, false ),
         Set( gTxProject,
              If( gEditMode = "Edit",
                  { Id: gEditTransaction.transaction_project_id.Id,
                    // NOT redundant. The lookup column's live display field is the target's ID,
                    // so `.Value` is a NUMBER — see schema.yaml on this column. Resolving the
                    // name app-side is the fix from 2026-08-09; do not "optimise" it away.
                    Value: LookUp(taskmaster_projects, ID = gEditTransaction.transaction_project_id.Id, project_name) },
                  gSelProject.ID > 0,
                  { Id: gSelProject.ID, Value: gSelProject.project_name },
                  { Id: 0, Value: "" } ) );
        Set( gTxClient,
              If( gEditMode = "Edit",
                  { Id: gEditTransaction.transaction_client_name.Id, Value: gEditTransaction.transaction_client_name.Value },
                  { Id: 0, Value: "" } ) );
        Set( gTxProduct,
              If( gEditMode = "Edit",
                  { Id: gEditTransaction.transaction_product_id.Id, Value: gEditTransaction.transaction_product_id.Value },
                  { Id: 0, Value: "" } ) );
        Set( gTxSales,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditTransaction.transaction_sales.DisplayName, ""),
                    Mail:        Coalesce(gEditTransaction.transaction_sales.Email, "") },
                  // NOT User(). The sales owner of a transaction is usually somebody
                  // else — defaulting to whoever is entering it writes a wrong name
                  // silently, and transaction_sales is required so the empty state is
                  // caught by lblTxMissing rather than slipping through.
                  { DisplayName: "", Mail: "" } ) );
        Set( gTxCurrency,
              If( gEditMode = "Edit", Coalesce(gEditTransaction.transaction_currency.Value, "USD"), "USD" ) );
        Reset( txtTxName );
        Set( gTxPicker, "" ); Set( gTxQuery, "" ); Reset( cmpTxPick );
        // transaction_date is REQUIRED, so an unseeded picker did not merely lose the
        // date — it blocked the save outright on every edit.
        Reset( dtpTxDate );
        // cmpSelection re-reads its DefaultId ONLY on Reset, so without this the
        // strip shows the PREVIOUS record's currency while the save writes this
        // one. The component gained OnReset on 2026-08-11; this is its consumer.
        //
        // INSIDE the resume guard on purpose: returning from ＋ New must not
        // re-seed the strip from the stored record, which would discard a
        // currency the user picked before stepping out to create a client.
        Reset( selTxCurrency ) )
    Children:
      # ---- Header ----------------------------------------------------------
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Primary
            Height: =Theme.Space.HeaderH
            Width: =Parent.Width
            X: =0
            Y: =0
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: |
              =If(gEditMode = "Edit", "Edit transaction", "New transaction") &
               If( gTxProject.Id > 0, "   ·   " & gTxProject.Value, "" )
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            FontWeight: =FontWeight.Semibold
            Size: =Theme.Size.H2
            Height: =Theme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Theme.Space.Gutter
            Y: =0
            Width: =400
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =Theme.Color.OnPrimary
            Height: =24
            Width: =24
            X: =Parent.Width - 24 - Theme.Space.Gutter
            Y: =(Theme.Space.HeaderH - 24) / 2
            OnSelect: =Back()
      - formSheet:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Surface
            X: =0
            Y: =Theme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - Theme.Space.HeaderH - 88
      - frmTxScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =20
            PaddingBottom: =28
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Theme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - Theme.Space.HeaderH - 88
          Children:
            - gridTx1:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =78
                Children:
                  - lblTxNameCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Transaction label  *"
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Height: =18
                  - txtTxName:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: |
                          =If(gEditMode = "Edit", gEditTransaction.transaction_name, "")
                        Placeholder: ="e.g. QIS-2026-0417 EMEA autocall"
                        Font: =Theme.Font
                        Size: =Theme.Size.Body
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Height: =40
                  - colTxCurrency:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblTxCcyCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Currency  *"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - selTxCurrency:
                            Control: CanvasComponent
                            ComponentName: cmpSelection
                            Properties:
                              Width: =Parent.Width
                              Height: =40
                              Items: |
                                =Table( { Id: 1, Label: "USD" }, { Id: 2, Label: "EUR" }, { Id: 3, Label: "GBP" },
                                        { Id: 4, Label: "JPY" }, { Id: 5, Label: "CHF" } )
                              DefaultId: |
                                =Switch( If(gEditMode = "Edit", Coalesce(gEditTransaction.transaction_currency.Value, "USD"), "USD"),
                                         "USD", 1, "EUR", 2, "GBP", 3, "JPY", 4, 5 )
                              OnChange: |
                                =Set(gTxCurrency, selTxCurrency.Selected.Label)
            - gridTx2:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =110
                Children:
                  - colTxNotional:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =6
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =96
                      Children:
                        - lblTxNotionalCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Notional (native currency)"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - numTxNotional:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              Default: =If(gEditMode = "Edit", gEditTransaction.transaction_notional, Blank())
                              HintText: ="e.g. 25000000"
                              Align: =Align.Right
                              Width: =Parent.Width
                              Height: =32
                        # Echo of the figure that WILL be written, in its native currency. No USD
                        # equivalent is shown, because none is stored — see the currency note above.
                        - lblTxNotionalEcho:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                =If( IsBlank(Value(numTxNotional.Text)), "no notional entered",
                                     "= " & gTxCurrency & " " & Text(Value(numTxNotional.Text), "[$-en-US]#,##0")
                                       & "   (converted to a reporting currency in Power BI, not here)" )
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =36
                              VerticalAlign: =VerticalAlign.Middle
                  - lblTxDateCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Trade date  *"
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextMuted
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Height: =18
                  - dtpTxDate:
                      Control: ModernDatePicker@1.0.1
                      Properties:
                        DefaultDate: =If(gEditMode = "Edit", gEditTransaction.transaction_date, Blank())
                        Placeholder: ="Trade date"
                        Format: =DatePickerFormat.LongAbbreviated
                        StartOfWeek: =StartOfWeek.Monday
                        IsEditable: =true
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Height: =32
            - gridTx3:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - colTxClient:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - fldClient:
                            Control: CanvasComponent
                            ComponentName: cmpLookupField
                            Properties:
                              Caption: ="Client  *"
                              PickLabel: ="＋  Choose a client"
                              HasValue: =gTxClient.Id > 0
                              Display: =gTxClient.Value
                              Width: =Parent.Width
                              Height: =62
                              OnPick: |
                                =Set( gTxPicker, "Client" );
                                 Reset( cmpTxPick );
                                 Set( gTxQuery, "" )
                              OnClear: |
                                =Set( gTxClient, { Id: 0, Value: "" } )
            - gridTx4:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - colTxProduct:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - fldProduct:
                            Control: CanvasComponent
                            ComponentName: cmpLookupField
                            Properties:
                              Caption: ="Product  *"
                              PickLabel: ="＋  Choose a product"
                              HasValue: =gTxProduct.Id > 0
                              Display: =gTxProduct.Value
                              Width: =Parent.Width
                              Height: =62
                              OnPick: |
                                =Set( gTxPicker, "Product" );
                                 Reset( cmpTxPick );
                                 Set( gTxQuery, "" )
                              OnClear: |
                                =Set( gTxProduct, { Id: 0, Value: "" } )
                  - colTxSales:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - fldSales:
                            Control: CanvasComponent
                            ComponentName: cmpLookupField
                            Properties:
                              Caption: ="Sales owner  *"
                              PickLabel: ="＋  Choose a sales owner"
                              HasValue: =Len(gTxSales.Mail) > 0
                              Display: =gTxSales.DisplayName
                              Width: =Parent.Width
                              Height: =62
                              OnPick: |
                                =Set( gTxPicker, "Sales" );
                                 Reset( cmpTxPick );
                                 Set( gTxQuery, "" )
                              OnClear: |
                                =Set( gTxSales, { DisplayName: "", Mail: "" } )
            - colTxMissing:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =4
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblTxMissingCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Still required:"
                        Visible: =Len(lblTxMissing.Text) > 0
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextMuted
                        Width: =Parent.Width
                        Height: =18
                  - lblTxMissing:
                      Control: Label@2.5.1
                      Properties:
                        # Also blocks the two ways a numeric field can be wrong rather than
                        # missing: an unparseable notional, and a currency with no FX rate.
                        Text: |
                          =Trim(
                             If( Len(Trim(txtTxName.Text)) = 0,  "label   ",   "" ) &
                             // SAFETY NET, not a prompt. The project is DERIVED and has no field on
                             // this form, but a blank one would still be rejected by SharePoint —
                             // and silently, since there is nothing on screen to point at. Same
                             // guard scrTaskEdit keeps for the same reason.
                             If( gTxProject.Id <= 0,             "a parent project (not set — reopen from the project screen)   ", "" ) &
                             If( gTxClient.Id  <= 0,             "client   ",  "" ) &
                             If( gTxProduct.Id <= 0,             "product   ", "" ) &
                             If( Len(gTxSales.Mail) = 0,         "sales owner   ", "" ) &
                             If( IsBlank(dtpTxDate.SelectedDate),
                                 "a valid trade date   ", "" ) &
                             If( false,
                                 "a numeric notional   ", "" ) )
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.Danger
                        Width: =Parent.Width
                        Height: =40
                        Visible: =Len(Self.Text) > 0
      - actionBarBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Surface
            BorderColor: =Theme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
      - actionBarRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
          Children:
            - lblTxFooterSpacer:
                Control: Label@2.5.1
                Properties:
                  Text: =""
                  FillPortions: =1
                  LayoutMinWidth: =60
                  Height: =48
            - btnTxSave:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =Theme.Color.Primary
                  Color: =Theme.Color.OnPrimary
                  BorderColor: =Theme.Color.Primary
                  BorderThickness: =0
                  Font: =Theme.Font
                  Size: =Theme.Size.Body
                  Text: |
                    =If( gSaving, "Saving…",
                         If(gEditMode = "Edit", "Save transaction", "Create transaction") )
                  # ALWAYS ENABLED — see scrTaskEdit btnTkSave. This gate gated on SIX
                  # fields, so editing any older transaction missing one of them produced a
                  # click that did nothing and said nothing. Moved into OnSelect.
                  FillPortions: =0
                  LayoutMinWidth: =220
                  Width: =220
                  Height: =48
                  # Every column this form owns is required, so a single Patch covers it
                  # — no guarded second pass is needed. transaction_notional_usd is NOT
                  # written: it has no app-side writer by decision (Q14).
                  OnSelect: |
                    =If( gSaving,
                    // A SECOND TAP WHILE THE FIRST WRITE IS STILL IN FLIGHT. Do nothing.
                    // A SharePoint Patch takes seconds; the button stayed live throughout, so a
                    // double-tap ran the whole handler twice and Defaults() built a SECOND new
                    // record. `Set` applies immediately within a behaviour chain, so the flag is
                    // already true by the time the second tap is evaluated.
                    // NO DisplayMode GATE — see this button's ALWAYS ENABLED note. A disabled
                    // button cannot fire OnSelect and cannot say why; the Text says "Saving…"
                    // instead, and the guard below is what actually blocks the duplicate.
                    false,
                    Set( gSaving, true );
                    If( Len(lblTxMissing.Text) > 0,
                    // The requirement that used to disable the button, moved here so a blocked
                    // save names the field. All six are required in schema.yaml — SharePoint would
                    // reject the write regardless; this only decides whether the user is told.
                    Notify( "Can't save yet — this still needs: " & lblTxMissing.Text,
                    NotificationType.Error ),
                    Set( gTxErr, "" );
                    IfError(
                        // The Set wrapper is not decoration: IfError requires all its
                        // arguments to be type-compatible today, and a bare Patch (record)
                        // against a Set fallback is rejected. Both sides are a Set now.
                        Set( gTxSaved,
                        Patch( taskmaster_transactions,
                               If( gEditMode = "Edit", gEditTransaction, Defaults(taskmaster_transactions) ),
                               // Mirrors the PARENT's phase so cross-project queries can exclude archived
                               // work with a delegable `= false`. Written on EVERY save, not just on insert,
                               // so a row whose project was archived while this editor sat open cannot come
                               // back live. gSelProject is the project this screen was opened from, so this
                               // costs no extra query.
                               { transaction_project_archived: Coalesce(gSelProject.project_phase.Value, "") = "Archived",
                               transaction_name:        Trim(txtTxName.Text),
                                 transaction_project_id:  { Id: gTxProject.Id, Value: gTxProject.Value },
                                 transaction_client_name: { Id: gTxClient.Id,  Value: gTxClient.Value },
                                 transaction_product_id:  { Id: gTxProduct.Id, Value: gTxProduct.Value },
                                 transaction_sales:
                                     { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                       Claims:      ClaimPrefix & Lower(gTxSales.Mail),
                                       DisplayName: gTxSales.DisplayName,
                                       Email:       gTxSales.Mail,
                                       Department: "", JobTitle: "", Picture: "" },
                                 transaction_currency:    { Value: gTxCurrency },
                                 transaction_notional:
                                     Value(numTxNotional.Text),
                                 transaction_date:        dtpTxDate.SelectedDate } ) ),
                        Set( gTxErr, FirstError.Message )
                    );
                    If( Len(gTxErr) > 0,
                        Notify("Couldn't save the transaction: " & gTxErr, NotificationType.Error) );
                    If( Len(gTxErr) = 0,
                        Notify( If(gEditMode = "Edit", "Transaction saved", "Transaction created"),
                                NotificationType.Success );
                        Back() ) );
                    Set( gSaving, false ) )
            - btnTxCancel:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =Theme.Color.Surface
                  Color: =Theme.Color.Primary
                  BorderColor: =Theme.Color.Primary
                  BorderThickness: =1
                  Font: =Theme.Font
                  Size: =Theme.Size.Body
                  Text: ="Cancel"
                  FillPortions: =0
                  LayoutMinWidth: =140
                  Width: =140
                  Height: =48
                  OnSelect: =Back()
      # =====================================================================
      # PICKER — ONE cmpPicker instance for the sales owner AND both lookups.
      # Declared LAST so the dialog paints above the footer. gTxPicker names
      # the field and selects the row kind.
      # See scrTaskEdit's instance for the full contract commentary.
      # =====================================================================
      - cmpTxPick:
          Control: CanvasComponent
          ComponentName: cmpPicker
          Properties:
            Visible: =Len( Coalesce(gTxPicker, "") ) > 0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: |
              =Switch( gTxPicker,
                       "Sales",   "Select sales owner",
                       "Client",  "Select client",
                       "Product", "Select product" )
            # Queries run HERE — AccessAppScope false. Bound to gTxQuery, which
            # OnSearch sets, never to the instance's own Query output.
            # Uniform {Key, Primary, Secondary}; Key is Text for both kinds.
            Results: |
              =If( gTxPicker = "Sales" && Len(gTxQuery) >= 2,
              ForAll( Office365Users.SearchUserV2({ searchTerm: gTxQuery, top: 25 }).value As u,
              { Key:       u.Mail,
              Primary:   u.DisplayName,
              Secondary: u.Mail } ),
              gTxPicker = "Client" && Len(gTxQuery) >= 2,
              ForAll( FirstN( Filter( taskmaster_clients,
              StartsWith(client_name, gTxQuery) ), 50 ) As c,
              { Key:       Text(c.ID),
              Primary:   c.client_name,
              Secondary: Coalesce(c.client_type.Value, "") } ),
              gTxPicker = "Product" && Len(gTxQuery) >= 2,
              ForAll( FirstN( Filter( taskmaster_products,
              StartsWith(product_uid, gTxQuery) ), 50 ) As p,
              { Key:       Text(p.ID),
              Primary:   p.product_uid,
              Secondary: Coalesce(p.product_type_path, "") } ) )
            OnSearch: =Set( gTxQuery, cmpTxPick.Query )
            AllowCreate: =gTxPicker = "Client" || gTxPicker = "Product"
            OnConfirm: |
              =Switch( gTxPicker,
              "Sales",   Set( gTxSales,   { DisplayName: cmpTxPick.Picked.Primary, Mail: cmpTxPick.Picked.Secondary } ),
              "Client",  Set( gTxClient,  { Id: Value(cmpTxPick.Picked.Key), Value: cmpTxPick.Picked.Primary } ),
              "Product", Set( gTxProduct, { Id: Value(cmpTxPick.Picked.Key), Value: cmpTxPick.Picked.Primary } ) );
              Set( gTxPicker, "" )
            # + New hands the caller's field name to the create screen via
            # gClReturn / gPdReturn; that screen writes the new record back
            # into the right global and returns here with it selected.
            # DOES NOT TOUCH gEditMode — the create screens carry their own
            # (gClMode / gPdMode); clobbering the caller's lost the record being
            # edited rather than merely the typed values.
            # gTxResume tells this screen's OnVisible that the next show is a RETURN.
            OnCreateNew: |
              =Set( gTxResume, true );
               If( gTxPicker = "Client",
                   Set( gClMode, "New" ); Set( gClReturn, "TxClient" ); Set( gTxPicker, "" );
                   Navigate( scrClientEdit, ScreenTransition.Cover ),
                   Set( gPdMode, "New" ); Set( gPdReturn, "TxProduct" ); Set( gTxPicker, "" );
                   Navigate( scrProductEdit, ScreenTransition.Cover ) )
            OnCancel: =Set( gTxPicker, "" )
