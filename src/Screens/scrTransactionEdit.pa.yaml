# =============================================================================
# scrTransactionEdit  —  create / edit a transaction.
#
# Entered with:  Set(gEditMode, "New" | "Edit");  Set(gEditTransaction, <record>)
# If gSelProject is set, a NEW transaction is pre-attached to that project.
#
# Follows the shared edit-screen pattern documented in scrIssueEdit's header and
# _EDIT-NOTES.md (seed globals in OnVisible and write from them; normalised picker
# records; overlay galleries declared last; required fields in one Patch).
#
# CURRENCY — read this before adding any total to this screen (Q14, 2026-08-03).
# This form writes the NATIVE notional and its currency, and nothing else. It does
# NOT convert to USD: conversion happens in the report layer, against a proper FX
# dimension in Power BI. A write-time rate freezes whatever number the app happened
# to hold on the day of the trade and nothing downstream can ever correct it;
# report-time conversion can be restated, back-dated and audited.
#
# The consequence is deliberate: **no cross-currency figure can be shown in the
# app.** Per-currency is fine; a mixed total is not.
#
# CONNECTION PREREQUISITE: Office 365 Users (people picker). See HANDOFF.md.
# Every column token resolves to schema/schema.yaml (golden source).
# =============================================================================
Screens:
  scrTransactionEdit:
    Properties:
      Fill: =Theme.Color.Bg
      OnVisible: |
        =Set( gTxProject,
              If( gEditMode = "Edit",
                  { Id: gEditTransaction.transaction_project_id.Id,
                    Value: LookUp(taskmaster_projects, ID = gEditTransaction.transaction_project_id.Id, project_name) },
                  gSelProject.ID > 0,
                  { Id: gSelProject.ID, Value: gSelProject.project_name },
                  { Id: 0, Value: "" } ) );
        Set( gTxClient,
              If( gEditMode = "Edit",
                  { Id: gEditTransaction.transaction_client_name.Id, Value: gEditTransaction.transaction_client_name.Value },
                  { Id: 0, Value: "" } ) );
        Set( gTxProduct,
              If( gEditMode = "Edit",
                  { Id: gEditTransaction.transaction_product_id.Id, Value: gEditTransaction.transaction_product_id.Value },
                  { Id: 0, Value: "" } ) );
        Set( gTxSales,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditTransaction.transaction_sales.DisplayName, ""),
                    Mail:        Coalesce(gEditTransaction.transaction_sales.Email, "") },
                  { DisplayName: Coalesce(User().FullName, ""), Mail: Coalesce(User().Email, "") } ) );
        Set( gTxCurrency,
              If( gEditMode = "Edit", Coalesce(gEditTransaction.transaction_currency.Value, "USD"), "USD" ) );
        Reset( txtTxName );
        Reset( txtTxProjectSearch ); Reset( txtTxClientSearch );
        Reset( txtTxProductSearch ); Reset( txtTxSalesSearch );
        // transaction_date is REQUIRED, so an unseeded picker did not merely lose the
        // date — it blocked the save outright on every edit.
        Reset( dtpTxDate )
    Children:
      # ---- Header ----------------------------------------------------------
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Primary
            Height: =Theme.Space.HeaderH
            Width: =Parent.Width
            X: =0
            Y: =0
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: |
              =If(gEditMode = "Edit", "Edit transaction", "New transaction")
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            FontWeight: =FontWeight.Semibold
            Size: =Theme.Size.H2
            Height: =Theme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Theme.Space.Gutter
            Y: =0
            Width: =400
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =Theme.Color.OnPrimary
            Height: =24
            Width: =24
            X: =Parent.Width - 24 - Theme.Space.Gutter
            Y: =(Theme.Space.HeaderH - 24) / 2
            OnSelect: =Back()
      - formSheet:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Surface
            X: =0
            Y: =Theme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - Theme.Space.HeaderH - 88
      - frmTxScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =20
            PaddingBottom: =28
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Theme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - Theme.Space.HeaderH - 88
          Children:
            - gridTx1:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =78
                Children:
                  - lblTxNameCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Transaction label  *"
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Height: =18
                  - txtTxName:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: |
                          =If(gEditMode = "Edit", gEditTransaction.transaction_name, "")
                        Placeholder: ="e.g. QIS-2026-0417 EMEA autocall"
                        Font: =Theme.Font
                        Size: =Theme.Size.Body
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Height: =40
                  - colTxCurrency:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblTxCcyCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Currency  *"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - selTxCurrency:
                            Control: CanvasComponent
                            ComponentName: cmpSelection
                            Properties:
                              Width: =Parent.Width
                              Height: =40
                              Items: |
                                =Table( { Id: 1, Label: "USD" }, { Id: 2, Label: "EUR" }, { Id: 3, Label: "GBP" },
                                        { Id: 4, Label: "JPY" }, { Id: 5, Label: "CHF" } )
                              DefaultId: |
                                =Switch( If(gEditMode = "Edit", Coalesce(gEditTransaction.transaction_currency.Value, "USD"), "USD"),
                                         "USD", 1, "EUR", 2, "GBP", 3, "JPY", 4, 5 )
                              OnChange: |
                                =Set(gTxCurrency, selTxCurrency.Selected.Label)
            - gridTx2:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =110
                Children:
                  - colTxNotional:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =6
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =96
                      Children:
                        - lblTxNotionalCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Notional (native currency)"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - numTxNotional:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              Default: =If(gEditMode = "Edit", gEditTransaction.transaction_notional, Blank())
                              HintText: ="e.g. 25000000"
                              AccessibleLabel: ="Notional in the selected currency"
                              Align: =Align.Right
                              Width: =Parent.Width
                              Height: =32
                        # Echo of the figure that WILL be written, in its native currency. No USD
                        # equivalent is shown, because none is stored — see the currency note above.
                        - lblTxNotionalEcho:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                =If( IsBlank(Value(numTxNotional.Text)), "no notional entered",
                                     "= " & gTxCurrency & " " & Text(Value(numTxNotional.Text), "[$-en-US]#,##0")
                                       & "   (converted to a reporting currency in Power BI, not here)" )
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =36
                              VerticalAlign: =VerticalAlign.Middle
                  - lblTxDateCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Trade date  *"
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextMuted
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Height: =18
                  - dtpTxDate:
                      Control: ModernDatePicker@1.0.1
                      Properties:
                        DefaultDate: =If(gEditMode = "Edit", gEditTransaction.transaction_date, Blank())
                        Placeholder: ="Trade date"
                        Format: =DatePickerFormat.LongAbbreviated
                        StartOfWeek: =StartOfWeek.Monday
                        IsEditable: =true
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Height: =32
            - gridTx3:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - colTxProject:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblTxProjCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Project  *"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - txtTxProjectSearch:
                            Control: ModernTextInput@1.1.1
                            Properties:
                              Visible: =gTxProject.Id <= 0
                              Type: =TextInputType.Search
                              OnChange: =Set(gTxPicker, "Project")
                              Placeholder: ="Type to find a project…"
                              TriggerOutput: =TriggerOutput.Delayed
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Width: =Parent.Width
                              Height: =36
                        - chipTxProject:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Visible: =gTxProject.Id > 0
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =6
                              Width: =Parent.Width
                              Height: =36
                            Children:
                              - lblTxProjChip:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |
                                      =If(gTxProject.Id > 0, gTxProject.Value, "— none selected —")
                                    Font: =Theme.Font
                                    Size: =Theme.Size.Small
                                    Color: |
                                      =If(gTxProject.Id > 0, Theme.Color.TextPrimary, Theme.Color.TextMuted)
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =60
                                    Height: =36
                              - icoTxProjClear:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Icon: =Icon.Cancel
                                    Color: =Theme.Color.TextMuted
                                    FillPortions: =0
                                    LayoutMinWidth: =16
                                    Height: =16
                                    Width: =16
                                    OnSelect: |
                                      =Set(gTxProject, { Id: 0, Value: "" }); Reset(txtTxProjectSearch)
                  - colTxClient:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblTxClientCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Client  *"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - txtTxClientSearch:
                            Control: ModernTextInput@1.1.1
                            Properties:
                              Visible: =gTxClient.Id <= 0
                              Type: =TextInputType.Search
                              OnChange: =Set(gTxPicker, "Client")
                              Placeholder: ="Type to find a client…"
                              TriggerOutput: =TriggerOutput.Delayed
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Width: =Parent.Width
                              Height: =36
                        - chipTxClient:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Visible: =gTxClient.Id > 0
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =6
                              Width: =Parent.Width
                              Height: =36
                            Children:
                              - lblTxClientChip:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |
                                      =If(gTxClient.Id > 0, gTxClient.Value, "— none selected —")
                                    Font: =Theme.Font
                                    Size: =Theme.Size.Small
                                    Color: |
                                      =If(gTxClient.Id > 0, Theme.Color.TextPrimary, Theme.Color.TextMuted)
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =60
                                    Height: =36
                              - icoTxClientClear:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Icon: =Icon.Cancel
                                    Color: =Theme.Color.TextMuted
                                    FillPortions: =0
                                    LayoutMinWidth: =16
                                    Height: =16
                                    Width: =16
                                    OnSelect: |
                                      =Set(gTxClient, { Id: 0, Value: "" }); Reset(txtTxClientSearch)
            - gridTx4:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - colTxProduct:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblTxProductCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Product  *"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - txtTxProductSearch:
                            Control: ModernTextInput@1.1.1
                            Properties:
                              Visible: =gTxProduct.Id <= 0
                              Type: =TextInputType.Search
                              OnChange: =Set(gTxPicker, "Product")
                              Placeholder: ="Type an ISIN / ticker / internal id…"
                              TriggerOutput: =TriggerOutput.Delayed
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Width: =Parent.Width
                              Height: =36
                        - chipTxProduct:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Visible: =gTxProduct.Id > 0
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =6
                              Width: =Parent.Width
                              Height: =36
                            Children:
                              - lblTxProductChip:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |
                                      =If(gTxProduct.Id > 0, gTxProduct.Value, "— none selected —")
                                    Font: =Theme.Font
                                    Size: =Theme.Size.Small
                                    Color: |
                                      =If(gTxProduct.Id > 0, Theme.Color.TextPrimary, Theme.Color.TextMuted)
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =60
                                    Height: =36
                              - icoTxProductClear:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Icon: =Icon.Cancel
                                    Color: =Theme.Color.TextMuted
                                    FillPortions: =0
                                    LayoutMinWidth: =16
                                    Height: =16
                                    Width: =16
                                    OnSelect: |
                                      =Set(gTxProduct, { Id: 0, Value: "" }); Reset(txtTxProductSearch)
                  - colTxSales:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblTxSalesCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Sales owner  *"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - txtTxSalesSearch:
                            Control: ModernTextInput@1.1.1
                            Properties:
                              Visible: =Len(gTxSales.Mail) = 0
                              Type: =TextInputType.Search
                              OnChange: =Set(gTxPicker, "Sales")
                              Placeholder: ="Search people…"
                              TriggerOutput: =TriggerOutput.Delayed
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Width: =Parent.Width
                              Height: =36
                        - chipTxSales:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Visible: =Len(gTxSales.Mail) > 0
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =6
                              Width: =Parent.Width
                              Height: =36
                            Children:
                              - lblTxSalesChip:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |
                                      =If(Len(gTxSales.Mail) > 0, gTxSales.DisplayName, "— none selected —")
                                    Font: =Theme.Font
                                    Size: =Theme.Size.Small
                                    Color: |
                                      =If(Len(gTxSales.Mail) > 0, Theme.Color.TextPrimary, Theme.Color.TextMuted)
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =60
                                    Height: =36
                              - icoTxSalesClear:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Icon: =Icon.Cancel
                                    Color: =Theme.Color.TextMuted
                                    FillPortions: =0
                                    LayoutMinWidth: =16
                                    Height: =16
                                    Width: =16
                                    OnSelect: |
                                      =Set(gTxSales, { DisplayName: "", Mail: "" }); Reset(txtTxSalesSearch)
            - colTxMissing:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =4
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblTxMissingCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Still required:"
                        Visible: =Len(lblTxMissing.Text) > 0
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextMuted
                        Width: =Parent.Width
                        Height: =18
                  - lblTxMissing:
                      Control: Label@2.5.1
                      Properties:
                        # Also blocks the two ways a numeric field can be wrong rather than
                        # missing: an unparseable notional, and a currency with no FX rate.
                        Text: |
                          =Trim(
                             If( Len(Trim(txtTxName.Text)) = 0,  "label   ",   "" ) &
                             If( gTxProject.Id <= 0,             "project   ", "" ) &
                             If( gTxClient.Id  <= 0,             "client   ",  "" ) &
                             If( gTxProduct.Id <= 0,             "product   ", "" ) &
                             If( Len(gTxSales.Mail) = 0,         "sales owner   ", "" ) &
                             If( IsBlank(dtpTxDate.SelectedDate),
                                 "a valid trade date   ", "" ) &
                             If( false,
                                 "a numeric notional   ", "" ) )
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.Danger
                        Width: =Parent.Width
                        Height: =40
                        Visible: =Len(Self.Text) > 0
      - actionBarBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Surface
            BorderColor: =Theme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
      - actionBarRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
          Children:
            - lblTxFooterSpacer:
                Control: Label@2.5.1
                Properties:
                  Text: =""
                  FillPortions: =1
                  LayoutMinWidth: =60
                  Height: =48
            - btnTxSave:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =Theme.Color.Primary
                  Color: =Theme.Color.OnPrimary
                  BorderColor: =Theme.Color.Primary
                  BorderThickness: =0
                  Font: =Theme.Font
                  Size: =Theme.Size.Body
                  Text: |
                    =If(gEditMode = "Edit", "Save transaction", "Create transaction")
                  # ALWAYS ENABLED — see scrTaskEdit btnTkSave. This gate gated on SIX
                  # fields, so editing any older transaction missing one of them produced a
                  # click that did nothing and said nothing. Moved into OnSelect.
                  FillPortions: =0
                  LayoutMinWidth: =220
                  Width: =220
                  Height: =48
                  # Every column this form owns is required, so a single Patch covers it
                  # — no guarded second pass is needed. transaction_notional_usd is NOT
                  # written: it has no app-side writer by decision (Q14).
                  OnSelect: |
                    =If( Len(lblTxMissing.Text) > 0,
                    // The requirement that used to disable the button, moved here so a blocked
                    // save names the field. All six are required in schema.yaml — SharePoint would
                    // reject the write regardless; this only decides whether the user is told.
                    Notify( "Can't save yet — this still needs: " & lblTxMissing.Text,
                    NotificationType.Error ),
                    Set( gTxErr, "" );
                    IfError(
                        // The Set wrapper is not decoration: IfError requires all its
                        // arguments to be type-compatible today, and a bare Patch (record)
                        // against a Set fallback is rejected. Both sides are a Set now.
                        Set( gTxSaved,
                        Patch( taskmaster_transactions,
                               If( gEditMode = "Edit", gEditTransaction, Defaults(taskmaster_transactions) ),
                               { transaction_name:        Trim(txtTxName.Text),
                                 transaction_project_id:  { Id: gTxProject.Id, Value: gTxProject.Value },
                                 transaction_client_name: { Id: gTxClient.Id,  Value: gTxClient.Value },
                                 transaction_product_id:  { Id: gTxProduct.Id, Value: gTxProduct.Value },
                                 transaction_sales:
                                     { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                       Claims:      ClaimPrefix & Lower(gTxSales.Mail),
                                       DisplayName: gTxSales.DisplayName,
                                       Email:       gTxSales.Mail,
                                       Department: "", JobTitle: "", Picture: "" },
                                 transaction_currency:    { Value: gTxCurrency },
                                 transaction_notional:
                                     Value(numTxNotional.Text),
                                 transaction_date:        dtpTxDate.SelectedDate } ) ),
                        Set( gTxErr, FirstError.Message )
                    );
                    If( Len(gTxErr) > 0,
                        Notify("Couldn't save the transaction: " & gTxErr, NotificationType.Error) );
                    If( Len(gTxErr) = 0,
                        Notify( If(gEditMode = "Edit", "Transaction saved", "Transaction created"),
                                NotificationType.Success );
                        Back() ) )
            - btnTxCancel:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =Theme.Color.Surface
                  Color: =Theme.Color.Primary
                  BorderColor: =Theme.Color.Primary
                  BorderThickness: =1
                  Font: =Theme.Font
                  Size: =Theme.Size.Body
                  Text: ="Cancel"
                  FillPortions: =0
                  LayoutMinWidth: =140
                  Width: =140
                  Height: =48
                  OnSelect: =Back()
      # =====================================================================
      # OVERLAY PICKERS — declared last so they float above the fields below.
      # =====================================================================
      - galTxProject:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Visible: =gTxPicker = "Project" && ( Len(txtTxProjectSearch.Text) >= 2 && gTxProject.Id <= 0 )
            Items: |
              =Sort( Filter( taskmaster_projects,
                         StartsWith(project_name, txtTxProjectSearch.Text) ),
                     project_name )
            TemplateSize: =32
            TemplatePadding: =0
            BorderColor: =Theme.Color.Border
            BorderThickness: =1
            X: =24
            Y: =172
            Width: =280
            Height: =132
            TemplateFill: =Theme.Color.Surface
          Children:
            - rowTxProject:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.project_name
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextPrimary
                  X: =8
                  Y: =0
                  Width: =Parent.TemplateWidth - 16
                  Height: =32
                  VerticalAlign: =VerticalAlign.Middle
            - galTxProjectHit:
                Control: Classic/Button@2.2.0
                Properties:
                  # The row's action lives HERE, not on the gallery's OnSelect: a gallery's own
                  # OnSelect does not reliably fire when the click lands on a child control, so
                  # without a transparent full-template button declared LAST the rows look right
                  # and do nothing. Confirmed in Studio on the nav rail, 2026-08-03.
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  OnSelect: |
                    =Select(Parent);
                     Set(gTxProject, { Id: ThisItem.ID, Value: ThisItem.project_name })
