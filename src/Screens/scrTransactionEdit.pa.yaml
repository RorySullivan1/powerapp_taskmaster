                                           gTheme.Color.Danger, gTheme.Color.TextMuted )
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =0
                                    LayoutMinWidth: =180
                                    Width: =180
                                    Height: =24
                              # A saved row is only QUEUED for removal here; Save removes it from
                              # SharePoint. Collect before RemoveIf — ThisItem is gone afterwards.
                              - icoTxOutDel:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Icon: =Icon.Cancel
                                    Color: =gTheme.Color.TextMuted
                                    HoverColor: =gTheme.Color.Danger
                                    HoverFill: =RGBA(0, 0, 0, 0)
                                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                                    Tooltip: ="Remove this output"
                                    FillPortions: =0
                                    LayoutMinWidth: =16
                                    Width: =16
                                    Height: =16
                                    OnSelect: |
                                      =If( ThisItem.OutId > 0, Collect( colTxOutDel, { OutId: ThisItem.OutId } ) );
                                      RemoveIf( colTxOut, Sid = ThisItem.Sid )
            # GATED ON THE MESSAGE, not just its two children. Both were already Visible-gated,
            # so this row sat as 62px of blank space on every valid form. Reading a hidden
            # control's .Text is fine and is already how btnTxSave gates the save — same
            # pattern as lblClMissing on scrClientEdit.
            - colTxMissing:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Visible: =Len(lblTxMissing.Text) > 0
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =4
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblTxMissing:
                      Control: Label@2.5.1
                      Properties:
                        Text: |
                          =With(
                             { m: Concat( Filter( Table(
                                    { L: "Label",          M: Len(Trim(txtTxName.Text)) = 0 },
                                    // SAFETY NET, not a prompt. The project is DERIVED and has no field on this form,
                                    // so a user cannot act on this one — reopen the transaction from the project
                                    // screen. A blank would otherwise be rejected by SharePoint silently.
                                    { L: "Parent Project", M: gTxProject.Id <= 0 },
                                    { L: "Trade Date",     M: IsBlank(dtpTxDate.SelectedDate) },
                                    // THE ONE VALIDITY TEST IN THIS LIST, not a missing-field test: the notional is
                                    // OPTIONAL, so an empty box is fine and only an entry that will not parse fires
                                    // this. It reads as a required field because the list has one format.
                                    { L: "Notional",       M: Len(Trim(numTxNotional.Text)) > 0 && IsBlank(Value(numTxNotional.Text)) } ),
                                  M ), L, " | " ) },
                             If( Len(m) > 0, "Required Fields Remaining: " & m, "" ) )
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.Danger
                        Width: =Parent.Width
                        Height: =40
                        Visible: =Len(Self.Text) > 0
      - actionBarBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            BorderColor: =gTheme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
      - actionBarRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
          Children:
            # DESTRUCTIVE, so it sits hard left, away from Save. Edit mode only. Arms the dialog
            # and deletes nothing; gDelRefs is counted here so the dialog can say what else changes.
            - btnTxDelete:
                Control: Classic/Button@2.2.0
                Properties:
                  Visible: =gEditMode = "Edit"
                  Text: ="Delete"
                  Fill: =gTheme.Color.Surface
                  Color: =gTheme.Color.Danger
                  BorderColor: =gTheme.Color.Danger
                  BorderThickness: =1
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  FillPortions: =0
                  LayoutMinWidth: =140
                  Width: =140
                  Height: =48
                  OnSelect: |
                    =Set( gDelKind, "Transaction" );
                     Set( gDelId, gEditTransaction.ID );
                     Set( gDelName, gEditTransaction.transaction_name );
                     Set( gDelRefs, CountRows( Filter(taskmaster_issues, issue_transaction_name.Id = gEditTransaction.ID) ) );
                     // For the dialog's wording only. Rows removed in the grid but not yet saved are
                     // still in SharePoint, so they count. OnConfirm re-counts from the list.
                     Set( gTxDelOuts, CountRows( Filter(colTxOut, OutId > 0) ) + CountRows(colTxOutDel) )
            - lblTxFooterSpacer:
                Control: Label@2.5.1
                Properties:
                  Text: =""
                  FillPortions: =1
                  LayoutMinWidth: =60
                  Height: =48
            - btnTxSave:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =gTheme.Color.Primary
                  Color: =gTheme.Color.OnPrimary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =0
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Text: |
                    =If( gSaving, "Saving…",
                         If(gEditMode = "Edit", "Save transaction", "Create transaction") )
                  FillPortions: =0
                  LayoutMinWidth: =220
                  Width: =220
                  Height: =48
                  # One Patch for the transaction, then its staged outputs, in that order.
                  # transaction_notional_usd is NOT written: it has no app-side writer by decision.
                  OnSelect: |
                    =If( gSaving,
                    // A SECOND TAP WHILE THE FIRST WRITE IS STILL IN FLIGHT. Do nothing — a Patch takes
                    // seconds and the button stays live, so a double-tap ran the handler twice and built a
                    // SECOND record. `Set` applies immediately within a behaviour chain.
                    false,
                    Set( gSaving, true );
                    If( Len(lblTxMissing.Text) > 0,
                    // Enforced here so a blocked save names the field. All six are required in
                    // schema.yaml, so SharePoint would reject the write regardless.
                    Notify( "Can't save yet. " & lblTxMissing.Text,
                    NotificationType.Error ),
                    Set( gTxSaved, Blank() );
                    Set( gTxErr, "" );
                    // Captured BEFORE the write: a successful save flips gEditMode to "Edit" below.
                    Set( gTxInsert, gEditMode <> "Edit" );
                    // Mirrors the PARENT's phase so cross-project queries can exclude archived work with
                    // a delegable `= false`. Written on EVERY save. Read LIVE from the list, not from
                    // a gallery snapshot — that would be stale, so a project archived since would
                    // stamp `false` and the row would stay in scope forever.
                    // ONE VALUE, TWO WRITERS: the transaction and each of its output rows carry it, and
                    // they must agree.
                    Set( gTxArchived,
                         Coalesce( LookUp( taskmaster_projects, ID = gTxProject.Id,
                                           project_phase.Value ), "" ) = "Archived" );
                    IfError(
                        // The Set wrapper is not decoration: IfError requires all its arguments to be
                        // type-compatible, and a bare Patch (record) against a Set fallback is rejected.
                        Set( gTxSaved,
                        Patch( taskmaster_transactions,
                               If( gEditMode = "Edit", gEditTransaction, Defaults(taskmaster_transactions) ),
                               { transaction_project_archived: gTxArchived,
                               transaction_name:        Trim(txtTxName.Text),
                                 transaction_project_id:  { Id: gTxProject.Id, Value: gTxProject.Value },
                                 // BOTH OPTIONAL. An unset lookup must write Blank(), never {Id: 0};
                                 // an unset person must write Blank(), never a record built on an empty
                                 // Mail — `gClaimPrefix & ""` is a malformed claim and the connector
                                 // rejects the WHOLE Patch. Blank() is also what CLEARS either column.
                                 transaction_client_name:
                                     If( gTxClient.Id > 0,
                                         { Id: gTxClient.Id, Value: gTxClient.Value },
                                         Blank() ),
                                 transaction_product_id:
                                     If( gTxProduct.Id > 0,
                                         { Id: gTxProduct.Id, Value: gTxProduct.Value },
                                         Blank() ),
                                 transaction_sales:
                                     If( Len(gTxSales.Mail) > 0,
                                         { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                           Claims:      gClaimPrefix & Lower(gTxSales.Mail),
                                           DisplayName: gTxSales.DisplayName,
                                           Email:       gTxSales.Mail,
                                           Department: "", JobTitle: "", Picture: "" },
                                         Blank() ),
                                 transaction_currency:    { Value: gTxCurrency },
                                 transaction_notional:
                                     Value(numTxNotional.Text),
                                 transaction_date:        dtpTxDate.SelectedDate,
                                 transaction_comment:     txtTxComment.Text } ) ),
                        Set( gTxErr, FirstError.Message )
                    );
                    // Trust the RECORD, never the message: a write can fail and still leave
                    // FirstError.Message empty.
                    If( IsBlank(gTxSaved.ID) && Len(gTxErr) = 0,
                        Set( gTxErr, "SharePoint returned no record and no error message, so nothing was saved." ) );
                    If( Len(gTxErr) > 0,
                        Notify("Couldn't save the transaction: " & gTxErr, NotificationType.Error) );
                    If( Len(gTxErr) = 0,
                        // --- the transaction now EXISTS. Never insert it twice. -------------
                        // A failed output row keeps the user on this screen to retry, and that retry
                        // must PATCH this record, not create a second one. Read back rather than
                        // reusing Patch's return value, which is not guaranteed to carry every column.
                        Set( gEditTransaction, LookUp(taskmaster_transactions, ID = gTxSaved.ID) );
                        If( IsBlank(gEditTransaction.ID), Set( gEditTransaction, gTxSaved ) );
                        Set( gEditMode, "Edit" );
                        // --- outputs: AFTER the parent, because a new parent's ID must exist first.
                        // Res is the new row's ID as text, or "!" + the error. ONE text field because
                        // IfError's arguments must be type-compatible; an empty Res is a write that
                        // returned no record. ForAll may run rows in any order, so Collect, never Set.
                        // output_task_id is NEVER named: a row has at most one parent.
                        Clear( colTxOutRes );
                        ForAll( colTxOut As r,
                            Collect( colTxOutRes,
                                { Sid: r.Sid, Name: r.Name,
                                  Res:
                                    IfError( Text(
                                        Patch( taskmaster_output,
                                               If( r.OutId > 0,
                                                   LookUp( taskmaster_output, ID = r.OutId ),
                                                   Defaults(taskmaster_output) ),
                                               { output_name:             r.Name,
                                                 output_project_id:       gTxProject.Id,
                                                 output_transaction_id:   gTxSaved.ID,
                                                 // Written on EVERY row, never left to the column
                                                 // default: `= false` does not match a blank.
                                                 output_project_archived: gTxArchived,
                                                 output_date:             r.ODate,
                                                 output_format:           { Value: r.Format },
                                                 output_audience:         { Value: r.Audience },
                                                 output_language:         { Value: r.Language },
                                                 output_branding:         { Value: r.Branding },
                                                 output_approval_flag:    r.Flag,
                                                 output_approval_id:      r.ApprId } )
                                        .ID ),
                                        "!" & FirstError.Message ) } ) );
                        // A written row keeps its new ID, so a retry UPDATES it instead of
                        // inserting it again. Failed rows stay staged as they were.
                        ForAll( Filter( colTxOutRes, Len(Res) > 0 && !StartsWith(Res, "!") ) As k,
                            Patch( colTxOut, LookUp( colTxOut, Sid = k.Sid ), { OutId: Value(k.Res) } ) );
                        // DELETES LOOP OVER THE LOCAL QUEUE, NEVER THE LIST: Studio rejects a Remove
                        // on the data source a ForAll is iterating. Each queued ID is looked up (`=` on
                        // ID delegates) and removed only if it is still there. Then RE-READ: a removal
                        // confirmed gone leaves colTxOutDel, and whatever is still listed failed and is
                        // retried on the next Save.
                        If( !IsEmpty(colTxOutDel),
                            ForAll( colTxOutDel As d,
                                    With( { x: LookUp( taskmaster_output, ID = d.OutId ) },
                                          If( !IsBlank(x.ID), Remove( taskmaster_output, x ) ) ) );
                            ClearCollect( colTxOutLeft,
                                ForAll( Filter( taskmaster_output, output_transaction_id = gTxSaved.ID ) As o,
                                        { OutId: Value(Text(o.ID)) } ) );
                            RemoveIf( colTxOutDel, !(OutId in colTxOutLeft.OutId) ) );
                        Set( gTxOutFail, CountRows( Filter( colTxOutRes, Len(Res) = 0 || StartsWith(Res, "!") ) ) );
                        If( gTxOutFail > 0 || !IsEmpty(colTxOutDel),
                            With( { f: First( Filter( colTxOutRes, Len(Res) = 0 || StartsWith(Res, "!") ) ) },
                                Notify( "Transaction saved, but its outputs did not all save — press Save to retry."
                                          & If( gTxOutFail > 0,
                                                "   " & gTxOutFail & " not written. """ & f.Name & """: "
                                                  & If( Len(f.Res) = 0, "SharePoint returned no record.", Mid(f.Res, 2) ),
                                                "" )
                                          & If( !IsEmpty(colTxOutDel),
                                                "   " & CountRows(colTxOutDel) & " removed output(s) are still in SharePoint.",
                                                "" ),
                                        NotificationType.Error ) ) );
                        If( gTxOutFail = 0 && IsEmpty(colTxOutDel),
                            Notify( If(gTxInsert, "Transaction created", "Transaction saved"),
                                    NotificationType.Success );
                            Back() ) ) );
                    Set( gSaving, false ) )
            - btnTxCancel:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =gTheme.Color.Surface
                  Color: =gTheme.Color.Primary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =1
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Text: ="Cancel"
