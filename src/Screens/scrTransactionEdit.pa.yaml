# =============================================================================
# scrTransactionEdit — create / edit a transaction.
# Entered with gEditMode + gEditTransaction; gSelProject pre-attaches a new one.
# Follows the shared edit-screen pattern documented in scrIssueEdit's header.
#
# CURRENCY — READ THIS BEFORE ADDING ANY TOTAL TO THIS SCREEN. This form writes the
# NATIVE notional and its currency and nothing else. It does NOT convert: a write-time
# rate freezes whatever number the app held on the day of the trade and nothing
# downstream can correct it, whereas report-time conversion can be restated and
# audited. The consequence is deliberate — NO CROSS-CURRENCY FIGURE MAY BE SHOWN IN
# THE APP. Per-currency is fine; a mixed total is not.
#
# CONNECTION PREREQUISITE: Office 365 Users (people picker).
# =============================================================================
Screens:
  scrTransactionEdit:
    Properties:
      Fill: =gTheme.Color.Bg
      OnVisible: |
        =Set( gSaving, false );   // see btnTxSave
        // CURRENCY OPTIONS COME FROM THE COLUMN, not a literal list. Outside the resume guard
        // on purpose: the options do not depend on the record.
        // cmpSelection needs {Id, Label} and Choices() returns only Value, so the Id is
        // synthesised POSITIONALLY. The Ids mean nothing beyond "which row" — DefaultId looks
        // the value up by Label. No "(none)" row: the column is REQUIRED.
        // ONCE PER SESSION, NOT ONCE PER VISIT: an EMPTY list is the only reason to fetch the
        // vocabulary again, and a new currency is picked up on the next app start. No
        // Concurrent here — this screen has exactly one cacheable list, and Concurrent needs two.
        If( IsEmpty(colTxCurrencyOpts),
            ClearCollect( colTxCurrencyOpts,
                      With( { ch: Choices([@taskmaster_transactions].transaction_currency) },
                            ForAll( Sequence( CountRows(ch) ) As n,
                                    { Id: n.Value, Label: Index(ch, n.Value).Value } ) ) ) );
        If( gTxResume,
         Set( gTxResume, false ),
         Set( gTxProject,
              If( gEditMode = "Edit",
                  { Id: gEditTransaction.transaction_project_id.Id,
                    // NOT redundant. The lookup column's live display field is the target's ID, so
                    // `.Value` is a NUMBER — see schema.yaml. Do not "optimise" this away.
                    Value: LookUp(taskmaster_projects, ID = gEditTransaction.transaction_project_id.Id, project_name) },
                  gSelProject.ID > 0,
                  { Id: gSelProject.ID, Value: gSelProject.project_name },
                  { Id: 0, Value: "" } ) );
        Set( gTxClient,
              If( gEditMode = "Edit",
                  { Id: gEditTransaction.transaction_client_name.Id, Value: gEditTransaction.transaction_client_name.Value },
                  { Id: 0, Value: "" } ) );
        Set( gTxProduct,
              If( gEditMode = "Edit",
                  { Id: gEditTransaction.transaction_product_id.Id, Value: gEditTransaction.transaction_product_id.Value },
                  { Id: 0, Value: "" } ) );
        Set( gTxSales,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditTransaction.transaction_sales.DisplayName, ""),
                    Mail:        Coalesce(gEditTransaction.transaction_sales.Email, "") },
                  // NOT User(). The sales owner is usually somebody else — defaulting to whoever is
                  // entering it writes a wrong name silently. The column is OPTIONAL, so an empty
                  // state is a legitimate save, not something lblTxMissing has to catch.
                  { DisplayName: "", Mail: "" } ) );
        Set( gTxCurrency,
              If( gEditMode = "Edit", Coalesce(gEditTransaction.transaction_currency.Value, "USD"), "USD" ) );
        Reset( txtTxName );
        Set( gTxPicker, "" ); Set( gTxQuery, "" ); Reset( cmpTxPick );
        // transaction_date is REQUIRED, so an unseeded picker did not merely lose the date —
        // it blocked the save outright on every edit. A text input re-reads Default ONLY on
        // Reset, or the previous transaction's notional is written onto the next one.
        Reset( numTxNotional );
        Reset( dtpTxDate );
        // cmpSelection re-reads its DefaultId ONLY on Reset.
        // INSIDE the resume guard on purpose: returning from ＋ New must not re-seed from the
        // stored record and discard a currency the user picked before stepping out.
        Reset( selTxCurrency ) )
    Children:
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Primary
            Height: =gTheme.Space.HeaderH
            Width: =Parent.Width
            X: =0
            Y: =0
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: |
              =If(gEditMode = "Edit", "Edit transaction", "New transaction") &
               If( gTxProject.Id > 0, "   ·   " & gTxProject.Value, "" )
            Color: =gTheme.Color.OnPrimary
            Font: =gTheme.Font
            FontWeight: =FontWeight.Semibold
            Size: =gTheme.Size.H2
            Height: =gTheme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =gTheme.Space.Gutter
            Y: =0
            Width: =400
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =gTheme.Color.OnPrimary
            HoverColor: =gTheme.Color.OnPrimary
            HoverFill: =RGBA(255, 255, 255, 0.15)
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            Height: =24
            Width: =24
            X: =Parent.Width - 24 - gTheme.Space.Gutter
            Y: =(gTheme.Space.HeaderH - 24) / 2
            OnSelect: =Back()
      - formSheet:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 88
      - frmTxScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =20
            PaddingBottom: =28
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 88
          Children:
            - gridTx1:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =78
                Children:
                  - lblTxNameCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Transaction label  *"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Height: =18
                  - txtTxName:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: |
                          =If(gEditMode = "Edit", gEditTransaction.transaction_name, "")
                        Placeholder: ="e.g. QIS-2026-0417 EMEA autocall"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Body
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Height: =40
                  - colTxCurrency:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblTxCcyCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Currency  *"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        # A COMBO BOX, not a cmpSelection strip. The strip raises OnChange with
                        # `Select(Parent); cmpSelection.OnChange()`, so the consumer reads `Selected` in the
                        # same behaviour chain that just changed it and can get the PREVIOUS pick.
                        # transaction_currency is REQUIRED, so that lands as the wrong currency on a real
                        # trade rather than as a missing field.
                        # No "(none)" row: the column is required, so the empty state is not a legal value.
                        - selTxCurrency:
                            Control: CanvasComponent
                            ComponentName: cmpSelection
                            Properties:
                              Width: =Parent.Width
                              Height: =40
                              Items: =colTxCurrencyOpts
                              # BY LABEL, not a hard-coded Id. A literal position table fell through to 5 for
                              # everything unlisted, so CHF resolved only because 5 happened to be its row.
                              DefaultId: |
                                =Coalesce( LookUp(colTxCurrencyOpts, Label = gTxCurrency, Id), 1 )
                              OnChange: |
                                =Set(gTxCurrency, selTxCurrency.Selected.Label)
            - gridTx2:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =110
                Children:
                  - colTxNotional:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =6
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =96
                      Children:
                        - lblTxNotionalCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Notional (native currency)"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - numTxNotional:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              Default: =If(gEditMode = "Edit", gEditTransaction.transaction_notional, Blank())
                              # Restricts typing to digits. Without it `Value(.Text)` on a non-numeric entry is
                              # blank, and the save writes blank with nothing on screen to point at.
                              Format: =TextFormat.Number
                              HintText: ="e.g. 25000000"
                              Align: =Align.Right
                              Width: =Parent.Width
                              Height: =32
                        - lblTxNotionalEcho:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                =If( IsBlank(Value(numTxNotional.Text)), "no notional entered",
                                     "= " & gTxCurrency & " " & Text(Value(numTxNotional.Text), "[$-en-US]#,##0")
                                       & "   (not converted — notional is per currency)" )
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =36
                              VerticalAlign: =VerticalAlign.Middle
                  - lblTxDateCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Trade date  *"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Height: =18
                  - dtpTxDate:
                      Control: ModernDatePicker@1.0.1
                      Properties:
                        DefaultDate: =If(gEditMode = "Edit", gEditTransaction.transaction_date, Blank())
                        Placeholder: ="Trade date"
                        Format: =DatePickerFormat.LongAbbreviated
                        StartOfWeek: =StartOfWeek.Monday
                        IsEditable: =true
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Height: =32
            - gridTx3:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - colTxClient:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - fldClient:
                            Control: CanvasComponent
                            ComponentName: cmpLookupField
                            Properties:
                              Caption: ="Client"
                              PickLabel: ="＋  Choose a client"
                              HasValue: =gTxClient.Id > 0
                              Display: =gTxClient.Value
                              Width: =Parent.Width
                              Height: =62
                              OnPick: |
                                =Set( gTxPicker, "Client" );
                                 Reset( cmpTxPick );
                                 Set( gTxQuery, "" )
                              OnClear: |
                                =Set( gTxClient, { Id: 0, Value: "" } )
            - gridTx4:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - colTxProduct:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - fldProduct:
                            Control: CanvasComponent
                            ComponentName: cmpLookupField
                            Properties:
                              Caption: ="Product  *"
                              PickLabel: ="＋  Choose a product"
                              HasValue: =gTxProduct.Id > 0
                              Display: =gTxProduct.Value
                              Width: =Parent.Width
                              Height: =62
                              OnPick: |
                                =Set( gTxPicker, "Product" );
                                 Reset( cmpTxPick );
                                 Set( gTxQuery, "" )
                              OnClear: |
                                =Set( gTxProduct, { Id: 0, Value: "" } )
                  - colTxSales:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - fldSales:
                            Control: CanvasComponent
                            ComponentName: cmpLookupField
                            Properties:
                              Caption: ="Sales owner"
                              PickLabel: ="＋  Choose a sales owner"
                              HasValue: =Len(gTxSales.Mail) > 0
                              Display: =gTxSales.DisplayName
                              Width: =Parent.Width
                              Height: =62
                              OnPick: |
                                =Set( gTxPicker, "Sales" );
                                 Reset( cmpTxPick );
                                 Set( gTxQuery, "" )
                              OnClear: |
                                =Set( gTxSales, { DisplayName: "", Mail: "" } )
            - colTxMissing:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =4
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblTxMissingCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Still required:"
                        Visible: =Len(lblTxMissing.Text) > 0
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        Width: =Parent.Width
                        Height: =18
                  - lblTxMissing:
                      Control: Label@2.5.1
                      Properties:
                        Text: |
                          =Trim(
                             If( Len(Trim(txtTxName.Text)) = 0,  "label   ",   "" ) &
                             // SAFETY NET, not a prompt. The project is DERIVED and has no field on this form,
                             // but a blank one would still be rejected by SharePoint — silently, since there is
                             // nothing on screen to point at.
                             If( gTxProject.Id <= 0,             "a parent project (not set — reopen from the project screen)   ", "" ) &
                             If( gTxProduct.Id <= 0,             "product   ", "" ) &
                             If( IsBlank(dtpTxDate.SelectedDate),
                                 "a valid trade date   ", "" ) &
                             // transaction_notional is optional, so an EMPTY box is fine; only text that will
                             // not parse is an error, and that is silent otherwise.
                             If( Len(Trim(numTxNotional.Text)) > 0
                              && IsBlank(Value(numTxNotional.Text)),
                                 "a numeric notional (that entry is not a number)   ", "" ) )
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.Danger
                        Width: =Parent.Width
                        Height: =40
                        Visible: =Len(Self.Text) > 0
      - actionBarBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            BorderColor: =gTheme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
      - actionBarRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
          Children:
            # DESTRUCTIVE, so it sits hard left, away from Save. Edit mode only. Arms the dialog
            # and deletes nothing; gDelRefs is counted here so the dialog can say what else changes.
            - btnTxDelete:
                Control: Classic/Button@2.2.0
                Properties:
                  Visible: =gEditMode = "Edit"
                  Text: ="Delete"
                  Fill: =gTheme.Color.Surface
                  Color: =gTheme.Color.Danger
                  BorderColor: =gTheme.Color.Danger
                  BorderThickness: =1
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  FillPortions: =0
                  LayoutMinWidth: =140
                  Width: =140
                  Height: =48
                  OnSelect: |
                    =Set( gDelKind, "Transaction" );
                     Set( gDelId, gEditTransaction.ID );
                     Set( gDelName, gEditTransaction.transaction_name );
                     Set( gDelRefs, CountRows( Filter(taskmaster_issues, issue_transaction_name.Id = gEditTransaction.ID) ) )
            - lblTxFooterSpacer:
                Control: Label@2.5.1
                Properties:
                  Text: =""
                  FillPortions: =1
                  LayoutMinWidth: =60
                  Height: =48
            - btnTxSave:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =gTheme.Color.Primary
                  Color: =gTheme.Color.OnPrimary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =0
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Text: |
                    =If( gSaving, "Saving…",
                         If(gEditMode = "Edit", "Save transaction", "Create transaction") )
                  FillPortions: =0
                  LayoutMinWidth: =220
                  Width: =220
                  Height: =48
                  # Every column this form owns is required, so a single Patch covers it.
                  # transaction_notional_usd is NOT written: it has no app-side writer by decision.
                  OnSelect: |
                    =If( gSaving,
                    // A SECOND TAP WHILE THE FIRST WRITE IS STILL IN FLIGHT. Do nothing — a Patch takes
                    // seconds and the button stays live, so a double-tap ran the handler twice and built a
                    // SECOND record. `Set` applies immediately within a behaviour chain.
                    false,
                    Set( gSaving, true );
                    If( Len(lblTxMissing.Text) > 0,
                    // Enforced here so a blocked save names the field. All six are required in
                    // schema.yaml, so SharePoint would reject the write regardless.
                    Notify( "Can't save yet — this still needs: " & lblTxMissing.Text,
                    NotificationType.Error ),
                    Set( gTxSaved, Blank() );
                    Set( gTxErr, "" );
                    IfError(
                        // The Set wrapper is not decoration: IfError requires all its arguments to be
                        // type-compatible, and a bare Patch (record) against a Set fallback is rejected.
                        Set( gTxSaved,
                        Patch( taskmaster_transactions,
                               If( gEditMode = "Edit", gEditTransaction, Defaults(taskmaster_transactions) ),
                               // Mirrors the PARENT's phase so cross-project queries can exclude archived work with
                               // a delegable `= false`. Written on EVERY save. Read LIVE from the list, not from
                               // gSelProject — that global is a gallery snapshot, so a project archived since would
                               // stamp `false` and the row would stay in scope forever.
                               { transaction_project_archived:
                                     Coalesce( LookUp( taskmaster_projects, ID = gSelProject.ID,
                                                       project_phase.Value ), "" ) = "Archived",
                               transaction_name:        Trim(txtTxName.Text),
                                 transaction_project_id:  { Id: gTxProject.Id, Value: gTxProject.Value },
                                 // BOTH OPTIONAL. An unset lookup must write Blank(), never {Id: 0};
                                 // an unset person must write Blank(), never a record built on an empty
                                 // Mail — `gClaimPrefix & ""` is a malformed claim and the connector
                                 // rejects the WHOLE Patch. Blank() is also what CLEARS either column.
                                 transaction_client_name:
                                     If( gTxClient.Id > 0,
                                         { Id: gTxClient.Id, Value: gTxClient.Value },
                                         Blank() ),
                                 transaction_product_id:  { Id: gTxProduct.Id, Value: gTxProduct.Value },
                                 transaction_sales:
                                     If( Len(gTxSales.Mail) > 0,
                                         { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                           Claims:      gClaimPrefix & Lower(gTxSales.Mail),
                                           DisplayName: gTxSales.DisplayName,
                                           Email:       gTxSales.Mail,
                                           Department: "", JobTitle: "", Picture: "" },
                                         Blank() ),
                                 transaction_currency:    { Value: gTxCurrency },
                                 transaction_notional:
                                     Value(numTxNotional.Text),
                                 transaction_date:        dtpTxDate.SelectedDate } ) ),
                        Set( gTxErr, FirstError.Message )
                    );
                    // Trust the RECORD, never the message: a write can fail and still leave
                    // FirstError.Message empty.
                    If( IsBlank(gTxSaved.ID) && Len(gTxErr) = 0,
                        Set( gTxErr, "SharePoint returned no record and no error message, so nothing was saved." ) );
                    If( Len(gTxErr) > 0,
                        Notify("Couldn't save the transaction: " & gTxErr, NotificationType.Error) );
                    If( Len(gTxErr) = 0,
                        Notify( If(gEditMode = "Edit", "Transaction saved", "Transaction created"),
                                NotificationType.Success );
                        Back() ) );
                    Set( gSaving, false ) )
            - btnTxCancel:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =gTheme.Color.Surface
                  Color: =gTheme.Color.Primary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =1
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Text: ="Cancel"
                  FillPortions: =0
                  LayoutMinWidth: =140
                  Width: =140
                  Height: =48
                  OnSelect: =Back()
      # =====================================================================
      # PICKER — ONE cmpPicker instance for the sales owner AND both lookups. Declared LAST
      # so the dialog paints above the footer. See scrTaskEdit's instance for the contract.
      # =====================================================================
      - cmpTxPick:
          Control: CanvasComponent
          ComponentName: cmpPicker
          Properties:
            Visible: =Len( Coalesce(gTxPicker, "") ) > 0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: |
              =Switch( gTxPicker,
                       "Sales",   "Select sales owner",
                       "Client",  "Select client",
                       "Product", "Select product" )
            # Queries run HERE — AccessAppScope false. Bound to gTxQuery, which OnSearch sets,
            # never to the instance's own Query output. See scrTaskEdit's instance.
            # Each record kind is TWO branches and the pair must stay split: StartsWith(col, "")
            # is not a match-everything, it is an invalid query SharePoint rejects outright
            # (tests/README.md, scrProbe-startswith-empty), so the empty-query default page must
            # avoid the Filter entirely. See scrTaskEdit's instance for the full reasoning.
            Results: |
              =If( gTxPicker = "Sales" && Len(gTxQuery) >= 2,
              ForAll( Office365Users.SearchUserV2({ searchTerm: gTxQuery, top: 25 }).value As u,
              { Key:       u.Mail,
              Primary:   u.DisplayName,
              Secondary: u.Mail } ),
              gTxPicker = "Sales",
              Table( { Key:       User().Email,
              Primary:   User().FullName,
              Secondary: User().Email } ),
              gTxPicker = "Client" && Len(gTxQuery) > 0,
              ForAll( FirstN( Sort( Filter( taskmaster_clients,
              StartsWith(client_name, gTxQuery) ), client_name ),
              If( Len(gTxQuery) >= 2, 50, 10 ) ) As c,
              { Key:       Text(c.ID),
              Primary:   c.client_name,
              Secondary: Coalesce(c.client_type.Value, "") } ),
              gTxPicker = "Client",
              ForAll( FirstN( Sort( taskmaster_clients, client_name ), 10 ) As c,
              { Key:       Text(c.ID),
              Primary:   c.client_name,
              Secondary: Coalesce(c.client_type.Value, "") } ),
              gTxPicker = "Product" && Len(gTxQuery) > 0,
              ForAll( FirstN( Sort( Filter( taskmaster_products,
              StartsWith(product_uid, gTxQuery) ), product_uid ),
              If( Len(gTxQuery) >= 2, 50, 10 ) ) As p,
              { Key:       Text(p.ID),
              Primary:   p.product_uid,
              Secondary: Coalesce(p.product_type_path, "") } ),
              gTxPicker = "Product",
              ForAll( FirstN( Sort( taskmaster_products, product_uid ), 10 ) As p,
              { Key:       Text(p.ID),
              Primary:   p.product_uid,
              Secondary: Coalesce(p.product_type_path, "") } ) )
            OnSearch: =Set( gTxQuery, cmpTxPick.Query )
            AllowCreate: =gTxPicker = "Client" || gTxPicker = "Product"
            OnConfirm: |
              =Switch( gTxPicker,
              "Sales",   Set( gTxSales,   { DisplayName: cmpTxPick.Picked.Primary, Mail: cmpTxPick.Picked.Secondary } ),
              "Client",  Set( gTxClient,  { Id: Value(cmpTxPick.Picked.Key), Value: cmpTxPick.Picked.Primary } ),
              "Product", Set( gTxProduct, { Id: Value(cmpTxPick.Picked.Key), Value: cmpTxPick.Picked.Primary } ) );
              Set( gTxPicker, "" )
            OnCreateNew: |
              =Set( gTxResume, true );
               If( gTxPicker = "Client",
                   Set( gClMode, "New" ); Set( gClReturn, "TxClient" ); Set( gTxPicker, "" );
                   Navigate( scrClientEdit, ScreenTransition.Cover ),
                   Set( gPdMode, "New" ); Set( gPdReturn, "TxProduct" ); Set( gTxPicker, "" );
                   Navigate( scrProductEdit, ScreenTransition.Cover ) )
            OnCancel: =Set( gTxPicker, "" )
      # =====================================================================
      # DELETE CONFIRMATION. See scrProject's instance for the Studio check that must happen
      # before this screen is pasted — a component's custom properties do NOT come across in
      # a paste. Visible is gated as well as IsOpen because a component intercepts every
      # click inside its bounds.
      # =====================================================================
      - cmpTxConfirmDel:
          Control: CanvasComponent
          ComponentName: cmpConfirmDialog
          Properties:
            Visible: =Len( Coalesce(gDelKind, "") ) > 0
            IsOpen: =Len( Coalesce(gDelKind, "") ) > 0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: ="Delete this transaction?"
            Message: |
              ="Delete " & gDelName & "?" &
                       If( gDelRefs > 0,
                           " " & gDelRefs & " issue(s) linked to it will be KEPT — only the link to this transaction is cleared.",
                           "" ) &
                       " This cannot be undone."
            ConfirmLabel: ="Delete"
            CancelLabel: ="Cancel"
            Destructive: =true
            # IfError( Remove(...), Notify(...) ) is REJECTED by Studio: Remove and ForAll/Patch
            # return a TABLE while Notify and Set return a boolean, and IfError requires
            # type-compatible arguments. Hence Set-into-a-scrap, with a DIFFERENT name per site.
            OnConfirm: |
              =Set( gDelErr, "" );
               Set( gDelBlock, false );
               If( gDelRefs >= 500, Set( gDelBlock, true ) );
               // DETACH FIRST, then remove — the reverse leaves issues pointing at a row that is
               // already gone. COUNT AND REFUSE rather than half-do it: a local ForAll over a
               // delegable Filter clears SOME references past the data row limit and raises NO error.
               If( !gDelBlock && gDelRefs > 0,
                   IfError( Set( gDelScrapDX,
                                 ForAll( Filter( taskmaster_issues, issue_transaction_name.Id = gDelId ) As iss,
                                         Patch( taskmaster_issues, iss, { issue_transaction_name: Blank() } ) ) ),
                            Set( gDelErr, FirstError.Message ) ) );
               If( Len(gDelErr) = 0 && !gDelBlock,
                   IfError( Set( gDelScrapX,
                                 Remove( taskmaster_transactions, LookUp(taskmaster_transactions, ID = gDelId) ) ),
                            Set( gDelErr, FirstError.Message ) ) );
               If( gDelBlock,
                   Notify( "Too many issues reference this to detach in one pass. Nothing was deleted — ask for the cleanup workflow.",
                           NotificationType.Error ),
                   Len(gDelErr) > 0,
                   Notify( "Couldn't delete it: " & gDelErr
                             & " Some issue links may already have been cleared — reopen the project to check.",
                           NotificationType.Error ),
                   Notify( "Transaction deleted.", NotificationType.Success );
                   // Back() lands on scrProject, whose OnVisible calls btnPrjRecompute.
                   Back() );
               Set( gDelKind, "" )
            OnCancel: =Set( gDelKind, "" )
