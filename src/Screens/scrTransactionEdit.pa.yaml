                        Text: ="Approval ID"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Width: =Parent.Width
                        Height: =18
                  - txtTxOApprId:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: =gTxOApprId
                        Placeholder: ="Approval ID"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Width: =Parent.Width
                        Height: =36
            # Read by mdTxOOk, which stays enabled so a blocked add can name what is missing.
            # The approval id is NOT here: it may be filled in after the output exists.
            - lblTxOMissing:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =With(
                       { m: Concat( Filter( Table(
                              { L: "Name",     M: Len(Trim(txtTxOName.Text)) = 0 },
                              // Not list-required, but every reader sorts and windows on it.
                              { L: "Date",     M: IsBlank(dtpTxODate.SelectedDate) },
                              { L: "Format",   M: Len(gTxOFormat) = 0 },
                              { L: "Audience", M: Len(gTxOAudience) = 0 },
                              { L: "Language", M: Len(gTxOLanguage) = 0 },
                              { L: "Branding", M: Len(gTxOBranding) = 0 } ),
                            M ), L, " | " ) },
                       If( Len(m) > 0, "Required Fields Remaining: " & m, "" ) )
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  Color: =gTheme.Color.Danger
                  Width: =Parent.Width - 48
                  Height: =36
      - mdTxOOk:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =gTxOutOpen
            Fill: =gTheme.Color.Primary
            Color: =gTheme.Color.OnPrimary
            BorderColor: =gTheme.Color.Primary
            BorderThickness: =0
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            Text: =If( gTxOEditSid > 0, "Save output", "Add output" )
            X: =(Parent.Width - 780) / 2 + 780 - 24 - 150
            Y: =(Parent.Height - 500) / 2 + 500 - 24 - 40
            Width: =150
            Height: =40
            # FOUR SINGLE-ARM Ifs, not one If with mixed arms: Notify, Patch, Collect and Set
            # return different types. None of them changes what the guard reads, so all four
            # agree.
            OnSelect: |
              =If( Len(lblTxOMissing.Text) > 0,
                   Notify( "Can't add this output yet. " & lblTxOMissing.Text, NotificationType.Error ) );
               If( Len(lblTxOMissing.Text) = 0 && gTxOEditSid > 0,
                   Patch( colTxOut, LookUp( colTxOut, Sid = gTxOEditSid ),
                          { Name:     Trim(txtTxOName.Text),
                            ODate:    dtpTxODate.SelectedDate,
                            Format:   gTxOFormat,
                            Audience: gTxOAudience,
                            Language: gTxOLanguage,
                            Branding: gTxOBranding,
                            Flag:     tglTxOFlag.Value,
                            ApprId:   Trim(txtTxOApprId.Text) } ) );
               If( Len(lblTxOMissing.Text) = 0 && gTxOEditSid = 0,
                   Collect( colTxOut,
                          { Sid:      If( IsEmpty(colTxOut), 1, Max(colTxOut, Sid) + 1 ),
                            OutId:    0,
                            Name:     Trim(txtTxOName.Text),
                            ODate:    dtpTxODate.SelectedDate,
                            Format:   gTxOFormat,
                            Audience: gTxOAudience,
                            Language: gTxOLanguage,
                            Branding: gTxOBranding,
                            Flag:     tglTxOFlag.Value,
                            ApprId:   Trim(txtTxOApprId.Text) } ) );
               If( Len(lblTxOMissing.Text) = 0,
                   Set( gTxOEditSid, 0 ); Set( gTxOutOpen, false ) )
      - mdTxOCancel:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =gTxOutOpen
            Fill: =gTheme.Color.Surface
            Color: =gTheme.Color.Primary
            BorderColor: =gTheme.Color.Primary
            BorderThickness: =1
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            Text: ="Cancel"
            X: =(Parent.Width - 780) / 2 + 780 - 24 - 150 - 12 - 120
            Y: =(Parent.Height - 500) / 2 + 500 - 24 - 40
            Width: =120
            Height: =40
            OnSelect: =Set( gTxOEditSid, 0 ); Set( gTxOutOpen, false )
      # =====================================================================
      # PICKER — ONE cmpPicker instance for the sales owner AND both lookups. Declared LAST
      # so the dialog paints above the footer. See scrTaskEdit's instance for the contract.
      # =====================================================================
      - cmpTxPick:
          Control: CanvasComponent
          ComponentName: cmpPicker
          Properties:
            Visible: =Len( Coalesce(gTxPicker, "") ) > 0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: |
              =Switch( gTxPicker,
                       "Sales",   "Select sales owner",
                       "Client",  "Select client",
                       "Product", "Select product" )
            # Queries run HERE — AccessAppScope false. Bound to gTxQuery, which OnSearch sets,
            # never to the instance's own Query output. See scrTaskEdit's instance.
            # Each record kind is TWO branches and the pair must stay split: StartsWith(col, "")
            # is not a match-everything, it is an invalid query SharePoint rejects outright
            # (tests/README.md, scrProbe-startswith-empty), so the empty-query default page must
            # avoid the Filter entirely. See scrTaskEdit's instance for the full reasoning.
            Results: |
              =If( gTxPicker = "Sales" && Len(gTxQuery) >= 2,
              ForAll( Office365Users.SearchUserV2({ searchTerm: gTxQuery, top: 25 }).value As u,
              { Key:       u.Mail,
              Primary:   u.DisplayName,
              Secondary: u.Mail } ),
              gTxPicker = "Sales",
              Table( { Key:       User().Email,
              Primary:   User().FullName,
              Secondary: User().Email } ),
              gTxPicker = "Client" && Len(gTxQuery) > 0,
              ForAll( FirstN( Sort( Filter( taskmaster_clients,
              StartsWith(client_name, gTxQuery) ), client_name ),
              If( Len(gTxQuery) >= 2, 50, 10 ) ) As c,
              { Key:       Text(c.ID),
              Primary:   c.client_name,
              Secondary: Coalesce(c.client_type.Value, "") } ),
              gTxPicker = "Client",
              ForAll( FirstN( Sort( taskmaster_clients, client_name ), 10 ) As c,
              { Key:       Text(c.ID),
              Primary:   c.client_name,
              Secondary: Coalesce(c.client_type.Value, "") } ),
              gTxPicker = "Product" && Len(gTxQuery) > 0,
              ForAll( FirstN( Sort( Filter( taskmaster_products,
              StartsWith(product_uid, gTxQuery) ), product_uid ),
              If( Len(gTxQuery) >= 2, 50, 10 ) ) As p,
              { Key:       Text(p.ID),
              Primary:   p.product_uid,
              Secondary: Coalesce(p.product_type_path, "") } ),
              gTxPicker = "Product",
              ForAll( FirstN( Sort( taskmaster_products, product_uid ), 10 ) As p,
              { Key:       Text(p.ID),
              Primary:   p.product_uid,
              Secondary: Coalesce(p.product_type_path, "") } ) )
            OnSearch: =Set( gTxQuery, cmpTxPick.Query )
            AllowCreate: =gTxPicker = "Client" || gTxPicker = "Product"
            OnConfirm: |
              =Switch( gTxPicker,
              "Sales",   Set( gTxSales,   { DisplayName: cmpTxPick.Picked.Primary, Mail: cmpTxPick.Picked.Secondary } ),
              "Client",  Set( gTxClient,  { Id: Value(cmpTxPick.Picked.Key), Value: cmpTxPick.Picked.Primary } ),
              "Product", Set( gTxProduct, { Id: Value(cmpTxPick.Picked.Key), Value: cmpTxPick.Picked.Primary } ) );
              Set( gTxPicker, "" )
            OnCreateNew: |
              =Set( gTxResume, true );
               If( gTxPicker = "Client",
                   Set( gClMode, "New" ); Set( gClReturn, "TxClient" ); Set( gTxPicker, "" );
                   Navigate( scrClientEdit, ScreenTransition.Cover ),
                   Set( gPdMode, "New" ); Set( gPdReturn, "TxProduct" ); Set( gTxPicker, "" );
                   Navigate( scrProductEdit, ScreenTransition.Cover ) )
            OnCancel: =Set( gTxPicker, "" )
      # =====================================================================
      # DELETE CONFIRMATION. See scrProject's instance for the Studio check that must happen
      # before this screen is pasted — a component's custom properties do NOT come across in
      # a paste. Visible is gated as well as IsOpen because a component intercepts every
      # click inside its bounds.
      # =====================================================================
      - cmpTxConfirmDel:
          Control: CanvasComponent
          ComponentName: cmpConfirmDialog
          Properties:
            Visible: =Len( Coalesce(gDelKind, "") ) > 0
            IsOpen: =Len( Coalesce(gDelKind, "") ) > 0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: ="Delete this transaction?"
            Message: |
              ="Delete " & gDelName & "?" &
                       If( gTxDelOuts > 0,
                           " Its " & gTxDelOuts & " output(s) will be DELETED with it.",
                           "" ) &
                       If( gDelRefs > 0,
                           " " & gDelRefs & " issue(s) linked to it will be KEPT — only the link to this transaction is cleared.",
                           "" ) &
                       " This cannot be undone."
            ConfirmLabel: ="Delete"
            CancelLabel: ="Cancel"
            Destructive: =true
            # IfError( Remove(...), Notify(...) ) is REJECTED by Studio: Remove and ForAll/Patch
            # return a TABLE while Notify and Set return a boolean, and IfError requires
            # type-compatible arguments. Hence Set-into-a-scrap, with a DIFFERENT name per site.
            OnConfirm: |
              =Set( gDelErr, "" );
               Set( gDelBlock, false );
               // Re-counted from the LIST, not from the dialog's staged figure: rows added
               // elsewhere since this screen loaded are deleted too.
               Set( gTxDelOutsNow, CountRows( Filter( taskmaster_output, output_transaction_id = gDelId ) ) );
               If( gDelRefs >= 500 || gTxDelOutsNow >= 500, Set( gDelBlock, true ) );
               // DETACH FIRST, then remove — the reverse leaves issues pointing at a row that is
               // already gone. COUNT AND REFUSE rather than half-do it: a local ForAll over a
               // delegable Filter clears SOME references past the data row limit and raises NO error.
               If( !gDelBlock && gDelRefs > 0,
                   IfError( Set( gDelScrapDX,
                                 ForAll( Filter( taskmaster_issues, issue_transaction_name.Id = gDelId ) As iss,
                                         Patch( taskmaster_issues, iss, { issue_transaction_name: Blank() } ) ) ),
                            Set( gDelErr, FirstError.Message ) ) );
               // OUTPUTS ARE DELETED, NOT DETACHED, and BEFORE the transaction: their FK is a plain
               // Number, so SharePoint cascades nothing and a surviving row is an orphan no screen
               // reaches. RemoveIf is not delegable — the 500 guard above is what keeps it whole.
               If( Len(gDelErr) = 0 && !gDelBlock && gTxDelOutsNow > 0,
                   IfError( Set( gDelScrapTxO,
                                 RemoveIf( taskmaster_output, output_transaction_id = gDelId ) ),
                            Set( gDelErr, FirstError.Message ) ) );
               If( Len(gDelErr) = 0 && !gDelBlock,
                   IfError( Set( gDelScrapX,
                                 Remove( taskmaster_transactions, LookUp(taskmaster_transactions, ID = gDelId) ) ),
                            Set( gDelErr, FirstError.Message ) ) );
               If( gDelBlock,
                   Notify( "Too many issues or outputs reference this to clear in one pass. Nothing was deleted — ask for the cleanup workflow.",
                           NotificationType.Error ),
                   Len(gDelErr) > 0,
                   Notify( "Couldn't delete it: " & gDelErr
                             & " Some issue links or outputs may already have been cleared — reopen the project to check.",
                           NotificationType.Error ),
                   Notify( "Transaction deleted.", NotificationType.Success );
                   // Back() lands on scrProject, whose OnVisible calls btnPrjRecompute.
                   Back() );
               Set( gDelKind, "" )
            OnCancel: =Set( gDelKind, "" )
