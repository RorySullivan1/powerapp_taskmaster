                                  Properties:
                                    Text: |
                                      =If( !ThisItem.Flag, "",
                                           Len(ThisItem.ApprId) > 0, "Approval " & ThisItem.ApprId,
                                           "Approval ID missing" )
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: |
