# =============================================================================
# scrTransactionEdit — create / edit a transaction.
# Entered with gEditMode + gEditTransaction; gSelProject pre-attaches a new one.
# Follows the shared edit-screen pattern documented in scrIssueEdit's header.
#
# CURRENCY — READ THIS BEFORE ADDING ANY TOTAL TO THIS SCREEN. This form writes the
# NATIVE notional and its currency and nothing else. It does NOT convert: a write-time
# rate freezes whatever number the app held on the day of the trade and nothing
# downstream can correct it, whereas report-time conversion can be restated and
# audited. The consequence is deliberate — NO CROSS-CURRENCY FIGURE MAY BE SHOWN IN
# THE APP. Per-currency is fine; a mixed total is not.
#
# CONNECTION PREREQUISITE: Office 365 Users (people picker).
# =============================================================================
Screens:
  scrTransactionEdit:
    Properties:
      Fill: =gTheme.Color.Bg
      OnVisible: |
        =Set( gSaving, false );   // see btnTxSave
        // CURRENCY OPTIONS COME FROM THE COLUMN, not a literal list. Outside the resume guard
        // on purpose: the options do not depend on the record.
        // cmpSelection needs {Id, Label} and Choices() returns only Value, so the Id is
        // synthesised POSITIONALLY. The Ids mean nothing beyond "which row" — DefaultId looks
        // the value up by Label. No "(none)" row: the column is REQUIRED.
        // ONCE PER SESSION, NOT ONCE PER VISIT: an EMPTY list is the only reason to fetch a
        // vocabulary again, and a new value is picked up on the next app start.
        // The four output lists feed the output modal's combo boxes. All four columns are
        // REQUIRED, so there is no "(none)" row — the empty state is not a legal value.
        // Concurrent's arms fail independently: one Choices() that errors leaves only its own
        // list empty, and the IsEmpty guard retries it on the next visit.
        Set( gTxOutOpen, false );
        Concurrent(
            If( IsEmpty(colTxCurrencyOpts),
                ClearCollect( colTxCurrencyOpts,
                          With( { ch: Choices([@taskmaster_transactions].transaction_currency) },
                                ForAll( Sequence( CountRows(ch) ) As n,
                                        { Id: n.Value, Label: Index(ch, n.Value).Value } ) ) ) ),
            If( IsEmpty(colTxOFmtOpts),
                ClearCollect( colTxOFmtOpts,
                         ForAll( Choices([@taskmaster_output].output_format) As c, { Value: c.Value } ) ) ),
            If( IsEmpty(colTxOAudOpts),
                ClearCollect( colTxOAudOpts,
                         ForAll( Choices([@taskmaster_output].output_audience) As c, { Value: c.Value } ) ) ),
            If( IsEmpty(colTxOLangOpts),
                ClearCollect( colTxOLangOpts,
                         ForAll( Choices([@taskmaster_output].output_language) As c, { Value: c.Value } ) ) ),
            If( IsEmpty(colTxOBrandOpts),
                ClearCollect( colTxOBrandOpts,
                         ForAll( Choices([@taskmaster_output].output_branding) As c, { Value: c.Value } ) ) ) );
        If( gTxResume,
         Set( gTxResume, false ),
         Set( gTxProject,
              If( gEditMode = "Edit",
                  { Id: gEditTransaction.transaction_project_id.Id,
                    // NOT redundant. The lookup column's live display field is the target's ID, so
                    // `.Value` is a NUMBER — see schema.yaml. Do not "optimise" this away.
                    Value: LookUp(taskmaster_projects, ID = gEditTransaction.transaction_project_id.Id, project_name) },
                  gSelProject.ID > 0,
                  { Id: gSelProject.ID, Value: gSelProject.project_name },
                  { Id: 0, Value: "" } ) );
        Set( gTxClient,
              If( gEditMode = "Edit",
                  { Id: gEditTransaction.transaction_client_name.Id, Value: gEditTransaction.transaction_client_name.Value },
                  { Id: 0, Value: "" } ) );
        Set( gTxProduct,
              If( gEditMode = "Edit",
                  { Id: gEditTransaction.transaction_product_id.Id, Value: gEditTransaction.transaction_product_id.Value },
                  { Id: 0, Value: "" } ) );
        Set( gTxSales,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditTransaction.transaction_sales.DisplayName, ""),
                    Mail:        Coalesce(gEditTransaction.transaction_sales.Email, "") },
                  // NOT User(). The sales owner is usually somebody else — defaulting to whoever is
                  // entering it writes a wrong name silently. The column is OPTIONAL, so an empty
                  // state is a legitimate save, not something lblTxMissing has to catch.
                  { DisplayName: "", Mail: "" } ) );
        Set( gTxCurrency,
              If( gEditMode = "Edit", Coalesce(gEditTransaction.transaction_currency.Value, "USD"), "USD" ) );
        Reset( txtTxName ); Reset( txtTxComment );
        Set( gTxPicker, "" ); Set( gTxQuery, "" ); Reset( cmpTxPick );
        // transaction_date is REQUIRED, so an unseeded picker did not merely lose the date —
        // it blocked the save outright on every edit. A text input re-reads Default ONLY on
        // Reset, or the previous transaction's notional is written onto the next one.
        Reset( numTxNotional );
        Reset( dtpTxDate );
        // OUTPUT STAGING. INSIDE the resume guard: returning from ＋ New must not discard rows
        // staged before stepping out. Read off the RAW list — `=` on the indexed Number FK
        // delegates, and LiveOutputs would hide an archived project's rows from its own editor.
        // Sid is the row's identity in the grid; a loaded row reuses its SharePoint ID, and a
        // new row takes Max + 1, so the two can never collide.
        Clear( colTxOutDel );
        Clear( colTxOut );
        If( gEditMode = "Edit",
            // Value(Text(o.ID)), NOT o.ID: a built-in ID projected out of a ForAll row breaks a
            // later LookUp(..., ID = <copy>) against the list. Do not simplify it.
            Collect( colTxOut,
                ForAll( Filter( taskmaster_output, output_transaction_id = gEditTransaction.ID ) As o,
                        { Sid:      Value(Text(o.ID)),
                          OutId:    Value(Text(o.ID)),
                          Name:     o.output_name,
                          // Rebuilt as a DATE so a loaded row and a modal-staged row
                          // (dtpTxODate.SelectedDate) carry the same type in one collection.
                          ODate:    If( IsBlank(o.output_date), Blank(),
                                        Date( Year(o.output_date), Month(o.output_date), Day(o.output_date) ) ),
                          Format:   o.output_format.Value,
                          Audience: o.output_audience.Value,
                          Language: o.output_language.Value,
                          Branding: o.output_branding.Value,
                          Flag:     Coalesce(o.output_approval_flag, false),
                          ApprId:   Coalesce(o.output_approval_id, "") } ) ) );
        // cmpSelection re-reads its DefaultId ONLY on Reset.
        // INSIDE the resume guard on purpose: returning from ＋ New must not re-seed from the
        // stored record and discard a currency the user picked before stepping out.
        Reset( selTxCurrency ) )
    Children:
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Primary
            Height: =gTheme.Space.HeaderH
            Width: =Parent.Width
            X: =0
            Y: =0
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: |
              =If(gEditMode = "Edit", "Edit transaction", "New transaction") &
               If( gTxProject.Id > 0, "   ·   " & gTxProject.Value, "" )
            Color: =gTheme.Color.OnPrimary
            Font: =gTheme.Font
            FontWeight: =FontWeight.Semibold
            Size: =gTheme.Size.H2
            Height: =gTheme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =gTheme.Space.Gutter
            Y: =0
            Width: =400
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =gTheme.Color.OnPrimary
            HoverColor: =gTheme.Color.OnPrimary
            HoverFill: =RGBA(255, 255, 255, 0.15)
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            Height: =24
            Width: =24
            X: =Parent.Width - 24 - gTheme.Space.Gutter
            Y: =(gTheme.Space.HeaderH - 24) / 2
            OnSelect: =Back()
      - formSheet:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 88
      - frmTxScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =20
            PaddingBottom: =28
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 88
          Children:
            # ROW 1 — the label spans BOTH columns: it is what a user scans for, and its
            # placeholder is long enough that a half-width box truncated it.
            - gridTx1:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblTxNameCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Transaction label  *"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Height: =18
                  - txtTxName:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: |
                          =If(gEditMode = "Edit", gEditTransaction.transaction_name, "")
                        Placeholder: ="e.g. QIS-2026-0417 EMEA autocall"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Body
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Height: =40
            # ROW 2 — the two record lookups together. Client used to sit alone in a two-column
            # grid, wasting the entire right-hand half.
            - gridTx2:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - colTxClient:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - fldClient:
                            Control: CanvasComponent
                            ComponentName: cmpLookupField
                            Properties:
                              Caption: ="Client"
                              PickLabel: ="＋  Choose a client"
                              HasValue: =gTxClient.Id > 0
                              Display: =gTxClient.Value
                              Width: =Parent.Width
                              Height: =62
                              OnPick: |
                                =Set( gTxPicker, "Client" );
                                 Reset( cmpTxPick );
                                 Set( gTxQuery, "" )
                              OnClear: |
                                =Set( gTxClient, { Id: 0, Value: "" } )
                  - colTxProduct:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - fldProduct:
                            Control: CanvasComponent
                            ComponentName: cmpLookupField
                            Properties:
                              Caption: ="Product"
                              PickLabel: ="＋  Choose a product"
                              HasValue: =gTxProduct.Id > 0
                              Display: =gTxProduct.Value
                              Width: =Parent.Width
                              Height: =62
                              OnPick: |
                                =Set( gTxPicker, "Product" );
                                 Reset( cmpTxPick );
                                 Set( gTxQuery, "" )
                              OnClear: |
                                =Set( gTxProduct, { Id: 0, Value: "" } )
            # ROW 3 — the remaining person field, paired with the date.
            - gridTx3:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - colTxSales:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - fldSales:
                            Control: CanvasComponent
                            ComponentName: cmpLookupField
                            Properties:
                              Caption: ="Sales owner"
                              PickLabel: ="＋  Choose a sales owner"
                              HasValue: =Len(gTxSales.Mail) > 0
                              Display: =gTxSales.DisplayName
                              Width: =Parent.Width
                              Height: =62
                              OnPick: |
                                =Set( gTxPicker, "Sales" );
                                 Reset( cmpTxPick );
                                 Set( gTxQuery, "" )
                              OnClear: |
                                =Set( gTxSales, { DisplayName: "", Mail: "" } )
                  - lblTxDateCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Trade date  *"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Height: =18
                  - dtpTxDate:
                      Control: ModernDatePicker@1.0.1
                      Properties:
                        DefaultDate: =If(gEditMode = "Edit", gEditTransaction.transaction_date, Blank())
                        Placeholder: ="Trade date"
                        Format: =DatePickerFormat.LongAbbreviated
                        StartOfWeek: =StartOfWeek.Monday
                        IsEditable: =true
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Height: =32
            # ROW 4 — notional and its currency are ONE fact; they were split across two rows.
            - gridTx4:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =110
                Children:
                  - colTxNotional:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =6
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =96
                      Children:
                        - lblTxNotionalCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Notional (native currency)"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - numTxNotional:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              Default: =If(gEditMode = "Edit", gEditTransaction.transaction_notional, Blank())
                              # Restricts typing to digits. Without it `Value(.Text)` on a non-numeric entry is
                              # blank, and the save writes blank with nothing on screen to point at.
                              Format: =TextFormat.Number
                              HintText: ="e.g. 25000000"
                              Align: =Align.Right
                              Width: =Parent.Width
                              Height: =32
                        - lblTxNotionalEcho:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                =If( IsBlank(Value(numTxNotional.Text)), "no notional entered",
                                     "= " & gTxCurrency & " " & Text(Value(numTxNotional.Text), "[$-en-US]#,##0")
                                       & "   (not converted — notional is per currency)" )
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =36
                              VerticalAlign: =VerticalAlign.Middle
                  - colTxCurrency:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblTxCcyCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Currency  *"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        # A COMBO BOX, not a cmpSelection strip. The strip raises OnChange with
                        # `Select(Parent); cmpSelection.OnChange()`, so the consumer reads `Selected` in the
                        # same behaviour chain that just changed it and can get the PREVIOUS pick.
                        # transaction_currency is REQUIRED, so that lands as the wrong currency on a real
                        # trade rather than as a missing field.
                        # No "(none)" row: the column is required, so the empty state is not a legal value.
                        - selTxCurrency:
                            Control: CanvasComponent
                            ComponentName: cmpSelection
                            Properties:
                              Width: =Parent.Width
                              Height: =40
                              Items: =colTxCurrencyOpts
                              # BY LABEL, not a hard-coded Id. A literal position table fell through to 5 for
                              # everything unlisted, so CHF resolved only because 5 happened to be its row.
                              DefaultId: |
                                =Coalesce( LookUp(colTxCurrencyOpts, Label = gTxCurrency, Id), 1 )
                              OnChange: |
                                =Set(gTxCurrency, selTxCurrency.Selected.Label)
            # FULL WIDTH, and the last field before the outputs. It is the only free-text field
            # here and the only one that can run long; a half-width multiline box is unusable
            # for it. PLAIN multiline — transaction_comment is Note, not rich text, and a
            # ModernTextInput cannot render markup either way.
            - colTxComment:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =8
                  Width: =Parent.Width - 48
                  Height: =110
                Children:
                  - lblTxCommentCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Comment"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        Width: =Parent.Width
                        Height: =18
                  - txtTxComment:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: |
                          =If(gEditMode = "Edit", gEditTransaction.transaction_comment, "")
                        Placeholder: ="Optional — anything worth recording about this trade"
                        Type: =TextInputType.Multiline
                        TriggerOutput: =TriggerOutput.Delayed
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Body
                        FillPortions: =0
                        LayoutMinHeight: =84
                        Width: =Parent.Width
                        Height: =84
            # ---------------------------------------------------------------------
            # OUTPUTS — read-only staged rows; the modal below edits one at a time. Nothing is
            # written until Save. Sits ABOVE the validation line, so "Required Fields Remaining"
            # stays the last thing before the action bar.
            # blkTxOut's Height is the exact sum of its visible children, and a hidden child takes
            # no space: 36 head + 8 gap + (24 empty label | rows x 34 + 2 gallery). A gallery row
            # pitch is TemplateSize + TemplatePadding = 34, plus one 2px padding at the end.
            # Capped at 6 rows; more scroll inside the gallery.
            # The row is auto-layout: the name label (FillPortions 1) carries OnSelect, so no
            # full-template overlay sits over the delete icon.
            # ---------------------------------------------------------------------
            - blkTxOut:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =8
                  FillPortions: =0
                  LayoutMinHeight: |
                    =36 + 8 + If( IsEmpty(colTxOut), 24, Min(CountRows(colTxOut), 6) * 34 + 2 )
                  Width: =Parent.Width - 48
                  Height: |
                    =36 + 8 + If( IsEmpty(colTxOut), 24, Min(CountRows(colTxOut), 6) * 34 + 2 )
                Children:
                  - rowTxOutHead:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =12
                        FillPortions: =0
                        LayoutMinHeight: =36
                        Width: =Parent.Width
                        Height: =36
                      Children:
                        - lblTxOutHead:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                ="Outputs" &
                                 If( IsEmpty(colTxOut), "",
                                     "   (" & CountRows(colTxOut) & ")   ·   select a name to edit it" )
                              Font: =gTheme.Font
                              FontWeight: =FontWeight.Semibold
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =1
                              LayoutMinWidth: =120
                              Height: =36
                        - btnTxOutAdd:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: ="+  Add output"
                              Fill: =gTheme.Color.Surface
                              Color: =gTheme.Color.Primary
                              BorderColor: =gTheme.Color.Primary
                              BorderThickness: =1
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Body
                              FillPortions: =0
                              LayoutMinWidth: =180
                              Width: =180
                              Height: =36
                              # PREFILLED FROM THE LAST ROW: consecutive outputs usually share their
                              # format, audience, language and branding. Blank when there is no row.
                              OnSelect: |
                                =Set( gTxOEditSid, 0 );
                                 Set( gTxOName, "" );
                                 Set( gTxODate, Today() );
                                 Set( gTxOFormat,   Coalesce( Last(colTxOut).Format, "" ) );
                                 Set( gTxOAudience, Coalesce( Last(colTxOut).Audience, "" ) );
                                 Set( gTxOLanguage, Coalesce( Last(colTxOut).Language, "" ) );
                                 Set( gTxOBranding, Coalesce( Last(colTxOut).Branding, "" ) );
                                 Set( gTxOFlag, false );
                                 Set( gTxOApprId, "" );
                                 Reset( txtTxOName ); Reset( dtpTxODate );
                                 Reset( cboTxOFormat ); Reset( cboTxOAudience );
                                 Reset( cboTxOLanguage ); Reset( cboTxOBranding );
                                 Reset( tglTxOFlag ); Reset( txtTxOApprId );
                                 Set( gTxOutOpen, true )
                  - lblTxOutEmpty:
                      Control: Label@2.5.1
                      Properties:
                        Visible: =IsEmpty(colTxOut)
                        Text: ="No outputs logged on this transaction."
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =0
                        LayoutMinHeight: =24
                        Width: =Parent.Width
                        Height: =24
                  - galTxOut:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                      Properties:
                        Visible: =!IsEmpty(colTxOut)
                        Items: =colTxOut
                        WrapCount: =1
                        TemplateSize: =32
                        TemplatePadding: =2
                        TemplateFill: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        FillPortions: =1
                        LayoutMinHeight: =36
                        Width: =Parent.Width
                        Height: =Min(CountRows(colTxOut), 6) * 34 + 2
                      Children:
                        - rowTxOutItem:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =12
                              PaddingLeft: =8
                              PaddingRight: =8
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth
                              Height: =28
                            Children:
                              - lblTxOutName:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =ThisItem.Name
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextPrimary
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =120
                                    Height: =24
                                    OnSelect: |
                                      =Set( gTxOEditSid, ThisItem.Sid );
                                      Set( gTxOName, ThisItem.Name );
                                      Set( gTxODate, ThisItem.ODate );
                                      Set( gTxOFormat, ThisItem.Format );
                                      Set( gTxOAudience, ThisItem.Audience );
                                      Set( gTxOLanguage, ThisItem.Language );
                                      Set( gTxOBranding, ThisItem.Branding );
                                      Set( gTxOFlag, ThisItem.Flag );
                                      Set( gTxOApprId, ThisItem.ApprId );
                                      Reset( txtTxOName ); Reset( dtpTxODate );
                                      Reset( cboTxOFormat ); Reset( cboTxOAudience );
                                      Reset( cboTxOLanguage ); Reset( cboTxOBranding );
                                      Reset( tglTxOFlag ); Reset( txtTxOApprId );
                                      Set( gTxOutOpen, true )
                              - lblTxOutDate:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =Text(ThisItem.ODate, "[$-en-US]dd mmm yyyy")
                                    Font: =gTheme.Font
                                    Size: =gTheme.Size.Small
                                    Color: =gTheme.Color.TextMuted
