# Create / edit an issue. Entered with gEditMode + gEditIssue; gSelProject pre-attaches
# a new issue to that project.
#
# The pattern all four scr*Edit screens share:
#  1. Seed globals in OnVisible, write from globals — never from a control's live state.
#  2. Picker globals have ONE fixed record shape; "nothing picked" is the empty/zero
#     record, tested with Len(...) = 0 or .Id <= 0, never IsBlank on a record.
#  3. Overlay pickers are DECLARED LAST — z-order is positional in this dialect.
#  4. Required columns go in the Patch; optional ones are If(cond, value, Blank()) inside
#     the same record. Writing {Value: ""} to an unset Choice fails.
#  5. Success is never assumed: Errors() returns a table, so IsError(Errors(...)) never
#     fires. Capture FirstError.Message inside IfError's fallback and gate on it.
#
# Office 365 Users must be added in Studio before this pastes.
Screens:
  scrIssueEdit:
    Properties:
      Fill: =gTheme.Color.Bg
      OnVisible: |
        =Set( gSaving, false );   // see btnIssSave
        Set( gIssProject,
              If( gEditMode = "Edit",
                  { Id: gEditIssue.issue_project_id.Id,
                    // NOT redundant. The lookup column's live display field is the target's ID,
                    // so `.Value` is a NUMBER — see schema.yaml on this column. Resolving the
                    // name app-side is the fix from 2026-08-09; do not "optimise" it away.
                    Value: LookUp(taskmaster_projects, ID = gEditIssue.issue_project_id.Id, project_name) },
                  gSelProject.ID > 0,
                  { Id: gSelProject.ID, Value: gSelProject.project_name },
                  { Id: 0, Value: "" } ) );
        Set( gIssTask,
              If( gEditMode = "Edit" && gEditIssue.issue_task_name.Id > 0,
                  { Id: gEditIssue.issue_task_name.Id, Value: gEditIssue.issue_task_name.Value },
                  { Id: 0, Value: "" } ) );
        Set( gIssTx,
              If( gEditMode = "Edit" && gEditIssue.issue_transaction_name.Id > 0,
                  { Id: gEditIssue.issue_transaction_name.Id, Value: gEditIssue.issue_transaction_name.Value },
                  { Id: 0, Value: "" } ) );
        Set( gIssAssignee,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditIssue.issue_assignee.DisplayName, ""),
                    Mail:        Coalesce(gEditIssue.issue_assignee.Email, "") },
                  { DisplayName: Coalesce(User().FullName, ""), Mail: Coalesce(User().Email, "") } ) );
        // NO gIssOwner SEED. issue_owner is stamped once on insert and displayed
        // straight off gEditIssue — it is never staged, because nothing edits it.
        // OPTION SETS FOR THE TWO ASSOCIATION DROPDOWNS. Collected here, AFTER
        // gIssProject is seeded above — they depend on it.
        // Delegable: `=` on an indexed Lookup FK. The "(none)" row is Collected first
        // so it sorts to the top, and it is what makes Id 0 a selectable "unlink"
        // instead of needing a separate clear button.
        // ForAll(... As alias, {record literal}) narrows each row to {Id, Label}; a
        // literal cannot be Collected alongside a raw SharePoint row, whose schema is
        // far wider, so both halves are projected to the same two columns.
        //
        // THE Filter DELEGATES; THE ForAll AROUND IT DOES NOT. So each option list is
        // capped at the DATA ROW LIMIT (set it to 2000). A project with more tasks than
        // that gets a silently short dropdown. The repo already treats 500-per-project
        // as reachable — scrProjectEdit's C3 rollup refuses to compute above it — so
        // this is a real ceiling, not a theoretical one. It is accepted here because the
        // alternative is going back to a search picker over the whole tenant, which is
        // what this replaced; revisit if a project ever nears the limit.
        ClearCollect( colIssTaskOpts, { Id: 0, Label: "(none)" } );
        Collect( colIssTaskOpts,
                 ForAll( Filter( taskmaster_tasks,
                                 task_project_id.Id = gIssProject.Id ) As t,
                         { Id: t.ID, Label: t.task_name } ) );
        ClearCollect( colIssTxOpts, { Id: 0, Label: "(none)" } );
        Collect( colIssTxOpts,
                 ForAll( Filter( taskmaster_transactions,
                                 transaction_project_id.Id = gIssProject.Id ) As x,
                         { Id: x.ID, Label: x.transaction_name } ) );
        If( gIssTask.Id > 0 && IsBlank( LookUp(colIssTaskOpts, Id = gIssTask.Id) ),
            Collect( colIssTaskOpts, { Id: gIssTask.Id, Label: gIssTask.Value } ) );
        If( gIssTx.Id > 0 && IsBlank( LookUp(colIssTxOpts, Id = gIssTx.Id) ),
            Collect( colIssTxOpts, { Id: gIssTx.Id, Label: gIssTx.Value } ) );
        // ALL THREE CHOICE VOCABULARIES COME FROM THE COLUMNS, not literal lists. A
        // hard-coded list drifts from SharePoint silently — project_phase carried two
        // values the app never enumerated, and those projects simply vanished.
        //
        // status is REQUIRED, so it gets no blank row. type and impact are optional,
        // and "(none)" is Collected FIRST so it leads each list: an optional Choice has
        // to be clearable and {Value: ""} is not a legal write, so the blank has to be
        // a real option rather than an empty selection.
        ClearCollect( colIssStatusOpts,
                      With( { ch: Choices([@taskmaster_issues].issue_status) },
                            ForAll( Sequence( CountRows(ch) ) As n,
                                    { Id: n.Value, Label: Index(ch, n.Value).Value } ) ) );
        //
        // cmpSelection needs {Id, Label} and Choices() returns only Value, so the Id is
        // synthesised POSITIONALLY: Sequence() numbers the rows and Index() reads the
        // nth choice back out. Row 1 is "(none)", so the real choices start at Id 2.
        // The Ids mean nothing beyond "which row" — never hard-code one, look it up by
        // Label, which is what each DefaultId does.
        ClearCollect( colIssTypeOpts,
                      With( { ch: Choices([@taskmaster_issues].issue_type) },
                            ForAll( Sequence( CountRows(ch) + 1 ) As n,
                                    { Id:    n.Value,
                                      Label: If( n.Value = 1, "(none)",
                                                 Index(ch, n.Value - 1).Value ) } ) ) );
        ClearCollect( colIssImpactOpts,
                      With( { ch: Choices([@taskmaster_issues].issue_impact) },
                            ForAll( Sequence( CountRows(ch) + 1 ) As n,
                                    { Id:    n.Value,
                                      Label: If( n.Value = 1, "(none)",
                                                 Index(ch, n.Value - 1).Value ) } ) ) );
        Set( gIssStatus, If( gEditMode = "Edit", Coalesce(gEditIssue.issue_status.Value, "Open"), "Open" ) );
        Set( gIssType,   If( gEditMode = "Edit", Coalesce(gEditIssue.issue_type.Value,   "(none)"), "(none)" ) );
        Set( gIssImpact, If( gEditMode = "Edit", Coalesce(gEditIssue.issue_impact.Value, "(none)"), "(none)" ) );
        Reset( txtIssName ); Reset( txtIssDesc );
        Set( gIssPicker, "" ); Set( gIssQuery, "" ); Reset( cmpIssPick );
        // Re-read DefaultDate; see the note on the pickers themselves.
        Reset( dtpIssTarget );
        // A combo box re-reads DefaultSelectedItems ONLY on Reset.
        Reset( cboIssTask ); Reset( cboIssTx );
        // cmpSelection re-reads its DefaultId ONLY on Reset — it gained OnReset for
        // exactly this on 2026-08-11.
        Reset( selIssStatus ); Reset( selIssType ); Reset( selIssImpact )
    Children:
      # =====================================================================
      # HEALTH RECOMPUTE. Hidden, 1x1, declared FIRST so it can never cover a
      # control — z-order is positional in this dialect. Select() DOES fire on an
      # invisible control (probe, tests/README.md). Seed colHlTasks with the task
      # ids to recompute, then Select this.
      # =====================================================================
      - btnIssHealth:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Visible: =false
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            X: =0
            Y: =0
            Width: =1
            Height: =1
            OnSelect: |
              =// Recomputes the STORED half of task health for every task in colHlTasks.
               // The rules, and why OVERDUE IS DELIBERATELY NOT IN HERE, live in one place:
               // rollups.task_health in schema.yaml. Do not restate them at the call sites.
               //
               // THIS BODY IS DUPLICATED ON scrIssueEdit AND scrProject and must stay
               // identical — a control can only be Selected from its own screen, so there is
               // no shared copy to call. Change one, change the other.
               //
               // NARROW SERVER-SIDE, TEST LOCALLY. The outer Filter uses issue_task_name and
               // issue_status, both INDEXED, so it delegates; issue_type and issue_impact are
               // NOT indexed and are only ever tested against the few rows it returns. Written
               // as one flat Filter the whole query would go non-delegable and silently read a
               // page of the issues list instead of one task's issues.
               //
               // The RAW list, not OpenIssues: that named formula also excludes archived
               // projects, which would drive every task under one to Green rather than leave
               // it alone. This query is already scoped to a single task.
               ClearCollect( colHlWork,
                   ForAll( colHlTasks As t,
                       { Id: t.Id,
                         Hl: With( { iss: Filter( taskmaster_issues,
                                                  issue_task_name.Id = t.Id
                                               && issue_status.Value = "Open" ) },
                                 // AMBER IS THE RESIDUAL — "any other open issue" — NOT the
                                 // four amber types enumerated. Enumerated, a type added in
                                 // SharePoint and not added here falls through to GREEN: an
                                 // allow-list failing CLOSED, silently, on the one signal that
                                 // exists to warn people. As a residual it fails SAFE — an
                                 // unknown or blank type reads Amber, which is visible.
                                 If( CountRows( Filter( iss,
                                         issue_impact.Value = "Critical"
                                      || issue_type.Value = "Blockage"
                                      || issue_type.Value = "Exception"
                                      || issue_type.Value = "Limitation" ) ) > 0, "Red",
                                     CountRows(iss) > 0, "Amber",
                                     "Green" ) ) } ) );
               // WRITE ONLY ON A CHANGE, exactly like project_phase: most issue edits leave
               // the task's health where it was, and a no-op Patch is still a round trip.
               // A failed health write is NOT worth interrupting a save or a delete for —
               // the next recompute retries it and only a stale colour is wrong meanwhile.
               ForAll( colHlWork As w,
                   With( { tk: LookUp(taskmaster_tasks, ID = w.Id) },
                       If( !IsBlank(tk.ID) && Coalesce(tk.task_status.Value, "") <> w.Hl,
                           IfError( Set( gHlScrapI,
                                         Patch( taskmaster_tasks, tk,
                                                { task_status: { Value: w.Hl } } ) ),
                                    Set( gHlErr, FirstError.Message ) ) ) ) )
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Primary
            Height: =gTheme.Space.HeaderH
            Width: =Parent.Width
            X: =0
            Y: =0
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: =If(gEditMode = "Edit", "Edit issue", "New issue") &
               If( gIssProject.Id > 0, "   ·   " & gIssProject.Value, "" )
            Color: =gTheme.Color.OnPrimary
            Font: =gTheme.Font
            FontWeight: =FontWeight.Semibold
            Size: =gTheme.Size.H2
            Height: =gTheme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =gTheme.Space.Gutter
            Y: =0
            Width: =400
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =gTheme.Color.OnPrimary
            HoverColor: =gTheme.Color.OnPrimary
            HoverFill: =RGBA(255, 255, 255, 0.15)
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            Height: =24
            Width: =24
            X: =Parent.Width - 24 - gTheme.Space.Gutter
            Y: =(gTheme.Space.HeaderH - 24) / 2
            OnSelect: =Back()
      - formSheet:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 88
      - frmIssScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =20
            PaddingBottom: =28
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 88
          Children:
            - gridIss1:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =120
                Children:
                  - lblIssNameCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Summary  *"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Height: =18
                  - txtIssName:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: =If(gEditMode = "Edit", gEditIssue.issue_name, "")
                        Placeholder: ="What is the issue?"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Body
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Height: =36
                  - colIssStatus:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =66
                      Children:
                        - lblIssStatusCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Status  *"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width
                              Height: =18
                        # FontSize 10, not the default 11: three of the four values are
                        # "Closed - …" phrases sharing a half-width cell, so this strip is the
                        # tightest one in the app. The labels cannot be shortened — OnChange
                        # writes Selected.Label straight into the Choice, so each has to be the
                        # column's value verbatim.
                        - selIssStatus:
                            Control: CanvasComponent
                            ComponentName: cmpSelection
                            Properties:
                              FontSize: =10
                              Width: =Parent.Width
                              Height: =40
                              # From Choices() on the column. NOTE the coupling: "Open" is a
                              # literal in App.Formulas (OpenIssues), in scrProject's status
                              # glyph and in its open-count. A status value added in SharePoint
                              # appears HERE automatically but is invisible to those three.
                              Items: =colIssStatusOpts
                              DefaultId: =Coalesce( LookUp(colIssStatusOpts, Label = gIssStatus, Id), 1 )
                              OnChange: =Set(gIssStatus, selIssStatus.Selected.Label)
            - gridIss2:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =150
                Children:
                  - lblIssDescCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Description"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =2
                        Height: =18
                  - txtIssDesc:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: =If(gEditMode = "Edit", gEditIssue.issue_description, "")
                        Type: =TextInputType.Multiline
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =3
                        LayoutGridRowEnd: =10
                        Height: =96
                  - colIssImpact:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblIssImpactCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Impact"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - selIssImpact:
                            Control: CanvasComponent
                            ComponentName: cmpSelection
                            Properties:
                              FontSize: =11
                              Width: =Parent.Width
                              Height: =40
                              # From Choices() on the column. NOTE the coupling: scrProject's
                              # issues gallery sorts on impact via a Switch that ranks four known
                              # names; a value added in SharePoint appears here and sorts last.
                              Items: =colIssImpactOpts
                              DefaultId: =Coalesce( LookUp(colIssImpactOpts, Label = gIssImpact, Id), 1 )
                              OnChange: =Set(gIssImpact, selIssImpact.Selected.Label)
            # NO GRID HERE. Type is a full-width row, and a GridLayout child spanning
            # LayoutGridColumnStart 1 to LayoutGridColumnEnd 2 did NOT render full width
            # in Studio. The grid's own shape declaration has never been fully grounded
            # from a code view (see powerapp-canvas-controls), so this sits directly in
            # the vertical scroll container instead, sized like every other band —
            # nothing to span, nothing to get wrong.
            - colIssType:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =8
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblIssTypeCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Type"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        FillPortions: =0
                        LayoutMinHeight: =18
                        Width: =Parent.Width
                        Height: =18
                  # "(none)" is a real option, not a placeholder: the column is optional,
                  # and {Value: ""} is not a legal write, so the blank has to be selectable.
                  - selIssType:
                      Control: CanvasComponent
                      ComponentName: cmpSelection
                      Properties:
                        FontSize: =11
                        Width: =Parent.Width
                        Height: =40
                        # Built in OnVisible from Choices() on the column, so a value added
                        # in SharePoint appears here with no app change.
                        Items: =colIssTypeOpts
                        # BY LABEL, not a hard-coded Id: the Ids are positional and depend
                        # on the order SharePoint returns, so nothing may assume one.
                        DefaultId: =Coalesce( LookUp(colIssTypeOpts, Label = gIssType, Id), 1 )
                        OnChange: =Set(gIssType, selIssType.Selected.Label)
            - gridIss4:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =120
                Children:
                  - colIssTask:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblIssTaskCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Related task"
                              Font: =gTheme.Font
                              Size: =12
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width
                              Height: =18
                        - cboIssTask:
                            Control: ModernCombobox@1.1.1
                            Properties:
                              Items: =colIssTaskOpts
                              ItemDisplayText: =ThisItem.Label
                              DefaultSelectedItems: =Filter( colIssTaskOpts, Id = gIssTask.Id )
                              SelectMultiple: =false
                              IsSearchable: =true
                              InputTextPlaceholder: ="Select…"
                              Width: =Parent.Width
                              Height: =36
                              OnChange: |
                                =Set( gIssTask,
                                      { Id:    cboIssTask.Selected.Id,
                                        Value: If( cboIssTask.Selected.Id = 0, "", cboIssTask.Selected.Label ) } )
                  - lblIssTargetCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Target resolution date"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Height: =18
                  - dtpIssTarget:
                      Control: ModernDatePicker@1.0.1
                      Properties:
                        DefaultDate: =If(gEditMode = "Edit", gEditIssue.issue_date_target, Blank())
                        Placeholder: ="Target date"
                        Format: =DatePickerFormat.LongAbbreviated
                        StartOfWeek: =StartOfWeek.Monday
                        IsEditable: =true
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Height: =36
            - gridIss5:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =120
                Children:
                  - colIssTx:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblIssTxCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Related transaction"
                              Font: =gTheme.Font
                              Size: =12
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width
                              Height: =18
                        - cboIssTx:
                            Control: ModernCombobox@1.1.1
                            Properties:
                              Items: =colIssTxOpts
                              ItemDisplayText: =ThisItem.Label
                              DefaultSelectedItems: =Filter( colIssTxOpts, Id = gIssTx.Id )
                              SelectMultiple: =false
                              IsSearchable: =true
                              InputTextPlaceholder: ="Select…"
                              Width: =Parent.Width
                              Height: =36
                              OnChange: |
                                =Set( gIssTx,
                                      { Id:    cboIssTx.Selected.Id,
                                        Value: If( cboIssTx.Selected.Id = 0, "", cboIssTx.Selected.Label ) } )
            - rowIss6:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =24
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - colIssAssignee:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =Parent.Width
                        Height: =62
                      Children:
                        - fldAssignee:
                            Control: CanvasComponent
                            ComponentName: cmpLookupField
                            Properties:
                              Caption: ="Assignee  *"
                              PickLabel: ="＋  Choose an assignee"
                              HasValue: =Len(gIssAssignee.Mail) > 0
                              Display: =gIssAssignee.DisplayName
                              Width: =Parent.Width
                              Height: =62
                              OnPick: |
                                =Set( gIssPicker, "Assignee" );
                                 Reset( cmpIssPick );
                                 Set( gIssQuery, "" )
                              OnClear: |
                                =Set( gIssAssignee, { DisplayName: "", Mail: "" } )
            - colIssMissing:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =4
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblIssMissingCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Still required:"
                        Visible: =Len(lblIssMissing.Text) > 0
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        Width: =Parent.Width
                        Height: =18
                  - lblIssMissing:
                      Control: Label@2.5.1
                      Properties:
                        Text: |
                          =Trim(
                             If( Len(Trim(txtIssName.Text)) = 0, "summary   ", "" ) &
                             // SAFETY NET, not a prompt. The project is DERIVED and has no field on
                             // this form, but a blank one would still be rejected by SharePoint —
                             // and silently, since there is nothing on screen to point at. Same
                             // guard scrTaskEdit keeps for the same reason.
                             If( gIssProject.Id <= 0,            "a parent project (not set — reopen from the project screen)   ", "" ) &
                             If( Len(gIssAssignee.Mail) = 0,     "assignee   ", "" ) &
                             // issue_status is required:true and the save writes it
                             // UNGUARDED, so an empty gIssStatus sends {Value: ""} — not a
                             // member, and the connector rejects the whole insert. That is
                             // the exact failure project_coverage already paid for. The
                             // combo box can empty it (deselecting a selected item), and a
                             // legacy row holding a retired status seeds it to something
                             // the new Items cannot display.
                             If( Len(gIssStatus) = 0,            "status   ", "" ) )
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.Danger
                        Width: =Parent.Width
                        Height: =40
                        Visible: =Len(Self.Text) > 0
      - actionBarBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            BorderColor: =gTheme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
      - actionBarRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
          Children:
            # DESTRUCTIVE, so it sits hard left, away from Save. Edit mode only —
            # there is nothing to delete while creating. Arms the dialog and deletes
            # nothing; gDelRefs is counted here so the dialog can say what else changes.
            - btnIssDelete:
                Control: Classic/Button@2.2.0
                Properties:
                  Visible: =gEditMode = "Edit"
                  Text: ="Delete"
                  Fill: =gTheme.Color.Surface
                  Color: =gTheme.Color.Danger
                  BorderColor: =gTheme.Color.Danger
                  BorderThickness: =1
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  FillPortions: =0
                  LayoutMinWidth: =140
                  Width: =140
                  Height: =48
                  OnSelect: |
                    =Set( gDelKind, "Issue" );
                     Set( gDelId, gEditIssue.ID );
                     Set( gDelName, gEditIssue.issue_name );
                     Set( gDelRefs, 0 )
            - lblIssFooterSpacer:
                Control: Label@2.5.1
                Properties:
                  Text: =""
                  FillPortions: =1
                  LayoutMinWidth: =60
                  Height: =48
            - btnIssSave:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =gTheme.Color.Primary
                  Color: =gTheme.Color.OnPrimary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =0
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Text: |
                    =If( gSaving, "Saving…",
                         If(gEditMode = "Edit", "Save issue", "Create issue") )
                  # ALWAYS ENABLED — see scrTaskEdit btnTkSave. A disabled button cannot fire
                  # OnSelect, so a record missing a required field gave a click that did
                  # nothing at all. The requirement moved into OnSelect, where it can speak.
                  FillPortions: =0
                  LayoutMinWidth: =200
                  Width: =200
                  Height: =48
                  # ONE WRITE. Every column, required and optional, is in a single Patch;
                  # the optionals are If(condition, value, Blank()) inside the record.
                  # It used to be one Patch plus FIVE guarded follow-ups against the row
                  # just written — six serial round trips to save one issue. Folding also
                  # killed the unlink bug at the root: three of those follow-ups had no
                  # clearing arm, so a cleared task/transaction/owner never saved.
                  #
                  # The gate is gIssErr, captured in IfError's fallback: FirstError is
                  # only in scope THERE, so the message is stashed and acted on
                  # afterwards. Two reasons it is not `IsBlank(gIssSaved)`: Errors()
                  # returns a TABLE (so IsError(Errors(...)) never fires), and what a
                  # failed Patch leaves in the Set target is not something a one-way gap
                  # can verify. Each IfError argument is a SINGLE statement — no ";"
                  # chains inside a function argument.
                  #
                  # EVERY IfError ARGUMENT IS A `Set(...)`, AND THAT IS LOAD-BEARING.
                  # "IfError returns the value of one of its arguments. The types of all
                  # values that might be returned by IfError must be compatible" — and
                  # MS Learn adds that *currently* ALL arguments must be compatible, not
                  # just the ones that could be returned. `Patch` returns a record and
                  # `Notify` returns a boolean, so the obvious `IfError(Patch(…),
                  # Notify(…))` — which the docs themselves show — is rejected today with
                  # "expecting a record". Wrapping the Patch in a Set makes both sides a
                  # Set and it types. Failures are therefore accumulated into gIssWarn
                  # and reported in ONE banner after the guarded block, which also beats
                  # up to five separate toasts.
                  OnSelect: |
                    =If( gSaving,
                    // A SECOND TAP WHILE THE FIRST WRITE IS STILL IN FLIGHT. Do nothing.
                    // A SharePoint Patch takes seconds; the button stayed live throughout, so a
                    // double-tap ran the whole handler twice and Defaults() built a SECOND new
                    // record. `Set` applies immediately within a behaviour chain, so the flag is
                    // already true by the time the second tap is evaluated.
                    // NO DisplayMode GATE — see this button's ALWAYS ENABLED note. A disabled
                    // button cannot fire OnSelect and cannot say why; the Text says "Saving…"
                    // instead, and the guard below is what actually blocks the duplicate.
                    false,
                    Set( gSaving, true );
                    If( Len(lblIssMissing.Text) > 0,
                    // The requirement that used to disable the button, moved here so a blocked
                    // save names the field. These are required in schema.yaml — SharePoint would
                    // reject the write regardless; this only decides whether the user is told.
                    Notify( "Can't save yet — this still needs: " & lblIssMissing.Text,
                    NotificationType.Error ),
                    // THE TASK LINK CAN MOVE, so the task this issue is LEAVING needs its
                    // health recomputed too — captured here because after the Patch the old
                    // value is gone. New mode has no previous link.
                    Set( gIssOldTask,
                         If( gEditMode = "Edit", Coalesce(gEditIssue.issue_task_name.Id, 0), 0 ) );
                    Set( gIssSaved, Blank() );
                    Set( gIssErr, "" );
                    Set( gIssWarn, "" );
                    IfError(
                        Set( gIssSaved,
                            Patch( taskmaster_issues,
                                   If( gEditMode = "Edit", gEditIssue, Defaults(taskmaster_issues) ),
                                   // Mirrors the PARENT's phase so cross-project queries can exclude archived
                                   // work with a delegable `= false`. Written on EVERY save, not just on insert.
                                   // Read LIVE from the list, not from gSelProject: that global is a gallery
                                   // snapshot taken when the project was opened, so a project archived since
                                   // then would stamp `false` here and the row would stay in scope forever.
                                   // One delegable LookUp on ID.
                                   { issue_project_archived:
                                         Coalesce( LookUp( taskmaster_projects, ID = gSelProject.ID,
                                                           project_phase.Value ), "" ) = "Archived",
                                   issue_name:        Trim(txtIssName.Text),
                                     issue_description: txtIssDesc.Text,
                                     issue_project_id:  { Id: gIssProject.Id, Value: gIssProject.Value },
                                     issue_assignee:
                                         { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                           Claims:      gClaimPrefix & Lower(gIssAssignee.Mail),
                                           DisplayName: gIssAssignee.DisplayName,
                                           Email:       gIssAssignee.Mail,
                                           Department: "", JobTitle: "", Picture: "" },
                                     issue_status:      { Value: gIssStatus },
                                     issue_date_target: dtpIssTarget.SelectedDate,
                                     // DERIVED — there is no close-date field on this screen.
                                     // Read the STORED date, NOT gEditIssue: that global is a snapshot taken
                                     // when the issue was opened, and no control reads this column any more,
                                     // which is exactly what Explicit Column Selection trims out of a record
                                     // carried through a global. Coalesce then PRESERVES it — re-saving a
                                     // closed issue must not move the date forward. Delegable LookUp on ID,
                                     // same shape as issue_project_archived above.
                                     // StartsWith, not an enumerated list: a Closed-* value added to the
                                     // column later must still stamp. This is a local test with no query
                                     // behind it, so the rule that forces enumeration in App.Formulas — a
                                     // DELEGATION rule — does not apply here.
                                     issue_date_close:
                                         If( StartsWith(gIssStatus, "Closed"),
                                             If( gEditMode = "Edit",
                                                 Coalesce( LookUp( taskmaster_issues, ID = gEditIssue.ID,
                                                                   issue_date_close ), Now() ),
                                                 Now() ),
                                             Blank() ),
                                     issue_type:
                                         If( gIssType <> "(none)", { Value: gIssType }, Blank() ),
                                     issue_impact:
                                         If( gIssImpact <> "(none)", { Value: gIssImpact }, Blank() ),
                                     issue_task_name:
                                         If( gIssTask.Id > 0, { Id: gIssTask.Id, Value: gIssTask.Value }, Blank() ),
                                     issue_transaction_name:
                                         If( gIssTx.Id > 0, { Id: gIssTx.Id, Value: gIssTx.Value }, Blank() ) } ) ),
                        Set( gIssErr, FirstError.Message )
                    );
                    // Trust the RECORD, never the message — see scrTaskEdit.
                    If( IsBlank(gIssSaved.ID) && Len(gIssErr) = 0,
                        Set( gIssErr, "SharePoint returned no record and no error message, so nothing was saved." ) );
                    // PROVENANCE, INSERT ONLY. A second Patch rather than two fields in the
                    // one above, because the update path must not NAME these columns at all:
                    // a field named in a Patch is written, and there is no value to write on
                    // an edit that is not either a rewrite or a clear. Omitting them is the
                    // only way to leave them alone. Failure is a warning, not an error — the
                    // issue itself is already saved by this point.
                    If( gEditMode <> "Edit" && Len(gIssErr) = 0,
                        IfError(
                            Set( gIssStamped,
                                Patch( taskmaster_issues, gIssSaved,
                                       { issue_owner:
                                             { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                               Claims:      gClaimPrefix & Lower(User().Email),
                                               DisplayName: User().FullName,
                                               Email:       User().Email,
                                               Department: "", JobTitle: "", Picture: "" },
                                         issue_date_open: Now() } ) ),
                            Set( gIssWarn, gIssWarn & "who opened it and when: " & FirstError.Message & "   " ) ) );
                    // HEALTH FOLLOWS THE ISSUE. type, impact, status and the task link all
                    // feed a task's health, so every successful save recomputes it — for the
                    // task gained AND the one lost. Only after the write: recomputing off a
                    // save that failed would store health for a change that never happened.
                    If( Len(gIssErr) = 0,
                        Clear( colHlTasks );
                        If( gIssOldTask > 0, Collect( colHlTasks, { Id: gIssOldTask } ) );
                        If( gIssTask.Id > 0 && gIssTask.Id <> gIssOldTask,
                            Collect( colHlTasks, { Id: gIssTask.Id } ) );
                        Select( btnIssHealth ) );
                    If( Len(gIssErr) > 0,
                        Notify("Couldn't save the issue: " & gIssErr, NotificationType.Error) );
                    If( Len(gIssErr) = 0,
                        If( Len(gIssWarn) > 0,
                            Notify( "Issue saved, but these fields didn't: " & gIssWarn, NotificationType.Warning ) );
                        If( Len(gIssWarn) = 0,
                            Notify( If(gEditMode = "Edit", "Issue saved", "Issue created"), NotificationType.Success ) );
                        Back()
                    ) );
                    Set( gSaving, false ) )
            - btnIssCancel:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =gTheme.Color.Surface
                  Color: =gTheme.Color.Primary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =1
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Text: ="Cancel"
                  FillPortions: =0
                  LayoutMinWidth: =140
                  Width: =140
                  Height: =48
                  OnSelect: =Back()
      # =====================================================================
      # PICKER — ONE cmpPicker instance for the two person fields AND the two
      # record lookups. Declared LAST so the dialog paints above the footer.
      # gIssPicker names the field being filled and selects the row kind.
      # AllowCreate is false throughout: an issue links to things that already
      # exist. See scrTaskEdit's instance for the full contract commentary.
      # =====================================================================
      - cmpIssPick:
          Control: CanvasComponent
          ComponentName: cmpPicker
          Properties:
            Visible: =Len( Coalesce(gIssPicker, "") ) > 0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: ="Select assignee"
            # Queries run HERE — AccessAppScope false. Bound to gIssQuery, which
            # OnSearch sets, never to the instance's own Query output.
            # Uniform {Key, Primary, Secondary}; Key is Text for both kinds.
            # There is no "first 10 people" to open on, so the default row is the
            # current user — one tap to assign an issue to yourself.
            Results: |
              =If( gIssPicker = "Assignee" && Len(gIssQuery) >= 2,
              ForAll( Office365Users.SearchUserV2({ searchTerm: gIssQuery, top: 25 }).value As u,
              { Key:       u.Mail,
              Primary:   u.DisplayName,
              Secondary: u.Mail } ),
              gIssPicker = "Assignee",
              Table( { Key:       User().Email,
              Primary:   User().FullName,
              Secondary: User().Email } ) )
            OnSearch: =Set( gIssQuery, cmpIssPick.Query )
            AllowCreate: =false
            OnConfirm: |
              =Set( gIssAssignee,
                    { DisplayName: cmpIssPick.Picked.Primary, Mail: cmpIssPick.Picked.Secondary } );
               Set( gIssPicker, "" )
            OnCancel: =Set( gIssPicker, "" )
      # =====================================================================
      # DELETE CONFIRMATION. See scrProject's instance for the Studio check that
      # must happen before this screen is pasted: cmpConfirmDialog had no consumer
      # in src/ until issue #15, so its eight custom properties may never have been
      # declared in Studio — and a component's properties do NOT come across in a
      # paste. Visible is gated as well as IsOpen because a component intercepts
      # every click inside its bounds.
      # =====================================================================
      - cmpIssConfirmDel:
          Control: CanvasComponent
          ComponentName: cmpConfirmDialog
          Properties:
            Visible: =Len( Coalesce(gDelKind, "") ) > 0
            IsOpen: =Len( Coalesce(gDelKind, "") ) > 0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: ="Delete this issue?"
            Message: |
              ="Delete " & gDelName & "? Nothing else references an issue." &
                       " This cannot be undone."
            ConfirmLabel: ="Delete"
            CancelLabel: ="Cancel"
            Destructive: =true
            # IfError( Remove(...), Notify(...) ) — MS Learn's own idiom — is REJECTED by
            # Studio: Remove and ForAll/Patch return a TABLE while Notify and Set return a
            # boolean, and IfError requires type-compatible arguments. Hence Set-into-a-scrap
            # on both arms, with a DIFFERENT scrap name per call site.
            OnConfirm: |
              =Set( gDelErr, "" );
               Set( gDelBlock, false );
               // THE ROW THAT KNOWS THE TASK IS ABOUT TO BE DELETED, so the link is read
               // now. Deleting the last open Blockage on a task must take that task back
               // off Red, and after the Remove there is nothing left to ask.
               Set( gDelIssTask,
                    If( gDelKind = "Issue",
                        Coalesce( LookUp(taskmaster_issues, ID = gDelId).issue_task_name.Id, 0 ),
                        0 ) );
               If( Len(gDelErr) = 0 && !gDelBlock,
                   IfError( Set( gDelScrapI,
                                 Remove( taskmaster_issues, LookUp(taskmaster_issues, ID = gDelId) ) ),
                            Set( gDelErr, FirstError.Message ) ) );
               If( gDelBlock,
                   Notify( "Too many issues reference this to detach in one pass. Nothing was deleted — ask for the cleanup workflow.",
                           NotificationType.Error ),
                   Len(gDelErr) > 0,
                   Notify( "Couldn't delete it: " & gDelErr
                             & " Some issue links may already have been cleared — reopen the project to check.",
                           NotificationType.Error ),
                   Notify( "Issue deleted.", NotificationType.Success );
                   If( gDelIssTask > 0,
                       ClearCollect( colHlTasks, { Id: gDelIssTask } );
                       Select( btnIssHealth ) );
                   // Back() lands on scrProject, whose OnVisible calls btnPrjRecompute —
                   // so project_phase and the completion rollup repair themselves with no
                   // second copy of that logic living here.
                   Back() );
               Set( gDelKind, "" )
            OnCancel: =Set( gDelKind, "" )
