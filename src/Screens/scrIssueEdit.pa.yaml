# =============================================================================
# scrIssueEdit  —  create / edit an issue.
#
# Entered with:  Set(gEditMode, "New" | "Edit");  Set(gEditIssue, <record>)
#                (gEditIssue is ignored when gEditMode = "New")
# If gSelProject is set, a NEW issue is pre-attached to that project.
#
# THE SHARED EDIT-SCREEN PATTERN — all four scr*Edit screens follow it, so read
# this header once. See _EDIT-NOTES.md for the rationale in full.
#
#  1. SEED GLOBALS IN OnVisible, WRITE FROM GLOBALS. Never write from a control's
#     or component's live state. A cmpSelection strip keeps the previous record's
#     pick. (An earlier note here claimed Reset cannot reach inside a component.
#     THAT IS WRONG — Reset(<instance>) fires the component's OnReset; cmpSelection
#     simply had none until 2026-08-11. The claim misled two code reviewers.)
#     Whether it clears on
#     navigation is precisely what a one-way gap cannot verify — so re-seeding
#     here makes the WRITE correct regardless of what the screen is displaying.
#  2. NORMALISED PICKER RECORDS. Every picker global has ONE fixed schema —
#     people are {DisplayName, Mail}, lookups are {Id, Value} — because a global
#     assigned two different record shapes is a type conflict. "Nothing picked"
#     is the empty/zero record, tested with Len(...) = 0 / .Id <= 0, never with
#     IsBlank on a record whose type was inferred from Blank().
#  3. OVERLAY PICKER GALLERIES ARE DECLARED LAST. Z-order is positional in this
#     dialect, so a result list declared at the end floats above the fields it
#     covers — that is what makes a search box behave like a dropdown without
#     needing an unverified ComboBox token.
#  4. REQUIRED FIELDS GO IN THE FIRST PATCH; OPTIONAL ONES FOLLOW, GUARDED.
#     Power Fx cannot conditionally omit a field from a record literal, and
#     writing {Value: ""} to an unset Choice fails. So each optional field gets
#     its own guarded Patch: set it when chosen, clear it (Blank()) only when
#     editing. Errors are then attributable to one field instead of the form.
#  5. SUCCESS IS NEVER ASSUMED. Errors() returns a TABLE, so `IsError(Errors(…))`
#     would never fire. The save captures FirstError.Message into a g*Err variable
#     inside IfError's fallback — the only scope where FirstError exists — and
#     everything that tells the user it worked lives behind `Len(g*Err) = 0`.
#     Every IfError argument is a single statement; no ";" chains inside one.
#
# CONNECTION PREREQUISITE: Office 365 Users must be added in Studio before this
# pastes (people pickers). See HANDOFF.md.
#
# Grounded tokens only. Modern controls where they earn their place:
# ModernTextInput (output is still `.Text`), ModernDatePicker (`.SelectedDate`)
# and ModernButton. The two date fields no longer parse text, so their
# "⚠ not a date" echo labels are gone — a picker cannot produce a bad date.
# Every column token resolves to schema/schema.yaml (golden source).
#
# =============================================================================
Screens:
  scrIssueEdit:
    Properties:
      Fill: =Theme.Color.Bg
      OnVisible: |
        =Set( gSaving, false );   // see btnIssSave
        Set( gIssProject,
              If( gEditMode = "Edit",
                  { Id: gEditIssue.issue_project_id.Id,
                    // NOT redundant. The lookup column's live display field is the target's ID,
                    // so `.Value` is a NUMBER — see schema.yaml on this column. Resolving the
                    // name app-side is the fix from 2026-08-09; do not "optimise" it away.
                    Value: LookUp(taskmaster_projects, ID = gEditIssue.issue_project_id.Id, project_name) },
                  gSelProject.ID > 0,
                  { Id: gSelProject.ID, Value: gSelProject.project_name },
                  { Id: 0, Value: "" } ) );
        Set( gIssTask,
              If( gEditMode = "Edit" && gEditIssue.issue_task_name.Id > 0,
                  { Id: gEditIssue.issue_task_name.Id, Value: gEditIssue.issue_task_name.Value },
                  { Id: 0, Value: "" } ) );
        Set( gIssTx,
              If( gEditMode = "Edit" && gEditIssue.issue_transaction_name.Id > 0,
                  { Id: gEditIssue.issue_transaction_name.Id, Value: gEditIssue.issue_transaction_name.Value },
                  { Id: 0, Value: "" } ) );
        Set( gIssAssignee,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditIssue.issue_assignee.DisplayName, ""),
                    Mail:        Coalesce(gEditIssue.issue_assignee.Email, "") },
                  { DisplayName: Coalesce(User().FullName, ""), Mail: Coalesce(User().Email, "") } ) );
        // NO gIssOwner SEED. The business-owner field is gone; who raised the issue
        // is SharePoint's `Created By`, read straight off gEditIssue and never staged.
        // OPTION SETS FOR THE TWO ASSOCIATION DROPDOWNS. Collected here, AFTER
        // gIssProject is seeded above — they depend on it.
        // Delegable: `=` on an indexed Lookup FK. The "(none)" row is Collected first
        // so it sorts to the top, and it is what makes Id 0 a selectable "unlink"
        // instead of needing a separate clear button.
        // ForAll(... As alias, {record literal}) narrows each row to {Id, Label}; a
        // literal cannot be Collected alongside a raw SharePoint row, whose schema is
        // far wider, so both halves are projected to the same two columns.
        ClearCollect( colIssTaskOpts, { Id: 0, Label: "(none)" } );
        Collect( colIssTaskOpts,
                 ForAll( Filter( taskmaster_tasks,
                                 task_project_id.Id = gIssProject.Id ) As t,
                         { Id: t.ID, Label: t.task_name } ) );
        ClearCollect( colIssTxOpts, { Id: 0, Label: "(none)" } );
        Collect( colIssTxOpts,
                 ForAll( Filter( taskmaster_transactions,
                                 transaction_project_id.Id = gIssProject.Id ) As x,
                         { Id: x.ID, Label: x.transaction_name } ) );
        Set( gIssStatus, If( gEditMode = "Edit", Coalesce(gEditIssue.issue_status.Value, "Open"), "Open" ) );
        Set( gIssType,   If( gEditMode = "Edit", Coalesce(gEditIssue.issue_type.Value,   "(none)"), "(none)" ) );
        Set( gIssImpact, If( gEditMode = "Edit", Coalesce(gEditIssue.issue_impact.Value, "(none)"), "(none)" ) );
        Reset( txtIssName ); Reset( txtIssDesc );
        Set( gIssPicker, "" ); Set( gIssQuery, "" ); Reset( cmpIssPick );
        // Re-read DefaultDate; see the note on the pickers themselves.
        Reset( dtpIssTarget ); Reset( dtpIssClose );
        // A combo box re-reads DefaultSelectedItems ONLY on Reset. cboIssStatus is
        // one of these now too — it stopped being a cmpSelection strip on 2026-08-12.
        Reset( cboIssTask ); Reset( cboIssTx ); Reset( cboIssStatus );
        // cmpSelection re-reads its DefaultId ONLY on Reset, so without these the
        // strip shows the previous record's pick while the save writes this one.
        // The component gained OnReset on 2026-08-11; these two are its consumers.
        Reset( selIssType );
        Reset( selIssImpact )
    Children:
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Primary
            Height: =Theme.Space.HeaderH
            Width: =Parent.Width
            X: =0
            Y: =0
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: =If(gEditMode = "Edit", "Edit issue", "New issue") &
               If( gIssProject.Id > 0, "   ·   " & gIssProject.Value, "" )
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            FontWeight: =FontWeight.Semibold
            Size: =Theme.Size.H2
            Height: =Theme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Theme.Space.Gutter
            Y: =0
            Width: =400
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =Theme.Color.OnPrimary
            Height: =24
            Width: =24
            X: =Parent.Width - 24 - Theme.Space.Gutter
            Y: =(Theme.Space.HeaderH - 24) / 2
            OnSelect: =Back()
      - formSheet:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Surface
            X: =0
            Y: =Theme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - Theme.Space.HeaderH - 88
      - frmIssScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =20
            PaddingBottom: =28
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Theme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - Theme.Space.HeaderH - 88
          Children:
            - gridIss1:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =120
                Children:
                  - lblIssNameCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Summary  *"
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Height: =18
                  - txtIssName:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: =If(gEditMode = "Edit", gEditIssue.issue_name, "")
                        Placeholder: ="What is the issue?"
                        Font: =Theme.Font
                        Size: =Theme.Size.Body
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Height: =36
                  - colIssStatus:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        # 66, not 62: 18 caption + 8 gap + 40 combo. The 120-high grid cell
                        # has room, so nothing below moves.
                        Height: =66
                      Children:
                        - lblIssStatusCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Status  *"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              # PINNED. Every auto-layout child is flexible along the parent's
                              # direction BY DEFAULT, so leaving both children unpinned split
                              # the 54px of free space 27/27 — the declared 18 and 40 were
                              # ignored and the combo box rendered at 27px, below its usable
                              # height. A chip strip tolerated that; a combo box does not.
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width
                              Height: =18
                        # A COMBO BOX, NOT A cmpSelection STRIP — swapped 2026-08-12 with the
                        # status values themselves. cmpSelection lays every option across ONE
                        # row (`WrapCount = CountRows(Items)`), so each chip gets Width/N. That
                        # was fine for "Open / Review / Waiting / Blocked / Closed"; it is not
                        # fine for three ~19-character "Closed - …" labels, which would clip at
                        # 11pt with no way to widen them. The label IS the stored Choice value
                        # (`Set(gIssStatus, …Label)`), so shortening the text was not available.
                        # cboTkStage on scrTaskEdit is the proven pattern for a value list that
                        # does not fit a strip. Output is `.Selected.Value`, not `.Selected.Label`.
                        - cboIssStatus:
                            Control: ModernCombobox@1.1.1
                            Properties:
                              Items: |
                                =["Open", "Closed - Resolved", "Closed - Unresolved", "Closed - No Change"]
                              ItemDisplayText: =ThisItem.Value
                              DefaultSelectedItems: =Filter( [gIssStatus], !IsBlank(Value) )
                              SelectMultiple: =false
                              IsSearchable: =false
                              InputTextPlaceholder: ="Select…"
                              Color: |
                                =If( gIssStatus = "Open", Theme.Color.TextPrimary, Theme.Color.TextMuted )
                              # Pinned for the same reason as the caption above.
                              FillPortions: =0
                              LayoutMinHeight: =40
                              Width: =Parent.Width
                              Height: =40
                              OnChange: =Set(gIssStatus, cboIssStatus.Selected.Value)
            - gridIss2:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =150
                Children:
                  - lblIssDescCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Description"
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =2
                        Height: =18
                  - txtIssDesc:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: =If(gEditMode = "Edit", gEditIssue.issue_description, "")
                        Type: =TextInputType.Multiline
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =3
                        LayoutGridRowEnd: =10
                        Height: =96
                  - colIssType:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblIssTypeCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Type"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - selIssType:
                            Control: CanvasComponent
                            ComponentName: cmpSelection
                            Properties:
                              FontSize: =10
                              Width: =Parent.Width
                              Height: =40
                              # "(none)" is a real option, not a placeholder: an optional Choice must
                              # be clearable, and {Value: ""} is not a legal write.
                              Items: |
                                =Table( { Id: 1, Label: "(none)" },     { Id: 2, Label: "Approval" },
                                        { Id: 3, Label: "Process" },    { Id: 4, Label: "Compliance" },
                                        { Id: 5, Label: "Branding" },   { Id: 6, Label: "Technical" } )
                              DefaultId: |
                                =Switch( If(gEditMode = "Edit", Coalesce(gEditIssue.issue_type.Value, "(none)"), "(none)"),
                                         "Approval", 2, "Process", 3, "Compliance", 4, "Branding", 5, "Technical", 6, 1 )
                              OnChange: =Set(gIssType, selIssType.Selected.Label)
            - gridIss3:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =120
                Children:
                  - colIssImpact:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblIssImpactCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Impact"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - selIssImpact:
                            Control: CanvasComponent
                            ComponentName: cmpSelection
                            Properties:
                              FontSize: =11
                              Width: =Parent.Width
                              Height: =40
                              Items: |
                                =Table( { Id: 1, Label: "(none)" }, { Id: 2, Label: "Low" },
                                        { Id: 3, Label: "Moderate" }, { Id: 4, Label: "High" },
                                        { Id: 5, Label: "Critical" } )
                              DefaultId: |
                                =Switch( If(gEditMode = "Edit", Coalesce(gEditIssue.issue_impact.Value, "(none)"), "(none)"),
                                         "Low", 2, "Moderate", 3, "High", 4, "Critical", 5, 1 )
                              OnChange: =Set(gIssImpact, selIssImpact.Selected.Label)
            - gridIss4:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =120
                Children:
                  - colIssTask:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblIssTaskCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Related task"
                              Font: =Theme.Font
                              Size: =12
                              Color: =Theme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width
                              Height: =18
                        - cboIssTask:
                            Control: ModernCombobox@1.1.1
                            Properties:
                              # SCOPED TO THIS PROJECT — that is the whole change. An issue
                              # belongs to a project, so the only tasks and transactions it can
                              # sensibly reference are that project's. The old search picker
                              # offered EVERY row in the tenant and made you type two characters
                              # to find out.
                              # A bounded set does not need a search dialog: `colIss*Opts` is
                              # collected once in OnVisible and the list is just shown.
                              Items: =colIssTaskOpts
                              ItemDisplayText: =ThisItem.Label
                              # Always resolves to a row, including the "(none)" one at Id 0,
                              # so the box is never blank-with-no-explanation.
                              DefaultSelectedItems: =Filter( colIssTaskOpts, Id = gIssTask.Id )
                              SelectMultiple: =false
                              IsSearchable: =true
                              InputTextPlaceholder: ="Select…"
                              Width: =Parent.Width
                              Height: =36
                              # Id 0 IS the clear. It replaces cmpLookupField's ✕ — the save
                              # already treats `.Id > 0` as "linked", so selecting "(none)"
                              # writes Blank() to the column exactly as the ✕ used to.
                              OnChange: |
                                =Set( gIssTask,
                                      { Id:    cboIssTask.Selected.Id,
                                        Value: If( cboIssTask.Selected.Id = 0, "", cboIssTask.Selected.Label ) } )
                  - lblIssTargetCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Target resolution date"
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextMuted
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Height: =18
                  - dtpIssTarget:
                      Control: ModernDatePicker@1.0.1
                      Properties:
                        DefaultDate: =If(gEditMode = "Edit", gEditIssue.issue_date_target, Blank())
                        Placeholder: ="Target date"
                        Format: =DatePickerFormat.LongAbbreviated
                        StartOfWeek: =StartOfWeek.Monday
                        IsEditable: =true
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Height: =36
            - gridIss5:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =120
                Children:
                  - colIssTx:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblIssTxCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Related transaction"
                              Font: =Theme.Font
                              Size: =12
                              Color: =Theme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width
                              Height: =18
                        - cboIssTx:
                            Control: ModernCombobox@1.1.1
                            Properties:
                              # SCOPED TO THIS PROJECT — that is the whole change. An issue
                              # belongs to a project, so the only tasks and transactions it can
                              # sensibly reference are that project's. The old search picker
                              # offered EVERY row in the tenant and made you type two characters
                              # to find out.
                              # A bounded set does not need a search dialog: `colIss*Opts` is
                              # collected once in OnVisible and the list is just shown.
                              Items: =colIssTxOpts
                              ItemDisplayText: =ThisItem.Label
                              # Always resolves to a row, including the "(none)" one at Id 0,
                              # so the box is never blank-with-no-explanation.
                              DefaultSelectedItems: =Filter( colIssTxOpts, Id = gIssTx.Id )
                              SelectMultiple: =false
                              IsSearchable: =true
                              InputTextPlaceholder: ="Select…"
                              Width: =Parent.Width
                              Height: =36
                              # Id 0 IS the clear. It replaces cmpLookupField's ✕ — the save
                              # already treats `.Id > 0` as "linked", so selecting "(none)"
                              # writes Blank() to the column exactly as the ✕ used to.
                              OnChange: |
                                =Set( gIssTx,
                                      { Id:    cboIssTx.Selected.Id,
                                        Value: If( cboIssTx.Selected.Id = 0, "", cboIssTx.Selected.Label ) } )
                  - lblIssCloseCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Resolution date"
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextMuted
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Height: =18
                  - dtpIssClose:
                      Control: ModernDatePicker@1.0.1
                      Properties:
                        DefaultDate: =If(gEditMode = "Edit", gEditIssue.issue_date_close, Blank())
                        Placeholder: ="Close date"
                        Format: =DatePickerFormat.LongAbbreviated
                        StartOfWeek: =StartOfWeek.Monday
                        IsEditable: =true
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Height: =36
            - rowIss6:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =24
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - colIssAssignee:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =(Parent.Width - 24) / 2
                        Height: =62
                      Children:
                        - fldAssignee:
                            Control: CanvasComponent
                            ComponentName: cmpLookupField
                            Properties:
                              Caption: ="Assignee  *"
                              PickLabel: ="＋  Choose an assignee"
                              HasValue: =Len(gIssAssignee.Mail) > 0
                              Display: =gIssAssignee.DisplayName
                              Width: =Parent.Width
                              Height: =62
                              OnPick: |
                                =Set( gIssPicker, "Assignee" );
                                 Reset( cmpIssPick );
                                 Set( gIssQuery, "" )
                              OnClear: |
                                =Set( gIssAssignee, { DisplayName: "", Mail: "" } )
                  # ---------------------------------------------------------------
                  # PROVENANCE — READ ONLY, and read ONLY from SharePoint's own
                  # system columns. This slot used to hold a "Business owner"
                  # people-picker writing `issue_owner`, plus a hidden `issue_date_open`
                  # the save stamped with Now(). Both were app-written, so both were
                  # editable, wrong-able and duplicable — and neither was what anyone
                  # actually wanted from them: who raised this, and when.
                  #
                  # `Created` and `Created By` are stamped by SharePoint on insert,
                  # cannot be patched from the app at all (schema.yaml `system_columns`
                  # says so in as many words), and need no column, no picker, no write
                  # and no clearing arm. The best field is the one you don't have.
                  #
                  # THE COLUMN NAME HAS A SPACE, so it is quoted: `'Created By'`. That
                  # is the one token here that a failed paste would point at.
                  # ---------------------------------------------------------------
                  - colIssOpened:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =(Parent.Width - 24) / 2
                        Height: =62
                      Children:
                        - lblIssOpenedCap:
                            Control: Label@2.5.1
                            Properties:
                              # Matches cmpLookupField's caption exactly (12pt muted,
                              # 18 high) so this reads as a field in the same row, not
                              # as a stray note.
                              Text: ="Opened by"
                              Font: =Theme.Font
                              Size: =12
                              Color: =Theme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width
                              Height: =18
                        - lblIssOpenedVal:
                            Control: Label@2.5.1
                            Properties:
                              # On NEW there is nothing to show — SharePoint has not
                              # stamped anything yet — so say that rather than render a
                              # blank that looks like a load failure.
                              Text: |
                                =If( gEditMode <> "Edit",
                                     "Recorded automatically when you save",
                                     Coalesce( gEditIssue.'Created By'.DisplayName, "someone no longer listed" )
                                     & If( IsBlank(gEditIssue.Created), "",
                                           "   ·   " & Text(gEditIssue.Created, "d mmm yyyy") ) )
                              Font: =Theme.Font
                              Size: =Theme.Size.Body
                              Color: |
                                =If( gEditMode <> "Edit", Theme.Color.TextMuted, Theme.Color.Text )
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =36
                              Width: =Parent.Width
                              Height: =36
            - colIssMissing:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =4
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblIssMissingCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Still required:"
                        Visible: =Len(lblIssMissing.Text) > 0
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextMuted
                        Width: =Parent.Width
                        Height: =18
                  - lblIssMissing:
                      Control: Label@2.5.1
                      Properties:
                        Text: |
                          =Trim(
                             If( Len(Trim(txtIssName.Text)) = 0, "summary   ", "" ) &
                             // SAFETY NET, not a prompt. The project is DERIVED and has no field on
                             // this form, but a blank one would still be rejected by SharePoint —
                             // and silently, since there is nothing on screen to point at. Same
                             // guard scrTaskEdit keeps for the same reason.
                             If( gIssProject.Id <= 0,            "a parent project (not set — reopen from the project screen)   ", "" ) &
                             If( Len(gIssAssignee.Mail) = 0,     "assignee   ", "" ) )
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.Danger
                        Width: =Parent.Width
                        Height: =40
                        Visible: =Len(Self.Text) > 0
      - actionBarBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Surface
            BorderColor: =Theme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
      - actionBarRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
          Children:
            - lblIssFooterSpacer:
                Control: Label@2.5.1
                Properties:
                  Text: =""
                  FillPortions: =1
                  LayoutMinWidth: =60
                  Height: =48
            - btnIssSave:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =Theme.Color.Primary
                  Color: =Theme.Color.OnPrimary
                  BorderColor: =Theme.Color.Primary
                  BorderThickness: =0
                  Font: =Theme.Font
                  Size: =Theme.Size.Body
                  Text: |
                    =If( gSaving, "Saving…",
                         If(gEditMode = "Edit", "Save issue", "Create issue") )
                  # ALWAYS ENABLED — see scrTaskEdit btnTkSave. A disabled button cannot fire
                  # OnSelect, so a record missing a required field gave a click that did
                  # nothing at all. The requirement moved into OnSelect, where it can speak.
                  FillPortions: =0
                  LayoutMinWidth: =200
                  Width: =200
                  Height: =48
                  # ONE WRITE. Every column, required and optional, is in a single Patch;
                  # the optionals are If(condition, value, Blank()) inside the record.
                  # It used to be one Patch plus FIVE guarded follow-ups against the row
                  # just written — six serial round trips to save one issue. Folding also
                  # killed the unlink bug at the root: three of those follow-ups had no
                  # clearing arm, so a cleared task/transaction/owner never saved.
                  #
                  # The gate is gIssErr, captured in IfError's fallback: FirstError is
                  # only in scope THERE, so the message is stashed and acted on
                  # afterwards. Two reasons it is not `IsBlank(gIssSaved)`: Errors()
                  # returns a TABLE (so IsError(Errors(...)) never fires), and what a
                  # failed Patch leaves in the Set target is not something a one-way gap
                  # can verify. Each IfError argument is a SINGLE statement — no ";"
                  # chains inside a function argument.
                  #
                  # EVERY IfError ARGUMENT IS A `Set(...)`, AND THAT IS LOAD-BEARING.
                  # "IfError returns the value of one of its arguments. The types of all
                  # values that might be returned by IfError must be compatible" — and
                  # MS Learn adds that *currently* ALL arguments must be compatible, not
                  # just the ones that could be returned. `Patch` returns a record and
                  # `Notify` returns a boolean, so the obvious `IfError(Patch(…),
                  # Notify(…))` — which the docs themselves show — is rejected today with
                  # "expecting a record". Wrapping the Patch in a Set makes both sides a
                  # Set and it types. Failures are therefore accumulated into gIssWarn
                  # and reported in ONE banner after the guarded block, which also beats
                  # up to five separate toasts.
                  OnSelect: |
                    =If( gSaving,
                    // A SECOND TAP WHILE THE FIRST WRITE IS STILL IN FLIGHT. Do nothing.
                    // A SharePoint Patch takes seconds; the button stayed live throughout, so a
                    // double-tap ran the whole handler twice and Defaults() built a SECOND new
                    // record. `Set` applies immediately within a behaviour chain, so the flag is
                    // already true by the time the second tap is evaluated.
                    // NO DisplayMode GATE — see this button's ALWAYS ENABLED note. A disabled
                    // button cannot fire OnSelect and cannot say why; the Text says "Saving…"
                    // instead, and the guard below is what actually blocks the duplicate.
                    false,
                    Set( gSaving, true );
                    If( Len(lblIssMissing.Text) > 0,
                    // The requirement that used to disable the button, moved here so a blocked
                    // save names the field. These are required in schema.yaml — SharePoint would
                    // reject the write regardless; this only decides whether the user is told.
                    Notify( "Can't save yet — this still needs: " & lblIssMissing.Text,
                    NotificationType.Error ),
                    Set( gIssSaved, Blank() );
                    Set( gIssErr, "" );
                    Set( gIssWarn, "" );
                    IfError(
                        Set( gIssSaved,
                            Patch( taskmaster_issues,
                                   If( gEditMode = "Edit", gEditIssue, Defaults(taskmaster_issues) ),
                                   { issue_name:        Trim(txtIssName.Text),
                                     issue_description: txtIssDesc.Text,
                                     issue_project_id:  { Id: gIssProject.Id, Value: gIssProject.Value },
                                     issue_assignee:
                                         { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                           Claims:      ClaimPrefix & Lower(gIssAssignee.Mail),
                                           DisplayName: gIssAssignee.DisplayName,
                                           Email:       gIssAssignee.Mail,
                                           Department: "", JobTitle: "", Picture: "" },
                                     issue_status:      { Value: gIssStatus },
                                     // NO issue_date_open. It was `If(gEditMode = "Edit",
                                     // gEditIssue.issue_date_open, Now())` — an app-stamped
                                     // "when was this opened" that SharePoint already keeps
                                     // in `Created`, for free and beyond reach of the app.
                                     issue_date_target: dtpIssTarget.SelectedDate,
                                     issue_date_close:  dtpIssClose.SelectedDate,
                                     // --- FOLDED OPTIONALS: were five separate Patches --------
                                     // Blank() as the else is how a field is CLEARED, which is
                                     // what the follow-up clear-arms did. Folding also removes
                                     // the unlink bug at its root rather than patching around it.
                                     issue_type:
                                         If( gIssType <> "(none)", { Value: gIssType }, Blank() ),
                                     issue_impact:
                                         If( gIssImpact <> "(none)", { Value: gIssImpact }, Blank() ),
                                     issue_task_name:
                                         If( gIssTask.Id > 0, { Id: gIssTask.Id, Value: gIssTask.Value }, Blank() ),
                                     issue_transaction_name:
                                         If( gIssTx.Id > 0, { Id: gIssTx.Id, Value: gIssTx.Value }, Blank() ) } ) ),
                                     // NO issue_owner. It was a second Person column the user
                                     // filled by hand to record who raised the issue —
                                     // duplicating `Created By`, which SharePoint stamps and
                                     // the app cannot touch. Retired in schema.yaml, not
                                     // dropped: the column and its data are still in the list.
                        Set( gIssErr, FirstError.Message )
                    );
                    If( Len(gIssErr) > 0,
                        Notify("Couldn't save the issue: " & gIssErr, NotificationType.Error) );
                    If( Len(gIssErr) = 0,
                        If( Len(gIssWarn) > 0,
                            Notify( "Issue saved, but these fields didn't: " & gIssWarn, NotificationType.Warning ) );
                        If( Len(gIssWarn) = 0,
                            Notify( If(gEditMode = "Edit", "Issue saved", "Issue created"), NotificationType.Success ) );
                        Back()
                    ) );
                    Set( gSaving, false ) )
            - btnIssCancel:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =Theme.Color.Surface
                  Color: =Theme.Color.Primary
                  BorderColor: =Theme.Color.Primary
                  BorderThickness: =1
                  Font: =Theme.Font
                  Size: =Theme.Size.Body
                  Text: ="Cancel"
                  FillPortions: =0
                  LayoutMinWidth: =140
                  Width: =140
                  Height: =48
                  OnSelect: =Back()
      # =====================================================================
      # PICKER — ONE cmpPicker instance for the two person fields AND the two
      # record lookups. Declared LAST so the dialog paints above the footer.
      # gIssPicker names the field being filled and selects the row kind.
      # AllowCreate is false throughout: an issue links to things that already
      # exist. See scrTaskEdit's instance for the full contract commentary.
      # =====================================================================
      - cmpIssPick:
          Control: CanvasComponent
          ComponentName: cmpPicker
          Properties:
            Visible: =Len( Coalesce(gIssPicker, "") ) > 0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            # ONE state now. "Task" and "Tx" became project-scoped dropdowns on
            # 2026-08-12 — a bounded list does not need a search dialog.
            Title: ="Select assignee"
            # Queries run HERE — AccessAppScope false. Bound to gIssQuery, which
            # OnSearch sets, never to the instance's own Query output.
            # Uniform {Key, Primary, Secondary}; Key is Text for both kinds.
            Results: |
              =If( gIssPicker = "Assignee" && Len(gIssQuery) >= 2,
              ForAll( Office365Users.SearchUserV2({ searchTerm: gIssQuery, top: 25 }).value As u,
              { Key:       u.Mail,
              Primary:   u.DisplayName,
              Secondary: u.Mail } ) )
            OnSearch: =Set( gIssQuery, cmpIssPick.Query )
            AllowCreate: =false
            OnConfirm: |
              =Set( gIssAssignee,
                    { DisplayName: cmpIssPick.Picked.Primary, Mail: cmpIssPick.Picked.Secondary } );
               Set( gIssPicker, "" )
            OnCancel: =Set( gIssPicker, "" )
