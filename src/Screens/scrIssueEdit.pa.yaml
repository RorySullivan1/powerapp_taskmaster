                  - lblIssMissing:
                      Control: Label@2.5.1
                      Properties:
                        Text: |
                          =Trim(
                             If( Len(Trim(txtIssName.Text)) = 0, "summary   ", "" ) &
                             If( gIssProject.Id <= 0,            "project   ", "" ) &
                             If( Len(gIssAssignee.Mail) = 0,     "assignee   ", "" ) )
