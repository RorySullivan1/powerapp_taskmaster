# Create / edit an issue. Entered with gEditMode + gEditIssue; gSelProject pre-attaches
# a new issue to that project.
#
# The pattern all four scr*Edit screens share:
#  1. Seed globals in OnVisible, write from globals — never from a control's live state.
#  2. Picker globals have ONE fixed record shape; "nothing picked" is the empty/zero
#     record, tested with Len(...) = 0 or .Id <= 0, never IsBlank on a record.
#  3. Overlay pickers are DECLARED LAST — z-order is positional in this dialect.
#  4. Required columns go in the Patch; optional ones are If(cond, value, Blank()) inside
#     the same record. Writing {Value: ""} to an unset Choice fails.
#  5. Success is never assumed: Errors() returns a table, so IsError(Errors(...)) never
#     fires. Capture FirstError.Message inside IfError's fallback and gate on it.
#
# Office 365 Users must be added in Studio before this pastes.
Screens:
  scrIssueEdit:
    Properties:
      Fill: =gTheme.Color.Bg
      OnVisible: |
        =Set( gSaving, false );   // see btnIssSave
        Set( gIssProject,
              If( gEditMode = "Edit",
                  { Id: gEditIssue.issue_project_id.Id,
                    // NOT redundant. The lookup column's live display field is the target's ID,
                    // so `.Value` is a NUMBER — see schema.yaml on this column. Resolving the
                    // name app-side is the fix from 2026-08-09; do not "optimise" it away.
                    Value: LookUp(taskmaster_projects, ID = gEditIssue.issue_project_id.Id, project_name) },
                  gSelProject.ID > 0,
                  { Id: gSelProject.ID, Value: gSelProject.project_name },
                  { Id: 0, Value: "" } ) );
        Set( gIssTask,
              If( gEditMode = "Edit" && gEditIssue.issue_task_name.Id > 0,
                  { Id: gEditIssue.issue_task_name.Id, Value: gEditIssue.issue_task_name.Value },
                  { Id: 0, Value: "" } ) );
        Set( gIssTx,
              If( gEditMode = "Edit" && gEditIssue.issue_transaction_name.Id > 0,
                  { Id: gEditIssue.issue_transaction_name.Id, Value: gEditIssue.issue_transaction_name.Value },
                  { Id: 0, Value: "" } ) );
        Set( gIssAssignee,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditIssue.issue_assignee.DisplayName, ""),
                    Mail:        Coalesce(gEditIssue.issue_assignee.Email, "") },
                  { DisplayName: Coalesce(User().FullName, ""), Mail: Coalesce(User().Email, "") } ) );
        // NO gIssOwner SEED. issue_owner is stamped once on insert and displayed
        // straight off gEditIssue — it is never staged, because nothing edits it.
        // OPTION SETS FOR THE TWO ASSOCIATION DROPDOWNS. Collected here, AFTER
        // gIssProject is seeded above — they depend on it.
        // Delegable: `=` on an indexed Lookup FK. The "(none)" row is Collected first
        // so it sorts to the top, and it is what makes Id 0 a selectable "unlink"
        // instead of needing a separate clear button.
        // ForAll(... As alias, {record literal}) narrows each row to {Id, Label}; a
        // literal cannot be Collected alongside a raw SharePoint row, whose schema is
        // far wider, so both halves are projected to the same two columns.
        //
        // THE Filter DELEGATES; THE ForAll AROUND IT DOES NOT. So each option list is
        // capped at the DATA ROW LIMIT (set it to 2000). A project with more tasks than
        // that gets a silently short dropdown. The repo already treats 500-per-project
        // as reachable — scrProjectEdit's C3 rollup refuses to compute above it — so
        // this is a real ceiling, not a theoretical one. It is accepted here because the
        // alternative is going back to a search picker over the whole tenant, which is
        // what this replaced; revisit if a project ever nears the limit.
        ClearCollect( colIssTaskOpts, { Id: 0, Label: "(none)" } );
        Collect( colIssTaskOpts,
                 ForAll( Filter( taskmaster_tasks,
                                 task_project_id.Id = gIssProject.Id ) As t,
                         { Id: t.ID, Label: t.task_name } ) );
        ClearCollect( colIssTxOpts, { Id: 0, Label: "(none)" } );
        Collect( colIssTxOpts,
                 ForAll( Filter( taskmaster_transactions,
                                 transaction_project_id.Id = gIssProject.Id ) As x,
                         { Id: x.ID, Label: x.transaction_name } ) );
        If( gIssTask.Id > 0 && IsBlank( LookUp(colIssTaskOpts, Id = gIssTask.Id) ),
            Collect( colIssTaskOpts, { Id: gIssTask.Id, Label: gIssTask.Value } ) );
        If( gIssTx.Id > 0 && IsBlank( LookUp(colIssTxOpts, Id = gIssTx.Id) ),
            Collect( colIssTxOpts, { Id: gIssTx.Id, Label: gIssTx.Value } ) );
        // TYPE OPTIONS COME FROM THE COLUMN, not a literal list. A hard-coded
        // vocabulary drifts from SharePoint silently — project_phase carried two
        // values the app never enumerated, and those projects simply vanished.
        // "(none)" is Collected FIRST so it leads the list: an optional Choice has to
        // be clearable and {Value: ""} is not a legal write, so the blank has to be a
        // real option rather than an empty selection.
        ClearCollect( colIssTypeOpts, { Value: "(none)" } );
        Collect( colIssTypeOpts,
                 ForAll( Choices([@taskmaster_issues].issue_type) As c,
                         { Value: c.Value } ) );
        Set( gIssStatus, If( gEditMode = "Edit", Coalesce(gEditIssue.issue_status.Value, "Open"), "Open" ) );
        Set( gIssType,   If( gEditMode = "Edit", Coalesce(gEditIssue.issue_type.Value,   "(none)"), "(none)" ) );
        Set( gIssImpact, If( gEditMode = "Edit", Coalesce(gEditIssue.issue_impact.Value, "(none)"), "(none)" ) );
        Reset( txtIssName ); Reset( txtIssDesc );
        Set( gIssPicker, "" ); Set( gIssQuery, "" ); Reset( cmpIssPick );
        // Re-read DefaultDate; see the note on the pickers themselves.
        Reset( dtpIssTarget ); Reset( dtpIssClose );
        // A combo box re-reads DefaultSelectedItems ONLY on Reset. cboIssStatus is
        // one of these now too — it stopped being a cmpSelection strip on 2026-08-12.
        Reset( cboIssTask ); Reset( cboIssTx ); Reset( cboIssStatus );
        Reset( cboIssType ); Reset( cboIssImpact )
    Children:
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Primary
            Height: =gTheme.Space.HeaderH
            Width: =Parent.Width
            X: =0
            Y: =0
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: =If(gEditMode = "Edit", "Edit issue", "New issue") &
               If( gIssProject.Id > 0, "   ·   " & gIssProject.Value, "" )
            Color: =gTheme.Color.OnPrimary
            Font: =gTheme.Font
            FontWeight: =FontWeight.Semibold
            Size: =gTheme.Size.H2
            Height: =gTheme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =gTheme.Space.Gutter
            Y: =0
            Width: =400
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =gTheme.Color.OnPrimary
            HoverColor: =gTheme.Color.OnPrimary
            HoverFill: =RGBA(255, 255, 255, 0.15)
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            Height: =24
            Width: =24
            X: =Parent.Width - 24 - gTheme.Space.Gutter
            Y: =(gTheme.Space.HeaderH - 24) / 2
            OnSelect: =Back()
      - formSheet:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 88
      - frmIssScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =20
            PaddingBottom: =28
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 88
          Children:
            - gridIss1:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =120
                Children:
                  - lblIssNameCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Summary  *"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Height: =18
                  - txtIssName:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: =If(gEditMode = "Edit", gEditIssue.issue_name, "")
                        Placeholder: ="What is the issue?"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Body
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Height: =36
                  - colIssStatus:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =66
                      Children:
                        - lblIssStatusCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Status  *"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width
                              Height: =18
                        - cboIssStatus:
                            Control: ModernCombobox@1.1.1
                            Properties:
                              Items: |
                                =["Open", "Closed - Resolved", "Closed - Unresolved", "Closed - No Change"]
                              ItemDisplayText: =ThisItem.Value
                              DefaultSelectedItems: =Filter( [gIssStatus], !IsBlank(Value) )
                              SelectMultiple: =false
                              IsSearchable: =false
                              InputTextPlaceholder: ="Select…"
                              Color: |
                                =If( gIssStatus = "Open", gTheme.Color.TextPrimary, gTheme.Color.TextMuted )
                              FillPortions: =0
                              LayoutMinHeight: =40
                              Width: =Parent.Width
                              Height: =40
                              OnChange: =Set(gIssStatus, cboIssStatus.Selected.Value)
            - gridIss2:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =150
                Children:
                  - lblIssDescCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Description"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =2
                        Height: =18
                  - txtIssDesc:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: =If(gEditMode = "Edit", gEditIssue.issue_description, "")
                        Type: =TextInputType.Multiline
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =3
                        LayoutGridRowEnd: =10
                        Height: =96
                  - colIssType:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblIssTypeCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Type"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        # A COMBO BOX, not a cmpSelection strip. The strip raises OnChange with
                        # `Select(Parent); cmpSelection.OnChange()`, so the consumer reads
                        # `Selected` in the same behaviour chain that just changed it — the value
                        # can still be the PREVIOUS pick, which lands as a type that was never
                        # chosen or none at all. cboIssStatus was moved off the strip for the same
                        # reason on 2026-08-12 and has been correct since; these two were the
                        # last consumers left on it.
                        - cboIssType:
                            Control: ModernCombobox@1.1.1
                            Properties:
                              # Built in OnVisible from Choices() on the column itself, so a value
                              # added in SharePoint appears here with no app change.
                              Items: =colIssTypeOpts
                              ItemDisplayText: =ThisItem.Value
                              DefaultSelectedItems: =Filter( [gIssType], !IsBlank(Value) )
                              SelectMultiple: =false
                              IsSearchable: =false
                              InputTextPlaceholder: ="Select…"
                              Width: =Parent.Width
                              Height: =40
                              OnChange: =Set(gIssType, cboIssType.Selected.Value)
            - gridIss3:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =120
                Children:
                  - colIssImpact:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblIssImpactCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Impact"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        # Same move as cboIssType above, and it matters more here: the issues
                        # gallery on scrProject SORTS by impact, so a value that silently fails
                        # to land reorders the list rather than just missing a field.
                        - cboIssImpact:
                            Control: ModernCombobox@1.1.1
                            Properties:
                              Items: |
                                =["(none)", "Low", "Moderate", "High", "Critical"]
                              ItemDisplayText: =ThisItem.Value
                              DefaultSelectedItems: =Filter( [gIssImpact], !IsBlank(Value) )
                              SelectMultiple: =false
                              IsSearchable: =false
                              InputTextPlaceholder: ="Select…"
                              Width: =Parent.Width
                              Height: =40
                              OnChange: =Set(gIssImpact, cboIssImpact.Selected.Value)
            - gridIss4:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =120
                Children:
                  - colIssTask:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblIssTaskCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Related task"
                              Font: =gTheme.Font
                              Size: =12
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width
                              Height: =18
                        - cboIssTask:
                            Control: ModernCombobox@1.1.1
                            Properties:
                              Items: =colIssTaskOpts
                              ItemDisplayText: =ThisItem.Label
                              DefaultSelectedItems: =Filter( colIssTaskOpts, Id = gIssTask.Id )
                              SelectMultiple: =false
                              IsSearchable: =true
                              InputTextPlaceholder: ="Select…"
                              Width: =Parent.Width
                              Height: =36
                              OnChange: |
                                =Set( gIssTask,
                                      { Id:    cboIssTask.Selected.Id,
                                        Value: If( cboIssTask.Selected.Id = 0, "", cboIssTask.Selected.Label ) } )
                  - lblIssTargetCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Target resolution date"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Height: =18
                  - dtpIssTarget:
                      Control: ModernDatePicker@1.0.1
                      Properties:
                        DefaultDate: =If(gEditMode = "Edit", gEditIssue.issue_date_target, Blank())
                        Placeholder: ="Target date"
                        Format: =DatePickerFormat.LongAbbreviated
                        StartOfWeek: =StartOfWeek.Monday
                        IsEditable: =true
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Height: =36
            - gridIss5:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =120
                Children:
                  - colIssTx:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblIssTxCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Related transaction"
                              Font: =gTheme.Font
                              Size: =12
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width
                              Height: =18
                        - cboIssTx:
                            Control: ModernCombobox@1.1.1
                            Properties:
                              Items: =colIssTxOpts
                              ItemDisplayText: =ThisItem.Label
                              DefaultSelectedItems: =Filter( colIssTxOpts, Id = gIssTx.Id )
                              SelectMultiple: =false
                              IsSearchable: =true
                              InputTextPlaceholder: ="Select…"
                              Width: =Parent.Width
                              Height: =36
                              OnChange: |
                                =Set( gIssTx,
                                      { Id:    cboIssTx.Selected.Id,
                                        Value: If( cboIssTx.Selected.Id = 0, "", cboIssTx.Selected.Label ) } )
                  - lblIssCloseCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Resolution date"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Height: =18
                  - dtpIssClose:
                      Control: ModernDatePicker@1.0.1
                      Properties:
                        DefaultDate: =If(gEditMode = "Edit", gEditIssue.issue_date_close, Blank())
                        Placeholder: ="Close date"
                        Format: =DatePickerFormat.LongAbbreviated
                        StartOfWeek: =StartOfWeek.Monday
                        IsEditable: =true
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Height: =36
            - rowIss6:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =24
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - colIssAssignee:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =(Parent.Width - 24) / 2
                        Height: =62
                      Children:
                        - fldAssignee:
                            Control: CanvasComponent
                            ComponentName: cmpLookupField
                            Properties:
                              Caption: ="Assignee  *"
                              PickLabel: ="＋  Choose an assignee"
                              HasValue: =Len(gIssAssignee.Mail) > 0
                              Display: =gIssAssignee.DisplayName
                              Width: =Parent.Width
                              Height: =62
                              OnPick: |
                                =Set( gIssPicker, "Assignee" );
                                 Reset( cmpIssPick );
                                 Set( gIssQuery, "" )
                              OnClear: |
                                =Set( gIssAssignee, { DisplayName: "", Mail: "" } )
                  # ---------------------------------------------------------------
                  # PROVENANCE — READ ONLY, and read ONLY from SharePoint's own
                  # system columns. This slot used to hold a "Business owner"
                  # people-picker writing `issue_owner`, plus a hidden `issue_date_open`
                  # the save stamped with Now(). Both were app-written, so both were
                  # editable, wrong-able and duplicable — and neither was what anyone
                  # actually wanted from them: who raised this, and when.
                  #
                  # `issue_owner` / `issue_date_open` are stamped ONCE, by a second Patch
                  # that runs on insert only — the update path never names them, so an
                  # edit cannot move them. There is no picker and no form field: the
                  # field is un-manipulable because the app offers no way to touch it.
                  #
                  # NOT `Created By` / `Created`. The canvas connector does not surface
                  # `Created By` on this list, so `gEditIssue.'Created By'` does not
                  # resolve — see `system_columns` in schema.yaml.
                  # ---------------------------------------------------------------
                  - colIssOpened:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =(Parent.Width - 24) / 2
                        Height: =62
                      Children:
                        - lblIssOpenedCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Opened by"
                              Font: =gTheme.Font
                              Size: =12
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width
                              Height: =18
                        - lblIssOpenedVal:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                =If( gEditMode <> "Edit",
                                     "Recorded automatically when you save",
                                     Coalesce( gEditIssue.issue_owner.DisplayName, "not recorded" )
                                     & If( IsBlank(gEditIssue.issue_date_open), "",
                                           "   ·   " & Text(gEditIssue.issue_date_open, "d mmm yyyy") ) )
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Body
                              Color: |
                                =If( gEditMode <> "Edit", gTheme.Color.TextMuted, gTheme.Color.TextPrimary )
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =36
                              Width: =Parent.Width
                              Height: =36
            - colIssMissing:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =4
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblIssMissingCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Still required:"
                        Visible: =Len(lblIssMissing.Text) > 0
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        Width: =Parent.Width
                        Height: =18
                  - lblIssMissing:
                      Control: Label@2.5.1
                      Properties:
                        Text: |
                          =Trim(
                             If( Len(Trim(txtIssName.Text)) = 0, "summary   ", "" ) &
                             // SAFETY NET, not a prompt. The project is DERIVED and has no field on
                             // this form, but a blank one would still be rejected by SharePoint —
                             // and silently, since there is nothing on screen to point at. Same
                             // guard scrTaskEdit keeps for the same reason.
                             If( gIssProject.Id <= 0,            "a parent project (not set — reopen from the project screen)   ", "" ) &
                             If( Len(gIssAssignee.Mail) = 0,     "assignee   ", "" ) &
                             // issue_status is required:true and the save writes it
                             // UNGUARDED, so an empty gIssStatus sends {Value: ""} — not a
                             // member, and the connector rejects the whole insert. That is
                             // the exact failure project_coverage already paid for. The
                             // combo box can empty it (deselecting a selected item), and a
                             // legacy row holding a retired status seeds it to something
                             // the new Items cannot display.
                             If( Len(gIssStatus) = 0,            "status   ", "" ) )
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.Danger
                        Width: =Parent.Width
                        Height: =40
                        Visible: =Len(Self.Text) > 0
      - actionBarBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            BorderColor: =gTheme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
      - actionBarRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
          Children:
            - lblIssFooterSpacer:
                Control: Label@2.5.1
                Properties:
                  Text: =""
                  FillPortions: =1
                  LayoutMinWidth: =60
                  Height: =48
            - btnIssSave:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =gTheme.Color.Primary
                  Color: =gTheme.Color.OnPrimary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =0
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Text: |
                    =If( gSaving, "Saving…",
                         If(gEditMode = "Edit", "Save issue", "Create issue") )
                  # ALWAYS ENABLED — see scrTaskEdit btnTkSave. A disabled button cannot fire
                  # OnSelect, so a record missing a required field gave a click that did
                  # nothing at all. The requirement moved into OnSelect, where it can speak.
                  FillPortions: =0
                  LayoutMinWidth: =200
                  Width: =200
                  Height: =48
                  # ONE WRITE. Every column, required and optional, is in a single Patch;
                  # the optionals are If(condition, value, Blank()) inside the record.
                  # It used to be one Patch plus FIVE guarded follow-ups against the row
                  # just written — six serial round trips to save one issue. Folding also
                  # killed the unlink bug at the root: three of those follow-ups had no
                  # clearing arm, so a cleared task/transaction/owner never saved.
                  #
                  # The gate is gIssErr, captured in IfError's fallback: FirstError is
                  # only in scope THERE, so the message is stashed and acted on
                  # afterwards. Two reasons it is not `IsBlank(gIssSaved)`: Errors()
                  # returns a TABLE (so IsError(Errors(...)) never fires), and what a
                  # failed Patch leaves in the Set target is not something a one-way gap
                  # can verify. Each IfError argument is a SINGLE statement — no ";"
                  # chains inside a function argument.
                  #
                  # EVERY IfError ARGUMENT IS A `Set(...)`, AND THAT IS LOAD-BEARING.
                  # "IfError returns the value of one of its arguments. The types of all
                  # values that might be returned by IfError must be compatible" — and
                  # MS Learn adds that *currently* ALL arguments must be compatible, not
                  # just the ones that could be returned. `Patch` returns a record and
                  # `Notify` returns a boolean, so the obvious `IfError(Patch(…),
                  # Notify(…))` — which the docs themselves show — is rejected today with
                  # "expecting a record". Wrapping the Patch in a Set makes both sides a
                  # Set and it types. Failures are therefore accumulated into gIssWarn
                  # and reported in ONE banner after the guarded block, which also beats
                  # up to five separate toasts.
                  OnSelect: |
                    =If( gSaving,
                    // A SECOND TAP WHILE THE FIRST WRITE IS STILL IN FLIGHT. Do nothing.
                    // A SharePoint Patch takes seconds; the button stayed live throughout, so a
                    // double-tap ran the whole handler twice and Defaults() built a SECOND new
                    // record. `Set` applies immediately within a behaviour chain, so the flag is
                    // already true by the time the second tap is evaluated.
                    // NO DisplayMode GATE — see this button's ALWAYS ENABLED note. A disabled
                    // button cannot fire OnSelect and cannot say why; the Text says "Saving…"
                    // instead, and the guard below is what actually blocks the duplicate.
                    false,
                    Set( gSaving, true );
                    If( Len(lblIssMissing.Text) > 0,
                    // The requirement that used to disable the button, moved here so a blocked
                    // save names the field. These are required in schema.yaml — SharePoint would
                    // reject the write regardless; this only decides whether the user is told.
                    Notify( "Can't save yet — this still needs: " & lblIssMissing.Text,
                    NotificationType.Error ),
                    Set( gIssSaved, Blank() );
                    Set( gIssErr, "" );
                    Set( gIssWarn, "" );
                    IfError(
                        Set( gIssSaved,
                            Patch( taskmaster_issues,
                                   If( gEditMode = "Edit", gEditIssue, Defaults(taskmaster_issues) ),
                                   // Mirrors the PARENT's phase so cross-project queries can exclude archived
                                   // work with a delegable `= false`. Written on EVERY save, not just on insert.
                                   // Read LIVE from the list, not from gSelProject: that global is a gallery
                                   // snapshot taken when the project was opened, so a project archived since
                                   // then would stamp `false` here and the row would stay in scope forever.
                                   // One delegable LookUp on ID.
                                   { issue_project_archived:
                                         Coalesce( LookUp( taskmaster_projects, ID = gSelProject.ID,
                                                           project_phase.Value ), "" ) = "Archived",
                                   issue_name:        Trim(txtIssName.Text),
                                     issue_description: txtIssDesc.Text,
                                     issue_project_id:  { Id: gIssProject.Id, Value: gIssProject.Value },
                                     issue_assignee:
                                         { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                           Claims:      gClaimPrefix & Lower(gIssAssignee.Mail),
                                           DisplayName: gIssAssignee.DisplayName,
                                           Email:       gIssAssignee.Mail,
                                           Department: "", JobTitle: "", Picture: "" },
                                     issue_status:      { Value: gIssStatus },
                                     issue_date_target: dtpIssTarget.SelectedDate,
                                     issue_date_close:  dtpIssClose.SelectedDate,
                                     issue_type:
                                         If( gIssType <> "(none)", { Value: gIssType }, Blank() ),
                                     issue_impact:
                                         If( gIssImpact <> "(none)", { Value: gIssImpact }, Blank() ),
                                     issue_task_name:
                                         If( gIssTask.Id > 0, { Id: gIssTask.Id, Value: gIssTask.Value }, Blank() ),
                                     issue_transaction_name:
                                         If( gIssTx.Id > 0, { Id: gIssTx.Id, Value: gIssTx.Value }, Blank() ) } ) ),
                        Set( gIssErr, FirstError.Message )
                    );
                    // Trust the RECORD, never the message — see scrTaskEdit.
                    If( IsBlank(gIssSaved.ID) && Len(gIssErr) = 0,
                        Set( gIssErr, "SharePoint returned no record and no error message, so nothing was saved." ) );
                    // PROVENANCE, INSERT ONLY. A second Patch rather than two fields in the
                    // one above, because the update path must not NAME these columns at all:
                    // a field named in a Patch is written, and there is no value to write on
                    // an edit that is not either a rewrite or a clear. Omitting them is the
                    // only way to leave them alone. Failure is a warning, not an error — the
                    // issue itself is already saved by this point.
                    If( gEditMode <> "Edit" && Len(gIssErr) = 0,
                        IfError(
                            Set( gIssStamped,
                                Patch( taskmaster_issues, gIssSaved,
                                       { issue_owner:
                                             { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                               Claims:      gClaimPrefix & Lower(User().Email),
                                               DisplayName: User().FullName,
                                               Email:       User().Email,
                                               Department: "", JobTitle: "", Picture: "" },
                                         issue_date_open: Now() } ) ),
                            Set( gIssWarn, gIssWarn & "who opened it and when: " & FirstError.Message & "   " ) ) );
                    If( Len(gIssErr) > 0,
                        Notify("Couldn't save the issue: " & gIssErr, NotificationType.Error) );
                    If( Len(gIssErr) = 0,
                        If( Len(gIssWarn) > 0,
                            Notify( "Issue saved, but these fields didn't: " & gIssWarn, NotificationType.Warning ) );
                        If( Len(gIssWarn) = 0,
                            Notify( If(gEditMode = "Edit", "Issue saved", "Issue created"), NotificationType.Success ) );
                        Back()
                    ) );
                    Set( gSaving, false ) )
            - btnIssCancel:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =gTheme.Color.Surface
                  Color: =gTheme.Color.Primary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =1
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Text: ="Cancel"
                  FillPortions: =0
                  LayoutMinWidth: =140
                  Width: =140
                  Height: =48
                  OnSelect: =Back()
      # =====================================================================
      # PICKER — ONE cmpPicker instance for the two person fields AND the two
      # record lookups. Declared LAST so the dialog paints above the footer.
      # gIssPicker names the field being filled and selects the row kind.
      # AllowCreate is false throughout: an issue links to things that already
      # exist. See scrTaskEdit's instance for the full contract commentary.
      # =====================================================================
      - cmpIssPick:
          Control: CanvasComponent
          ComponentName: cmpPicker
          Properties:
            Visible: =Len( Coalesce(gIssPicker, "") ) > 0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: ="Select assignee"
            # Queries run HERE — AccessAppScope false. Bound to gIssQuery, which
            # OnSearch sets, never to the instance's own Query output.
            # Uniform {Key, Primary, Secondary}; Key is Text for both kinds.
            # There is no "first 10 people" to open on, so the default row is the
            # current user — one tap to assign an issue to yourself.
            Results: |
              =If( gIssPicker = "Assignee" && Len(gIssQuery) >= 2,
              ForAll( Office365Users.SearchUserV2({ searchTerm: gIssQuery, top: 25 }).value As u,
              { Key:       u.Mail,
              Primary:   u.DisplayName,
              Secondary: u.Mail } ),
              gIssPicker = "Assignee",
              Table( { Key:       User().Email,
              Primary:   User().FullName,
              Secondary: User().Email } ) )
            OnSearch: =Set( gIssQuery, cmpIssPick.Query )
            AllowCreate: =false
            OnConfirm: |
              =Set( gIssAssignee,
                    { DisplayName: cmpIssPick.Picked.Primary, Mail: cmpIssPick.Picked.Secondary } );
               Set( gIssPicker, "" )
            OnCancel: =Set( gIssPicker, "" )
