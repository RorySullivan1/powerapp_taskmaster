      - actionBarBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Surface
            BorderColor: =Theme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
      - actionBarRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
          Children:
            - lblIssFooterSpacer:
                Control: Label@2.5.1
                Properties:
                  Text: =""
                  FillPortions: =1
                  LayoutMinWidth: =60
                  Height: =48
            - btnIssSave:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =Theme.Color.Primary
                  Color: =Theme.Color.OnPrimary
                  BorderColor: =Theme.Color.Primary
                  BorderThickness: =0
                  Font: =Theme.Font
                  Size: =Theme.Size.Body
                  Text: =If(gEditMode = "Edit", "Save issue", "Create issue")
                  # ALWAYS ENABLED — see scrTaskEdit btnTkSave. A disabled button cannot fire
                  # OnSelect, so a record missing a required field gave a click that did
                  # nothing at all. The requirement moved into OnSelect, where it can speak.
                  FillPortions: =0
                  LayoutMinWidth: =200
                  Width: =200
                  Height: =48
                  # Required fields in one Patch; optional ones after, each guarded.
                  # The gate is gIssErr, captured in IfError's fallback: FirstError is
                  # only in scope THERE, so the message is stashed and acted on
                  # afterwards. Two reasons it is not `IsBlank(gIssSaved)`: Errors()
                  # returns a TABLE (so IsError(Errors(...)) never fires), and what a
                  # failed Patch leaves in the Set target is not something a one-way gap
                  # can verify. Each IfError argument is a SINGLE statement — no ";"
                  # chains inside a function argument.
                  #
                  # EVERY IfError ARGUMENT IS A `Set(...)`, AND THAT IS LOAD-BEARING.
                  # "IfError returns the value of one of its arguments. The types of all
                  # values that might be returned by IfError must be compatible" — and
                  # MS Learn adds that *currently* ALL arguments must be compatible, not
                  # just the ones that could be returned. `Patch` returns a record and
                  # `Notify` returns a boolean, so the obvious `IfError(Patch(…),
                  # Notify(…))` — which the docs themselves show — is rejected today with
                  # "expecting a record". Wrapping the Patch in a Set makes both sides a
                  # Set and it types. Failures are therefore accumulated into gIssWarn
                  # and reported in ONE banner after the guarded block, which also beats
                  # up to five separate toasts.
                  OnSelect: |
                    =If( Len(lblIssMissing.Text) > 0,
                    // The requirement that used to disable the button, moved here so a blocked
                    // save names the field. These are required in schema.yaml — SharePoint would
                    // reject the write regardless; this only decides whether the user is told.
                    Notify( "Can't save yet — this still needs: " & lblIssMissing.Text,
                    NotificationType.Error ),
                    Set( gIssSaved, Blank() );
                    Set( gIssErr, "" );
                    Set( gIssWarn, "" );
                    IfError(
                        Set( gIssSaved,
                            Patch( taskmaster_issues,
                                   If( gEditMode = "Edit", gEditIssue, Defaults(taskmaster_issues) ),
                                   { issue_name:        Trim(txtIssName.Text),
                                     issue_description: txtIssDesc.Text,
                                     issue_project_id:  { Id: gIssProject.Id, Value: gIssProject.Value },
                                     issue_assignee:
                                         { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                           Claims:      ClaimPrefix & Lower(gIssAssignee.Mail),
                                           DisplayName: gIssAssignee.DisplayName,
                                           Email:       gIssAssignee.Mail,
                                           Department: "", JobTitle: "", Picture: "" },
                                     issue_status:      { Value: gIssStatus },
                                     issue_date_open:
                                         If( gEditMode = "Edit", gEditIssue.issue_date_open, Now() ),
                                     issue_date_target: dtpIssTarget.SelectedDate,
                                     issue_date_close:  dtpIssClose.SelectedDate } ) ),
                        Set( gIssErr, FirstError.Message )
                    );
                    If( Len(gIssErr) > 0,
                        Notify("Couldn't save the issue: " & gIssErr, NotificationType.Error) );
                    If( Len(gIssErr) = 0,
                        // --- optional fields, one guarded Patch each ---------------
                        // gIssOpt exists only so both IfError arguments are a Set and
                        // therefore type-compatible; its value is never read.
                        If( gIssType <> "(none)",
                            IfError( Set( gIssOpt, Patch(taskmaster_issues, gIssSaved, { issue_type: { Value: gIssType } }) ),
                                     Set( gIssWarn, gIssWarn & "type (" & FirstError.Message & ")   " ) ),
                            gEditMode = "Edit",
                            IfError( Set( gIssOpt, Patch(taskmaster_issues, gIssSaved, { issue_type: Blank() }) ),
                                     Set( gIssWarn, gIssWarn & "type (" & FirstError.Message & ")   " ) ) );
                        If( gIssImpact <> "(none)",
                            IfError( Set( gIssOpt, Patch(taskmaster_issues, gIssSaved, { issue_impact: { Value: gIssImpact } }) ),
                                     Set( gIssWarn, gIssWarn & "impact (" & FirstError.Message & ")   " ) ),
                            gEditMode = "Edit",
                            IfError( Set( gIssOpt, Patch(taskmaster_issues, gIssSaved, { issue_impact: Blank() }) ),
                                     Set( gIssWarn, gIssWarn & "impact (" & FirstError.Message & ")   " ) ) );
                        If( gIssTask.Id > 0,
                            IfError( Set( gIssOpt, Patch(taskmaster_issues, gIssSaved,
                                           { issue_task_name: { Id: gIssTask.Id, Value: gIssTask.Value } }) ),
                                     Set( gIssWarn, gIssWarn & "task link (" & FirstError.Message & ")   " ) ) );
                        If( gIssTx.Id > 0,
                            IfError( Set( gIssOpt, Patch(taskmaster_issues, gIssSaved,
                                           { issue_transaction_name: { Id: gIssTx.Id, Value: gIssTx.Value } }) ),
                                     Set( gIssWarn, gIssWarn & "transaction link (" & FirstError.Message & ")   " ) ) );
                        If( Len(gIssOwner.Mail) > 0,
                            IfError( Set( gIssOpt, Patch(taskmaster_issues, gIssSaved,
                                           { issue_owner:
                                               { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                 Claims:      ClaimPrefix & Lower(gIssOwner.Mail),
                                                 DisplayName: gIssOwner.DisplayName,
                                                 Email:       gIssOwner.Mail,
                                                 Department: "", JobTitle: "", Picture: "" } }) ),
                                     Set( gIssWarn, gIssWarn & "owner (" & FirstError.Message & ")   " ) ) );
                        If( Len(gIssWarn) > 0,
                            Notify( "Issue saved, but these fields didn't: " & gIssWarn, NotificationType.Warning ) );
                        If( Len(gIssWarn) = 0,
                            Notify( If(gEditMode = "Edit", "Issue saved", "Issue created"), NotificationType.Success ) );
                        Back()
                    ) )
            - btnIssCancel:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =Theme.Color.Surface
                  Color: =Theme.Color.Primary
                  BorderColor: =Theme.Color.Primary
                  BorderThickness: =1
                  Font: =Theme.Font
                  Size: =Theme.Size.Body
                  Text: ="Cancel"
                  FillPortions: =0
                  LayoutMinWidth: =140
                  Width: =140
                  Height: =48
                  OnSelect: =Back()
      - cmpIssPeople:
          Control: CanvasComponent
          ComponentName: cmpPeoplePicker
          Properties:
            Visible: =gIssPicker = "Assignee" || gIssPicker = "Owner"
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: |
              =Switch( gIssPicker,
                       "Assignee", "Select assignee",
                       "Owner",    "Select business owner" )
            Results: |
              =If( Len(gIssPeopleQuery) >= 2,
                   ShowColumns(
                       Office365Users.SearchUserV2({ searchTerm: gIssPeopleQuery, top: 25 }).value,
                       DisplayName, Mail ) )
            OnSearch: =Set( gIssPeopleQuery, cmpIssPeople.Query )
            OnConfirm: |
              =Switch( gIssPicker,
                       "Assignee",
                       Set( gIssAssignee,
                            { DisplayName: cmpIssPeople.Picked.DisplayName,
                              Mail:        cmpIssPeople.Picked.Mail } ),
                       "Owner",
                       Set( gIssOwner,
                            { DisplayName: cmpIssPeople.Picked.DisplayName,
                              Mail:        cmpIssPeople.Picked.Mail } ) );
               Set( gIssPicker, "" )
            OnCancel: =Set( gIssPicker, "" )

      # =====================================================================
      # RECORD PICKER — declared LAST so the dialog paints above the footer.
      # ONE instance serves every lookup on this screen; gIssPicker names which.
      # The query runs HERE, not in the component: with AccessAppScope false
      # it cannot reach a data source. Each branch is a delegable StartsWith
      # on an indexed Text column, projected to the {Id, Primary, Secondary}
      # shape the component declares. ShowColumns takes IDENTIFIERS.
      # =====================================================================
      - cmpIssRecord:
          Control: CanvasComponent
          ComponentName: cmpRecordPicker
          Properties:
            Visible: =gIssPicker = "Project" || gIssPicker = "Task" || gIssPicker = "Tx"
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: =Switch( gIssPicker, "Project", "Select project", "Task", "Select task", "Select transaction" )
            Results: |
              =If( Len(gIssRecQuery) < 2, Blank(),
              gIssPicker = "Project",
              AddColumns( ShowColumns( Filter( taskmaster_projects,
              StartsWith(project_name, gIssRecQuery) ),
              ID, project_name, project_phase ),
              Id, ID, Primary, project_name, Secondary, Coalesce(project_phase.Value, "") ),
              gIssPicker = "Task",
              AddColumns( ShowColumns( Filter( taskmaster_tasks,
              StartsWith(task_name, gIssRecQuery) ),
              ID, task_name, task_stage ),
              Id, ID, Primary, task_name, Secondary, Coalesce(task_stage.Value, "") ),
              AddColumns( ShowColumns( Filter( taskmaster_transactions,
              StartsWith(transaction_name, gIssRecQuery) ),
              ID, transaction_name, transaction_currency ),
              Id, ID, Primary, transaction_name, Secondary, Coalesce(transaction_currency.Value, "") ) )
            OnSearch: =Set( gIssRecQuery, cmpIssRecord.Query )
            AllowCreate: =false
            OnConfirm: |
              =Switch( gIssPicker,
              "Project", Set( gIssProject, { Id: cmpIssRecord.Picked.Id, Value: cmpIssRecord.Picked.Primary } ),
              "Task",    Set( gIssTask,    { Id: cmpIssRecord.Picked.Id, Value: cmpIssRecord.Picked.Primary } ),
              Set( gIssTx,      { Id: cmpIssRecord.Picked.Id, Value: cmpIssRecord.Picked.Primary } ) );
              Set( gIssPicker, "" )
            OnCancel: =Set( gIssPicker, "" )
