# Create / edit an issue. Entered with gEditMode + gEditIssue; gSelProject pre-attaches
# a new issue to that project.
#
# The pattern all four scr*Edit screens share:
#  1. Seed globals in OnVisible, write from globals — never from a control's live state.
#  2. Picker globals have ONE fixed record shape; "nothing picked" is the empty/zero
#     record, tested with Len(...) = 0 or .Id <= 0, never IsBlank on a record.
#  3. Overlay pickers are DECLARED LAST — z-order is positional in this dialect.
#  4. Required columns go in the Patch; optional ones are If(cond, value, Blank()) inside
#     the same record. Writing {Value: ""} to an unset Choice fails.
#  5. Success is never assumed: Errors() returns a table, so IsError(Errors(...)) never
#     fires. Capture FirstError.Message inside IfError's fallback and gate on it.
#
# Office 365 Users must be added in Studio before this pastes.
Screens:
  scrIssueEdit:
    Properties:
      Fill: =gTheme.Color.Bg
      OnVisible: |
        =Set( gSaving, false );   // see btnIssSave
        Set( gIssProject,
              If( gEditMode = "Edit",
                  { Id: gEditIssue.issue_project_id.Id,
                    // NOT redundant. The lookup column's live display field is the target's ID, so
                    // `.Value` is a NUMBER — see schema.yaml. Do not "optimise" this away.
                    Value: LookUp(taskmaster_projects, ID = gEditIssue.issue_project_id.Id, project_name) },
                  gSelProject.ID > 0,
                  { Id: gSelProject.ID, Value: gSelProject.project_name },
                  { Id: 0, Value: "" } ) );
        Set( gIssTask,
              If( gEditMode = "Edit" && gEditIssue.issue_task_name.Id > 0,
                  { Id: gEditIssue.issue_task_name.Id, Value: gEditIssue.issue_task_name.Value },
                  { Id: 0, Value: "" } ) );
        Set( gIssTx,
              If( gEditMode = "Edit" && gEditIssue.issue_transaction_name.Id > 0,
                  { Id: gEditIssue.issue_transaction_name.Id, Value: gEditIssue.issue_transaction_name.Value },
                  { Id: 0, Value: "" } ) );
        Set( gIssAssignee,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditIssue.issue_assignee.DisplayName, ""),
                    Mail:        Coalesce(gEditIssue.issue_assignee.Email, "") },
                  { DisplayName: Coalesce(User().FullName, ""), Mail: Coalesce(User().Email, "") } ) );
        // NO gIssOwner SEED — issue_owner is stamped once on insert and never staged.
        // The two association dropdowns depend on gIssProject, seeded above. Delegable: `=`
        // on an indexed Lookup FK. "(none)" is Collected first so it sorts to the top, and
        // is what makes Id 0 a selectable "unlink" rather than a separate clear button.
        // THE Filter DELEGATES; THE ForAll AROUND IT DOES NOT, so each option list is capped
        // at the DATA ROW LIMIT and a project with more tasks than that gets a silently short
        // dropdown. Accepted because the alternative is a search picker over the whole
        // tenant; revisit if a project ever nears the limit.
        // BOTH LISTS ARE PER-PROJECT, so neither can be cached across visits the way the
        // vocabularies below are — but they are independent of each other, so they go
        // together. One ClearCollect each: "(none)" is the first ITEM, and a Concurrent arm
        // is one formula.
        Concurrent(
            ClearCollect( colIssTaskOpts, { Id: 0, Label: "(none)" },
                 ForAll( Filter( LiveTasks,
                                 task_project_id.Id = gIssProject.Id ) As t,
                         { Id: t.ID, Label: t.task_name } ) ),
            ClearCollect( colIssTxOpts, { Id: 0, Label: "(none)" },
                 ForAll( Filter( LiveTransactions,
                                 transaction_project_id.Id = gIssProject.Id ) As x,
                         { Id: x.ID, Label: x.transaction_name } ) ) );
        If( gIssTask.Id > 0 && IsBlank( LookUp(colIssTaskOpts, Id = gIssTask.Id) ),
            Collect( colIssTaskOpts, { Id: gIssTask.Id, Label: gIssTask.Value } ) );
        If( gIssTx.Id > 0 && IsBlank( LookUp(colIssTxOpts, Id = gIssTx.Id) ),
            Collect( colIssTxOpts, { Id: gIssTx.Id, Label: gIssTx.Value } ) );
        // ALL THREE CHOICE VOCABULARIES COME FROM THE COLUMNS, not literal lists — a
        // hard-coded list drifts from SharePoint silently, and project_phase once carried
        // two values the app never enumerated, so those projects simply vanished.
        // All three are REQUIRED, so none carries a blank row: the seed always lands on a
        // real member and the save writes it unguarded.
        // cmpSelection needs {Id, Label} and Choices() returns only Value, so the Id is
        // synthesised POSITIONALLY. The Ids mean nothing beyond "which row" — never hard-code
        // one; each DefaultId looks its value up by Label. Required columns get no blank row.
        // ONCE PER SESSION, NOT ONCE PER VISIT: an EMPTY list is the only reason to fetch a
        // vocabulary again, and a new value is picked up on the next app start. These three
        // MUST be loaded before the gIssType / gIssImpact seeds below, which test the stored
        // value against the vocabulary.
        Concurrent(
            If( IsEmpty(colIssStatusOpts),
                ClearCollect( colIssStatusOpts,
                      With( { ch: Choices([@taskmaster_issues].issue_status) },
                            ForAll( Sequence( CountRows(ch) ) As n,
                                    { Id: n.Value, Label: Index(ch, n.Value).Value } ) ) ) ),
            If( IsEmpty(colIssTypeOpts),
                ClearCollect( colIssTypeOpts,
                      With( { ch: Choices([@taskmaster_issues].issue_type) },
                            ForAll( Sequence( CountRows(ch) ) As n,
                                    { Id: n.Value, Label: Index(ch, n.Value).Value } ) ) ) ),
            If( IsEmpty(colIssImpactOpts),
                ClearCollect( colIssImpactOpts,
                      With( { ch: Choices([@taskmaster_issues].issue_impact) },
                            ForAll( Sequence( CountRows(ch) ) As n,
                                    { Id: n.Value, Label: Index(ch, n.Value).Value } ) ) ) ) );
        Set( gIssStatus, If( gEditMode = "Edit", Coalesce(gEditIssue.issue_status.Value, "Open"), "Open" ) );
        // THE SEED IS TESTED AGAINST THE VOCABULARY, not just against blank. A legacy row
        // can hold a RETIRED value, which is not blank, so a Coalesce alone would carry it
        // through: the picker would show the default while the global held the retired value,
        // and the save would write what the display denied.
        Set( gIssType,
             With( { v: If( gEditMode = "Edit", Coalesce(gEditIssue.issue_type.Value, ""), "" ) },
                 If( Len(v) > 0 && v in colIssTypeOpts.Label, v, "Question" ) ) );
        Set( gIssImpact,
             With( { v: If( gEditMode = "Edit", Coalesce(gEditIssue.issue_impact.Value, ""), "" ) },
                 If( Len(v) > 0 && v in colIssImpactOpts.Label, v, "Moderate" ) ) );
        Reset( txtIssName ); Reset( txtIssDesc );
        Set( gIssPicker, "" ); Set( gIssQuery, "" ); Reset( cmpIssPick );
        // Re-read DefaultDate.
        Reset( dtpIssTarget );
        // A combo box re-reads DefaultSelectedItems ONLY on Reset.
        Reset( cboIssTask ); Reset( cboIssTx );
        // cmpSelection re-reads its DefaultId ONLY on Reset.
        Reset( selIssStatus ); Reset( selIssType ); Reset( selIssImpact )
    Children:
      # =====================================================================
      # HEALTH RECOMPUTE. Hidden, 1x1, declared FIRST so it can never cover a control
      # (z-order is positional). Select() DOES fire on an invisible control (probe,
      # tests/README.md). Seed colHlTasks with the task ids, then Select this.
      # =====================================================================
      - btnIssHealth:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Visible: =false
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            X: =0
            Y: =0
            Width: =1
            Height: =1
            OnSelect: |
              =// Recomputes the STORED half of task health for every task in colHlTasks.
               // The rules, and why OVERDUE IS DELIBERATELY NOT IN HERE, live in one place:
               // rollups.task_health in schema.yaml. Do not restate them at the call sites.
               //
               // THIS BODY IS DUPLICATED ON scrIssueEdit AND scrProject and must stay identical —
               // a control can only be Selected from its own screen. Change one, change the other.
               //
               // NARROW SERVER-SIDE, TEST LOCALLY: the outer Filter uses issue_task_name and
               // issue_status, both INDEXED, so it delegates; issue_type and issue_impact are not
               // indexed and are only tested against the few rows it returns. Written as one flat
               // Filter the whole query goes non-delegable and reads an arbitrary page.
               // The RAW list, not OpenIssues — that named formula also excludes archived projects,
               // which would drive every task under one to Green instead of leaving it alone.
               ClearCollect( colHlWork,
                   ForAll( colHlTasks As t,
                       { Id: t.Id,
                         // OpenIssues ALREADY carries `issue_status = "Open"` — do not re-test it
                         // here, and do not "fix" this back to the raw list: raw makes the fetch
                         // page across archived issues first, and a short fetch reads GREEN on a
                         // task that has open ones.
                         Hl: With( { iss: Filter( OpenIssues,
                                                  issue_task_name.Id = t.Id ) },
                                 // AMBER IS THE RESIDUAL — "any other open issue" — NOT the four
                                 // amber types enumerated. Enumerated, a type added in SharePoint and
                                 // not added here falls through to GREEN: an allow-list failing closed,
                                 // silently, on the one signal that exists to warn people.
                                 If( CountRows( Filter( iss,
                                         issue_impact.Value = "Critical"
                                      || issue_type.Value = "Blockage"
                                      || issue_type.Value = "Exception"
                                      || issue_type.Value = "Limitation" ) ) > 0, "Red",
                                     CountRows(iss) > 0, "Amber",
                                     "Green" ) ) } ) );
               // WRITE ONLY ON A CHANGE: most issue edits leave the task's health where it was,
               // and a no-op Patch is still a round trip.
               // NO Set() INSIDE THIS ForAll. MS Learn sanctions Patch and Collect and rules out
               // the functions that HOLD A VARIABLE, because ForAll may run its records in any
               // order; Set is the global twin of UpdateContext and Studio rejects it the same way.
               // Patch's return is not captured either — an uncaptured ForAll result is never
               // built, so there is no per-record data source copy to pay for.
               // A failed health write is not worth interrupting a save for, so IfError discards it;
               // the next recompute retries and only a stale colour is wrong meanwhile.
               ForAll( colHlWork As w,
                   With( { tk: LookUp(taskmaster_tasks, ID = w.Id) },
                       If( !IsBlank(tk.ID) && Coalesce(tk.task_status.Value, "") <> w.Hl,
                           IfError( Patch( taskmaster_tasks, tk,
                                           { task_status: { Value: w.Hl } } ),
                                    Blank() ) ) ) )
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Primary
            Height: =gTheme.Space.HeaderH
            Width: =Parent.Width
            X: =0
            Y: =0
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: =If(gEditMode = "Edit", "Edit issue", "New issue") &
               If( gIssProject.Id > 0, "   ·   " & gIssProject.Value, "" )
            Color: =gTheme.Color.OnPrimary
            Font: =gTheme.Font
            FontWeight: =FontWeight.Semibold
            Size: =gTheme.Size.H2
            Height: =gTheme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =gTheme.Space.Gutter
            Y: =0
            Width: =400
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =gTheme.Color.OnPrimary
            HoverColor: =gTheme.Color.OnPrimary
            HoverFill: =RGBA(255, 255, 255, 0.15)
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            Height: =24
            Width: =24
            X: =Parent.Width - 24 - gTheme.Space.Gutter
            Y: =(gTheme.Space.HeaderH - 24) / 2
            OnSelect: =Back()
      - formSheet:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 88
      - frmIssScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =20
            PaddingBottom: =28
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =gTheme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - gTheme.Space.HeaderH - 88
          Children:
            - gridIss1:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =120
                Children:
                  - lblIssNameCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Summary  *"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Height: =18
                  - txtIssName:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: =If(gEditMode = "Edit", gEditIssue.issue_name, "")
                        Placeholder: ="What is the issue?"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Body
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Height: =36
                  - colIssStatus:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =66
                      Children:
                        - lblIssStatusCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Status  *"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width
                              Height: =18
                        # FontSize 10, not the default 11: three of the four values are "Closed - …"
                        # phrases sharing a half-width cell. The labels cannot be shortened — OnChange
                        # writes Selected.Label straight into the Choice.
                        - selIssStatus:
                            Control: CanvasComponent
                            ComponentName: cmpSelection
                            Properties:
                              FontSize: =10
                              Width: =Parent.Width
                              Height: =40
                              # NOTE THE COUPLING: "Open" is a literal in App.Formulas (OpenIssues), in
                              # scrProject's status glyph and in its open-count. A status value added in
                              # SharePoint appears HERE automatically but is invisible to those three.
                              Items: =colIssStatusOpts
                              DefaultId: =Coalesce( LookUp(colIssStatusOpts, Label = gIssStatus, Id), 1 )
                              OnChange: =Set(gIssStatus, selIssStatus.Selected.Label)
            - gridIss2:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =150
                Children:
                  - lblIssDescCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Description"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =2
                        Height: =18
                  - txtIssDesc:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: =If(gEditMode = "Edit", gEditIssue.issue_description, "")
                        Type: =TextInputType.Multiline
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =3
                        LayoutGridRowEnd: =10
                        Height: =96
                  - colIssImpact:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblIssImpactCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Impact"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - selIssImpact:
                            Control: CanvasComponent
                            ComponentName: cmpSelection
                            Properties:
                              FontSize: =11
                              Width: =Parent.Width
                              Height: =40
                              # NOTE THE COUPLING: scrProject's issues gallery sorts on impact via a
                              # Switch over four known names; a value added in SharePoint sorts last.
                              Items: =colIssImpactOpts
                              # THE FALLBACK IS THE DEFAULT BY LABEL, not Id 1 — Id 1 is whichever
                              # value SharePoint returns first.
                              DefaultId: |
                                =Coalesce( LookUp(colIssImpactOpts, Label = gIssImpact, Id),
                                           LookUp(colIssImpactOpts, Label = "Moderate", Id), 1 )
                              OnChange: =Set(gIssImpact, selIssImpact.Selected.Label)
            # NO GRID HERE. A GridLayout child spanning LayoutGridColumnStart 1 to
            # LayoutGridColumnEnd 2 did NOT render full width in Studio, and the grid's shape
            # declaration has never been fully grounded from a code view. This sits directly
            # in the vertical scroll container instead.
            - colIssType:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =8
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblIssTypeCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Type"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        FillPortions: =0
                        LayoutMinHeight: =18
                        Width: =Parent.Width
                        Height: =18
                  - selIssType:
                      Control: CanvasComponent
                      ComponentName: cmpSelection
                      Properties:
                        FontSize: =11
                        Width: =Parent.Width
                        Height: =40
                        # Built in OnVisible from Choices(), so a value added in SharePoint
                        # appears here with no app change.
                        Items: =colIssTypeOpts
                        # BY LABEL, not a hard-coded Id: the Ids are positional and depend on
                        # the order SharePoint returns, so nothing may assume one.
                        DefaultId: |
                          =Coalesce( LookUp(colIssTypeOpts, Label = gIssType, Id),
                                     LookUp(colIssTypeOpts, Label = "Question", Id), 1 )
                        OnChange: =Set(gIssType, selIssType.Selected.Label)
            - gridIss4:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =120
                Children:
                  - colIssTask:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblIssTaskCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Related task"
                              Font: =gTheme.Font
                              Size: =12
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width
                              Height: =18
                        - cboIssTask:
                            Control: ModernCombobox@1.1.1
                            Properties:
                              Items: =colIssTaskOpts
                              ItemDisplayText: =ThisItem.Label
                              DefaultSelectedItems: =Filter( colIssTaskOpts, Id = gIssTask.Id )
                              SelectMultiple: =false
                              IsSearchable: =true
                              InputTextPlaceholder: ="Select…"
                              Width: =Parent.Width
                              Height: =36
                              OnChange: |
                                =Set( gIssTask,
                                      { Id:    cboIssTask.Selected.Id,
                                        Value: If( cboIssTask.Selected.Id = 0, "", cboIssTask.Selected.Label ) } )
                  - lblIssTargetCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Target resolution date"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Height: =18
                  - dtpIssTarget:
                      Control: ModernDatePicker@1.0.1
                      Properties:
                        DefaultDate: =If(gEditMode = "Edit", gEditIssue.issue_date_target, Blank())
                        Placeholder: ="Target date"
                        Format: =DatePickerFormat.LongAbbreviated
                        StartOfWeek: =StartOfWeek.Monday
                        IsEditable: =true
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Height: =36
            - gridIss5:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =120
                Children:
                  - colIssTx:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblIssTxCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Related transaction"
                              Font: =gTheme.Font
                              Size: =12
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =18
                              Width: =Parent.Width
                              Height: =18
                        - cboIssTx:
                            Control: ModernCombobox@1.1.1
                            Properties:
                              Items: =colIssTxOpts
                              ItemDisplayText: =ThisItem.Label
                              DefaultSelectedItems: =Filter( colIssTxOpts, Id = gIssTx.Id )
                              SelectMultiple: =false
                              IsSearchable: =true
                              InputTextPlaceholder: ="Select…"
                              Width: =Parent.Width
                              Height: =36
                              OnChange: |
                                =Set( gIssTx,
                                      { Id:    cboIssTx.Selected.Id,
                                        Value: If( cboIssTx.Selected.Id = 0, "", cboIssTx.Selected.Label ) } )
            - rowIss6:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =24
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - colIssAssignee:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =Parent.Width
                        Height: =62
                      Children:
                        - fldAssignee:
                            Control: CanvasComponent
                            ComponentName: cmpLookupField
                            Properties:
                              Caption: ="Assignee  *"
                              PickLabel: ="＋  Choose an assignee"
                              HasValue: =Len(gIssAssignee.Mail) > 0
                              Display: =gIssAssignee.DisplayName
                              Width: =Parent.Width
                              Height: =62
                              OnPick: |
                                =Set( gIssPicker, "Assignee" );
                                 Reset( cmpIssPick );
                                 Set( gIssQuery, "" )
                              OnClear: |
                                =Set( gIssAssignee, { DisplayName: "", Mail: "" } )
            - colIssMissing:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =4
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblIssMissingCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Still required:"
                        Visible: =Len(lblIssMissing.Text) > 0
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        Width: =Parent.Width
                        Height: =18
                  - lblIssMissing:
                      Control: Label@2.5.1
                      Properties:
                        Text: |
                          =Trim(
                             If( Len(Trim(txtIssName.Text)) = 0, "summary   ", "" ) &
                             // SAFETY NET, not a prompt. The project is DERIVED and has no field on this
                             // form, but a blank one would still be rejected by SharePoint — silently, since
                             // there is nothing on screen to point at.
                             If( gIssProject.Id <= 0,            "a parent project (not set — reopen from the project screen)   ", "" ) &
                             If( Len(gIssAssignee.Mail) = 0,     "assignee   ", "" ) &
                             // issue_status is required and the save writes it UNGUARDED, so an empty
                             // gIssStatus sends {Value: ""} — not a member, and the connector rejects the
                             // whole insert. The combo box can empty it, and a legacy row holding a retired
                             // status seeds it to something the new Items cannot display.
                             If( Len(gIssStatus) = 0,            "status   ", "" ) &
                             // SAME NET, same reason: type and impact are required and written unguarded.
                             If( Len(gIssType) = 0,              "type   ", "" ) &
                             If( Len(gIssImpact) = 0,            "impact   ", "" ) )
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.Danger
                        Width: =Parent.Width
                        Height: =40
                        Visible: =Len(Self.Text) > 0
      - actionBarBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gTheme.Color.Surface
            BorderColor: =gTheme.Color.Border
            BorderThickness: =1
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
      - actionBarRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Parent.Height - 88
            Width: =Parent.Width
            Height: =88
          Children:
            # DESTRUCTIVE, so it sits hard left, away from Save. Edit mode only. Arms the
            # dialog and deletes nothing; gDelRefs is counted here so the dialog can say
            # what else changes.
            - btnIssDelete:
                Control: Classic/Button@2.2.0
                Properties:
                  Visible: =gEditMode = "Edit"
                  Text: ="Delete"
                  Fill: =gTheme.Color.Surface
                  Color: =gTheme.Color.Danger
                  BorderColor: =gTheme.Color.Danger
                  BorderThickness: =1
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  FillPortions: =0
                  LayoutMinWidth: =140
                  Width: =140
                  Height: =48
                  OnSelect: |
                    =Set( gDelKind, "Issue" );
                     Set( gDelId, gEditIssue.ID );
                     Set( gDelName, gEditIssue.issue_name );
                     Set( gDelRefs, 0 )
            - lblIssFooterSpacer:
                Control: Label@2.5.1
                Properties:
                  Text: =""
                  FillPortions: =1
                  LayoutMinWidth: =60
                  Height: =48
            - btnIssSave:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =gTheme.Color.Primary
                  Color: =gTheme.Color.OnPrimary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =0
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Text: |
                    =If( gSaving, "Saving…",
                         If(gEditMode = "Edit", "Save issue", "Create issue") )
                  # ALWAYS ENABLED — do not put a DisplayMode gate back. A DISABLED BUTTON CANNOT FIRE
                  # OnSelect, so a record missing a required field gave a click that did nothing and said
                  # nothing. The requirement moved into OnSelect, where it can NAME the missing field.
                  FillPortions: =0
                  LayoutMinWidth: =200
                  Width: =200
                  Height: =48
                  # ONE WRITE. Every column, required and optional, is in a single Patch; the
                  # optionals are If(condition, value, Blank()) inside the record. Folding the old
                  # follow-up Patches in also killed the unlink bug: three of them had no clearing arm,
                  # so a cleared task/transaction/owner never saved.
                  # The gate is gIssErr, captured in IfError's fallback — FirstError is only in scope
                  # THERE. Not `IsBlank(gIssSaved)`: Errors() returns a TABLE, so IsError(Errors(...))
                  # never fires. Each IfError argument is a SINGLE statement — no ";" chains inside a
                  # function argument.
                  # EVERY IfError ARGUMENT IS A `Set(...)`, AND THAT IS LOAD-BEARING. MS Learn requires
                  # ALL arguments to be type-compatible, not just the ones that could be returned, so
                  # the obvious IfError(Patch(...), Notify(...)) — which the docs themselves show — is
                  # rejected with "expecting a record". Wrapping the Patch in a Set makes both sides a
                  # Set. Failures accumulate into gIssWarn and are reported in ONE banner afterwards.
                  OnSelect: |
                    =If( gSaving,
                    // A SECOND TAP WHILE THE FIRST WRITE IS STILL IN FLIGHT. Do nothing — a Patch takes
                    // seconds and the button stays live, so a double-tap ran the handler twice and built a
                    // SECOND record. `Set` applies immediately within a behaviour chain.
                    false,
                    Set( gSaving, true );
                    If( Len(lblIssMissing.Text) > 0,
                    // Enforced here so a blocked save names the field. These are required in
                    // schema.yaml, so SharePoint would reject the write regardless; this only
                    // decides whether the user is told.
                    Notify( "Can't save yet — this still needs: " & lblIssMissing.Text,
                    NotificationType.Error ),
                    // THE TASK LINK CAN MOVE, so the task this issue is LEAVING needs its health
                    // recomputed too — captured here because after the Patch the old value is gone.
                    Set( gIssOldTask,
                         If( gEditMode = "Edit", Coalesce(gEditIssue.issue_task_name.Id, 0), 0 ) );
                    Set( gIssSaved, Blank() );
                    Set( gIssErr, "" );
                    Set( gIssWarn, "" );
                    // THE PRE-WRITE READS, ISSUED TOGETHER. Both used to sit INSIDE the Patch record,
                    // where the write could not be issued until each had returned in turn.
                    Concurrent(
                        // Keyed on gIssProject.Id, the issue's OWN parent, and read LIVE from the list:
                        // a snapshot carried in a global would stamp the archived mirror `false` for a
                        // project archived since, and the row would stay in scope forever.
                        Set( gIssParentProj, LookUp( taskmaster_projects, ID = gIssProject.Id ) ),
                        // STILL CONDITIONAL, DELIBERATELY. This read only matters when an existing issue
                        // is being closed, so the guard keeps the ordinary save at one read, not two.
                        Set( gIssPriorClose,
                             If( gEditMode = "Edit" && StartsWith(gIssStatus, "Closed"),
                                 LookUp( taskmaster_issues, ID = gEditIssue.ID, issue_date_close ) ) ) );
                    IfError(
                        Set( gIssSaved,
                            Patch( taskmaster_issues,
                                   If( gEditMode = "Edit", gEditIssue, Defaults(taskmaster_issues) ),
                                   // Mirrors the PARENT's phase so cross-project queries can exclude archived work with
                                   // a delegable `= false`. Written on EVERY save, from the record the Concurrent
                                   // above read at save time.
                                   { issue_project_archived:
                                         Coalesce( gIssParentProj.project_phase.Value, "" ) = "Archived",
                                   issue_name:        Trim(txtIssName.Text),
                                     issue_description: txtIssDesc.Text,
                                     issue_project_id:  { Id: gIssProject.Id, Value: gIssProject.Value },
                                     issue_assignee:
                                         { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                           Claims:      gClaimPrefix & Lower(gIssAssignee.Mail),
                                           DisplayName: gIssAssignee.DisplayName,
                                           Email:       gIssAssignee.Mail,
                                           Department: "", JobTitle: "", Picture: "" },
                                     issue_status:      { Value: gIssStatus },
                                     issue_date_target: dtpIssTarget.SelectedDate,
                                     // DERIVED — there is no close-date field on this screen. gIssPriorClose is the
                                     // STORED date, read from the list by the Concurrent above, NOT gEditIssue: that
                                     // global is a snapshot, and no control reads this column any more, which is
                                     // exactly what Explicit Column Selection trims out of a carried record.
                                     // Coalesce then PRESERVES it — re-saving a closed issue must not move the date.
                                     // StartsWith, not an enumerated list: a Closed-* value added later must still stamp.
                                     // This is a local test with no query behind it, so the DELEGATION rule that forces
                                     // enumeration in App.Formulas does not apply.
                                     issue_date_close:
                                         If( StartsWith(gIssStatus, "Closed"),
                                             If( gEditMode = "Edit",
                                                 Coalesce( gIssPriorClose, Now() ),
                                                 Now() ),
                                             Blank() ),
                                     // UNGUARDED, like issue_status: both are required and the picker
                                     // offers no blank, so Blank() is never the right write.
                                     issue_type:   { Value: gIssType },
                                     issue_impact: { Value: gIssImpact },
                                     issue_task_name:
                                         If( gIssTask.Id > 0, { Id: gIssTask.Id, Value: gIssTask.Value }, Blank() ),
                                     issue_transaction_name:
                                         If( gIssTx.Id > 0, { Id: gIssTx.Id, Value: gIssTx.Value }, Blank() ) } ) ),
                        Set( gIssErr, FirstError.Message )
                    );
                    // Trust the RECORD, never the message — see scrTaskEdit.
                    If( IsBlank(gIssSaved.ID) && Len(gIssErr) = 0,
                        Set( gIssErr, "SharePoint returned no record and no error message, so nothing was saved." ) );
                    // PROVENANCE, INSERT ONLY. A second Patch rather than two fields in the one above,
                    // because the update path must not NAME these columns at all: a field named in a
                    // Patch is written, and omitting them is the only way to leave them alone. Failure
                    // is a warning — the issue itself is already saved.
                    If( gEditMode <> "Edit" && Len(gIssErr) = 0,
                        IfError(
                            Set( gIssStamped,
                                Patch( taskmaster_issues, gIssSaved,
                                       { issue_owner:
                                             { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                               Claims:      gClaimPrefix & Lower(User().Email),
                                               DisplayName: User().FullName,
                                               Email:       User().Email,
                                               Department: "", JobTitle: "", Picture: "" },
                                         issue_date_open: Now() } ) ),
                            Set( gIssWarn, gIssWarn & "who opened it and when: " & FirstError.Message & "   " ) ) );
                    // HEALTH FOLLOWS THE ISSUE. type, impact, status and the task link all feed a
                    // task's health, so every successful save recomputes it — for the task gained AND
                    // the one lost. Only after the write.
                    If( Len(gIssErr) = 0,
                        Clear( colHlTasks );
                        If( gIssOldTask > 0, Collect( colHlTasks, { Id: gIssOldTask } ) );
                        If( gIssTask.Id > 0 && gIssTask.Id <> gIssOldTask,
                            Collect( colHlTasks, { Id: gIssTask.Id } ) );
                        Select( btnIssHealth ) );
                    If( Len(gIssErr) > 0,
                        Notify("Couldn't save the issue: " & gIssErr, NotificationType.Error) );
                    If( Len(gIssErr) = 0,
                        If( Len(gIssWarn) > 0,
                            Notify( "Issue saved, but these fields didn't: " & gIssWarn, NotificationType.Warning ) );
                        If( Len(gIssWarn) = 0,
                            Notify( If(gEditMode = "Edit", "Issue saved", "Issue created"), NotificationType.Success ) );
                        Back()
                    ) );
                    Set( gSaving, false ) )
            - btnIssCancel:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =gTheme.Color.Surface
                  Color: =gTheme.Color.Primary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =1
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Text: ="Cancel"
                  FillPortions: =0
                  LayoutMinWidth: =140
                  Width: =140
                  Height: =48
                  OnSelect: =Back()
      # =====================================================================
      # PICKER — ONE cmpPicker instance for the two person fields AND the two record
      # lookups. Declared LAST so the dialog paints above the footer. AllowCreate is false
      # throughout: an issue links to things that already exist.
      # See scrTaskEdit's instance for the full contract commentary.
      # =====================================================================
      - cmpIssPick:
          Control: CanvasComponent
          ComponentName: cmpPicker
          Properties:
            Visible: =Len( Coalesce(gIssPicker, "") ) > 0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: ="Select assignee"
            # Queries run HERE — AccessAppScope false. Bound to gIssQuery, which OnSearch
            # sets. The default row is the current user — one tap to assign to yourself.
            Results: |
              =If( gIssPicker = "Assignee" && Len(gIssQuery) >= 2,
              ForAll( Office365Users.SearchUserV2({ searchTerm: gIssQuery, top: 25 }).value As u,
              { Key:       u.Mail,
              Primary:   u.DisplayName,
              Secondary: u.Mail } ),
              gIssPicker = "Assignee",
              Table( { Key:       User().Email,
              Primary:   User().FullName,
              Secondary: User().Email } ) )
            OnSearch: =Set( gIssQuery, cmpIssPick.Query )
            AllowCreate: =false
            OnConfirm: |
              =Set( gIssAssignee,
                    { DisplayName: cmpIssPick.Picked.Primary, Mail: cmpIssPick.Picked.Secondary } );
               Set( gIssPicker, "" )
            OnCancel: =Set( gIssPicker, "" )
      # =====================================================================
      # DELETE CONFIRMATION. See scrProject's instance for the Studio check that must
      # happen before this screen is pasted — a component's custom properties do NOT
      # come across in a paste. Visible is gated as well as IsOpen.
      # =====================================================================
      - cmpIssConfirmDel:
          Control: CanvasComponent
          ComponentName: cmpConfirmDialog
          Properties:
            Visible: =Len( Coalesce(gDelKind, "") ) > 0
            IsOpen: =Len( Coalesce(gDelKind, "") ) > 0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: ="Delete this issue?"
            Message: |
              ="Delete " & gDelName & "? Nothing else references an issue." &
                       " This cannot be undone."
            ConfirmLabel: ="Delete"
            CancelLabel: ="Cancel"
            Destructive: =true
            # IfError( Remove(...), Notify(...) ) is REJECTED by Studio: Remove and ForAll/Patch
            # return a TABLE while Notify and Set return a boolean, and IfError requires
            # type-compatible arguments. Hence Set-into-a-scrap, with a DIFFERENT name per site.
            OnConfirm: |
              =Set( gDelErr, "" );
               Set( gDelBlock, false );
               // THE LINK IS READ NOW, while the row still knows its task: deleting the last open
               // Blockage must take that task off Red, and after the Remove there is nothing to ask.
               Set( gDelIssTask,
                    If( gDelKind = "Issue",
                        Coalesce( LookUp(taskmaster_issues, ID = gDelId).issue_task_name.Id, 0 ),
                        0 ) );
               If( Len(gDelErr) = 0 && !gDelBlock,
                   IfError( Set( gDelScrapI,
                                 Remove( taskmaster_issues, LookUp(taskmaster_issues, ID = gDelId) ) ),
                            Set( gDelErr, FirstError.Message ) ) );
               If( gDelBlock,
                   Notify( "Too many issues reference this to detach in one pass. Nothing was deleted — ask for the cleanup workflow.",
                           NotificationType.Error ),
                   Len(gDelErr) > 0,
                   Notify( "Couldn't delete it: " & gDelErr
                             & " Some issue links may already have been cleared — reopen the project to check.",
                           NotificationType.Error ),
                   Notify( "Issue deleted.", NotificationType.Success );
                   If( gDelIssTask > 0,
                       ClearCollect( colHlTasks, { Id: gDelIssTask } );
                       Select( btnIssHealth ) );
                   // Back() lands on scrProject, whose OnVisible calls btnPrjRecompute.
                   Back() );
               Set( gDelKind, "" )
            OnCancel: =Set( gDelKind, "" )
