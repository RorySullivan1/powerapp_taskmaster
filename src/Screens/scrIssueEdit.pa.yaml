                              Text: ="＋  Choose a task"
                              Align: =Align.Left
                              Fill: =Theme.Color.Bg
                              Color: =Theme.Color.TextMuted
                              BorderColor: =Theme.Color.Border
                              BorderThickness: =1
                              Font: =Theme.Font
                              Size: =Theme.Size.Body
                              Width: =Parent.Width
                              Height: =36
                              OnSelect: |
                                =Set( gIssPicker, "Task" );
                                 Reset( cmpIssRecord );
                                 Set( gIssRecQuery, "" )
                        - chipIssTask:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Visible: =gIssTask.Id > 0
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =6
                              Width: =Parent.Width
                              Height: =36
                            Children:
                              - lblIssTaskChip:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =If(gIssTask.Id > 0, gIssTask.Value, "— none —")
                                    Font: =Theme.Font
                                    Size: =Theme.Size.Small
                                    Color: =If(gIssTask.Id > 0, Theme.Color.TextPrimary, Theme.Color.TextMuted)
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =60
                                    Height: =36
                              - icoIssTaskClear:
