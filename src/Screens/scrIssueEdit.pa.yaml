# =============================================================================
# scrIssueEdit  —  create / edit an issue.
#
# Entered with:  Set(gEditMode, "New" | "Edit");  Set(gEditIssue, <record>)
#                (gEditIssue is ignored when gEditMode = "New")
# If gSelProject is set, a NEW issue is pre-attached to that project.
#
# THE SHARED EDIT-SCREEN PATTERN — all four scr*Edit screens follow it, so read
# this header once. See _EDIT-NOTES.md for the rationale in full.
#
#  1. SEED GLOBALS IN OnVisible, WRITE FROM GLOBALS. Never write from a control's
#     or component's live state. A cmpSelection strip keeps the previous record's
#     pick (Reset cannot reach inside a component), and whether it clears on
#     navigation is precisely what a one-way gap cannot verify — so re-seeding
#     here makes the WRITE correct regardless of what the screen is displaying.
#  2. NORMALISED PICKER RECORDS. Every picker global has ONE fixed schema —
#     people are {DisplayName, Mail}, lookups are {Id, Value} — because a global
#     assigned two different record shapes is a type conflict. "Nothing picked"
#     is the empty/zero record, tested with Len(...) = 0 / .Id <= 0, never with
#     IsBlank on a record whose type was inferred from Blank().
#  3. OVERLAY PICKER GALLERIES ARE DECLARED LAST. Z-order is positional in this
#     dialect, so a result list declared at the end floats above the fields it
#     covers — that is what makes a search box behave like a dropdown without
#     needing an unverified ComboBox token.
#  4. REQUIRED FIELDS GO IN THE FIRST PATCH; OPTIONAL ONES FOLLOW, GUARDED.
#     Power Fx cannot conditionally omit a field from a record literal, and
#     writing {Value: ""} to an unset Choice fails. So each optional field gets
#     its own guarded Patch: set it when chosen, clear it (Blank()) only when
#     editing. Errors are then attributable to one field instead of the form.
#  5. SUCCESS IS NEVER ASSUMED. Errors() returns a TABLE, so `IsError(Errors(…))`
#     would never fire. The save captures FirstError.Message into a g*Err variable
#     inside IfError's fallback — the only scope where FirstError exists — and
#     everything that tells the user it worked lives behind `Len(g*Err) = 0`.
#     Every IfError argument is a single statement; no ";" chains inside one.
#
# CONNECTION PREREQUISITE: Office 365 Users must be added in Studio before this
# pastes (people pickers). See HANDOFF.md.
#
# Grounded tokens only. Modern controls where they earn their place:
# ModernTextInput (output is still `.Text`), ModernDatePicker (`.SelectedDate`)
# and ModernButton. The two date fields no longer parse text, so their
# "⚠ not a date" echo labels are gone — a picker cannot produce a bad date.
# Every column token resolves to schema/schema.yaml (golden source).
#
# =============================================================================
Screens:
  scrIssueEdit:
    Properties:
      Fill: =Theme.Color.Bg
      OnVisible: |
        =Set( gIssProject,
              If( gEditMode = "Edit",
                  { Id: gEditIssue.issue_project_id.Id,
                    Value: LookUp(taskmaster_projects, ID = gEditIssue.issue_project_id.Id, project_name) },
                  gSelProject.ID > 0,
                  { Id: gSelProject.ID, Value: gSelProject.project_name },
                  { Id: 0, Value: "" } ) );
        Set( gIssTask,
              If( gEditMode = "Edit" && gEditIssue.issue_task_name.Id > 0,
                  { Id: gEditIssue.issue_task_name.Id, Value: gEditIssue.issue_task_name.Value },
                  { Id: 0, Value: "" } ) );
        Set( gIssTx,
              If( gEditMode = "Edit" && gEditIssue.issue_transaction_name.Id > 0,
                  { Id: gEditIssue.issue_transaction_name.Id, Value: gEditIssue.issue_transaction_name.Value },
                  { Id: 0, Value: "" } ) );
        Set( gIssAssignee,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditIssue.issue_assignee.DisplayName, ""),
                    Mail:        Coalesce(gEditIssue.issue_assignee.Email, "") },
                  { DisplayName: Coalesce(User().FullName, ""), Mail: Coalesce(User().Email, "") } ) );
        Set( gIssOwner,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditIssue.issue_owner.DisplayName, ""),
                    Mail:        Coalesce(gEditIssue.issue_owner.Email, "") },
                  { DisplayName: "", Mail: "" } ) );
        Set( gIssStatus, If( gEditMode = "Edit", Coalesce(gEditIssue.issue_status.Value, "Open"), "Open" ) );
        Set( gIssType,   If( gEditMode = "Edit", Coalesce(gEditIssue.issue_type.Value,   "(none)"), "(none)" ) );
        Set( gIssImpact, If( gEditMode = "Edit", Coalesce(gEditIssue.issue_impact.Value, "(none)"), "(none)" ) );
        Reset( txtIssName ); Reset( txtIssDesc );
        Set( gIssPicker, "" ); Set( gIssPeopleQuery, "" ); Reset( cmpIssPeople );
        // Re-read DefaultDate; see the note on the pickers themselves.
        Reset( dtpIssTarget ); Reset( dtpIssClose )
    Children:
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Primary
            Height: =Theme.Space.HeaderH
            Width: =Parent.Width
            X: =0
            Y: =0
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: =If(gEditMode = "Edit", "Edit issue", "New issue")
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            FontWeight: =FontWeight.Semibold
            Size: =Theme.Size.H2
            Height: =Theme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Theme.Space.Gutter
            Y: =0
            Width: =400
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =Theme.Color.OnPrimary
            Height: =24
            Width: =24
            X: =Parent.Width - 24 - Theme.Space.Gutter
            Y: =(Theme.Space.HeaderH - 24) / 2
            OnSelect: =Back()
      - formSheet:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Surface
            X: =0
            Y: =Theme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - Theme.Space.HeaderH - 88
      - frmIssScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =20
            PaddingBottom: =28
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Theme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - Theme.Space.HeaderH - 88
          Children:
            - gridIss1:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =120
                Children:
                  - lblIssNameCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Summary  *"
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =3
                        Height: =18
                  - txtIssName:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: =If(gEditMode = "Edit", gEditIssue.issue_name, "")
                        Placeholder: ="What is the issue?"
                        Font: =Theme.Font
                        Size: =Theme.Size.Body
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =4
                        LayoutGridRowEnd: =10
                        Height: =36
                  - colIssStatus:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblIssStatusCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Status  *"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - selIssStatus:
                            Control: CanvasComponent
                            ComponentName: cmpSelection
                            Properties:
                              FontSize: =11
                              Width: =Parent.Width
                              Height: =40
                              Items: |
                                =Table( { Id: 1, Label: "Open" },    { Id: 2, Label: "Review" },
                                        { Id: 3, Label: "Waiting" }, { Id: 4, Label: "Blocked" },
                                        { Id: 5, Label: "Closed" } )
                              DefaultId: |
                                =Switch( If(gEditMode = "Edit", Coalesce(gEditIssue.issue_status.Value, "Open"), "Open"),
                                         "Open", 1, "Review", 2, "Waiting", 3, "Blocked", 4, 5 )
                              OnChange: =Set(gIssStatus, selIssStatus.Selected.Label)
            - gridIss2:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =150
                Children:
                  - lblIssDescCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Description"
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextMuted
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =2
                        Height: =18
                  - txtIssDesc:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Default: =If(gEditMode = "Edit", gEditIssue.issue_description, "")
