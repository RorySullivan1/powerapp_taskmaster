                        - lblIssTypeCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Type"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - selIssType:
                            Control: CanvasComponent
                            ComponentName: cmpSelection
                            Properties:
                              FontSize: =10
                              Width: =Parent.Width
                              Height: =40
                              # "(none)" is a real option, not a placeholder: an optional Choice must
                              # be clearable, and {Value: ""} is not a legal write.
                              Items: |
                                =Table( { Id: 1, Label: "(none)" },     { Id: 2, Label: "Approval" },
                                        { Id: 3, Label: "Process" },    { Id: 4, Label: "Compliance" },
                                        { Id: 5, Label: "Branding" },   { Id: 6, Label: "Technical" } )
                              DefaultId: |
                                =Switch( If(gEditMode = "Edit", Coalesce(gEditIssue.issue_type.Value, "(none)"), "(none)"),
                                         "Approval", 2, "Process", 3, "Compliance", 4, "Branding", 5, "Technical", 6, 1 )
                              OnChange: =Set(gIssType, selIssType.Selected.Label)
            - gridIss3:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =120
                Children:
                  - colIssProject:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblIssProjCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Project  *"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        # Opens the shared record picker. Was a search box that filtered a
                        # floating gallery as you typed; the search now lives in the dialog.
                        # Reset() clears the previous field's query and highlight — one
                        # instance serves every lookup on this screen.
                        - btnIssProjectPick:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Visible: =gIssProject.Id <= 0
                              Text: ="＋  Choose a project"
                              Align: =Align.Left
                              Fill: =Theme.Color.Bg
                              Color: =Theme.Color.TextMuted
                              BorderColor: =Theme.Color.Border
                              BorderThickness: =1
                              Font: =Theme.Font
                              Size: =Theme.Size.Body
                              Width: =Parent.Width
                              Height: =36
                              OnSelect: |
                                =Set( gIssPicker, "Project" );
                                 Reset( cmpIssRecord );
                                 Set( gIssRecQuery, "" )
                        - chipIssProject:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Visible: =gIssProject.Id > 0
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =6
                              Width: =Parent.Width
                              Height: =36
                            Children:
                              - lblIssProjChip:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =If(gIssProject.Id > 0, gIssProject.Value, "— none selected —")
                                    Font: =Theme.Font
                                    Size: =Theme.Size.Small
                                    Color: =If(gIssProject.Id > 0, Theme.Color.TextPrimary, Theme.Color.TextMuted)
                                    VerticalAlign: =VerticalAlign.Middle
                                    FillPortions: =1
                                    LayoutMinWidth: =60
                                    Height: =36
                              - icoIssProjClear:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Icon: =Icon.Cancel
                                    Color: =Theme.Color.TextMuted
                                    FillPortions: =0
                                    LayoutMinWidth: =16
                                    Height: =16
                                    Width: =16
                                    OnSelect: |
                                      =Set(gIssProject, { Id: 0, Value: "" }); Reset( cmpIssRecord )
                  - colIssImpact:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =2
                        LayoutGridColumnEnd: =2
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblIssImpactCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Impact"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - selIssImpact:
                            Control: CanvasComponent
                            ComponentName: cmpSelection
                            Properties:
                              FontSize: =11
                              Width: =Parent.Width
                              Height: =40
                              Items: |
                                =Table( { Id: 1, Label: "(none)" }, { Id: 2, Label: "Low" },
                                        { Id: 3, Label: "Moderate" }, { Id: 4, Label: "High" },
                                        { Id: 5, Label: "Critical" } )
                              DefaultId: |
                                =Switch( If(gEditMode = "Edit", Coalesce(gEditIssue.issue_impact.Value, "(none)"), "(none)"),
                                         "Low", 2, "Moderate", 3, "High", 4, "Critical", 5, 1 )
                              OnChange: =Set(gIssImpact, selIssImpact.Selected.Label)
            - gridIss4:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  LayoutGridColumns: =2
                  LayoutGridRows: =10
                  Width: =Parent.Width - 48
                  Height: =120
                Children:
                  - colIssTask:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutGridColumnStart: =1
                        LayoutGridColumnEnd: =1
                        LayoutGridRowStart: =1
                        LayoutGridRowEnd: =10
                        Height: =62
                      Children:
                        - lblIssTaskCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Related task"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        # Opens the shared record picker. Was a search box that filtered a
                        # floating gallery as you typed; the search now lives in the dialog.
                        # Reset() clears the previous field's query and highlight — one
                        # instance serves every lookup on this screen.
                        - btnIssTaskPick:
