# Projects browser: coverage filter + search + two toggles ("only mine", "show
# completed") over a six-column gallery. ONE filter row.
#
# VERTICAL BANDS (768 tall). gTheme.Space: HeaderH 64 · Gutter 24 · Gap 16.
#     0 ..  64   appBar        (declared LAST so the fly-out floats over content)
#    88 .. 148   hdrProjects   = HeaderH + Gutter, height 60
#   164 .. 204   rowFilters    = off hdrProjects,  height 40
#   220 .. 744   galProjects   = absolute 220, fills to the bottom gutter
# The bands above galProjects are RELATIVE. The gallery is an ABSOLUTE 220 and its
# Height subtracts the same number, so those two must be edited together.
# Layout formulas survive a paste and keep recomputing (tests/README.md); what breaks
# the link is DRAGGING a control in Studio. Change geometry here, never with the mouse.
#
# Horizontal placement is auto-layout, not arithmetic: the filter row and each gallery
# row are containers whose children carry NO X, so columns cannot overlap at any width.
Screens:
  scrProjects:
    Properties:
      Fill: =gTheme.Color.Bg
      # project_coverage's values are NOT in the golden source — schema.yaml carries
      # PLACEHOLDERs — so the app binds Choices() and whatever the list holds appears with
      # no app change. "All coverage" is Collected FIRST so it sorts to the top.
      OnVisible: |
        =ClearCollect( colPrjCoverage, { Value: "All coverage" } );
         Collect( colPrjCoverage,
                  ForAll( Choices([@taskmaster_projects].project_coverage) As c,
                          { Value: c.Value } ) );
         // SELF-HEAL, same as scrHome. App.OnStart is NON-BLOCKING, so this screen can run
         // before it finishes and a blank gUserEmail makes the "only mine" branches match nothing.
         If( IsBlank(gUserEmail), Set( gUserEmail, Lower(User().Email) ) )
    Children:
      - hdrProjects:
          Control: CanvasComponent
          ComponentName: cmpSectionHeader
          Properties:
            X: =gTheme.Space.Gutter
            Y: =gTheme.Space.HeaderH + gTheme.Space.Gutter
            Width: =Parent.Width - (gTheme.Space.Gutter * 2)
            Height: =60
            Title: ="Projects"
            Subtitle: ="Browse and open a project"
            ShowAction: =true
            ActionLabel: ="New project"
            # gSelProject is cleared too: the child edit screens pre-attach to it, and a stale
            # selection would parent the next new item to the last project opened.
            OnAction: |
              =Set( gEditMode, "New" );
               Set( gEditProject, Blank() );
               Set( gSelProject, Blank() );
               Navigate( scrProjectEdit, ScreenTransition.Cover )
      # ---- Filter row -------------------------------------------------------
      # ONE auto-layout row; the controls carry no X and the search box takes the slack.
      # WIDTH BUDGET: 240 + 220 + 60 + 170 + 60 + 150 with five 16px gaps = 980 against
      # 1318 usable (1366 - two gutters), so the search box gets 338 and nothing wraps.
      - rowFilters:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =gTheme.Space.Gap
            X: =gTheme.Space.Gutter
            Y: =hdrProjects.Y + hdrProjects.Height + gTheme.Space.Gap
            Width: =Parent.Width - (gTheme.Space.Gutter * 2)
            Height: =40
          Children:
            # FillPortions 0 + LayoutMinWidth on everything except the search box: a child of an
            # auto-layout container is FLEXIBLE by default and its declared Width is only advisory
            # until that is turned off.
            - cboPrjCoverage:
                Control: ModernCombobox@1.1.1
                Properties:
                  Items: =colPrjCoverage
                  ItemDisplayText: =ThisItem.Value
                  DefaultSelectedItems: |
                    =Table( { Value: "All coverage" } )
                  SelectMultiple: =false
                  IsSearchable: =false
                  InputTextPlaceholder: ="Coverage"
                  FillPortions: =0
                  LayoutMinWidth: =240
                  Width: =240
                  Height: =40
            - txtProjSearch:
                Control: ModernTextInput@1.1.1
                Properties:
                  Type: =TextInputType.Search
                  Placeholder: ="Search projects…"
                  TriggerOutput: =TriggerOutput.Delayed
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  FillPortions: =1
                  LayoutMinWidth: =220
                  Height: =40
            # THE "MINE" FILTER, a toggle + label pair rather than a check box: the check-box
            # token is not grounded for this dialect and an unverified control fails the WHOLE
            # screen paste.
            # The person test is `= gUserEmail`. An earlier design used `StartsWith(person.Email,
            # "")` as a match-everything off state and it returned NOTHING for every choice
            # (user, 2026-08-19). Rebuild that trick to save branches and the filter dies with it.
            - tglOnlyMine:
                Control: Classic/Toggle@2.1.0
                Properties:
                  Default: =false
                  FalseText: =""
                  TrueText: =""
                  FillPortions: =0
                  LayoutMinWidth: =60
                  Width: =60
                  Height: =30
            - lblOnlyMine:
                Control: Label@2.5.1
                Properties:
                  Text: ="Only show my projects"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Color: =gTheme.Color.TextPrimary
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinWidth: =170
                  Width: =170
                  Height: =40
            # Same control the two scrTaskEdit section switches already use.
            - tglShowComplete:
                Control: Classic/Toggle@2.1.0
                Properties:
                  Default: =false
                  FalseText: =""
                  TrueText: =""
                  FillPortions: =0
                  LayoutMinWidth: =60
                  Width: =60
                  Height: =30
            - lblShowComplete:
                Control: Label@2.5.1
                Properties:
                  Text: ="Show completed"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Color: =gTheme.Color.TextPrimary
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinWidth: =150
                  Width: =150
                  Height: =40
      # ---- Gallery ----------------------------------------------------------
      # TWO STAGES, AND THE SPLIT IS THE POINT. The inner `If` is EIGHT BRANCHES — show
      # completed × coverage × only mine — each INDEPENDENTLY delegable, with its `Sort`
      # INSIDE it. `Sort(If(...))` would not fold, and a predicate assembled from a variable
      # does not fold either, so every branch WRITES ITS PREDICATES OUT. That duplication is
      # the price of delegation; do not factor it away.
      #
      # The OUTER Filter is the name search and runs LOCALLY on purpose: SharePoint delegates
      # `=`, `StartsWith`, `Filter` and `Sort` on Text and NOTHING else — `Search` and the
      # substring `in` have no row in the connector's table at all. Wrapping the delegated
      # `If` keeps phase, coverage and lead on the server; written as one flat Filter the
      # whole query goes non-delegable.
      # THE CEILING IS THE DATA ROW LIMIT (set it to 2000): the outer pass cannot see a row
      # the inner query did not return, and it fails SILENTLY.
      # The blank test is EXPLICIT, not `"" in project_name` — see the toggle above.
      #
      # EVERY BRANCH CARRIES ITS OWN PHASE PREDICATE, and the "show completed" ones look
      # redundant against ActiveProjects. DO NOT SIMPLIFY THEM AWAY: sorting a bare
      # `Filter(ActiveProjects, StartsWith(...))` returned "the query is not valid" from
      # SharePoint while the identical shape WITH an explicit phase group did not. The
      # phases are ENUMERATED because a Text `<>` does not delegate.
      #
      # `project_coverage` is NOT indexed in the golden source. Equality on it delegates, but
      # SharePoint refuses an unindexed filter past 5,000 items — index it before then.
      # THE COVERAGE TEST IS Coalesce'd: before OnVisible runs, Selected.Value is BLANK,
      # which is not "All coverage", so an un-Coalesced form filtered on a blank value.
      - galProjects:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: |
              =Filter(
                   If( tglShowComplete.Value && tglOnlyMine.Value
                    && Coalesce(cboPrjCoverage.Selected.Value, "All coverage") = "All coverage",
                       Sort( Filter( ActiveProjects,
                                 ( project_phase.Value = "Not Started"
                                || project_phase.Value = "Planning"
                                || project_phase.Value = "Active"
                                || project_phase.Value = "Stalled"
                                || project_phase.Value = "Complete" )
                              && project_manager.Email = gUserEmail ),
                             project_name ),
                       tglShowComplete.Value && tglOnlyMine.Value,
                       Sort( Filter( ActiveProjects,
                                 ( project_phase.Value = "Not Started"
                                || project_phase.Value = "Planning"
                                || project_phase.Value = "Active"
                                || project_phase.Value = "Stalled"
                                || project_phase.Value = "Complete" )
                              && project_coverage.Value = cboPrjCoverage.Selected.Value
                              && project_manager.Email = gUserEmail ),
                             project_name ),
                       tglShowComplete.Value
                    && Coalesce(cboPrjCoverage.Selected.Value, "All coverage")
                         = "All coverage",
                       Sort( Filter( ActiveProjects,
                                 ( project_phase.Value = "Not Started"
                                || project_phase.Value = "Planning"
                                || project_phase.Value = "Active"
                                || project_phase.Value = "Stalled"
                                || project_phase.Value = "Complete" ) ),
                             project_name ),
                       tglShowComplete.Value,
                       Sort( Filter( ActiveProjects,
                                 ( project_phase.Value = "Not Started"
                                || project_phase.Value = "Planning"
                                || project_phase.Value = "Active"
                                || project_phase.Value = "Stalled"
                                || project_phase.Value = "Complete" )
                              && project_coverage.Value = cboPrjCoverage.Selected.Value ),
                             project_name ),
                       tglOnlyMine.Value
                    && Coalesce(cboPrjCoverage.Selected.Value, "All coverage")
                         = "All coverage",
                       Sort( Filter( ActiveProjects,
                                 ( project_phase.Value = "Not Started"
                                || project_phase.Value = "Planning"
                                || project_phase.Value = "Active"
                                || project_phase.Value = "Stalled" )
                              && project_manager.Email = gUserEmail ),
                             project_name ),
                       tglOnlyMine.Value,
                       Sort( Filter( ActiveProjects,
                                 ( project_phase.Value = "Not Started"
                                || project_phase.Value = "Planning"
                                || project_phase.Value = "Active"
                                || project_phase.Value = "Stalled" )
                              && project_coverage.Value = cboPrjCoverage.Selected.Value
                              && project_manager.Email = gUserEmail ),
                             project_name ),
                       Coalesce(cboPrjCoverage.Selected.Value, "All coverage")
                       = "All coverage",
                       Sort( Filter( ActiveProjects,
                                 ( project_phase.Value = "Not Started"
                                || project_phase.Value = "Planning"
                                || project_phase.Value = "Active"
                                || project_phase.Value = "Stalled" ) ),
                             project_name ),
                       Sort( Filter( ActiveProjects,
                                 ( project_phase.Value = "Not Started"
                                || project_phase.Value = "Planning"
                                || project_phase.Value = "Active"
                                || project_phase.Value = "Stalled" )
                              && project_coverage.Value = cboPrjCoverage.Selected.Value ),
                             project_name ) ),
                   Len( Trim(txtProjSearch.Text) ) = 0
                || Trim(txtProjSearch.Text) in project_name )
            # EXPLICIT single column. Left unset, a wrapping gallery divides TemplateWidth
            # between columns and every proportional child inside the row shrinks with it.
            WrapCount: =1
            TemplateSize: =72
            TemplatePadding: =0
            X: =gTheme.Space.Gutter
            Y: =220
            Width: =Parent.Width - (gTheme.Space.Gutter * 2)
            Height: =Parent.Height - 220 - gTheme.Space.Gutter
            TemplateFill: =If(ThisItem.ID = gSelProject.ID, gTheme.Color.Accent, gTheme.Color.Surface)
          Children:
            # ONE auto-layout row per record. The columns carry NO X, so they cannot collide at
            # any TemplateWidth. Every column is FillPortions + LayoutMinWidth: a child of an
            # auto-layout container is FLEXIBLE by default and a fixed Width alone does nothing.
            - rowBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight - 1
                Children:
                  # INLINE SVG, NOT A COMPONENT — a canvas component cannot be placed inside a gallery
                  # template; Studio refuses the paste.
                  # SHAPE CARRIES THE MEANING, colour only reinforces it: empty ring, ring of dots, ring
                  # with a filled core, exclamation disc, tick — all distinguishable in greyscale and to
                  # a red-green colour-blind reader.
                  # EVERY VALUE OF project_phase NEEDS A CASE HERE. A phase added in SharePoint and not
                  # added here renders as "?", which is at least VISIBLE — unlike the same omission in
                  # the Items filter above, where the rows simply do not appear.
                  # HEX TEXT, not gTheme.Color.*: Power Fx has no Color-to-hex conversion.
                  # NO "Archived" CASE — those never reach this gallery, so one landing on "?" is the
                  # right answer: it means something is showing work that should be hidden.
                  - rowStatus:
                      Control: Image@2.2.3
                      Properties:
                        ImagePosition: =ImagePosition.Fit
                        FillPortions: =0
                        LayoutMinWidth: =28
                        Width: =28
                        Height: =28
                        Image: |
                          =With(
                              { g: Switch( Coalesce(ThisItem.project_phase.Value, ""),
                                    "Not Started",
                                        "<circle cx='18' cy='18' r='13' fill='none' stroke='#B9C0C8' stroke-width='2.5'/>",
                                    "Planning",
                                        "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'/>"
                                      & "<circle cx='12.5' cy='18' r='1.7' fill='#6E7882'/>"
                                      & "<circle cx='18'   cy='18' r='1.7' fill='#6E7882'/>"
                                      & "<circle cx='23.5' cy='18' r='1.7' fill='#6E7882'/>",
                                    "Active",
                                        "<circle cx='18' cy='18' r='13' fill='none' stroke='#005A9E' stroke-width='3'/>"
                                      & "<circle cx='18' cy='18' r='7' fill='#005A9E'/>",
                                    "Stalled",
                                        "<circle cx='18' cy='18' r='14.5' fill='#C53A3A'/>"
                                      & "<rect x='16.25' y='10' width='3.5' height='11' rx='1.75' fill='#FFFFFF'/>"
                                      & "<circle cx='18' cy='25' r='2' fill='#FFFFFF'/>",
                                    "Complete",
                                        "<circle cx='18' cy='18' r='14.5' fill='#31825D'/>"
                                      & "<path d='M11 18.5 L16 23.5 L25 13.5' fill='none' stroke='#FFFFFF'"
                                      & " stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/>",
                                        "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'"
                                      & " stroke-dasharray='4 3'/>"
                                      & "<text x='18' y='22.5' text-anchor='middle' font-size='13'"
                                      & " font-family='Segoe UI, sans-serif' fill='#6E7882'>?</text>" ) },
                              "data:image/svg+xml," & EncodeUrl(
                                  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'>" & g & "</svg>" )
                          )
                  # Name over lead, so the two identity fields read as one block. BOTH children are
                  # pinned: unpinned children of a vertical container split the height evenly.
                  - colNameLead:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =2
                        FillPortions: =3
                        LayoutMinWidth: =200
                        Height: =48
                      Children:
                        - rowName:
                            Control: Label@2.5.1
                            Properties:
                              Text: =ThisItem.project_name
                              Font: =gTheme.Font
                              FontWeight: =FontWeight.Semibold
                              Size: =gTheme.Size.H3
                              Color: =gTheme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =26
                              Width: =Parent.Width
                              Height: =26
                        - rowLead:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                =Coalesce(ThisItem.project_manager.DisplayName, "Unassigned")
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =20
                              Width: =Parent.Width
                              Height: =20
                  - rowPriority:
                      Control: Label@2.5.1
                      Properties:
                        Text: =Coalesce(ThisItem.project_priority.Value, "—")
                        Font: =gTheme.Font
                        FontWeight: =FontWeight.Semibold
                        Size: =gTheme.Size.Small
                        # Colour-coded, but the value is also SPELLED OUT — colour alone would carry the
                        # whole meaning for a reader who cannot see it.
                        Color: |
                          =Switch( ThisItem.project_priority.Value,
                                   "Critical", gTheme.Color.Danger,
                                   "High",     gTheme.Color.Warning,
                                   "Moderate", gTheme.Color.Primary,
                                               gTheme.Color.TextMuted )
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =1
                        LayoutMinWidth: =84
                        Height: =20
                  - rowDue:
                      Control: Label@2.5.1
                      Properties:
                        # No target date is "-", not a blank cell: an empty column reads as a rendering
                        # fault, a dash as "nobody set one".
                        Text: |
                          =If( IsBlank(ThisItem.project_date_target), "-",
                               Text(ThisItem.project_date_target, "dd mmm yyyy") & "   ·   " &
                               With( { d: DateDiff(Today(), ThisItem.project_date_target, TimeUnit.Days) },
                                     If( d < 0,  Abs(d) & " days overdue",
                                         d = 0,  "due today",
                                         d = 1,  "1 day left",
                                                 d & " days left" ) ) )
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        # Only overdue on work that is still open — a completed project past its target
                        # is history, not a problem to flag.
                        Color: |
                          =If( !IsBlank(ThisItem.project_date_target)
                            && ThisItem.project_date_target < Today()
                            && ThisItem.project_phase.Value <> "Complete",
                               gTheme.Color.Danger, gTheme.Color.TextMuted )
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =2
                        LayoutMinWidth: =190
                        Height: =20
                  - rowPercent:
                      Control: Label@2.5.1
                      Properties:
                        Text: =Coalesce(ThisItem.project_perc_completion, 0) & "% complete"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        Align: =Align.Right
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =1
                        LayoutMinWidth: =104
                        Height: =20
            # Absolute siblings of the row container, not children: both must span the whole
            # template, and the hit button must be LAST so it is on top.
            - rowLine:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =gTheme.Color.Border
                  X: =0
                  Y: =Parent.TemplateHeight - 1
                  Width: =Parent.TemplateWidth
                  Height: =1
            - galProjectsHit:
                Control: Classic/Button@2.2.0
                Properties:
                  # The row's action lives HERE, not on the gallery's OnSelect — a gallery's own
                  # OnSelect does not reliably fire when the click lands on a child control.
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =gTheme.Color.Hover
                  PressedFill: =gTheme.Color.Press
                  BorderThickness: =0
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  OnSelect: |
                    =Select(Parent);
                     Set(gSelProject, ThisItem); Navigate(scrProject, ScreenTransition.Cover)
      - ProjectsEmptyLabel:
          Control: Label@2.5.1
          Properties:
            Text: |
              =If( tglOnlyMine.Value,
                   "No projects here are led by you. "
                     & "Turn off Only show my projects to see the rest.",
                   Len(Trim(txtProjSearch.Text)) > 0,
                   "No project name contains """ & Trim(txtProjSearch.Text) & """.",
                   !tglShowComplete.Value,
                   "Nothing open here. Turn on Show completed to include finished projects.",
                   "No projects match this coverage." )
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            Color: =gTheme.Color.TextMuted
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            Visible: =IsEmpty(galProjects.AllItems)
            X: =galProjects.X
            Y: =galProjects.Y
            Width: =galProjects.Width
            Height: =galProjects.Height
      # ---- The whole shell is one component: header bar + fly-out nav rail ----
      # DECLARED LAST so positional z-order floats the fly-out over the content. Height is
      # dynamic and that is the trick: a component intercepts every click inside its bounds,
      # so closed it must own nothing but the 64px header strip. cmpAppBar cannot Navigate
      # (a component can't see app screens), so this screen does the navigating.
      - appBar:
          Control: CanvasComponent
          ComponentName: cmpAppBar
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =If(gNavOpen, Parent.Height, gTheme.Space.HeaderH)
            Items: =gNavMenu
            ActiveKey: =3
            AppTitle: ="EQD Taskmaster"
            ScreenTitle: ="Projects"
            IsOpen: =gNavOpen
            OnToggle: =Set(gNavOpen, !gNavOpen)
            OnNavigate: |
              =Switch( appBar.SelectedKey,
                       1, Navigate(scrHome, ScreenTransition.Fade),
                       2, Navigate(scrReports, ScreenTransition.Fade),
                       3, Navigate(scrProjects, ScreenTransition.Fade),
                          Navigate(scrReference, ScreenTransition.Fade) );
              Set(gNavOpen, false)
