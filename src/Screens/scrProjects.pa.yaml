            # EXPLICIT single column. Left unset, a wrapping gallery divides TemplateWidth
            # between columns and every proportional child inside the row shrinks with it.
            WrapCount: =1
            TemplateSize: =72
            TemplatePadding: =0
            X: =gTheme.Space.Gutter
            Y: =272
            Width: =Parent.Width - (gTheme.Space.Gutter * 2)
            Height: =Parent.Height - 272 - gTheme.Space.Gutter
            TemplateFill: =If(ThisItem.ID = gSelProject.ID, gTheme.Color.Accent, gTheme.Color.Surface)
          Children:
            # ONE auto-layout row per record. The columns carry NO X, so they cannot collide at
            # any TemplateWidth. Every column is FillPortions + LayoutMinWidth: a child of an
            # auto-layout container is FLEXIBLE by default and a fixed Width alone does nothing.
            # THIS BUDGET IS MIRRORED IN rowTableHead. Every FillPortions and LayoutMinWidth
            # below has a twin up there, and the headings sit over the wrong columns the
            # moment one side changes alone.
            - rowBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight - 1
                Children:
                  # INLINE SVG, NOT A COMPONENT — a canvas component cannot be placed inside a gallery
                  # template; Studio refuses the paste.
                  # SHAPE CARRIES THE MEANING, colour only reinforces it: empty ring, ring of dots, ring
                  # with a filled core, exclamation disc, tick — all distinguishable in greyscale and to
                  # a red-green colour-blind reader.
                  # EVERY VALUE OF project_phase NEEDS A CASE HERE. A phase added in SharePoint and not
                  # added here renders as "?", which is at least VISIBLE — unlike the same omission in
                  # the Items filter above, where the rows simply do not appear.
                  # HEX TEXT, not gTheme.Color.*: Power Fx has no Color-to-hex conversion.
                  # NO "Archived" CASE — those never reach this gallery, so one landing on "?" is the
                  # right answer: it means something is showing work that should be hidden.
                  - rowStatus:
                      Control: Image@2.2.3
                      Properties:
                        ImagePosition: =ImagePosition.Fit
                        FillPortions: =0
                        LayoutMinWidth: =28
                        Width: =28
                        Height: =28
                        Image: |
                          =With(
                              { g: Switch( Coalesce(ThisItem.project_phase.Value, ""),
                                    "Not Started",
                                        "<circle cx='18' cy='18' r='13' fill='none' stroke='#B9C0C8' stroke-width='2.5'/>",
                                    "Planning",
                                        "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'/>"
                                      & "<circle cx='12.5' cy='18' r='1.7' fill='#6E7882'/>"
                                      & "<circle cx='18'   cy='18' r='1.7' fill='#6E7882'/>"
                                      & "<circle cx='23.5' cy='18' r='1.7' fill='#6E7882'/>",
                                    "Active",
                                        "<circle cx='18' cy='18' r='13' fill='none' stroke='#005A9E' stroke-width='3'/>"
                                      & "<circle cx='18' cy='18' r='7' fill='#005A9E'/>",
                                    "Stalled",
                                        "<circle cx='18' cy='18' r='14.5' fill='#C53A3A'/>"
                                      & "<rect x='16.25' y='10' width='3.5' height='11' rx='1.75' fill='#FFFFFF'/>"
                                      & "<circle cx='18' cy='25' r='2' fill='#FFFFFF'/>",
                                    "Complete",
                                        "<circle cx='18' cy='18' r='14.5' fill='#31825D'/>"
                                      & "<path d='M11 18.5 L16 23.5 L25 13.5' fill='none' stroke='#FFFFFF'"
                                      & " stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/>",
                                        "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'"
                                      & " stroke-dasharray='4 3'/>"
                                      & "<text x='18' y='22.5' text-anchor='middle' font-size='13'"
                                      & " font-family='Segoe UI, sans-serif' fill='#6E7882'>?</text>" ) },
                              "data:image/svg+xml," & EncodeUrl(
                                  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'>" & g & "</svg>" )
                          )
                  # Name over lead, so the two identity fields read as one block. BOTH children are
                  # pinned: unpinned children of a vertical container split the height evenly.
                  - colNameLead:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =2
                        FillPortions: =3
                        LayoutMinWidth: =200
                        Height: =48
                      Children:
                        - rowName:
                            Control: Label@2.5.1
                            Properties:
                              Text: =ThisItem.project_name
                              Font: =gTheme.Font
                              FontWeight: =FontWeight.Semibold
                              Size: =gTheme.Size.H3
                              Color: =gTheme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =26
                              Width: =Parent.Width
                              Height: =26
                        - rowLead:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                =Coalesce(ThisItem.project_manager.DisplayName, "Unassigned")
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =20
                              Width: =Parent.Width
                              Height: =20
                  # COVERAGE. Filtered from its own heading, never sorted from it:
                  # project_coverage is a Choice and SharePoint does not fold a sort on a
                  # Complex column. Existing rows may hold BLANK — the column was made
                  # required after they were written and nothing back-fills — so the dash
                  # is a real state here, not a placeholder.
                  - rowCoverage:
                      Control: Label@2.5.1
                      Properties:
                        Text: =Coalesce(ThisItem.project_coverage.Value, "—")
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =1
                        LayoutMinWidth: =120
                        Height: =20
                  - rowPriority:
                      Control: Label@2.5.1
                      Properties:
                        Text: =Coalesce(ThisItem.project_priority.Value, "—")
                        Font: =gTheme.Font
                        FontWeight: =FontWeight.Semibold
                        Size: =gTheme.Size.Small
                        # Colour-coded, but the value is also SPELLED OUT — colour alone would carry the
                        # whole meaning for a reader who cannot see it.
                        Color: |
                          =Switch( ThisItem.project_priority.Value,
                                   "Critical", gTheme.Color.Danger,
                                   "High",     gTheme.Color.Warning,
                                   "Moderate", gTheme.Color.Primary,
                                               gTheme.Color.TextMuted )
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =1
                        LayoutMinWidth: =84
                        Height: =20
                  # DUE DATE + PERCENT, AND THE BANNER THAT REPLACES THEM.
                  # A project at 100% that nobody has moved to the Complete phase is the one
                  # state this list exists to catch, so it takes the whole right-hand half of
                  # the row rather than another small grey column.
                  # THE BANNER IS A SIBLING, NOT AN OVERLAY, AND THAT IS WHY IT NEEDS NO
                  # GEOMETRY. An auto-layout child carries no X to position anything against,
                  # and A HIDDEN CHILD TAKES NO SPACE — so hiding this container hands its
                  # exact slot to the banner declared after it (the same swap cmpLookupField
                  # makes between its pick button and its chip). Nothing is layered, nothing
                  # is measured, and the two states cannot drift apart at any width.
                  # THE TWO `Visible` FORMULAS ARE EXACT NEGATIONS. Edit one and edit the
                  # other, or a row shows both or neither.
                  - colDuePct:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =16
                        # `<> "Complete"` is a LOCAL test on a row already fetched, NOT a
                        # predicate inside the gallery's Filter — the delegation rule against
                        # a Text `<>` above does not reach here.
                        Visible: |
                          =Not( Coalesce(ThisItem.project_perc_completion, 0) >= 100
                             && Coalesce(ThisItem.project_phase.Value, "") <> "Complete" )
                        # 3 portions and a 310 floor carry the pair's old 2 + 1 and
                        # 190 + 16 + 104 across. One container in place of two children also
                        # removes one of the row's gaps and moves the 16px it held INSIDE this
                        # container, so every column shifts by up to ~7px at the design width.
                        # That is the whole cost of the nesting.
                        FillPortions: =3
                        LayoutMinWidth: =310
                        Height: =20
                      Children:
                        - rowDue:
                            Control: Label@2.5.1
                            Properties:
                              # No target date is "-", not a blank cell: an empty column reads as a rendering
                              # fault, a dash as "nobody set one".
                              Text: |
                                =If( IsBlank(ThisItem.project_date_target), "-",
                                     Text(ThisItem.project_date_target, "dd mmm yyyy") & "   ·   " &
                                     With( { d: DateDiff(Today(), ThisItem.project_date_target, TimeUnit.Days) },
                                           If( d < 0,  Abs(d) & " days overdue",
                                               d = 0,  "due today",
                                               d = 1,  "1 day left",
                                                       d & " days left" ) ) )
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              # Only overdue on work that is still open — a completed project past its target
                              # is history, not a problem to flag.
                              Color: |
                                =If( !IsBlank(ThisItem.project_date_target)
                                  && ThisItem.project_date_target < Today()
                                  && ThisItem.project_phase.Value <> "Complete",
                                     gTheme.Color.Danger, gTheme.Color.TextMuted )
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =2
                              LayoutMinWidth: =190
                              Height: =20
                        - rowPercent:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Coalesce(ThisItem.project_perc_completion, 0) & "% complete"
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              Align: =Align.Right
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =1
                              LayoutMinWidth: =104
                              Height: =20
                  # Already at 100% and still not marked Complete. NO `OnSelect`: galProjectsHit
                  # spans the whole template and is declared last, so a click here opens the
                  # project exactly like a click anywhere else on the row. Giving this label its
                  # own OnSelect would not fire — the button is on top of it.
                  # A CONTAINER PAINTS THE BOX AND A LABEL SITS IN IT, rather than one Label
                  # carrying a Fill. No label anywhere in this app sets Fill, so a coloured
                  # Label is an unverified token — and an unverified token fails the WHOLE
                  # screen paste, not just itself. A filled GroupContainer wrapping a
                  # transparent Label is the shape already landed as cmpLookupField's chip.
                  - rowReadyBanner:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Visible: |
                          =Coalesce(ThisItem.project_perc_completion, 0) >= 100
                           && Coalesce(ThisItem.project_phase.Value, "") <> "Complete"
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =0
                        Fill: =gTheme.Color.Success
                        # Same slot as colDuePct, taller than the 20px text rows it replaces so
                        # it reads as a block rather than another line of the row.
                        FillPortions: =3
                        LayoutMinWidth: =310
                        Height: =40
                      Children:
                        - rowReadyText:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Ready To Mark Complete"
                              Font: =gTheme.Font
                              FontWeight: =FontWeight.Semibold
                              Size: =gTheme.Size.Body
                              Color: =gTheme.Color.OnPrimary
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              # Floor stays well under the container's 310 so the text can never
                              # push the banner wider than the slot it is filling.
                              FillPortions: =1
                              LayoutMinWidth: =120
                              Height: =40
            # Absolute siblings of the row container, not children: both must span the whole
            # template, and the hit button must be LAST so it is on top.
            - rowLine:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =gTheme.Color.Border
                  X: =0
                  Y: =Parent.TemplateHeight - 1
                  Width: =Parent.TemplateWidth
                  Height: =1
            - galProjectsHit:
                Control: Classic/Button@2.2.0
                Properties:
                  # The row's action lives HERE, not on the gallery's OnSelect — a gallery's own
                  # OnSelect does not reliably fire when the click lands on a child control.
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =gTheme.Color.Hover
                  PressedFill: =gTheme.Color.Press
                  BorderThickness: =0
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  OnSelect: |
                    =Select(Parent);
                     Set(gSelProject, ThisItem); Navigate(scrProject, ScreenTransition.Cover)
      - ProjectsEmptyLabel:
          Control: Label@2.5.1
          Properties:
            # ORDER IS THE WHOLE POINT OF THIS LADDER. Test the NARROWEST condition first:
            # two toggles can empty the gallery at once, and naming only one of them sends
            # the reader to the wrong control. `tglOnlyMine` was tested first here and the
            # combined case never reached its own arm, so "all of mine are complete" read as
            # "none are led by you" — a sentence about a filter that was not the cause.
            Text: |
              =If( Len(Trim(txtProjSearch.Text)) > 0,
                   "No project name starts with """ & Trim(txtProjSearch.Text) & """.",
                   tglOnlyMine.Value && !tglShowComplete.Value,
                   "None of your projects are still open. Turn on Show completed to include "
                     & "finished ones, or turn off Only show my projects.",
                   tglOnlyMine.Value,
                   "You do not manage or support any projects here.",
                   !tglShowComplete.Value,
                   "Nothing open here. Turn on Show completed to include finished projects.",
                   "No projects match this coverage." )
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            Color: =gTheme.Color.TextMuted
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            Visible: =IsEmpty(galProjects.AllItems)
            X: =galProjects.X
            Y: =galProjects.Y
            Width: =galProjects.Width
            Height: =galProjects.Height
      # ---- The whole shell is one component: header bar + fly-out nav rail ----
      # DECLARED LAST so positional z-order floats the fly-out over the content. Height is
      # dynamic and that is the trick: a component intercepts every click inside its bounds,
      # so closed it must own nothing but the 64px header strip. cmpAppBar cannot Navigate
      # (a component can't see app screens), so this screen does the navigating.
      - appBar:
          Control: CanvasComponent
          ComponentName: cmpAppBar
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =If(gNavOpen, Parent.Height, gTheme.Space.HeaderH)
            Items: =gNavMenu
            ActiveKey: =3
            AppTitle: ="EQD Taskmaster"
            ScreenTitle: ="Projects"
            IsOpen: =gNavOpen
            OnToggle: =Set(gNavOpen, !gNavOpen)
            OnNavigate: |
              =Switch( appBar.SelectedKey,
                       1, Navigate(scrHome, ScreenTransition.Fade),
                       2, Navigate(scrReports, ScreenTransition.Fade),
                       3, Navigate(scrProjects, ScreenTransition.Fade),
                          Navigate(scrReference, ScreenTransition.Fade) );
              Set(gNavOpen, false)
