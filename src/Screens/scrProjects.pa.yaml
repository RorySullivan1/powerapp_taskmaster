# Projects browser: a TABLE. Search + two toggles ("only mine", "show completed")
# above a sortable column header, over a five-column gallery.
#
# THE HEADER ROW AND THE GALLERY ROW ARE ONE COLUMN BUDGET IN TWO PLACES. Same
# order, same FillPortions, same LayoutMinWidth, same 16px gap and padding, or the
# headings stop sitting over their columns. Change one and change the other:
#     status 0/28 · name 3/200 · coverage 1/120 · priority 1/84 · due+pct 3/310
# The due+pct slot is a nested container in BOTH, splitting 2/190 + 1/104.
# The header takes its WIDTH from galProjects.TemplateWidth rather than computing
# one, so the two containers are the same width whatever the scrollbar costs.
#
# VERTICAL BANDS (768 tall). gTheme.Space: HeaderH 64 · Gutter 24 · Gap 16.
#     0 ..  64   appBar        (declared LAST so the fly-out floats over content)
#    88 .. 148   hdrProjects   = HeaderH + Gutter, height 60
#   164 .. 204   rowFilters    = off hdrProjects,  height 40
#   220 .. 268   rowTableHead  = absolute 220, height 48
#   272 .. 744   galProjects   = absolute 272, fills to the bottom gutter
# The bands above rowTableHead are RELATIVE. The header and the gallery are
# ABSOLUTE, and the gallery Height subtracts its own Y, so those must be edited
# together.
# Layout formulas survive a paste and keep recomputing (tests/README.md); what breaks
# the link is DRAGGING a control in Studio. Change geometry here, never with the mouse.
#
# Horizontal placement is auto-layout, not arithmetic: the filter row and each gallery
# row are containers whose children carry NO X, so columns cannot overlap at any width.
# It is also what lets a row at 100% swap its due-date/percent pair for the green
# "Ready To Mark Complete" banner: hidden children take no space, so the banner
# inherits their slot without a single coordinate. See the comments on colDuePct.
Screens:
  scrProjects:
    Properties:
      Fill: =gTheme.Color.Bg
      # project_coverage's values are NOT in the golden source — schema.yaml carries
      # PLACEHOLDERs — so the app binds Choices() and whatever the list holds appears with
      # no app change. "All coverage" is Collected FIRST so it sorts to the top.
      OnVisible: |
        =ClearCollect( colPrjCoverage, { Value: "All coverage" } );
         Collect( colPrjCoverage,
                  ForAll( Choices([@taskmaster_projects].project_coverage) As c,
                          { Value: c.Value } ) );
         // SELF-HEAL, same as scrHome. App.OnStart is NON-BLOCKING, so this screen can run
         // before it finishes and a blank gUserEmail makes the "only mine" branches match nothing.
         If( IsBlank(gUserEmail), Set( gUserEmail, Lower(User().Email) ) );
         // SORT STATE. gPrjSortCol is a KEY the gallery's Switch compares with `=`, NOT a
         // column name — see the comment above the gallery's query. gPrjSortOrd holds a SortOrder
         // VALUE rather than a boolean so every branch can pass it straight to Sort. Both must
         // be set before the gallery first evaluates, or the Switch falls to its default arm
         // on load and the heading arrows disagree with the order on screen.
         Set( gPrjSortCol, "project_name" );
         Set( gPrjSortOrd, SortOrder.Ascending )
    Children:
      - hdrProjects:
          Control: CanvasComponent
          ComponentName: cmpSectionHeader
          Properties:
            X: =gTheme.Space.Gutter
            Y: =gTheme.Space.HeaderH + gTheme.Space.Gutter
            Width: =Parent.Width - (gTheme.Space.Gutter * 2)
            Height: =60
            Title: ="Projects"
            Subtitle: ="Browse and open a project"
            ShowAction: =true
            ActionLabel: ="New project"
            # gSelProject is cleared too: the child edit screens pre-attach to it, and a stale
            # selection would parent the next new item to the last project opened.
            OnAction: |
              =Set( gEditMode, "New" );
               Set( gEditProject, Blank() );
               Set( gSelProject, Blank() );
               Navigate( scrProjectEdit, ScreenTransition.Cover )
      # ---- Filter row -------------------------------------------------------
      # ONE auto-layout row; the controls carry no X and the search box takes the slack.
      # THE COVERAGE FILTER IS NOT HERE — it lives in its own column heading, so the
      # control that filters a column sits over that column. It is still named
      # cboPrjCoverage and the gallery's sixteen branches still read it.
      # WIDTH BUDGET: 360 + 60 + 170 + 60 + 150 with five 16px gaps = 880 against 1318
      # usable (1366 - two gutters). THE SEARCH BOX IS PINNED AND A SPACER TAKES THE
      # SLACK: with the coverage combo box gone it was the only flexible child left and
      # stretched to 814px, which reads as a mistake rather than a search field.
      - rowFilters:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =gTheme.Space.Gap
            X: =gTheme.Space.Gutter
            Y: =hdrProjects.Y + hdrProjects.Height + gTheme.Space.Gap
            Width: =Parent.Width - (gTheme.Space.Gutter * 2)
            Height: =40
          Children:
            # FillPortions 0 + LayoutMinWidth on everything except the search box: a child of an
            # auto-layout container is FLEXIBLE by default and its declared Width is only advisory
            # until that is turned off.
            - txtProjSearch:
                Control: ModernTextInput@1.1.1
                Properties:
                  Type: =TextInputType.Search
                  Placeholder: ="Search projects…"
                  TriggerOutput: =TriggerOutput.Delayed
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  FillPortions: =0
                  LayoutMinWidth: =360
                  Width: =360
                  Height: =40
            # THE "MINE" FILTER, a toggle + label pair rather than a check box: the check-box
            # token is not grounded for this dialect and an unverified control fails the WHOLE
            # screen paste.
            # The person test is `= gUserEmail`. An earlier design used `StartsWith(person.Email,
            # "")` as a match-everything off state and it returned NOTHING for every choice
            # (user, 2026-08-19). Rebuild that trick to save branches and the filter dies with it.
            - tglOnlyMine:
                Control: Classic/Toggle@2.1.0
                Properties:
                  Default: =false
                  FalseText: =""
                  TrueText: =""
                  FillPortions: =0
                  LayoutMinWidth: =60
                  Width: =60
                  Height: =30
            - lblOnlyMine:
                Control: Label@2.5.1
                Properties:
                  Text: ="Only show my projects"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Color: =gTheme.Color.TextPrimary
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinWidth: =170
                  Width: =170
                  Height: =40
            # Same control the two scrTaskEdit section switches already use.
            - tglShowComplete:
                Control: Classic/Toggle@2.1.0
                Properties:
                  Default: =false
                  FalseText: =""
                  TrueText: =""
                  FillPortions: =0
                  LayoutMinWidth: =60
                  Width: =60
                  Height: =30
            - lblShowComplete:
                Control: Label@2.5.1
                Properties:
                  Text: ="Show completed"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Color: =gTheme.Color.TextPrimary
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinWidth: =150
                  Width: =150
                  Height: =40
            # Takes the leftover width so nothing else has to. The ONLY flexible child
            # in this row — remove it and whatever is left flexible stretches instead.
            - filterSpacer:
                Control: Label@2.5.1
                Properties:
                  Text: =""
                  FillPortions: =1
                  Height: =40
      # ---- Table header -----------------------------------------------------
      # THE COLUMN BUDGET IS DUPLICATED FROM rowBody ON PURPOSE and must be kept in
      # step with it — see the banner. A heading is not a child of the gallery, so
      # nothing in Power Fx can hold the two in step for us.
      #
      # WIDTH IS READ OFF THE GALLERY, NOT COMPUTED. `galProjects.TemplateWidth` is
      # the exact width rowBody is given, so the heading row and the row template
      # are the same width by construction and the columns cannot drift apart.
      # AN EARLIER VERSION GUESSED — same Width as the gallery, PaddingRight 32
      # against the row's 16, on the assumption that the scrollbar ate 16px off
      # TemplateWidth. The headings landed misaligned. Whatever the scrollbar
      # actually costs is now the gallery's business, not this container's.
      # The forward reference is fine: layout formulas survive a paste and keep
      # recomputing, including references to a control declared LATER
      # (tests/README.md, scrProbe-layout-freeze P3).
      #
      # ONLY THREE HEADINGS SORT, AND THAT IS THE DELEGATION RULE, not a design
      # choice: SharePoint folds Sort on Text, Number, Boolean and DateTime and NOT
      # on Complex. Priority, Coverage, Phase and Lead are Choice or Person columns,
      # so a sort on them would quietly reorder only the rows already fetched and
      # leave the rest of the list in its old order.
      # EACH BUTTON WRITES A KEY, NOT A COLUMN NAME. The gallery's Switch compares
      # these strings with `=` and sorts on a literal identifier in each arm; nothing
      # here reaches SharePoint as a column name.
      - rowTableHead:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =16
            PaddingLeft: =16
            PaddingRight: =16
            Fill: =gTheme.Color.Surface
            X: =gTheme.Space.Gutter
            Y: =220
            Width: =galProjects.TemplateWidth
            Height: =48
          Children:
            # Holds the status glyph's slot open. Empty on purpose: the glyph column
            # has no heading and no sort, and a spacer is what keeps the four real
            # headings aligned with their columns.
            - hdStatus:
                Control: Label@2.5.1
                Properties:
                  Text: =""
                  FillPortions: =0
                  LayoutMinWidth: =28
                  Width: =28
                  Height: =40
            - hdName:
                Control: Classic/Button@2.2.0
                Properties:
                  # THE SORT TOGGLE, and the order of the two Sets is load-bearing: the
                  # direction is decided against the column we are moving AWAY from, so
                  # gPrjSortOrd must be written before gPrjSortCol. Clicking the column
                  # already sorted ascending flips it; clicking any other column starts
                  # that column ascending.
                  Text: |
                    ="Project" &
                     If( gPrjSortCol = "project_name",
                         If( gPrjSortOrd = SortOrder.Descending, "  ▼", "  ▲" ), "" )
                  OnSelect: |
                    =Set( gPrjSortOrd,
                          If( gPrjSortCol = "project_name"
                           && gPrjSortOrd = SortOrder.Ascending,
                              SortOrder.Descending, SortOrder.Ascending ) );
                     Set( gPrjSortCol, "project_name" )
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  FontWeight: =FontWeight.Semibold
                  Color: |
                    =If( gPrjSortCol = "project_name",
                         gTheme.Color.Primary, gTheme.Color.TextMuted )
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =gTheme.Color.Hover
                  PressedFill: =gTheme.Color.Press
                  BorderThickness: =0
                  # Align + PaddingLeft on a classic Button are documented (MS Learn,
                  # control-button "Additional properties" and properties-text "Text
                  # placement", which names Button). Without them the heading centres
                  # itself over a left-aligned column.
                  Align: =Align.Left
                  PaddingLeft: =0
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =3
                  LayoutMinWidth: =200
                  Height: =40
            # THE COVERAGE FILTER, moved out of the filter row into its own heading.
            # Same control name the gallery's sixteen branches read, so the query is
            # untouched by the move. Its "All coverage" sentinel is Collected FIRST in
            # OnVisible and the branches Coalesce to it, because before OnVisible runs
            # Selected.Value is BLANK — which is not "All coverage", and an
            # un-Coalesced test would filter on a blank value and empty the gallery.
            - cboPrjCoverage:
                Control: ModernCombobox@1.1.1
                Properties:
                  Items: =colPrjCoverage
                  ItemDisplayText: =ThisItem.Value
                  DefaultSelectedItems: |
                    =Table( { Value: "All coverage" } )
                  SelectMultiple: =false
                  IsSearchable: =false
                  InputTextPlaceholder: ="Coverage"
                  FillPortions: =1
                  LayoutMinWidth: =120
                  Height: =40
            - hdPriority:
                Control: Label@2.5.1
                Properties:
                  # NOT a button: project_priority is a Choice, and a sort on it would
                  # not fold. See the block comment above.
                  Text: ="Priority"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Small
                  FontWeight: =FontWeight.Semibold
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =1
                  LayoutMinWidth: =84
                  Height: =40
            # Mirrors colDuePct: one slot of 3/310 split 2/190 + 1/104 with the same
            # 16px gap, so both headings land over their own halves of the row.
            - hdDuePct:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =16
                  FillPortions: =3
                  LayoutMinWidth: =310
                  Height: =40
                Children:
                  - hdTarget:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: |
                          ="Target" &
                           If( gPrjSortCol = "project_date_target",
                               If( gPrjSortOrd = SortOrder.Descending, "  ▼", "  ▲" ), "" )
                        OnSelect: |
                          =Set( gPrjSortOrd,
                                If( gPrjSortCol = "project_date_target"
                                 && gPrjSortOrd = SortOrder.Ascending,
                                    SortOrder.Descending, SortOrder.Ascending ) );
                           Set( gPrjSortCol, "project_date_target" )
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        FontWeight: =FontWeight.Semibold
                        Color: |
                          =If( gPrjSortCol = "project_date_target",
                               gTheme.Color.Primary, gTheme.Color.TextMuted )
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =gTheme.Color.Hover
                        PressedFill: =gTheme.Color.Press
                        BorderThickness: =0
                        Align: =Align.Left
                        PaddingLeft: =0
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =2
                        LayoutMinWidth: =190
                        Height: =40
                  - hdPct:
                      Control: Classic/Button@2.2.0
                      Properties:
                        # Right-aligned, because rowPercent is. The arrow trails the
                        # word on every heading, so it sits INSIDE the right edge here.
                        Text: |
                          ="% complete" &
                           If( gPrjSortCol = "project_perc_completion",
                               If( gPrjSortOrd = SortOrder.Descending, "  ▼", "  ▲" ), "" )
                        OnSelect: |
                          =Set( gPrjSortOrd,
                                If( gPrjSortCol = "project_perc_completion"
                                 && gPrjSortOrd = SortOrder.Ascending,
                                    SortOrder.Descending, SortOrder.Ascending ) );
                           Set( gPrjSortCol, "project_perc_completion" )
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        FontWeight: =FontWeight.Semibold
                        Color: |
                          =If( gPrjSortCol = "project_perc_completion",
                               gTheme.Color.Primary, gTheme.Color.TextMuted )
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =gTheme.Color.Hover
                        PressedFill: =gTheme.Color.Press
                        BorderThickness: =0
                        Align: =Align.Right
                        PaddingRight: =0
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =1
                        LayoutMinWidth: =104
                        Height: =40
      # ---- Gallery ----------------------------------------------------------
      # FORTY-EIGHT BRANCHES: the sixteen filter branches, written out once per SORT COLUMN.
      # THE COLUMN NAME MUST BE AN IDENTIFIER, NOT A STRING, and that is what costs the 3x.
      # `SortByColumns(src, gPrjSortCol, ...)` is one line per branch and was tried first; it
      # fails, because a string column name is matched against the SharePoint INTERNAL name and
      # `project_name` is not one — that column is the built-in Title, renamed. Every other
      # formula in this app names columns as Power Fx IDENTIFIERS, which resolve by DISPLAY
      # name, so the mismatch appears nowhere else. Passing internal names instead would work
      # and is rejected: it would put a second, invisible naming scheme into the one formula
      # that cannot be checked against schema/schema.yaml.
      # SO gPrjSortCol IS A KEY, NOT A COLUMN NAME. It is only ever compared with `=` in this
      # Switch, and each arm sorts on a literal identifier — the same delegable shape the
      # screen already shipped sixteen times. Its values happen to read like column names for
      # legibility; nothing sends them to SharePoint.
      # `Sort(If(...))` and a Sort key built from an expression do NOT fold, so the Switch has
      # to be OUTSIDE and the filters duplicated. Do not factor this back down.
      #
      # ONE DELEGABLE QUERY, NO LOCAL PASS — and SIXTEEN BRANCHES per arm, which is the honest
      # price of that. Four binary filters (search × show completed × coverage × only mine), each
      # branch INDEPENDENTLY delegable with its `Sort` INSIDE it. `Sort(If(...))` would not
      # fold, and a predicate assembled from a variable does not fold either, so every branch
      # WRITES ITS PREDICATES OUT. The duplication is the mechanism; do not factor it away.
      #
      # THE NAME SEARCH IS A PREFIX MATCH, AND THAT IS THE WHOLE REASON IT IS SERVER-SIDE.
      # SharePoint delegates `=`, `StartsWith`, `Filter` and `Sort` on Text and NOTHING else —
      # `Search` and the substring `in` have no row in the connector's table at all. A
      # substring search therefore runs over whatever page the query returned and CANNOT SEE
      # a row past the data row limit, failing silently. Typing a word from the MIDDLE of a
      # name finds nothing now: that is the accepted trade, not a defect.
      #
      # THE EMPTY-SEARCH CASE IS ITS OWN BRANCH, NOT `StartsWith(col, "")`. That trick reads
      # as obviously true and would HALVE this formula. It is banned because it DOES NOT RUN:
      # `StartsWith(project_name, "")` is rejected outright — "the query is not valid" — on a
      # plain indexed Text column, so the "off" state would take the whole gallery down rather
      # than match everything. A non-empty argument on the same column is fine, and so is one
      # on a Person subfield. THE EMPTY ARGUMENT IS THE WHOLE FAULT. An "off" state is a BRANCH.
      #
      # The phase vocabulary lives in ActiveProjects and OpenProjects, NOT inline here. Both
      # are named formulas so the filter still folds into one server query, and both enumerate
      # their phases because a Text `<>` does not delegate — keep them in step with
      # project_phase's values in schema/schema.yaml or a new phase vanishes from the app.
      # "MINE" IS MANAGER OR SUPPORTER, not manager alone — schema decision C2. Both columns
      # are indexed, which is what keeps the Or-arm delegable; `project_requestor` is NOT
      # indexed and MUST NOT join it, because one unindexed arm drops delegation for the whole
      # filter and truncates in silence.
      #
      # `project_coverage` is NOT indexed in the golden source. Equality on it delegates, but
      # SharePoint refuses an unindexed filter past 5,000 items — index it before then.
      # THE COVERAGE TEST IS Coalesce'd: before OnVisible runs, Selected.Value is BLANK,
      # which is not "All coverage", so an un-Coalesced form filtered on a blank value.
      - galProjects:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: |
              =Switch( gPrjSortCol,
                   "project_date_target",
                   If( Len( Trim(txtProjSearch.Text) ) = 0,
                       If( tglShowComplete.Value && tglOnlyMine.Value
                        && Coalesce(cboPrjCoverage.Selected.Value, "All coverage") = "All coverage",
                           Sort(
                               Filter( ActiveProjects,
                                       ( project_manager.Email = gUserEmail
                                     || project_supporter.Email = gUserEmail ) ),
                               project_date_target, gPrjSortOrd ),
                           tglShowComplete.Value && tglOnlyMine.Value,
                           Sort(
                               Filter( ActiveProjects,
                                       project_coverage.Value = cboPrjCoverage.Selected.Value
                                    && ( project_manager.Email = gUserEmail
                                     || project_supporter.Email = gUserEmail ) ),
                               project_date_target, gPrjSortOrd ),
                           tglShowComplete.Value
                        && Coalesce(cboPrjCoverage.Selected.Value, "All coverage") = "All coverage",
                           Sort( ActiveProjects, project_date_target, gPrjSortOrd ),
                           tglShowComplete.Value,
                           Sort(
                               Filter( ActiveProjects,
                                       project_coverage.Value = cboPrjCoverage.Selected.Value ),
                               project_date_target, gPrjSortOrd ),
                           tglOnlyMine.Value
                        && Coalesce(cboPrjCoverage.Selected.Value, "All coverage") = "All coverage",
                           Sort(
                               Filter( OpenProjects,
                                       ( project_manager.Email = gUserEmail
                                     || project_supporter.Email = gUserEmail ) ),
                               project_date_target, gPrjSortOrd ),
                           tglOnlyMine.Value,
                           Sort(
                               Filter( OpenProjects,
                                       project_coverage.Value = cboPrjCoverage.Selected.Value
                                    && ( project_manager.Email = gUserEmail
                                     || project_supporter.Email = gUserEmail ) ),
                               project_date_target, gPrjSortOrd ),
                           Coalesce(cboPrjCoverage.Selected.Value, "All coverage") = "All coverage",
                           Sort( OpenProjects, project_date_target, gPrjSortOrd ),
                           Sort(
                               Filter( OpenProjects,
                                       project_coverage.Value = cboPrjCoverage.Selected.Value ),
                               project_date_target, gPrjSortOrd ) ),
                       If( tglShowComplete.Value && tglOnlyMine.Value
                        && Coalesce(cboPrjCoverage.Selected.Value, "All coverage") = "All coverage",
                           Sort(
                               Filter( ActiveProjects,
                                       ( project_manager.Email = gUserEmail
                                     || project_supporter.Email = gUserEmail )
                                    && StartsWith( project_name, Trim(txtProjSearch.Text) ) ),
                               project_date_target, gPrjSortOrd ),
                           tglShowComplete.Value && tglOnlyMine.Value,
                           Sort(
                               Filter( ActiveProjects,
                                       project_coverage.Value = cboPrjCoverage.Selected.Value
                                    && ( project_manager.Email = gUserEmail
                                     || project_supporter.Email = gUserEmail )
                                    && StartsWith( project_name, Trim(txtProjSearch.Text) ) ),
                               project_date_target, gPrjSortOrd ),
                           tglShowComplete.Value
                        && Coalesce(cboPrjCoverage.Selected.Value, "All coverage") = "All coverage",
                           Sort(
                               Filter( ActiveProjects,
                                       StartsWith( project_name, Trim(txtProjSearch.Text) ) ),
                               project_date_target, gPrjSortOrd ),
                           tglShowComplete.Value,
                           Sort(
                               Filter( ActiveProjects,
                                       project_coverage.Value = cboPrjCoverage.Selected.Value
                                    && StartsWith( project_name, Trim(txtProjSearch.Text) ) ),
                               project_date_target, gPrjSortOrd ),
                           tglOnlyMine.Value
                        && Coalesce(cboPrjCoverage.Selected.Value, "All coverage") = "All coverage",
                           Sort(
                               Filter( OpenProjects,
                                       ( project_manager.Email = gUserEmail
                                     || project_supporter.Email = gUserEmail )
                                    && StartsWith( project_name, Trim(txtProjSearch.Text) ) ),
                               project_date_target, gPrjSortOrd ),
                           tglOnlyMine.Value,
                           Sort(
                               Filter( OpenProjects,
                                       project_coverage.Value = cboPrjCoverage.Selected.Value
                                    && ( project_manager.Email = gUserEmail
                                     || project_supporter.Email = gUserEmail )
                                    && StartsWith( project_name, Trim(txtProjSearch.Text) ) ),
                               project_date_target, gPrjSortOrd ),
                           Coalesce(cboPrjCoverage.Selected.Value, "All coverage") = "All coverage",
                           Sort(
                               Filter( OpenProjects,
                                       StartsWith( project_name, Trim(txtProjSearch.Text) ) ),
                               project_date_target, gPrjSortOrd ),
                           Sort(
                               Filter( OpenProjects,
                                       project_coverage.Value = cboPrjCoverage.Selected.Value
                                    && StartsWith( project_name, Trim(txtProjSearch.Text) ) ),
                               project_date_target, gPrjSortOrd ) ) ),
                   "project_perc_completion",
                   If( Len( Trim(txtProjSearch.Text) ) = 0,
                       If( tglShowComplete.Value && tglOnlyMine.Value
                        && Coalesce(cboPrjCoverage.Selected.Value, "All coverage") = "All coverage",
                           Sort(
                               Filter( ActiveProjects,
                                       ( project_manager.Email = gUserEmail
                                     || project_supporter.Email = gUserEmail ) ),
                               project_perc_completion, gPrjSortOrd ),
                           tglShowComplete.Value && tglOnlyMine.Value,
                           Sort(
                               Filter( ActiveProjects,
                                       project_coverage.Value = cboPrjCoverage.Selected.Value
                                    && ( project_manager.Email = gUserEmail
                                     || project_supporter.Email = gUserEmail ) ),
                               project_perc_completion, gPrjSortOrd ),
                           tglShowComplete.Value
                        && Coalesce(cboPrjCoverage.Selected.Value, "All coverage") = "All coverage",
                           Sort( ActiveProjects, project_perc_completion, gPrjSortOrd ),
                           tglShowComplete.Value,
                           Sort(
                               Filter( ActiveProjects,
                                       project_coverage.Value = cboPrjCoverage.Selected.Value ),
                               project_perc_completion, gPrjSortOrd ),
                           tglOnlyMine.Value
                        && Coalesce(cboPrjCoverage.Selected.Value, "All coverage") = "All coverage",
                           Sort(
                               Filter( OpenProjects,
                                       ( project_manager.Email = gUserEmail
                                     || project_supporter.Email = gUserEmail ) ),
                               project_perc_completion, gPrjSortOrd ),
                           tglOnlyMine.Value,
                           Sort(
                               Filter( OpenProjects,
                                       project_coverage.Value = cboPrjCoverage.Selected.Value
                                    && ( project_manager.Email = gUserEmail
                                     || project_supporter.Email = gUserEmail ) ),
                               project_perc_completion, gPrjSortOrd ),
