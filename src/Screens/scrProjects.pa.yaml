# =============================================================================
# scrProjects  —  Projects menu (screen-map §3). CORE-SHELL: header + nav +
# search box + empty gallery placeholder. Phase 2 wires the delegable Items:
#   Sort(Filter(tmProjects, IsArchived = false), SortOrder)  with StartsWith search.
# DIALECT: modern structured schema; positional z-order. Header + nav are one
# component (cmpAppBar), declared LAST so the fly-out floats over the content.
# =============================================================================
# VERTICAL BANDS — resolved, so they can be checked against Studio by eye.
# Theme.Space: HeaderH 64 · Gutter 24 · Gap 16.  Screen height 768 (tablet).
#
#     0 ..  64   appBar (the blue bar; declared LAST, floats above everything)
#    88 .. 148   hdrProjects      = HeaderH + Gutter,           height 60
#   164 .. 204   selFilter | txtProjSearch  = +60 +Gap,         height 40
#   220 .. 744   galProjects      = +40 +Gap,   height = 768 - 220 - Gutter
#
# If Studio shows anything else here, the layout has drifted — most likely a
# control positioned off another control's geometry, which is how galProjects
# once landed at Y=193 and covered the filter row by 11px. Every value in this
# stack is now absolute Theme arithmetic for that reason.

Screens:
  scrProjects:
    Properties:
      Fill: =Theme.Color.Bg
    Children:
      # ---- Content: header + filter strip + search + empty gallery --------
      - hdrProjects:
          Control: CanvasComponent
          ComponentName: cmpSectionHeader
          Properties:
            X: =Theme.Space.Gutter
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter
            Width: =Parent.Width - (Theme.Space.Gutter * 2)
            Height: =60
            Title: ="Projects"
            Subtitle: ="Browse and open a project"
            ShowAction: =true
            ActionLabel: ="New project"
            # gSelProject is cleared too: the child edit screens pre-attach to it,
            # and a stale selection would silently parent the next new item to the
            # last project the user happened to open.
            OnAction: |
              =Set( gEditMode, "New" );
               Set( gEditProject, Blank() );
               Set( gSelProject, Blank() );
               Navigate( scrProjectEdit, ScreenTransition.Cover )
      # Filter strip — drives galProjects.Items. There is no boolean archive
      # flag in this model: "Archived" is a value of the project_phase Choice
      # (schema.md, the Or-of-equals pattern), so each branch enumerates phases with an Or of `=`.
      - selFilter:
          Control: CanvasComponent
          ComponentName: cmpSelection
          Properties:
            X: =Theme.Space.Gutter
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter + 60 + Theme.Space.Gap
            Width: =360
            Height: =40
            Items: |
              =Table({ Id: 1, Label: "All" }, { Id: 2, Label: "Active" }, { Id: 3, Label: "Archived" })
            DefaultId: =2
            OnChange: =Reset(txtProjSearch)
      - txtProjSearch:
          Control: ModernTextInput@1.1.1
          Properties:
            Type: =TextInputType.Search
            # Phase 2: drives StartsWith(project_name, txtProjSearch.Text) on the projects gallery.
            Placeholder: ="Search projects…"
            # galProjects.Items reads .Text directly, so without this every keystroke
            # fires a delegated query against taskmaster_projects — ~16 round trips to
            # type "Portfolio Review", on the app's busiest list screen. This was the
            # only text input in the repo missing it.
            TriggerOutput: =TriggerOutput.Delayed
            Font: =Theme.Font
            Size: =Theme.Size.Body
            Height: =40
            Width: =360
            X: =Theme.Space.Gutter + 360 + Theme.Space.Gap
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter + 60 + Theme.Space.Gap
      # ---- Projects gallery (delegable) -----------------------------------
      # Each If branch is INDEPENDENTLY delegable, and the Sort sits INSIDE each
      # branch — `Sort(If(...))` would NOT fold, because If is not a delegable
      # operation, so the sort would run locally over one arbitrary page.
      # No IsBlank guard: StartsWith(col, "") is already true for every row, and
      # IsBlank in a predicate is a delegation risk for no benefit.
      - galProjects:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: |
              =If( selFilter.Selected.Id = 3,
                   Sort( Filter( taskmaster_projects,
                             project_phase.Value = "Archived"
                          && StartsWith(project_name, txtProjSearch.Text) ),
                         project_name ),
                   selFilter.Selected.Id = 2,
                   // `ActiveProjects` is the named formula in App.Formulas holding the
                   // four-live-phase chain that used to be written out here. Filtering
                   // over it FOLDS into one server query — verified in Live Monitor on
                   // 2026-08-12 (a single getRows of already-filtered rows, not the
                   // repeated walk a client-side filter produces).
                   //
                   // That result is what let every cross-project query in the app move
                   // onto a named formula, so the archived/live rules have ONE definition
                   // instead of a copy per screen. This branch was the canary and is now
                   // just the first consumer.
                   //
                   // The other two branches stay on the raw list ON PURPOSE: branch 3 IS
                   // the archived view, and the default branch means All.
                   Sort( Filter( ActiveProjects,
                             StartsWith(project_name, txtProjSearch.Text) ),
                         project_name ),
                   Sort( Filter( taskmaster_projects,
                             StartsWith(project_name, txtProjSearch.Text) ),
                         project_name ) )
            TemplateSize: =72
            TemplatePadding: =0
            Width: =Parent.Width - (Theme.Space.Gutter * 2)
            # ABSOLUTE, not `txtProjSearch.Y + txtProjSearch.Height + …`. A cross-control
            # geometry reference is fragile across this gap: Studio suffixes a
            # colliding name on paste (txtProjSearch -> txtProjSearch_1), and if the
            # reference then fails to resolve the gallery jumps to the top of the
            # screen and covers the filter and search row. Same arithmetic as every
            # other screen: header band 88, section header 60, gap, filter row 40, gap.
            Height: =Parent.Height - (Theme.Space.HeaderH + Theme.Space.Gutter + 60 + Theme.Space.Gap + 40 + Theme.Space.Gap) - Theme.Space.Gutter
            X: =Theme.Space.Gutter
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter + 60 + Theme.Space.Gap + 40 + Theme.Space.Gap
            TemplateFill: =If(ThisItem.ID = gSelProject.ID, Theme.Color.Accent, Theme.Color.Surface)
          Children:
            - rowName:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.project_name
                  Font: =Theme.Font
                  FontWeight: =FontWeight.Semibold
                  Size: =Theme.Size.H3
                  Color: =Theme.Color.TextPrimary
                  X: =Theme.Space.Gap
                  Y: =10
                  Width: =Parent.TemplateWidth * 0.42
                  Height: =26
                  VerticalAlign: =VerticalAlign.Middle
            - rowMeta:
                Control: Label@2.5.1
                Properties:
                  # Person and Choice subfields read locally off the returned row —
                  # no extra call, so this is not an N+1.
                  Text: |
                    =ThisItem.project_phase.Value & "  ·  " & ThisItem.project_priority.Value
                     & "  ·  " & Coalesce(ThisItem.project_manager.DisplayName, "Unassigned")
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  X: =Theme.Space.Gap
                  Y: =36
                  Width: =Parent.TemplateWidth * 0.42
                  Height: =20
                  VerticalAlign: =VerticalAlign.Middle
            - rowTarget:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =If( IsBlank(ThisItem.project_date_target), "No target date",
                         "Target " & Text(ThisItem.project_date_target, "dd mmm yyyy") )
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  # Overdue only counts while the project is still running.
                  Color: |
                    =If( !IsBlank(ThisItem.project_date_target)
                      && ThisItem.project_date_target < Today()
                      && ThisItem.project_phase.Value <> "Complete"
                      && ThisItem.project_phase.Value <> "Archived",
                         Theme.Color.Danger, Theme.Color.TextMuted )
                  X: =Parent.TemplateWidth * 0.46
                  Y: =26
                  Width: =Parent.TemplateWidth * 0.24
                  Height: =20
                  VerticalAlign: =VerticalAlign.Middle
            - rowPercent:
                Control: Label@2.5.1
                Properties:
                  # Weighted rollup maintained app-side (C3). Blank until the
                  # first in-app stage change writes it.
                  Text: =Coalesce(ThisItem.project_perc_completion, 0) & "% complete"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Align: =Align.Right
                  X: =Parent.TemplateWidth - 180 - Theme.Space.Gap
                  Y: =26
                  Width: =180
                  Height: =20
                  VerticalAlign: =VerticalAlign.Middle
            - galProjectsHit:
                Control: Classic/Button@2.2.0
                Properties:
                  # The row's action lives HERE, not on the gallery's OnSelect: a gallery's own
                  # OnSelect does not reliably fire when the click lands on a child control, so
                  # without a transparent full-template button declared LAST the rows look right
                  # and do nothing. Confirmed in Studio on the nav rail, 2026-08-03.
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  OnSelect: |
                    =Select(Parent);
                     Set(gSelProject, ThisItem); Navigate(scrProject, ScreenTransition.Cover)
      # Empty state — only when the query genuinely returns nothing.
      - ProjectsEmptyLabel:
          Control: Label@2.5.1
          Properties:
            Text: |
              =If( IsBlank(txtProjSearch.Text),
                   "No projects match this filter.",
                   "No projects start with """ & txtProjSearch.Text & """." )
            Font: =Theme.Font
            Size: =Theme.Size.Body
            Color: =Theme.Color.TextMuted
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            Visible: =IsEmpty(galProjects.AllItems)
            X: =Theme.Space.Gutter
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter + 60 + Theme.Space.Gap + 40 + Theme.Space.Gap
            Width: =Parent.Width - (Theme.Space.Gutter * 2)
            Height: =Parent.Height - (Theme.Space.HeaderH + Theme.Space.Gutter + 60 + Theme.Space.Gap + 40 + Theme.Space.Gap) - Theme.Space.Gutter
      # ---- The whole shell is one component: header bar + fly-out nav rail ----
      # DECLARED LAST so positional z-order floats the fly-out over the content.
      #
      # Height is dynamic and that is the whole trick: a component intercepts every
      # click inside its bounds, so closed it must own nothing but the 64px header
      # strip. Open, covering the screen is exactly right — the scrim wants the click.
      #
      # cmpAppBar cannot Navigate (a component can't see app screens), so it reports
      # the chosen entry and this screen does the navigating.
      - appBar:
          Control: CanvasComponent
          ComponentName: cmpAppBar
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =If(gNavOpen, Parent.Height, Theme.Space.HeaderH)
            Items: =NavMenu
            ActiveKey: =3
            HasLicence: =gHasPowerBiLicence
            AppTitle: ="EQD Taskmaster"
            ScreenTitle: ="Projects"
            IsOpen: =gNavOpen
            OnToggle: =Set(gNavOpen, !gNavOpen)
            OnNavigate: |
              =Switch( appBar.SelectedKey,
                       1, Navigate(scrHome, ScreenTransition.Fade),
                       2, Navigate(scrReports, ScreenTransition.Fade),
                       3, Navigate(scrProjects, ScreenTransition.Fade),
                          Navigate(scrReference, ScreenTransition.Fade) );
              Set(gNavOpen, false)
