# Projects browser: coverage filter + search + a "show completed" toggle over a
# six-column gallery.
#
# VERTICAL BANDS (tablet 768). gTheme.Space: HeaderH 64 · Gutter 24 · Gap 16.
#     0 ..  64   appBar        (declared LAST so the fly-out floats over content)
#    88 .. 148   hdrProjects   = HeaderH + Gutter, height 60
#   164 .. 204   rowFilters    = off hdrProjects,  height 40
#   220 .. 260   rowFilters2   = off rowFilters,   height 40
#   266 .. 744   galProjects   = absolute 266, fills to the bottom gutter
#
# The bands above galProjects are RELATIVE — each anchored to the one above it, so a
# height change in the header moves them together. The gallery itself is an ABSOLUTE
# 266 and its Height subtracts the same number, so the two have to be edited together.
# Layout formulas survive a paste and keep recomputing (tests/README.md) — what breaks
# the link is dragging a control in Studio, so change geometry here or in the formula
# bar, never with the mouse.
#
# Horizontal placement is auto-layout, not arithmetic: the filter row and each gallery
# row are containers whose children carry NO X. Columns therefore cannot overlap at any
# width. They previously could — `rowDue` was anchored proportionally while
# `rowPercent` was pinned to the right edge with a fixed width, and the two only
# cleared each other above about 850px of TemplateWidth.
Screens:
  scrProjects:
    Properties:
      Fill: =gTheme.Color.Bg
      # project_coverage's values are NOT in the golden source — schema.yaml carries
      # PLACEHOLDERs and says the app must bind Choices() rather than a literal, so
      # whatever the list actually holds appears here with no app change. The "All
      # coverage" row is Collected FIRST so it sorts to the top and is what makes an
      # unfiltered view selectable without a separate clear button.
      OnVisible: |
        =ClearCollect( colPrjCoverage, { Value: "All coverage" } );
         Collect( colPrjCoverage,
                  ForAll( Choices([@taskmaster_projects].project_coverage) As c,
                          { Value: c.Value } ) );
         Set( gPrjPicker, "" );
         Set( gPrjQuery, "" );
         // SEEDED ONCE, NOT ON EVERY VISIT. The coverage combo and the search box both
         // survive a round trip into a project and back, because nothing Resets them.
         // An unguarded Set here would make the lead the ONE filter that silently
         // reverts to "mine" every time the user comes back from a project.
         If( !gPrjLeadInit,
             Set( gPrjLead, { DisplayName: User().FullName, Mail: gUserEmail } );
             Set( gPrjLeadInit, true ) )
    Children:
      - hdrProjects:
          Control: CanvasComponent
          ComponentName: cmpSectionHeader
          Properties:
            X: =gTheme.Space.Gutter
            Y: =gTheme.Space.HeaderH + gTheme.Space.Gutter
            Width: =Parent.Width - (gTheme.Space.Gutter * 2)
            Height: =60
            Title: ="Projects"
            Subtitle: ="Browse and open a project"
            ShowAction: =true
            ActionLabel: ="New project"
            # gSelProject is cleared too: the child edit screens pre-attach to it,
            # and a stale selection would silently parent the next new item to the
            # last project the user happened to open.
            OnAction: |
              =Set( gEditMode, "New" );
               Set( gEditProject, Blank() );
               Set( gSelProject, Blank() );
               Navigate( scrProjectEdit, ScreenTransition.Cover )
      # ---- Filter row -------------------------------------------------------
      # ONE auto-layout row. The controls carry no X at all, so the chain of
      # hand-added offsets that used to place them cannot drift, and the search box
      # takes whatever width the other three leave.
      - rowFilters:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =gTheme.Space.Gap
            X: =gTheme.Space.Gutter
            Y: =hdrProjects.Y + hdrProjects.Height + gTheme.Space.Gap
            Width: =Parent.Width - (gTheme.Space.Gutter * 2)
            Height: =40
          Children:
            # FillPortions 0 + LayoutMinWidth on everything except the search box:
            # a child of an auto-layout container is FLEXIBLE by default and its
            # declared Width is only advisory until that is turned off.
            - cboPrjCoverage:
                Control: ModernCombobox@1.1.1
                Properties:
                  Items: =colPrjCoverage
                  ItemDisplayText: =ThisItem.Value
                  DefaultSelectedItems: |
                    =Table( { Value: "All coverage" } )
                  SelectMultiple: =false
                  IsSearchable: =false
                  InputTextPlaceholder: ="Coverage"
                  FillPortions: =0
                  LayoutMinWidth: =240
                  Width: =240
                  Height: =40
            - txtProjSearch:
                Control: ModernTextInput@1.1.1
                Properties:
                  Type: =TextInputType.Search
                  Placeholder: ="Search projects…"
                  TriggerOutput: =TriggerOutput.Delayed
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  FillPortions: =1
                  LayoutMinWidth: =220
                  Height: =40
            # A Classic/Toggle, not a check box: the check-box token is not grounded
            # for this dialect and an unverified control fails the WHOLE screen paste.
            # Same control the two scrTaskEdit section switches already use.
            - tglShowComplete:
                Control: Classic/Toggle@2.1.0
                Properties:
                  Default: =false
                  FalseText: =""
                  TrueText: =""
                  FillPortions: =0
                  LayoutMinWidth: =60
                  Width: =60
                  Height: =30
            - lblShowComplete:
                Control: Label@2.5.1
                Properties:
                  Text: ="Show completed"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Color: =gTheme.Color.TextPrimary
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinWidth: =150
                  Width: =150
                  Height: =40
      # ---- Lead filter row --------------------------------------------------
      # A SECOND ROW IS FORCED, not a style choice. rowFilters' children sit at
      # 240 + 220 + 60 + 150 with three 16px gaps = 718 against 720 usable at the
      # 768 target — two pixels of slack, so nothing more fits on that line at any
      # width the app supports. Anchored off rowFilters the same relative way, so a
      # height change above still moves everything together.
      - rowFilters2:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =gTheme.Space.Gap
            X: =gTheme.Space.Gutter
            Y: =rowFilters.Y + rowFilters.Height + gTheme.Space.Gap
            Width: =Parent.Width - (gTheme.Space.Gutter * 2)
            Height: =40
          Children:
            - lblPrjLeadCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Lead"
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  Color: =gTheme.Color.TextMuted
                  VerticalAlign: =VerticalAlign.Middle
                  FillPortions: =0
                  LayoutMinWidth: =50
                  Width: =50
                  Height: =40
            # Reset FIRST: cmpPicker clears its own highlight and search box on Reset,
            # and without it the dialog reopens showing the previous pick as if it were
            # still current. gPrjQuery is the screen's half of that — the component
            # never runs the query itself.
            - btnPrjLead:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |
                    =If( Len(Coalesce(gPrjLead.Mail, "")) = 0,
                         "All leads",
                         gPrjLead.DisplayName )
                  Fill: =gTheme.Color.Surface
                  Color: =gTheme.Color.Primary
                  BorderColor: =gTheme.Color.Border
                  BorderThickness: =1
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  FillPortions: =0
                  LayoutMinWidth: =260
                  Width: =260
                  Height: =40
                  OnSelect: |
                    =Set( gPrjQuery, "" );
                     Reset( cmpPrjPick );
                     Set( gPrjPicker, "Lead" )
            # Clearing to Blank is what makes the filter a no-op: the predicate becomes
            # StartsWith(email, ""), which is true for every row. Do not "fix" this to
            # an equality test — that would need a second branch per combination.
            - btnPrjLeadAll:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: ="All leads"
                  Fill: =gTheme.Color.Surface
                  Color: =gTheme.Color.Primary
                  BorderColor: =gTheme.Color.Primary
                  BorderThickness: =1
                  Font: =gTheme.Font
                  Size: =gTheme.Size.Body
                  DisplayMode: |
                    =If( Len(Coalesce(gPrjLead.Mail, "")) = 0,
                         DisplayMode.Disabled, DisplayMode.Edit )
                  FillPortions: =0
                  LayoutMinWidth: =120
                  Width: =120
                  Height: =40
                  OnSelect: =Set( gPrjLead, Blank() )
      # ---- Gallery ----------------------------------------------------------
      # FOUR BRANCHES, each INDEPENDENTLY delegable, and the Sort sits INSIDE each
      # one — `Sort(If(...))` would not fold, because If is not a delegable
      # operation, so the sort would run locally over one arbitrary page.
      #
      # EVERY BRANCH CARRIES ITS OWN PHASE PREDICATE, and the two "show completed"
      # ones look redundant against ActiveProjects because they enumerate the same
      # five phases it already filters on. Do not simplify them away. Sorting a
      # bare `Filter(ActiveProjects, StartsWith(...))` returned "the query is not
      # valid" from SharePoint, while the identical shape WITH an explicit phase
      # group did not — so all four branches are deliberately the same shape, and
      # the one that was different is the one that failed.
      #
      # The phases are ENUMERATED rather than written as `<> "Complete"`: a Text
      # `<>` does not delegate, and one non-delegable clause silently truncates the
      # whole query at the row limit. ActiveProjects already excludes Archived, so
      # "show completed" is the difference between four open phases and five. That is the
      # column's WHOLE vocabulary minus Archived, so a value added in SharePoint and not
      # added here vanishes from this screen rather than erroring.
      #
      # `project_coverage` is NOT indexed in the golden source. Equality on it
      # delegates, but SharePoint refuses an unindexed filter once the list passes
      # 5,000 items — index it before the projects list gets near that.
      #
      # THE COVERAGE TEST IS Coalesce'd. Before OnVisible has run, or if Choices()
      # returns nothing, `cboPrjCoverage.Selected.Value` is BLANK — which is not equal
      # to "All coverage", so the old form fell through to a branch that filtered
      # `project_coverage.Value = <blank>`. Treating an absent selection as "All"
      # keeps that degenerate predicate out of the query entirely.
      - galProjects:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: |
              =If( tglShowComplete.Value
                && Coalesce(cboPrjCoverage.Selected.Value, "All coverage") = "All coverage",
                   Sort( Filter( ActiveProjects,
                             ( project_phase.Value = "Not Started"
                            || project_phase.Value = "Planning"
                            || project_phase.Value = "Active"
                            || project_phase.Value = "Stalled"
                            || project_phase.Value = "Complete" )
                          && StartsWith(project_name, txtProjSearch.Text)
                          && StartsWith(project_manager.Email, Coalesce(gPrjLead.Mail, "")) ),
                         project_name ),
                   tglShowComplete.Value,
                   Sort( Filter( ActiveProjects,
                             ( project_phase.Value = "Not Started"
                            || project_phase.Value = "Planning"
                            || project_phase.Value = "Active"
                            || project_phase.Value = "Stalled"
                            || project_phase.Value = "Complete" )
                          && project_coverage.Value = cboPrjCoverage.Selected.Value
                          && StartsWith(project_name, txtProjSearch.Text)
                          && StartsWith(project_manager.Email, Coalesce(gPrjLead.Mail, "")) ),
                         project_name ),
                   Coalesce(cboPrjCoverage.Selected.Value, "All coverage") = "All coverage",
                   Sort( Filter( ActiveProjects,
                             ( project_phase.Value = "Not Started"
                            || project_phase.Value = "Planning"
                            || project_phase.Value = "Active"
                            || project_phase.Value = "Stalled" )
                          && StartsWith(project_name, txtProjSearch.Text)
                          && StartsWith(project_manager.Email, Coalesce(gPrjLead.Mail, "")) ),
                         project_name ),
                   Sort( Filter( ActiveProjects,
                             ( project_phase.Value = "Not Started"
                            || project_phase.Value = "Planning"
                            || project_phase.Value = "Active"
                            || project_phase.Value = "Stalled" )
                          && project_coverage.Value = cboPrjCoverage.Selected.Value
                          && StartsWith(project_name, txtProjSearch.Text)
                          && StartsWith(project_manager.Email, Coalesce(gPrjLead.Mail, "")) ),
                         project_name ) )
            # EXPLICIT single column. Left unset, a wrapping gallery divides
            # TemplateWidth between columns, and every proportional child inside the
            # row shrinks with it — which is how the columns came to overlap.
            WrapCount: =1
            TemplateSize: =72
            TemplatePadding: =0
            X: =gTheme.Space.Gutter
            Y: =266
            Width: =Parent.Width - (gTheme.Space.Gutter * 2)
            Height: =Parent.Height - 266 - gTheme.Space.Gutter
            TemplateFill: =If(ThisItem.ID = gSelProject.ID, gTheme.Color.Accent, gTheme.Color.Surface)
          Children:
            # ONE auto-layout row per record. The columns carry NO X, so they cannot
            # collide at any TemplateWidth — which the previous absolute version did:
            # `rowDue` was anchored proportionally while `rowPercent` was pinned to the
            # right edge with a fixed width, and the two only cleared each other above
            # about 850px.
            #
            # Every column is FillPortions + LayoutMinWidth. A child of an auto-layout
            # container is FLEXIBLE by default and its declared Width is advisory until
            # that is turned off, so a fixed Width alone would silently do nothing.
            - rowBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight - 1
                Children:
                  # INLINE SVG, NOT A COMPONENT. A canvas component cannot be placed
                  # inside a gallery template — Studio refuses the paste. Same technique
                  # as cmpKpiRing.
                  #
                  # SHAPE CARRIES THE MEANING, colour only reinforces it: an empty ring,
                  # a ring of dots, a ring with a filled core, an exclamation disc and a
                  # tick are all distinguishable in greyscale and to a red-green
                  # colour-blind reader. The set reads as a progression — empty, thinking,
                  # working, stuck, done.
                  #
                  # EVERY VALUE OF project_phase NEEDS A CASE HERE. A phase added to the
                  # SharePoint column but not added here renders as "?", which is at least
                  # VISIBLE — unlike the same omission in the Items filter above, where the
                  # rows simply do not appear.
                  #
                  # HEX TEXT, not gTheme.Color.*: these drop straight into the SVG string
                  # and Power Fx has no Color-to-hex conversion. They mirror the palette —
                  # Primary #005A9E · Success #31825D · Danger #C53A3A · TextMuted #6E7882.
                  #
                  # NO "Archived" CASE. Archived projects never reach this gallery, so one
                  # would land on the "?" glyph — the right answer if it ever appears,
                  # since it means something is showing work that should be hidden.
                  - rowStatus:
                      Control: Image@2.2.3
                      Properties:
                        ImagePosition: =ImagePosition.Fit
                        FillPortions: =0
                        LayoutMinWidth: =28
                        Width: =28
                        Height: =28
                        Image: |
                          =With(
                              { g: Switch( Coalesce(ThisItem.project_phase.Value, ""),
                                    "Not Started",
                                        "<circle cx='18' cy='18' r='13' fill='none' stroke='#B9C0C8' stroke-width='2.5'/>",
                                    "Planning",
                                        "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'/>"
                                      & "<circle cx='12.5' cy='18' r='1.7' fill='#6E7882'/>"
                                      & "<circle cx='18'   cy='18' r='1.7' fill='#6E7882'/>"
                                      & "<circle cx='23.5' cy='18' r='1.7' fill='#6E7882'/>",
                                    "Active",
                                        "<circle cx='18' cy='18' r='13' fill='none' stroke='#005A9E' stroke-width='3'/>"
                                      & "<circle cx='18' cy='18' r='7' fill='#005A9E'/>",
                                    "Stalled",
                                        "<circle cx='18' cy='18' r='14.5' fill='#C53A3A'/>"
                                      & "<rect x='16.25' y='10' width='3.5' height='11' rx='1.75' fill='#FFFFFF'/>"
                                      & "<circle cx='18' cy='25' r='2' fill='#FFFFFF'/>",
                                    "Complete",
                                        "<circle cx='18' cy='18' r='14.5' fill='#31825D'/>"
                                      & "<path d='M11 18.5 L16 23.5 L25 13.5' fill='none' stroke='#FFFFFF'"
                                      & " stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/>",
                                        "<circle cx='18' cy='18' r='13' fill='none' stroke='#6E7882' stroke-width='2.5'"
                                      & " stroke-dasharray='4 3'/>"
                                      & "<text x='18' y='22.5' text-anchor='middle' font-size='13'"
                                      & " font-family='Segoe UI, sans-serif' fill='#6E7882'>?</text>" ) },
                              "data:image/svg+xml," & EncodeUrl(
                                  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'>" & g & "</svg>" )
                          )
                  # Name over lead, so the two identity fields read as one block.
                  # BOTH children are pinned: unpinned children of a vertical container
                  # split the height evenly and ignore the 26/20 declared here.
                  - colNameLead:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutGap: =2
                        FillPortions: =3
                        LayoutMinWidth: =200
                        Height: =48
                      Children:
                        - rowName:
                            Control: Label@2.5.1
                            Properties:
                              Text: =ThisItem.project_name
                              Font: =gTheme.Font
                              FontWeight: =FontWeight.Semibold
                              Size: =gTheme.Size.H3
                              Color: =gTheme.Color.TextPrimary
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =26
                              Width: =Parent.Width
                              Height: =26
                        - rowLead:
                            Control: Label@2.5.1
                            Properties:
                              Text: |
                                =Coalesce(ThisItem.project_manager.DisplayName, "Unassigned")
                              Font: =gTheme.Font
                              Size: =gTheme.Size.Small
                              Color: =gTheme.Color.TextMuted
                              VerticalAlign: =VerticalAlign.Middle
                              FillPortions: =0
                              LayoutMinHeight: =20
                              Width: =Parent.Width
                              Height: =20
                  - rowPriority:
                      Control: Label@2.5.1
                      Properties:
                        Text: =Coalesce(ThisItem.project_priority.Value, "—")
                        Font: =gTheme.Font
                        FontWeight: =FontWeight.Semibold
                        Size: =gTheme.Size.Small
                        # Colour-coded, but the value is also SPELLED OUT — colour alone
                        # would carry the whole meaning for a reader who cannot see it.
                        Color: |
                          =Switch( ThisItem.project_priority.Value,
                                   "Critical", gTheme.Color.Danger,
                                   "High",     gTheme.Color.Warning,
                                   "Moderate", gTheme.Color.Primary,
                                               gTheme.Color.TextMuted )
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =1
                        LayoutMinWidth: =84
                        Height: =20
                  - rowDue:
                      Control: Label@2.5.1
                      Properties:
                        # No target date is "-", not a blank cell: an empty column reads
                        # as a rendering fault, a dash reads as "nobody set one".
                        Text: |
                          =If( IsBlank(ThisItem.project_date_target), "-",
                               Text(ThisItem.project_date_target, "dd mmm yyyy") & "   ·   " &
                               With( { d: DateDiff(Today(), ThisItem.project_date_target, TimeUnit.Days) },
                                     If( d < 0,  Abs(d) & " days overdue",
                                         d = 0,  "due today",
                                         d = 1,  "1 day left",
                                                 d & " days left" ) ) )
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        # Only overdue on work that is still open — a completed project
                        # past its target is history, not a problem to flag.
                        Color: |
                          =If( !IsBlank(ThisItem.project_date_target)
                            && ThisItem.project_date_target < Today()
                            && ThisItem.project_phase.Value <> "Complete",
                               gTheme.Color.Danger, gTheme.Color.TextMuted )
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =2
                        LayoutMinWidth: =190
                        Height: =20
                  - rowPercent:
                      Control: Label@2.5.1
                      Properties:
                        Text: =Coalesce(ThisItem.project_perc_completion, 0) & "% complete"
                        Font: =gTheme.Font
                        Size: =gTheme.Size.Small
                        Color: =gTheme.Color.TextMuted
                        Align: =Align.Right
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =1
                        LayoutMinWidth: =104
                        Height: =20
            # Absolute siblings of the row container, not children of it: both must
            # span the whole template, and the hit button must be LAST so it is on top.
            - rowLine:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =gTheme.Color.Border
                  X: =0
                  Y: =Parent.TemplateHeight - 1
                  Width: =Parent.TemplateWidth
                  Height: =1
            - galProjectsHit:
                Control: Classic/Button@2.2.0
                Properties:
                  # The row's action lives HERE, not on the gallery's OnSelect: a gallery's
                  # own OnSelect does not reliably fire when the click lands on a child
                  # control, so without a transparent full-template button declared LAST
                  # the rows look right and do nothing.
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =gTheme.Color.Hover
                  PressedFill: =gTheme.Color.Press
                  BorderThickness: =0
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  OnSelect: |
                    =Select(Parent);
                     Set(gSelProject, ThisItem); Navigate(scrProject, ScreenTransition.Cover)
      - ProjectsEmptyLabel:
          Control: Label@2.5.1
          Properties:
            Text: |
              =If( Len(Coalesce(gPrjLead.Mail, "")) > 0,
                   "No projects led by " & gPrjLead.DisplayName &
                   ". Choose All leads to widen the filter.",
                   Len(txtProjSearch.Text) > 0,
                   "No projects start with """ & txtProjSearch.Text & """.",
                   !tglShowComplete.Value,
                   "Nothing open here. Turn on Show completed to include finished projects.",
                   "No projects match this coverage." )
            Font: =gTheme.Font
            Size: =gTheme.Size.Body
            Color: =gTheme.Color.TextMuted
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            Visible: =IsEmpty(galProjects.AllItems)
            X: =galProjects.X
            Y: =galProjects.Y
            Width: =galProjects.Width
            Height: =galProjects.Height
      # ---- Lead picker modal -------------------------------------------------
      # Declared BEFORE appBar so the nav fly-out still floats above it. Same contract
      # as cmpPrPick on scrProjectEdit: AccessAppScope is false, so the SCREEN runs the
      # query and the component only renders the rows it is handed.
      - cmpPrjPick:
          Control: CanvasComponent
          ComponentName: cmpPicker
          Properties:
            Visible: =Len( Coalesce(gPrjPicker, "") ) > 0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: ="Filter by project lead"
            # Bound to gPrjQuery, which OnSearch sets — never to this instance's own
            # Query output, which would be a self-reference. With nothing typed the
            # default page is the current user, which is also the default filter.
            Results: |
              =If( Len(gPrjQuery) >= 2,
                   ForAll( Office365Users.SearchUserV2({ searchTerm: gPrjQuery, top: 25 }).value As u,
                           { Key:       u.Mail,
                             Primary:   u.DisplayName,
                             Secondary: u.Mail } ),
                   Table( { Key:       User().Email,
                            Primary:   User().FullName,
                            Secondary: User().Email } ) )
            OnSearch: =Set( gPrjQuery, cmpPrjPick.Query )
            # Pick-only: there is no person to create.
            AllowCreate: =false
            OnConfirm: |
              =Set( gPrjLead, { DisplayName: cmpPrjPick.Picked.Primary,
                                Mail:        cmpPrjPick.Picked.Secondary } );
               Set( gPrjPicker, "" )
            OnCancel: =Set( gPrjPicker, "" )
      # ---- The whole shell is one component: header bar + fly-out nav rail ----
      # DECLARED LAST so positional z-order floats the fly-out over the content.
      #
      # Height is dynamic and that is the whole trick: a component intercepts every
      # click inside its bounds, so closed it must own nothing but the 64px header
      # strip. Open, covering the screen is exactly right — the scrim wants the click.
      #
      # cmpAppBar cannot Navigate (a component can't see app screens), so it reports
      # the chosen entry and this screen does the navigating.
      - appBar:
          Control: CanvasComponent
          ComponentName: cmpAppBar
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =If(gNavOpen, Parent.Height, gTheme.Space.HeaderH)
            Items: =gNavMenu
            ActiveKey: =3
            AppTitle: ="EQD Taskmaster"
            ScreenTitle: ="Projects"
            IsOpen: =gNavOpen
            OnToggle: =Set(gNavOpen, !gNavOpen)
            OnNavigate: |
              =Switch( appBar.SelectedKey,
                       1, Navigate(scrHome, ScreenTransition.Fade),
                       2, Navigate(scrReports, ScreenTransition.Fade),
                       3, Navigate(scrProjects, ScreenTransition.Fade),
