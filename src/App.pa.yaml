# App object. Two formula-bar properties: OnStart holds the constants, Formulas
# holds the data-source filters. Both are pasted by hand — see the studio-transfer
# skill, and tools/formula_bar_body.py for a comment-free body.
App:
  Properties:
    # Constants. `Set`, not named formulas: named formulas did not resolve in the
    # published app, which blanked every colour and dimension.
    #
    # `gTheme`, NOT `Theme`. `Theme` collides with modern theming — Power Apps
    # defines `App.Theme` and loads theme objects by instance name. Studio tolerates
    # the collision silently; the player does not.
    OnStart: |-
      =
       Set( gTheme, {
          Color: {
              Primary:      RGBA(0,  90, 158, 1),
              PrimaryDark:  RGBA(0,  60, 110, 1),
              Accent:       RGBA(102, 182, 227, 1),
              Bg:           RGBA(245, 247, 250, 1),
              Surface:      RGBA(255, 255, 255, 1),
              Border:       RGBA(225, 229, 235, 1),
              TextPrimary:  RGBA(32,  38,  45,  1),
              TextMuted:    RGBA(110, 120, 130, 1),
              OnPrimary:    RGBA(255, 255, 255, 1),
              Success:      RGBA(49,  130, 93,  1),
              Warning:      RGBA(214, 152, 40,  1),
              Danger:       RGBA(197, 58,  58,  1),
              // Wash tints for the transparent hit buttons layered OVER gallery rows.
              // They must stay low-alpha: the hit button is declared last, so whatever
              // it paints covers the row's own text. A classic Button left without
              // HoverFill derives one from Fill by dimming 20%, which on a transparent
              // fill reads as a solid block and hides the row.
              Hover:        RGBA(0,  90, 158, 0.05),
              Press:        RGBA(0,  90, 158, 0.1)
          },
          Size: { H1: 28, H2: 20, H3: 16, Body: 14, Small: 12 },
          Space: { Gutter: 24, Gap: 16, HeaderH: 64, NavW: 240, RowH: 52 },
          Font: Font.'Segoe UI'
       } );

       // Key maps to a Navigate in each nav gallery's Switch — keep them in step.
       Set( gNavMenu, Table(
          { Key: 1, Title: "Home",      Icon: Icon.Home       },
          { Key: 2, Title: "Reports",   Icon: Icon.DetailList },
          { Key: 3, Title: "Projects",  Icon: Icon.Document   },
          { Key: 4, Title: "Reference", Icon: Icon.Bookmark   }
       ) );

       // Mirrors schema.yaml -> rollups.stage_weights. Keep the two in step.
       Set( gStageWeights, Table(
          { Stage: "Not Started",  Weight: 0   },
          { Stage: "Planning",     Weight: 10  },
          { Stage: "Drafting",     Weight: 35  },
          { Stage: "Finalizing",   Weight: 85  },
          { Stage: "Complete",     Weight: 100 }
       ) );

       // Prefix + lowercased UPN forms a Person column's Claims:
       //   { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
       //     Claims: gClaimPrefix & Lower(<mail>), DisplayName: …, Email: …,
       //     Department: "", JobTitle: "", Picture: "" }
       // Community-confirmed shape, not first-party: first suspect if a Person write fails.
       Set( gClaimPrefix, "i:0#.f|membership|" );

       // Inlines into the server-side predicates on scrHome / scrReports.
       Set( gUserEmail, Lower(User().Email) )

    # Data-source filters. These must stay named formulas: `Set(x, Filter(...))`
    # captures a table value, and filtering a variable does not delegate — every
    # cross-project query would silently cap at the data row limit.
    #
    # Filtering OVER one of these folds into a single server query (verified in Live
    # Monitor). Only CROSS-PROJECT queries use them; a query already scoped to one
    # project reads the raw list, so opening an archived project still shows its work.
    Formulas: |-
      =
      // Every phase except Archived, enumerated — `<> "Archived"` is a Text <> and does
      // not delegate. This list is the column's whole vocabulary minus one value, so a
      // value added to the column and not added here would vanish from the app rather
      // than error: an allow-list fails CLOSED.
      ActiveProjects = Filter( taskmaster_projects,
          project_phase.Value = "Not Started" || project_phase.Value = "Planning"
       || project_phase.Value = "Active"      || project_phase.Value = "Stalled"
       || project_phase.Value = "Complete" );

      // Two axes at once: the project is live, and the issue's own status is Open.
      OpenIssues = Filter( taskmaster_issues,
          issue_project_archived = false && issue_status.Value = "Open" );

      // `*_project_archived` mirrors the parent's phase, maintained by scrProjectEdit's
      // save. It exists because a child row cannot otherwise answer "is my project
      // archived" without a join, and joins do not delegate.
      LiveTasks = Filter( taskmaster_tasks, task_project_archived = false );
