# App object — the named formulas every screen reads.
#
# Theme.* is the single source for colour, type and spacing; ClaimPrefix and
# StageWeights are read by the edit screens and the roll-up screens. Changing a
# value here changes it everywhere, which is the point of putting them here.
#
# The lone `=` on the first line of the block is the pa-yaml marker for a Power Fx
# formula (the schema requires the value to start with one). It sits on its own
# line because the formulas below open with a comment, and `=//` reads as though
# the whole formula were commented out.
App:
  Properties:
    Formulas: |-
      =
      // --- Identity ---------------------------------------------------------------
      // Lowercased to match the Person-column Claims convention (schema.md).
      // NOTE: this named formula INLINES into the server-side predicates on scrHome /
      // scrReports (task_lead.Email = gUserEmail). User() inside a Filter has
      // historically tripped the delegation analyser. If either Filter shows a blue
      // underline on first paste, the grounded fallback is to delete this line and
      // instead put  Set(gUserEmail, Lower(User().Email))  in App.OnStart.
      gUserEmail = Lower(User().Email);

      // --- Theme ------------------------------------------------------------------
      // One record, referenced as Theme.Color.* / Theme.Size.* / Theme.Space.*.
      // The single styling channel for the whole app (distillation T7/T16).
      Theme = {
          Color: {
              Primary:      RGBA(0,  90, 158, 1),   // EQD desk blue
              PrimaryDark:  RGBA(0,  60, 110, 1),
              Accent:       RGBA(102, 182, 227, 1),
              Bg:           RGBA(245, 247, 250, 1),  // app canvas
              Surface:      RGBA(255, 255, 255, 1),  // cards / nav panel
              Border:       RGBA(225, 229, 235, 1),
              TextPrimary:  RGBA(32,  38,  45,  1),
              TextMuted:    RGBA(110, 120, 130, 1),
              OnPrimary:    RGBA(255, 255, 255, 1),  // text on Primary fill
              Success:      RGBA(49,  130, 93,  1),
              Warning:      RGBA(214, 152, 40,  1),
              Danger:       RGBA(197, 58,  58,  1)
          },
          Size: { H1: 28, H2: 20, H3: 16, Body: 14, Small: 12 },
          Space: { Gutter: 24, Gap: 16, HeaderH: 64, NavW: 240, RowH: 52 },
          Font: Font.'Segoe UI'
      };

      // --- Navigation model (native, licence-independent — Q2 decision) -----------
      // Screens are NOT stored here. An earlier version had `Screen: scrHome` in each
      // record; a screen is a control reference, not a value, so a table column can't
      // hold one and the whole named formula fails to type — which is what produced
      // Studio's "expecting a table" on every nav gallery's Items.
      //
      // So the table carries a plain numeric Key, and each nav gallery turns that into
      // a Navigate with a Switch. Verbose by exactly five lines, and it types.
      // NeedsLicence flags the Power BI-gated entry so the shell can grey it for
      // unlicensed users without the dashboard ever carrying navigation.
      //
      // KEY MAP — the galleries depend on it, so keep it in step:
      //   1 scrHome · 2 scrReports · 3 scrProjects · 4 scrReference
      //   scrAdmin was DELETED 2026-08-11 and its reference-data galleries moved to
      //   scrReference, so there is no fifth entry and key 4 is the Switch default.
      NavMenu = Table(
          { Key: 1, Title: "Home",      Icon: Icon.Home,      NeedsLicence: false },
          { Key: 2, Title: "Reports",   Icon: Icon.DetailList,     NeedsLicence: true  },
          { Key: 3, Title: "Projects",  Icon: Icon.Document, NeedsLicence: false },
          { Key: 4, Title: "Reference", Icon: Icon.Bookmark,  NeedsLicence: false }
      );

      // --- Power BI licence gate (Q2) ---------------------------------------------
      // DECIDED 2026-08-03 — SOFT GATE. An unlicensed user sees the Reports entry
      // GREYED, can still open it, and lands on the empty-state card plus the three
      // licence-free KPI rings. Reports is never hidden: a hidden feature is one nobody
      // knows to ask for a licence for, and the rings are useful on their own.
      //
      // There is no in-app Power BI licence API, so this stays FALSE — everyone is
      // treated as unlicensed until a real signal is supplied. That is the safe default
      // for a soft gate: the worst case is a licensed user seeing the fallback rings
      // and one extra click, not an unlicensed user hitting a broken embed.
      //
      // To supply a signal later, replace this line only — nav and the Reports screen
      // both read it, so nothing else changes. A lookup/config allow-list column or an
      // Entra group check are the two obvious sources.
      gHasPowerBiLicence = false;   // soft gate; see above before changing

      // --- Task-stage weights (C3: project completion is a WEIGHTED rollup) --------
      // Golden source for these numbers: schema/schema.yaml -> rollups:
      //   project_perc_completion. Keep the two in step — this table is the app-side
      //   copy that the write-back below reads.
      //
      // A named formula is a VALUE, so the weights live here; the write-back is a
      // side effect and therefore lives in a behaviour property (snippet below).
      StageWeights = Table(
          { Stage: "Not Started",  Weight: 0   },
          { Stage: "Planning",     Weight: 10  },
          { Stage: "Drafting",     Weight: 35  },
          { Stage: "Finalizing",   Weight: 85  },
          { Stage: "Complete",     Weight: 100 }
          // "Under Review" (was 60) and "Archived" were REMOVED from task_stage on
          // 2026-08-12 — review is signalled by ISSUES, and archiving by the PROJECT.
          // The surviving weights are UNCHANGED on purpose: re-spacing them would move
          // every project's stored project_perc_completion without a single task
          // changing, so historical numbers would stop being comparable. The cost is a
          // visible 35 -> 85 jump at Drafting -> Finalizing. Say so and re-space
          // deliberately if that gap is wrong; do not drift into it.
      );

      // --- Live-work sets (perf stage 1, 2026-08-12) ------------------------------
      // THERE ARE TWO SEPARATE "IS THIS LIVE" AXES AND THEY ARE NOT THE SAME QUESTION.
      // An earlier draft of this block conflated them; the names below keep them apart.
      //
      //  1. PROJECT ARCHIVING — `project_phase = "Archived"`, set on scrProjectEdit.
      //     This is what "archived" means in this app. It CASCADES IN INTENT but NOT in
      //     data: a task, transaction or issue does not carry its parent's phase, so
      //     none of the child sets below can express "belongs to a live project".
      //     `ArchivedProjects` is the set the screens test membership against.
      //  2. A CHILD'S OWN LIFECYCLE. For ISSUES this is `issue_status` and it is real.
      //     For TASKS IT NO LONGER EXISTS: "Archived" was removed from task_stage on
      //     2026-08-12 precisely because conflating the two axes was the bug. A task
      //     cannot be shelved on its own any more — its project is shelved instead.
      //
      // The value of naming them here is ONE definition instead of the same Or-chain
      // hand-copied into seven Filters across five screens. Any of those copies could
      // have drifted silently — a missing stage in one chain just makes rows vanish from
      // one screen, with nothing to see and nothing to catch it.
      //
      // WHY A NAMED FORMULA AND NOT A COLLECTION IN OnStart. Named formulas "can't use
      // behavior functions" (MS Learn, object-app#formulas-property), so ClearCollect
      // cannot live here at all — but that limitation is pointing at the better design:
      //  * these stay DELEGABLE, so they are evaluated by SharePoint, not capped at the
      //    2000-row data limit a ClearCollect would silently truncate at;
      //  * they are always fresh, which matters because this is a MULTI-USER app — a
      //    launch-time snapshot would hide a colleague's work until a manual refresh;
      //  * they are computed LAZILY, only when a screen actually uses one, and never
      //    block app start the way OnStart does.
      // There is no penalty for a definition the app doesn't use.
      //
      // ENUMERATING the live values is what makes ActiveProjects delegable: `<>
      // "Archived"` is a Text <> and does NOT delegate. Keep the list in step with the
      // Choice values in schema/schema.yaml — a value added there and missed here
      // disappears from the app with nothing to see and nothing to catch it.
      //
      // NOT YET PROVEN: whether a screen-level `Filter(ActiveProjects, …)` still folds
      // into ONE server query. Nested Filter over a named formula is the single
      // unverified step in stage 1, which is why only one screen is converted so far.
      ActiveProjects = Filter( taskmaster_projects,
          project_phase.Value = "Planning" || project_phase.Value = "Active"
       || project_phase.Value = "Blocked"  || project_phase.Value = "Complete" );

      // NO TASK SET AT ALL, and that is the point of the 2026-08-12 schema change.
      // `UnarchivedTasks` lived here for one day: it enumerated the six non-archived
      // stages so Archived could be excluded server-side. **task_stage no longer HAS
      // an "Archived" value**, so every stage is live and the filter it existed to
      // express is the identity. The same six-value Or-chain has been deleted from
      // five screens for the same reason — it is not simplification, it is a filter
      // that now selects everything, and one that would silently drop any row with a
      // blank stage.
      //
      // AXIS 2 for ISSUES only, and it is a lifecycle, not archiving. The four
      // statuses are Open plus three terminal ones, so "open" is a single equality —
      // which delegates more cheaply than the four-way Or-chain it replaced.
      OpenIssues = Filter( taskmaster_issues, issue_status.Value = "Open" );

      // AXIS 1, and the ONLY set that answers "is this project archived". Screens that
      // load children ACROSS projects collect this once and test membership locally.
      //
      // WHY MEMBERSHIP-TESTED LOCALLY AND NOT FILTERED SERVER-SIDE: a child row carries
      // only `*_project_id`, never the parent's phase, so "parent is not archived" needs
      // a join — and neither a join nor `in` over a set delegates to SharePoint. The
      // alternative is denormalising an archived flag onto all three child lists and
      // cascading it on every phase change; that is a schema change plus a bulk write,
      // and it is NOT needed here because every cross-project child query is ALREADY
      // narrow (my tasks, my issues) or capped (FirstN 50). Local is correct and free.
      //
      // NOT a named formula used directly in a predicate: a named formula over a data
      // source re-queries, and evaluating one inside a per-row RemoveIf could issue a
      // call per row. The screens ClearCollect it ONCE, then test against the local copy.
      ArchivedProjects = Filter( taskmaster_projects, project_phase.Value = "Archived" );

      // NO transaction set on either axis. taskmaster_transactions has NO status, stage
      // or archived column at all, so a transaction's liveness is ENTIRELY its project's.

      // --- Person-column claims prefix --------------------------------------------
      // A SharePoint Person column is patched as an expanded-user record whose Claims
      // string is this prefix plus the LOWERCASED user principal name. One definition
      // so the four edit screens cannot drift from each other:
      //
      //   { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
      //     Claims: ClaimPrefix & Lower(<mail>), DisplayName: ..., Email: ...,
      //     Department: "", JobTitle: "", Picture: "" }
      //
      // COMMUNITY-CONFIRMED shape, not first-party — same risk class as the managed-
      // metadata write (docs/managed-metadata-picker.md §2). If a Person write fails on
      // first paste, this line and the record shape around it are the first suspects.
      ClaimPrefix = "i:0#.f|membership|";

      // --- NO FX TABLE HERE, DELIBERATELY (Q14 decided 2026-08-03) ----------------
      // An `FxToUsd` table briefly lived here so the transaction form could normalise
      // transaction_notional_usd at write time. It has been REMOVED: currency
      // conversion now happens in the REPORT layer, against a proper FX dimension in
      // Power BI, and the app writes only the native `transaction_notional` +
      // `transaction_currency`.
      //
      // Why this is the better place for it: a write-time rate freezes whatever number
      // happened to be in the app on the day of the trade, and nothing downstream can
      // ever correct it. Report-time conversion can be restated, back-dated and audited.
      //
      // CONSEQUENCE, and it is a real one: **the app can no longer show a
      // cross-currency total anywhere.** Any figure that mixes currencies must either
      // be shown per-currency or deferred to Power BI — see scrProject's transactions
      // tab, which now totals per currency and says so. Do not reintroduce a rate table
      // to "just add a total".
      // --- Write-back: recompute one project's % (app-side writer, C3) -------------
      // IMPLEMENTED in src/Screens/scrTaskEdit.pa.yaml -> btnTkSave.OnSelect, which since
      // 2026-08-10 is the SOLE writer of a task (scrTask was deleted — two writers for one
      // row is how the completion date drifted). This block is the reference for any OTHER
      // place a stage can change (a kanban drag, the editable grid's save). Substitute the
      // project's ID for <pid>.
      //
      //   With(
      //       { scored:
      //           AddColumns(
      //               // Delegable: `=` on an indexed Lookup FK, and nothing else needed.
      //               // The six-stage Or-chain that used to sit here was deleted on
      //               // 2026-08-12 — task_stage has no "Archived" value to exclude any
      //               // more, so every task under the project counts.
      //               Filter( taskmaster_tasks, task_project_id.Id = <pid> ),
      //               wgt, Coalesce(LookUp(StageWeights, Stage = task_stage.Value, Weight), 0) ) },
      //       Patch( taskmaster_projects,
      //              LookUp(taskmaster_projects, ID = <pid>),
      //              { project_perc_completion:
      //                    If( CountRows(scored) = 0, 0, RoundDown(Average(scored, wgt), 0) ) } )
      //   )
      //
      // Notes:
      //  * Average/CountRows here run LOCALLY over the already-filtered page — correct
      //    because the Filter narrows to one project first. Only exact if a project
      //    holds fewer tasks than the data row limit (set it to 2000).
      //  * App-side writer means the value is only as fresh as the app: a stage edited
      //    directly in SharePoint leaves project_perc_completion stale until the next
      //    in-app change to that project.
