# App object. Two formula-bar properties: OnStart holds the constants, Formulas
# holds the data-source filters. Both are pasted by hand — see the studio-transfer
# skill, and tools/formula_bar_body.py for a comment-free body.
App:
  Properties:
    # `Set`, not named formulas: named formulas did not resolve in the published app,
    # which blanked every colour and dimension.
    # `gTheme`, NOT `Theme` — `Theme` collides with modern theming (Power Apps defines
    # App.Theme and loads theme objects by instance name). Studio tolerates the collision
    # silently; the player does not.
    OnStart: |-
      =
       Set( gTheme, {
          Color: {
              Primary:      RGBA(0,  90, 158, 1),
              PrimaryDark:  RGBA(0,  60, 110, 1),
              Accent:       RGBA(102, 182, 227, 1),
              Bg:           RGBA(245, 247, 250, 1),
              Surface:      RGBA(255, 255, 255, 1),
              Border:       RGBA(225, 229, 235, 1),
              TextPrimary:  RGBA(32,  38,  45,  1),
              TextMuted:    RGBA(110, 120, 130, 1),
              OnPrimary:    RGBA(255, 255, 255, 1),
              Success:      RGBA(49,  130, 93,  1),
              Warning:      RGBA(214, 152, 40,  1),
              Danger:       RGBA(197, 58,  58,  1),
              // Wash tints for the transparent hit buttons layered OVER gallery rows. They must
              // stay low-alpha: the hit button is declared last, so whatever it paints covers the
              // row's own text. A classic Button left without HoverFill derives one by dimming Fill
              // 20%, which on a transparent fill reads as a solid block and hides the row.
              Hover:        RGBA(0,  90, 158, 0.05),
              Press:        RGBA(0,  90, 158, 0.1)
          },
          Size: { H1: 28, H2: 20, H3: 16, Body: 14, Small: 12 },
          Space: { Gutter: 24, Gap: 16, HeaderH: 64, NavW: 240, RowH: 52 },
          Font: Font.'Segoe UI'
       } );

       // Key maps to a Navigate in each nav gallery's Switch — keep them in step.
       Set( gNavMenu, Table(
          { Key: 1, Title: "Home",      Icon: Icon.Home       },
          { Key: 2, Title: "Reports",   Icon: Icon.DetailList },
          { Key: 3, Title: "Projects",  Icon: Icon.Document   },
          { Key: 4, Title: "Reference", Icon: Icon.Bookmark   }
       ) );

       // Mirrors schema.yaml -> rollups.stage_weights. Keep the two in step.
       Set( gStageWeights, Table(
          { Stage: "Not Started",  Weight: 0   },
          { Stage: "Planning",     Weight: 10  },
          { Stage: "Drafting",     Weight: 35  },
          { Stage: "Finalizing",   Weight: 85  },
          { Stage: "Completed",     Weight: 100 }
       ) );

       // MUST EQUAL Settings > General > Data row limit. That setting does NOT travel in a
       // paste or an export and Power Fx cannot read it, so this constant is the app's only
       // record of it. If the two disagree every truncation sentinel compares against the
       // wrong ceiling and goes dead at the same moment — silently, because the one mechanism
       // built to notice truncation is its own first casualty.
       // scrHome and scrReports seed the same value if OnStart has not finished. Keep the
       // three in step: `grep -rn gDataRowLimit src/` finds all of them.
       Set( gDataRowLimit, 2000 );

       // Prefix + lowercased UPN forms a Person column's Claims. Community-confirmed shape,
       // not first-party: first suspect if a Person write fails.
       Set( gClaimPrefix, "i:0#.f|membership|" );

       // THREE IDENTITIES, NOT ONE, AND THAT IS A DEFECT FIX RATHER THAN CAUTION.
       // The pickers WRITE a Person column from Office365Users.SearchUserV2(...).Mail —
       // the mailbox address — while every "mine" predicate READ User().Email, which is
       // a different Azure AD attribute and is commonly the UPN. They coincide for most
       // people and silently do not for anyone whose UPN differs from their primary
       // SMTP: every equality fails at once, so that user sees no projects of their own
       // and an empty dashboard, with no error anywhere (user report, 2026-09-08).
       // So the predicates OR over all three known forms. When they are equal the extra
       // arms are redundant and harmless; when they are not, one of them matches.
       // NONE OF THESE MAY EVER BE BLANK. project_supporter and task_supporter are
       // OPTIONAL columns, so `supporter.Email = ""` would match every row that has no
       // supporter and hand the user somebody else's work. Each falls back to
       // gUserEmail, which is never blank.
       // Office365Users.MyProfile() is documented with no inputs and both Mail and
       // UserPrincipalName as outputs (MS Learn, connection-office365-users). It is
       // wrapped because a connector call at start-up must not be able to stop OnStart.
       Set( gUserEmail, Lower(User().Email) );
       IfError( Set( gUserProfile, Office365Users.MyProfile() ),
                Set( gUserProfile, Blank() ) );
       Set( gUserMail, Coalesce( Lower(gUserProfile.Mail), gUserEmail ) );
       Set( gUserUpn,  Coalesce( Lower(gUserProfile.UserPrincipalName), gUserEmail ) )

    # Data-source filters. These must stay NAMED FORMULAS: `Set(x, Filter(...))` captures
    # a table value, and filtering a variable does not delegate — every cross-project query
    # would silently cap at the data row limit. Filtering OVER one of these folds into a
    # single server query (verified in Live Monitor). Only CROSS-PROJECT queries use them.
    Formulas: |-
      =
      // Every phase except Archived, ENUMERATED — `<> "Archived"` is a Text <> and does not
      // delegate. This is the column's whole vocabulary minus one value, so a value added to
      // the column and not added here vanishes from the app rather than erroring: an
      // allow-list fails CLOSED.
      ActiveProjects = Filter( taskmaster_projects,
          project_phase.Value = "Not Started" || project_phase.Value = "Planning"
       || project_phase.Value = "Active"      || project_phase.Value = "Stalled"
       || project_phase.Value = "Complete" );

      // The same vocabulary MINUS "Complete" — the set behind the "show completed" toggle
      // when it is OFF. Enumerated for the same reason ActiveProjects is, and failing closed
      // the same way: this and ActiveProjects must both stay in step with project_phase's
      // values in schema/schema.yaml, so a phase added there and not here disappears from
      // the app rather than erroring.
      OpenProjects = Filter( taskmaster_projects,
          project_phase.Value = "Not Started" || project_phase.Value = "Planning"
       || project_phase.Value = "Active"      || project_phase.Value = "Stalled" );

      // Two axes at once: the project is live, and the issue's own status is Open.
      OpenIssues = Filter( taskmaster_issues,
          issue_project_archived = false && issue_status.Value = "Open" );

      // `*_project_archived` mirrors the parent's phase, maintained by scrProjectEdit's
      // save. A child row cannot otherwise answer "is my project archived" without a join,
      // and joins do not delegate.
      LiveTasks = Filter( taskmaster_tasks, task_project_archived = false );

      LiveTransactions = Filter( taskmaster_transactions,
          transaction_project_archived = false );

      // EVERY live issue, open or closed. OpenIssues above is the NARROWER set and both are
      // used — the dashboard wants open ones, a project wants all of them. Do not collapse
      // the two into one.
      LiveIssues = Filter( taskmaster_issues, issue_project_archived = false );

      // `= false` does not match a BLANK, so this depends on taskproduct_project_archived being
      // populated on every row. It is (back-filled 2026-09-02) and scrTaskEdit writes false on
      // every link it creates. A link that ever loses the value again vanishes from the app
      // silently — the read paths use this, the delete path deliberately does not.
      LiveTaskProducts = Filter( taskmaster_taskproduct,
          taskproduct_project_archived = false );
