            Height: =Parent.Height
            OnSelect: =Set(gNiOpen, false)
      - mdNiBg:
          Control: Rectangle@2.3.0
          Properties:
            Visible: =gNiOpen
            Fill: =Theme.Color.Surface
            BorderColor: =Theme.Color.Border
            BorderThickness: =1
            X: =(Parent.Width - 700) / 2
            Y: =(Parent.Height - 540) / 2
            Width: =700
            Height: =540
      - mdNiBody:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Visible: =gNiOpen
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =24
            PaddingBottom: =16
            PaddingLeft: =24
            PaddingRight: =24
            X: =(Parent.Width - 700) / 2
            Y: =(Parent.Height - 540) / 2
            Width: =700
            Height: =460
          Children:
            - mdNiTitle:
                Control: Label@2.5.1
                Properties:
                  Text: ="Add an issue"
                  Font: =Theme.Font
                  FontWeight: =FontWeight.Semibold
                  Size: =Theme.Size.H3
                  Color: =Theme.Color.TextPrimary
                  Width: =Parent.Width - 48
                  Height: =28
            - rowNiName:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =8
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - lblNiNameCap:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="Issue summary  *"
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextMuted
                        Width: =Parent.Width
                        Height: =18
                  - txtNiName:
                      Control: ModernTextInput@1.0.0
                      Properties:
                        Default: =""
                        Placeholder: ="What is the issue?"
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Width: =Parent.Width
                        Height: =36
            - rowNiMeta:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =24
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - colNiStatus:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =(Parent.Width - 24) / 2
                        Height: =62
                      Children:
                        - lblNiStatCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Status"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        # WAS ["Open","In Progress","Blocked","Resolved"] — two of those
                        # are not members of issue_status. schema/schema.yaml is the
                        # golden source: [Open, Review, Waiting, Blocked, Closed].
                        - cboNiStatus:
                            Control: ModernCombobox@1.0.0
                            Properties:
                              Items: =["Open", "Review", "Waiting", "Blocked", "Closed"]
                              ItemDisplayText: =ThisItem.Value
                              InputTextPlaceholder: ="Status"
                              SelectMultiple: =false
                              IsSearchable: =false
                              DefaultSelectedItems: =[gNiStatus]
                              Width: =Parent.Width
                              Height: =36
                              OnChange: =Set(gNiStatus, cboNiStatus.Selected.Value)
                  - colNiImpact:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =(Parent.Width - 24) / 2
                        Height: =62
                      Children:
                        - lblNiImpCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Impact"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        # WAS ["Low","Medium","High"] — "Medium" is not a member of
                        # issue_impact, which is [Low, Moderate, High, Critical].
                        - cboNiImpact:
                            Control: ModernCombobox@1.0.0
                            Properties:
                              Items: =["Low", "Moderate", "High", "Critical"]
                              ItemDisplayText: =ThisItem.Value
                              InputTextPlaceholder: ="Impact"
                              SelectMultiple: =false
                              IsSearchable: =false
                              DefaultSelectedItems: =[gNiImpact]
                              Width: =Parent.Width
                              Height: =36
                              OnChange: =Set(gNiImpact, cboNiImpact.Selected.Value)
            - rowNiAssignee:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =24
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - colNiAssSearch:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =(Parent.Width - 24) / 2
                        Height: =62
                      Children:
                        - lblNiAssCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Assignee  *  —  anyone in the directory"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - txtNiAssSearch:
                            Control: ModernTextInput@1.0.0
                            Properties:
                              Type: =TextInputType.Search
                              Default: =""
                              Placeholder: ="Type a name…"
                              TriggerOutput: =TriggerOutput.Delayed
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Width: =Parent.Width
                              Height: =36
                  - colNiAssChip:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =(Parent.Width - 24) / 2
                        Height: =62
                      Children:
                        - lblNiAssChipCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Selected"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - btnNiAssChip:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: =If(Len(gNiAssignee.Mail) > 0, gNiAssignee.DisplayName & "     ✕", "— nobody selected —")
                              Align: =Align.Left
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Fill: =RGBA(0, 0, 0, 0)
                              Color: =If(Len(gNiAssignee.Mail) > 0, Theme.Color.TextPrimary, Theme.Color.TextMuted)
                              BorderColor: =Theme.Color.Border
                              BorderThickness: =1
                              DisplayMode: =If(Len(gNiAssignee.Mail) > 0, DisplayMode.Edit, DisplayMode.Disabled)
                              Width: =Parent.Width
                              Height: =36
                              OnSelect: |
                                =Set(gNiAssignee, { DisplayName: "", Mail: "" });
                                 Reset(txtNiAssSearch)
            - galNiAss:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  Visible: =Len(txtNiAssSearch.Text) >= 2 && Len(gNiAssignee.Mail) = 0
                  Items: |
                    =Office365Users.SearchUserV2({ searchTerm: txtNiAssSearch.Text, top: 6 }).value
                  TemplateSize: =32
                  TemplatePadding: =0
                  TemplateFill: =Theme.Color.Surface
                  BorderColor: =Theme.Color.Border
                  BorderThickness: =1
                  Width: =Parent.Width - 48
                  Height: =132
                Children:
                  - rowNiAss:
                      Control: Label@2.5.1
                      Properties:
                        Text: =ThisItem.DisplayName & "     " & ThisItem.Mail
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextPrimary
                        X: =12
                        Y: =0
                        Width: =Parent.TemplateWidth - 24
                        Height: =32
                        VerticalAlign: =VerticalAlign.Middle
                  - hitNiAss:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        OnSelect: |
                          =Select(Parent);
                           Set(gNiAssignee, { DisplayName: ThisItem.DisplayName, Mail: ThisItem.Mail });
                           Reset(txtNiAssSearch)
      - mdNiAdd:
          Control: ModernButton@1.0.0
          Properties:
            Visible: =gNiOpen
            Appearance: =ButtonAppearance.Primary
            Text: ="Add issue"
            DisplayMode: |
              =If( Len(Trim(txtNiName.Text)) > 0 && Len(gNiAssignee.Mail) > 0,
                   DisplayMode.Edit, DisplayMode.Disabled )
            X: =(Parent.Width - 700) / 2 + 700 - 24 - 140
            Y: =(Parent.Height - 540) / 2 + 540 - 24 - 40
            Width: =140
            Height: =40
            OnSelect: |
              =Collect( colNewIssues,
                  { sid:            If( IsEmpty(colNewIssues), 1, Max(colNewIssues, sid) + 1 ),
                    i_name:         Trim(txtNiName.Text),
                    i_status:       gNiStatus,
                    i_impact:       gNiImpact,
                    i_assigneeName: gNiAssignee.DisplayName,
                    i_assigneeMail: gNiAssignee.Mail } );
               Reset( txtNiName ); Reset( txtNiAssSearch );
               Set( gNiAssignee, { DisplayName: "", Mail: "" } );
               Set( gNiStatus, "Open" ); Set( gNiImpact, "Moderate" );
               Set( gNiOpen, false )
      - mdNiCancel:
          Control: ModernButton@1.0.0
          Properties:
            Visible: =gNiOpen
            Appearance: =ButtonAppearance.Outline
            Text: ="Cancel"
            X: =(Parent.Width - 700) / 2 + 700 - 24 - 140 - 12 - 120
            Y: =(Parent.Height - 540) / 2 + 540 - 24 - 40
            Width: =120
            Height: =40
            OnSelect: |
              =Reset( txtNiName ); Reset( txtNiAssSearch );
               Set( gNiAssignee, { DisplayName: "", Mail: "" } );
               Set( gNiStatus, "Open" ); Set( gNiImpact, "Moderate" );
               Set( gNiOpen, false )
