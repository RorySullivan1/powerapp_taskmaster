            Color: =Theme.Color.TextPrimary
            X: =(Parent.Width - 680) / 2 + 24
            Y: =(Parent.Height - 520) / 2 + 300 + 38
            Width: =300
            Height: =20
            Visible: =gNiOpen
      - icoNiAssClear:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Visible: =gNiOpen
            Color: =Theme.Color.TextMuted
            X: =(Parent.Width - 680) / 2 + 24 + 300 + 8
            Y: =(Parent.Height - 520) / 2 + 300 + 40
            Width: =16
            Height: =16
            OnSelect: |
              =Set(gNiAssignee, { DisplayName: "", Mail: "" })
      - galNiAss:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Visible: =gNiOpen
            Items: |
              =Office365Users.SearchUserV2({ searchTerm: txtNiAssSearch.Text, top: 6 }).value
            TemplateSize: =32
            TemplatePadding: =0
            TemplateFill: =Theme.Color.Surface
            BorderColor: =Theme.Color.Border
            BorderThickness: =1
            X: =(Parent.Width - 680) / 2 + 24
            Y: =(Parent.Height - 520) / 2 + 300 + 38
            Width: =300
            Height: =104
          Children:
            - rowNiAss:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.DisplayName
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextPrimary
                  X: =8
                  Y: =0
                  Width: =Parent.TemplateWidth - 16
                  Height: =32
            - hitNiAss:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  OnSelect: |
                    =Select(Parent);
                     Set(gNiAssignee, { DisplayName: ThisItem.DisplayName, Mail: ThisItem.Mail });
                     Reset(txtNiAssSearch)
      - mdNiAdd:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Add"
            Fill: =Theme.Color.Primary
            Color: =Theme.Color.OnPrimary
            BorderColor: =Theme.Color.Primary
            Font: =Theme.Font
            Size: =Theme.Size.Small
            DisplayMode: |
              =If( Len(Trim(txtNiName.Text)) > 0 && Len(gNiAssignee.Mail) > 0,
                   DisplayMode.Edit, DisplayMode.Disabled )
            X: =(Parent.Width - 680) / 2 + 24
            Y: =(Parent.Height - 520) / 2 + 520 - 60
            Width: =140
            Height: =40
            OnSelect: |
              =Collect( colNewIssues,
                  { sid:            If( IsEmpty(colNewIssues), 1, Max(colNewIssues, sid) + 1 ),
                    i_name:         Trim(txtNiName.Text),
                    i_status:       gNiStatus,
                    i_impact:       gNiImpact,
                    i_assigneeName: gNiAssignee.DisplayName,
                    i_assigneeMail: gNiAssignee.Mail } );
               Reset( txtNiName ); Reset( txtNiAssSearch );
               Set( gNiAssignee, { DisplayName: "", Mail: "" } );
               Set(gNiOpen, false)
            Visible: =gNiOpen
      - mdNiCancel:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Cancel"
            Fill: =Theme.Color.Surface
            Color: =Theme.Color.TextPrimary
            BorderColor: =Theme.Color.Border
            BorderThickness: =1
            Font: =Theme.Font
            Size: =Theme.Size.Small
            X: =(Parent.Width - 680) / 2 + 176
            Y: =(Parent.Height - 520) / 2 + 520 - 60
            Width: =120
            Height: =40
            OnSelect: |
              =Reset( txtNiName ); Reset( txtNiAssSearch );
               Set( gNiAssignee, { DisplayName: "", Mail: "" } );
               Set(gNiOpen, false)
            Visible: =gNiOpen
