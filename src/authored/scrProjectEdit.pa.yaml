# =============================================================================
# scrProjectEdit  —  create / edit a project.  ONE SCROLLING COLUMN, NO TABS.
# =============================================================================
# The five tabs are gone. Everything lives in `frmPrScroll`, a single vertical
# auto-layout container with a headed section per former tab:
#
#     Details · Classification · Tasks · Transactions · Issues
#
# WHY THIS SHAPE, beyond the ask:
#
#  * CHILDREN CARRY NO X/Y. The container places them. X/Y/Width/Height are the
#    properties Studio freezes into constants on paste, so container-laid-out
#    content is the only layout that survives this gap intact — the class of bug
#    that put galProjects on top of its own filter row cannot occur in here.
#
#  * A HIDDEN CHILD TAKES NO SPACE. Each people picker's results gallery now sits
#    INLINE, immediately after its search box, and expands the column when it
#    opens. That retires the whole absolute-overlay pattern: no z-order, no
#    dropdown covering the fields below it, and no one-picker-at-a-time gate
#    (`gPrPicker` is gone). Two dropdowns open at once is simply two expanded
#    sections now.
#
#  * NO TAB STATE. `gPrTab` is gone with the tabs, and with it the cmpSelection
#    strip whose OnChange read `Selected.Id` in the same behaviour pass that set
#    it — the race that stopped tab switching working at all.
#
# FIXED FURNITURE stays absolutely positioned, outside the container: the header
# band (0–64), the validation message (652–700) and the Save / Cancel bar (706).
# The container occupies 64 .. Parent.Height - 120 and scrolls.
#
# ONE INFERRED TOKEN: `LayoutAlignItems.Start`. The container control, its
# variant, LayoutDirection, LayoutGap, LayoutOverflowY and the enum
# `LayoutOverflow.Scroll` are all confirmed from Studio code-view photos; only
# `.Center` is confirmed for LayoutAlignItems, and Start/End/Stretch are read
# from the docs' display names. If the paste is rejected, that is the first line
# to change — `=LayoutAlignItems.Center` is the confirmed fallback.
#
# Everything else — every formula, every column token, the guarded Patch pass,
# the staged-children writer — is unchanged from the tabbed version.
# See _EDIT-NOTES.md for the shared edit-screen pattern.
# =============================================================================
Screens:
  scrProjectEdit:
    Properties:
      Fill: =Theme.Color.Bg
      OnVisible: |
        =        Set( gPrManager,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditProject.project_manager.DisplayName, ""),
                    Mail:        Coalesce(gEditProject.project_manager.Email, "") },
                  { DisplayName: Coalesce(User().FullName, ""), Mail: Coalesce(User().Email, "") } ) );
        Set( gPrRequestor,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditProject.project_requestor.DisplayName, ""),
                    Mail:        Coalesce(gEditProject.project_requestor.Email, "") },
                  { DisplayName: "", Mail: "" } ) );
        Set( gPrSupporter,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditProject.project_supporter.DisplayName, ""),
                    Mail:        Coalesce(gEditProject.project_supporter.Email, "") },
                  { DisplayName: "", Mail: "" } ) );
        Set( gPrPhase,    If( gEditMode = "Edit", Coalesce(gEditProject.project_phase.Value, "Planning"), "Planning" ) );
        Set( gPrPriority, If( gEditMode = "Edit", Coalesce(gEditProject.project_priority.Value, "Moderate"), "Moderate" ) );
        // Managed metadata (C10). Empty on entry in BOTH modes: what the connector
        // returns for an EXISTING value is not in the picker's path form, so on Edit
        // the columns are left untouched unless the user actively re-picks. The
        // current labels are shown beside the pickers so nothing looks lost.
        //
        // No term collections are built here. Each picker reads the term store
        // DIRECTLY through Choices() on its own instance — see the Terms bindings.
        Set( gPrRegionLabel, "" ); Set( gPrRegionPath, "" ); Set( gPrRegionDone, false );
        Set( gPrTypeLabel,   "" ); Set( gPrTypePath,   "" ); Set( gPrTypeDone,   false );
        Set( gPrCovLabel,    "" ); Set( gPrCovPath,    "" ); Set( gPrCovDone,    false );
        // Staging areas. Cleared on every visit — a half-entered child list left
        // over from the previous project would be written to THIS one.
        Clear( colNewTasks ); Clear( colNewTransactions ); Clear( colNewIssues );
        Clear( colChildResult ); Clear( colChildErrors ); Clear( colChildOk );
        Set( gNtPriority, "Moderate" ); Set( gNtLeadWho, "Manager" );
        Set( gNxCcy, "USD" ); Set( gNxSalesWho, "Manager" );
        Set( gNxClient,  { Id: 0, Value: "" } );
        Set( gNxProduct, { Id: 0, Value: "" } );
        Set( gNiStatus, "Open" ); Set( gNiImpact, "(none)" ); Set( gNiAssigneeWho, "Manager" );
        Reset( txtPrName ); Reset( txtPrPathway ); Reset( txtPrDesc );
        Reset( txtPrStart ); Reset( txtPrTarget ); Reset( txtPrComplete );
        Reset( txtPrManagerSearch ); Reset( txtPrRequestorSearch ); Reset( txtPrSupporterSearch );
        Reset( txtNtName ); Reset( txtNtTarget );
        Reset( txtNxName ); Reset( txtNxNotional ); Reset( txtNxDate );
        Reset( txtNxClientSearch ); Reset( txtNxProductSearch );
        Reset( txtNiName )
    Children:
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Primary
            Height: =Theme.Space.HeaderH
            Width: =Parent.Width
            X: =0
            Y: =0
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: =If(gEditMode = "Edit", "Edit project", "New project")
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            FontWeight: =FontWeight.Semibold
            Size: =Theme.Size.H2
            Height: =Theme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Theme.Space.Gutter
            Y: =0
            Width: =400
      - lblPrStagedCount:
          Control: Label@2.5.1
          Properties:
            Text: |
              =CountRows(colNewTasks) & " task(s) · " & CountRows(colNewTransactions)
               & " transaction(s) · " & CountRows(colNewIssues) & " issue(s) staged"
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Align: =Align.Right
            Height: =Theme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Parent.Width - 500 - Theme.Space.Gutter
            Y: =0
            Width: =460
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =Theme.Color.OnPrimary
            Height: =24
            Width: =24
            X: =Parent.Width - 24 - Theme.Space.Gutter
            Y: =(Theme.Space.HeaderH - 24) / 2
            OnSelect: =Back()
      # ---- THE SCROLLING FORM ------------------------------------------
      # One vertical auto-layout container, five headed sections, no tabs.
      # Children carry NO X/Y: the container stacks them, which also makes
      # this the only layout Studio cannot freeze into constants on paste.
      # A hidden child takes no space, so each picker's results gallery sits
      # INLINE after its search box and expands the column instead of
      # overlaying the fields below it.
      - frmPrScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Start
            LayoutGap: =8
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =16
            PaddingBottom: =16
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =64
            Width: =Parent.Width
            Height: =Parent.Height - 64 - 120
          Children:
            # ===== DETAILS =====
            - secHeadDetails:
                Control: Label@2.5.1
                Properties:
                  Text: ="Details"
                  Font: =Theme.Font
                  FontWeight: =FontWeight.Semibold
                  Size: =Theme.Size.H3
                  Color: =Theme.Color.Primary
                  Width: =1200
                  Height: =28
            - lblPrNameCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Project name  *"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =520
                  Height: =18
            - lblPrPhaseCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Phase  *"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =760
                  Height: =18
            - txtPrName:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =If(gEditMode = "Edit", gEditProject.project_name, "")
                  HintText: ="What is this project called?"
                  Font: =Theme.Font
                  Size: =Theme.Size.Body
                  Width: =520
                  Height: =40
            - selPrPhase:
                Control: CanvasComponent
                ComponentName: cmpSelection
                Properties:
                  Width: =700
                  Height: =40
                  Items: |
                    =Table( { Id: 1, Label: "Planning" }, { Id: 2, Label: "Active" },
                            { Id: 3, Label: "Blocked" },  { Id: 4, Label: "Complete" },
                            { Id: 5, Label: "Archived" } )
                  DefaultId: |
                    =Switch( If(gEditMode = "Edit", Coalesce(gEditProject.project_phase.Value, "Planning"), "Planning"),
                             "Planning", 1, "Active", 2, "Blocked", 3, "Complete", 4, 5 )
                  OnChange: =Set(gPrPhase, selPrPhase.Selected.Label)
            - lblPrPathCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Shared-drive path"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =520
                  Height: =18
            - lblPrPriorityCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Priority  *"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =760
                  Height: =18
            - txtPrPathway:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =If(gEditMode = "Edit", gEditProject.project_pathway, "")
                  HintText: ="\\share\eqd\projects\…"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Width: =520
                  Height: =36
            - selPrPriority:
                Control: CanvasComponent
                ComponentName: cmpSelection
                Properties:
                  Width: =700
                  Height: =40
                  Items: |
                    =Table( { Id: 1, Label: "Lowest" }, { Id: 2, Label: "Low" },
                            { Id: 3, Label: "Moderate" }, { Id: 4, Label: "High" },
                            { Id: 5, Label: "Critical" } )
                  DefaultId: |
                    =Switch( If(gEditMode = "Edit", Coalesce(gEditProject.project_priority.Value, "Moderate"), "Moderate"),
                             "Lowest", 1, "Low", 2, "Moderate", 3, "High", 4, 5 )
                  OnChange: =Set(gPrPriority, selPrPriority.Selected.Label)
            - lblPrDescCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Description"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =520
                  Height: =18
            - lblPrStartCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Start date"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =240
                  Height: =18
            - lblPrTargetCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Target date"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =240
                  Height: =18
            - txtPrDesc:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =If(gEditMode = "Edit", gEditProject.project_description, "")
                  Mode: =TextMode.MultiLine
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Width: =520
                  Height: =100
            - txtPrStart:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: |
                    =If( gEditMode = "Edit",
                         If( IsBlank(gEditProject.project_date_start), "",
                             Text(gEditProject.project_date_start, "dd/mm/yyyy") ),
                         Text(Today(), "dd/mm/yyyy") )
                  HintText: ="dd/mm/yyyy"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Width: =160
                  Height: =36
            - lblPrStartEcho:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =If( Len(txtPrStart.Text) = 0, "not set",
                         IfError( Text(DateValue(txtPrStart.Text), "dd mmm yyyy"), "⚠ not a date" ) )
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: |
                    =If( Len(txtPrStart.Text) > 0 && IsError(DateValue(txtPrStart.Text)),
                         Theme.Color.Danger, Theme.Color.TextMuted )
                  Width: =160
                  Height: =36
                  VerticalAlign: =VerticalAlign.Middle
            - txtPrTarget:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: |
                    =If( gEditMode = "Edit" && !IsBlank(gEditProject.project_date_target),
                         Text(gEditProject.project_date_target, "dd/mm/yyyy"), "" )
                  HintText: ="dd/mm/yyyy"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Width: =160
                  Height: =36
            - lblPrTargetEcho:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =If( Len(txtPrTarget.Text) = 0, "not set",
                         IfError( Text(DateValue(txtPrTarget.Text), "dd mmm yyyy"), "⚠ not a date" ) )
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: |
                    =If( Len(txtPrTarget.Text) > 0 && IsError(DateValue(txtPrTarget.Text)),
                         Theme.Color.Danger, Theme.Color.TextMuted )
                  Width: =160
                  Height: =36
                  VerticalAlign: =VerticalAlign.Middle
            - lblPrCompleteCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Completion date"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =240
                  Height: =18
            - txtPrComplete:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: |
                    =If( gEditMode = "Edit" && !IsBlank(gEditProject.project_date_complete),
                         Text(gEditProject.project_date_complete, "dd/mm/yyyy"), "" )
                  HintText: ="dd/mm/yyyy"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Width: =160
                  Height: =36
            - lblPrCompleteEcho:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =If( Len(txtPrComplete.Text) = 0, "not set",
                         IfError( Text(DateValue(txtPrComplete.Text), "dd mmm yyyy"), "⚠ not a date" ) )
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: |
                    =If( Len(txtPrComplete.Text) > 0 && IsError(DateValue(txtPrComplete.Text)),
                         Theme.Color.Danger, Theme.Color.TextMuted )
                  Width: =200
                  Height: =36
                  VerticalAlign: =VerticalAlign.Middle
            - lblPrMgrCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Project manager  *"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =520
                  Height: =18
            - lblPrPercNote:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    ="Completion % is not entered by hand — it is a weighted rollup of this project's task stages, rewritten whenever a task is saved. Currently "
                     & If( gEditMode = "Edit", Coalesce(gEditProject.project_perc_completion, 0) & "%", "0% (new project)" ) & "."
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =700
                  Height: =40
            - txtPrManagerSearch:
                Control: Classic/TextInput@2.3.2
                Properties:
                  HintText: ="Search people…"
                  DelayOutput: =true
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Width: =280
                  Height: =36
            - galPrManager:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  Visible: =Len(txtPrManagerSearch.Text) >= 2 && Len(gPrManager.Mail) = 0
                  Items: |
                    =Office365Users.SearchUserV2({ searchTerm: txtPrManagerSearch.Text, top: 8 }).value
                  TemplateSize: =32
                  TemplatePadding: =0
                  BorderColor: =Theme.Color.Border
                  BorderThickness: =1
                  Width: =280
                  Height: =132
                  TemplateFill: =Theme.Color.Surface
                Children:
                  - rowPrManager:
                      Control: Label@2.5.1
                      Properties:
                        Text: =ThisItem.DisplayName
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextPrimary
                        X: =8
                        Y: =0
                        Width: =Parent.TemplateWidth - 16
                        Height: =32
                        VerticalAlign: =VerticalAlign.Middle
                  - galPrManagerHit:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        OnSelect: |
                          =Select(Parent);
                           Set(gPrManager, { DisplayName: ThisItem.DisplayName, Mail: ThisItem.Mail })
            - lblPrMgrChip:
                Control: Label@2.5.1
                Properties:
                  Text: =If(Len(gPrManager.Mail) > 0, gPrManager.DisplayName, "— none selected —")
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =If(Len(gPrManager.Mail) > 0, Theme.Color.TextPrimary, Theme.Color.TextMuted)
                  Width: =208
                  Height: =36
                  VerticalAlign: =VerticalAlign.Middle
            - icoPrMgrClear:
                Control: Classic/Icon@2.5.0
                Properties:
                  Visible: =Len(gPrManager.Mail) > 0
                  Icon: =Icon.Cancel
                  Color: =Theme.Color.TextMuted
                  Height: =16
                  Width: =16
                  OnSelect: |
                    =Set(gPrManager, { DisplayName: "", Mail: "" })
            - lblPrReqCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Requestor"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =520
                  Height: =18
            - txtPrRequestorSearch:
                Control: Classic/TextInput@2.3.2
                Properties:
                  HintText: ="Search people…"
                  DelayOutput: =true
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Width: =280
                  Height: =36
            - galPrRequestor:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  Visible: =Len(txtPrRequestorSearch.Text) >= 2 && Len(gPrRequestor.Mail) = 0
                  Items: |
                    =Office365Users.SearchUserV2({ searchTerm: txtPrRequestorSearch.Text, top: 8 }).value
                  TemplateSize: =32
                  TemplatePadding: =0
                  BorderColor: =Theme.Color.Border
                  BorderThickness: =1
                  Width: =280
                  Height: =132
                  TemplateFill: =Theme.Color.Surface
                Children:
                  - rowPrRequestor:
                      Control: Label@2.5.1
                      Properties:
                        Text: =ThisItem.DisplayName
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextPrimary
                        X: =8
                        Y: =0
                        Width: =Parent.TemplateWidth - 16
                        Height: =32
                        VerticalAlign: =VerticalAlign.Middle
                  - galPrRequestorHit:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        OnSelect: |
                          =Select(Parent);
                           Set(gPrRequestor, { DisplayName: ThisItem.DisplayName, Mail: ThisItem.Mail })
            - lblPrReqChip:
                Control: Label@2.5.1
                Properties:
                  Text: =If(Len(gPrRequestor.Mail) > 0, gPrRequestor.DisplayName, "— none —")
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =If(Len(gPrRequestor.Mail) > 0, Theme.Color.TextPrimary, Theme.Color.TextMuted)
                  Width: =208
                  Height: =36
                  VerticalAlign: =VerticalAlign.Middle
            - icoPrReqClear:
                Control: Classic/Icon@2.5.0
                Properties:
                  Visible: =Len(gPrRequestor.Mail) > 0
                  Icon: =Icon.Cancel
                  Color: =Theme.Color.TextMuted
                  Height: =16
                  Width: =16
                  OnSelect: |
                    =Set(gPrRequestor, { DisplayName: "", Mail: "" })
            - lblPrSuppCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Supporter  (one extra person)"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =520
                  Height: =18
            - txtPrSupporterSearch:
                Control: Classic/TextInput@2.3.2
                Properties:
                  HintText: ="Search people…"
                  DelayOutput: =true
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Width: =280
                  Height: =36
            - galPrSupporter:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  Visible: =Len(txtPrSupporterSearch.Text) >= 2 && Len(gPrSupporter.Mail) = 0
                  Items: |
                    =Office365Users.SearchUserV2({ searchTerm: txtPrSupporterSearch.Text, top: 8 }).value
                  TemplateSize: =32
                  TemplatePadding: =0
                  BorderColor: =Theme.Color.Border
                  BorderThickness: =1
                  Width: =280
                  Height: =132
                  TemplateFill: =Theme.Color.Surface
                Children:
                  - rowPrSupporter:
                      Control: Label@2.5.1
                      Properties:
                        Text: =ThisItem.DisplayName
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextPrimary
                        X: =8
                        Y: =0
                        Width: =Parent.TemplateWidth - 16
                        Height: =32
                        VerticalAlign: =VerticalAlign.Middle
                  - galPrSupporterHit:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        OnSelect: |
                          =Select(Parent);
                           Set(gPrSupporter, { DisplayName: ThisItem.DisplayName, Mail: ThisItem.Mail })
            - lblPrSuppChip:
                Control: Label@2.5.1
                Properties:
                  Text: =If(Len(gPrSupporter.Mail) > 0, gPrSupporter.DisplayName, "— none —")
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =If(Len(gPrSupporter.Mail) > 0, Theme.Color.TextPrimary, Theme.Color.TextMuted)
                  Width: =208
                  Height: =36
                  VerticalAlign: =VerticalAlign.Middle
            - icoPrSuppClear:
                Control: Classic/Icon@2.5.0
                Properties:
                  Visible: =Len(gPrSupporter.Mail) > 0
                  Icon: =Icon.Cancel
                  Color: =Theme.Color.TextMuted
                  Height: =16
                  Width: =16
                  OnSelect: |
                    =Set(gPrSupporter, { DisplayName: "", Mail: "" })
            # ===== CLASSIFICATION =====
            - secHeadClassification:
                Control: Label@2.5.1
                Properties:
                  Text: ="Classification"
                  Font: =Theme.Font
                  FontWeight: =FontWeight.Semibold
                  Size: =Theme.Size.H3
                  Color: =Theme.Color.Primary
                  Width: =1200
                  Height: =28
            - lblPrClassNote:
                Control: Label@2.5.1
                Properties:
                  Text: ="Region and Type are REQUIRED by the list. Keep picking across the columns until no further column appears — the last term you pick is the one written."
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =760
                  Height: =18
            - pickPrRegion:
                Control: CanvasComponent
                ComponentName: cmpTermPicker
                Properties:
                  Width: =760
                  Height: =150
                  Caption: ="Region  *"
                  Terms: =ShowColumns( Choices([@taskmaster_projects].project_region), Label, Path )
                  OnChange: |
                    =Set( gPrRegionLabel, pickPrRegion.TermLabel );
                    Set( gPrRegionPath,  pickPrRegion.TermPath );
                    Set( gPrRegionDone,  pickPrRegion.IsComplete )
            - lblPrRegionState:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =If( Len(gPrRegionPath) > 0,
                         If( gPrRegionDone, "✓ " & gPrRegionLabel, "… " & gPrRegionLabel & " — keep going, this term has children" ),
                         gEditMode = "Edit",
                         "Currently: " & Coalesce(gEditProject.project_region.Value, "not set") & "   (leave alone to keep it)",
                         "Nothing picked yet" )
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =If( Len(gPrRegionPath) > 0 && !gPrRegionDone, Theme.Color.Warning, Theme.Color.TextMuted )
                  Width: =520
                  Height: =36
                  VerticalAlign: =VerticalAlign.Middle
            - pickPrType:
