            Fill: =If(gPrTab = 2, Theme.Color.Primary, Theme.Color.Surface)
            Color: =If(gPrTab = 2, Theme.Color.OnPrimary, Theme.Color.TextPrimary)
            BorderColor: =Theme.Color.Primary
            BorderThickness: =1
            Font: =Theme.Font
            Size: =Theme.Size.Small
            X: =24 + 152
            Y: =84
            Width: =148
            Height: =40
            OnSelect: =Set(gPrTab, 2)
      - btnTabPrTasks:
