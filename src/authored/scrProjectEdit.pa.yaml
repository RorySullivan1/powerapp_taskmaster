# =============================================================================
# scrProjectEdit  —  create / edit a project.
# ONE SCROLLING COLUMN · CHILDREN ADDED THROUGH MODALS · NO TABS
# =============================================================================
# LAYOUT BANDS (tablet 1366x768), so Studio's numbers can be checked by eye:
#      0 ..  64   header band            (absolute)
#     64 .. 636   frmPrScroll            (scrolls; Height = Parent.Height - 64 - 132)
#    636 .. 768   actionBar              (OPAQUE — the scroll cannot bleed under it)
#                 validation message 652, Save / Cancel 706
#
# The action bar is a filled Rectangle, not just a gap. The container's own
# Height stops at 636, but an opaque bar behind the buttons means that even if
# Studio freezes a stale Height on paste, content can never show through the
# Save row.
#
# THE SCROLLING COLUMN — `frmPrScroll`, a vertical auto-layout container with a
# headed section per former tab: Details · Classification · Tasks ·
# Transactions · Issues. Children carry NO X/Y (the container places them), so
# nothing in the form can be frozen into a wrong constant on paste — the
# galProjects failure mode is impossible in here.
#
# CHILDREN ARE ADDED THROUGH A MODAL, NOT AN INLINE ROW.
# Each of the three child sections is now just: heading · note · "+ Add …" ·
# the staged list. Pressing Add opens a modal (`mdNt` / `mdNx` / `mdNi`) that
# collects one row into colNewTasks / colNewTransactions / colNewIssues and
# closes. Nothing is written to SharePoint until the project itself is saved —
# a child needs the parent's ID, which does not exist until the insert returns.
# The modals are declared LAST so they float above everything, and each is
# gated on its own `g*Open` flag.
#
# PEOPLE ARE PICKED FREELY. The old two-option "Manager / Me" strips are gone.
# Every modal has a full `SearchUserV2` picker, so a task lead, sales owner or
# assignee can be anyone in the directory.
#
# THE COMPLETION DATE IS NOT A FIELD. `project_date_complete` is derived on
# save — `If( gPrPhase = "Complete", Coalesce(<existing>, Now()), Blank() )` —
# so marking a project Complete stamps it, and re-saving an already-complete
# project keeps the original date rather than moving it.
#
# DROPDOWNS AND DATE PICKERS ARE IN. `ModernCombobox@1.0.0` and
# `ModernDatePicker@1.0.0` (both grounded from Studio YAML) replace the 40px
# cmpSelection strips and the typed-date-plus-echo-label pairs:
#
#   phase · priority · task priority · currency · issue status · issue impact
#   project start · project target · task target date · trade date
#
# Every one drops to a single 32px control, and the eight echo labels that
# rendered `12 Aug 2026 / ⚠ not a date` are gone — a date picker cannot produce
# an unparseable date, so there is nothing left to echo. Dates now travel as real
# date values end to end: `dtp*.SelectedDate` into the staging collections, and
# straight into the Patch. No DateValue() parsing survives on this screen.
#
# Combobox reads: `cbo*.Selected.Value` (SelectMultiple is false, so `Selected`
# is a record). Date picker reads: `dtp*.SelectedDate`, Blank() when unset.
#
# ONE INFERRED PROPERTY: `DefaultSelectedItems` on the comboboxes, which seeds
# the current value when editing. The control, its version and every other
# property are confirmed. If the paste is rejected, delete that one line from
# each combobox — the only loss is the pre-selection on an Edit.
#
# ONE INFERRED TOKEN: `LayoutAlignItems.Start`. The container, its variant,
# LayoutDirection, LayoutGap, LayoutOverflowY and `LayoutOverflow.Scroll` are all
# photo-confirmed; only `.Center` is confirmed for LayoutAlignItems. If the paste
# is rejected, that is the first line to change — `.Center` is the fallback.
# =============================================================================
Screens:
  scrProjectEdit:
    Properties:
      Fill: =Theme.Color.Bg
      OnVisible: |
        =        Set( gPrManager,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditProject.project_manager.DisplayName, ""),
                    Mail:        Coalesce(gEditProject.project_manager.Email, "") },
                  { DisplayName: Coalesce(User().FullName, ""), Mail: Coalesce(User().Email, "") } ) );
        Set( gPrRequestor,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditProject.project_requestor.DisplayName, ""),
                    Mail:        Coalesce(gEditProject.project_requestor.Email, "") },
                  { DisplayName: "", Mail: "" } ) );
        Set( gPrSupporter,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditProject.project_supporter.DisplayName, ""),
                    Mail:        Coalesce(gEditProject.project_supporter.Email, "") },
                  { DisplayName: "", Mail: "" } ) );
        Set( gPrPhase,    If( gEditMode = "Edit", Coalesce(gEditProject.project_phase.Value, "Planning"), "Planning" ) );
        Set( gPrPriority, If( gEditMode = "Edit", Coalesce(gEditProject.project_priority.Value, "Moderate"), "Moderate" ) );
        // Managed metadata (C10). Empty on entry in BOTH modes: what the connector
        // returns for an EXISTING value is not in the picker's path form, so on Edit
        // the columns are left untouched unless the user actively re-picks. The
        // current labels are shown beside the pickers so nothing looks lost.
        //
        // No term collections are built here. Each picker reads the term store
        // DIRECTLY through Choices() on its own instance — see the Terms bindings.
        Set( gPrRegionLabel, "" ); Set( gPrRegionPath, "" ); Set( gPrRegionDone, false );
        Set( gPrTypeLabel,   "" ); Set( gPrTypePath,   "" ); Set( gPrTypeDone,   false );
        Set( gPrCovLabel,    "" ); Set( gPrCovPath,    "" ); Set( gPrCovDone,    false );
        // Staging areas. Cleared on every visit — a half-entered child list left
        // over from the previous project would be written to THIS one.
        Clear( colNewTasks ); Clear( colNewTransactions ); Clear( colNewIssues );
        Clear( colChildResult ); Clear( colChildErrors ); Clear( colChildOk );
        Set( gNtPriority, "Moderate" );
        Set( gNtLead,     { DisplayName: "", Mail: "" } );
        Set( gNxCcy, "USD" );
        Set( gNxSales,    { DisplayName: "", Mail: "" } );
        Set( gNxClient,  { Id: 0, Value: "" } );
        Set( gNxProduct, { Id: 0, Value: "" } );
        Set( gNiStatus, "Open" ); Set( gNiImpact, "(none)" ); Set( gNiAssignee, { DisplayName: "", Mail: "" } );
        Reset( txtPrName ); Reset( txtPrPathway ); Reset( txtPrDesc );
        Reset( txtPrManagerSearch ); Reset( txtPrRequestorSearch ); Reset( txtPrSupporterSearch );
        Reset( txtNtName );
        Reset( txtNxName ); Reset( txtNxNotional );
        Reset( txtNxClientSearch ); Reset( txtNxProductSearch );
        Reset( txtNiName )
        
        Set( gNtOpen, false ); Set( gNxOpen, false ); Set( gNiOpen, false );
        Set( gNiStatus, "Open" ); Set( gNiImpact, "Medium" )
    Children:
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Primary
            Height: =Theme.Space.HeaderH
            Width: =Parent.Width
            X: =0
            Y: =0
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: =If(gEditMode = "Edit", "Edit project", "New project")
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            FontWeight: =FontWeight.Semibold
            Size: =Theme.Size.H2
            Height: =Theme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Theme.Space.Gutter
            Y: =0
            Width: =400
      - lblPrStagedCount:
          Control: Label@2.5.1
          Properties:
            Text: |
              =CountRows(colNewTasks) & " task(s) · " & CountRows(colNewTransactions)
               & " transaction(s) · " & CountRows(colNewIssues) & " issue(s) staged"
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Align: =Align.Right
            Height: =Theme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Parent.Width - 500 - Theme.Space.Gutter
            Y: =0
            Width: =460
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =Theme.Color.OnPrimary
            Height: =24
            Width: =24
            X: =Parent.Width - 24 - Theme.Space.Gutter
            Y: =(Theme.Space.HeaderH - 24) / 2
            OnSelect: =Back()
      - frmPrScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Start
            LayoutGap: =8
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =16
            PaddingBottom: =16
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =64
            Width: =Parent.Width
            Height: =Parent.Height - 64 - 132
          Children:
            - secHeadDetails:
                Control: Label@2.5.1
                Properties:
                  Text: ="Details"
                  Font: =Theme.Font
                  FontWeight: =FontWeight.Semibold
                  Size: =Theme.Size.H3
                  Color: =Theme.Color.Primary
                  Width: =1200
                  Height: =28
            - lblPrNameCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Project name  *"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =520
                  Height: =18
            - lblPrPhaseCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Phase  *"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =760
                  Height: =18
            - txtPrName:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =If(gEditMode = "Edit", gEditProject.project_name, "")
                  HintText: ="What is this project called?"
                  Font: =Theme.Font
                  Size: =Theme.Size.Body
                  Width: =520
                  Height: =40
            - cboPrPhase:
                Control: ModernCombobox@1.0.0
                Properties:
                  Items: =["Planning", "Active", "Blocked", "Complete", "Archived"]
                  ItemDisplayText: =ThisItem.Value
                  InputTextPlaceholder: ="Select a phase"
                  SelectMultiple: =false
                  IsSearchable: =false
                  DefaultSelectedItems: =[gPrPhase]
                  Width: =320
                  Height: =32
                  OnChange: =Set(gPrPhase, cboPrPhase.Selected.Value)
            - lblPrPathCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Shared-drive path"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =520
                  Height: =18
            - lblPrPriorityCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Priority  *"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =760
                  Height: =18
            - txtPrPathway:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =If(gEditMode = "Edit", gEditProject.project_pathway, "")
                  HintText: ="\\share\eqd\projects\…"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Width: =520
                  Height: =36
            - cboPrPriority:
                Control: ModernCombobox@1.0.0
                Properties:
                  Items: =["Lowest", "Low", "Moderate", "High", "Critical"]
                  ItemDisplayText: =ThisItem.Value
                  InputTextPlaceholder: ="Select a priority"
                  SelectMultiple: =false
                  IsSearchable: =false
                  DefaultSelectedItems: =[gPrPriority]
                  Width: =320
                  Height: =32
                  OnChange: =Set(gPrPriority, cboPrPriority.Selected.Value)
            - lblPrDescCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Description"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =520
                  Height: =18
            - lblPrStartCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Start date"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =240
                  Height: =18
            - lblPrTargetCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Target date"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =240
                  Height: =18
            - txtPrDesc:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =If(gEditMode = "Edit", gEditProject.project_description, "")
                  Mode: =TextMode.MultiLine
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Width: =520
                  Height: =100
            - dtpPrStart:
                Control: ModernDatePicker@1.0.0
                Properties:
                  Placeholder: ="Actual start date"
                  Format: =DatePickerFormat.LongAbbreviated
                  StartOfWeek: =StartOfWeek.Monday
                  IsEditable: =true
                  Width: =240
                  Height: =32
            - dtpPrTarget:
                Control: ModernDatePicker@1.0.0
                Properties:
                  Placeholder: ="Target completion"
                  Format: =DatePickerFormat.LongAbbreviated
                  StartOfWeek: =StartOfWeek.Monday
                  IsEditable: =true
                  Width: =240
                  Height: =32
            - lblPrMgrCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Project manager  *"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =520
                  Height: =18
            - txtPrManagerSearch:
                Control: Classic/TextInput@2.3.2
                Properties:
                  HintText: ="Search people…"
                  DelayOutput: =true
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Width: =280
                  Height: =36
            - galPrManager:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  Visible: =Len(txtPrManagerSearch.Text) >= 2 && Len(gPrManager.Mail) = 0
                  Items: |
                    =Office365Users.SearchUserV2({ searchTerm: txtPrManagerSearch.Text, top: 8 }).value
                  TemplateSize: =32
                  TemplatePadding: =0
                  BorderColor: =Theme.Color.Border
                  BorderThickness: =1
                  Width: =280
                  Height: =132
                  TemplateFill: =Theme.Color.Surface
                Children:
                  - rowPrManager:
                      Control: Label@2.5.1
                      Properties:
                        Text: =ThisItem.DisplayName
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextPrimary
                        X: =8
                        Y: =0
                        Width: =Parent.TemplateWidth - 16
                        Height: =32
                        VerticalAlign: =VerticalAlign.Middle
                  - galPrManagerHit:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        OnSelect: |
                          =Select(Parent);
                           Set(gPrManager, { DisplayName: ThisItem.DisplayName, Mail: ThisItem.Mail })
            - lblPrMgrChip:
                Control: Label@2.5.1
                Properties:
                  Text: =If(Len(gPrManager.Mail) > 0, gPrManager.DisplayName, "— none selected —")
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =If(Len(gPrManager.Mail) > 0, Theme.Color.TextPrimary, Theme.Color.TextMuted)
                  Width: =208
                  Height: =36
                  VerticalAlign: =VerticalAlign.Middle
            - icoPrMgrClear:
                Control: Classic/Icon@2.5.0
                Properties:
                  Visible: =Len(gPrManager.Mail) > 0
                  Icon: =Icon.Cancel
                  Color: =Theme.Color.TextMuted
                  Height: =16
                  Width: =16
                  OnSelect: |
                    =Set(gPrManager, { DisplayName: "", Mail: "" })
            - lblPrReqCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Requestor"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =520
                  Height: =18
            - txtPrRequestorSearch:
                Control: Classic/TextInput@2.3.2
                Properties:
                  HintText: ="Search people…"
                  DelayOutput: =true
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Width: =280
                  Height: =36
            - galPrRequestor:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  Visible: =Len(txtPrRequestorSearch.Text) >= 2 && Len(gPrRequestor.Mail) = 0
                  Items: |
                    =Office365Users.SearchUserV2({ searchTerm: txtPrRequestorSearch.Text, top: 8 }).value
                  TemplateSize: =32
                  TemplatePadding: =0
                  BorderColor: =Theme.Color.Border
                  BorderThickness: =1
                  Width: =280
                  Height: =132
                  TemplateFill: =Theme.Color.Surface
                Children:
                  - rowPrRequestor:
                      Control: Label@2.5.1
                      Properties:
                        Text: =ThisItem.DisplayName
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextPrimary
                        X: =8
                        Y: =0
                        Width: =Parent.TemplateWidth - 16
                        Height: =32
                        VerticalAlign: =VerticalAlign.Middle
                  - galPrRequestorHit:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        OnSelect: |
                          =Select(Parent);
                           Set(gPrRequestor, { DisplayName: ThisItem.DisplayName, Mail: ThisItem.Mail })
            - lblPrReqChip:
                Control: Label@2.5.1
                Properties:
                  Text: =If(Len(gPrRequestor.Mail) > 0, gPrRequestor.DisplayName, "— none —")
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =If(Len(gPrRequestor.Mail) > 0, Theme.Color.TextPrimary, Theme.Color.TextMuted)
                  Width: =208
                  Height: =36
                  VerticalAlign: =VerticalAlign.Middle
            - icoPrReqClear:
                Control: Classic/Icon@2.5.0
                Properties:
                  Visible: =Len(gPrRequestor.Mail) > 0
                  Icon: =Icon.Cancel
                  Color: =Theme.Color.TextMuted
                  Height: =16
                  Width: =16
                  OnSelect: |
                    =Set(gPrRequestor, { DisplayName: "", Mail: "" })
            - lblPrSuppCap:
                Control: Label@2.5.1
                Properties:
                  Text: ="Supporter  (one extra person)"
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =520
                  Height: =18
            - txtPrSupporterSearch:
                Control: Classic/TextInput@2.3.2
                Properties:
                  HintText: ="Search people…"
                  DelayOutput: =true
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Width: =280
                  Height: =36
            - galPrSupporter:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  Visible: =Len(txtPrSupporterSearch.Text) >= 2 && Len(gPrSupporter.Mail) = 0
                  Items: |
                    =Office365Users.SearchUserV2({ searchTerm: txtPrSupporterSearch.Text, top: 8 }).value
                  TemplateSize: =32
                  TemplatePadding: =0
                  BorderColor: =Theme.Color.Border
                  BorderThickness: =1
                  Width: =280
                  Height: =132
                  TemplateFill: =Theme.Color.Surface
                Children:
                  - rowPrSupporter:
                      Control: Label@2.5.1
                      Properties:
                        Text: =ThisItem.DisplayName
                        Font: =Theme.Font
                        Size: =Theme.Size.Small
                        Color: =Theme.Color.TextPrimary
                        X: =8
                        Y: =0
                        Width: =Parent.TemplateWidth - 16
                        Height: =32
                        VerticalAlign: =VerticalAlign.Middle
                  - galPrSupporterHit:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        OnSelect: |
                          =Select(Parent);
                           Set(gPrSupporter, { DisplayName: ThisItem.DisplayName, Mail: ThisItem.Mail })
            - lblPrSuppChip:
                Control: Label@2.5.1
                Properties:
                  Text: =If(Len(gPrSupporter.Mail) > 0, gPrSupporter.DisplayName, "— none —")
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =If(Len(gPrSupporter.Mail) > 0, Theme.Color.TextPrimary, Theme.Color.TextMuted)
                  Width: =208
                  Height: =36
                  VerticalAlign: =VerticalAlign.Middle
            - icoPrSuppClear:
                Control: Classic/Icon@2.5.0
                Properties:
                  Visible: =Len(gPrSupporter.Mail) > 0
                  Icon: =Icon.Cancel
                  Color: =Theme.Color.TextMuted
                  Height: =16
                  Width: =16
                  OnSelect: |
                    =Set(gPrSupporter, { DisplayName: "", Mail: "" })
            - secHeadClassification:
                Control: Label@2.5.1
                Properties:
                  Text: ="Classification"
                  Font: =Theme.Font
                  FontWeight: =FontWeight.Semibold
                  Size: =Theme.Size.H3
                  Color: =Theme.Color.Primary
                  Width: =1200
                  Height: =28
            - lblPrClassNote:
                Control: Label@2.5.1
                Properties:
                  Text: ="Region and Type are REQUIRED by the list. Keep picking across the columns until no further column appears — the last term you pick is the one written."
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =Theme.Color.TextMuted
                  Width: =760
                  Height: =18
            - pickPrRegion:
                Control: CanvasComponent
                ComponentName: cmpTermPicker
                Properties:
                  Width: =760
                  Height: =150
                  Caption: ="Region  *"
                  Terms: =ShowColumns( Choices([@taskmaster_projects].project_region), Label, Path )
                  OnChange: |
                    =Set( gPrRegionLabel, pickPrRegion.TermLabel );
                    Set( gPrRegionPath,  pickPrRegion.TermPath );
                    Set( gPrRegionDone,  pickPrRegion.IsComplete )
            - lblPrRegionState:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =If( Len(gPrRegionPath) > 0,
                         If( gPrRegionDone, "✓ " & gPrRegionLabel, "… " & gPrRegionLabel & " — keep going, this term has children" ),
                         gEditMode = "Edit",
                         "Currently: " & Coalesce(gEditProject.project_region.Value, "not set") & "   (leave alone to keep it)",
                         "Nothing picked yet" )
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =If( Len(gPrRegionPath) > 0 && !gPrRegionDone, Theme.Color.Warning, Theme.Color.TextMuted )
                  Width: =520
                  Height: =36
                  VerticalAlign: =VerticalAlign.Middle
            - pickPrType:
                Control: CanvasComponent
                ComponentName: cmpTermPicker
                Properties:
                  Width: =760
                  Height: =150
                  Caption: ="Project type  *"
                  Terms: =ShowColumns( Choices([@taskmaster_projects].project_type), Label, Path )
                  OnChange: |
                    =Set( gPrTypeLabel, pickPrType.TermLabel );
                    Set( gPrTypePath,  pickPrType.TermPath );
                    Set( gPrTypeDone,  pickPrType.IsComplete )
            - lblPrTypeState:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =If( Len(gPrTypePath) > 0,
                         If( gPrTypeDone, "✓ " & gPrTypeLabel, "… " & gPrTypeLabel & " — keep going, this term has children" ),
                         gEditMode = "Edit",
                         "Currently: " & Coalesce(gEditProject.project_type.Value, "not set") & "   (leave alone to keep it)",
                         "Nothing picked yet" )
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =If( Len(gPrTypePath) > 0 && !gPrTypeDone, Theme.Color.Warning, Theme.Color.TextMuted )
                  Width: =520
                  Height: =36
                  VerticalAlign: =VerticalAlign.Middle
            - pickPrCoverage:
                Control: CanvasComponent
                ComponentName: cmpTermPicker
                Properties:
                  Width: =760
                  Height: =150
                  Caption: ="Coverage"
                  Terms: =ShowColumns( Choices([@taskmaster_projects].project_coverage), Label, Path )
                  OnChange: |
                    =Set( gPrCovLabel, pickPrCoverage.TermLabel );
                    Set( gPrCovPath,  pickPrCoverage.TermPath );
                    Set( gPrCovDone,  pickPrCoverage.IsComplete )
            - lblPrCovState:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =If( Len(gPrCovPath) > 0,
                         If( gPrCovDone, "✓ " & gPrCovLabel, "… " & gPrCovLabel & " — keep going, this term has children" ),
                         gEditMode = "Edit",
                         "Currently: " & Coalesce(gEditProject.project_coverage.Value, "not set") & "   (leave alone to keep it)",
                         "Nothing picked yet" )
                  Font: =Theme.Font
                  Size: =Theme.Size.Small
                  Color: =If( Len(gPrCovPath) > 0 && !gPrCovDone, Theme.Color.Warning, Theme.Color.TextMuted )
                  Width: =520
                  Height: =36
                  VerticalAlign: =VerticalAlign.Middle
            - secHeadTasks:
                Control: Label@2.5.1
                Properties:
                  Text: ="Tasks"
                  Font: =Theme.Font
                  FontWeight: =FontWeight.Semibold
