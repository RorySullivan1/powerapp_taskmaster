            Fill: =If(gPrTab = 3, Theme.Color.Primary, Theme.Color.Surface)
            Color: =If(gPrTab = 3, Theme.Color.OnPrimary, Theme.Color.TextPrimary)
            BorderColor: =Theme.Color.Primary
            BorderThickness: =1
            Font: =Theme.Font
            Size: =Theme.Size.Small
            X: =24 + 304
            Y: =84
            Width: =148
            Height: =40
            OnSelect: =Set(gPrTab, 3)
      - btnTabPrTx:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Transactions"
            Fill: =If(gPrTab = 4, Theme.Color.Primary, Theme.Color.Surface)
            Color: =If(gPrTab = 4, Theme.Color.OnPrimary, Theme.Color.TextPrimary)
            BorderColor: =Theme.Color.Primary
            BorderThickness: =1
            Font: =Theme.Font
            Size: =Theme.Size.Small
            X: =24 + 456
            Y: =84
            Width: =148
            Height: =40
