# =============================================================================
# scrProjectEdit  —  create / edit a project, AND stage its tasks, transactions
# and issues in the same pass.
#
# Entered with:  Set(gEditMode, "New" | "Edit");  Set(gEditProject, <record>)
#
# WHY THE CHILDREN ARE STAGED, NOT WRITTEN AS YOU GO
# A task, transaction or issue cannot exist before its parent does — every one of
# them carries a REQUIRED Lookup to taskmaster_projects, and a Lookup needs the
# parent's ID, which SharePoint only assigns on insert. So the child rows are
# collected LOCALLY (colNewTasks / colNewTransactions / colNewIssues) while the
# form is open, and written only after the project's Patch returns a record with
# an ID. That is the whole reason this screen exists in the shape it does.
#
# WHAT HAPPENS WHEN A CHILD FAILS
# The parent is already saved by then, so a failure cannot be rolled back — and
# pretending otherwise would silently drop the user's work. Instead: successful
# children are REMOVED from the staging collection, failures STAY in it and are
# listed on-screen, and the screen flips to Edit mode against the project it just
# created. Pressing Save again therefore retries only what failed and cannot
# create a second project. That mode flip is load-bearing, not cosmetic.
#
# FIVE TABS, because a canvas screen does not scroll:
#   Details · Classification (the managed-metadata pickers) · Tasks · Transactions · Issues
#
# Follows the shared edit-screen pattern — see scrIssueEdit's header and
# _EDIT-NOTES.md. CONNECTION PREREQUISITE: Office 365 Users. See HANDOFF.md.
# Every column token resolves to schema/schema.yaml (golden source).
# =============================================================================
Screens:
  scrProjectEdit:
    Properties:
      Fill: =Theme.Color.Bg
      OnVisible: |
        =Set( gPrTab, 1 );
        Set( gPrManager,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditProject.project_manager.DisplayName, ""),
                    Mail:        Coalesce(gEditProject.project_manager.Email, "") },
                  { DisplayName: Coalesce(User().FullName, ""), Mail: Coalesce(User().Email, "") } ) );
        Set( gPrRequestor,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditProject.project_requestor.DisplayName, ""),
                    Mail:        Coalesce(gEditProject.project_requestor.Email, "") },
                  { DisplayName: "", Mail: "" } ) );
        Set( gPrSupporter,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditProject.project_supporter.DisplayName, ""),
                    Mail:        Coalesce(gEditProject.project_supporter.Email, "") },
                  { DisplayName: "", Mail: "" } ) );
        Set( gPrPhase,    If( gEditMode = "Edit", Coalesce(gEditProject.project_phase.Value, "Planning"), "Planning" ) );
        Set( gPrPriority, If( gEditMode = "Edit", Coalesce(gEditProject.project_priority.Value, "Moderate"), "Moderate" ) );
        // Managed metadata (C10). Empty on entry in BOTH modes: what the connector
        // returns for an EXISTING value is not in the picker's path form, so on Edit
        // the columns are left untouched unless the user actively re-picks. The
        // current labels are shown beside the pickers so nothing looks lost.
        //
        // No term collections are built here. Each picker reads the term store
        // DIRECTLY through Choices() on its own instance — see the Terms bindings.
        Set( gPrRegionLabel, "" ); Set( gPrRegionPath, "" ); Set( gPrRegionDone, false );
        Set( gPrTypeLabel,   "" ); Set( gPrTypePath,   "" ); Set( gPrTypeDone,   false );
        Set( gPrCovLabel,    "" ); Set( gPrCovPath,    "" ); Set( gPrCovDone,    false );
        // Staging areas. Cleared on every visit — a half-entered child list left
        // over from the previous project would be written to THIS one.
        Clear( colNewTasks ); Clear( colNewTransactions ); Clear( colNewIssues );
        Clear( colChildResult ); Clear( colChildErrors ); Clear( colChildOk );
        Set( gNtPriority, "Moderate" ); Set( gNtLeadWho, "Manager" );
        Set( gNxCcy, "USD" ); Set( gNxSalesWho, "Manager" );
        Set( gNxClient,  { Id: 0, Value: "" } );
        Set( gNxProduct, { Id: 0, Value: "" } );
        Set( gNiStatus, "Open" ); Set( gNiImpact, "(none)" ); Set( gNiAssigneeWho, "Manager" );
        Reset( txtPrName ); Reset( txtPrPathway ); Reset( txtPrDesc );
        Reset( txtPrStart ); Reset( txtPrTarget ); Reset( txtPrComplete );
        Reset( txtPrManagerSearch ); Reset( txtPrRequestorSearch ); Reset( txtPrSupporterSearch );
        Reset( txtNtName ); Reset( txtNtTarget );
        Reset( txtNxName ); Reset( txtNxNotional ); Reset( txtNxDate );
        Reset( txtNxClientSearch ); Reset( txtNxProductSearch );
        Reset( txtNiName )
    Children:
      # ---- Header ----------------------------------------------------------
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Primary
            Height: =Theme.Space.HeaderH
            Width: =Parent.Width
            X: =0
            Y: =0
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: |
              =If(gEditMode = "Edit", "Edit project", "New project")
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            FontWeight: =FontWeight.Semibold
            Size: =Theme.Size.H2
            Height: =Theme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Theme.Space.Gutter
            Y: =0
            Width: =400
      - lblPrStagedCount:
          Control: Label@2.5.1
          Properties:
            # The staged children are the point of this screen — keep the count in
            # the header so it is visible from every tab.
            Text: |
              =CountRows(colNewTasks) & " task(s) · " & CountRows(colNewTransactions)
               & " transaction(s) · " & CountRows(colNewIssues) & " issue(s) staged"
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Align: =Align.Right
            Height: =Theme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Parent.Width - 500 - Theme.Space.Gutter
            Y: =0
            Width: =460
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =Theme.Color.OnPrimary
            Height: =24
            Width: =24
            X: =Parent.Width - 24 - Theme.Space.Gutter
            Y: =(Theme.Space.HeaderH - 24) / 2
            OnSelect: =Back()
      # TABS ARE PLAIN BUTTONS, NOT A cmpSelection STRIP.
      # The strip set the tab from `<strip>.Selected.Id` inside its OnChange, which the
      # component raises straight after `Select(Parent)` — so the consumer reads the
      # gallery's selection in the same behaviour pass that sets it. Tab switching did
      # not work in Studio. A button carries its own value in its own OnSelect, so
      # there is nothing to propagate and nothing to race.
      - btnTabPrDetails:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Details"
            Fill: =If(gPrTab = 1, Theme.Color.Primary, Theme.Color.Surface)
            Color: =If(gPrTab = 1, Theme.Color.OnPrimary, Theme.Color.TextPrimary)
            BorderColor: =Theme.Color.Primary
            BorderThickness: =1
            Font: =Theme.Font
            Size: =Theme.Size.Small
            X: =24
            Y: =84
            Width: =148
            Height: =40
            OnSelect: =Set(gPrTab, 1)
      - btnTabPrClass:
          Control: Classic/Button@2.2.0
