# =============================================================================
# scrProjectEdit  —  create / edit a project.
# CONTAINER-LAID-OUT SCROLLING FORM · CHILDREN ADDED THROUGH MODALS · NO TABS
# =============================================================================
# LAYOUT BANDS (tablet 1366x768), so Studio's numbers can be checked by eye:
#      0 ..  64   header band            (absolute)
#     64 .. 680   formSheet + frmPrScroll (scrolls; Height = Parent.Height - 64 - 88)
#    680 .. 768   action bar             (OPAQUE — the scroll cannot bleed under it)
#
# -----------------------------------------------------------------------------
# WHAT CHANGED IN THIS PASS, AND WHY (read before "simplifying" any of it back)
# -----------------------------------------------------------------------------
#
# 1. THE SAVE BUTTON NO LONGER FLOATS.  Reported symptom: "the submit button is
#    floating in the middle of the screen rather than fixed below the container
#    of the form object."  Cause: `actionBar` was anchored responsively
#    (`Y: =Parent.Height - 132`) while `btnPrSave` / `btnPrCancel` / the two
#    validation labels carried HARDCODED `Y: =706 / 670 / 652` — numbers that
#    only coincide on a screen exactly 768 tall.  Layout formulas FREEZE at paste
#    (canvas-design §4), so the bar landed at the real bottom of the screen and
#    the buttons stayed at 706, i.e. mid-screen.
#
#    The fix is structural, not a new constant.  The whole footer is now ONE
#    horizontal auto-layout container, `actionBarRow`, sharing the action bar's
#    exact anchor expression.  Its children carry NO X/Y — the container places
#    them — so the two can never disagree again no matter what the paste freezes.
#    `actionBarBg` (an opaque Rectangle on the identical expression) still sits
#    behind it, so even a stale frozen Height cannot let the scroll show through.
#
# 2. CAPTIONS NOW SIT WITH THEIR FIELDS.  `frmPrScroll` is a VERTICAL container,
#    but its children were ordered for a two-column grid — `nameCap, phaseCap,
#    nameInput, phaseCombo, pathCap, priorityCap, …` — so the form actually
#    rendered as caption, caption, field, field, and no label belonged to
#    anything.  Every field is now a `col*` container (caption 18 + gap 8 +
#    control 36 = 62) inside a `row*` container.  Nothing is ordered by luck.
#
# 3. ZERO INFERRED LAYOUT TOKENS.  Previous versions used
#    `LayoutAlignItems.Start`, the last inferred token on the screen.  It is gone:
#    every direct child of a container is sized to the container's full inner
#    width (or, in a row, to an explicit share of it), which makes `.Start` and
#    the CONFIRMED `.Center` render identically — so `.Center` is used
#    throughout.  Keep new children full-width and that stays true.
#
# 4. RESULTS GALLERIES EXPAND INLINE (canvas-design §5: a hidden child takes no
#    space).  Each people/lookup gallery is a SIBLING of its row, declared
#    immediately after it, full width, `Height: =132`, and visible only at 2+
#    typed characters with nothing yet picked.  It pushes the rest of the column
#    down and collapses again.  No z-order, no overlay, no
#    one-picker-at-a-time gate, and — unlike the old absolute layout — nothing
#    can cover a row the user needs to click.
#
# 5. A PICK COLLAPSES TO A CHIP YOU CAN CLEAR.  Each picker is a `col*Search`
#    (caption + search box) beside a `col*Chip` whose chip is a flat
#    `Classic/Button` reading `Name    ✕`.  Pressing it clears the global AND
#    `Reset()`s the search box, which the old `Classic/Icon` clear did not — so
#    the stale search text no longer re-opens the gallery the moment you clear.
#    The button is `DisplayMode.Disabled` when nothing is picked, which is what
#    greys the "— nobody selected —" placeholder.
#
# 6. STAGED LISTS COST NOTHING WHEN EMPTY.  The three staged galleries were a
#    fixed 400 / 380 / 380 tall whether or not they held a row — 1,160px of
#    blank space in the scroll on every new project.  Each is now `Visible:
#    =!IsEmpty(col…)` with a one-line empty state in its place, a constant 200px
#    when populated (4 rows of 44 + internal scroll past that), and its live
#    count in the section heading.  The height is a CONSTANT on purpose: a
#    `CountRows(...)`-driven height would freeze at paste, when the collection is
#    always empty, and clip the list forever.
#
# 7. THE MODALS ARE CONTAINERS NOW.  Each was ~20 absolutely-positioned controls
#    repeating `(Parent.Width - 680) / 2 + 24` by hand.  Each is now
#    scrim → `mdN*Bg` (opaque Rectangle) → `mdN*Body` (vertical auto-layout,
#    `LayoutOverflowY.Scroll`) → rows, with Add/Cancel absolutely positioned on
#    the card's own anchor expression so they stay pinned to the card's bottom
#    edge instead of drifting up as the body grows.
#
# -----------------------------------------------------------------------------
# DEFECTS FOUND DURING THE REVIEW AND FIXED HERE
# -----------------------------------------------------------------------------
#
# a. `OnVisible` DID NOT PARSE.  `Reset( txtNiName )` was followed by a blank
#    line and then `Set( gNtOpen, false )` with NO `;` between them — two
#    statements, no separator.  Studio would have rejected the whole screen.
#
# b. EDITING A PROJECT SILENTLY WIPED ITS DATES.  `dtpPrStart` / `dtpPrTarget`
#    carried no `DefaultDate`, so on Edit they opened blank while the Patch still
#    wrote `dtpPrStart.SelectedDate` — i.e. `Blank()` over an existing
#    `project_date_start` / `project_date_target`.  Both now seed from
#    `gEditProject` and are `Reset()` in `OnVisible`.  This is the quiet-wrong
#    class the edit-screen notes warn about: no error, just a lost date.
#
# c. THREE INVALID CHOICE VALUES.  `cboNiStatus` offered "In Progress" and
#    "Resolved"; `schema/schema.yaml` says `issue_status` is
#    [Open, Review, Waiting, Blocked, Closed].  `cboNiImpact` offered "Medium";
#    `issue_impact` is [Low, Moderate, High, Critical].  Both now match the
#    golden source exactly.
#
# d. `issue_impact` WAS COLLECTED AND THEN DROPPED.  `i_impact` was staged on
#    every row and never appeared in the issues `Patch`.  It is written now.
#    The old "(none)" sentinel is gone with it: the column is optional in
#    SharePoint, but a conditional record literal (`If(cond, Blank(), {Value:…})`)
#    is a type risk this gap cannot test, so the modal always supplies a real
#    value and defaults to "Moderate".
#
# e. EVERY MODAL'S RESULTS GALLERY WAS PERMANENTLY OPEN.  All five were
#    `Visible: =gN*Open` — so they rendered the moment the modal opened, sat
#    exactly on top of their own selection chip (identical X/Y), and queried
#    `SearchUserV2` with an empty search term.  The chip was never visible, so
#    there was no confirmation of what you had picked.  Each is now gated on
#    `Len(search.Text) >= 2` with nothing already chosen.
#
# f. STALE COPY.  The validation message still said "(Classification tab)" — the
#    tabs were removed several passes ago.
#
# -----------------------------------------------------------------------------
# UNCHANGED AND DELIBERATE
# -----------------------------------------------------------------------------
# * CHILDREN ARE STAGED, NOT WRITTEN.  A task/transaction/issue carries a
#   REQUIRED Lookup to the project, and a Lookup needs an ID that does not exist
#   until the insert returns.  So Add collects into colNewTasks /
#   colNewTransactions / colNewIssues and Save writes them after the parent.
#   Successes leave staging, failures stay and are retried by pressing Save
#   again; `gEditMode` flips to "Edit" so a retry can never create a second
#   project.  All of §"scrProjectEdit — creating children with the parent" in
#   `_EDIT-NOTES.md` still applies.
# * THE COMPLETION DATE IS NOT A FIELD.  `project_date_complete` is derived on
#   save — `If( gPrPhase = "Complete", Coalesce(<existing>, Now()), Blank() )` —
#   so marking a project Complete stamps it and re-saving keeps the original.
#   The Details section now says so on screen instead of leaving it a surprise.
# * PEOPLE ARE PICKED FREELY, through `SearchUserV2(...).value` (V1 matched only
#   the address in practice).  Combobox reads `cbo*.Selected.Value`; date picker
#   reads `dtp*.SelectedDate`; number input reads `num*.Value`.  No `DateValue()`
#   parsing survives on this screen.
# * MANAGED METADATA IS UNTOUCHED ON EDIT UNLESS RE-PICKED (`_EDIT-NOTES.md` §7),
#   and is written by handing back the connector's OWN `Choices()` record found
#   by the resolved path — never a hand-built SPListExpandedTaxonomy literal.
# * THE HEADER IS LOCAL, NOT `cmpAppBar`.  This screen is a modal-style editor
#   with unsaved staged children in memory; the shared app bar's fly-out nav rail
#   would let a user navigate away and lose them with no warning.  A close-only
#   header is the right call here.  If that is ever revisited, the staged-count
#   chip in the header is the thing that has to survive the swap.
# =============================================================================
Screens:
  scrProjectEdit:
    Properties:
      Fill: =Theme.Color.Bg
      OnVisible: |
        =Set( gPrManager,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditProject.project_manager.DisplayName, ""),
                    Mail:        Coalesce(gEditProject.project_manager.Email, "") },
                  { DisplayName: Coalesce(User().FullName, ""), Mail: Coalesce(User().Email, "") } ) );
        Set( gPrRequestor,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditProject.project_requestor.DisplayName, ""),
                    Mail:        Coalesce(gEditProject.project_requestor.Email, "") },
                  { DisplayName: "", Mail: "" } ) );
        Set( gPrSupporter,
              If( gEditMode = "Edit",
                  { DisplayName: Coalesce(gEditProject.project_supporter.DisplayName, ""),
                    Mail:        Coalesce(gEditProject.project_supporter.Email, "") },
                  { DisplayName: "", Mail: "" } ) );
        Set( gPrPhase,    If( gEditMode = "Edit", Coalesce(gEditProject.project_phase.Value, "Planning"), "Planning" ) );
        Set( gPrPriority, If( gEditMode = "Edit", Coalesce(gEditProject.project_priority.Value, "Moderate"), "Moderate" ) );
        // Managed metadata (C10). Empty on entry in BOTH modes: what the connector
        // returns for an EXISTING value is not in the picker's path form, so on Edit
        // the columns are left untouched unless the user actively re-picks. The
        // current labels are shown beside the pickers so nothing looks lost.
        //
        // No term collections are built here. Each picker reads the term store
        // DIRECTLY through Choices() on its own instance — see the Terms bindings.
        Set( gPrRegionLabel, "" ); Set( gPrRegionPath, "" ); Set( gPrRegionDone, false );
        Set( gPrTypeLabel,   "" ); Set( gPrTypePath,   "" ); Set( gPrTypeDone,   false );
        Set( gPrCovLabel,    "" ); Set( gPrCovPath,    "" ); Set( gPrCovDone,    false );
        // Staging areas. Cleared on every visit — a half-entered child list left
        // over from the previous project would be written to THIS one.
        Clear( colNewTasks ); Clear( colNewTransactions ); Clear( colNewIssues );
        Clear( colChildResult ); Clear( colChildErrors ); Clear( colChildOk );
        // Modal state. Each `g*Open` gates one modal; all three start closed.
        Set( gNtOpen, false ); Set( gNxOpen, false ); Set( gNiOpen, false );
        // Modal field state. Every default below is a REAL member of the matching
        // Choice column in schema/schema.yaml — task_priority, transaction_currency,
        // issue_status, issue_impact. Do not seed a value the list does not have.
        Set( gNtPriority, "Moderate" );
        Set( gNtLead,     { DisplayName: "", Mail: "" } );
        Set( gNxCcy,      "USD" );
        Set( gNxSales,    { DisplayName: "", Mail: "" } );
        Set( gNxClient,   { Id: 0, Value: "" } );
        Set( gNxProduct,  { Id: 0, Value: "" } );
        Set( gNiStatus,   "Open" );
        Set( gNiImpact,   "Moderate" );
        Set( gNiAssignee, { DisplayName: "", Mail: "" } );
        // Text inputs re-read their Default only on Reset; the date pickers re-read
        // DefaultDate the same way. Missing these was how an Edit used to open with
        // blank dates and then write Blank() over the stored ones.
        Reset( txtPrName ); Reset( txtPrPathway ); Reset( txtPrDesc );
        Reset( dtpPrStart ); Reset( dtpPrTarget );
        Reset( txtPrManagerSearch ); Reset( txtPrRequestorSearch ); Reset( txtPrSupporterSearch );
        Reset( txtNtName ); Reset( txtNtLeadSearch ); Reset( dtpNtTarget );
        Reset( txtNxName ); Reset( dtpNxDate ); Reset( numNxNotional );
        Reset( txtNxClientSearch ); Reset( txtNxProductSearch ); Reset( txtNxSalesSearch );
        Reset( txtNiName ); Reset( txtNiAssSearch )
    Children:
      # =======================================================================
      # HEADER BAND  ·  0 .. 64  (absolute — three controls, no collisions)
      # =======================================================================
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Primary
            Height: =Theme.Space.HeaderH
            Width: =Parent.Width
            X: =0
            Y: =0
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: =If(gEditMode = "Edit", "Edit project", "New project")
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            FontWeight: =FontWeight.Semibold
            Size: =Theme.Size.H2
            Height: =Theme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Theme.Space.Gutter
            Y: =0
            Width: =360
      # The staged-item counter is the only warning that pressing the close icon
      # discards work, so it only appears when there IS work to discard.
      - lblPrStagedCount:
          Control: Label@2.5.1
          Properties:
            Visible: |
              =CountRows(colNewTasks) + CountRows(colNewTransactions) + CountRows(colNewIssues) > 0
            Text: |
              =CountRows(colNewTasks) & " task · " & CountRows(colNewTransactions)
               & " transaction · " & CountRows(colNewIssues) & " issue  —  staged, not yet saved"
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Align: =Align.Right
            Height: =Theme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Parent.Width - 520 - Theme.Space.Gutter
            Y: =0
            Width: =480
      - BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Color: =Theme.Color.OnPrimary
            Height: =24
            Width: =24
            X: =Parent.Width - 24 - Theme.Space.Gutter
            Y: =(Theme.Space.HeaderH - 24) / 2
            OnSelect: =Back()
      # =======================================================================
      # FORM BAND  ·  64 .. Parent.Height - 88
      # =======================================================================
      # An opaque sheet behind the scrolling column, so the form reads as one
      # surface against the grey canvas. Same anchor expression as frmPrScroll,
      # so whatever the paste freezes, the two freeze together.
      - formSheet:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Surface
            X: =0
            Y: =Theme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - Theme.Space.HeaderH - 88
      - frmPrScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =20
            PaddingBottom: =28
            PaddingLeft: =24
            PaddingRight: =24
            X: =0
            Y: =Theme.Space.HeaderH
            Width: =Parent.Width
            Height: =Parent.Height - Theme.Space.HeaderH - 88
          Children:
            # -----------------------------------------------------------------
            # DETAILS
            # -----------------------------------------------------------------
            - secHeadDetails:
                Control: Label@2.5.1
                Properties:
                  Text: ="Details"
                  Font: =Theme.Font
                  FontWeight: =FontWeight.Semibold
                  Size: =Theme.Size.H3
                  Color: =Theme.Color.Primary
                  Width: =Parent.Width - 48
                  Height: =24
            # Row 1 — name · phase · priority.  3 equal columns, gap 24.
            - rowPrD1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =24
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - colPrName:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =(Parent.Width - 48) / 3
                        Height: =62
                      Children:
                        - lblPrNameCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Project name  *"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - txtPrName:
                            Control: ModernTextInput@1.0.0
                            Properties:
                              Default: =If(gEditMode = "Edit", gEditProject.project_name, "")
                              Placeholder: ="What is this project called?"
                              Font: =Theme.Font
                              Size: =Theme.Size.Body
                              Width: =Parent.Width
                              Height: =36
                  - colPrPhase:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =(Parent.Width - 48) / 3
                        Height: =62
                      Children:
                        - lblPrPhaseCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Phase  *"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - cboPrPhase:
                            Control: ModernCombobox@1.0.0
                            Properties:
                              Items: =["Planning", "Active", "Blocked", "Complete", "Archived"]
                              ItemDisplayText: =ThisItem.Value
                              InputTextPlaceholder: ="Select a phase"
                              SelectMultiple: =false
                              IsSearchable: =false
                              DefaultSelectedItems: =[gPrPhase]
                              Width: =Parent.Width
                              Height: =36
                              OnChange: =Set(gPrPhase, cboPrPhase.Selected.Value)
                  - colPrPriority:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =(Parent.Width - 48) / 3
                        Height: =62
                      Children:
                        - lblPrPriorityCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Priority  *"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - cboPrPriority:
                            Control: ModernCombobox@1.0.0
                            Properties:
                              Items: =["Lowest", "Low", "Moderate", "High", "Critical"]
                              ItemDisplayText: =ThisItem.Value
                              InputTextPlaceholder: ="Select a priority"
                              SelectMultiple: =false
                              IsSearchable: =false
                              DefaultSelectedItems: =[gPrPriority]
                              Width: =Parent.Width
                              Height: =36
                              OnChange: =Set(gPrPriority, cboPrPriority.Selected.Value)
            # Row 2 — start · target · shared-drive path.
            - rowPrD2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =24
                  Width: =Parent.Width - 48
                  Height: =62
                Children:
                  - colPrStart:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =(Parent.Width - 48) / 3
                        Height: =62
                      Children:
                        - lblPrStartCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Start date"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        # DefaultDate is what stops an Edit writing Blank() over the
                        # stored date. Paired with Reset(dtpPrStart) in OnVisible.
                        - dtpPrStart:
                            Control: ModernDatePicker@1.0.0
                            Properties:
                              DefaultDate: =If(gEditMode = "Edit", gEditProject.project_date_start, Blank())
                              Placeholder: ="Actual start date"
                              Format: =DatePickerFormat.LongAbbreviated
                              StartOfWeek: =StartOfWeek.Monday
                              IsEditable: =true
                              Width: =Parent.Width
                              Height: =36
                  - colPrTarget:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =(Parent.Width - 48) / 3
                        Height: =62
                      Children:
                        - lblPrTargetCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Target date"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - dtpPrTarget:
                            Control: ModernDatePicker@1.0.0
                            Properties:
                              DefaultDate: =If(gEditMode = "Edit", gEditProject.project_date_target, Blank())
                              Placeholder: ="Target completion"
                              Format: =DatePickerFormat.LongAbbreviated
                              StartOfWeek: =StartOfWeek.Monday
                              IsEditable: =true
                              Width: =Parent.Width
                              Height: =36
                  - colPrPath:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =(Parent.Width - 48) / 3
                        Height: =62
                      Children:
                        - lblPrPathCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Shared-drive path"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - txtPrPathway:
                            Control: ModernTextInput@1.0.0
                            Properties:
                              Default: =If(gEditMode = "Edit", gEditProject.project_pathway, "")
                              Placeholder: ="\\share\eqd\projects\…"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Width: =Parent.Width
                              Height: =36
            # Row 3 — description (two thirds) beside the derived-fields note.
            - rowPrD3:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =24
                  Width: =Parent.Width - 48
                  Height: =122
                Children:
                  - colPrDesc:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =((Parent.Width - 48) / 3) * 2 + 24
                        Height: =122
                      Children:
                        - lblPrDescCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Description"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - txtPrDesc:
                            Control: ModernTextInput@1.0.0
                            Properties:
                              Default: =If(gEditMode = "Edit", gEditProject.project_description, "")
                              Type: =TextInputType.Multiline
                              Placeholder: ="Background, scope, anything the desk should know."
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Width: =Parent.Width
                              Height: =96
                  # Two things this form does NOT ask for, said out loud rather than
                  # left to be discovered. project_date_complete is derived on save
                  # and project_perc_completion is the C3 rollup — neither is a field.
                  - colPrDerived:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Width: =(Parent.Width - 48) / 3
                        Height: =122
                      Children:
                        - lblPrDerivedCap:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="Filled in for you"
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =18
                        - lblPrDerived:
                            Control: Label@2.5.1
                            Properties:
                              # Char(10) rather than a literal newline inside the string:
                              # a block scalar would bake this file's indentation into
                              # the value, and Studio's formula bar would show it.
                              Text: |
                                ="Completion date — stamped automatically when you set the phase to Complete, and kept if you save again."
                                 & Char(10) & Char(10) &
                                 "Progress % — recalculated from this project's task stages every time you save."
                              Font: =Theme.Font
                              Size: =Theme.Size.Small
                              Color: =Theme.Color.TextMuted
                              Width: =Parent.Width
                              Height: =96
            # -----------------------------------------------------------------
            # PEOPLE
            # -----------------------------------------------------------------
            - divPrPeople:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =Theme.Color.Border
                  Width: =Parent.Width - 48
                  Height: =1
            - secHeadPeople:
                Control: Label@2.5.1
                Properties:
                  Text: ="People"
                  Font: =Theme.Font
                  FontWeight: =FontWeight.Semibold
                  Size: =Theme.Size.H3
                  Color: =Theme.Color.Primary
                  Width: =Parent.Width - 48
                  Height: =24
            - lblPrPeopleNote:
                Control: Label@2.5.1
                Properties:
