# =============================================================================
# cmpEditableGrid  —  editable, spreadsheet-style grid (component wrapping a gallery)
# =============================================================================
# The "usable grid": edit many rows at once, add/delete rows, then the app does a
# single bulk save. A component CAN host a gallery, so the grid lives here.
#
# SCOPE / HONESTY: canvas apps cannot render N *dynamic* columns cleanly, so a
# truly generic grid isn't practical — real editable grids are list-specific.
# This is a working SCAFFOLD with three illustrative text columns and the full
# staging pattern; specialise the columns per list. The staging-collection and
# delegation-safe bulk Patch mechanics are owned by the `power-apps-editable-table`
# and `power-fx-development` skills — defer the heavy write logic there.
#
# Contract:
#   Items       (Input, Table)  — source rows to edit
#   EditedItems (Output, Table) — the live staging collection (app Patches this on save)
#   RowCount    (Output, Number)
#   AddRow      (Action)         — app/toolbar calls to append a blank row
#   OnCommit    (Event)          — raised by the Save button; app runs the bulk Patch
#
# Seeding: Items has RaiseOnReset:true, so a new Items auto-fires OnReset, which
# ClearCollects the staging copy. DIALECT v3.0 pa.yaml; gallery `Variant` and
# `HtmlViewer` are unconfirmed elsewhere but this file uses only grounded tokens
# except the gallery Variant. See _COMPONENTS-NOTES.md.
# =============================================================================
ComponentDefinitions:
  cmpEditableGrid:
    DefinitionType: CanvasComponent
    Description: Editable grid — staging collection, add/delete rows, single bulk-save via OnCommit.
    AccessAppScope: false
    CustomProperties:
      Items:
        PropertyKind: Input
        Description: Rows to edit. Illustrative schema {Id:Number, Col1:Text, Col2:Text, Col3:Text}.
        DataType: Table
        Default: |
          =Table({ Id: 0, Col1: "", Col2: "", Col3: "" })
        RaiseOnReset: true
      EditedItems:
        PropertyKind: Output
        Description: Live staging collection including edits and new/removed rows.
        DataType: Table
        Default: =colGrid
      RowCount:
        PropertyKind: Output
        Description: Number of rows currently staged.
        DataType: Number
        Default: =CountRows(colGrid)
      AddRow:
        PropertyKind: Action
        Description: Append a blank row to the staging collection.
        ReturnType: Boolean
        Parameters: {}
        Default: |
          =Collect(colGrid, { Id: 0, Col1: "", Col2: "", Col3: "" })
      OnCommit:
        PropertyKind: Event
        Description: Raised by the Save button. App runs the delegation-safe bulk Patch of EditedItems.
        ReturnType: Boolean
        Parameters: {}
    Properties:
      Height: =360
      Width: =640
      Fill: =RGBA(255, 255, 255, 1)
      # No OnStart in components; seed the staging copy on (re)set.
      OnReset: =ClearCollect(colGrid, cmpEditableGrid.Items)
    Children:
      - headerBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(0, 90, 158, 1)
            Height: =36
            Width: =Parent.Width
            X: =0
            Y: =0
      - hdrCol1:
          Control: Label@2.5.1
          Properties:
            Text: ="Column 1"
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Size: =12
            X: =12
            Y: =0
            Height: =36
            Width: =(Parent.Width - 60) / 3
            VerticalAlign: =VerticalAlign.Middle
      - hdrCol2:
          Control: Label@2.5.1
          Properties:
            Text: ="Column 2"
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Size: =12
            X: =12 + (Parent.Width - 60) / 3
            Y: =0
            Height: =36
            Width: =(Parent.Width - 60) / 3
            VerticalAlign: =VerticalAlign.Middle
      - hdrCol3:
          Control: Label@2.5.1
          Properties:
            Text: ="Column 3"
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Size: =12
            X: =12 + 2 * (Parent.Width - 60) / 3
            Y: =0
            Height: =36
            Width: =(Parent.Width - 60) / 3
            VerticalAlign: =VerticalAlign.Middle
      - galRows:
          Control: Gallery@2.15.0
          # UNCONFIRMED: blank vertical gallery variant (round-trip).
          Variant: Vertical
          Properties:
            Items: =colGrid
            Height: =Parent.Height - 36 - 48
            Width: =Parent.Width
            X: =0
            Y: =36
            TemplateSize: =44
            TemplatePadding: =0
          Children:
            - cellCol1:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =ThisItem.Col1
                  # Two-way edit: write the keystroke back into the staging row.
                  OnChange: |
                    =Patch(colGrid, ThisItem, { Col1: Self.Text })
                  Font: =Font.'Segoe UI'
                  Size: =13
                  X: =8
                  Y: =4
                  Height: =36
                  Width: =(Parent.TemplateWidth - 60) / 3 - 8
            - cellCol2:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =ThisItem.Col2
                  OnChange: |
                    =Patch(colGrid, ThisItem, { Col2: Self.Text })
                  Font: =Font.'Segoe UI'
                  Size: =13
                  X: =8 + (Parent.TemplateWidth - 60) / 3
                  Y: =4
                  Height: =36
                  Width: =(Parent.TemplateWidth - 60) / 3 - 8
            - cellCol3:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =ThisItem.Col3
                  OnChange: |
                    =Patch(colGrid, ThisItem, { Col3: Self.Text })
                  Font: =Font.'Segoe UI'
                  Size: =13
                  X: =8 + 2 * (Parent.TemplateWidth - 60) / 3
                  Y: =4
                  Height: =36
                  Width: =(Parent.TemplateWidth - 60) / 3 - 8
            - delRow:
                Control: Classic/Icon@2.5.0
                Properties:
                  Icon: =Icon.Trash
                  Color: =RGBA(197, 58, 58, 1)
                  OnSelect: =Remove(colGrid, ThisItem)
                  X: =Parent.TemplateWidth - 36
                  Y: =10
                  Height: =24
                  Width: =24
      - saveBtn:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Save changes"
            Fill: =RGBA(0, 90, 158, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            Size: =13
            BorderColor: =RGBA(0, 90, 158, 1)
            Height: =40
            Width: =160
            X: =Parent.Width - 172
            Y: =Parent.Height - 44
            OnSelect: =cmpEditableGrid.OnCommit()
