# =============================================================================
# cmpChoicePill  —  interactive filter/choice chip (component; screen-level)
# =============================================================================
# A CLICKABLE chip — filled when selected, outlined when not. This one IS a
# component (not an HtmlText function) because it must be clicked and raise an
# event, which HtmlText cannot do. Stateless: the APP owns which chip is selected
# (pass Selected in, toggle your own state in OnSelect) — keeps it reusable.
#
# Typical use — a filter bar of chips over a choice set (place on a screen, NOT
# in a gallery). For a purely DISPLAY chip inside a gallery row, use
# cmpUiKit.ChoicePillHtml(...) instead.
#
# Build: rounded look via an HtmlText control + a transparent Classic/Button
# overlay for the click. DIALECT v3.0 pa.yaml. `HtmlViewer@2.1.0` token is
# UNCONFIRMED (round-trip). See _COMPONENTS-NOTES.md.
# =============================================================================
ComponentDefinitions:
  cmpChoicePill:
    DefinitionType: CanvasComponent
    Description: Clickable filter chip — filled when Selected, outlined otherwise; raises OnSelect.
    AccessAppScope: false
    CustomProperties:
      Label:
        PropertyKind: Input
        Description: Chip text.
        DataType: Text
        Default: ="All"
      Selected:
        PropertyKind: Input
        Description: Filled (true) vs outlined (false). App-controlled.
        DataType: Boolean
        Default: =false
      OnSelect:
        PropertyKind: Event
        Description: Raised when the chip is tapped. App toggles its own selection state here.
        ReturnType: Boolean
        Parameters: {}
    Properties:
      Height: =32
      Width: =110
      Fill: =RGBA(0, 0, 0, 0)
    Children:
      - chipHtml:
          Control: HtmlViewer@2.1.0
          Properties:
            Height: =Parent.Height
            Width: =Parent.Width
            X: =0
            Y: =0
            HtmlText: |
              =If( cmpChoicePill.Selected,
                  "<div style='display:flex;height:100%;align-items:center;justify-content:center'><span style='background:#005A9E;color:#fff;padding:4px 14px;border-radius:15px;font:600 12px Segoe UI,Arial,sans-serif'>" & EncodeHTML(cmpChoicePill.Label) & "</span></div>",
                  "<div style='display:flex;height:100%;align-items:center;justify-content:center'><span style='background:#fff;color:#005A9E;padding:3px 13px;border:1px solid #005A9E;border-radius:15px;font:600 12px Segoe UI,Arial,sans-serif'>" & EncodeHTML(cmpChoicePill.Label) & "</span></div>"
              )
      - chipBtn:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Fill: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 90, 158, 0.06)
            PressedFill: =RGBA(0, 90, 158, 0.12)
            BorderColor: =RGBA(0, 0, 0, 0)
            Height: =Parent.Height
            Width: =Parent.Width
            X: =0
            Y: =0
            OnSelect: =cmpChoicePill.OnSelect()
