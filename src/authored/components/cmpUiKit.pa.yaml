# =============================================================================
# cmpUiKit  —  pure HTML-builder function library (gallery-safe cell renderers)
# =============================================================================
# WHY A FUNCTION LIBRARY, NOT PILL COMPONENTS: a canvas component CANNOT be placed
# inside a gallery or form (Power Apps limitation). Status/choice pills and person
# chips are almost always rendered per gallery row, so they are delivered here as
# OutputFunction properties that RETURN an HtmlText string. Drop a plain HtmlText
# control in the row (or anywhere) and set:
#     HtmlText = cmpUiKit.StatusPillHtml(ThisItem.Status, "auto")
#
# Colours mirror the App.Formulas `Theme` palette but are INLINED — a component is
# isolated and cannot read app globals. Keep these hex values in step with Theme.
#
# DIALECT: v3.0 pa.yaml (ComponentDefinitions). Function props use ReturnType +
# a Parameters map. All bodies are pure (params in → Text out) — no side effects,
# no variables, no other-property references (function-property rules).
#
# TRANSFER: components cross the air gap via the Studio component editor or a
# component library, NOT reliably via code-view paste. Treat this file as the
# spec of record; recreate each property from the contract. See _COMPONENTS-NOTES.md.
# =============================================================================
ComponentDefinitions:
  cmpUiKit:
    DefinitionType: CanvasComponent
    Description: Pure HtmlText-builder functions for gallery-safe pills, chips and person avatars.
    AccessAppScope: false
    CustomProperties:

      # -- Status pill: rounded colour-coded badge -----------------------------
      StatusPillHtml:
        PropertyKind: OutputFunction
        Description: Rounded status badge as HtmlText. tone auto-maps common status words to colour.
        ReturnType: Text
        Parameters:
          - label:
              DataType: Text
              IsOptional: false
              Description: Text shown in the pill.
          - tone:
              DataType: Text
              IsOptional: true
              Description: Neutral | Info | Success | Warning | Danger | auto.
              Default: ="auto"
      ChoicePillHtml:
        PropertyKind: OutputFunction
        Description: Filter/choice chip as HtmlText — filled accent when selected, outline when not. Display only.
        ReturnType: Text
        Parameters:
          - label:
              DataType: Text
              IsOptional: false
              Description: Chip text.
          - selected:
              DataType: Boolean
              IsOptional: true
              Description: Filled (true) vs outlined (false).
              Default: =false
      Initials:
        PropertyKind: OutputFunction
        Description: Up-to-two uppercase initials from a display name (e.g. "Ada Lovelace" -> "AL").
        ReturnType: Text
        Parameters:
          - name:
              DataType: Text
              IsOptional: false
              Description: Display name.
      PersonChipHtml:
        PropertyKind: OutputFunction
        Description: Person chip as HtmlText — a coloured initials avatar followed by the name.
        ReturnType: Text
        Parameters:
          - name:
              DataType: Text
              IsOptional: false
              Description: Display name.
    Properties:
      StatusPillHtml: |
        =With(
            { t:
                If( tone <> "auto",
                    tone,
                    Switch( true,
                        IsMatch(label, "(?i)^\s*(done|complete|completed|closed|approved|active|on track)\s*$"), "Success",
                        IsMatch(label, "(?i)^\s*(blocked|overdue|rejected|failed|error|breach)\s*$"),            "Danger",
                        IsMatch(label, "(?i)^\s*(at risk|pending|review|waiting|on hold|hold)\s*$"),             "Warning",
                        IsMatch(label, "(?i)^\s*(in progress|open|new|todo|to do)\s*$"),                          "Info",
                        "Neutral"
                    )
                )
            },
            With(
                { c: Switch(t, "Success","#31825D", "Warning","#D69828", "Danger","#C53A3A", "Info","#005A9E", "#6E7882") },
                "<span style='display:inline-block;background:" & c &
                ";color:#fff;padding:2px 10px;border-radius:11px;font:600 12px Segoe UI,Arial,sans-serif'>" &
                EncodeHTML(label) & "</span>"
            )
        )
      ChoicePillHtml: |
        =If( selected,
            "<span style='display:inline-block;background:#005A9E;color:#fff;padding:3px 12px;border-radius:13px;font:600 12px Segoe UI,Arial,sans-serif'>" & EncodeHTML(label) & "</span>",
            "<span style='display:inline-block;background:#fff;color:#005A9E;padding:2px 11px;border:1px solid #005A9E;border-radius:13px;font:600 12px Segoe UI,Arial,sans-serif'>" & EncodeHTML(label) & "</span>"
        )
      Initials: |
        =With(
            { parts: Filter(Split(Trim(name), " "), Len(Result) > 0) },
            Upper(
                Left( First(parts).Result, 1 ) &
                If( CountRows(parts) > 1, Left( Last(parts).Result, 1 ), "" )
            )
        )
      PersonChipHtml: |
        =If( IsBlank(Trim(name)),
            "<span style='color:#6E7882;font:italic 12px Segoe UI,Arial,sans-serif'>Unassigned</span>",
            With(
                { ini:
                    Upper(
                        Left(First(Filter(Split(Trim(name)," "),Len(Result)>0)).Result,1) &
                        If(CountRows(Filter(Split(Trim(name)," "),Len(Result)>0))>1,
                           Left(Last(Filter(Split(Trim(name)," "),Len(Result)>0)).Result,1), "")
                    )
                },
                "<span style='display:inline-flex;align-items:center;gap:6px;font:12px Segoe UI,Arial,sans-serif;color:#20262D'>" &
                "<span style='display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:11px;background:#005A9E;color:#fff;font-size:10px;font-weight:600'>" &
                EncodeHTML(ini) & "</span>" & EncodeHTML(name) & "</span>"
            )
        )
