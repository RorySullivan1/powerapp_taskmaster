# =============================================================================
# scrHome  —  personalised landing (screen-map §1). PHASE-2 DATA: header + nav
# + component instances bound to LIVE queries. OnVisible pulls my-tasks and
# my-issues delegably, then derives every figure locally. Column tokens resolve
# to schema/schema.yaml (the golden source).
#
# NOT RUNNABLE until the lists exist: a SharePoint data source can't be added
# to the app before its list is provisioned, so paste this only after
# taskmaster_tasks / taskmaster_issues are live and added as data sources.
#
# Component INSTANCES use v3.0 dialect: `Control: CanvasComponent` +
# `ComponentName:` + `Properties:` (base props X/Y/W/H AND custom props;
# instances have NO Children). The referenced components must exist in the app
# first (src/authored/components/). Screens CAN read the App.Formulas `Theme`
# (only components can't), so Theme.* tokens stay here.
#
# Demo UI-state globals (no schema, no OnStart — blank is falsy):
#   gToastMsg / gToastTone  — feed the toast; gConfirmOpen — the confirm modal.
# DIALECT: modern structured .pa.yaml; gallery `Variant` still round-trip-gated.
# =============================================================================
Screens:
  scrHome:
    Properties:
      Fill: =Theme.Color.Bg
      # ---- PHASE-2 DATA: one delegable pull, then local derivation ----------
      # The pattern (power-fx-development): narrow SERVER-side to a bounded set,
      # then aggregate LOCALLY — Sum/CountRows/Average never delegate to SharePoint.
      # Everything inside these two Filters delegates: Person `.Email =`, Choice
      # `.Value =`, and And/Or over them. Archived is excluded by ENUMERATING the
      # six live stages — `<> "Archived"` is a Text <> and would NOT delegate.
      # `task_supporter` is a single Person (C1), so "mine" is fully server-side.
      #
      # TWO LIMITS TO KNOW:
      #  * A delegable Filter still returns at most the DATA ROW LIMIT into a
      #    collection — set Settings > General > Data row limit to 2000. (While
      #    testing, set it to 1: any non-delegable clause then shows up instantly.)
      #  * task_stage / issue_status are REQUIRED with defaults (C9), so every row
      #    matches one of the enumerated values — these counts miss nothing.
      OnVisible: |
        =Concurrent(
            ClearCollect( colMyTasks,
                Filter( taskmaster_tasks,
                    ( task_lead.Email = gUserEmail || task_supporter.Email = gUserEmail )
                 && ( task_stage.Value = "Not Started"  || task_stage.Value = "Planning"
                   || task_stage.Value = "Drafting"     || task_stage.Value = "Under Review"
                   || task_stage.Value = "Finalizing"   || task_stage.Value = "Complete" ) ) ),
            ClearCollect( colMyIssues,
                Filter( taskmaster_issues,
                    ( issue_assignee.Email = gUserEmail || issue_owner.Email = gUserEmail )
                 && ( issue_status.Value = "Open"    || issue_status.Value = "Review"
                   || issue_status.Value = "Waiting" || issue_status.Value = "Blocked" ) ) )
        );
        Set( gMyOpen,
             CountRows( Filter(colMyTasks, task_stage.Value <> "Complete") ) );
        Set( gMyOverdue,
             CountRows( Filter( colMyTasks,
                 task_stage.Value <> "Complete"
              && !IsBlank(task_date_target) && task_date_target < Today() ) ) );
        Set( gMyIssuesOpen, CountRows(colMyIssues) );
        Set( gMyPercent,
             If( CountRows(colMyTasks) = 0, 0,
                 RoundDown( Average( AddColumns( colMyTasks, wgt,
                     Coalesce(LookUp(StageWeights, Stage = task_stage.Value, Weight), 0) ), wgt ), 0 ) ) )
    Children:
      # ---- Header band ----------------------------------------------------
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Primary
            Height: =Theme.Space.HeaderH
            Width: =Parent.Width
            X: =0
            Y: =0
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="EQD Taskmaster"
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            FontWeight: =FontWeight.Semibold
            Size: =Theme.Size.H2
            Height: =Theme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Theme.Space.Gutter
            Y: =0
            Width: =360
      - ScreenTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="Home"
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            Size: =Theme.Size.H3
            Align: =Align.Right
            Height: =Theme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Parent.Width - Self.Width - Theme.Space.Gutter
            Y: =0
            Width: =360
      # ---- Left nav panel + Table-driven nav gallery (pattern T6) ----------
      - NavPanel:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Surface
            Width: =Theme.Space.NavW
            Height: =Parent.Height - Theme.Space.HeaderH
            X: =0
            Y: =Theme.Space.HeaderH
      - NavGallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: =NavMenu
            TemplateSize: =Theme.Space.RowH
            TemplatePadding: =0
            Width: =Theme.Space.NavW
            Height: =Parent.Height - Theme.Space.HeaderH
            X: =0
            Y: =Theme.Space.HeaderH
            TemplateFill: =If(ThisItem.Screen = App.ActiveScreen, Theme.Color.Accent, Theme.Color.Surface)
            OnSelect: =Navigate(ThisItem.Screen, ScreenTransition.Fade)
          Children:
            - NavIcon:
                Control: Classic/Icon@2.5.0
                Properties:
                  Icon: =ThisItem.Icon
                  Color: =If(ThisItem.NeedsLicence && Not(gHasPowerBiLicence), Theme.Color.TextMuted, Theme.Color.Primary)
                  Height: =24
                  Width: =24
                  X: =Theme.Space.Gap
                  Y: =(Parent.TemplateHeight - Self.Height) / 2
            - NavLabel:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Title
                  Font: =Theme.Font
                  Size: =Theme.Size.Body
                  FontWeight: =If(ThisItem.Screen = App.ActiveScreen, FontWeight.Semibold, FontWeight.Normal)
                  Color: =If(ThisItem.NeedsLicence && Not(gHasPowerBiLicence), Theme.Color.TextMuted, Theme.Color.TextPrimary)
                  Height: =Parent.TemplateHeight
                  VerticalAlign: =VerticalAlign.Middle
                  X: =Theme.Space.Gap + 24 + Theme.Space.Gap
                  Width: =Parent.TemplateWidth - Self.X - Theme.Space.Gap
      # ---- Content: composed component instances (live data) ---------------
      - hdrMyWork:
          Control: CanvasComponent
          ComponentName: cmpSectionHeader
          Properties:
            X: =Theme.Space.NavW + Theme.Space.Gutter
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter
            Width: =Parent.Width - Theme.Space.NavW - (Theme.Space.Gutter * 2)
            Height: =60
            Title: ="My work"
            Subtitle: ="Tasks you lead or support, plus issues assigned to or owned by you"
            ShowAction: =true
            ActionLabel: ="Refresh"
            # Re-collect INLINE. Navigate() to the screen you are already on does
            # not reliably re-fire OnVisible, and it defers to the end of the chain
            # so the toast would fire first. Duplicated deliberately over being wrong.
            OnAction: |
              =Refresh(taskmaster_tasks); Refresh(taskmaster_issues);
              Concurrent(
                  ClearCollect( colMyTasks,
                      Filter( taskmaster_tasks,
                          ( task_lead.Email = gUserEmail || task_supporter.Email = gUserEmail )
                       && ( task_stage.Value = "Not Started"  || task_stage.Value = "Planning"
                         || task_stage.Value = "Drafting"     || task_stage.Value = "Under Review"
                         || task_stage.Value = "Finalizing"   || task_stage.Value = "Complete" ) ) ),
                  ClearCollect( colMyIssues,
                      Filter( taskmaster_issues,
                          ( issue_assignee.Email = gUserEmail || issue_owner.Email = gUserEmail )
                       && ( issue_status.Value = "Open"    || issue_status.Value = "Review"
                         || issue_status.Value = "Waiting" || issue_status.Value = "Blocked" ) ) )
              );
              Set( gMyOpen, CountRows(Filter(colMyTasks, task_stage.Value <> "Complete")) );
              Set( gMyOverdue,
                   CountRows( Filter( colMyTasks,
                       task_stage.Value <> "Complete"
                    && !IsBlank(task_date_target) && task_date_target < Today() ) ) );
              Set( gMyIssuesOpen, CountRows(colMyIssues) );
              Set( gMyPercent,
                   If( CountRows(colMyTasks) = 0, 0,
                       RoundDown( Average( AddColumns( colMyTasks, wgt,
                           Coalesce(LookUp(StageWeights, Stage = task_stage.Value, Weight), 0) ), wgt ), 0 ) ) );
              Set(gToastMsg, "Refreshed"); Set(gToastTone, "Info"); cmpToastHome.Show()
      # Three KPI cards, fed by the locals Set in OnVisible. Trend has no
      # historical source in this model, so it is omitted rather than faked.
      - cardOpen:
          Control: CanvasComponent
          ComponentName: cmpStatusCard
          Properties:
            X: =Theme.Space.NavW + Theme.Space.Gutter
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter + 60 + Theme.Space.Gap
            Width: =(Parent.Width - Theme.Space.NavW - (Theme.Space.Gutter * 2) - (Theme.Space.Gap * 2)) / 3
            Height: =120
            Title: ="Open tasks"
            Value: =Text(gMyOpen)
            Caption: ="tasks you lead or support"
            Trend: =0
            Accent: =Theme.Color.Primary
            OnSelect: =Navigate(scrProjects, ScreenTransition.Fade)
      - cardOverdue:
          Control: CanvasComponent
          ComponentName: cmpStatusCard
          Properties:
            X: =Theme.Space.NavW + Theme.Space.Gutter + ((Parent.Width - Theme.Space.NavW - (Theme.Space.Gutter * 2) - (Theme.Space.Gap * 2)) / 3) + Theme.Space.Gap
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter + 60 + Theme.Space.Gap
            Width: =(Parent.Width - Theme.Space.NavW - (Theme.Space.Gutter * 2) - (Theme.Space.Gap * 2)) / 3
            Height: =120
            Title: ="Overdue"
            Value: =Text(gMyOverdue)
            Caption: ="past their due date"
            Trend: =0
            Accent: =Theme.Color.Danger
            OnSelect: =Navigate(scrProjects, ScreenTransition.Fade)
      - cardIssues:
          Control: CanvasComponent
          ComponentName: cmpStatusCard
          Properties:
            X: =Theme.Space.NavW + Theme.Space.Gutter + 2 * (((Parent.Width - Theme.Space.NavW - (Theme.Space.Gutter * 2) - (Theme.Space.Gap * 2)) / 3) + Theme.Space.Gap)
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter + 60 + Theme.Space.Gap
            Width: =(Parent.Width - Theme.Space.NavW - (Theme.Space.Gutter * 2) - (Theme.Space.Gap * 2)) / 3
            Height: =120
            Title: ="Open issues"
            Value: =Text(gMyIssuesOpen)
            Caption: ="assigned to or owned by you"
            Trend: =0
            Accent: =Theme.Color.Warning
            OnSelect: =Navigate(scrProjects, ScreenTransition.Fade)
      # SVG completion ring (licence-free Q2 fallback). Weighted mean of your
      # task stages, using the StageWeights table in App.Formulas (C3).
      - ringHome:
          Control: CanvasComponent
          ComponentName: cmpKpiRing
          Properties:
            X: =Theme.Space.NavW + Theme.Space.Gutter
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter + 60 + Theme.Space.Gap + 120 + Theme.Space.Gutter
            Width: =140
            Height: =140
            Percent: =gMyPercent
            Label: =gMyPercent & "%"
            AccentHex: ="#005A9E"
            TrackHex: ="#E1E5EB"
      - lblRing:
          Control: Label@2.5.1
          Properties:
            Text: ="Your weighted completion across " & CountRows(colMyTasks) & " task(s)"
            Color: =Theme.Color.TextMuted
            Font: =Theme.Font
            Size: =Theme.Size.Body
            X: =Theme.Space.NavW + Theme.Space.Gutter + 140 + Theme.Space.Gap
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter + 60 + Theme.Space.Gap + 120 + Theme.Space.Gutter + 56
            Width: =260
            Height: =24
            VerticalAlign: =VerticalAlign.Middle
      # Demo trigger for the confirm dialog (destructive pattern).
      - btnArchive:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Archive a project…"
            Fill: =Theme.Color.Surface
            Color: =Theme.Color.Danger
            BorderColor: =Theme.Color.Danger
            BorderThickness: =1
            Font: =Theme.Font
            Size: =Theme.Size.Body
            Height: =40
            Width: =200
            X: =Theme.Space.NavW + Theme.Space.Gutter + 140 + Theme.Space.Gap
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter + 60 + Theme.Space.Gap + 120 + Theme.Space.Gutter + 90
            OnSelect: =Set(gConfirmOpen, true)
      # Toast (bottom-right). Set gToastMsg/gToastTone then call .Show().
      - cmpToastHome:
          Control: CanvasComponent
          ComponentName: cmpToast
          Properties:
            X: =Parent.Width - 340 - Theme.Space.Gutter
            Y: =Parent.Height - 56 - Theme.Space.Gutter
            Width: =340
            Height: =56
            Message: =gToastMsg
            Tone: =gToastTone
            Duration: =3000
      # Confirm modal (full-screen; declared LAST so it layers on top).
      - cmpConfirmHome:
          Control: CanvasComponent
          ComponentName: cmpConfirmDialog
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            IsOpen: =gConfirmOpen
            Title: ="Archive this project?"
            Message: ="It will be hidden from active lists. You can restore it from Admin."
            ConfirmLabel: ="Archive"
            CancelLabel: ="Cancel"
            Destructive: =true
            OnConfirm: =Set(gConfirmOpen, false); Set(gToastMsg, "Archive is wired on the project detail screen"); Set(gToastTone, "Info"); cmpToastHome.Show()
            OnCancel: =Set(gConfirmOpen, false)
