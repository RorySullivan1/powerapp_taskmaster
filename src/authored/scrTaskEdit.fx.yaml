            Size: =Theme.Size.Small
            Color: =Theme.Color.TextMuted
            X: =580
            Y: =140
            Width: =760
            Height: =18
      - selTkStage:
          Control: CanvasComponent
          ComponentName: cmpSelection
          Properties:
            Visible: =gTaskEditTab = 1
            X: =580
            Y: =160
            Width: =760
            Height: =40
