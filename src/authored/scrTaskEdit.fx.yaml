                   IfError( Text(DateValue(txtTkTarget.Text), "dd mmm yyyy"), "⚠ not a date" ) )
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Color: |
              =If( Len(txtTkTarget.Text) > 0 && IsError(DateValue(txtTkTarget.Text)),
                   Theme.Color.Danger, Theme.Color.TextMuted )
            X: =1088
            Y: =302
            Width: =160
            Height: =36
            VerticalAlign: =VerticalAlign.Middle
      - lblTkDoneCap:
