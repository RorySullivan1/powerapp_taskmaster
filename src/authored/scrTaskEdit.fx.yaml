      # ---- Save / Cancel ----------------------------------------------------
      - btnTkSave:
          Control: Classic/Button@2.2.0
          Properties:
            Text: |
              =If(gEditMode = "Edit", "Save task", "Create task")
            DisplayMode: |
              =If(Len(lblTkMissing.Text) = 0, DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =Theme.Color.Primary
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            Size: =Theme.Size.Body
            Height: =44
            Width: =200
            X: =24
            Y: =660
            # Required + always-writable fields first; optional ones after, each
            # guarded (see pattern 4). Then the C3 rollup — LAST, because it must
            # read the task's post-save stage, not the pre-edit one.
            OnSelect: |
              =Set( gTkSaved, Blank() );
              Set( gTkErr, "" );
              IfError(
                  Set( gTkSaved,
                      Patch( taskmaster_tasks,
                             If( gEditMode = "Edit", gEditTask, Defaults(taskmaster_tasks) ),
                             { task_name:            Trim(txtTkName.Text),
                               task_project_id:      { Id: gTkProject.Id, Value: gTkProject.Value },
                               task_description:     txtTkDesc.Text,
                               task_stage:           { Value: gTkStage },
                               task_status:          { Value: gTkStatus },
                               task_priority:        { Value: gTkPriority },
                               task_lead:
                                   { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                     Claims:      ClaimPrefix & Lower(gTkLead.Mail),
                                     DisplayName: gTkLead.DisplayName,
                                     Email:       gTkLead.Mail,
                                     Department: "", JobTitle: "", Picture: "" },
                               task_date_start:      IfError( DateValue(txtTkStart.Text),  Blank() ),
                               task_date_target:     IfError( DateValue(txtTkTarget.Text), Blank() ),
                               task_date_completion: IfError( DateValue(txtTkDone.Text),   Blank() ) } ) ),
                  Set( gTkErr, FirstError.Message )
              );
              If( Len(gTkErr) > 0,
                  Notify("Couldn't save the task: " & gTkErr, NotificationType.Error) );
              If( Len(gTkErr) = 0,
                  // --- optional fields, one guarded Patch each ---------------
                  If( Len(gTkSupporter.Mail) > 0,
                      IfError( Patch(taskmaster_tasks, gTkSaved,
                                     { task_supporter:
                                         { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                           Claims:      ClaimPrefix & Lower(gTkSupporter.Mail),
                                           DisplayName: gTkSupporter.DisplayName,
                                           Email:       gTkSupporter.Mail,
                                           Department: "", JobTitle: "", Picture: "" } }),
                               Notify("Task saved; the supporter didn't stick: " & FirstError.Message, NotificationType.Warning) ),
                      gEditMode = "Edit",
                      IfError( Patch(taskmaster_tasks, gTkSaved, { task_supporter: Blank() }),
                               Notify("Task saved; the supporter didn't clear: " & FirstError.Message, NotificationType.Warning) ) );
                  // Managed metadata (C10). THE RISKIEST WRITE IN THE APP: the
                  // SPListExpandedTaxonomy shape is community-confirmed, not
                  // first-party. It is deliberately its own Patch so a failure
                  // here cannot lose the rest of the task.
                  If( Len(gTkCatGuid) > 0 && gTkCatDone,
                      IfError( Patch(taskmaster_tasks, gTkSaved,
                                     { task_category:
                                         { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedTaxonomy",
                                           TermGuid: gTkCatGuid,
                                           Label:    gTkCatLabel,
                                           WssId:    -1,
                                           Path:     gTkCatPath,
                                           Value:    gTkCatLabel } }),
                               Notify("Task saved; the category didn't stick: " & FirstError.Message, NotificationType.Warning) ) );
                  If( gTkApproval.Id > 0,
                      IfError( Patch(taskmaster_tasks, gTkSaved,
                                     { task_output_approval: { Id: gTkApproval.Id, Value: gTkApproval.Value } }),
                               Notify("Task saved; the approval link didn't stick: " & FirstError.Message, NotificationType.Warning) ) );
                  If( gTkClient.Id > 0,
                      IfError( Patch(taskmaster_tasks, gTkSaved,
                                     { task_client_name: { Id: gTkClient.Id, Value: gTkClient.Value } }),
                               Notify("Task saved; the client link didn't stick: " & FirstError.Message, NotificationType.Warning) ) );
                  If( gTkProduct.Id > 0,
                      IfError( Patch(taskmaster_tasks, gTkSaved,
                                     { task_product_id: { Id: gTkProduct.Id, Value: gTkProduct.Value } }),
                               Notify("Task saved; the product link didn't stick: " & FirstError.Message, NotificationType.Warning) ) );
                  If( gTkLanguage <> "(none)",
                      IfError( Patch(taskmaster_tasks, gTkSaved, { task_output_language: { Value: gTkLanguage } }),
                               Notify("Task saved; the language didn't stick: " & FirstError.Message, NotificationType.Warning) ),
                      gEditMode = "Edit",
                      IfError( Patch(taskmaster_tasks, gTkSaved, { task_output_language: Blank() }),
                               Notify("Task saved; the language didn't clear: " & FirstError.Message, NotificationType.Warning) ) );
                  If( gTkFormat <> "(none)",
                      IfError( Patch(taskmaster_tasks, gTkSaved, { task_output_format: { Value: gTkFormat } }),
                               Notify("Task saved; the format didn't stick: " & FirstError.Message, NotificationType.Warning) ),
                      gEditMode = "Edit",
                      IfError( Patch(taskmaster_tasks, gTkSaved, { task_output_format: Blank() }),
                               Notify("Task saved; the format didn't clear: " & FirstError.Message, NotificationType.Warning) ) );
                  If( gTkBranding <> "(none)",
                      IfError( Patch(taskmaster_tasks, gTkSaved, { task_output_branding: { Value: gTkBranding } }),
                               Notify("Task saved; the branding didn't stick: " & FirstError.Message, NotificationType.Warning) ),
                      gEditMode = "Edit",
                      IfError( Patch(taskmaster_tasks, gTkSaved, { task_output_branding: Blank() }),
                               Notify("Task saved; the branding didn't clear: " & FirstError.Message, NotificationType.Warning) ) );
                  If( gTkClientStage <> "(none)",
                      IfError( Patch(taskmaster_tasks, gTkSaved, { task_client_stage: { Value: gTkClientStage } }),
                               Notify("Task saved; the client stage didn't stick: " & FirstError.Message, NotificationType.Warning) ),
                      gEditMode = "Edit",
                      IfError( Patch(taskmaster_tasks, gTkSaved, { task_client_stage: Blank() }),
                               Notify("Task saved; the client stage didn't clear: " & FirstError.Message, NotificationType.Warning) ) );
                  // --- C3: rewrite the parent project's weighted completion ---
                  // Identical to scrTask's block. Delegable Filter on the indexed
                  // FK plus an Or-of-equals over the six live stages (`<> "Archived"`
                  // is a Text <> and would NOT delegate). Average/CountRows then run
                  // LOCALLY over one project's page — which is only exact below the
                  // row limit, hence the refusal below.
                  With( { pid: gTkProject.Id },
                      With( { proj: LookUp(taskmaster_projects, ID = pid),
                              scored:
                                AddColumns(
                                    Filter( taskmaster_tasks,
                                        task_project_id.Id = pid
                                     && ( task_stage.Value = "Not Started"  || task_stage.Value = "Planning"
                                       || task_stage.Value = "Drafting"     || task_stage.Value = "Under Review"
                                       || task_stage.Value = "Finalizing"   || task_stage.Value = "Complete" ) ),
                                    "wgt", Coalesce(LookUp(StageWeights, Stage = task_stage.Value, Weight), 0) ) },
                          If( IsBlank(proj),
                              Notify("Task saved. Parent project not found, so completion was left unchanged.",
                                     NotificationType.Warning),
                              CountRows(scored) >= 2000,
                              Notify("Task saved. This project has too many tasks to compute completion accurately, so it was left unchanged.",
                                     NotificationType.Warning),
                              IfError(
                                  Set( gSelProject,
                                      Patch( taskmaster_projects, proj,
                                             { project_perc_completion:
                                                   If( CountRows(scored) = 0, 0,
                                                       RoundDown(Average(scored, wgt), 0) ) } ) ),
                                  Notify("Task saved, but the project rollup didn't update: " & FirstError.Message,
                                         NotificationType.Warning) ) ) ) );
                  Notify( If(gEditMode = "Edit", "Task saved", "Task created"), NotificationType.Success );
                  Back()
              )
