      - lblTkClientCap:
          Control: Label@2.5.1
          Properties:
            Visible: =gTaskEditTab = 2
            Text: ="Client"
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Color: =Theme.Color.TextMuted
            X: =24
            Y: =206
            Width: =520
            Height: =18
      - txtTkClientSearch:
          Control: Classic/TextInput@2.3.2
          Properties:
            Visible: =gTaskEditTab = 2
            HintText: ="Type to find a client…"
            DelayOutput: =true
            Font: =Theme.Font
            Size: =Theme.Size.Small
            X: =24
            Y: =226
            Width: =280
            Height: =36
      - lblTkClientChip:
          Control: Label@2.5.1
          Properties:
            Visible: =gTaskEditTab = 2
            Text: |
              =If(gTkClient.Id > 0, gTkClient.Value, "— none —")
