            Font: =Theme.Font
            Size: =Theme.Size.Small
            Color: |
              =If(gTkProject.Id > 0, Theme.Color.TextPrimary, Theme.Color.TextMuted)
            X: =312
            Y: =230
            Width: =208
            Height: =36
            VerticalAlign: =VerticalAlign.Middle
      - icoTkProjClear:
          Control: Classic/Icon@2.5.0
          Properties:
            Visible: =gTaskEditTab = 1 && gTkProject.Id > 0
