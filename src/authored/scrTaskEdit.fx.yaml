          Properties:
            Visible: =gTaskEditTab = 1
            Default: |
              =If( gEditMode = "Edit" && !IsBlank(gEditTask.task_date_completion),
                   Text(gEditTask.task_date_completion, "dd/mm/yyyy"), "" )
            HintText: ="dd/mm/yyyy"
            Font: =Theme.Font
            Size: =Theme.Size.Small
            X: =580
            Y: =368
            Width: =160
            Height: =36
      - lblTkDoneEcho:
          Control: Label@2.5.1
          Properties:
            Visible: =gTaskEditTab = 1
            Text: |
              =If( Len(txtTkDone.Text) = 0, "not set",
                   IfError( Text(DateValue(txtTkDone.Text), "dd mmm yyyy"), "⚠ not a date" ) )
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Color: |
              =If( Len(txtTkDone.Text) > 0 && IsError(DateValue(txtTkDone.Text)),
                   Theme.Color.Danger, Theme.Color.TextMuted )
            X: =748
            Y: =368
            Width: =200
