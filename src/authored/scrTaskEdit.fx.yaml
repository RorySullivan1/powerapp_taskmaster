              =Table( { Id: 1, Label: "Not Started" }, { Id: 2, Label: "Planning" },
                      { Id: 3, Label: "Drafting" },    { Id: 4, Label: "Under Review" },
                      { Id: 5, Label: "Finalizing" },  { Id: 6, Label: "Complete" },
                      { Id: 7, Label: "Archived" } )
            DefaultId: |
              =Switch( If(gEditMode = "Edit", Coalesce(gEditTask.task_stage.Value, "Not Started"), "Not Started"),
                       "Not Started", 1, "Planning", 2, "Drafting", 3,
                       "Under Review", 4, "Finalizing", 5, "Complete", 6, 7 )
            OnChange: |
              =Set(gTkStage, selTkStage.Selected.Label)
      - lblTkStatusCap:
          Control: Label@2.5.1
          Properties:
            Visible: =gTaskEditTab = 1
            Text: ="Health  *"
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Color: =Theme.Color.TextMuted
            X: =580
            Y: =210
            Width: =300
            Height: =18
      - selTkStatus:
          Control: CanvasComponent
          ComponentName: cmpSelection
          Properties:
            Visible: =gTaskEditTab = 1
            X: =580
            Y: =230
            Width: =300
            Height: =40
            Items: |
              =Table( { Id: 1, Label: "Green" }, { Id: 2, Label: "Amber" }, { Id: 3, Label: "Red" } )
            DefaultId: |
              =Switch( If(gEditMode = "Edit", Coalesce(gEditTask.task_status.Value, "Green"), "Green"),
                       "Green", 1, "Amber", 2, 3 )
            OnChange: |
              =Set(gTkStatus, selTkStatus.Selected.Label)
      - lblTkPriorityCap:
          Control: Label@2.5.1
          Properties:
            Visible: =gTaskEditTab = 1
            Text: ="Priority  *"
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Color: =Theme.Color.TextMuted
            X: =900
            Y: =210
            Width: =440
            Height: =18
      - selTkPriority:
          Control: CanvasComponent
          ComponentName: cmpSelection
          Properties:
            Visible: =gTaskEditTab = 1
            X: =900
            Y: =230
            Width: =440
            Height: =40
            Items: |
              =Table( { Id: 1, Label: "Low" }, { Id: 2, Label: "Moderate" },
                      { Id: 3, Label: "High" }, { Id: 4, Label: "Critical" } )
            DefaultId: |
              =Switch( If(gEditMode = "Edit", Coalesce(gEditTask.task_priority.Value, "Moderate"), "Moderate"),
                       "Low", 1, "Moderate", 2, "High", 3, 4 )
            OnChange: |
              =Set(gTkPriority, selTkPriority.Selected.Label)
      - lblTkStartCap:
          Control: Label@2.5.1
          Properties:
            Visible: =gTaskEditTab = 1
            # C4: task_date_start is a real DateTime written at creation, not a
            # Calculated column — that is what makes it indexable and sortable.
            Text: ="Start date"
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Color: =Theme.Color.TextMuted
            X: =580
            Y: =282
            Width: =240
            Height: =18
      - txtTkStart:
          Control: Classic/TextInput@2.3.2
          Properties:
            Visible: =gTaskEditTab = 1
            Default: |
              =If( gEditMode = "Edit",
                   If( IsBlank(gEditTask.task_date_start), "",
                       Text(gEditTask.task_date_start, "dd/mm/yyyy") ),
                   Text(Today(), "dd/mm/yyyy") )
            HintText: ="dd/mm/yyyy"
            Font: =Theme.Font
            Size: =Theme.Size.Small
            X: =580
            Y: =302
            Width: =160
            Height: =36
      - lblTkStartEcho:
          Control: Label@2.5.1
          Properties:
            Visible: =gTaskEditTab = 1
            Text: |
              =If( Len(txtTkStart.Text) = 0, "not set",
                   IfError( Text(DateValue(txtTkStart.Text), "dd mmm yyyy"), "⚠ not a date" ) )
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Color: |
              =If( Len(txtTkStart.Text) > 0 && IsError(DateValue(txtTkStart.Text)),
                   Theme.Color.Danger, Theme.Color.TextMuted )
            X: =748
            Y: =302
            Width: =160
            Height: =36
            VerticalAlign: =VerticalAlign.Middle
      - lblTkTargetCap:
          Control: Label@2.5.1
          Properties:
            Visible: =gTaskEditTab = 1
            Text: ="Due date"
            Font: =Theme.Font
            Size: =Theme.Size.Small
            Color: =Theme.Color.TextMuted
            X: =920
            Y: =282
            Width: =240
            Height: =18
      - txtTkTarget:
