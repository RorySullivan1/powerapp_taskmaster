# =============================================================================
# scrHome.skeleton  —  COMPONENT-FREE, DATA-FREE navigable shell for scrHome.
# Paste this INSTEAD of src/authored/scrHome.pa.yaml when you want a navigable
# app NOW, before any component is built or any list is provisioned. Needs only
# App.Formulas (Theme + NavMenu + gHasPowerBiLicence) in the formula bar — no
# CanvasComponent instances, no OnVisible data queries. Swap in the full
# scrHome.pa.yaml later once the components exist and the lists are provisioned.
# Header + nav block is identical to scrReference/scrAdmin (the proven shells).
# DIALECT: modern structured .pa.yaml; grounded tokens only.
# =============================================================================
Screens:
  scrHome:
    Properties:
      Fill: =Theme.Color.Bg
    Children:
      # ---- Content placeholder (no components, no data) --------------------
      - HomeEmpty:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Surface
            Height: =Parent.Height - Theme.Space.HeaderH - (Theme.Space.Gutter * 2)
            Width: =Parent.Width - (Theme.Space.Gutter * 2)
            X: =Theme.Space.Gutter
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter
      - HomeEmptyLabel:
          Control: Label@2.5.1
          Properties:
            Text: ="Your work summary — open tasks, overdue, open issues — and the completion ring live here once the KPI components are built and the lists are provisioned. (Skeleton view — navigation works now.)"
            Font: =Theme.Font
            Size: =Theme.Size.Body
            Color: =Theme.Color.TextMuted
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            X: =HomeEmpty.X + Theme.Space.Gutter
            Y: =HomeEmpty.Y
            Width: =HomeEmpty.Width - (Theme.Space.Gutter * 2)
            Height: =HomeEmpty.Height
      # ---- The whole shell is one component: header bar + fly-out nav rail ----
      # DECLARED LAST so positional z-order floats the fly-out over the content.
      #
      # Height is dynamic and that is the whole trick: a component intercepts every
      # click inside its bounds, so closed it must own nothing but the 64px header
      # strip. Open, covering the screen is exactly right — the scrim wants the click.
      #
      # cmpAppBar cannot Navigate (a component can't see app screens), so it reports
      # the chosen entry and this screen does the navigating.
      - appBar:
          Control: CanvasComponent
          ComponentName: cmpAppBar
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =If(gNavOpen, Parent.Height, Theme.Space.HeaderH)
            Items: =NavMenu
            ActiveKey: =1
            HasLicence: =gHasPowerBiLicence
            AppTitle: ="EQD Taskmaster"
            ScreenTitle: ="Home"
            IsOpen: =gNavOpen
            OnToggle: =Set(gNavOpen, !gNavOpen)
            OnNavigate: |
              =Switch( appBar.SelectedKey,
                       1, Navigate(scrHome, ScreenTransition.Fade),
                       2, Navigate(scrReports, ScreenTransition.Fade),
                       3, Navigate(scrProjects, ScreenTransition.Fade),
                       4, Navigate(scrReference, ScreenTransition.Fade),
                          Navigate(scrAdmin, ScreenTransition.Fade) );
              Set(gNavOpen, false)
