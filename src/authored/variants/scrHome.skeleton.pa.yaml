# =============================================================================
# scrHome.skeleton  —  COMPONENT-FREE, DATA-FREE navigable shell for scrHome.
# Paste this INSTEAD of src/authored/scrHome.pa.yaml when you want a navigable
# app NOW, before any component is built or any list is provisioned. Needs only
# App.Formulas (Theme + NavMenu + gHasPowerBiLicence) in the formula bar — no
# CanvasComponent instances, no OnVisible data queries. Swap in the full
# scrHome.pa.yaml later once the components exist and the lists are provisioned.
# Header + nav block is identical to scrReference/scrAdmin (the proven shells).
# DIALECT: modern structured .pa.yaml; grounded tokens only.
# =============================================================================
Screens:
  scrHome:
    Properties:
      Fill: =Theme.Color.Bg
    Children:
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Primary
            Height: =Theme.Space.HeaderH
            Width: =Parent.Width
            X: =0
            Y: =0
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="EQD Taskmaster"
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            FontWeight: =FontWeight.Semibold
            Size: =Theme.Size.H2
            Height: =Theme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Theme.Space.Gutter
            Y: =0
            Width: =360
      - ScreenTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="Home"
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            Size: =Theme.Size.H3
            Align: =Align.Right
            Height: =Theme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Parent.Width - Self.Width - Theme.Space.Gutter
            Y: =0
            Width: =360
      - NavPanel:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Surface
            Width: =Theme.Space.NavW
            Height: =Parent.Height - Theme.Space.HeaderH
            X: =0
            Y: =Theme.Space.HeaderH
      - NavGallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: =NavMenu
            TemplateSize: =Theme.Space.RowH
            TemplatePadding: =0
            Width: =Theme.Space.NavW
            Height: =Parent.Height - Theme.Space.HeaderH
            X: =0
            Y: =Theme.Space.HeaderH
            TemplateFill: =If(ThisItem.Screen = App.ActiveScreen, Theme.Color.Accent, Theme.Color.Surface)
            OnSelect: =Navigate(ThisItem.Screen, ScreenTransition.Fade)
          Children:
            - NavIcon:
                Control: Classic/Icon@2.5.0
                Properties:
                  Icon: =ThisItem.Icon
                  Color: =If(ThisItem.NeedsLicence && Not(gHasPowerBiLicence), Theme.Color.TextMuted, Theme.Color.Primary)
                  Height: =24
                  Width: =24
                  X: =Theme.Space.Gap
                  Y: =(Parent.TemplateHeight - Self.Height) / 2
            - NavLabel:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Title
                  Font: =Theme.Font
                  Size: =Theme.Size.Body
                  FontWeight: =If(ThisItem.Screen = App.ActiveScreen, FontWeight.Semibold, FontWeight.Normal)
                  Color: =If(ThisItem.NeedsLicence && Not(gHasPowerBiLicence), Theme.Color.TextMuted, Theme.Color.TextPrimary)
                  Height: =Parent.TemplateHeight
                  VerticalAlign: =VerticalAlign.Middle
                  X: =Theme.Space.Gap + 24 + Theme.Space.Gap
                  Width: =Parent.TemplateWidth - Self.X - Theme.Space.Gap
      # ---- Content placeholder (no components, no data) --------------------
      - HomeEmpty:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Surface
            Height: =Parent.Height - Theme.Space.HeaderH - (Theme.Space.Gutter * 2)
            Width: =Parent.Width - Theme.Space.NavW - (Theme.Space.Gutter * 2)
            X: =Theme.Space.NavW + Theme.Space.Gutter
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter
      - HomeEmptyLabel:
          Control: Label@2.5.1
          Properties:
            Text: ="Your work summary — open tasks, overdue, open issues — and the completion ring live here once the KPI components are built and the lists are provisioned. (Skeleton view — navigation works now.)"
            Font: =Theme.Font
            Size: =Theme.Size.Body
            Color: =Theme.Color.TextMuted
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            X: =HomeEmpty.X + Theme.Space.Gutter
            Y: =HomeEmpty.Y
            Width: =HomeEmpty.Width - (Theme.Space.Gutter * 2)
            Height: =HomeEmpty.Height
