# =============================================================================
# scrReports.skeleton  —  COMPONENT-FREE, DATA-FREE navigable shell for scrReports.
# Paste INSTEAD of src/authored/scrReports.pa.yaml for a navigable app before any
# component/list exists. Needs only App.Formulas. No CanvasComponent instances,
# no data queries. Swap in the full scrReports.pa.yaml later.
# Header + nav identical to the proven shells. DIALECT: modern .pa.yaml.
# =============================================================================
Screens:
  scrReports:
    Properties:
      Fill: =Theme.Color.Bg
    Children:
      - HeaderBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Primary
            Height: =Theme.Space.HeaderH
            Width: =Parent.Width
            X: =0
            Y: =0
      - AppTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="EQD Taskmaster"
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            FontWeight: =FontWeight.Semibold
            Size: =Theme.Size.H2
            Height: =Theme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Theme.Space.Gutter
            Y: =0
            Width: =360
      - ScreenTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="Reports"
            Color: =Theme.Color.OnPrimary
            Font: =Theme.Font
            Size: =Theme.Size.H3
            Align: =Align.Right
            Height: =Theme.Space.HeaderH
            VerticalAlign: =VerticalAlign.Middle
            X: =Parent.Width - Self.Width - Theme.Space.Gutter
            Y: =0
            Width: =360
      # The whole rail is one component now — see components/cmpNavMenu.pa.yaml.
      # It cannot Navigate (a component can't see app screens), so it reports the
      # chosen entry and this screen does the navigating.
      - navMenu:
          Control: CanvasComponent
          ComponentName: cmpNavMenu
          Properties:
            X: =0
            Y: =Theme.Space.HeaderH
            Width: =Theme.Space.NavW
            Height: =Parent.Height - Theme.Space.HeaderH
            Items: =NavMenu
            ActiveKey: =2
            HasLicence: =gHasPowerBiLicence
            OnNavigate: |
              =Switch( navMenu.SelectedKey,
                       1, Navigate(scrHome, ScreenTransition.Fade),
                       2, Navigate(scrReports, ScreenTransition.Fade),
                       3, Navigate(scrProjects, ScreenTransition.Fade),
                       4, Navigate(scrReference, ScreenTransition.Fade),
                          Navigate(scrAdmin, ScreenTransition.Fade) )
      # ---- Content placeholder (no components, no data) --------------------
      - ReportsEmpty:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Color.Surface
            Height: =Parent.Height - Theme.Space.HeaderH - (Theme.Space.Gutter * 2)
            Width: =Parent.Width - Theme.Space.NavW - (Theme.Space.Gutter * 2)
            X: =Theme.Space.NavW + Theme.Space.Gutter
            Y: =Theme.Space.HeaderH + Theme.Space.Gutter
      - ReportsEmptyLabel:
          Control: Label@2.5.1
          Properties:
            Text: ="The Power BI surface (licence-gated) and the licence-free KPI rings live here once the components are built and the lists are provisioned. gHasPowerBiLicence is false by decision — unlicensed users see the rings. (Skeleton view — navigation works now.)"
            Font: =Theme.Font
            Size: =Theme.Size.Body
            Color: =Theme.Color.TextMuted
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            X: =ReportsEmpty.X + Theme.Space.Gutter
            Y: =ReportsEmpty.Y
            Width: =ReportsEmpty.Width - (Theme.Space.Gutter * 2)
            Height: =ReportsEmpty.Height
