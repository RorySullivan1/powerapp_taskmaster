  asset_library:
    role: Linked output assets. Referenced by taskmaster_tasks.task_output_asset.
    provisioned: unknown
    join_cost: 1
    # MINIMAL BY INSTRUCTION (2026-08-05): "only the name is used as a lookup, just
    # assume asset_name". The app therefore binds exactly one column. Whatever else
