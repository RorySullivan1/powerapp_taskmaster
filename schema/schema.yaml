# =============================================================================
# PROVISIONING VERIFICATION — check the live lists against this file.
#
# The lists went live 2026-08-04. Nothing reads SharePoint back into this repo,
# so a mismatch is silent until a screen errors — which is exactly how
# project_requestor was found (provisioned multi, corrected to single the same
# day). Four things drift most easily, in order of how loudly they fail:
#
#  1. ARITY — `multi:` on every Person AND Managed Metadata column. A multi
#     column returns a TABLE, so the read errors ("expecting a Table", because
#     Coalesce types from its first argument) and the write fails too: the app
#     hands back one expanded-user record / one `LookUp(Choices(…))` record, and
#     neither is a table. **Both have already bitten** — project_requestor was
#     provisioned multi-Person, project_region and project_coverage multi-value
#     MM; all three corrected 2026-08-04. That leaves 8 Person and 6 MM columns
#     still unverified.
#  2. INTERNAL NAMES — frozen at creation. `name:` here IS the internal name; a
#     later rename changes only the display label, so a column created as
#     "Project Manager" is internally `Project_x0020_Manager` and every token in
#     the app misses. Nothing in the app will work against a mis-created name.
#  3. CHOICE VALUES — the `values:` list must match exactly, including case.
#     A Patch of an unlisted value fails; a Filter on one silently returns none.
#  4. INDEXED COLUMNS — `indexed: true`. Missing indexes don't error, they just
#     turn a delegable Filter into a 5000-item threshold failure once the list
#     grows. Cheapest to fix now, most expensive to discover later.
#
# =============================================================================
# Derived values — computed, not stored by SharePoint.
# =============================================================================
rollups:
  project_perc_completion:
    description: Weighted completion % for a project, from the stages of its child tasks.
    source_list: taskmaster_tasks
    parent_key: task_project_id
    formula: "mean(stage_weight[task_stage]) over counted tasks   # weights are already 0-100, so do NOT multiply by 100 again"
    # WEIGHTS ARE PROPOSED — confirm or edit. Percent-of-effort per stage.
    stage_weights:
      "Not Started":  0
      "Planning":     10
      "Drafting":     35
      "Finalizing":   85
      "Complete":     100
      # "Under Review" (60) and "Archived" (excluded) went with the stages themselves
      # on 2026-08-12. The survivors keep their original numbers DELIBERATELY: re-spacing
      # would move every stored project_perc_completion without a task changing, so
      # history would stop being comparable. Cost: a 35 -> 85 jump at Drafting ->
      # Finalizing. Re-space on purpose if that is wrong — App.Formulas gStageWeights is
      # the app-side copy and must move with it.
      # There is no longer any EXCLUDED stage, so every task under a project now counts
      # in both numerator and denominator.
    writer: app-side          # DECIDED 2026-08-03 — the app patches the parent
    writer_notes: >-
      The app recomputes and patches project_perc_completion whenever a task's stage
      changes (task form OnSuccess / kanban drop / grid save). Weight table is mirrored
      in src/App.pa.yaml as the named formula gStageWeights; the
      write-back snippet lives beside it. Consequence: a stage edited directly in
      SharePoint (or bulk-imported) leaves the value stale until the next in-app change
      to that project.

# =============================================================================
# MIGRATION — how the LIVE lists reach the state defined above.
#
# `columns:` above is the target. This section is what has to happen to the
# lists that went live on 2026-08-04. Nothing here is done.
#
# A Managed Metadata column CANNOT be converted in place — SharePoint does not
# support changing that type. Every column below is a delete-and-recreate.
#
# ORDER MATTERS. Do not delete an old column until its data is carried across,
# and do not point the app at a new column until it exists.
# =============================================================================
migration:
  status: >-
    PARTIALLY APPLIED 2026-08-10. Step 6 (delete the Managed Metadata columns) IS DONE —
    the user retired all of them and put CHOICE columns in their place, which clears
    `blocking_now:`. Steps 1-3 (the three mapping lists and the scrAdmin vocabulary
    screen) and steps 4-5, 7 are NOT done, and the Choice replacement may well supersede
    them rather than complete them — see `choice_replacement_UNRECORDED:` before acting
    on any step below.
  precondition: >-
    Confirm how many rows actually carry a Managed Metadata value. The lists went
    live 2026-08-04 and the app has only ever been driven in Studio, so this is
    likely zero. If it IS zero, every step below is a straight delete-and-create
    and no data has to be carried.
  steps:
    - 1. Provision mapping_regions, mapping_activitytype and mapping_producttype.
    - 2. Seed them from the existing term sets — one row per full path, level2/level3
         blank where a term stops short.
    - 3. Build the settings screen on scrAdmin so the vocabularies are maintainable
         before anything depends on them.
    - 4. Add the new columns alongside the old ones. New names are free EXCEPT
         project_coverage, client_type and client_coverage, which keep their names
         and therefore cannot be created until the old column is deleted.
    - 5. Carry any existing values across, resolving each term to its mapping row.
    - 6. Delete the Managed Metadata columns.
    - 7. Point the app at the new columns and remove the term-store code paths.
  blocking_now: >-
    **RESOLVED 2026-08-10 — the user retired every Managed Metadata column and replaced
    them with CHOICE columns.** The blocker was: saving a project returned
    `"Project_Type" is required`, from the pre-C11 Managed Metadata column still sitting
    on `taskmaster_projects` with Required = Yes, rejecting the insert before any new
    column mattered. No Managed Metadata column remains on any list, so that class of
    failure is gone. Kept as the record of a fault that took two fixes aimed at the wrong
    layer before the cause was found: **a save rejected by a column the app never writes
    is a SharePoint-side fault and cannot be fixed in Power Fx.**
  choice_replacement_RESOLVED: >-
    **RESOLVED 2026-08-11 — the app never needs the Choice VALUES, only the column NAMES,
    and those were in this file all along.** The user's answer: read them with `Choices()`
    at runtime. So `client_type` and `client_coverage` are filled by
    `ClearCollect(colX, Choices([@taskmaster_clients].client_type))` bound to a combo box —
    the pattern `scrProjectEdit` already lands for `project_coverage` — and the Managed
    Metadata retirement needs no app change and no invented token. This closes the block
    that stood since 2026-08-10.
    THE `*_path` COLUMNS ARE A DIFFERENT ANIMAL AND ARE UNCHANGED: `client_region_path`,
    `product_type_path`, `project_region_path` and `project_type_path` are Text holding a
    composed mapping-list path, still driven by `cmpNestedSelect` over the three live
    `mapping_*` lists. They are NOT Choice columns and `Choices()` does not apply to them.
    Both new create screens use exactly these two mechanisms and invent nothing.
  path_separator: >-
    The `*_path` columns store levels joined by " | " (space pipe space), e.g.
    "EMEA | UK | London". It was " > " until 2026-08-06. THE SEPARATOR IS PART OF
    THE STORED DATA: cmpNestedSelect re-seeds a picker by StartsWith() on the path
    and counts separators to work out the depth, so a row written with the old
    separator opens at level 1 with nothing selected. Any rows created before the
    change need their `*_path` values rewritten, or simply re-picked. It is passed
    explicitly as `Separator: =" | "` on each picker instance in scrProjectEdit,
    not left to the component default — a screen paste carries an instance property,
    while a component default has to be retyped by hand in Studio.
  list_names: >-
    `mapping_regions` is PLURAL; `mapping_activitytype` and `mapping_producttype` are
    SINGULAR. All three confirmed against SharePoint 2026-08-06. The inconsistency is
    real — do not "tidy" it. A data-source name that is wrong by one letter yields a
    SILENTLY EMPTY picker, never an error, because ClearCollect against a source that
    does not exist just leaves the collection empty.
  columns_are_exactly_three: >-
    A mapping list has `level1`, `level2`, `level3` and NOTHING ELSE beside the
    built-in ID and Title. An `active` flag was carried in this file from 2026-08-05
    to 2026-08-06 as a soft-delete design — it was never provisioned, and every
    cmpNestedSelect formula filtered on it. Filtering on a column the list does not
    have leaves the picker BLANK with no error. Do not reintroduce it without
    provisioning it first.
  title_column: >-
    All three mapping lists use an EXPLICIT `level1` column; the built-in Title is
    left unused and set not-required. An earlier draft of this file told two of the
    three to map level1 onto Title and the third not to, which is a contradiction —
    the app filters on `level1` in every formula, so a list without that column
    returns nothing and its picker is silently empty.
  internal_name_reuse: >-
    project_coverage, client_type and client_coverage keep their internal names
    while changing type, so the old column must be deleted before the new one is
    created. SharePoint does not always release a deleted internal name
    immediately. If creation is refused, provision with a `_c` suffix and record
    the real name here — internal names freeze at creation, so the fallback must
    be written down, not remembered.
  retired_columns:
    taskmaster_projects: [project_region, project_type, project_coverage]
    taskmaster_tasks:    [task_category]   # retired outright — nothing replaces it
    taskmaster_clients:  [client_region, client_type, client_coverage]
    taskmaster_products: [product_type]

# =============================================================================
# Open recommendations — edits proposed but NOT yet applied above.
# Reasoning for each lives in .claude/context/schema.md §Consequences.
# =============================================================================
open_recommendations:
  - id: C11
    supersedes: C10
    what: >-
      Managed Metadata is retired from the model. Three mapping lists hold the
      vocabularies; a consuming list stores the resolved row's ID plus its composed
      path text.
    decided: >-
      2026-08-05. C10 kept Managed Metadata and drove a cascading picker from the
      `Path` field on the Choices() record. That field is community-reported and
      never first-party documented, and the picker shipped showing its sentinel row
      and nothing else — an empty Terms binding. Choices() on an MM column is also
      capped at 20 terms by the connector, silently.

      The replacement keeps what was RIGHT about C10 — a path-prefix cascade is the
      correct shape — and changes whose data it is. The path is now a column this
      repo defines on a list this repo owns, so StartsWith() on it is first-party
      delegable Text rather than a bet on an undocumented field. Drill-down at any
      depth is one formula: StartsWith(<col>_path, "EMEA | UK").

      Storing the ID alone was considered and rejected: every gallery row would need
      a LookUp() to render a label, and filtering by a level would mean resolving a
      branch to a set of IDs and passing them all into an `in`. The extra Text column
      costs a back-fill when a level1 term is renamed, which the settings screen can
      do in one action.

      A cache list was ALSO rejected under C10, as "a second copy of a vocabulary
      that already exists". That reasoning held while the term store was the source.
      These lists ARE the source, so it no longer applies.
    depth_rule: >-
      2026-08-05, after the component was first built: a user may commit at ANY
      depth, so the picked path is the authoritative value and the `_id` columns
      are OPTIONAL. An id is written when the path names a row exactly, and 0 when
      it names a branch the vocabulary has no row for — which is the normal case
      when a mapping list is seeded as one row per FULL path. Nothing is lost:
      drill-down was always StartsWith() on the path, and that works at any depth
      whether or not a row exists for it.
    consequence: >-
      Join cost drops on every consuming list — projects 6 to 3, tasks 8 to 7,
      clients 4 to 1, products 1 to 0. Power Query no longer has to expand taxonomy
      records. The 20-term cap and the SPListExpandedTaxonomy write shape both
      disappear.
  - id: C10
    status: SUPERSEDED by C11 on 2026-08-05 — kept for its reasoning, not as guidance
    what: >-
      project_region and project_type are REQUIRED Managed Metadata, so nothing can create a project
      from the app without an MM write path. Decision: keep MM; build a cascading term picker that
      walks the hierarchy and writes the leaf term's GUID.
    validated: docs/managed-metadata-picker.md
    findings:
      - "READ is first-party: Graph termStore children endpoints (GA 2021-08); nesting detection falls out of the API. TermStore.Read.All, DELEGATED ONLY - app-only unsupported."
      - "Graph still cannot set an MM column VALUE on a list item - read terms via Graph, write the column via the SharePoint connector."
      - "WRITE shape (COMMUNITY-CONFIRMED, not first-party - riskiest construct in the app): '@odata.type' #Microsoft.Azure.Connectors.SharePoint.SPListExpandedTaxonomy with TermGuid, Label, Path, WssId -1."
    recommended: >-
      Cache the term store into a flat taskmaster_terms list (term_guid, term_label, term_set,
      term_parent_guid, term_path, term_depth, term_is_leaf) via a scheduled flow, and drive the
      cascade from delegable Filters on term_parent_guid. Zero runtime dependency, versus a flow
      round-trip per dropdown level.
    decided: >-
      2026-08-03 (REVISED, same day) - NO CACHE LIST. Choices([@list].mmColumn) returns the
      term set from the term store with Label, Path, Guid and WssId per term, and Path is the
      FULL hierarchical path - so the hierarchy is already in the data and the cascade reads
      it directly. A taskmaster_terms cache list was briefly added and has been REMOVED: it
      was a second copy of a vocabulary that already exists, carrying a refresh schedule and
      a drift risk, to recover a hierarchy that Path hands over for free.
      The value written is the connector's OWN record - LookUp(Choices(...), Path = <picked>)
      - which also retires the hand-built SPListExpandedTaxonomy literal that had been the
      least-proven construct in the app.
    blocked_on: >-
      Q12 - Power Automate or a custom connector, to POPULATE taskmaster_terms. The app is
      authored and pastes without it; it just has nothing to pick from until the list is
      filled (the picker shows an explicit banner in that state rather than failing silently).
      A hand-seeded list is a valid stopgap for a small vocabulary.
    status: APPLIED - cascade authored against taskmaster_terms; population still needs Q12
  - id: C9
    what: >-
      task_stage, task_status and issue_status are optional, so rows with a blank value match
      none of the enumerated Choice values and drop out of every delegable "open work" filter —
      a silent undercount. It also means green% + amber/red% need not reach 100.
    options:
      - "make each required with a default (task_stage='Not Started', task_status='Green', issue_status='Open') — recommended, fixes it at source"
      - "add `|| col.Value = Blank()` to every filter — verbose, and Blank() on a Choice subfield is an unverified delegable construct"
      - "accept the undercount and label it"
    status: APPLIED  # 2026-08-03 — all three now required with defaults; no blank-value gap remains
  - id: C1
    what: "project_other_resources / task_other_resources are multi-person → no delegable filter exists"
    options: ["display-only (drive 'mine' off task_lead/project_manager)", "fixed single-Person slots", "write-time text mirror (exact = only)"]
    status: APPLIED  # 2026-08-03 — single-Person task_supporter / project_supporter; "mine" is now fully delegable
  - id: C3
    what: "project_perc_completion has no writer"
    options: ["Power Automate rollup on task change (needs Q12)", "manual entry", "drop the column"]
    status: APPLIED  # 2026-08-03 — weighted stage rollup, written APP-SIDE; weights in rollups: + App.Formulas gStageWeights
  - id: C4
    what: "task_date_start is Calculated — cannot be indexed, nothing delegates"
    options: ["convert to DateTime written at creation (recommended)", "keep Calculated and never filter/sort on it"]
    status: APPLIED  # task_date_start is now DateTime, indexed (2026-08-03)
  - id: C5
    what: "no USD-normalised notional → cross-currency totals are not meaningful"
    options: ["add transaction_notional_usd, normalised at write", "aggregate per-currency only", "convert in Power BI with an FX table (CHOSEN)"]
    status: SUPERSEDED  # 2026-08-03 (Q14) — write-time normalisation REVERSED
    superseded_by: >-
      Convert in the REPORT layer. The app stores only transaction_notional +
      transaction_currency; Power BI joins an FX dimension on currency + date. A
      write-time rate freezes whatever number the app held on the trade date and
      nothing downstream can correct it, whereas report-time conversion can be
      restated, back-dated and audited.
    app_consequence: >-
      NO cross-currency figure can be shown anywhere in the app. scrProject's
      transactions tab now totals PER CURRENCY and says so; the FxToUsd table has
      been removed from App.Formulas. Do not reintroduce a rate table to "just add
      a total".
    reporting_obligation: >-
      Power BI now OWES this figure. It needs an FX dimension (currency, rate,
      effective date) and a measure converting transaction_notional at the trade
      date. Until that exists there is no blended notional anywhere - which is the
      accepted cost, not an oversight.
  - id: C6
    what: "region was modelled three ways; approval_region RETIRED 2026-08-09 with the asset_approval list. Now TWO ways — project_region and client_region, both granular. They serve different purposes and are never used in the same setting, so still no conformed dimension is needed."
    options: ["leave as-is (chosen)"]
    status: BY DESIGN  # project_region/client_region serve different purposes and are never used together — not a defect, do not "fix"
  - id: C8
    what: "casing anomalies Issue_owner and product_UID; no enforced uniqueness anywhere"
    options: ["rename to issue_owner / product_uid before creation (recommended)", "keep as-is and match exactly in every formula"]
    status: APPLIED  # renamed to issue_owner / product_uid (2026-08-03); uniqueness still by convention only
