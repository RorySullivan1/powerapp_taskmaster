# =============================================================================
# GOLDEN SOURCE — the authoritative definition of the SharePoint backend.
#
# THIS FILE DEFINES THE LISTS. SharePoint is the downstream apply-target.
# Edit here first; then apply to SharePoint and set the list's `provisioned:`
# state. This mirrors the one-way air gap for app source: the repo is
# authoritative, and nothing is read back (see .claude/context/air-gap.md).
#
# Column-by-column truth lives HERE. The model's shape, delegation costs and
# design consequences live in .claude/context/schema.md — that brief points at
# this file rather than repeating it, so the two cannot drift.
#
# INTERNAL NAMES ARE FROZEN AT CREATION. The `name:` key of each column is the
# internal name and must be created exactly as written (a later rename changes
# only the display label). Create the column with this name, then set a friendly
# display name if desired.
# =============================================================================

meta:
  version: 3.0.0
  updated: 2026-08-05
  authority: repo            # repo defines; SharePoint applies
  naming: snake_case
  source: user-supplied schema screenshots (see incoming-lists.md), then edited here

# Type vocabulary used below, and what each costs.
# join_cost 1 = counts against SharePoint's 12-joins-per-view cap.
types:
  Text:            { sp: "Single line of text",  delegates: ["=", "StartsWith", "Sort"], indexable: true,  join_cost: 0 }
  Note:            { sp: "Multiple lines of text", delegates: [],                        indexable: false, join_cost: 0 }
  Choice:          { sp: "Choice",               delegates: ["= via .Value", "Sort"],    indexable: true,  join_cost: 0 }
  Number:          { sp: "Number",               delegates: ["=", "<", ">", "Sort"],     indexable: true,  join_cost: 0 }
  Currency:        { sp: "Currency",             delegates: ["=", "<", ">", "Sort"],     indexable: true,  join_cost: 0 }
  DateTime:        { sp: "Date and Time",        delegates: ["=", "<", ">", "Sort"],     indexable: true,  join_cost: 0 }
  Boolean:         { sp: "Yes/No",               delegates: ["=", "Sort"],               indexable: true,  join_cost: 0 }
  # ARITY IS PART OF THE CONTRACT — every Person column below carries `multi:`.
  # Get it wrong in SharePoint and the app breaks in two places at once: a MULTI
  # column returns a TABLE, so `Coalesce(col.DisplayName, "")` errors ("expecting
  # a Table" — the "" no longer matches the first argument's type), and the write
  # fails too because a single expanded-user record is not a table. Seen live on
  # project_requestor, 2026-08-04: it had been provisioned multi.
  Person:          { sp: "Person or Group — ALLOW MULTIPLE = NO", delegates: ["= on .Email/.DisplayName"], indexable: true, join_cost: 1 }
  PersonMulti:     { sp: "Person or Group — allow multiple = yes",  delegates: [],     indexable: false, join_cost: 1 }
  Lookup:          { sp: "Lookup",               delegates: ["= via .Id/.Value"],        indexable: true,  join_cost: 1 }
  # RETIRED 2026-08-05 (C11). No column uses this type. Kept so older notes
  # and docs/build-history.md still resolve against this file.
  ManagedMetadata: { sp: "Managed Metadata — RETIRED, see migration: and C11", delegates: ["= via subfield"], indexable: true, join_cost: 1 }
  Hyperlink:       { sp: "Hyperlink or Picture", delegates: [],                          indexable: false, join_cost: 0 }
  Calculated:      { sp: "Calculated",           delegates: [],                          indexable: false, join_cost: 0 }

# ARCHIVED WORK IS EXCLUDED AT THE SOURCE, NOT IN THE APP (decided 2026-08-12).
# `project_phase = "Archived"` hides a project; `*_project_archived = false` on each
# child list is what keeps its tasks, transactions and issues out of every
# cross-project query. Both predicates delegate, so the rows never reach the app and
# every list stays comfortably under the 2000-row data limit as archived work
# accumulates. The earlier design — collect the archived projects and RemoveIf the
# children locally — is GONE: it pulled the rows first and then dropped them, so the
# limit still bit, and past it archived work silently reappeared.

# Present on every list, managed by SharePoint. NEVER patch these from the app.
#
# DO NOT REFERENCE THESE FROM POWER FX. Confirmed in Studio 2026-08-12: the canvas
# SharePoint connector does NOT surface `Created By` on taskmaster_issues, so
# `rec.'Created By'` does not resolve — the column the app can see is not the same
# set as the column the list has. They are listed here because they EXIST on the
# list (a SharePoint view or a Power BI query can project them), not because the app
# can read them. Provenance the APP has to show must be an app-written column.
# NOT INDEXED BY DEFAULT either, so a >5,000-item list cannot sort or filter on
# `Created` without an index like any other column.
system_columns: [Created, Modified, Created By, Modified By]

# =============================================================================
lists:


  # ---------------------------------------------------------------------------
  # CLASSIFICATION MAPPING TABLES — three lists, IDENTICAL shape.
  #
  # One row IS one full path. `level2`/`level3` are blank when a term stops
  # short, so a term at any depth is a single row and a single ID — which is why
  # a consuming list needs ONE reference column, not one per level.
  #
  # The identical column names are deliberate: one settings screen on scrAdmin
  # drives all three, parameterised by which list it points at.
  #
  # NOT stored here: the composed path ("EMEA | UK | London"). The app builds it
  # from level1..3 on write, so the levels stay the single source and a stored
  # copy cannot drift from them.
  #
  # ORDERING IS ALPHABETICAL, not a stored column. Every picker sorts on the level
  # it is showing — Sort() on a Text column delegates, so this holds however long a
  # vocabulary grows, and there is no per-row number for anyone to maintain or get
  # wrong. A term that needs to lead its siblings has to be named so.
  # ---------------------------------------------------------------------------
  mapping_regions:
    role: >-
      Region vocabulary, up to 3 levels. Consumed by taskmaster_projects and
      taskmaster_clients. Maintained IN THE APP via the scrAdmin settings screen.
    provisioned: live        # 2026-08-06 — name CONFIRMED PLURAL by the user
    join_cost: 0
    columns:
      - { name: level1,     type: Text,    required: true,  indexed: true,  desc: "Top level, e.g. EMEA. An EXPLICIT column — Title is left unused and not required" }
      - { name: level2,     type: Text,    required: false, indexed: true,  desc: "Second level, blank if the term stops at level1" }
      - { name: level3,     type: Text,    required: false, indexed: true,  desc: "Third level, blank if the term stops at level2" }

  mapping_activitytype:
    role: >-
      Activity/project-type vocabulary, up to 3 levels. Consumed by
      taskmaster_projects, which stores a resolved row exactly as it does for
      region. Tasks carry NO classification of their own — see the note on
      taskmaster_tasks.
    provisioned: live        # 2026-08-06 — name CONFIRMED SINGULAR by the user.
                             # Only mapping_regions carries the plural `s`.
    join_cost: 0
    columns:
      - { name: level1,     type: Text,    required: true,  indexed: true,  desc: "Activity family, e.g. Campaign. This is the value a project stores" }
      - { name: level2,     type: Text,    required: false, indexed: true,  desc: "Second level, blank if the term stops at level1" }
      - { name: level3,     type: Text,    required: false, indexed: true,  desc: "Third level, blank if the term stops at level2" }

  mapping_producttype:
    role: >-
      Product-type vocabulary, up to 3 levels. Consumed by taskmaster_products.
    provisioned: live        # 2026-08-06 — name CONFIRMED SINGULAR by the user.
    join_cost: 0
    columns:
      - { name: level1,     type: Text,    required: true,  indexed: true,  desc: "Top level. An EXPLICIT column — Title is left unused and not required" }
      - { name: level2,     type: Text,    required: false, indexed: true,  desc: "Second level, blank if the term stops at level1" }
      - { name: level3,     type: Text,    required: false, indexed: true,  desc: "Third level, blank if the term stops at level2" }

  # ---------------------------------------------------------------------------
  taskmaster_projects:
    role: The parent. Tasks, transactions and issues all hang off it.
    provisioned: live        # 2026-08-04
    join_cost: 3          # was 6 — the 3 Managed Metadata columns became zero-join Number/Text
    columns:
      - { name: project_name,            type: Text,            required: true,  indexed: true,  desc: "User-facing project title (unique by convention only)" }
      - { name: project_manager,         type: Person, multi: false, required: true,  indexed: true,  desc: "Accountable owner" }
      - { name: project_coverage,        type: Choice,          required: false,                 desc: "Business/product coverage area", values: [PLACEHOLDER_A, PLACEHOLDER_B], review: "VALUES NOT SUPPLIED — replace before provisioning. The app binds Choices() rather than a literal, so the real values need no app change" }
      - { name: project_description,     type: Note,            required: false,                 desc: "Detailed description (display only)" }
      - { name: project_region_id,       type: Number,          required: false, indexed: true,  desc: "ID of the mapping_regions row when the picked path names one exactly; 0 when it names a BRANCH the vocabulary has no row for. The path column is the authoritative value — see C11", maps_to: mapping_regions }
      - { name: project_region_path,     type: Text,            required: true,  indexed: true,  desc: "Composed path of that row, e.g. \"EMEA | UK | London\". Denormalised so display needs no lookup and drill-down is StartsWith(), which delegates on Text" }
      - { name: project_pathway,         type: Text,            required: false,                 desc: "SharedDrive folder location (relative or full path)" }
      - { name: project_type_id,         type: Number,          required: false, indexed: true,  desc: "ID of the mapping_activitytype row when the picked path names one exactly; 0 when it names a branch", maps_to: mapping_activitytype }
      - { name: project_type_path,       type: Text,            required: true,  indexed: true,  desc: "Composed path of that row, e.g. \"Campaign | Email | Newsletter\". Same id+path pair as project_region" }
      - { name: project_requestor,       type: Person, multi: false, required: false,                 desc: "Requesting user" }
      - { name: project_phase,           type: Choice,          required: true,  indexed: true,  desc: "Lifecycle phase", values: [Planning, Active, Blocked, Complete, Archived] }
      - { name: project_priority,        type: Choice,          required: true,                  desc: "Priority level", values: [Lowest, Low, Moderate, High, Critical] }
      - { name: project_perc_completion, type: Number,          required: false,                 desc: "Completion %, 0-100 — WEIGHTED rollup of child task stages; see `rollups:` below" }
      - { name: project_date_start,      type: DateTime,        required: false,                 desc: "Actual start date (default = Created)" }
      - { name: project_date_target,     type: DateTime,        required: false, indexed: true,  desc: "Desired completion date" }
      - { name: project_date_complete,   type: DateTime,        required: false,                 desc: "Actual completion date" }
      - { name: project_supporter,       type: Person, multi: false, required: false, indexed: true,  desc: "Supporting contributor (one extra person beside project_manager)" }

  # ---------------------------------------------------------------------------
  taskmaster_tasks:
    role: >-
      Units of work. The busiest list in the app.
      DELIBERATELY UNCLASSIFIED (2026-08-05): a task has no activity-type column.
      Its activity family is already reachable through task_project_id, so storing
      it again on the task would be a second copy that can disagree with the first,
      and task_output_format already answers "what kind of thing is this producing".
      Add one only if tasks within a single project are found to differ in a way
      neither the parent nor the output format captures — mapping_activitytype stays
      in place, so that is a column, not a redesign.
    provisioned: live        # 2026-08-04
    join_cost: 7          # 5 Lookup + 2 Person (9 if a view also projects Created By/Modified By; SharePoint BLOCKS above 8 joins, so keep heavy views under 8). Was 8 — task_category's Managed Metadata became zero-join Number/Text
    columns:
      - { name: task_name,             type: Text,            required: true,  indexed: true,  desc: "Task title" }
      # LIVE DIVERGENCE, confirmed in Studio 2026-08-09: the column's display field in
      # SharePoint is the target's ID, NOT project_name, so `.Value` returns a NUMBER.
      # `show:` below records the INTENT. The three edit screens therefore resolve the
      # name app-side with LookUp(taskmaster_projects, ID = <fk>.Id, project_name) —
      # that is deliberate, not a redundant query, and two code reviewers flagged it as
      # waste on 2026-08-11 by trusting this line. Changing the display column in place
      # UNASSOCIATES existing items, which is why it was fixed in the app instead.
      - { name: task_project_id,       type: Lookup,          required: true,  indexed: true,  desc: "Parent project", lookup: { list: taskmaster_projects, show: project_name } }
      - { name: task_description,      type: Note,            required: false,                 desc: "Instructions / details (display only)" }
      - { name: task_status,           type: Choice,          required: true,  indexed: true,  default: Green,         desc: "HEALTH — how it is going", values: [Green, Amber, Red] }
      # CHANGED 2026-08-12 — "Under Review" and "Archived" REMOVED. Review is signalled
      # by raising an ISSUE against the task, and archiving is a PROJECT state
      # (project_phase), not something a task carries. Removing "Archived" deletes the
      # task-level archiving axis entirely, which is why the six-value Or-chain that
      # excluded it is gone from App.Formulas and five screens.
      # APPLIED IN SHAREPOINT 2026-08-12 (user). No re-map was needed — the lists held
      # only example items. The general hazard still stands for any FUTURE value
      # removal: a row keeps whatever string SharePoint stored, and a row holding a
      # value no longer in the list matches NO filter, so it vanishes from the app with
      # nothing to see. Re-map before removing a value, not after.
      - { name: task_stage,            type: Choice,          required: true,  indexed: true,  default: "Not Started", desc: "LIFECYCLE — where it is", values: ["Not Started", Planning, Drafting, Finalizing, Complete] }
      # ---------------------------------------------------------------------
      # DENORMALISED PARENT STATE — added 2026-08-12. Mirrors project_phase =
      # "Archived" on the PARENT. It exists for exactly one reason: a child row
      # carries only `*_project_id`, never the parent's phase, so "belongs to a live
      # project" cannot be a server-side predicate without a join — and joins do
      # not delegate to SharePoint. Without this column the exclusion has to
      # happen locally, after the rows are already in the app, which defeats the
      # point: THE AIM IS TO KEEP THE ROWS IN SCOPE SAFELY UNDER 2000 so no query
      # can silently truncate.
      # Boolean because that is what the predicate needs; indexed because an
      # unindexed filter fails outright past 5000 items. NOT a copy of the phase
      # itself — that would be a second source of truth for something the project
      # row already owns.
      # PROVISIONED IN SHAREPOINT 2026-08-12 (user) — Yes/No, indexed.
      # MAINTAINED BY: scrProjectEdit's save, which is the ONLY place the app
      # writes project_phase. Children created by the app always write false,
      # which is always correct because the app does not let you add children to
      # an archived project.
      - { name: task_project_archived, type: Boolean, required: false, indexed: true, default: false, desc: "TRUE when the PARENT project is archived. Denormalised so the exclusion delegates; see the note above" }
      - { name: task_priority,         type: Choice,          required: true,                  desc: "Priority", values: [Low, Moderate, High, Critical] }
      - { name: task_lead,             type: Person, multi: false, required: true,  indexed: true,  desc: "Primary owner" }
      - { name: task_supporter,        type: Person, multi: false, required: false, indexed: true,  desc: "Supporting contributor (one extra person beside task_lead)" }
      - { name: task_date_start,       type: DateTime,        required: false, indexed: true,  desc: "Actual start date, written at creation (default = Created)" }
      - { name: task_date_target,      type: DateTime,        required: false, indexed: true,  desc: "Due date" }
      - { name: task_date_completion,  type: DateTime,        required: false,                 desc: "Date completed" }
      - { name: task_output_approval_id, type: Text,          required: false,                 desc: "ID of the approval task in the EXTERNAL approval portal (out of scope). Free-text pointer only — NOT a lookup, not validated, not indexed. Replaced the task_output_approval lookup on 2026-08-09 when asset_approval was retired." }
      - { name: task_output_language,  type: Choice,          required: false,                 desc: "Output language", values: [EN, FR, DE, ES, IT, JP] }
      - { name: task_output_format,    type: Choice,          required: false,                 desc: "Content format", values: [Flyer, Email, PDF, Webpage, Deck, Video] }
      - { name: task_output_branding,  type: Choice,          required: false,                 desc: "Branding requirement", values: [Barclays, QIS, EXO, Custom] }
      - { name: task_output_asset,     type: Lookup,          required: false,                 desc: "Linked asset", lookup: { list: asset_library, show: asset_name } }
      - { name: task_client_name,      type: Lookup,          required: false,                 desc: "Associated client", lookup: { list: taskmaster_clients, show: client_name } }
      - { name: task_product_id,       type: Lookup,          required: false,                 desc: "Associated product", lookup: { list: taskmaster_products, show: product_uid } }
      - { name: task_client_stage,     type: Choice,          required: false,                 desc: "Client lifecycle stage", values: [Prospect, Active, Existing, "Post-Trade"] }

  # ---------------------------------------------------------------------------
  taskmaster_transactions:
    role: Trades, at full transaction level.
    provisioned: live        # 2026-08-04
    join_cost: 4
    columns:
      - { name: transaction_name,       type: Text,     required: true,  indexed: true,  desc: "Transaction label" }
      # LIVE DIVERGENCE, confirmed in Studio 2026-08-09: the column's display field in
      # SharePoint is the target's ID, NOT project_name, so `.Value` returns a NUMBER.
      # `show:` below records the INTENT. The three edit screens therefore resolve the
      # name app-side with LookUp(taskmaster_projects, ID = <fk>.Id, project_name) —
      # that is deliberate, not a redundant query, and two code reviewers flagged it as
      # waste on 2026-08-11 by trusting this line. Changing the display column in place
      # UNASSOCIATES existing items, which is why it was fixed in the app instead.
      - { name: transaction_project_id, type: Lookup,   required: true,  indexed: true,  desc: "Parent project", lookup: { list: taskmaster_projects, show: project_name } }
      - { name: transaction_client_name, type: Lookup,  required: true,  indexed: true,  desc: "Associated client", lookup: { list: taskmaster_clients, show: client_name } }
      - { name: transaction_product_id, type: Lookup,   required: true,                  desc: "Associated product", lookup: { list: taskmaster_products, show: product_uid } }
      - { name: transaction_sales,      type: Person, multi: false, required: true,                  desc: "Sales owner" }
      - { name: transaction_notional,   type: Currency, required: false,                 desc: "Trade notional amount (positive)" }
      # ---------------------------------------------------------------------
      # DENORMALISED PARENT STATE — added 2026-08-12. Mirrors project_phase =
      # "Archived" on the PARENT. It exists for exactly one reason: a child row
      # carries only `*_project_id`, never the parent's phase, so "belongs to a live
      # project" cannot be a server-side predicate without a join — and joins do
      # not delegate to SharePoint. Without this column the exclusion has to
      # happen locally, after the rows are already in the app, which defeats the
      # point: THE AIM IS TO KEEP THE ROWS IN SCOPE SAFELY UNDER 2000 so no query
      # can silently truncate.
      # Boolean because that is what the predicate needs; indexed because an
      # unindexed filter fails outright past 5000 items. NOT a copy of the phase
      # itself — that would be a second source of truth for something the project
      # row already owns.
      # PROVISIONED IN SHAREPOINT 2026-08-12 (user) — Yes/No, indexed.
      # MAINTAINED BY: scrProjectEdit's save, which is the ONLY place the app
      # writes project_phase. Children created by the app always write false,
      # which is always correct because the app does not let you add children to
      # an archived project.
      - { name: transaction_project_archived, type: Boolean, required: false, indexed: true, default: false, desc: "TRUE when the PARENT project is archived. Denormalised so the exclusion delegates; see the note above" }
      - { name: transaction_currency,   type: Choice,   required: true,                  desc: "Currency denomination", values: [USD, EUR, GBP, JPY, CHF] }
      # SUPERSEDED 2026-08-03 (Q14) — DO NOT PROVISION. Kept here so the decision is
      # discoverable rather than silently missing. Currency conversion moved to the
      # REPORT layer: Power BI joins an FX dimension to transaction_currency +
      # transaction_date. Nothing in the app writes this column, so provisioning it
      # would leave a permanently blank Currency field that looks like a real figure.
      # If you ever reinstate it, reinstate a WRITER at the same time.
      # - { name: transaction_notional_usd, type: Currency, required: false, indexed: true, desc: "Notional normalised to USD at WRITE time" }
      - { name: transaction_date,       type: DateTime, required: true,  indexed: true,  desc: "Actual trade date" }

  # ---------------------------------------------------------------------------
  taskmaster_issues:
    role: Freeform issues raised against a project, optionally a task or transaction.
    provisioned: live        # 2026-08-04
    # 5. Two Person columns (issue_assignee, issue_owner) + 3 Lookups. Nowhere near
    # SharePoint's block at 8, so a view can still project a system column or two.
    join_cost: 5
    columns:
      - { name: issue_name,             type: Text,     required: true,  indexed: true,  desc: "Issue summary / title" }
      - { name: issue_description,      type: Note,     required: false,                 desc: "Detailed description (display only)" }
      # LIVE DIVERGENCE, confirmed in Studio 2026-08-09: the column's display field in
      # SharePoint is the target's ID, NOT project_name, so `.Value` returns a NUMBER.
      # `show:` below records the INTENT. The three edit screens therefore resolve the
      # name app-side with LookUp(taskmaster_projects, ID = <fk>.Id, project_name) —
      # that is deliberate, not a redundant query, and two code reviewers flagged it as
      # waste on 2026-08-11 by trusting this line. Changing the display column in place
      # UNASSOCIATES existing items, which is why it was fixed in the app instead.
      - { name: issue_project_id,       type: Lookup,   required: true,  indexed: true,  desc: "Parent project", lookup: { list: taskmaster_projects, show: project_name } }
      - { name: issue_task_name,        type: Lookup,   required: false,                 desc: "Related task", lookup: { list: taskmaster_tasks, show: task_name } }
      - { name: issue_transaction_name, type: Lookup,   required: false,                 desc: "Related transaction", lookup: { list: taskmaster_transactions, show: transaction_name } }
      - { name: issue_assignee,         type: Person, multi: false, required: true,  indexed: true,  desc: "Responsible resolver" }
      # CHANGED 2026-08-12 — was [Open, Review, Waiting, Blocked, Closed]. The three
      # intermediate states collapse into Open, and Closed splits into an OUTCOME. The
      # app's "open issues" test is now a single equality (= "Open") rather than a
      # four-way Or, which delegates more cheaply.
      # APPLIED IN SHAREPOINT 2026-08-12 (user); example data only, so no re-map.
      - { name: issue_status,           type: Choice,   required: true,  indexed: true,  default: Open,          desc: "Current status; the three Closed values record the OUTCOME", values: [Open, "Closed - Resolved", "Closed - Unresolved", "Closed - No Change"] }
      # ---------------------------------------------------------------------
      # DENORMALISED PARENT STATE — added 2026-08-12. Mirrors project_phase =
      # "Archived" on the PARENT. It exists for exactly one reason: a child row
      # carries only `*_project_id`, never the parent's phase, so "belongs to a live
      # project" cannot be a server-side predicate without a join — and joins do
      # not delegate to SharePoint. Without this column the exclusion has to
      # happen locally, after the rows are already in the app, which defeats the
      # point: THE AIM IS TO KEEP THE ROWS IN SCOPE SAFELY UNDER 2000 so no query
      # can silently truncate.
      # Boolean because that is what the predicate needs; indexed because an
      # unindexed filter fails outright past 5000 items. NOT a copy of the phase
      # itself — that would be a second source of truth for something the project
      # row already owns.
      # PROVISIONED IN SHAREPOINT 2026-08-12 (user) — Yes/No, indexed.
      # MAINTAINED BY: scrProjectEdit's save, which is the ONLY place the app
      # writes project_phase. Children created by the app always write false,
      # which is always correct because the app does not let you add children to
      # an archived project.
      - { name: issue_project_archived, type: Boolean, required: false, indexed: true, default: false, desc: "TRUE when the PARENT project is archived. Denormalised so the exclusion delegates; see the note above" }
      - { name: issue_type,             type: Choice,   required: false,                 desc: "Type of issue", values: [Approval, Process, Compliance, Branding, Technical] }
      - { name: issue_impact,           type: Choice,   required: false,                 desc: "Severity / impact", values: [Low, Moderate, High, Critical] }
      # PROVENANCE — who raised this issue, and when. Both are APP-WRITTEN, stamped
      # in a second Patch that runs on INSERT ONLY; the update path never names them,
      # so an edit leaves them alone. There is no picker and no form field for either:
      # not-user-manipulable is achieved by not offering the control, not by relying on
      # SharePoint's read-only-ness.
      # ON THIS LIST, `issue_owner` IS THE CREATED-BY. Do not reach for the system
      # column instead: the canvas connector does not surface `Created By` here, so
      # the reference does not resolve in Studio (confirmed 2026-08-12). Same for
      # `issue_date_open` and `Created`. See `system_columns` at the top of this file.
      - { name: issue_date_open,        type: DateTime, required: false,                 desc: "When the issue was raised; stamped with Now() on insert only" }
      - { name: issue_date_target,      type: DateTime, required: false, indexed: true,  desc: "Expected resolution date" }
      - { name: issue_date_close,       type: DateTime, required: false,                 desc: "Resolution date" }
      - { name: issue_owner,            type: Person, multi: false, required: false,     desc: "Who raised the issue; stamped with User() on insert only. Display only — no picker" }

  # ---------------------------------------------------------------------------
  taskmaster_clients:
    role: Client dimension.
    provisioned: live        # 2026-08-04
    join_cost: 1          # was 4 — 3 Managed Metadata columns became zero-join
    columns:
      - { name: client_name,     type: Text,            required: true,  indexed: true, desc: "Client display name" }
      - { name: client_type,     type: Choice,          required: true,                 desc: "Client classification", values: [PLACEHOLDER_A, PLACEHOLDER_B], review: "VALUES NOT SUPPLIED — replace before provisioning" }
      - { name: client_coverage, type: Choice,          required: true,                 desc: "Coverage group", values: [PLACEHOLDER_A, PLACEHOLDER_B], review: "VALUES NOT SUPPLIED — replace before provisioning" }
      - { name: client_sales,    type: Person, multi: false, required: true,                 desc: "Primary sales owner" }
