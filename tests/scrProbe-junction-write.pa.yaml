# =============================================================================
# scrProbe-junction-write — why does Collect(taskmaster_taskproducts, …) not land?
#
# scrTaskEdit saves the task, then writes its product links, and no link ever
# appears in taskmaster_taskproducts (issue #14, still true after PRs #139–#142).
# btnTkSave compiles, so this is a RUNTIME failure. This probe runs the write on
# its own and SHOWS SharePoint's message, then counts what actually landed.
#
# Sub-cases, each with its OWN message line:
#   1 CHECK IDS — reads the task and the product by ID. Proves the two IDs typed
#                 are real and the connection reads. If this fails, nothing below
#                 means anything.
#   2 APP WRITE — the exact record btnTkSave writes: two lookups, project ID and
#                 archived = false.
#   3 MINIMAL   — only the two required lookups. If 3 lands and 2 does not, the
#                 fault is project ID or the archived flag, not the lookups.
#   4 COUNT     — links for the task, counted on the RAW list and through
#                 LiveTaskProducts. Raw > Live means rows land but the app cannot
#                 see them (archived flag blank, not No).
#   5 CLEAN UP  — removes every link for the task.
# The app's own task save is the write control: it proves writes reach the site.
#
# BREAKS RULE 1 ON PURPOSE: the data source IS the claim. Every other rule is kept.
# Reads nothing off a link row's ID — Studio does not resolve it on this list.
#
# BEFORE PASTING: taskmaster_taskproducts, taskmaster_tasks and taskmaster_products
# must be in the Data pane, and LiveTaskProducts in App.Formulas.
# =============================================================================
Screens:
  scrProbeJunction:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
    Children:
      - lblPjTitle:
          Control: Label@2.5.1
          Properties:
            # Block scalar: YAML eats " #" in a plain scalar along with the rest of the line.
            Text: |
              ="Product link write probe  ·  issue #14"
            Font: =Font.'Segoe UI'
            Size: =20
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(32, 38, 45, 1)
            X: =16
            Y: =16
            Width: =820
            Height: =28
      - lblPjHow:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="Type the ID of a throwaway task and of any product, then press the buttons IN ORDER.
              Each writes its own line below. Run in Preview (F5). Press 5 when you are done."
            Font: =Font.'Segoe UI'
            Size: =13
            Color: =RGBA(110, 120, 130, 1)
            X: =16
            Y: =52
            Width: =820
            Height: =44
      - txtPjTask:
          Control: ModernTextInput@1.1.1
          Properties:
            Placeholder: ="task ID"
            TriggerOutput: =TriggerOutput.Delayed
            Font: =Font.'Segoe UI'
            Size: =14
            X: =16
            Y: =108
            Width: =150
            Height: =40
      - txtPjProduct:
          Control: ModernTextInput@1.1.1
          Properties:
            Placeholder: ="product ID"
            TriggerOutput: =TriggerOutput.Delayed
            Font: =Font.'Segoe UI'
            Size: =14
            X: =180
            Y: =108
            Width: =150
            Height: =40
      - btnPjCheck:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="1 · CHECK IDS"
            Fill: =RGBA(110, 120, 130, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderThickness: =0
            Font: =Font.'Segoe UI'
            Size: =14
            X: =16
            Y: =168
            Width: =156
            Height: =44
            OnSelect: |
              =IfError(
                  Set( vPjTask, LookUp( taskmaster_tasks, ID = Value(txtPjTask.Text) ) );
                  Set( vPjProd, LookUp( taskmaster_products, ID = Value(txtPjProduct.Text) ) );
                  Set( vPjMsg1,
                       "CHECK: task = " & Coalesce(vPjTask.task_name, "(NOT FOUND)")
                       & "  |  project " & Coalesce(Text(vPjTask.task_project_id.Id), "?")
                       & "  |  product = " & Coalesce(vPjProd.product_uid, "(NOT FOUND)") ),
                  Set( vPjMsg1, "CHECK FAILED: " & FirstError.Message ) )
      - btnPjApp:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="2 · APP WRITE"
            Fill: =RGBA(0, 90, 158, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderThickness: =0
            Font: =Font.'Segoe UI'
            Size: =14
            X: =184
            Y: =168
            Width: =156
            Height: =44
            OnSelect: |
              =IfError(
                  Set( vPjW2,
                  Collect( taskmaster_taskproducts,
                           { taskproduct_task_id:    { Id: Value(txtPjTask.Text),    Value: Coalesce(vPjTask.task_name, "probe") },
                             taskproduct_product_id: { Id: Value(txtPjProduct.Text), Value: Coalesce(vPjProd.product_uid, "probe") },
                             taskproduct_project_id: Coalesce(vPjTask.task_project_id.Id, 0),
                             taskproduct_project_archived: false } ) );
                  Set( vPjMsg2, "APP WRITE returned no error. Press 4 to see whether it landed." ),
                  Set( vPjMsg2, "APP WRITE FAILED: " & FirstError.Message ) )
      - btnPjMin:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="3 · MINIMAL"
            Fill: =RGBA(0, 90, 158, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderThickness: =0
            Font: =Font.'Segoe UI'
            Size: =14
            X: =352
            Y: =168
            Width: =156
            Height: =44
            OnSelect: |
              =IfError(
                  Set( vPjW3,
                  Collect( taskmaster_taskproducts,
                           { taskproduct_task_id:    { Id: Value(txtPjTask.Text),    Value: Coalesce(vPjTask.task_name, "probe") },
                             taskproduct_product_id: { Id: Value(txtPjProduct.Text), Value: Coalesce(vPjProd.product_uid, "probe") } } ) );
                  Set( vPjMsg3, "MINIMAL returned no error. Press 4 to see whether it landed." ),
                  Set( vPjMsg3, "MINIMAL FAILED: " & FirstError.Message ) )
      - btnPjCount:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="4 · COUNT"
            Fill: =RGBA(49, 130, 93, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderThickness: =0
            Font: =Font.'Segoe UI'
            Size: =14
            X: =520
            Y: =168
            Width: =156
            Height: =44
            OnSelect: |
              =IfError(
                  Set( vPjMsg4,
                       "COUNT for task " & txtPjTask.Text
                       & ":  raw list " & CountRows( Filter( taskmaster_taskproducts,
                                                             taskproduct_task_id.Id = Value(txtPjTask.Text) ) )
                       & "  |  through LiveTaskProducts " & CountRows( Filter( LiveTaskProducts,
                                                             taskproduct_task_id.Id = Value(txtPjTask.Text) ) ) ),
                  Set( vPjMsg4, "COUNT FAILED: " & FirstError.Message ) )
      - btnPjClean:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="5 · CLEAN UP"
            Fill: =RGBA(110, 120, 130, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderThickness: =0
            Font: =Font.'Segoe UI'
            Size: =14
            X: =688
            Y: =168
            Width: =148
            Height: =44
            OnSelect: |
              =IfError(
                  If( Len(txtPjTask.Text) > 0,
                      RemoveIf( taskmaster_taskproducts, taskproduct_task_id.Id = Value(txtPjTask.Text) ) );
                  Set( vPjMsg5, "CLEAN UP ok: links for task " & txtPjTask.Text & " removed" ),
                  Set( vPjMsg5, "CLEAN UP FAILED: " & FirstError.Message & "  -  delete the rows in SharePoint" ) )
      - lblPjResult:
          Control: Label@2.5.1
          Properties:
            Text: |
              =Coalesce(vPjMsg1, "1 -") & Char(10) & Char(10)
              & Coalesce(vPjMsg2, "2 -") & Char(10) & Char(10)
              & Coalesce(vPjMsg3, "3 -") & Char(10) & Char(10)
              & Coalesce(vPjMsg4, "4 -") & Char(10) & Char(10)
              & Coalesce(vPjMsg5, "5 -")
            Font: =Font.'Segoe UI'
            Size: =14
            Color: =RGBA(32, 38, 45, 1)
            Fill: =RGBA(255, 255, 255, 1)
            VerticalAlign: =VerticalAlign.Top
            X: =16
            Y: =232
            Width: =820
            Height: =300
