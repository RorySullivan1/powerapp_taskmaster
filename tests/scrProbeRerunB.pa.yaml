# =============================================================================
# scrProbeRerunB — SCREEN 2 of 2.  Issue #15.
#
# CREATE BOTH BLANK SCREENS BEFORE PASTING EITHER ONE. Each screen navigates to
# the other BY NAME, so the dependency is circular and no paste order fixes it.
# Once both exist, paste order does not matter.
#
# This screen IS the positive control. Going here and coming back is a real
# screen change, so it MUST raise "OnVisible fired" on scrProbeRerun. If it
# does not, the probe cannot see OnVisible at all and no other result on it
# means anything — stop there and say so.
#
# ---------------------------------------------------------------------------
# SET BY HAND IN THE FORMULA BAR — screens are not controls:
#
#   Screen name   scrProbeRerunB         (exactly this)
#   Fill          RGBA(235, 242, 238, 1)
#
# No OnVisible on this screen. THEN paste everything under `Children:` below.
# ---------------------------------------------------------------------------
# =============================================================================
Screens:
  scrProbeRerunB:
    Properties:
      Fill: =RGBA(235, 242, 238, 1)
    Children:
      - lblRrBText:
          Control: Label@2.5.1
          Properties:
            Text: ="Positive control. Go back — ""OnVisible fired"" must increase by 1."
            Font: =Font.'Segoe UI'
            Size: =16
            Color: =RGBA(32, 38, 45, 1)
            X: =16
            Y: =16
            Width: =700
            Height: =40
      - btnRrBBack:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="back to the probe"
            Fill: =RGBA(20, 122, 84, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderThickness: =0
            Font: =Font.'Segoe UI'
            Size: =13
            X: =16
            Y: =68
            Width: =260
            Height: =40
            OnSelect: =Navigate( scrProbeRerun )
