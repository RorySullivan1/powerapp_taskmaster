# =============================================================================
# scrProbe-date-null-delegation — does `dateColumn = Blank()` delegate to SharePoint?
#
# Issue #35. scrReports collects EVERY live completed task and bounds the report
# window locally, because task_date_completion is optional and `>= gRptFrom` is
# FALSE for a blank date — a bare server-side bound would silently drop every
# dateless completed task from Done and the medians.
#
# That reasoning rules out a bare `>=`. It does NOT rule out a bound that keeps
# the blanks:
#
#     task_stage.Value = "Completed"
#  && ( task_date_completion >= gPbCutoff || task_date_completion = Blank() )
#
# `= Blank()` delegates for several SharePoint column types where `IsBlank()`
# never does. Whether a DateTime column's null test folds into the query is the
# open question, and it decides the issue outright: if it folds, the heaviest of
# the five report fetches gets bounded; if it does not, the current shape is
# already optimal and #35 closes as won't-fix with this probe as the evidence.
#
# BREAKS RULE 1 ON PURPOSE, like scrProbe-junction-write. Rule 1 says a probe
# names no data source, so a null result cannot be confused with the app being
# wrong. Here the connector's delegation table IS the claim. Every other rule is
# kept: no gTheme, no component, literal colours, one claim, sub-cases separated,
# positive AND negative controls each with their own instrument, result recorded.
#
# WHY THERE ARE TWO INSTRUMENTS, AND WHY THE FIRST ONE IS THE REAL ONE.
# Delegation is invisible below the data row limit: on a small list a
# non-delegating query returns exactly the right rows. Counts therefore CANNOT
# settle this on their own. The primary reading is Studio's own delegation
# warning, one per label, which is static and needs no data at all. The
# row-limit-1 count is corroboration, not the verdict.
#
# BEFORE PASTING: taskmaster_tasks must be in the Data pane. `LiveTasks` is an
# App named formula and already exists app-wide — sub-case D tests it precisely
# because scrReports filters LiveTasks rather than the data source, and this repo
# has already been burned once by a named formula behaving differently
# (ShowColumns over one reads text columns back as an ERROR type).
# =============================================================================
Screens:
  scrProbeDateNull:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
    Children:
      - lblPdnTitle:
          Control: Label@2.5.1
          Properties:
            # Block scalar, NOT an inline one: YAML treats " #" in a plain scalar as the
            # start of a comment and would eat the rest of the string, quote included.
            Text: |
              ="Date-null delegation probe  ·  issue #35"
            Font: =Font.'Segoe UI'
            Size: =20
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(32, 38, 45, 1)
            X: =16
            Y: =16
            Width: =860
            Height: =28
      - lblPdnHow:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="READ THE WARNINGS FIRST — that is the actual experiment, and it needs no data.
              Click each of the five count labels below and look at its formula bar and the
              App checker. A blue-underlined clause is a clause SharePoint would not take.
              A must be clean and B must warn; if either is wrong, Studio is not flagging
              what it claims to flag and NOTHING else on this screen is readable.

              THEN, optionally, corroborate with counts: set Settings > General > Data row
              limit to 1, press SET CUTOFF, and read the numbers. A delegable filter still
              finds a matching row (1); a non-delegable one downloads one row and tests it
              locally, so it usually shows 0. PUT THE LIMIT BACK TO 2000 AFTERWARDS — and
              remember gDataRowLimit in App.OnStart must match whatever it ends on."
            Font: =Font.'Segoe UI'
            Size: =13
            Color: =RGBA(110, 120, 130, 1)
            X: =16
            Y: =52
            Width: =860
            Height: =190
      - btnPdnCutoff:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="SET CUTOFF  (today − 90 days)"
            Fill: =RGBA(0, 90, 158, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderThickness: =0
            Font: =Font.'Segoe UI'
            Size: =14
            # The cutoff is a GLOBAL, not an inline DateAdd, so the sub-cases below carry the
            # same shape scrReports does — it filters on gRptFrom. A literal date inline is a
            # different expression and could be folded differently.
            OnSelect: |
              =Set( gPbCutoff, DateAdd( Today(), -90, TimeUnit.Days ) )
            X: =16
            Y: =254
            Width: =260
            Height: =40
      - lblPdnCutoff:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="cutoff = " & If( IsBlank(gPbCutoff), "(not set)", Text(gPbCutoff) )
            Font: =Font.'Segoe UI'
            Size: =13
            Color: =RGBA(110, 120, 130, 1)
            X: =288
            Y: =254
            Width: =300
            Height: =40
            VerticalAlign: =VerticalAlign.Middle

      # ---- A · POSITIVE CONTROL -------------------------------------------------
      # `=` on an indexed Choice column. This is the shape scrReports already relies on
      # and it MUST come back with no warning. Its own label, its own count: a control
      # that shares an instrument with the thing measured makes the run unreadable.
      - lblPdnA:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="A · control, delegable      expect NO warning      rows: "
              & CountRows( Filter( taskmaster_tasks,
                                   task_stage.Value = "Completed" ) )
            Font: =Font.'Segoe UI'
            Size: =14
            Color: =RGBA(49, 130, 93, 1)
            X: =16
            Y: =310
            Width: =860
            Height: =32

      # ---- B · NEGATIVE CONTROL -------------------------------------------------
      # Len() has no row in the connector's delegable table at all, so this MUST warn.
      # Without it, "A is clean" could mean Studio is flagging nothing whatsoever.
      - lblPdnB:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="B · control, NOT delegable  expect A WARNING      rows: "
              & CountRows( Filter( taskmaster_tasks,
                                   Len(task_name) > 3 ) )
            Font: =Font.'Segoe UI'
            Size: =14
            Color: =RGBA(197, 58, 58, 1)
            X: =16
            Y: =346
            Width: =860
            Height: =32

      # ---- C · THE NULL TEST ALONE ----------------------------------------------
      # Isolated so a warning on D or E can be attributed. If C warns, `= Blank()` on a
      # DateTime column is the answer on its own and the issue closes won't-fix.
      - lblPdnC:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="C · task_date_completion = Blank() alone            rows: "
              & CountRows( Filter( taskmaster_tasks,
                                   task_date_completion = Blank() ) )
            Font: =Font.'Segoe UI'
            Size: =14
            Color: =RGBA(32, 38, 45, 1)
            X: =16
            Y: =382
            Width: =860
            Height: =32

      # ---- D · THE CLAIM, OVER THE DATA SOURCE ----------------------------------
      # The whole proposed predicate. An Or-arm is the classic way a filter loses
      # delegation for its OTHER arms too, so this can warn even if C does not.
      - lblPdnD:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="D · full predicate over taskmaster_tasks           rows: "
              & CountRows( Filter( taskmaster_tasks,
                                   task_stage.Value = "Completed"
                                && ( task_date_completion >= gPbCutoff
                                  || task_date_completion = Blank() ) ) )
            Font: =Font.'Segoe UI'
            Size: =14
            Color: =RGBA(32, 38, 45, 1)
            X: =16
            Y: =418
            Width: =860
            Height: =32

      # ---- E · THE CLAIM, OVER THE NAMED FORMULA -------------------------------
      # THIS is the one #35 would actually ship: scrReports filters LiveTasks, not the
      # data source. D and E disagreeing is a result in itself, and this repo has seen
      # a named formula change behaviour before.
      - lblPdnE:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="E · full predicate over LiveTasks  (the shipping shape)  rows: "
              & CountRows( Filter( LiveTasks,
                                   task_stage.Value = "Completed"
                                && ( task_date_completion >= gPbCutoff
                                  || task_date_completion = Blank() ) ) )
            Font: =Font.'Segoe UI'
            Size: =14
            Color: =RGBA(32, 38, 45, 1)
            X: =16
            Y: =454
            Width: =860
            Height: =32

      # ---- F · WHAT #35 IS TRYING TO AVOID --------------------------------------
      # Today's shape, for scale: how many rows the unbounded fetch carries versus how
      # many the window actually keeps. If these are close, #35 buys little even if the
      # bound delegates — which is worth knowing before authoring anything.
      - lblPdnF:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="F · today's unbounded fetch: "
              & CountRows( Filter( LiveTasks, task_stage.Value = "Completed" ) )
              & "   ·   of those, inside the window or dateless: "
              & CountRows( Filter( LiveTasks,
                                   task_stage.Value = "Completed"
                                && ( task_date_completion >= gPbCutoff
                                  || IsBlank(task_date_completion) ) ) )
            Font: =Font.'Segoe UI'
            Size: =14
            Color: =RGBA(110, 120, 130, 1)
            X: =16
            Y: =490
            Width: =860
            Height: =32
