# =============================================================================
# scrProbeCT — CLAIM 1 of issue #67 (epic #66): will a component's Table Input
# accept the DELEGABLE QUERY ITSELF at the instance, or only a materialised
# projection?
#
# This is the question the whole of #66 turns on. galProjects is direct-bound
# today and pages in 100s past the data row limit; a component fed by ForAll
# materialises AT that limit and drops the newest rows in silence, which is the
# exact defect class the 2,000-row backfill already exposed once. If the query
# can cross the component boundary intact, cmpProjectTable can BE the table. If
# it cannot, the gallery stays on the screen and the component is only the
# header -- a different epic, and one worth knowing about before it is built.
#
# ------------------------------------------------- FOUR INSTANCES, NOT ONE
# EVERY CANDIDATE IS CARRIED BY THE PASTE. An earlier draft left the inputs
# unset and had them typed into the formula bar one at a time, on the reasoning
# that a rejected formula would otherwise take the whole screen down. FOUR
# INSTANCES BUY THAT ISOLATION BACK WITHOUT THE TYPING: each holds ONE property,
# they differ in nothing else, and hand-copying four long formulas across the
# gap is four chances to introduce a typo that reads exactly like a rejection.
#
#   A   RowsFlat  =  the query, flat literal schema
#   B   RowsRich  =  the query, literal shaped like a real SharePoint record
#   C   RowsCtl   =  a ForAll projection            POSITIVE CONTROL
#   D   RowsFlat  =  ShowColumns over the query     BONUS, NOT IN #67
#
# IF THE WHOLE PASTE IS REFUSED, split it: paste ONE instance block and its
# header at a time, C first. The four blocks are independent list items and
# nothing references anything in another, so deleting three of them leaves a
# valid screen. A refusal that survives on its own IS that candidate's answer.
#
# D is here because it is the only candidate that could give BOTH an exact
# schema and a live query: ShowColumns narrows columns without projecting rows.
# An accepted D proves nothing on its own -- it earns a row in claim 2 and is
# settled there, not here.
#
# EACH INSTANCE PRINTS ALL THREE READOUTS AND SETS ONE. The two it does not set
# fall back to their Default literal, whose only row has an empty project_name,
# so they read "-- no rows --". A name therefore appears on exactly the line
# the instance is testing, and appearing anywhere else means the paste put a
# formula on the wrong property.
#
# "a" is an arbitrary prefix and A NO-MATCH IS NOT THE FINDING. It must be
# NON-EMPTY: StartsWith(project_name, "") is rejected outright -- "the query is
# not valid" -- on a plain indexed Text column (scrProbe-startswith-empty,
# 2026-09-04), and using it here would test that instead of this.
#
# AccessAppScope: false DOES NOT BLOCK ANY OF THIS, and it looks as though it
# should. It governs what formulas INSIDE the definition can see. An instance
# property is evaluated in SCREEN scope, so OpenProjects resolves here normally.
# A rejection below is about schema, never about scope.
#
# BREAKS RULE 1 ON PURPOSE: it names a data source and it uses a component,
# because the boundary between the two IS the claim.
#
# BEFORE PASTING
#   1. taskmaster_projects in the Data pane; OpenProjects in App.Formulas.
#   2. cmpProbeTable built -- the three custom properties HAND-TYPED with the
#      Defaults from tests/cmpProbeTable.pa.yaml, then its Children pasted. THE
#      PASTE BELOW SETS RowsFlat, RowsRich AND RowsCtl BY NAME: a property typed
#      under any other spelling fails the paste, and that is not a claim-1
#      result.
#   3. Blank screen named exactly scrProbeCT. Set its Fill in the formula bar;
#      screens are not controls, so that cannot be pasted.
# =============================================================================
Screens:
  scrProbeCT:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
    Children:
      - lblCtTitle:
          Control: Label@2.5.1
          Properties:
            # Block scalar, NOT inline: YAML reads " #" in a plain scalar as a comment
            # and would eat the rest of the line, closing quote included.
            Text: |
              ="Component Table-Input probe  ·  issue #67 claim 1  ·  can the QUERY cross the boundary?"
            Font: =Font.'Segoe UI'
            Size: =20
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(32, 38, 45, 1)
            X: =16
            Y: =12
            Width: =1324
            Height: =28
      - lblCtHow:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="Read P and E FIRST. Then read C -- it is the positive control, and if C cannot show a name, nothing else on this sheet can be read." &
               Char(10) &
               "Each panel sets ONE property and prints all three. A name on the line named in the panel header is a pass; '-- no rows --' there is NOT, and neither is a red error on the instance." &
               Char(10) &
               "If the paste was refused as a whole, paste one panel at a time (C first) and record which candidate survives alone."
            Font: =Font.'Segoe UI'
            Size: =12
            Color: =RGBA(110, 120, 130, 1)
            X: =16
            Y: =46
            Width: =1324
            Height: =48
      # ------------------------------------------------------- SCREEN-SIDE CONTROLS
      # Both of these run OUTSIDE the component. They are what makes a rejection
      # attributable: if the query cannot even be built on the screen, the component
      # boundary is exonerated and the environment is the finding.
      - lblCtPre:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="P   First(OpenProjects) ................................ " &
               IfError( Coalesce( First( OpenProjects ).project_name, "-- empty --" ),
                        "!! ERROR: " & Coalesce( FirstError.Message, "(blank message)" ) )
            Font: =Font.'Segoe UI'
            Size: =13
            Color: =RGBA(49, 130, 93, 1)
            X: =16
            Y: =100
            Width: =1324
            Height: =22
      - lblCtEnv:
          Control: Label@2.5.1
          Properties:
            # The identical query the four panels hand to the component, evaluated on the
            # screen. It must come back clean, and whatever name it prints is the name the
            # panels' readouts should print too.
            Text: |
              ="E   First(Filter(OpenProjects, StartsWith(name,'a')))  ON THE SCREEN ... " &
               IfError( Coalesce( First( Filter( OpenProjects,
                                                 StartsWith( project_name, "a" ) ) ).project_name,
                                  "-- no rows (no error) --" ),
                        "!! ERROR: " & Coalesce( FirstError.Message, "(blank message)" ) )
            Font: =Font.'Segoe UI'
            Size: =13
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(0, 90, 158, 1)
            X: =16
            Y: =124
            Width: =1324
            Height: =22
      # ------------------------------------------------------------------ PANEL A
      - lblCtHeadA:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="A   RowsFlat  =  Filter(OpenProjects, StartsWith(name,'a'))        read the RowsFlat line"
            Font: =Font.'Segoe UI'
            Size: =13
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(0, 90, 158, 1)
            X: =16
            Y: =158
            Width: =650
            Height: =20
      - cmpCtA:
          Control: CanvasComponent
          ComponentName: cmpProbeTable
          Properties:
            RowsFlat: |
              =Filter( OpenProjects, StartsWith( project_name, "a" ) )
            X: =16
            Y: =180
            Width: =650
            Height: =236
      # ------------------------------------------------------------------ PANEL B
      - lblCtHeadB:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="B   RowsRich  =  the same query                                    read RowsRich AND the manager line"
            Font: =Font.'Segoe UI'
            Size: =13
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(0, 90, 158, 1)
            X: =690
            Y: =158
            Width: =650
            Height: =20
      - cmpCtB:
          Control: CanvasComponent
          ComponentName: cmpProbeTable
          Properties:
            # The Person and the Choices are shaped in this input's Default, so B is the
            # candidate that could carry a lead column and a coverage column into the
            # component. A name on the RowsRich line with "-- blank manager --" beneath it
            # is a THIRD outcome, not a pass: rows crossed and the complex halves did not.
            RowsRich: |
              =Filter( OpenProjects, StartsWith( project_name, "a" ) )
            X: =690
            Y: =180
            Width: =650
            Height: =236
      # ------------------------------------------------------------------ PANEL C
      - lblCtHeadC:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="C   RowsCtl   =  ForAll(...) projection        POSITIVE CONTROL   read the RowsCtl line"
            Font: =Font.'Segoe UI'
            Size: =13
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(49, 130, 93, 1)
            X: =16
            Y: =428
            Width: =650
            Height: =20
      - cmpCtC:
          Control: CanvasComponent
          ComponentName: cmpProbeTable
          Properties:
            # THE SHAPE cmpPicker ALREADY SHIPS. It is expected to be accepted, and it is
            # here only so that a rejection of A or B can be attributed to the query rather
            # than to component inputs in general.
            RowsCtl: |
              =ForAll( Filter( OpenProjects, StartsWith( project_name, "a" ) ),
                       { project_name: project_name,
                         project_date_target: project_date_target,
                         project_perc_completion: project_perc_completion } )
            X: =16
            Y: =450
            Width: =650
            Height: =236
      # ------------------------------------------------------------------ PANEL D
      - lblCtHeadD:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="D   RowsFlat  =  ShowColumns(query, 3 cols)    NOT IN #67          read the RowsFlat line"
            Font: =Font.'Segoe UI'
            Size: =13
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(146, 104, 22, 1)
            X: =690
            Y: =428
            Width: =650
            Height: =20
      - cmpCtD:
          Control: CanvasComponent
          ComponentName: cmpProbeTable
          Properties:
            # The only candidate that could give an exact schema AND a live query, since
            # ShowColumns narrows columns without projecting rows. Whether SharePoint folds
            # it is unknown, so an accepted D is a lead, not a result -- claim 2 settles it.
            RowsFlat: |
              =ShowColumns( Filter( OpenProjects, StartsWith( project_name, "a" ) ),
                            project_name, project_date_target, project_perc_completion )
            X: =690
            Y: =450
            Width: =650
            Height: =236
      - lblCtRead:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="HOW TO READ  ·  C rejected or blank -> stop, the sheet is unreadable.   " &
               "A or B showing a name on its own line -> the query crosses intact; cmpProjectTable can be the whole table and the epic takes its FIRST outcome.   " &
               "B showing a name but '-- blank manager --' -> rows crossed, the complex columns did not; a lead column inside the component is off the table.   " &
               "A and B both rejected -> the epic takes its THIRD outcome: the gallery stays on the screen and the component is the header only.   " &
               "Accepted but '-- no rows --' while E prints a name -> record it as its own answer; it is neither a pass nor a clean rejection."
            Font: =Font.'Segoe UI'
            Size: =12
            Color: =RGBA(110, 120, 130, 1)
            X: =16
            Y: =696
            Width: =1324
            Height: =62
