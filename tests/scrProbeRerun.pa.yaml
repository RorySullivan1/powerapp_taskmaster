# =============================================================================
# scrProbeRerun — SCREEN 1 of 2.  Issue #15.
#
# CREATE BOTH BLANK SCREENS BEFORE PASTING EITHER ONE. The two screens navigate
# to each other BY NAME, so the dependency is circular and no paste order fixes
# it. If the partner screen does not exist yet, Navigate() is a compile error
# and the button silently does nothing — which is indistinguishable from a
# negative result. Once both screens exist, paste order does not matter.
#
# ---------------------------------------------------------------------------
# SET BY HAND IN THE FORMULA BAR — screens are not controls, so these two
# properties CANNOT be pasted. Without the OnVisible, every counter reads 0 and
# the whole probe looks like a failure.
#
#   Screen name   scrProbeRerun          (exactly this — the other screen
#                                         navigates to it by name)
#   Fill          RGBA(245, 247, 250, 1)
#   OnVisible     Set( gRrOnVisible, Coalesce(gRrOnVisible, 0) + 1 )
#
# THEN paste everything under `Children:` below onto the screen.
#
# AFTER PASTING, CHECK THE TREE FOR `_1` SUFFIXES on these three:
#   btnRrWorkVis · btnRrWorkTiny · btnRrWorkHidden
# Buttons A/B/C call them BY NAME. A suffix leaves the call dangling, so they
# do nothing for a reason unrelated to the question being asked. Rename any
# that suffixed before running.
# ---------------------------------------------------------------------------
#
# THE CLAIM: a screen can re-run its own setup block in place.
#   A  Select() on a visible button
#   B  Select() on a 1x1 transparent button (Visible := true)
#   C  Select() on a Visible := false button
#   D  Navigate() to the screen you are already on
#   +  round trip via scrProbeRerunB = the positive control
#
# Protocol and how to read each outcome: tests/README.md.
# =============================================================================
Screens:
  scrProbeRerun:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      # Coalesce, not a bare +1: nothing initialises these, because a probe that
      # depended on App.OnStart would be testing App.OnStart.
      OnVisible: |
        =Set( gRrOnVisible, Coalesce(gRrOnVisible, 0) + 1 )
    Children:
      - lblRrTitle:
          Control: Label@2.5.1
          Properties:
            # Block scalar: YAML eats " #" in a plain scalar along with the rest of the line.
            Text: |
              ="Re-run a behaviour block in place  ·  issue #15"
            Font: =Font.'Segoe UI'
            Size: =20
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(32, 38, 45, 1)
            X: =16
            Y: =16
            Width: =700
            Height: =28
      - lblRrHow:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="Run the ROUND TRIP first — it is the positive control. If it does not raise " &
               """OnVisible fired"", stop: the probe cannot see OnVisible and no other result here is readable."
            Font: =Font.'Segoe UI'
            Size: =12
            Color: =RGBA(90, 98, 108, 1)
            X: =16
            Y: =48
            Width: =700
            Height: =40
      # ---- counters --------------------------------------------------------
      - lblRrOnVisible:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="OnVisible fired:  " & Coalesce(gRrOnVisible, 0)
            Font: =Font.'Segoe UI'
            Size: =16
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(32, 38, 45, 1)
            X: =16
            Y: =100
            Width: =340
            Height: =28
      - lblRrWVis:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="A · visible worker:  " & Coalesce(gRrWVis, 0)
            Font: =Font.'Segoe UI'
            Size: =16
            Color: =RGBA(32, 38, 45, 1)
            X: =16
            Y: =132
            Width: =340
            Height: =28
      - lblRrWTiny:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="B · 1x1 transparent worker:  " & Coalesce(gRrWTiny, 0)
            Font: =Font.'Segoe UI'
            Size: =16
            Color: =RGBA(32, 38, 45, 1)
            X: =16
            Y: =164
            Width: =340
            Height: =28
      - lblRrWHidden:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="C · hidden worker:  " & Coalesce(gRrWHidden, 0)
            Font: =Font.'Segoe UI'
            Size: =16
            Color: =RGBA(32, 38, 45, 1)
            X: =16
            Y: =196
            Width: =340
            Height: =28
      # ---- the three workers ----------------------------------------------
      # Identical OnSelect bodies. The ONLY difference between them is how
      # visible they are, which is the whole sub-case.
      - btnRrWorkVis:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="worker A (visible)"
            Fill: =RGBA(225, 229, 235, 1)
            Color: =RGBA(32, 38, 45, 1)
            BorderThickness: =0
            Font: =Font.'Segoe UI'
            Size: =12
            X: =390
            Y: =132
            Width: =160
            Height: =28
            OnSelect: =Set( gRrWVis, Coalesce(gRrWVis, 0) + 1 )
      # 1x1 and transparent, but Visible stays TRUE. This is the shape a real
      # worker control would take on scrProject.
      - btnRrWorkTiny:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Visible: =true
            X: =390
            Y: =164
            Width: =1
            Height: =1
            OnSelect: =Set( gRrWTiny, Coalesce(gRrWTiny, 0) + 1 )
      - btnRrWorkHidden:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Visible: =false
            X: =390
            Y: =196
            Width: =160
            Height: =28
            OnSelect: =Set( gRrWHidden, Coalesce(gRrWHidden, 0) + 1 )
      # ---- the four mechanisms under test ---------------------------------
      - btnRrSelVis:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="A · Select(visible worker)"
            Fill: =RGBA(0, 90, 158, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderThickness: =0
            Font: =Font.'Segoe UI'
            Size: =13
            X: =16
            Y: =248
            Width: =260
            Height: =40
            OnSelect: =Select( btnRrWorkVis )
      - btnRrSelTiny:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="B · Select(1x1 worker)"
            Fill: =RGBA(0, 90, 158, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderThickness: =0
            Font: =Font.'Segoe UI'
            Size: =13
            X: =288
            Y: =248
            Width: =260
            Height: =40
            OnSelect: =Select( btnRrWorkTiny )
      - btnRrSelHidden:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="C · Select(hidden worker)"
            Fill: =RGBA(0, 90, 158, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderThickness: =0
            Font: =Font.'Segoe UI'
            Size: =13
            X: =560
            Y: =248
            Width: =260
            Height: =40
            OnSelect: =Select( btnRrWorkHidden )
      # D. The construct proposed on issue #15, and the reason this probe exists.
      # If this raises "OnVisible fired", self-navigation re-runs OnVisible and the
      # one-line repair is real. If it does nothing, the worker-control result
      # above decides the design instead.
      - btnRrNavSelf:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="D · Navigate(this same screen)"
            Fill: =RGBA(96, 62, 158, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderThickness: =0
            Font: =Font.'Segoe UI'
            Size: =13
            X: =16
            Y: =300
            Width: =260
            Height: =40
            OnSelect: =Navigate( scrProbeRerun )
      # POSITIVE CONTROL. A real screen change and back — OnVisible MUST rise.
      - btnRrRoundTrip:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="POSITIVE CONTROL · round trip"
            Fill: =RGBA(20, 122, 84, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderThickness: =0
            Font: =Font.'Segoe UI'
            Size: =13
            X: =288
            Y: =300
            Width: =260
            Height: =40
            OnSelect: =Navigate( scrProbeRerunB )
      - btnRrReset:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="reset counters"
            Fill: =RGBA(225, 229, 235, 1)
            Color: =RGBA(32, 38, 45, 1)
            BorderThickness: =0
            Font: =Font.'Segoe UI'
            Size: =13
            X: =560
            Y: =300
            Width: =260
            Height: =40
            OnSelect: |
              =Set( gRrOnVisible, 0 );
               Set( gRrWVis, 0 );
               Set( gRrWTiny, 0 );
               Set( gRrWHidden, 0 )
